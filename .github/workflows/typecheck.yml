name: Typecheck

on:
  pull_request:

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    uses: ./.github/workflows/changed-paths.yml
    with:
      patterns: |
        **/*.ts
        **/*.tsx
        **/*.mts
        **/*.cts
        **/*.js
        **/*.jsx
        **/*.mjs
        **/*.cjs
        **/*.d.ts
        **/tsconfig*.json
        **/package.json
        package-lock.json
        scripts/typecheck.mjs
        scripts/lowerer-conventions-baseline.json
        packages/eslint-plugin-sparkdown-grammar/baseline.json
        definitions/yaml/**
        packages/sparkdown/language/sparkdown.language-grammar.json
        vscode-sparkdown/language/sparkdown.language-grammar.json
        .github/workflows/typecheck.yml
        .github/workflows/changed-paths.yml
        .github/scripts/changed-paths.mjs

  tsc:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify installed test-suite runner
        run: node scripts/test-suite.test.mjs

      - name: Test the node-name scanner
        run: node --test scripts/check-node-names.test.mjs

      - name: Check grammar node names
        run: npm run check:node-names

      - name: Test the grammar lint rules
        run: node --test packages/eslint-plugin-sparkdown-grammar/src/rules/*.test.ts

      - name: Lint the grammar
        run: npx eslint --max-warnings 0 definitions/yaml/sparkdown.language-grammar.yaml

      - name: Test the lowerer conventions scanner
        run: node --test scripts/check-lowerer-conventions.test.mjs

      - name: Check lowerer conventions
        run: node scripts/check-lowerer-conventions.mjs

      - name: Typecheck
        run: npm run typecheck -- --jobs 2

  typecheck:
    needs: [changes, tsc]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate on detection and typecheck result
        env:
          CHANGES: ${{ needs.changes.result }}
          TSC: ${{ needs.tsc.result }}
        run: |
          test "$CHANGES" = "success" || { echo "Change detection did not succeed: $CHANGES"; exit 1; }
          case "$TSC" in
            success) echo "Typecheck passed";;
            skipped) echo "Typecheck skipped: the change touches nothing it covers";;
            *) echo "Typecheck did not pass: $TSC"; exit 1;;
          esac
