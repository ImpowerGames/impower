name: Typecheck

# Runs `tsc --noEmit` over every TypeScript project in the monorepo on pull
# requests.
#
# Nothing else in CI looks at types. "Build VS Code Extension" runs esbuild,
# which strips type annotations without checking them, and it covers only the
# extension; the web editor, the player app and most of `packages/*` are not
# built on a pull request at all. Types were therefore free to break anywhere
# in the tree and reach main, where they surface as a runtime failure instead
# of a review comment.
#
# The project list is derived inside scripts/typecheck.mjs from the tracked
# `tsconfig*.json` files, so a workspace added later is covered without anyone
# remembering to edit this file.
#
# The typecheck job is a required status check, so the workflow has no trigger
# path filter; the `changes` job decides whether it needs to run, and a skipped
# job still satisfies the required check.

on:
  pull_request:

# A superseded PR run is of no interest; keep only the newest per branch.
concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/changed-paths.yml
    with:
      # The node-name check reads both generated grammars and fails when they
      # declare different rules, so a change to their YAML source has to run
      # it too. A regeneration done for one output only is caught that way; a
      # regeneration forgotten entirely leaves both copies stale and agreeing,
      # which nothing here detects.
      patterns: |
        **/*.ts
        **/*.tsx
        **/*.mts
        **/*.cts
        **/*.js
        **/*.jsx
        **/*.mjs
        **/*.cjs
        **/*.d.ts
        **/tsconfig*.json
        **/package.json
        package-lock.json
        scripts/typecheck.mjs
        definitions/yaml/**
        packages/sparkdown/language/sparkdown.language-grammar.json
        vscode-sparkdown/language/sparkdown.language-grammar.json
        .github/workflows/typecheck.yml
        .github/workflows/changed-paths.yml
        .github/scripts/changed-paths.mjs

  typecheck:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Matches the version the other workflows build with.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The sparse tooling matrix exercises process/evidence fixtures without
      # npm. This existing full-install job also exercises the installed engine.
      - name: Verify installed test-suite runner
        run: node scripts/test-suite.test.mjs

      # Grammar node names written as string literals where the type system
      # cannot see them: lookups on untyped lezer nodes, `.getChild("...")`,
      # and comparisons on values typed as plain strings. See the script's
      # header for what it covers and why `tsc` alone is not enough. It runs
      # before the typecheck, which takes minutes, so its findings are not
      # hidden behind a type error elsewhere.
      - name: Test the node-name scanner
        run: node --test scripts/check-node-names.test.mjs

      - name: Check grammar node names
        run: npm run check:node-names

      # Two at a time: each `tsc` holds a whole program in memory and the
      # largest projects here peak above 1 GB, which a standard runner cannot
      # sustain four-wide.
      - name: Typecheck
        run: npm run typecheck -- --jobs 2
