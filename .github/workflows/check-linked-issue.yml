name: Check Linked Issue

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  linked-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /.github/scripts/
            /.agents/repos.json
            /.agents/repos.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the pull request body for a closing reference
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .github/scripts/check-linked-issue.mjs
      - name: Check the pull request body for task-list syntax
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .github/scripts/check-no-tasklist.mjs
