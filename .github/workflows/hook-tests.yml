name: Hook Tests

# Runs every check `git ls-files '.claude/**/*.test.*'` lists on a pull
# request that touches `.claude/**`: the two checks under `.claude/hooks/`
# that guard what agents can do in this repo, and the checks under
# `.claude/skills/` that pin a driver, a cleanup script, or a skill's own
# prose. Bare `node` and `bash`, no `npm install` — the checks are written
# to run that way; `write-regression-test/SKILL.md` documents the same loop
# for a session running it by hand.
#
# This runner has no npm install, so seed-project.test.mjs's zip cases print
# `SKIP: the zip cases need fflate, which the workspace install at the repo
# root provides` — a consequence of that choice, not of the runner's OS. The
# job summary lists every `SKIP:` line this runner prints.
#
# Two checks carry Windows-only assumptions today. clean-worktrees.test.mjs
# gates its rename-probe assertions behind a `skip()` helper on non-Windows,
# though on Linux it currently fails first on an unrelated assertion that
# #505 tracks. state-path.test.mjs has no such gate at all and fails on
# Linux until #508 lands.

on:
  pull_request:
    paths:
      - ".claude/**"
      - "vscode-sparkdown/package.json"
      - ".github/workflows/hook-tests.yml"
  push:
    branches: [main]
    paths:
      - ".claude/**"
      - "vscode-sparkdown/package.json"
      - ".github/workflows/hook-tests.yml"

# A superseded PR run is of no interest; keep only the newest per branch. Do
# not apply this to push runs on main — cancelling one merge's run because
# another landed close behind it would lose that commit's result.
concurrency:
  group: hook-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  standalone-checks:
    runs-on: ubuntu-latest
    # This loop's own PR run took 45s wall on ubuntu-latest (run 34365519578,
    # 2026-09-09), with clean-worktrees.test.mjs failing before it reaches
    # its expensive scratch-git-repository world, so that cost has not yet
    # run here. Revisit this bound once #505 and #508 land and that world
    # runs on every PR; five minutes leaves headroom for a hang instead of
    # relying on nothing timing out at all.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Cone mode only takes whole directories, and driver.test.mjs
          # reads the real vscode-sparkdown/package.json to compute the
          # extension id (drive-vscode-web/driver.mjs's EXT_DIR), so pattern
          # mode names that one file alongside the .claude directory.
          sparse-checkout: |
            .claude
            vscode-sparkdown/package.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run the standalone .claude checks
        shell: bash
        run: |
          set +e
          log="checks.log"
          : > "$log"

          # The number of checks this repo has under .claude/. Raise this
          # when a check is added, so the floor keeps failing an accidental
          # zero-match (a renamed pathspec, a broken sparse checkout) rather
          # than reporting a clean run that found nothing.
          min_checks=13

          sh_checks=()
          while IFS= read -r -d '' t; do sh_checks+=("$t"); done \
            < <(git ls-files -z '.claude/**/*.test.sh')

          mjs_checks=()
          while IFS= read -r -d '' t; do mjs_checks+=("$t"); done \
            < <(git ls-files -z '.claude/**/*.test.mjs')

          expected=$(( ${#sh_checks[@]} + ${#mjs_checks[@]} ))
          ran=0
          failed=0

          for t in "${sh_checks[@]}"; do
            echo "--- $t" | tee -a "$log"
            bash "$t" 2>&1 | tee -a "$log"
            rc=${PIPESTATUS[0]}
            ran=$((ran + 1))
            if [ "$rc" -ne 0 ]; then
              echo "FAILED: $t" | tee -a "$log"
              failed=$((failed + 1))
            fi
          done

          for t in "${mjs_checks[@]}"; do
            echo "--- $t" | tee -a "$log"
            node "$t" 2>&1 | tee -a "$log"
            rc=${PIPESTATUS[0]}
            ran=$((ran + 1))
            if [ "$rc" -ne 0 ]; then
              echo "FAILED: $t" | tee -a "$log"
              failed=$((failed + 1))
            fi
          done

          skipped=$(grep '^SKIP: ' "$log")

          {
            echo "## Standalone \`.claude\` checks"
            echo
            echo "Ran $ran of $expected checks (\`.claude/**/*.test.sh\` + \`.claude/**/*.test.mjs\`)."
            echo
            if [ -n "$skipped" ]; then
              echo "### Skipped on this runner"
              echo
              echo "$skipped" | sed 's/^/- /'
            else
              echo "No cases skipped on this runner."
            fi
            if [ "$failed" -ne 0 ]; then
              echo
              echo "### Failed"
              echo
              grep '^FAILED:' "$log" | sed 's/^/- /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          status=0
          if [ "$failed" -ne 0 ]; then
            echo "$failed check(s) reported FAILED:"
            grep '^FAILED:' "$log"
            status=1
          fi
          if [ "$expected" -lt "$min_checks" ]; then
            echo "Only $expected checks were found (git ls-files), fewer than the $min_checks expected; the pathspec, sparse checkout, or checkout step is broken."
            status=1
          fi
          if [ "$ran" -lt "$expected" ]; then
            echo "Only $ran/$expected checks ran; the loop skipped a check outright."
            status=1
          fi
          exit $status
