name: Hook Tests

on:
  pull_request:
    paths: [".agents/**", ".claude/**", ".codex/**", "scripts/**", "AGENTS.md", "CLAUDE.md", ".gitignore", "package.json", "vscode-sparkdown/package.json", ".github/workflows/hook-tests.yml"]
  push:
    branches: [main]
    paths: [".agents/**", ".claude/**", ".codex/**", "scripts/**", "AGENTS.md", "CLAUDE.md", ".gitignore", "package.json", "vscode-sparkdown/package.json", ".github/workflows/hook-tests.yml"]

concurrency:
  group: hook-tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  standalone-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /.agents/
            /.claude/
            /.codex/
            /scripts/
            /AGENTS.md
            /CLAUDE.md
            /.gitignore
            /package.json
            /vscode-sparkdown/package.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install skills links
        run: node scripts/link-agent-skills.mjs
      - name: Check generated reviewer definitions
        run: node scripts/generate-reviewer-agents.mjs --check
      - name: Run standalone agent tooling checks
        run: node scripts/check-agent-tooling.mjs
