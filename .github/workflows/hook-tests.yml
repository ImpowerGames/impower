name: Hook Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: hook-tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    uses: ./.github/workflows/changed-paths.yml
    with:
      patterns: |
        .agents/**
        .claude/**
        .codex/**
        scripts/**
        AGENTS.md
        CLAUDE.md
        .gitignore
        package.json
        vscode-sparkdown/package.json
        vscode-sparkdown/scripts/f5.mjs
        .vscode/tasks.json
        .github/scripts/**
        .github/ISSUE_TEMPLATE/**
        .github/workflows/test-suite.yml
        .github/workflows/comment-check.yml
        .github/PULL_REQUEST_TEMPLATE.md
        .github/workflows/hook-tests.yml
        .github/workflows/changed-paths.yml

  driver-changes:
    uses: ./.github/workflows/changed-paths.yml
    with:
      patterns: |
        .agents/hooks/**
        .agents/repos.json
        .agents/repos.mjs
        .claude/hooks/**
        .claude/settings.json
        .agents/skills/clean-worktrees/**
        .agents/skills/drive-vscode-web/**
        .agents/skills/drive-web-editor/**
        .agents/skills/review-pr/**
        .claude/agents/**
        .claude/reviewer-defaults.json
        .claude/reviewer-models.json
        .codex/**
        scripts/**
        !scripts/lowerer-conventions-baseline.json
        !scripts/transplant-desktop-sessions.ps1
        .gitignore
        package.json
        vscode-sparkdown/package.json
        vscode-sparkdown/scripts/f5.mjs
        .vscode/tasks.json
        .github/workflows/hook-tests.yml
        .github/workflows/changed-paths.yml

  skills-checks:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 25 || 15 }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /.agents/
            /.claude/
            /.codex/
            /scripts/
            /.github/scripts/
            /.github/ISSUE_TEMPLATE/
            /.github/workflows/
            /.github/PULL_REQUEST_TEMPLATE.md
            /definitions/yaml/
            /impower-dev.cloudbuild.yaml
            /sparkdown-player-app.cloudbuild.yaml
            /packages/concept-generator/src/input/concepts.yaml
            /AGENTS.md
            /CLAUDE.md
            /.gitignore
            /package.json
            /vscode-sparkdown/package.json
            /vscode-sparkdown/scripts/f5.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install skills links
        run: node scripts/link-agent-skills.mjs
      - name: Check generated reviewer definitions
        run: node scripts/generate-reviewer-agents.mjs --check
      - name: Install typescript and yaml so the comment policy check compares its fallback scanners with TypeScript's and the yaml lexer
        if: runner.os == 'Linux'
        run: |
          npm install --prefix "$RUNNER_TEMP/typescript" --no-audit --no-fund --ignore-scripts "typescript@$(node -p "require('./package.json').devDependencies.typescript")" "yaml@$(node -p "require('./package.json').devDependencies.yaml")"
          mkdir -p node_modules
          cp -R "$RUNNER_TEMP/typescript/node_modules/typescript" "$RUNNER_TEMP/typescript/node_modules/yaml" node_modules/
      - name: Run the skills tier of the standalone agent tooling checks
        env:
          COMMENT_POLICY_REQUIRE_TYPESCRIPT: ${{ runner.os == 'Linux' && '1' || '' }}
          COMMENT_POLICY_REQUIRE_YAML: ${{ runner.os == 'Linux' && '1' || '' }}
        run: node scripts/check-agent-tooling.mjs --tier skills

  driver-checks:
    needs: driver-changes
    if: needs.driver-changes.outputs.relevant == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 25 || 15 }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /.agents/
            /.claude/
            /.codex/
            /scripts/
            /.github/scripts/
            /.github/workflows/test-suite.yml
            /.github/workflows/comment-check.yml
            /.github/workflows/hook-tests.yml
            /.github/PULL_REQUEST_TEMPLATE.md
            /AGENTS.md
            /CLAUDE.md
            /.gitignore
            /package.json
            /vscode-sparkdown/package.json
            /vscode-sparkdown/scripts/f5.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install skills links
        run: node scripts/link-agent-skills.mjs
      - name: Confirm Linux supervisor capability
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/test-suite-child-linux.py --check
      - name: Run the drivers tier of the standalone agent tooling checks
        run: node scripts/check-agent-tooling.mjs --tier drivers
      - name: Verify Linux fixture regression control
        if: matrix.os == 'ubuntu-latest'
        shell: node {0}
        run: |
          const fs = require("node:fs");
          const assert = require("node:assert/strict");
          const { spawnSync } = require("node:child_process");
          const file = ".agents/skills/drive-vscode-web/fixture-regression-control.mjs";
          const source = fs.readFileSync(".agents/skills/drive-vscode-web/driver.test.mjs", "utf8");
          const needle = "const FIXTURE_ROOT = path.parse(process.cwd()).root;";
          assert.ok(source.includes(needle), "fixture control must replace the actual root");
          try {
            fs.writeFileSync(file, source.replace(needle, 'const FIXTURE_ROOT = "C:";'));
            const result = spawnSync(process.execPath, [file], { encoding: "utf8", timeout: 60000 });
            process.stdout.write(result.stdout || "");
            process.stderr.write(result.stderr || "");
            assert.equal(result.status, 1, "drive-letter fixture control must fail on Linux");
            assert.match(result.stdout, /FAIL: a folder given with --project/);
            assert.match(result.stdout, /FAIL: up checks the build, then spawns exactly the launch plan/);
            console.log("PASS: restoring drive-letter fixtures reproduces both path failures on Linux");
          } finally {
            if (fs.existsSync(file)) fs.unlinkSync(file);
          }

  vitest-api-integration:
    needs: driver-changes
    if: needs.driver-changes.outputs.relevant == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        vitest: ['2.1.9', '3.2.6']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /.agents/
            /.claude/
            /.codex/
            /scripts/
            /.github/scripts/
            /.github/workflows/test-suite.yml
            /.github/PULL_REQUEST_TEMPLATE.md
            /AGENTS.md
            /CLAUDE.md
            /.gitignore
            /package.json
            /vscode-sparkdown/package.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install skills links
        run: node scripts/link-agent-skills.mjs
      - name: Prepare fresh private matching Vitest and coverage-v8 dependencies
        timeout-minutes: 6
        run: node scripts/fixtures/test-suite-vitest-dependencies.mjs "${{ runner.temp }}" "${{ matrix.vitest }}"
      - name: Require actual configured API and coverage integration
        env:
          IMPOWER_REQUIRE_VITEST_INTEGRATION: '1'
          IMPOWER_TEST_VITEST_VERSION: ${{ matrix.vitest }}
        run: node scripts/check-agent-tooling.mjs --only scripts/test-suite-api-integration.test.mjs
      - name: Retain admitted dependency and actual API evidence
        if: always() && env.IMPOWER_TEST_VITEST_DEPENDENCIES != ''
        uses: actions/upload-artifact@v4
        with:
          name: vitest-api-evidence-${{ matrix.os }}-${{ matrix.vitest }}
          include-hidden-files: true
          path: |
            ${{ env.IMPOWER_TEST_VITEST_DEPENDENCIES }}/package.json
            ${{ env.IMPOWER_TEST_VITEST_DEPENDENCIES }}/package-lock.json
            ${{ env.IMPOWER_TEST_VITEST_DEPENDENCIES }}/install-*.json
            ${{ env.IMPOWER_TEST_VITEST_DEPENDENCIES }}/install.*.log
            ${{ env.IMPOWER_TEST_VITEST_DEPENDENCIES }}/case-*/.git/public-run*
            ${{ env.IMPOWER_TEST_VITEST_DEPENDENCIES }}/case-*/.git/supervision-*/**
            ${{ env.IMPOWER_TEST_VITEST_DEPENDENCIES }}/case-*/.git/execution/**
            ${{ env.IMPOWER_TEST_VITEST_DEPENDENCIES }}/case-*/.git/native-evidence/**
            ${{ env.IMPOWER_TEST_VITEST_DEPENDENCIES }}/case-*/.git/aggregate-validation/**
            ${{ env.IMPOWER_TEST_VITEST_DEPENDENCIES }}/case-*/.git/markers.jsonl
            ${{ env.IMPOWER_TEST_VITEST_DEPENDENCIES }}/case-*/.git/coverage/coverage-final.json
            ${{ env.IMPOWER_TEST_VITEST_DEPENDENCIES }}/case-*/.git/test-suites/*/run.json
            ${{ env.IMPOWER_TEST_VITEST_DEPENDENCIES }}/case-*/.git/test-suites/*/summary.json
            ${{ env.IMPOWER_TEST_VITEST_DEPENDENCIES }}/case-*/.git/test-suites/*/*/attempt.json
            ${{ env.IMPOWER_TEST_VITEST_DEPENDENCIES }}/case-*/.git/test-suites/*/*/tree-proof.json
            ${{ env.IMPOWER_TEST_VITEST_DEPENDENCIES }}/case-*/.git/test-suites/*/*/prepared.json
            ${{ env.IMPOWER_TEST_VITEST_DEPENDENCIES }}/case-*/.git/test-suites/*/*/vitest.json
            ${{ env.IMPOWER_TEST_VITEST_DEPENDENCIES }}/case-*/.git/test-suites/*/*/selection.json
            ${{ env.IMPOWER_TEST_VITEST_DEPENDENCIES }}/case-*/.git/test-suites/*/*/progress.json
            ${{ env.IMPOWER_TEST_VITEST_DEPENDENCIES }}/case-*/.git/test-suites/*/*/output.log

  hook-tests:
    needs: [changes, driver-changes, skills-checks, driver-checks, vitest-api-integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate on detection and check results
        env:
          CHANGES: ${{ needs.changes.result }}
          DRIVER_CHANGES: ${{ needs.driver-changes.result }}
          SKILLS: ${{ needs.skills-checks.result }}
          DRIVERS: ${{ needs.driver-checks.result }}
          VITEST_API: ${{ needs.vitest-api-integration.result }}
        run: |
          test "$CHANGES" = "success" || { echo "Change detection did not succeed: $CHANGES"; exit 1; }
          test "$DRIVER_CHANGES" = "success" || { echo "Driver change detection did not succeed: $DRIVER_CHANGES"; exit 1; }
          status=0
          case "$SKILLS" in
            success) echo "Skills tier passed on both platforms";;
            skipped) echo "Skills tier skipped: the change touches nothing it covers";;
            *) echo "Skills tier did not pass: $SKILLS"; status=1;;
          esac
          case "$DRIVERS" in
            success) echo "Drivers tier passed on both platforms";;
            skipped) echo "Drivers tier skipped: the change touches nothing it covers";;
            *) echo "Drivers tier did not pass: $DRIVERS"; status=1;;
          esac
          case "$VITEST_API" in
            success) echo "Pinned Vitest API integration passed on both platforms";;
            skipped) echo "Pinned Vitest API integration skipped: the change touches nothing it covers";;
            *) echo "Pinned Vitest API integration did not pass: $VITEST_API"; status=1;;
          esac
          exit "$status"
