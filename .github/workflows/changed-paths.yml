name: Changed Paths

# Reusable job that tells a calling workflow whether the changed files match
# its patterns. Workflows that are required status checks call this instead
# of using a `paths:` trigger filter: a filtered workflow reports nothing when
# the filter excludes the change, and GitHub then leaves the pull request
# blocked waiting for the required check. A job skipped through `if:` still
# reports, as skipped, which GitHub accepts for a required check, so the
# calling workflow gates its real jobs on the `relevant` output.
#
# The file list comes from the API rather than a deep checkout, so the job
# needs only the script and finishes in seconds. A pull request lists its
# files through the paginated pull-request files endpoint; a push compares
# the previous and new commits. Renamed files count under both their old and
# new paths, so moving a file out of a watched tree still runs the jobs. When
# the listing may be incomplete (the compare endpoint stops at 300 files, the
# pull-request endpoint at 3000, and a push from an unknown previous commit
# has no listing) everything counts as relevant, so a truncated list can only
# run jobs, never skip them.

on:
  workflow_call:
    inputs:
      patterns:
        description: One trigger-filter pattern per line, in the syntax `paths:` uses.
        required: true
        type: string
    outputs:
      relevant:
        description: "true when at least one changed file matches a pattern, or when the change list may be incomplete"
        value: ${{ jobs.detect.outputs.relevant }}

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      - name: Checkout the detection script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /.github/scripts/changed-paths.mjs
          sparse-checkout-cone-mode: false

      - name: Compare changed files with the patterns
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PATTERNS: ${{ inputs.patterns }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          records="$RUNNER_TEMP/changed.json"
          list="$RUNNER_TEMP/changed.txt"
          if [ "$EVENT" = "pull_request" ]; then
            # --slurp returns one array per page; flatten them into one list.
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --paginate --slurp \
              | jq '[.[][]]' > "$records"
            limit=3000
          else
            case "$PUSH_BEFORE" in ""|0000000000000000000000000000000000000000)
              echo "No previous commit to compare against; treating every file as relevant"
              echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0;;
            esac
            gh api "repos/$GITHUB_REPOSITORY/compare/$PUSH_BEFORE...$PUSH_HEAD" --jq '.files' > "$records"
            limit=300
          fi
          # One path per line for matching, both names of a rename; the file
          # record count, not the line count, decides whether the listing may
          # be incomplete.
          count=$(jq 'length' "$records")
          jq -r '.[] | .filename, (.previous_filename // empty)' "$records" > "$list"
          mapfile -t patterns < <(printf '%s\n' "$PATTERNS" | sed '/^[[:space:]]*$/d')
          node .github/scripts/changed-paths.mjs --files "$list" --count "$count" --limit "$limit" "${patterns[@]}"
