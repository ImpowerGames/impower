name: Test Suite

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-suite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    uses: ./.github/workflows/changed-paths.yml
    with:
      patterns: |
        packages/**
        impower-dev/**
        definitions/**
        vscode-sparkdown/**
        package.json
        package-lock.json
        .github/workflows/test-suite.yml
        .github/workflows/changed-paths.yml
        .github/scripts/changed-paths.mjs

  vitest:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: impower-dev, shard: 1, shards: 1 }
          - { package: packages/jsonrpc, shard: 1, shards: 1 }
          - { package: packages/opfs-workspace, shard: 1, shards: 1 }
          - { package: packages/spark-editor-protocol, shard: 1, shards: 1 }
          - { package: packages/spark-engine, shard: 1, shards: 2 }
          - { package: packages/spark-engine, shard: 2, shards: 2 }
          - { package: packages/spark-morph, shard: 1, shards: 1 }
          - { package: packages/spark-web-player, shard: 1, shards: 2 }
          - { package: packages/spark-web-player, shard: 2, shards: 2 }
          - { package: packages/sparkdown, shard: 1, shards: 4 }
          - { package: packages/sparkdown, shard: 2, shards: 4 }
          - { package: packages/sparkdown, shard: 3, shards: 4 }
          - { package: packages/sparkdown, shard: 4, shards: 4 }
          - { package: packages/sparkdown-document-views, shard: 1, shards: 1 }
          - { package: packages/sparkdown-language-server, shard: 1, shards: 1 }
          - { package: vscode-sparkdown, shard: 1, shards: 1 }
    name: ${{ matrix.package }}${{ matrix.shards > 1 && format(' ({0}/{1})', matrix.shard, matrix.shards) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Verify generated definition ASTs
        if: matrix.package == 'packages/sparkdown' && matrix.shard == 1
        run: node packages/sparkdown/scripts/buildDefinitionAst.mjs --check

      - name: Run vitest
        working-directory: ${{ matrix.package }}
        env:
          NODE_OPTIONS: --max-old-space-size=1024
          NO_COLOR: 1
          SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
        run: |
          set -o pipefail
          npx vitest run --minWorkers=1 --maxWorkers=2 --reporter=default --shard="$SHARD" 2>&1 | tee "$RUNNER_TEMP/vitest.log"

      # workaround(vitest): a worker killed by the OS can leave vitest exiting 0 with no summary
      - name: Require summary lines
        if: always()
        run: |
          log="$RUNNER_TEMP/vitest.log"
          test -f "$log" || { echo "No vitest log was written"; exit 1; }
          plain=$(sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' "$log")
          files=$(grep -E '^[[:space:]]*Test Files[[:space:]]+.*\([0-9]+\)' <<<"$plain" | tail -n 1)
          tests=$(grep -E '^[[:space:]]*Tests[[:space:]]+.*\([0-9]+\)' <<<"$plain" | tail -n 1)
          test -n "$files" || { echo "Missing 'Test Files' summary line"; exit 1; }
          test -n "$tests" || { echo "Missing 'Tests' summary line"; exit 1; }
          grep -Eq '[[:space:]][1-9][0-9]*[[:space:]]+passed' <<<"$files" || { echo "No test file passed: $files"; exit 1; }
          grep -Eq '[[:space:]][1-9][0-9]*[[:space:]]+passed' <<<"$tests" || { echo "No test passed: $tests"; exit 1; }
          if grep -Eq '[[:space:]][0-9]+[[:space:]]+failed' <<<"$files$tests"; then echo "Failures reported: $files / $tests"; exit 1; fi
          if grep -Eiq 'Worker exited unexpectedly|heap out of memory|Unhandled (Error|Rejection)|Some tests are still running|unhandled error' <<<"$plain"; then echo "Worker crash, unhandled error or partial-result diagnostic in the log"; exit 1; fi

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vitest.log
          if-no-files-found: warn

  luau-corpus-gate:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: Luau corpus gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Run vitest
        working-directory: packages/sparkdown
        env:
          NODE_OPTIONS: --max-old-space-size=1024
          NO_COLOR: 1
        run: |
          set -o pipefail
          npx vitest run --minWorkers=1 --maxWorkers=2 --reporter=default src/tests/compiler/luauCorpusGate.test.ts src/tests/compiler/luauSyntaxAgreement.test.ts 2>&1 | tee "$RUNNER_TEMP/vitest.log"

      - name: Require summary lines
        if: always()
        run: |
          log="$RUNNER_TEMP/vitest.log"
          test -f "$log" || { echo "No vitest log was written"; exit 1; }
          plain=$(sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' "$log")
          files=$(grep -E '^[[:space:]]*Test Files[[:space:]]+.*\([0-9]+\)' <<<"$plain" | tail -n 1)
          tests=$(grep -E '^[[:space:]]*Tests[[:space:]]+.*\([0-9]+\)' <<<"$plain" | tail -n 1)
          test -n "$files" || { echo "Missing 'Test Files' summary line"; exit 1; }
          test -n "$tests" || { echo "Missing 'Tests' summary line"; exit 1; }
          grep -Eq '[[:space:]][1-9][0-9]*[[:space:]]+passed' <<<"$files" || { echo "No test file passed: $files"; exit 1; }
          grep -Eq '[[:space:]][1-9][0-9]*[[:space:]]+passed' <<<"$tests" || { echo "No test passed: $tests"; exit 1; }
          if grep -Eq '[[:space:]][0-9]+[[:space:]]+failed' <<<"$files$tests"; then echo "Failures reported: $files / $tests"; exit 1; fi
          if grep -Eiq 'Worker exited unexpectedly|heap out of memory|Unhandled (Error|Rejection)|Some tests are still running|unhandled error' <<<"$plain"; then echo "Worker crash, unhandled error or partial-result diagnostic in the log"; exit 1; fi

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-luau-corpus-gate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vitest.log
          if-no-files-found: warn

  test-suite:
    needs: [changes, vitest, luau-corpus-gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate on detection and package results
        env:
          CHANGES: ${{ needs.changes.result }}
          VITEST: ${{ needs.vitest.result }}
          CORPUS: ${{ needs.luau-corpus-gate.result }}
        run: |
          test "$CHANGES" = "success" || { echo "Change detection did not succeed: $CHANGES"; exit 1; }
          case "$VITEST" in
            success) echo "Package suites passed";;
            skipped) echo "Package suites skipped: the change touches nothing they cover";;
            *) echo "Package suites did not pass: $VITEST"; exit 1;;
          esac
          test "$CORPUS" = "$VITEST" || { echo "The Luau corpus gate ($CORPUS) and the package suites ($VITEST) must both pass or both be skipped"; exit 1; }
          echo "Luau corpus gate: $CORPUS"
