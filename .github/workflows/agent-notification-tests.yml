name: Agent Notification Tests

# The notifier-tests jobs are required status checks, so the workflow has no
# trigger path filter; the `changes` job decides whether they need to run, and
# a skipped job still satisfies the required check.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/changed-paths.yml
    with:
      patterns: |
        scripts/agent-notification-alerts/**
        .github/workflows/agent-notification-tests.yml
        .github/workflows/changed-paths.yml

  notifier-tests:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        working-directory: scripts/agent-notification-alerts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/agent-notification-alerts/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
