name: Agent Notification Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    uses: ./.github/workflows/changed-paths.yml
    with:
      patterns: |
        scripts/agent-notification-alerts/**
        scripts/detached-launch.mjs
        .github/workflows/agent-notification-tests.yml
        .github/workflows/changed-paths.yml

  notifier:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        working-directory: scripts/agent-notification-alerts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/agent-notification-alerts/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test

  notifier-tests:
    needs: [changes, notifier]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate on detection and test results
        env:
          CHANGES: ${{ needs.changes.result }}
          TESTS: ${{ needs.notifier.result }}
        run: |
          test "$CHANGES" = "success" || { echo "Change detection did not succeed: $CHANGES"; exit 1; }
          case "$TESTS" in
            success) echo "Notifier tests passed on both platforms";;
            skipped) echo "Notifier tests skipped: the change touches nothing they cover";;
            *) echo "Notifier tests did not pass: $TESTS"; exit 1;;
          esac
