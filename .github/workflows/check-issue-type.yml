name: Check Issue Type

# Comments on any issue that has no issue type (Bug, Feature, or Task) so the
# gap is visible right away. The templates set a type for issues filed from
# the website; this covers issues filed from the command line, where the type
# has to be set in a second step, and issues whose type was removed later.
#
# GitHub has no setting that refuses an untyped issue, so this is a nudge, not
# a gate. Runs when an issue is opened or reopened, and again if its type is
# removed. Posts at most one comment per issue.

on:
  issues:
    types: [opened, reopened, untyped]

permissions:
  issues: write

jobs:
  issue-type:
    if: ${{ github.event.issue.type == null }}
    runs-on: ubuntu-latest
    steps:
      - name: Ask for an issue type
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          MARKER: "<!-- check-issue-type -->"
          # __REPO__ and __ISSUE__ are filled in by the run step below.
          COMMENT: |
            <!-- check-issue-type -->
            This issue has no type. Every ticket here carries one of Bug, Feature, or Task, which is how the tracker is filtered and how the templates under `.github/ISSUE_TEMPLATE/` are chosen.

            Set it from the type picker in the sidebar, or from the command line:

            ```sh
            gh api -X PATCH "repos/__REPO__/issues/__ISSUE__" -f type=Bug   # or Feature, or Task
            ```

            ---
            _Posted by the Check Issue Type workflow_
        run: |
          if gh issue view "$ISSUE" --json comments --jq '.comments[].body' | grep -qF "$MARKER"; then
            echo "already commented on #$ISSUE"
            exit 0
          fi
          printf '%s\n' "$COMMENT" | sed "s|__REPO__|$GH_REPO|g; s|__ISSUE__|$ISSUE|g" | gh issue comment "$ISSUE" --body-file -
