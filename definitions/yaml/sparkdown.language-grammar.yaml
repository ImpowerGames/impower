variables:
  DISPLAY_CHAIN_SEPARATOR: (?:$|{{WS}}+)
  # lookaround: SparkdownBlockComment and SparkdownInlineComment read a comment
  # as one unit, so the text that ActionLineChain, LineChain and the chain ends
  # of ActionLineEnd and LineEnd read before a chain mark stops at a comment
  # opener, and a `\` inside a comment never chains. These rules decide the
  # chain at the line's end, where a capture cannot let a comment claim its span
  # first; DivertUnknown stops there for the same comments.
  STORY_TEXT_OUTSIDE_COMMENT: (?:(?!{{STORY_COMMENT_START}})[^\r\n])
  STORY_TEXT_UNIT: (?:{{CHOICE_PLAIN_INTERPOLATION}}|{{STORY_TEXT_OUTSIDE_COMMENT}})
  # lookaround: Annotation's Tag reads a tag from its first marker to the line's
  # end, comment openers included, so the chain text before a tag stops at the
  # first tag marker and DISPLAY_CHAIN_TAG takes the rest once. Letting the text
  # run past a marker would let each tag start at many places, and a line of
  # tags with no chain mark would take exponential time to refuse. For the same
  # reason a character never starts what CHOICE_PLAIN_INTERPOLATION takes whole.
  DISPLAY_CHAIN_TEXT_BEFORE_TAG: (?:{{CHOICE_PLAIN_INTERPOLATION}}|(?!{{STORY_COMMENT_START}}|{{TAG_START}}|{{CHOICE_PLAIN_INTERPOLATION}})[^\r\n])
  DISPLAY_CHAIN_TAG: (?:{{TAG_START}}[^\r\n]*?)
  DISPLAY_CHAIN_TEXT: (?:{{DISPLAY_CHAIN_TEXT_BEFORE_TAG}}*?{{DISPLAY_CHAIN_TAG}}?)
  # lookaround: Annotation's Tag reads a tag to the line's end, comment openers
  # and a chain mark included, so ActionLineEnd and LineEnd end before it
  # (EOL); a tag that ends in a chain mark is the chain's text, which
  # ActionLineChainTail and LineChainTail read. Only the rest of the line tells
  # the two tags apart, and the end is tried before the tail at every position.
  DISPLAY_CHAIN_TAG_TAIL: (?:{{WS}}*{{DISPLAY_CHAIN_TAG}}{{DISPLAY_CHAIN_MARK}}{{DISPLAY_CHAIN_COMMENTS}}{{EOL}})
  # lookaround: SparkdownBlockComment and SparkdownInlineComment take the
  # whitespace before them, as an inline comment drops it everywhere; `Chain`
  # would take it as the chain mark's separator, which leaves a blank line in
  # the chained text. Only the comment after the whitespace tells them apart.
  DISPLAY_CHAIN_COMMENT_AHEAD: (?={{WS}}+(?:{{SPARKDOWN_BLOCK_COMMENT_START}}|{{LINE_COMMENT_MARK}}))
  DISPLAY_CHAIN_MARK: (?:{{CHAIN}}(?:{{DISPLAY_CHAIN_COMMENT_AHEAD}}|{{DISPLAY_CHAIN_SEPARATOR}}))
  BLOCK_COMMENT_CLOSED: (?:{{SPARKDOWN_BLOCK_COMMENT_START}}{{BLOCK_COMMENT_CHARACTER}}*[*][/])
  BLOCK_COMMENT_ON_LINE: (?:{{WS}}*{{BLOCK_COMMENT_CLOSED}})
  LINE_COMMENT_TO_END: (?:{{WS}}*{{LINE_COMMENT_MARK}}[^\r\n]*)
  DISPLAY_CHAIN_COMMENTS: (?:{{BLOCK_COMMENT_ON_LINE}}*{{LINE_COMMENT_TO_END}}?)
  DISPLAY_CHAIN_END: (?:{{WS}}*{{CHAIN}}{{DISPLAY_CHAIN_SEPARATOR}}{{DISPLAY_CHAIN_COMMENTS}}{{EOL}})
  IMAGE_CONTROL_KEYWORDS: ["show", "hide", "animate"]
  IMAGE_CLAUSE_KEYWORDS: ["over", "after", "with", "wait", "ease", "morph"]
  ASSET_VALUE_CLAUSE_KEYWORDS: ["after", "over", "to", "with", "ease", "morph"]
  AUDIO_CONTROL_KEYWORDS: ["play", "stop", "fade", "queue", "await"]
  AUDIO_CLAUSE_KEYWORDS:
    ["over", "after", "to", "loop", "once", "mute", "unmute", "now"]
  LAYOUT_CONTROL_KEYWORDS: ["open", "close", "navigate", "clear"]
  NAVIGATE_CONTROL_KEYWORDS: ["navigate"]
  NAVIGATE_DESTINATION_KEYWORDS: ["to"]
  LOAD_CONTROL_KEYWORDS: ["load"]
  MOVIE_CONTROL_KEYWORDS: ["play"]
  WRITE_CONTROL_KEYWORDS: ["write"]

  FLOW_BEAT_KEYWORDS: ["scene", "branch"]
  # referenced-from: packages/sparkdown-language-server/src/utils/providers/getCompletions.ts
  FLOW_MODULE_KEYWORDS: ["include", "run"]

  SELECTOR_FUNCTION_NAMES: ["has", "not", "is", "where"]
  IDENTIFIER_START_CHAR: '_\p{L}'
  IDENTIFIER_END_CHAR: '0-9_\p{L}-'
  IDENTIFIER_START: "[{{IDENTIFIER_START_CHAR}}]"
  IDENTIFIER_END: "[{{IDENTIFIER_END_CHAR}}]*"
  IDENTIFIER_AT_PART_START: '[@][0-9_\p{L}]'
  IDENTIFIER_AT_PART: (?:{{IDENTIFIER_AT_PART_START}}{{IDENTIFIER_END}})
  IDENTIFIER_GOES_ON: (?:[{{IDENTIFIER_END_CHAR}}]|{{IDENTIFIER_AT_PART_START}})
  # lookaround: a letter, digit or `_`, or an `@` before one, after a word
  # of one of this file's keyword lists makes it part of a longer name
  # (`show@é`, `play_x`), which `IDENTIFIER` reads whole. The generator
  # ends every list in this file here, and a `-` still ends the word.
  # referenced-from: definitions/src/language.ts
  STORY_NAME_END: (?![0-9_\p{L}]|[@][0-9_\p{L}])
  # lookaround: as for `STORY_NAME_END`, before the word (`x@show`), which
  # `IDENTIFIER` reads whole. The generator starts every list in this file
  # here.
  # referenced-from: definitions/src/language.ts
  STORY_NAME_START: (?<![0-9_\p{L}]|[0-9_\p{L}][@])
  # lookaround: a trailing `-` is left to what follows the name: the `--`
  # of a comment (`LuauComment`), or the `-` of an arrow
  # (`DivertMark`) or of an operation (`LuauArithmeticOperation`). The
  # class must take `-` inside a name (`bg-color`), so it cannot refuse it.
  IDENTIFIER: (?:{{IDENTIFIER_START}}{{IDENTIFIER_END}}{{IDENTIFIER_AT_PART}}*(?<![-]))

  TAG_START: (?:[#]+(?=$|{{WS}}))
  DIRECTIVE_SPACE: (?:[ \t])
  DIRECTIVE_SEPARATOR: (?:{{DIRECTIVE_SPACE}}+)
  DIRECTIVE_WORD: (?:[#]*[^ \t\r\n#][^ \t\r\n]*)
  DIRECTIVE_NEXT_WORD: (?:{{DIRECTIVE_SEPARATOR}}{{DIRECTIVE_WORD}})
  DIRECTIVE_NAMES: (?:{{DIRECTIVE_NEXT_WORD}}*?)
  DIRECTIVE_CLAUSE_WORD: (?:{{IMAGE_CLAUSE_KEYWORDS}}|{{AUDIO_CLAUSE_KEYWORDS}})
  DIRECTIVE_FIRST_CLAUSES: (?:{{DIRECTIVE_CLAUSE_WORD}}{{DIRECTIVE_NEXT_WORD}}*)
  DIRECTIVE_LATER_CLAUSES: (?:{{DIRECTIVE_SEPARATOR}}{{DIRECTIVE_FIRST_CLAUSES}})
  DIRECTIVE_DESTINATION: (?:{{NAVIGATE_DESTINATION_KEYWORDS}}{{DIRECTIVE_NEXT_WORD}}?)
  DIRECTIVE_TAG: (?:[#]+(?:{{DIRECTIVE_SEPARATOR}}.*?)?)
  DIRECTIVE_CONTROL: (?:{{IMAGE_CONTROL_KEYWORDS}}|{{AUDIO_CONTROL_KEYWORDS}}|{{LOAD_CONTROL_KEYWORDS}}|{{MOVIE_CONTROL_KEYWORDS}}|{{WRITE_CONTROL_KEYWORDS}})
  IMAGE_DIRECTIVE_CONTROL: (?:{{DIRECTIVE_CONTROL}}|{{LAYOUT_CONTROL_KEYWORDS}})
  DIRECTIVE_NAME_TEXT: (?:[^ \t\r\n+]+)
  ASSET_FILTERS: (?:(?:[:~][^:~+\s]+)+)
  _DIRECTIVE_END_: ({{DIRECTIVE_SPACE}}*)$
  _DIRECTIVE_TAG_AND_END_: (?:({{DIRECTIVE_SEPARATOR}}{{DIRECTIVE_TAG}}))?{{_DIRECTIVE_END_}}
  _DIRECTIVE_NAVIGATE_TO_: ({{DIRECTIVE_SEPARATOR}})({{DIRECTIVE_DESTINATION}})({{DIRECTIVE_NEXT_WORD}}*)
  _DIRECTIVE_NAVIGATE_SCREEN_: ({{DIRECTIVE_SEPARATOR}})({{DIRECTIVE_WORD}})(?:({{DIRECTIVE_SEPARATOR}})({{DIRECTIVE_DESTINATION}}))?({{DIRECTIVE_NEXT_WORD}}*)
  _DIRECTIVE_CONTROLLED_WORDS_: (?:({{DIRECTIVE_SEPARATOR}})({{DIRECTIVE_WORD}}))?({{DIRECTIVE_NAMES}})({{DIRECTIVE_LATER_CLAUSES}}?){{_DIRECTIVE_TAG_AND_END_}}
  NOT_TAG_HASH: (?:[#]+[^#\s])
  # lookaround: ActionLineEnd and LineEnd own a `#x` the line begins with,
  # as display text. The line rules that end here (ImplicitAction,
  # InlineAction, InlineTitle, InlineHeading, InlineTransitional) begin at
  # the line's first non-space character, and a rule's end is tried before
  # its body at every position, so no reordering of the body hands it the
  # `#x` there: the end would close the rule empty where it began and the
  # tokenizer would loop to its empty-match backstop (#1614). This is the
  # parent's own end already, there is no Switch to split, and the text
  # before the run is outside anything `NOT_TAG_HASH` can match. Text is a
  # non-space character other than `.`, with at most the `..` after it: the
  # leading glue a begin takes (`^: ..#x`, `..#x`) is not text. Each
  # alternative has a fixed width, which VS Code's Oniguruma requires.
  NOT_TAG_HASH_AFTER_TEXT: (?<=[^\s.]|[^\s.][.]|[^\s.][.][.])(?={{NOT_TAG_HASH}})
  COMMENT_START: (?:[-][-])
  SPARKDOWN_BLOCK_COMMENT_START: (?:[/][*])
  # lookaround: SparkdownBlockComment's end reads the `*/`. A content token that began before it would take its `*` first, and no ordering lets an end that starts later win.
  BLOCK_COMMENT_CHARACTER: (?:[^*\r\n]|[*](?![/]))
  BREAK_MARK: (?:[>])
  BREAK: (?:{{WS}}*{{BREAK_MARK}}{{WS}}*)
  CHAIN: (?:[\\])
  GLUE: (?:(?<![.])[.][.]{{GLUE_END}})
  GLUE_END: (?={{WS}}*(?:$|{{TAG_START}}|[/]{2}(?:$|{{WS}})|{{SPARKDOWN_BLOCK_COMMENT_START}}|{{BREAK_MARK}}))
  # lookaround: SparkdownInlineComment owns a `//` followed by whitespace or
  # the line end, and SparkdownBlockComment a `/*`. BlockDialogue and
  # InlineDialogue begin at the line's first character and the comment after
  # the display text, so the dialogue begin matches first under every order
  # of DisplayStatements, and a begin that reads to a colon cannot be stopped
  # by any rule's `end:`. The name's character is the variable to tighten: a
  # slash is a name character unless it opens one of those comments.
  DIALOGUE_CHARACTER_NAME_CHARACTER: (?:\\.|[/](?![/](?:$|{{WS}})|[*])|[^{}:/\\\r\n])
  LEADING_GLUE: "(?:[.][.]{{LUAU_SHARED_SINGLE_DOT_GUARD}})"
  # lookaround: `(?!{{INLINE_GLUED_ALTERNATOR_START}})` leaves an opening `..` to LuauSparkdownInlineGluedSequentialAlternatorBlock and LuauSparkdownInlineGluedConditionalAlternatorBlock; GRAMMAR.md §10.1 gives why neither ordering nor `\G` replaces it.
  INLINE_LEADING_GLUE: (?:(?!{{INLINE_GLUED_ALTERNATOR_START}}){{LEADING_GLUE}})
  ALTERNATOR_GLUE: (?:(?<=^|{{WS}})[.][.](?=$|{{WS}}))
  # lookaround: `(?={{LUAU_SHARED_SEQUENTIAL_HEAD}})`, `(?=[|])` and
  # `(?=[(])` repeat those begins' lookaheads, whose comments name the
  # rival (`TextChunk` and `LeadingGlue`) and why no reordering, `end:` or
  # tighter variable replaces them. A different test here would let
  # `INLINE_LEADING_GLUE` take a `..` an alternator opens on, or refuse
  # one no alternator takes.
  INLINE_GLUED_ALTERNATOR_START: "(?:{{WS}}*{{ALTERNATOR_GLUE}}{{WS}}+(?:(?={{LUAU_SHARED_SEQUENTIAL_HEAD}})(?:(?:{{LUAU_SEQUENTIAL_MODIFIER_KEYWORDS}}){{WS}}*)?(?:{{LUAU_SEQUENTIAL_ALTERNATOR_KEYWORDS}})?{{WS}}*(?=[|])|{{LUAU_SHARED_CONDITIONAL_ALTERNATOR_HEAD}}{{WS}}*(?=[(])))"

  NL: (?:\r\n|\r|\n)
  WS: (?:[^\S\n\r])
  WORD: (?:[\p{L}\p{N}\p{Mn}]+)
  EOL: "(?:$|{{WS}}*$|{{WS}}*{{TAG_START}}.*$)"
  EOK: "(?:$|{{WS}}+|(?=[:]|{{TAG_START}}|{{COMMENT_START}}))"

  BEAT: (?:^{{WS}}*{{FLOW_BEAT_KEYWORDS}}{{EOK}}(?!{{WS}}*{{LUAU_ASSIGNMENT_OPERATORS}}))
  # lookaround: LuauLogicalOperator and the if expression's `then` and `else`
  # read a reserved word after the name `scene` or `branch` in a function's
  # brackets. A header's name is never a reserved word, and the bracket's
  # `end:` that uses this cannot leave the word to a child rule by order.
  NAMED_BEAT: (?:^{{WS}}*{{FLOW_BEAT_KEYWORDS}}{{WS}}+(?!{{LUAU_KEYWORD}}){{IDENTIFIER_START}})
  END: (?:{{WS}}*(?:end){{LUAU_NAME_END}})
  AFTER_LUAU_GLUEABLE_OPERAND: (?<={{LUAU_GLUEABLE_OPERAND_END}})
  # lookaround: `LuauComment` reads a comment to its line's end and leaves the
  # then arm open there, so the arm's patterns meet the position after its
  # last word; only the line before that position tells code from comment.
  # The rule that would claim the position first, the arm's own `then`, has
  # already been taken by the condition, so no ordering of the arm's patterns
  # can tell the two apart. A `--` inside a string before the `then` also
  # stops it, and the line then reads as it did before `LuauThenNextLineArm`.
  AFTER_LUAU_GLUED_THEN: (?<={{LUAU_GLUED_THEN_BEHIND}})(?<!{{LUAU_COMMENT_START}}.*)
  CHOICE_CONDITION_LONG_BRACKET: (?:\[{{LUAU_ANY_LEVEL_BLOCK_COMMENT_REST}})
  CHOICE_CONDITION_BLOCK_COMMENT: (?:{{LUAU_COMMENT_START}}{{CHOICE_CONDITION_LONG_BRACKET}})
  CHOICE_CONDITION_TABLE: (?:[{]{{LUAU_INTERPOLATION_TEXT_ON_LINE}}*[}])
  CHOICE_CONDITION_INTERPOLATION: (?:[{](?:{{LUAU_INTERPOLATION_TEXT_ON_LINE}}|{{CHOICE_CONDITION_TABLE}})*[}])
  CHOICE_CONDITION_BACKTICK_TEXT: (?:{{LUAU_ESCAPE_ON_LINE}}|{{CHOICE_CONDITION_INTERPOLATION}}|[^`{\\\r\n])
  CHOICE_CONDITION_BACKTICK_STRING: (?:`{{CHOICE_CONDITION_BACKTICK_TEXT}}*`)
  # lookaround: CHOICE_CONDITION_LONG_BRACKET and CHOICE_CONDITION_BLOCK_COMMENT
  # read a long bracket or block comment whole. A `[` or `-` that opens one
  # must not also be one plain character, or a condition that cannot match
  # retries every split of them, and past Oniguruma's retry limit the whole
  # `Choice` begin fails.
  CHOICE_CONDITION_PLAIN_CHAR: (?:[^()"'`\[\r\n-]|\[(?!=*\[)|-(?!-\[=*\[))
  CHOICE_CONDITION_ATOM: (?:{{LUAU_DOUBLE_QUOTED_STRING_ON_LINE}}|{{LUAU_SINGLE_QUOTED_STRING_ON_LINE}}|{{CHOICE_CONDITION_BACKTICK_STRING}}|{{CHOICE_CONDITION_BLOCK_COMMENT}}|{{CHOICE_CONDITION_LONG_BRACKET}}|{{CHOICE_CONDITION_PLAIN_CHAR}})
  CHOICE_CONDITION_PARENS_1: (?:[(]{{CHOICE_CONDITION_ATOM}}*[)])
  CHOICE_CONDITION_PARENS_2: (?:[(](?:{{CHOICE_CONDITION_ATOM}}|{{CHOICE_CONDITION_PARENS_1}})*[)])
  CHOICE_CONDITION_PARENS_3: (?:[(](?:{{CHOICE_CONDITION_ATOM}}|{{CHOICE_CONDITION_PARENS_2}})*[)])
  CHOICE_CONDITION_PARENS: (?:[(](?:{{CHOICE_CONDITION_ATOM}}|{{CHOICE_CONDITION_PARENS_3}})*[)])
  CHOICE_CONDITION_METHOD: (?:[:]{{LUAU_IDENTIFIER}})
  CHOICE_CONDITION_CALL: (?:{{CHOICE_CONDITION_METHOD}}?{{CHOICE_CONDITION_PARENS}})
  CHOICE_CONDITION_PATH: (?:{{LUAU_NAME_OR_CONSTANT}}(?:[.]{{LUAU_IDENTIFIER}}|{{CHOICE_CONDITION_CALL}})*)
  CHOICE_UNREADABLE_CONDITION_PATH: (?:{{LUAU_IDENTIFIER}}(?:[.:]{{LUAU_IDENTIFIER}})*)
  CHOICE_CLOSURE_ATOM: (?:{{CHOICE_CONDITION_ATOM}}|['])
  CHOICE_CLOSURE_PARENS_1: (?:[(]{{CHOICE_CLOSURE_ATOM}}*[)])
  CHOICE_CLOSURE_PARENS_2: (?:[(](?:{{CHOICE_CLOSURE_ATOM}}|{{CHOICE_CLOSURE_PARENS_1}})*[)])
  CHOICE_CLOSURE_PARENS_3: (?:[(](?:{{CHOICE_CLOSURE_ATOM}}|{{CHOICE_CLOSURE_PARENS_2}})*[)])
  CHOICE_CLOSURE_PARENS: (?:[(](?:{{CHOICE_CLOSURE_ATOM}}|{{CHOICE_CLOSURE_PARENS_3}})*[)])
  # lookaround: `ChoiceStartText` owns a choice line whose call
  # bracket closes, such as `* if friend(s), we go` or `* if you(don't mind),
  # jump`: the `Choice` begin declined it for the punctuation after the
  # bracket or an apostrophe inside it, and it is prose. Only whether the
  # bracket closes tells the two apart, which nothing before the bracket
  # shows: reordering, splitting or an `end:` cannot see it, and the bracket
  # variables are already as tight as a condition allows. The bracket is
  # checked as a condition reads it, except that an apostrophe that opens no
  # string counts as a plain character, so a valid call the bounded reader
  # cannot read still counts as open while a contraction does not.
  CHOICE_UNREADABLE_CONDITION_OPEN: (?:{{CHOICE_UNREADABLE_CONDITION_PATH}}(?:[\[]|(?!{{CHOICE_CLOSURE_PARENS}})[(]))
  # lookaround: `Choice` refuses the spot where a header's begin took its line
  # break and the line's input ends. The label on the next line owns the
  # choice's remaining text, `ChoiceStartText`, and both engines try the `end:`
  # and the patterns once more at that spot, where `(?=$)` would close the
  # choice before the label. Reordering cannot help, since the `end:` is the
  # only rule that matches there (`ChoiceStartText` refuses a line's end).
  # The enclosing
  # `LuauSparkdownChooseBlock` and `SparkdownStatement` have no terminator here
  # to carry, and a begin that left the line break would read the label line as
  # display text. No consumed character marks the spot, so only
  # the anchor with nothing after it does.
  CHOICE_HEADER_LINE_BREAK_TAKEN: (?:\G(?![\s\S]))
  # lookaround: LuauInterpolatedStringExpression reads an unclosed `{` to its
  # capture's end; CHOICE_INTERPOLATION_UNIT refuses it, so it stays text. No
  # `}` follows it, so no later brace on the line is a unit either, and the
  # rules after one never ask again.
  CHOICE_OPEN_BRACE: (?:[{](?![^\r\n]*?[}]))
  # lookaround: ChoiceOnlyText reads a tag to its end (CHOICE_ONLY_TEXT_TAG), so the
  # scan takes a tag only where it runs to that end and the scan splits a line
  # in one way.
  CHOICE_SUPPRESSION_TAG: (?:{{CHOICE_ONLY_TEXT_TAG}}(?={{CHOICE_ONLY_TEXT_END}}))
  # lookaround: ChoiceOnlyText reads a suppression's text up to a `]`, an arrow
  # or the line's end, and readChoiceText reads a `[` that meets no `]` as
  # literal text (ChoiceStartText's). The scan follows ChoiceOnlyText's reading:
  # it reads a tag to ChoiceOnlyText's end as CHOICE_ONLY_TEXT_TAG does, skips an
  # interpolation CHOICE_PLAIN_INTERPOLATION keeps and a block comment closed
  # on the line, and it stops at an arrow, a line comment
  # (SparkdownInlineComment) or the line's end, where the `[` stays text. A tag
  # runs to ChoiceOnlyText's end and a character never starts a tag, so the scan
  # splits a line in one way. It stops at an unclosed brace too, which
  # CHOICE_SUPPRESSION_PAST_BRACE reads once. It takes a code span whole as
  # _CHOICE_SUPPRESSION_CODE_2_ does, so nothing inside one ends the scan.
  CHOICE_SUPPRESSION_SCAN_CHARACTER: (?:(?![{]|\]|{{WS}}*[-][>]|{{STORY_COMMENT_START}}|{{TAG_START}}|[\\`])[^\r\n])
  _CHOICE_SUPPRESSION_SCAN_2_: (?:{{CHOICE_SUPPRESSION_TAG}}|{{CHOICE_PLAIN_INTERPOLATION}}|{{BLOCK_COMMENT_ON_LINE}}|{{CHOICE_SUPPRESSION_ESCAPE}}|{{_CHOICE_SUPPRESSION_CODE_2_}}|{{CHOICE_SUPPRESSION_SCAN_CHARACTER}})
  _CHOICE_SUPPRESSION_SCAN_3_: (?:{{CHOICE_SUPPRESSION_TAG}}|{{CHOICE_PLAIN_INTERPOLATION}}|{{BLOCK_COMMENT_ON_LINE}}|{{CHOICE_SUPPRESSION_ESCAPE}}|{{_CHOICE_SUPPRESSION_CODE_3_}}|{{CHOICE_SUPPRESSION_SCAN_CHARACTER}})
  # lookaround: ChoiceOnlyText reads a code span as Raw does: from a backtick run that
  # no backtick precedes to the next run of exactly its length (RAW_OTHER_RUN), so a
  # `]`, an arrow or a comment opener inside it ends nothing, and a run with no such
  # closer is text (ChoiceSpanMarkText). Only the run gives the closer's length, so
  # each place the scan reads a code span captures the run in a group of its own,
  # numbered by its place in ChoiceSuppression's begin (2 and 3), and refers back to
  # it. The closed reading is refused before the run is read as text, so the two
  # stay disjoint and a later step cannot take a closed span's text apart.
  CHOICE_SUPPRESSION_RUN_TEXT: (?:(?<=[`])[`]+(?![`]))
  # lookaround: as CHOICE_SUPPRESSION_RUN_TEXT.
  CHOICE_SUPPRESSION_OTHER_RUN_2: (?:(?!\2{{BACKTICK_RUN_END}})[`]+(?![`]))
  CHOICE_SUPPRESSION_CODE_BODY_2: (?:(?:{{RAW_CHARACTER}}|{{CHOICE_SUPPRESSION_OTHER_RUN_2}})+)
  # lookaround: as CHOICE_SUPPRESSION_RUN_TEXT.
  CHOICE_SUPPRESSION_CODE_TEXT_2: (?:{{CHOICE_SUPPRESSION_CODE_BODY_2}}\2(?![`]))
  # lookaround: as CHOICE_SUPPRESSION_RUN_TEXT.
  _CHOICE_SUPPRESSION_CODE_2_: (?:(?<![`])([`]+)(?![`])(?:{{CHOICE_SUPPRESSION_CODE_TEXT_2}}|(?!{{CHOICE_SUPPRESSION_CODE_TEXT_2}}))|{{CHOICE_SUPPRESSION_RUN_TEXT}})
  # lookaround: as _CHOICE_SUPPRESSION_CODE_2_, in group 3.
  CHOICE_SUPPRESSION_OTHER_RUN_3: (?:(?!\3{{BACKTICK_RUN_END}})[`]+(?![`]))
  CHOICE_SUPPRESSION_CODE_BODY_3: (?:(?:{{RAW_CHARACTER}}|{{CHOICE_SUPPRESSION_OTHER_RUN_3}})+)
  # lookaround: as _CHOICE_SUPPRESSION_CODE_2_, in group 3.
  CHOICE_SUPPRESSION_CODE_TEXT_3: (?:{{CHOICE_SUPPRESSION_CODE_BODY_3}}\3(?![`]))
  # lookaround: as _CHOICE_SUPPRESSION_CODE_2_, in group 3.
  _CHOICE_SUPPRESSION_CODE_3_: (?:(?<![`])([`]+)(?![`])(?:{{CHOICE_SUPPRESSION_CODE_TEXT_3}}|(?!{{CHOICE_SUPPRESSION_CODE_TEXT_3}}))|{{CHOICE_SUPPRESSION_RUN_TEXT}})
  # lookaround: ChoiceOnlyText's end, which a backslash does not escape. The
  # suppression's text reads a backslash with the character after it
  # (CHOICE_ONLY_TEXT_ESCAPE), so an escaped comment opener, brace or tag
  # marker is text there and the scan reads it the same way.
  CHOICE_SUPPRESSION_ESCAPE: (?:[\\](?:{{CHOICE_ONLY_REGION_CHARACTER}}|\]|(?={{CHOICE_ONLY_TEXT_END}})))
  # lookaround: the same ends as CHOICE_SUPPRESSION_SCAN_CHARACTER, past an unclosed brace
  # (CHOICE_OPEN_BRACE), where no brace is a unit and none needs asking about. A backtick
  # there is text, as CHOICE_ONLY_PAST_OPEN_BRACE reads it: the open interpolation claims
  # the rest of the suppression's text, so no code span starts inside it.
  CHOICE_SUPPRESSION_SCAN_PAST_BRACE: (?:{{CHOICE_SUPPRESSION_TAG}}|{{BLOCK_COMMENT_ON_LINE}}|{{CHOICE_SUPPRESSION_ESCAPE}}|(?!\]|{{WS}}*[-][>]|{{STORY_COMMENT_START}}|{{TAG_START}}|[\\])[^\r\n])
  CHOICE_SUPPRESSION_PAST_BRACE: (?:{{CHOICE_OPEN_BRACE}}{{CHOICE_SUPPRESSION_SCAN_PAST_BRACE}}*)
  # lookaround: SparkdownBlockComment reads a comment opener with no `*/` after
  # it on its line to a later line, and one with a `*/` as BLOCK_COMMENT_ON_LINE.
  # Only the rest of the line tells them apart, and no later opener on the
  # line is closed either.
  BLOCK_COMMENT_RUNS_ON: (?:{{SPARKDOWN_BLOCK_COMMENT_START}}(?!{{BLOCK_COMMENT_CHARACTER}}*[*][/]))
  CHOICE_SUPPRESSION_RUNS_ON: (?:{{WS}}*{{BLOCK_COMMENT_RUNS_ON}})
  # lookaround: ChoiceOnlyText reads the suppression to a `]`, which a comment
  # running on (SparkdownBlockComment) or an interpolation the scan cannot keep
  # (LuauInterpolatedStringExpression, CHOICE_READ_INTERPOLATION) may hide, so
  # the suppression opens there when a `]` follows on the line.
  CHOICE_SUPPRESSION_BRACKET_AHEAD: (?=[^\r\n]*?\])
  CHOICE_SUPPRESSION_CLOSE: (?:\]|{{CHOICE_SUPPRESSION_RUNS_ON}}|{{CHOICE_READ_INTERPOLATION}}{{CHOICE_SUPPRESSION_BRACKET_AHEAD}})
  CHOICE_SUPPRESSION_CLOSE_PAST_BRACE: (?:{{CHOICE_SUPPRESSION_PAST_BRACE}}(?:\]|{{CHOICE_SUPPRESSION_RUNS_ON}}))
  _CHOICE_SUPPRESSION_CLOSES_AT_BRACKET_: (?:{{CHOICE_SUPPRESSION_BRACKET_AHEAD}}{{_CHOICE_SUPPRESSION_SCAN_2_}}*(?:{{CHOICE_SUPPRESSION_CLOSE}}|{{CHOICE_SUPPRESSION_CLOSE_PAST_BRACE}}))
