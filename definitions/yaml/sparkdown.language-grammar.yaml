  ASSIGN_EQUAL_OPERATOR: (?:{{WS}}*[=]{{WS}}*)
  STRUCT_BLOCK_EQUAL: (?:[=]{{WS}}*)
  SPARKLE_ELEMENT_BOUNDARY: (?:[;},:]|$|{{SPARKLE_ELEMENT_NAME}})
