  STRUCT_BLOCK_ITEM_PART: (?:{{STRUCT_BLOCK_QUOTED}}|{{STRUCT_BLOCK_BRACKET}}|{{STRUCT_BLOCK_LONE_BRACKET}}|[^;{},"\n\[])
  STRUCT_BLOCK_COMMENT_IN_VALUE_TO_LINE_END: (?={{STRUCT_BLOCK_COMMENT_IN_VALUE}})[^\n]*
  SPARKLE_SQUOTED: (?:'(?:\\.|[^'\\\n])*')
  SPARKLE_LONE_SQUOTE: (?:'(?!(?:\\.|[^'\\\n])*'))
  SPARKLE_LONE_SQUOTE_RUN: (?:'(?!(?:\\.|[^'\\\n])*')[^\n]*$)
  SPARKLE_BACKTICK_CODE: (?:[^{}`"'\n\[-]|[-](?![-])|[\[](?![=]*[\[])|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\\n])*`|(?:[-][-])?[\[][\[](?:[^\]\n]|[\]](?![\]]))*[\]][\]])
  SPARKLE_BACKTICK_INTERPOLATION: (?:[{](?:{{SPARKLE_BACKTICK_CODE}}|[{](?:{{SPARKLE_BACKTICK_CODE}})*[}])*[}])
  SPARKLE_BACKTICKED: (?:`(?:\\.|[^`\\{\n]|{{SPARKLE_BACKTICK_INTERPOLATION}})*(?:`|$))
  SPARKLE_LONG_BRACKET: (?:[\[][\[](?:[^\]\n]|[\]](?![\]]))*(?:[\]][\]]|$)|[\[][=]{1}[\[](?:[^\]\n]|[\]](?![=]{1}[\]]))*(?:[\]][=]{1}[\]]|$)|[\[][=]{2}[\[](?:[^\]\n]|[\]](?![=]{2}[\]]))*(?:[\]][=]{2}[\]]|$)|[\[][=]{3}[\[](?:[^\]\n]|[\]](?![=]{3}[\]]))*(?:[\]][=]{3}[\]]|$)|[\[][=]{4}[\[](?:[^\]\n]|[\]](?![=]{4}[\]]))*(?:[\]][=]{4}[\]]|$)|[\[][=]{5}[\[](?:[^\]\n]|[\]](?![=]{5}[\]]))*(?:[\]][=]{5}[\]]|$)|[\[][=]{6}[\[](?:[^\]\n]|[\]](?![=]{6}[\]]))*(?:[\]][=]{6}[\]]|$)|[\[][=]{7}[\[](?:[^\]\n]|[\]](?![=]{7}[\]]))*(?:[\]][=]{7}[\]]|$)|[\[][=]{8,}[\[][^\n]*$)
  SPARKLE_LUAU_COMMENT: (?:[-][-](?:{{SPARKLE_LONG_BRACKET}}|(?![\[][=]*[\[])[^\n]*$))
  SPARKLE_CODE_TOKEN: (?:{{STRUCT_BLOCK_QUOTED}}|{{SPARKLE_SQUOTED}}|{{SPARKLE_LONE_SQUOTE_RUN}}|{{SPARKLE_BACKTICKED}}|(?:[-][-])?{{SPARKLE_LONG_BRACKET}}|[-][-](?![\[][=]*[\[])[^\n]*$|[^{}()"'`\n\[-]|[-](?![-])|[\[](?![=]*[\[]))
  SPARKLE_BRACED_PART: (?:{{SPARKLE_CODE_TOKEN}}|[()])
  SPARKLE_BRACED_9: (?:[{][^\n]*$)
  SPARKLE_BRACED_8: (?:[{](?:{{SPARKLE_BRACED_9}}|{{SPARKLE_BRACED_PART}})*(?:[}]|$))
  SPARKLE_BRACED_7: (?:[{](?:{{SPARKLE_BRACED_8}}|{{SPARKLE_BRACED_PART}})*(?:[}]|$))
  SPARKLE_BRACED_6: (?:[{](?:{{SPARKLE_BRACED_7}}|{{SPARKLE_BRACED_PART}})*(?:[}]|$))
  SPARKLE_BRACED_5: (?:[{](?:{{SPARKLE_BRACED_6}}|{{SPARKLE_BRACED_PART}})*(?:[}]|$))
  SPARKLE_BRACED_4: (?:[{](?:{{SPARKLE_BRACED_5}}|{{SPARKLE_BRACED_PART}})*(?:[}]|$))
  SPARKLE_BRACED_3: (?:[{](?:{{SPARKLE_BRACED_4}}|{{SPARKLE_BRACED_PART}})*(?:[}]|$))
  SPARKLE_BRACED_2: (?:[{](?:{{SPARKLE_BRACED_3}}|{{SPARKLE_BRACED_PART}})*(?:[}]|$))
  SPARKLE_BRACED: (?:[{](?:{{SPARKLE_BRACED_2}}|{{SPARKLE_BRACED_PART}})*(?:[}]|$))
  SPARKLE_CLOSED_LONG_BRACKET: (?:[\[][\[](?:[^\]\n]|[\]](?![\]]))*[\]][\]]|[\[][=]{1}[\[](?:[^\]\n]|[\]](?![=]{1}[\]]))*[\]][=]{1}[\]]|[\[][=]{2}[\[](?:[^\]\n]|[\]](?![=]{2}[\]]))*[\]][=]{2}[\]]|[\[][=]{3}[\[](?:[^\]\n]|[\]](?![=]{3}[\]]))*[\]][=]{3}[\]]|[\[][=]{4}[\[](?:[^\]\n]|[\]](?![=]{4}[\]]))*[\]][=]{4}[\]]|[\[][=]{5}[\[](?:[^\]\n]|[\]](?![=]{5}[\]]))*[\]][=]{5}[\]]|[\[][=]{6}[\[](?:[^\]\n]|[\]](?![=]{6}[\]]))*[\]][=]{6}[\]]|[\[][=]{7}[\[](?:[^\]\n]|[\]](?![=]{7}[\]]))*[\]][=]{7}[\]])
  SPARKLE_OPEN_CODE_TOKEN: (?:"(?:\\.|[^"\\\n])*"|{{SPARKLE_SQUOTED}}|`(?:\\.|[^`\\{\n]|{{SPARKLE_BACKTICK_INTERPOLATION}})*`|(?:[-][-])?{{SPARKLE_CLOSED_LONG_BRACKET}}|[-][-](?![\[][=]*[\[])[^\n]*$|[^{}"'`\n\[-]|[-](?![-])|[\[](?![=]*[\[]))
  SPARKLE_OPEN_BRACED_8: (?:[{](?:{{SPARKLE_BRACED_9}}|{{SPARKLE_OPEN_CODE_TOKEN}})*(?:[}]|$))
  SPARKLE_OPEN_BRACED_7: (?:[{](?:{{SPARKLE_OPEN_BRACED_8}}|{{SPARKLE_OPEN_CODE_TOKEN}})*(?:[}]|$))
  SPARKLE_OPEN_BRACED_6: (?:[{](?:{{SPARKLE_OPEN_BRACED_7}}|{{SPARKLE_OPEN_CODE_TOKEN}})*(?:[}]|$))
  SPARKLE_OPEN_BRACED_5: (?:[{](?:{{SPARKLE_OPEN_BRACED_6}}|{{SPARKLE_OPEN_CODE_TOKEN}})*(?:[}]|$))
  SPARKLE_OPEN_BRACED_4: (?:[{](?:{{SPARKLE_OPEN_BRACED_5}}|{{SPARKLE_OPEN_CODE_TOKEN}})*(?:[}]|$))
  SPARKLE_OPEN_BRACED_3: (?:[{](?:{{SPARKLE_OPEN_BRACED_4}}|{{SPARKLE_OPEN_CODE_TOKEN}})*(?:[}]|$))
  SPARKLE_OPEN_BRACED_2: (?:[{](?:{{SPARKLE_OPEN_BRACED_3}}|{{SPARKLE_OPEN_CODE_TOKEN}})*(?:[}]|$))
  SPARKLE_OPEN_BRACED: (?:[{](?:{{SPARKLE_OPEN_BRACED_2}}|{{SPARKLE_OPEN_CODE_TOKEN}})*$)
  SPARKLE_PROP_RUN_TOKEN: (?:{{STRUCT_BLOCK_QUOTED}}|{{SPARKLE_SQUOTED}}|{{SPARKLE_LONE_SQUOTE_RUN}}|{{SPARKLE_BACKTICKED}}|{{SPARKLE_LONG_BRACKET}}|[^(){}"'`\s\[]|[\[])
  SPARKLE_PROP_NAME: (?:[#][^\s=;{}"'(),]*(?![^\s=;{}"'(),]))
  SPARKLE_EVENT_NAME: (?:[@][^\s=;{}"'(),]*(?![^\s=;{}"'(),]))
  SPARKLE_ATTR_NO_VALUE: (?:(?={{WS}}*(?:$|[;}]|[,](?:[\s;}]|$))))
  SPARKLE_VALUE_END: (?![^\s;}",]|[,](?![\s;}]|$))
  SPARKLE_ENTRY_COMMA: (?:[,](?:{{WS}}|$|[;}]))
  SPARKLE_NO_PART_AFTER_WS: (?:{{WS}}|[;{}]|{{SPARKLE_ENTRY_COMMA}}|[=]{{WS}}*[{]|$)
  # lookaround: LuauSparkleElementBlock, LuauSparkleElementAssign and the element's end own the whitespace before a block, an assignment or an entry's end; a paren attribute takes the whitespace after its value only before another part, as the head's whitespace token does.
  _SPARKLE_PAREN_ATTR_END_: (?:({{WS}}+)(?!{{SPARKLE_NO_PART_AFTER_WS}})|(?=[;}"]|{{SPARKLE_ENTRY_COMMA}}|$)|(?={{WS}}+{{SPARKLE_NO_PART_AFTER_WS}}))
  SPARKLE_UNQUOTED_VALUE: (?:(?!{{SPARKLE_SQUOTED}})(?:{{SPARKLE_BACKTICKED}}|{{SPARKLE_LONG_BRACKET}}|[^\s;{}"(,`\[]|[\[](?![=]*[\[])|[,](?![\s;}]|$)|{{SPARKLE_BRACED}})+{{SPARKLE_VALUE_END}})
  SPARKLE_EVENT_UNQUOTED_VALUE: (?:(?!{{SPARKLE_SQUOTED}})(?:{{SPARKLE_BACKTICKED}}|(?:[-][-])?{{SPARKLE_LONG_BRACKET}}|[-][-](?![\[][=]*[\[])[^\n]*$|[^\s;{}"(,`\[-]|[-](?![-])|[\[](?![=]*[\[])|[,](?![\s;}]|$)|{{SPARKLE_BRACED}})+{{SPARKLE_VALUE_END}})
  SPARKLE_ATTR_VALUE: (?:{{STRUCT_BLOCK_QUOTED}}|{{SPARKLE_SQUOTED}}|{{SPARKLE_UNQUOTED_VALUE}})
  SPARKLE_EVENT_VALUE: (?:{{STRUCT_BLOCK_QUOTED}}|{{SPARKLE_SQUOTED}}|{{SPARKLE_EVENT_UNQUOTED_VALUE}})
  SPARKLE_OPEN_ATTR: (?:(?:{{SPARKLE_PROP_NAME}}|{{SPARKLE_EVENT_NAME}}){{WS}}*[=]{{WS}}*{{SPARKLE_OPEN_BRACED}})
  # lookaround: LuauSparkleEventClosureAttribute and LuauSparklePropClosureAttribute own a value whose braces the scan cannot close on its line; LuauSparkleElementParts must leave it to them.
  # Reordering cannot do it: the head is one match that starts at the
  # whitespace before the attribute, ahead of the closure rule's start, so it
  # wins whatever the patterns order. It is a capture with no end for a parent
  # to carry, and a positive closed-on-the-line variable would repeat the
  # eight-level brace chain without its line-end and ninth-level arms.
  SPARKLE_NOT_OPEN_BRACED: (?!{{SPARKLE_OPEN_BRACED}})
  # lookaround: LuauSparkleElementParts owns an attribute whose braces close on its line; a closure attribute opens only where it declines.
  # The closure rules come first in the element's and the continuation's
  # patterns, so where both start at the same `@` or `#` (right after the
  # element's name, or at a continuation line's start) the closure rule would
  # otherwise take a closed value too. The begin cannot consume the brace,
  # which LuauSparkleHandlerClosure and LuauSparklePropClosure open.
  SPARKLE_OPEN_BRACED_AHEAD: (?={{SPARKLE_OPEN_BRACED}})
  # lookaround: LuauSparkleElementParts reads the parts after a closure's brace; a closure attribute ends only where an element's head would, before the next closure attribute, or at SPARKLE_BLOCK_BAIL.
  # The parent element cannot read those parts: its end, `(?<=[}])`, closes
  # it after any `}`, and only this scope knows the brace was a closure's
  # rather than a block's. So the attribute holds the parts and ends at the
  # head's terminators after a non-blank, or before the next open attribute,
  # which the element then reads with its own closure rule.
  SPARKLE_CLOSURE_ATTR_END: (?:(?<![=\s])(?={{WS}}*(?:[;{},]|$|[=]{{WS}}*[{]))|(?={{SPARKLE_OPEN_ATTR}})|(?={{SPARKLE_BLOCK_BAIL}}))
  SPARKLE_ATTR: (?:{{SPARKLE_PROP_NAME}}(?:{{WS}}*[=](?:{{WS}}*{{SPARKLE_NOT_OPEN_BRACED}}{{SPARKLE_ATTR_VALUE}}|{{SPARKLE_ATTR_NO_VALUE}})|(?!{{WS}}*[=]))|{{SPARKLE_EVENT_NAME}}(?:{{WS}}*[=](?:{{WS}}*{{SPARKLE_NOT_OPEN_BRACED}}{{SPARKLE_EVENT_VALUE}}|{{SPARKLE_ATTR_NO_VALUE}})|(?!{{WS}}*[=])))
  SPARKLE_COMMENT: (?:{{SPARKLE_LUAU_COMMENT}}|[/][/](?={{WS}}|$)[^\n]*$)
  SPARKLE_ELEMENT_NAME: (?:{{IDENTIFIER_START}}{{IDENTIFIER_END}}{{IDENTIFIER_AT_PART}}*)
  SPARKLE_CLASS_NAME: (?:[0-9_\p{L}][0-9_\p{L}-]*{{IDENTIFIER_AT_PART}}*)
  SPARKLE_HEAD_TOKEN: (?:{{STRUCT_BLOCK_QUOTED}}|{{SPARKLE_SQUOTED}}|{{SPARKLE_LONE_SQUOTE}}|{{SPARKLE_BACKTICKED}}|{{SPARKLE_ATTR}}|[()]|{{SPARKLE_COMMENT}}|[.]{{SPARKLE_CLASS_NAME}}|[=](?!{{WS}}*[{])|[,](?![\s;}]|$)|{{WS}}+(?!{{SPARKLE_NO_PART_AFTER_WS}}))
  SPARKLE_CONTINUATION_START: (?:{{WS}}*(?!{{STRUCT_BLOCK_PROPERTY_HEAD}}(?!{{WS}}*[{]))[.#@"'])
  SPARKLE_BLOCK_BAIL: (?:{{BEAT}}|^{{WS}}*(?:end|else|elseif|case)(?!{{IDENTIFIER_GOES_ON}}))
  SPARKLE_KEYWORD_END: (?!{{IDENTIFIER_GOES_ON}})
  AFTER_LUAU_VALUE: (?:(?<=(?:[\w)}\]"'`]|\.\.\.|@/{{LUAU_REGEX_BODY}}/){{WS}}*)(?<!{{KEYWORD_START_BEHIND}}(?:and|or|not|local|store|const){{WS}}*))
  AFTER_LUAU_UNCALLABLE_VALUE: (?<=(?:[}"'`]|\]=*\]|\.\.\.|@/{{LUAU_REGEX_BODY}}/[dgimsuvy]*|(?:^|[^\w.])\.?\d[\w.]*|{{KEYWORD_START_BEHIND}}(?:true|false|nil|end)){{WS}}*)
  KEYWORD_START_BEHIND: (?:^|[^\w.@]|(?:^|[^\w])@)
  # lookaround: LuauIfBlock and LuauSparkdownIfBlock own an `if` that begins
  # a statement, and LuauTernaryExpression one that begins a value. Both
  # begin at the `if`, and a body tries the statement rules first, so only
  # what comes before the `if` tells them apart: a token no statement ends
  # with can only be followed by a value. The parent's end cannot carry the
  # choice, and splitting the rules leaves the same `if` to both. A comment
  # between the token and the `if` leaves the token the one the `if` follows.
  AFTER_LUAU_TERNARY_PRECEDING_TOKEN: (?<=^{{WS}}*|{{LUAU_TERNARY_PRECEDING_TOKEN}}{{WS}}*|{{LUAU_TERNARY_PRECEDING_TOKEN}}{{LUAU_PLAIN_BLOCK_COMMENTS}})
  AFTER_ALTERNATOR_ARM_SEPARATOR: (?<=[|]{{WS}}*{{LUAU_ARM_KEY_BEHIND}}?)
  END_DIVERT_CLOSING_ALTERNATOR: '{{WS}}*[-][>]{{WS}}*{{LUAU_END_KEYWORDS}}(?!{{IDENTIFIER_GOES_ON}}){{WS}}*[}]'

patterns:
  - { include: "#EndOfLine" }
  - { include: "#Newline" }

  - { include: "#FrontMatter" }
  - { include: "#Annotation" }

  - { include: "#Include" }
  - { include: "#Run" }

  - { include: "#Scene" }
  - { include: "#Branch" }

  - { include: "#LuauExternalDeclaration" }

  - { include: "#LuauSparkdownExplicitStatement" }
  - { include: "#LuauFunctionAttributes" }
  - { include: "#LuauFunctionDefinition" }
  - { include: "#LuauSparkdownVariableDefinition" }
  - { include: "#LuauDeclarations" }
  - { include: "#LuauSparkdownControlBlock" }
  - { include: "#LuauEndKeyword" }

  - { include: "#SparkdownStatement" }

  - { include: "#Whitespace" }

repository:

  SparkdownStatement:
    patterns:
      - { include: "#Choice" }
      - { include: "#FlowStatements" }
      - { include: "#DisplayStatements" }

  FlowStatements:
    patterns:
      - { include: "#DoneStatement" }
      - { include: "#FinStatement" }
      - { include: "#Divert" }
      - { include: "#Thread" }
      - { include: "#LabelAnchor" }

  DisplayStatements:
    patterns:
      - { include: "#SparkdownBlockComment" }
      - { include: "#SparkdownLineComment" }
      - { include: "#Title" }
      - { include: "#Heading" }
      - { include: "#Transitional" }
      - { include: "#Write" }
      - { include: "#Dialogue" }
      - { include: "#AssetLine" }
      - { include: "#Action" }

  SparkdownLineComment:
    tag: lineComment
    name: comment.line.double-slash.sd
    match: ^({{WS}}*)([/]{2})(?=$|{{WS}})([^\n]*)$
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        name: punctuation.definition.comment.sd
      3:
        name: comment.line.double-slash.content.sd

  SparkdownInlineComment:
    tag: lineComment
    name: comment.line.double-slash.sd
    match: ({{WS}}*)([/]{2})(?=$|{{WS}})([^\r\n]*)
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        name: punctuation.definition.comment.sd
      3:
        name: comment.line.double-slash.content.sd

  SparkdownBlockComment:
    tag: blockComment
    name: comment.block.sd
    begin: ({{WS}}*)({{SPARKDOWN_BLOCK_COMMENT_START}})
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        name: punctuation.definition.comment.begin.sd
    patterns:
      - { include: "#Newline" }
      - { include: "#SparkdownBlockCommentContent" }
    # eslint-disable-next-line sparkdown-grammar/scoped-end-has-bailout
    end: ([*][/])
    endCaptures:
      1:
        name: punctuation.definition.comment.end.sd

  SparkdownBlockCommentContent:
    tag: blockComment
    name: comment.block.content.sd
    match: ({{BLOCK_COMMENT_CHARACTER}}+)

  SparkdownBlockCommentOnLine:
    match: ({{WS}}*{{SPARKDOWN_BLOCK_COMMENT_START}}.*?[*][/])
    captures:
      1:
        patterns:
          - { include: "#SparkdownBlockComment" }

  SparkleTrailingLineComment:
    tag: lineComment
    name: comment.line.double-slash.sd
    match: ({{WS}}*)([/]{2})(?=$|{{WS}})([^\r\n]*)
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        name: punctuation.definition.comment.sd
      3:
        name: comment.line.double-slash.content.sd

  Annotation:
    patterns:
      - { include: "#Tags" }

  Tags:
    tag: docComment
    name: comment.line.sd entity.tag.sd
    begin: ({{WS}}*)(?={{TAG_START}})
    captures:
      1:
        patterns:
          - { include: "#RequiredWhitespace" }
    patterns:
      - { include: "#Tag" }
    end: (?=$)

  Tag:
    tag: docComment
    name: comment.line.sd entity.tag.sd
    match: "({{WS}}*)({{TAG_START}})(.*?){{LUAU_SHARED_TAG_END}}"
    captures:
      1:
        patterns:
          - { include: "#Whitespace" }
      2:
        tag: definition(docComment)
        name: punctuation.definition.comment.sd comment.line.sd entity.tag.begin.sd
      3:
        patterns:
          - { include: "#TagContent" }

  TagContent:
    tag: definition(docComment)
    name: punctuation.definition.comment.content.sd
    begin: (?=.)
    patterns:
      - { include: "#LuauFunctionCallShorthand" }
      - { include: "#LuauInterpolatedStringExpression" }
      - { include: "#TagText" }
    end: (?=$|{{TAG_START}})

  TagText:
    tag: definition(docComment)
    name: punctuation.definition.comment.content.sd
    match: ([^\n{]+?)(?=$|[{]|{{TAG_START}})

  Include:
    tag: meta
    name: meta.import.include.sd
    begin: ^({{WS}}*)(include)({{EOK}})
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#IncludeKeyword" }
      3:
        patterns:
          - { include: "#RequiredWhitespace" }
    patterns:
      - { include: "#Annotation" }
      - { include: "#IncludeContent" }
    end: (?=$)

  IncludeKeyword:
    tag: controlKeyword
    name: keyword.control.definition.include.sd

  IncludeContent:
    tag: invalid
    name: invalid.deprecated.include.sd
    match: (.+?)(?={{EOL}})

  Run:
    tag: meta
    name: meta.import.run.sd
    begin: ^({{WS}}*)(run)({{EOK}})
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#RunKeyword" }
      3:
        patterns:
          - { include: "#RequiredWhitespace" }
    patterns:
      - { include: "#Annotation" }
      - { include: "#RunContent" }
    end: (?=$)

  RunKeyword:
    tag: controlKeyword
    name: keyword.control.definition.run.sd

  RunContent:
    tag: string
    name: string.run.luau.sd
    # lookaround: Annotation owns the EOL tail. Reordering cannot stop a
    # path already being matched; splitting quoted/unquoted paths still
    # needs that boundary, and Run's end must leave annotations in its body.
    match: (?:(".*?"|'.*?')({{WS}}*)|(.+?))(?={{EOL}})
    captures:
      1:
        patterns:
          - { include: "#RunQuotedPath" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
      3:
        patterns:
          - { include: "#RunUnquotedPath" }

  RunQuotedPath:
    match: (?:".*"|'.*')
    tag: string
    name: string.quoted.run.luau.sd

  RunUnquotedPath:
    match: .+
    tag: string
    name: string.unquoted.run.luau.sd

  Break:
    tag: special(content)
    name: meta.break.sd
    match: ({{BREAK}})
    captures:
      1:
        tag: keyword
        name: keyword.other.break.sd

  BreakLeadingGlue:
    match: ({{BREAK}})({{LEADING_GLUE}})(?={{WS}}*\S)
    captures:
      1:
        patterns:
          - { include: "#Break" }
      2:
        patterns:
          - { include: "#LeadingGlue" }

  Chain:
    tag: special(meta)
    name: meta.chain.sd
    match: ({{WS}}*)({{CHAIN}})(?:({{WS}}+)$|({{WS}}*))
    captures:
      1:
        patterns:
          - { include: "#Whitespace" }
      2:
        tag: keyword
        name: keyword.other.chain.sd
      3:
        patterns:
          - { include: "#ExtraWhitespace" }
      4:
        patterns:
          - { include: "#RequiredWhitespace" }

  Glue:
    tag: meta
    name: meta.glue.sd
    match: ({{WS}}*)({{GLUE}})
    captures:
      1:
        patterns:
          - { include: "#Whitespace" }
      2:
        tag: keyword
        name: keyword.other.glue.sd

  LeadingGlue:
    tag: meta
    name: meta.glue.leading.sd
    match: ({{LEADING_GLUE}})
    captures:
      1:
        tag: keyword
        name: keyword.other.glue.sd

  AlternatorGlue:
    tag: keyword
    name: keyword.other.glue.sd
    match: ({{ALTERNATOR_GLUE}})

  ArmDivert:
    name: meta.divert
    begin: ({{WS}}*)([-][>][-][>]|[-][>])
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#TunnelMark" }
          - { include: "#DivertMark" }
    patterns:
      - { include: "#ArmTag" }
      - { include: "#ArmTunnel" }
      - { include: "#DivertLoad" }
      - { include: "#DivertTarget" }
      - { include: "#ExtraWhitespace" }
      - { include: "#ArmUnknown" }
    end: (?=[|]|{{END}}(?:$|{{WS}})|$|{{NL}}|{{WS}}+{{ALTERNATOR_GLUE}})

  ArmTunnel:
    begin: ({{WS}}*)([-][>])
    beginCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#DivertMark" }
    patterns:
      - { include: "#ArmTag" }
      - { include: "#ArmTunnel" }
      - { include: "#DivertLoad" }
      - { include: "#DivertTarget" }
      - { include: "#ExtraWhitespace" }
      - { include: "#ArmUnknown" }
    end: (?=[|]|{{END}}(?:$|{{WS}})|$|{{NL}}|{{WS}}+{{ALTERNATOR_GLUE}})

  ArmUnknown:
    tag: invalid
    name: invalid.illegal.unknown-statement.sd
    match: ((?:(?!{{WS}}*[|]|{{WS}}+{{ALTERNATOR_GLUE}}|{{WS}}*{{LUAU_NAME_START}}end(?:$|{{WS}})|{{WS}}*$)[^\r\n])+)

  ArmTag:
    tag: docComment
    name: comment.line.sd entity.tag.sd
    match: ({{WS}}*)({{TAG_START}})(.*?)(?=[|]|{{WS}}+{{ALTERNATOR_GLUE}}|{{END}}(?:$|{{WS}})|$)
    captures:
      1:
        patterns:
          - { include: "#Whitespace" }
      2:
        tag: definition(docComment)
        name: punctuation.definition.comment.sd comment.line.sd entity.tag.begin.sd
      3:
