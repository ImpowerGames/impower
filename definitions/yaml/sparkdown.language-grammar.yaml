    begin: (?<=match\b{{WS}}*)(?!do\b)
    patterns:
      - { include: "#LuauExpression" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}}|{{END}}|[}])|(?={{WS}}*do\b)

  LuauSparkleCaseClause:
    begin: ({{WS}}*)(case)\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauCaseKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauSparkleCaseValue" }
      - { include: "#LuauSparkleControlBlock" }
      - { include: "#LuauSparkleBlockLine" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}})|(?={{WS}}*{{LUAU_MATCH_CASE_END_KEYWORDS}})

  # lookaround: the lookbehind opens the value once (see
  # `LuauIfBlockCondition`). Without it the empty begin opens again on the
  # arm's element lines and, in a brace block, its entries
  # (`LuauSparkleBlockLine`, `LuauSparkleBlockEntries`; fixture
