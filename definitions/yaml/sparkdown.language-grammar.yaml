  # An element line is read as tokens, and each token has exactly one way to
  # match: a quoted run, an attribute with its value, a parenthesized list, a
  # comment, a word, or whitespace. So neither the line scan nor an element's
  # head can be backtracked into a token to find a brace inside it: the `{` of
  # `#value={x}`, of `@click={ a = 1 }`, of `"Level {n}"` and of `f({a})` is
  # never a block.
