fileTypes: ["sd"]
keyEquivalent: ^~S
indentUnit: "  "
name: Sparkdown
scopeName: text.source.sparkdown
uuid: E26C862D-2A5E-4F10-B0C3-D6BCB838CB7F
flags: mu

# The second root: a `.luau` document is read from the `LuauFile` rule
# instead of the root `patterns:` below (GRAMMAR.md §1.5). The parser
# factories start on `rule` (`sparkdownGrammarFor`), and the build writes a
# TextMate grammar of this name and scope beside this one whose root
# includes it (`sparkdown-luau.language-grammar.json`), for VS Code.
luauFile:
  name: Sparkdown Luau
  scopeName: source.sparkdown.luau
  fileTypes: ["luau"]
  rule: LuauFile

variables:
  LUAU_SHARED_UNTIL_ACCESS_SUFFIX: "(?:{{WS}}*(?:[.:]{{WS}}*{{LUAU_IDENTIFIER}}|\\[[^\\]\\n]*\\]))"
  LUAU_SHARED_TYPE_DECLARATION_END: "(?:$|{{LUAU_SHARED_TYPE_DECLARATION_END_GUARD}})"
  # lookaround: LuauComment and LuauAssignmentOperation keep trailing comments and assignment values inside the declaration.
  LUAU_SHARED_TYPE_DECLARATION_END_GUARD: "(?!{{LUAU_COMMENT_START}}|{{LUAU_IDENTIFIER}}|[=])"
  _LUAU_SHARED_EXPORTED_TYPE_PREFIX_: "(?:(export)\\b({{WS}}*))"
  # lookaround: LuauFunctionAccessor owns a colon followed by a method call; LuauAccessPath must leave that suffix to it.
  LUAU_SHARED_PATH_NO_METHOD_CALL: "(?!{{WS}}*[:]{{WS}}*{{LUAU_IDENTIFIER}}{{LUAU_SHARED_PATH_TRIVIA}}*{{LUAU_FUNCTION_CALL_START}})"
  # lookaround: LuauForLoop owns binding names before its condition; LuauAccessPath must finish each binding there.
  # A binding is a name right after `for`, or after a comma in the binding
  # list before the header's `in` or `=`, whatever types and comments the
  # earlier names carry (`for k: {a: T} --[[c]], v: nil in t`). A name after
  # a comma past the header's `in` or `=` is a value's (`for k in a, b:end
  # do`, `for i = 1, n:end do`, I-1448), whose `:` is a method's. A
  # lookbehind holds no lookaround, so the list is read as text with no `=`
  # and no `in` standing as a word (`LUAU_FOR_BINDING_LIST_BEHIND`); an `in`
  # inside a comment of that list ends it too.
  LUAU_SHARED_FOR_BINDING_BEHIND: "(?<=\\bfor{{WS}}+{{LUAU_NAME_BEHIND}}|\\bfor\\b{{LUAU_FOR_BINDING_LIST_BEHIND}}[,]{{WS}}*{{LUAU_NAME_BEHIND}})"
  # Text of a `for` header with no `=` and no `in` standing as a word
  # outside its strings and block comments, which are read whole
  # (`for k --[[in]], v: "=" in t`): a string, a block comment that closes
  # on the line, or a character other than a quote, `-`, `=`, `i` or a line
  # break, a `-` that begins no comment, an `i` inside a word or ending one,
  # an `i` before a character other than `n` or `=`, or `in` before a word
  # character.
  # lookaround: read only in lookbehinds, with no lookaround of its own (VS Code's regex engine refuses one inside a lookbehind).
  LUAU_FOR_BINDING_LIST_BEHIND: (?:{{LUAU_QUOTED_STRING_BEHIND}}|{{LUAU_LEVEL_BLOCK_COMMENT_BEHIND}}|[^\n\r=i"'`-]|-[^\n\r-]|\Bi|i\b|i[^n\n\r=]|in\w)*
  # A quoted string on one line, read back from its close.
  # lookaround: read only in lookbehinds, with no lookaround of its own.
  LUAU_QUOTED_STRING_BEHIND: (?:"[^"\n\r]*"|'[^'\n\r]*'|`[^`\n\r]*`)
  # lookaround: LuauChainedPropertyAccess and LuauChainedFunctionCall keep member and call continuations inside the path.
  # A name goes on the path only right after its accessor: after whitespace
  # it begins the next statement (`Hello there`), which no path reads on to.
  LUAU_SHARED_PATH_NO_CONTINUATION: "(?!{{LUAU_IDENTIFIER}}|{{WS}}*{{LUAU_SHARED_PATH_CONTINUATION}})"
  # lookaround: LuauTypeAnnotationOperation owns a declaration's colon; LuauAccessPath must yield before the annotation.
  LUAU_SHARED_PATH_TYPE_ANNOTATION_AHEAD: "(?={{WS}}*{{LUAU_TYPE_ANNOTATION_OPERATOR}})"
  LUAU_SHARED_PATH_CONTINUATION: "(?:{{LUAU_ACCESSOR_OPERATOR}}|{{LUAU_INDEXER_START}})"
  LUAU_SHARED_PATH_END_KEYWORDS: "(?:{{LUAU_BINARY_OPERATORS}}|{{LUAU_TERMINATOR_KEYWORDS}})"
  LUAU_SHARED_PATH_TRIVIA: "(?:{{LUAU_BLOCK_COMMENT_ON_LINE}}|{{WS}})"
  # lookaround: LuauEndKeyword and LuauUntilKeyword own terminators rather than identifier paths.
  LUAU_SHARED_PATH_KEYWORD_GUARD: "(?!{{LUAU_TERMINATOR_KEYWORDS}})"
  LUAU_SHARED_SCOPE_MODIFIER_WORD: "(?:{{LUAU_SCOPE_MODIFIERS}})"
  # lookaround: LuauVariableAssignment and LuauComment keep commas, assignments and comments inside a declaration.
  LUAU_SHARED_DECLARATION_END_GUARD: "(?!{{WS}}|{{LUAU_COMMENT_START}}|[,=])"
  LUAU_SHARED_CONDITIONAL_ALTERNATOR_HEAD: "(?:{{LUAU_CONDITIONAL_ALTERNATOR_KEYWORDS}})"
  # lookaround: LuauThenExpression owns then; LuauOperatorMissingOperand must not report the clause delimiter as an operand.
  LUAU_SHARED_MISSING_OPERAND_WORDS: "(?:and|or|not|if(?!{{WS}}*then\\b))"
  # lookaround: LuauIfBlock owns statement clauses on the next line; LuauTernaryExpression must yield to them.
  LUAU_SHARED_TERNARY_NEXT_LINE_GUARD: "(?!{{WS}}*{{LUAU_IF_BLOCK_KEYWORDS}})"
  # lookaround: LuauElseifBlock owns elseif; LuauTernaryExpression must not treat its suffix as a separate if.
  LUAU_SHARED_NOT_ELSEIF: "(?<!\\belseif)"
  LUAU_SHARED_WRITTEN_BLOCK_CLOSER_KEYWORDS: "(?:end|until)"
  LUAU_SHARED_CONDITION_CLOSER_KEYWORDS: "(?:then|do)"
  LUAU_SHARED_TERNARY_CONTEXT: "(?:{{AFTER_LUAU_TERNARY_PRECEDING_TOKEN}}|{{LUAU_TERNARY_WITH_ELSE_AHEAD}})"
  LUAU_SHARED_PROPERTY_CHAIN_START: "(?:[.]{{LUAU_SHARED_SINGLE_DOT_GUARD}}|{{LUAU_INDEXER_START}})"
  # lookaround: LuauConcatOperation owns consecutive dots; LuauChainedPropertyAccess accepts only a single member dot.
  LUAU_SHARED_SINGLE_DOT_GUARD: "(?![.])"
  _LUAU_SHARED_SEQUENTIAL_MODIFIER_PREFIX_: "(?:({{LUAU_SEQUENTIAL_MODIFIER_KEYWORDS}})({{WS}}*))"
  LUAU_SHARED_SEQUENTIAL_HEAD: "(?:{{LUAU_SEQUENTIAL_MODIFIER_KEYWORDS}}|{{LUAU_SEQUENTIAL_ALTERNATOR_KEYWORDS}})"
  # Where a sequential alternator's head, both of whose words are optional,
  # has read one of them: a begin that read neither would test its arms at
  # the word itself, past which a cast or an operator (`queue :: number |
  # string`) is never seen.
  # lookaround: a head that read no word leaves the word to LuauAccessPath.
  LUAU_AFTER_SEQUENTIAL_HEAD: "(?<=[a-zA-Z0-9_])"
  # lookaround: LuauAccessPath owns dotted keyword members; LuauSequentialAlternatorBlock accepts only standalone keywords.
  LUAU_SHARED_ALTERNATOR_NON_MEMBER: "(?!{{WS}}*[.])"
  # lookaround: LuauIfBlock and LuauLineContinuation own following clauses and expression continuations respectively.
  LUAU_SHARED_THEN_NEXT_LINE_GUARD: "(?!{{WS}}*{{LUAU_IF_BLOCK_KEYWORDS}}|{{LUAU_EXPRESSION_LINE_CONTINUATION}})"
  LUAU_SHARED_THEN_ARM_END: "(?:else\\b|elseif\\b|[)}\\],;])"
  # What a then arm ends before on its line, for use inside a lookahead: a
  # BEAT, its clause keyword or closer, or the `then` or `do` of the statement
  # whose condition the if expression is, after whitespace, glued to the
  # value or after a `:` (`LuauThenExpression`, `LuauThenNextLineArm`).
  LUAU_SHARED_THEN_ARM_CLOSER: "(?:{{BEAT}}|{{WS}}*{{LUAU_SHARED_THEN_ARM_END}}|{{WS}}+{{LUAU_SHARED_CONDITION_CLOSER_KEYWORDS}}\\b|{{AFTER_LUAU_GLUEABLE_OPERAND}}{{LUAU_SHARED_CONDITION_CLOSER_KEYWORDS}}\\b|{{LUAU_COLON_BEFORE_HEADER_END}}|{{LUAU_COLON_BEFORE_LONG_COMMENT}})"
  # lookaround: LuauExpression owns value keywords; LuauTypeLiteral accepts only names that can introduce a type.
  LUAU_SHARED_TYPE_KEYWORD_GUARD: "(?!{{LUAU_NON_TYPE_KEYWORDS}})"
  LUAU_SHARED_PATH_OR_CALL_CONTINUATION: "(?:{{LUAU_ACCESSOR_OPERATOR}}{{WS}}*{{LUAU_IDENTIFIER}}|{{LUAU_DANGLING_ACCESSOR_START}}|{{LUAU_FUNCTION_CALL_START}}|\\[|{{LUAU_LINE_CONTINUATION_OPERATOR}})"
  # lookaround: LuauThenExpression and LuauLineContinuation keep then and operator continuations inside the condition.
  LUAU_SHARED_TERNARY_CONDITION_LINE_END: "(?!{{WS}}*then\\b|{{LUAU_EXPRESSION_LINE_CONTINUATION}})"
  # lookaround: LuauTypeofFunction owns typeof calls; LuauVariableAssignment must not mistake typeof for a binding name.
  LUAU_SHARED_NOT_TYPEOF: "(?!typeof\\b)"
  # lookaround: LuauTypeAnnotationOperation and LuauAssignmentOperation own annotations and values; LuauVariableAssignment must yield before either.
  LUAU_SHARED_VARIABLE_HEAD_END: "(?:[,]|[=](?![=])|[:](?![:])(?!{{WS}}*{{LUAU_SHARED_NOT_TYPEOF}}{{LUAU_IDENTIFIER}}{{WS}}*[(])|--|\\n|\\r|$)"
  LUAU_SHARED_DIVERT_DOTTED_PART: "(?:[.]{{IDENTIFIER}})"
  # lookaround: Tags owns the next tag marker; Tag ends before that marker rather than consuming its sibling.
  LUAU_SHARED_TAG_END: "(?:(?={{TAG_START}})|$)"
  DISPLAY_CHAIN_SEPARATOR: (?:$|{{WS}}+)
  # lookaround: LuauIfBlock, LuauRepeatLoop and the bodies' end patterns
  # own the four closers, which can close a block the unread run cannot
  # see, so LuauUnreadName and LuauUnreadCharacter leave them to those
  # rules.
  LUAU_UNREAD_NOT_CLOSER: (?!{{LUAU_IF_BRANCH_END_KEYWORDS}}|{{LUAU_REPEAT_BLOCK_KEYWORDS}})
  # The four closers, each as a whole word. A rule's `end:` looks ahead for
  # the ones it does not own, which close it where it stands so that the
  # block around it takes the closer, as Luau's parser reads it (#1209):
  # a statement whose own blocks take their closers before any of the four
  # (`LUAU_CLOSER`), a block that owns `end` before `else`, `elseif` or
  # `until` (`LUAU_BRANCH_OR_UNTIL`), an `if` and its `elseif`, whose
  # branches are their own, before `until` (`LUAU_UNTIL`), a `repeat`
  # before `end`, `else` or `elseif` (`LUAU_END_OR_BRANCH`), and a bracket
  # before any of the four. Without those ends VS Code's engine, which
  # never closes a rule but at its end, would pass over the closer inside
  # the rule while the tree engine closes the rule there (GRAMMAR.md §17.2).
  LUAU_CLOSER: (?:(?:end|else|elseif|until){{LUAU_NAME_END}})
  LUAU_BRANCH_OR_UNTIL: (?:(?:else|elseif|until){{LUAU_NAME_END}})
  LUAU_UNTIL: (?:until{{LUAU_NAME_END}})
  LUAU_END_OR_BRANCH: (?:(?:end|else|elseif){{LUAU_NAME_END}})
  # What may stand between a method's `:` and its name on the `:`'s line:
  # spaces and block comments of level up to eight that close on the line
  # (`(t): --[====[c]====] end`), as Luau reads trivia there. Each closes
  # only at its own level (`LUAU_EXACT_LEVEL_BLOCK_COMMENT`), so a close of
  # another level inside one is its text and the word after the real close
  # is the one decided on. A longer comment is never read by a lookahead: a
  # variable cannot match its close's level, and the approximate close of
  # `LUAU_ANY_LEVEL_BLOCK_COMMENT` would decide on a word inside the comment
  # (`--[=========[a]==========] end ]=========] foo()`). The rule that
  # reads the `:` reads such a comment instead (I-1459), with
  # `LuauBlockComment`, whose end matches its begin's level, and decides on
  # the word after it (`LUAU_METHOD_TRIVIA_TO_LONG_COMMENT`).
  LUAU_METHOD_TRIVIA: (?:{{WS}}*{{LUAU_EXACT_LEVEL_BLOCK_COMMENT}}*)
  # A block comment of level up to eight that closes on its line at its own
  # level, with the whitespace after it.
  LUAU_EXACT_LEVEL_BLOCK_COMMENT: (?:{{LUAU_COMMENT_START}}\[(?:{{LUAU_BLOCK_COMMENT_REST}}|{{LUAU_BLOCK_COMMENT_LEVELS_4_TO_8_REST}}){{WS}}*)
  # Method trivia that reaches a block comment of level nine or more on the
  # `:`'s line (`(t): --[=========[c]=========] end`, I-1459), past which no
  # lookahead sees the method's name. It decides as `do` and `then` do
  # (`LUAU_COLON_BEFORE_LONG_COMMENT`): whatever holds the value before the
  # `:` ends before it, and the rule around decides after reading the
  # comment as `LuauBlockComment`, at its own level, and the word after it.
  LUAU_METHOD_TRIVIA_TO_LONG_COMMENT: (?:{{LUAU_METHOD_TRIVIA}}{{LUAU_LONG_BLOCK_COMMENT_START}})
  # A method's `:` whose trivia reaches such a comment. No lookahead sees
  # whether a header's `do` or `then` follows it, so an access path and a
  # complete type end before it, as before `LUAU_COLON_BEFORE_HEADER_END`,
  # and the rule around decides: a loop's or an `if`'s condition reads the
  # `:` and the comment and leaves its own keyword
  # (`LuauLoopHeaderMethodColon`, `LuauIfHeaderMethodColon`), and an
  # expression reads any reserved word after them as the method's name
  # (`LuauExpressionKeywordMethodAccessor`).
  # lookaround: `LUAU_TYPECAST_OPERATOR` owns `::`; read only inside the `end:` lookaheads of the path and of a type, which hand the `:` to those rules (GRAMMAR.md §10.1, the end carrying the load).
  LUAU_COLON_BEFORE_LONG_COMMENT: (?:[:](?![:]){{LUAU_METHOD_TRIVIA_TO_LONG_COMMENT}})
  # A type operator whose right operand is missing before a `:`
  # (`t :: T | :do`, `t :: :do`), where the `:` is a type's stray colon
  # and a header's bracket may hold the word after it, which Luau's
  # value operators never end with (`t + :do` is still a method's `:`).
  # lookaround: read only in `LuauExpressionKeywordMethodAccessor`'s negative lookbehind, with no lookaround of its own.
  LUAU_TYPE_OPERATOR_BEHIND: (?:(?:[|&:]|->){{WS}}*)
  # The opening of a block comment of level nine or more.
  LUAU_LONG_BLOCK_COMMENT_START: (?:{{LUAU_COMMENT_START}}\[={9,}\[)
  # A reserved word no type can begin, or such a comment, after a method's
  # `:` and its trivia (`LUAU_COLON_BEFORE_RESERVED_WORD`).
  LUAU_NON_TYPE_KEYWORD_OR_LONG_COMMENT: (?:{{LUAU_NON_TYPE_KEYWORDS}}|{{LUAU_LONG_BLOCK_COMMENT_START}})
  # Any reserved word on a method's `:`'s line, which the accessor that read
  # the `:` and the trivia after it reads as the method's name. Past a block
  # comment that closes on a later line, the word is no method's: Luau reads
  # a reserved word as one only on the `:`'s line, and leaves it to the
  # statement or block it begins there.
  # lookaround: `LuauExpressionKeywordMethodAccessor`'s and the long-comment header rules' ends yield to their `LuauKeywordMethodName` only on the `:`'s line, which only the text the rule has read shows.
  LUAU_KEYWORD_ON_COLON_LINE_AHEAD: (?:(?<={{LUAU_METHOD_COLON_LINE_BEHIND}}){{LUAU_KEYWORD}})
  # A position after a method's `:` and the trivia that follows it on its
  # line, which a rule that read the `:` has read: spaces and block comments
  # that open and close on the line (`LUAU_TRIVIA_ON_LINE_BEHIND`). The
  # rule's `LuauBlockComment` has already read each comment at its own level:
  # this tells that no line break stands between the `:` and the position,
  # so a reserved word there is on the `:`'s line. Each comment closes at
  # the first close of its own level, exactly up to level sixteen and
  # whatever its text holds (`LUAU_LEVEL_BLOCK_COMMENT_BEHIND`), so the text
  # of a comment that opened on an earlier line, a `:` and a close of
  # another level in it, never reads as that line (`--[=========[a` then
  # `: --[[c ]=========] end`).
  # lookaround: read only in lookbehinds, with no lookaround of its own (VS Code's regex engine refuses one inside a lookbehind).
  LUAU_METHOD_COLON_LINE_BEHIND: (?:[:]{{LUAU_TRIVIA_ON_LINE_BEHIND}})
  # Spaces and block comments that open and close on their line, each
  # closing at the first close of its own level, whatever its text holds
  # (`--[=========[a]b]=========]`), so a close of another level that ends
  # an earlier line's comment never stands for one (`--[[c ]=========]`).
  # lookaround: read only in lookbehinds, with no lookaround of its own.
  LUAU_TRIVIA_ON_LINE_BEHIND: (?:{{WS}}*(?:{{LUAU_LEVEL_BLOCK_COMMENT_BEHIND}}{{WS}}*)*)
  # A block comment that opens and closes on its line at one level, read
  # back from its close. A lookbehind holds no backreference, so each level
  # up to sixteen is spelled out; a longer one closes at any close of
  # seventeen or more.
  # lookaround: read only in lookbehinds, with no lookaround of its own.
  LUAU_LEVEL_BLOCK_COMMENT_BEHIND: (?:--\[(?:\[[^\n\r]*?\]\]|=\[[^\n\r]*?\]=\]|==\[[^\n\r]*?\]==\]|===\[[^\n\r]*?\]===\]|={4}\[[^\n\r]*?\]={4}\]|={5}\[[^\n\r]*?\]={5}\]|={6}\[[^\n\r]*?\]={6}\]|={7}\[[^\n\r]*?\]={7}\]|={8}\[[^\n\r]*?\]={8}\]|={9}\[[^\n\r]*?\]={9}\]|={10}\[[^\n\r]*?\]={10}\]|={11}\[[^\n\r]*?\]={11}\]|={12}\[[^\n\r]*?\]={12}\]|={13}\[[^\n\r]*?\]={13}\]|={14}\[[^\n\r]*?\]={14}\]|={15}\[[^\n\r]*?\]={15}\]|={16}\[[^\n\r]*?\]={16}\]|={17,}\[[^\n\r]*?\]={17,}\]))
  # A declaration's scope word and its targets up to an annotation's `:`,
  # with no bracket, `:` or `=` between (`local x, y`), so the annotation
  # test below holds only for a declaration's own annotation: a field's or a
  # parameter's annotation inside a bracket keeps its old reading, where a
  # header around the bracket may hold the `:do` (`while t :: {a: T | :do
  # end`).
  # lookaround: read only in lookbehinds, with no lookaround of its own.
  LUAU_DECLARATION_TARGETS_BEHIND: (?:\b{{LUAU_DECLARATION_SCOPE_WORDS}}\b[^\n\r(){}\[\]:=]*)
  # A reserved word other than `do` and `then`, which only a header's colon
  # rule or the expression's accessor reads after a `:` (a path ends before
  # them, `LUAU_COLON_BEFORE_HEADER_END`; a type's stray `:` before them is
  # `LuauTypeStrayColon`'s, as on base).
  # lookaround: `LuauLoopHeaderMethodColon`, `LuauIfHeaderMethodColon` and `LuauExpressionKeywordMethodAccessor` read a `:` before `do` or `then`; `LuauKeywordMethodAccessor`, which a type tries before its stray-colon token, steps aside for them.
  LUAU_KEYWORD_NOT_HEADER_END: (?:(?!{{LUAU_SHARED_CONDITION_CLOSER_KEYWORDS}}{{LUAU_NAME_END}}){{LUAU_KEYWORD}})
  # A position after a type annotation's `:` and a complete type on its line
  # (`local x: T`, `local x: {a: number}`, `local x: A | B?`), where a `:`
  # that `do`, `then` or a comment of level nine or more follows is a
  # method's, in error, and not another annotation's (I-1447). Before any
  # other reserved word the type itself reads the `:` (`LuauTypeLiteral`),
  # but it ends before these, which may be a header's, so the annotation
  # must tell this `:` from its own. The type is a run of tokens with no
  # space, comma, `;`, `=` or `:` in it outside its brackets, which nest
  # three levels deep, joined by `|`, `&` or `->`, with block comments that
  # close on the line around its tokens (`LUAU_TYPE_TOKEN_BEHIND`), so an
  # annotation's own `:` never stands at a position it matches: that `:`
  # follows a target's name, which a `,`, an unclosed `(` or `{` or a
  # keyword comes before, never a `:` and a complete type. A type with
  # brackets four levels deep, or with a word after a space that no type
  # operator joins, leaves the `:` to the annotation, as before.
  # lookaround: read only in lookbehinds, with no lookaround of its own (VS Code's regex engine refuses one inside a lookbehind).
  LUAU_TYPE_AFTER_COLON_BEHIND: (?:{{LUAU_DECLARATION_TARGETS_BEHIND}}[:]{{LUAU_TRIVIA_ON_LINE_BEHIND}}{{LUAU_TYPE_BEHIND}}{{LUAU_TRIVIA_ON_LINE_BEHIND}})
  # Such a type: its tokens joined by `|`, `&` or `->`. After an operator
  # whose operand is missing (`T |`) the `:` stays the annotation's, as on
  # base, since a header's bracket may hold it.
  # lookaround: read only in lookbehinds, with no lookaround of its own.
  LUAU_TYPE_BEHIND: (?:{{LUAU_TYPE_TOKEN_BEHIND}}{{LUAU_TYPE_OPERATOR_TOKEN_BEHIND}}*)
  # lookaround: read only in lookbehinds, with no lookaround of its own.
  LUAU_TYPE_OPERATOR_TOKEN_BEHIND: (?:{{LUAU_TRIVIA_ON_LINE_BEHIND}}(?:[|&]|->){{LUAU_TRIVIA_ON_LINE_BEHIND}}{{LUAU_TYPE_TOKEN_BEHIND}})
  # A `:` after such a type that `do` or `then` follows, which
  # `LuauTypeAnnotationMissingType` leaves to the method accessor.
  # lookaround: `LuauExpressionKeywordMethodAccessor` reads a `:` that `do` or `then` follows after an annotation's complete type, and only the text since the annotation's `:` shows that a type stands there; `LuauTypeAnnotationMissingType` steps aside for it.
  # The lookahead goes first, so the lookbehind, which reads back along the
  # line, runs only at such a `:`.
  LUAU_METHOD_COLON_AFTER_TYPE_AHEAD: (?:(?={{LUAU_COLON_BEFORE_HEADER_END}}|{{LUAU_COLON_BEFORE_LONG_COMMENT}})(?<={{LUAU_TYPE_AFTER_COLON_BEHIND}}))
  # One token of such a type: a run of characters with no space, comma, `;`,
  # `=`, `:`, bracket, `|` or `&`, or a bracket pair, which may hold any of
  # them and two more levels of brackets (`{a: number}`, `(a: T) -> U`,
  # `Array<A, B>`, `{a: {b: {c: T}}}`).
  # lookaround: read only in lookbehinds, with no lookaround of its own.
  LUAU_TYPE_TOKEN_BEHIND: (?:(?:[^\s,;=:(){}\[\]|&]|{{LUAU_TYPE_BRACKETS_BEHIND}})+)
  # A bracket pair in a type, holding two more levels of brackets.
  # lookaround: read only in lookbehinds, with no lookaround of its own.
  LUAU_TYPE_BRACKETS_BEHIND: (?:[(]{{LUAU_TYPE_BRACKET_PART_BEHIND}}*[)]|[{]{{LUAU_TYPE_BRACKET_PART_BEHIND}}*[}]|\[{{LUAU_TYPE_BRACKET_PART_BEHIND}}*\]|[<]{{LUAU_TYPE_GENERIC_PART_BEHIND}}*[>])
  # A character or inner bracket pair in such a pair.
  # lookaround: read only in lookbehinds, with no lookaround of its own.
  LUAU_TYPE_BRACKET_PART_BEHIND: (?:[^\n\r(){}\[\]]|{{LUAU_TYPE_INNER_BRACKETS_BEHIND}})
  # The same in a generic's angle brackets, which hold no angle bracket.
  # lookaround: read only in lookbehinds, with no lookaround of its own.
  LUAU_TYPE_GENERIC_PART_BEHIND: (?:[^\n\r(){}\[\]<>]|{{LUAU_TYPE_INNER_BRACKETS_BEHIND}})
  # A bracket pair inside one, holding one more level of brackets.
  # lookaround: read only in lookbehinds, with no lookaround of its own.
  LUAU_TYPE_INNER_BRACKETS_BEHIND: (?:[(]{{LUAU_TYPE_INNER_PART_BEHIND}}*[)]|[{]{{LUAU_TYPE_INNER_PART_BEHIND}}*[}]|\[{{LUAU_TYPE_INNER_PART_BEHIND}}*\]|[<]{{LUAU_TYPE_INNER_GENERIC_PART_BEHIND}}*[>])
  # A character or innermost bracket pair in such a pair.
  # lookaround: read only in lookbehinds, with no lookaround of its own.
  LUAU_TYPE_INNER_PART_BEHIND: (?:[^\n\r(){}\[\]]|{{LUAU_TYPE_INNERMOST_BRACKETS_BEHIND}})
  # The same in a generic's angle brackets.
  # lookaround: read only in lookbehinds, with no lookaround of its own.
  LUAU_TYPE_INNER_GENERIC_PART_BEHIND: (?:[^\n\r(){}\[\]<>]|{{LUAU_TYPE_INNERMOST_BRACKETS_BEHIND}})
  # A bracket pair three levels in, holding no brackets.
  # lookaround: read only in lookbehinds, with no lookaround of its own.
  LUAU_TYPE_INNERMOST_BRACKETS_BEHIND: (?:[(][^\n\r(){}\[\]]*[)]|[{][^\n\r(){}\[\]]*[}]|\[[^\n\r(){}\[\]]*\]|[<][^\n\r(){}\[\]<>]*[>])
  # A `:` that `do` or `then` follows on its line, with no name between
  # (`while t: do`, `local b = a:  then`), where an access path ends. Either
  # keyword may end a header, so the rule around the path decides, as no
  # part of the path can: a loop's condition reads the `:` alone before its
  # `do` (`LuauLoopHeaderMethodColon`), and an `if`'s before its `then`
  # (`LuauIfHeaderMethodColon`), each ending at its keyword as it would with
  # the name in place. An expression reads the keyword as the method's name
  # (`LuauExpressionKeywordMethodAccessor`), as it does the other header's
  # keyword in a condition (`if t:do() then`). The path's end is tried
  # before its parts, so its own keyword accessor never meets these two.
  # lookaround: `LUAU_TYPECAST_OPERATOR` owns `::`, which is no method's `:`; the variable is read only inside the `end:` lookaheads of the path and of an operation (GRAMMAR.md §10.1, the end carrying the load).
  LUAU_COLON_BEFORE_HEADER_END: (?:[:](?![:]){{LUAU_METHOD_TRIVIA}}{{LUAU_SHARED_CONDITION_CLOSER_KEYWORDS}}{{LUAU_NAME_END}})
  # A `:` that a reserved word no type can begin follows on its line, with
  # no name between (`t :: T:do`, `local x: T:end`). Luau's type ends before
  # the `:`, and the word is the name of a method called on the value before
  # it, in error, so a type ends there and the expression around it reads
  # the `:` and the word (`LuauExpressionKeywordMethodAccessor`, I-1351). A
  # comment of level nine or more decides as such a word does
  # (`LUAU_METHOD_TRIVIA_TO_LONG_COMMENT`): no type goes on at a `:` after a
  # complete type, so the type ends there whatever the comment hides.
  # lookaround: `LUAU_TYPECAST_OPERATOR` owns `::`, which is no method's `:`; the variable is read only inside a type's `end:` lookahead and an accessor's begin lookahead (GRAMMAR.md §10.1, the end carrying the load).
  LUAU_COLON_BEFORE_RESERVED_WORD: (?:[:](?![:]){{LUAU_METHOD_TRIVIA}}{{LUAU_NON_TYPE_KEYWORD_OR_LONG_COMMENT}})
  # The same `:` right after a complete type (`T:end`), where a type and the
  # operation and cast around it end. Only there does no type begin at it: a
  # `:` after a type operator begins the stray-colon type it did before
  # (`T | :end`), which its operation, ending only after a complete type,
  # still holds.
  # lookaround: `LuauTypeLiteral`'s begin refuses this `:` only where its own `end:` and its rivals' (`LuauTypeBinaryOperation`, `LuauTypeCastOperation`) would close at it; a begin without the lookbehind refuses a `:` no end stops before, which leaves the operation around it with nothing to read (GRAMMAR.md §17.2).
  LUAU_TYPE_ENDS_BEFORE_RESERVED_WORD: (?:(?={{LUAU_COLON_BEFORE_RESERVED_WORD}})(?<={{LUAU_TYPE_END}}{{WS}}*))
  # A bracket also ends before a bracket closer it did not open, as Luau's
  # expression parser stops at it and reports the bracket left open
  # (`{ f(1 }` closes the call before the `}`, which the table takes):
  # each of these is the four closers with the two bracket closers a
  # bracket of that kind does not own. A type's bracket ends before a
  # generic's `>` too (`Array<(number>`), which never stands alone in a
  # type but as a generic's closer, and `>>`, which closes an explicit
  # instantiation (`f<<(number>>()`), begins with one. A block never ends
  # at a bracket closer: Luau's block parser reads one as a statement's
  # error, so the block goes on to its own closer.
  LUAU_NOT_PARENTHESIS_CLOSER: (?:{{LUAU_CLOSER}}|[\]}])
  LUAU_NOT_SQUARE_BRACKET_CLOSER: (?:{{LUAU_CLOSER}}|[)}])
  LUAU_NOT_BRACE_CLOSER: (?:{{LUAU_CLOSER}}|[)\]])
  LUAU_NOT_TYPE_PARENTHESIS_CLOSER: (?:[\]}]|{{LUAU_TYPE_GENERIC_CLOSER}})
  LUAU_NOT_TYPE_SQUARE_BRACKET_CLOSER: (?:[)}]|{{LUAU_TYPE_GENERIC_CLOSER}})
  LUAU_NOT_TYPE_BRACE_CLOSER: (?:[)\]]|{{LUAU_TYPE_GENERIC_CLOSER}})
  LUAU_NOT_TYPE_GENERIC_CLOSER: (?:[)\]}])
  # lookaround: `LUAU_TYPE_BINARY_OPERATORS` reads a function type's `->` whole, so a `>` right after a `-` is the arrow's, never a generic's closer.
  LUAU_TYPE_GENERIC_CLOSER: (?:(?<![-])[>])
  # A keyword that may be written right after an operand with no space
  # between them (`a == (1)then`, `n = (n + 1)until n > 2`,
  # `do local y = (1)end`), before which an operation, an assignment or a
  # condition ends, as Luau's lexer reads the keyword as a token of its own
  # (#922). The rules that end at whitespace end there too, so neither
  # engine reads the keyword into them, and a name that only begins with
  # one (`ending`, `done`) is not one.
  LUAU_GLUED_KEYWORD: (?:(?:then|do|end|else|elseif|until){{LUAU_NAME_END}})
  # The end of a Luau name or keyword: no ASCII name character follows.
  # lookaround: a name character after a word makes it a longer name,
  # which `LuauAccessPath` and `LuauUnreadName` read whole (`ending`,
  # `end_x`), so a keyword ends here only where no name goes on. It is
  # spelled as a class rather than `\b`, which VS Code's Oniguruma reads as
  # Unicode-aware and JavaScript as ASCII-only, so both engines end the
  # word at the same character.
  LUAU_NAME_END: (?![a-zA-Z0-9_])
  # The symbols of more than one character that Luau's lexer reads whole,
  # longest first, with the other languages' operators it reads to report
  # them (`&&`, `||`, `!=`), as `readLuauAst.ts` lists them in `SYMBOLS`.
  LUAU_UNREAD_SYMBOL: (?:\.\.\.|\.\.=|//=|\.\.|::|==|~=|<=|>=|\+=|-=|\*=|/=|%=|\^=|->|//|&&|\|\||!=)

  IMAGE_CONTROL_KEYWORDS: ["show", "hide", "animate"]
  IMAGE_CLAUSE_KEYWORDS: ["over", "after", "with", "wait", "ease"]
  AUDIO_CONTROL_KEYWORDS: ["play", "stop", "fade", "queue", "await"]
  AUDIO_CLAUSE_KEYWORDS:
    ["over", "after", "to", "loop", "once", "mute", "unmute", "now"]
  # Screen lifecycle directives — `[[open hud with fade over 1s]]` /
  # `[[close hud]]` / `[[navigate menu to settings]]`. They flow through the same
  # AssetCommand grammar as image directives, so they inherit every
  # IMAGE_CLAUSE_KEYWORD (over/after/with/wait/ease) for free; the runtime
  # InterpreterModule routes the verbs to screen mount/unmount/navigate instead of
  # the image path. `open`/`close` are overlay primitives; `navigate <container>
  # to <screen>` routes within a container (close that container's open screens,
  # open the target), leaving other containers / uncategorized screens untouched.
  LAYOUT_CONTROL_KEYWORDS: ["open", "close", "navigate"]
  # `[[load NAME…]]` — preload the named scenes (and worlds) behind the
  # loading layout before the story goes on. Every `load` arrow (`-> load X`,
  # `-> load X ->`, `<- load X`) lowers to this directive on its own line.
  LOAD_CONTROL_KEYWORDS: ["load"]

  FLOW_BEAT_KEYWORDS: ["scene", "branch"]
  # referenced-from: packages/sparkdown-language-server/src/utils/providers/getCompletions.ts
  # (keyword completions; no pattern expands it).
  FLOW_MODULE_KEYWORDS: ["include", "run"]

  LUAU_SCOPE_MODIFIERS: ["store", "local", "const"]
  LUAU_ACCESS_MODIFIERS: ["read", "write"]
  LUAU_END_KEYWORDS: ["end"]
  LUAU_CONDITIONAL_ALTERNATOR_KEYWORDS: ["match", "plural"]
  LUAU_SEQUENTIAL_ALTERNATOR_KEYWORDS: ["queue", "cycle", "chain"]
  LUAU_SEQUENTIAL_MODIFIER_KEYWORDS: ["shuffle"]
  LUAU_FLOW_BLOCK_KEYWORDS: ["do", "if", "for", "while", "repeat"]
  LUAU_IF_BLOCK_KEYWORDS: ["then", "elseif", "else"]
  LUAU_IF_BRANCH_END_KEYWORDS: ["end", "elseif", "else"]
  # referenced-from: packages/sparkdown-language-server/src/utils/providers/getCompletions.ts
  # (keyword completions in a loop's body).
  LUAU_LOOP_BLOCK_KEYWORDS: ["break", "continue"]
  # The loop keyword that ends a path. `continue` is not one: Luau reads it
  # as a keyword only where a statement begins (`LuauContinueStatement`),
  # and as a name everywhere else, so a path may begin with it (#984).
  LUAU_BREAK_KEYWORDS: ["break"]
  LUAU_ITERATOR_KEYWORDS: ["in"]
  LUAU_REPEAT_BLOCK_KEYWORDS: ["until"]
  LUAU_JUMP_KEYWORDS: ["goto"]
  LUAU_RETURN_KEYWORDS: ["return"]
  LUAU_LOGICAL_KEYWORDS: ["and", "or", "not"]
  # `require` is not here: it is the global function Luau reads it as
  # (`LUAU_STANDARD_LIB_FUNCTIONS`), so a path may begin with it (#879).
  LUAU_MODULE_KEYWORDS: ["export"]
  LUAU_PRESENTATION_DEFINITION_KEYWORDS: ["animation", "theme", "morph"]
  # The words that begin a statement of Sparkdown's own in a Luau body,
  # which a `.luau` file's top level reads as Luau names
  # (`LuauFileSparkdownWord`).
  LUAU_FILE_SPARKDOWN_WORDS: ["define", "store", "layout", "style", "screen", "component", "animation", "theme", "morph"]
  LUAU_MATCH_CASE_END_KEYWORDS: ["case", "else", "end"]
  # The keywords an expression can follow, so an `if` right after one begins
  # an if expression whether or not its `else` is on the same line: an
  # operator's or `return`'s operand, a clause's value, and the condition of
  # `if`, `elseif`, `while` and `until` or the iterated value after `in`.
  LUAU_TERNARY_PRECEDING_KEYWORDS: ["return", "and", "or", "not", "then", "else", "if", "elseif", "while", "until", "in"]
  # Statement-boundary keywords that end an `until` condition
  # (`LuauUntilCondition`), with the `until` of a loop around its loop.
  LUAU_UNTIL_CONDITION_END_KEYWORDS:
    - "until"
    - "if"
    - "while"
    - "for"
    - "repeat"
    - "do"
    - "function"
    - "end"
    - "return"
    - "local"
    - "break"
    - "continue"
    - "elseif"
    - "else"
    - "then"
  # A token an expression can start with: a name or a word that begins an
  # expression, a number, a quote, a bracket that opens a value, `#`, `-`,
  # `@`, a long string or a leading `.`.
  # lookaround: a condition that opens with no text of its own
  # (`LuauUntilCondition`, `LuauConditionalAlternatorCondition`) must refuse
  # what `LuauExpression` cannot read, or it opens again, empty, at the same
  # position until the parser's empty-match limit stops it (#1102).
  LUAU_EXPRESSION_START: '(?=[a-zA-Z0-9_"''`({#@-]|\[=*\[|[.][0-9.])(?!{{LUAU_NON_EXPRESSION_KEYWORDS}})'
  # Keywords that end a `return` statement's value list
  # (`LuauReturnStatement`).
  LUAU_RETURN_END_KEYWORDS:
    - "end"
    - "else"
    - "elseif"
    - "until"
    - "local"
    - "return"
    - "break"
    - "do"
    - "while"
    - "repeat"
    - "for"
  SELECTOR_FUNCTION_NAMES: ["has", "not", "is", "where"]
  # Luau's reserved words, and `continue`, which Luau reads as a keyword at
  # the start of a statement and which this grammar makes a loop statement.
  LUAU_RESERVED_WORDS:
    [
      "and",
      "break",
      "continue",
      "do",
      "else",
      "elseif",
      "end",
      "false",
      "for",
      "function",
      "if",
      "in",
      "local",
      "nil",
      "not",
      "or",
      "repeat",
      "return",
      "then",
      "true",
      "until",
      "while",
    ]
  # The reserved words that cannot start a type: all but `nil`, `true` and
  # `false`, which are types, and `continue`, which Luau reads as a name
  # where a type stands. A type ends before one, so it never reads the next
  # statement's keyword or its block's `end`.
  LUAU_NON_TYPE_KEYWORDS:
    [
      "and",
      "break",
      "do",
      "else",
      "elseif",
      "end",
      "for",
      "function",
      "if",
      "in",
      "local",
      "not",
      "or",
      "repeat",
      "return",
      "then",
      "until",
      "while",
    ]
  # The reserved words that cannot start an expression: all but `nil`,
  # `true`, `false`, `not`, `function` and `if`, and `continue`, which Luau
  # reads as a name in an expression. An operand is missing before one, so
  # an operator at the end of its line leaves the next statement's keyword
  # or its block's `end` alone.
  LUAU_NON_EXPRESSION_KEYWORDS:
    [
      "and",
      "break",
      "do",
      "else",
      "elseif",
      "end",
      "for",
      "in",
      "local",
      "or",
      "repeat",
      "return",
      "then",
      "until",
      "while",
    ]
  LUAU_GLOBAL_DECLARATION_KEYWORDS: ["define"]
  # `type` is intentionally NOT included here. It IS a declaration
  # keyword for `type X = ...` type aliases (handled by the
  # `LuauDataTypeDeclaration` rule with a `(?!{{WS}}*[(])` lookahead),
  # but it's ALSO a Luau stdlib function (`type(x)` returns the
  # type-name string), which the completions would offer as a keyword.
  # The disambiguation lives in `LuauDataTypeDeclaration`'s lookahead,
  # not here. `LUAU_TERMINATOR_KEYWORDS` spells these words out itself,
  # `const` only before the name it declares (#1328).
  # referenced-from: packages/sparkdown-language-server/src/utils/providers/getCompletions.ts
  # (keyword completions; no pattern expands it).
  LUAU_LOCAL_DECLARATION_KEYWORDS: ["local", "const", "function"]
  LUAU_PRIMITIVE_TYPES:
    [
      "nil",
      "string",
      "number",
      "boolean",
      "thread",
      "vector",
      "buffer",
      "unknown",
      "never",
      "any",
    ]
  LUAU_STANDARD_LIB_GLOBALS: ["_G", "_VERSION"]
  LUAU_STANDARD_LIB_CONSTANTS: [
      "bit32",
      "coroutine",
      "debug",
      "math",
      "os",
      "string",
      "table",
      "task",
      "utf8",
      "buffer",
      "vector",
      # Sparkdown-specific runtime-state namespaces (not in standard
      # Luau). `count.*` exposes ink narrative-flow builtins under
      # Luau-style names — `count.turns()`, `count.visits(-> target)`,
      # etc. — replacing ink's `TURNS()`, `READ_COUNT(...)`. The prefix
      # makes it clear these return *counts* rather than the things
      # themselves. Because `count` is registered as a stdlib namespace
      # it's also reserved as an identifier — users can't define a
      # variable named `count`, and syntax highlighting makes the
      # reserved status visible at the source level. `system.*` is
      # reserved for runtime config (currently just `lang.current`).
      "system",
      "count",
      "lang",
      "plural",
    ]
  LUAU_STANDARD_LIB_FUNCTIONS:
    [
      "assert",
      "collectgarbage",
      "error",
      "gcinfo",
      "getfenv",
      "getmetatable",
      "ipairs",
      "loadstring",
      "newproxy",
      "next",
      "pairs",
      "pcall",
      "print",
      "rawequal",
      "rawset",
      "require",
      "select",
      "setfenv",
      "setmetatable",
      "tonumber",
      "tostring",
      "type",
      "typeof",
      "unpack",
      "xpcall",
    ]
  LUAU_META_METHODS:
    [
      "__add",
      "__call",
      "__concat",
      "__div",
      "__eq",
      "__index",
      "__le",
      "__len",
      "__lt",
      "__metatable",
      "__mod",
      "__mode",
      "__mul",
      "__newindex",
      "__pow",
      "__sub",
      "__tostring",
      "__unm",
      "__iter",
      "__idiv",
    ]

  IDENTIFIER_START_CHAR: '_\p{L}'
  IDENTIFIER_END_CHAR: '0-9_\p{L}-'
  IDENTIFIER_START: "[{{IDENTIFIER_START_CHAR}}]"
  IDENTIFIER_END: "[{{IDENTIFIER_END_CHAR}}]*"
  # A name ends where its characters do and never in `-`. It is spelled
  # without `\b`, which the two engines read differently after a non-ASCII
  # letter (`名 = 2`): Unicode-aware in VS Code's Oniguruma, ASCII-only in
  # JavaScript (#1266). The greedy run already stops before any other name
  # character, so only the `-` the `\b` refused is refused here.
  # lookaround: a trailing `-` is left to what follows the name, as `\b`
  # left it: the `--` of a comment (`LuauComment`), or the `-` of an arrow
  # (`DivertMark`) or of an operation (`LuauArithmeticOperation`). The
  # class must take `-` inside a name (`bg-color`), so it cannot refuse it.
  IDENTIFIER: (?:{{IDENTIFIER_START}}{{IDENTIFIER_END}}(?<![-]))

  TAG_START: (?:[#]+(?=$|{{WS}}))
  # A `#` run that is not a TAG_START: a line rule ends before it, while a
  # tag that touches the line's text (`Hello# t`) stays inside the line's
  # Annotation, so its tags are the line's own (#1710).
  NOT_TAG_HASH: (?:[#]+[^#\s])
  # lookaround: ActionLineEnd and LineEnd own a `#x` the line begins with,
  # as display text. The line rules that end here (ImplicitAction,
  # InlineAction, InlineTitle, InlineHeading, InlineTransitional) begin at
  # the line's first non-space character, and a rule's end is tried before
  # its body at every position, so no reordering of the body hands it the
  # `#x` there: the end would close the rule empty where it began and the
  # tokenizer would loop to its empty-match backstop (#1614). This is the
  # parent's own end already, there is no Switch to split, and the text
  # before the run is outside anything `NOT_TAG_HASH` can match. Text is a
  # non-space character other than `.`, with at most the `..` after it: the
  # leading glue a begin takes (`^: ..#x`, `..#x`) is not text. Each
  # alternative has a fixed width, which VS Code's Oniguruma requires.
  NOT_TAG_HASH_AFTER_TEXT: (?<=[^\s.]|[^\s.][.]|[^\s.][.][.])(?={{NOT_TAG_HASH}})
  COMMENT_START: (?:[-][-])
  # A `>` in display text, which may touch the words around it (`A>B`), and
  # each `>` of `>>` is one. The marks that hold a `>` are matched before it:
  # `Escape` takes `\>`, `TextCommand` takes `<wait 1>`, and `Divert` takes
  # `->`. Display text reads a dash at a time, so the last `-` of `-->` reaches
  # `Divert` and the dashes before it are text.
  BREAK_MARK: (?:[>])
  BREAK: (?:{{WS}}*{{BREAK_MARK}}{{WS}}*)
  CHAIN: (?:[\\])
  # A `..` that ends a line, or the part of a line before a `>` break. It joins
  # the next line or part onto it when that one begins with `..`. Anything but a
  # dot may touch it (`A..`), so `Wait...` stays an ellipsis. Tags and a `//`
  # comment may follow it.
  GLUE: (?:(?<![.])[.][.]{{GLUE_END}})
  # What may follow a line-ending `..`: spaces, then the end of the line, tags,
  # a `//` comment or a `>` break.
  GLUE_END: (?={{WS}}*(?:$|{{TAG_START}}|[/]{2}(?:$|{{WS}})|{{BREAK_MARK}}))
  # A `..` that begins a line. The line joins the one shown before it when
  # that one ends with `..`, which the engine checks as the story runs. A third
  # dot makes it an ellipsis (`...and then`).
  LEADING_GLUE: "(?:[.][.]{{LUAU_SHARED_SINGLE_DOT_GUARD}})"
  # The `..` that begins the text after an inline title's, heading's,
  # transition's, write line's or cue's colon.
  #
  # lookaround: `(?!{{INLINE_GLUED_ALTERNATOR_START}})` leaves an opening
  # `..` to `LuauSparkdownInlineGluedSequentialAlternatorBlock` and
  # `LuauSparkdownInlineGluedConditionalAlternatorBlock`
  # (`BUNNY: .. queue | Hi | Hello ..`). The mark is the begin's last capture
  # because only the begin knows where the text starts: tried from the
  # body instead (`LeadingGlue` after the alternators in each body), it
  # was tried again after a `ParentheticalLine`, so `(aside) \ ..` then
  # `..joined` lost its trailing glue, and an alternator outside `LineEnd`
  # left the spaces after its closing `..` to `LineEnd`'s begin, which the
  # formatter removes. The tree parser has no `\G` to anchor a body pattern
  # to the text's start, and `LEADING_GLUE` cannot refuse the mark by
  # itself, since `.. Wait.` is leading glue. The exclusion is kept here,
  # once, for the five begins that use it.
  INLINE_LEADING_GLUE: (?:(?!{{INLINE_GLUED_ALTERNATOR_START}}){{LEADING_GLUE}})
  # The `..` that opens and closes an inline alternator mid-line
  # (`.. queue|a|b ..`).
  ALTERNATOR_GLUE: (?:(?<=^|{{WS}})[.][.](?=$|{{WS}}))
  # The heads that `LuauSparkdownInlineGluedSequentialAlternatorBlock` and
  # `LuauSparkdownInlineGluedConditionalAlternatorBlock` open on, without
  # captures, so `INLINE_LEADING_GLUE` refuses exactly the `..` they take.
  #
  # lookaround: `(?={{LUAU_SHARED_SEQUENTIAL_HEAD}})`, `(?=[|])` and
  # `(?=[(])` repeat those begins' lookaheads, whose comments name the
  # rival (`TextChunk` and `LeadingGlue`) and why no reordering, `end:` or
  # tighter variable replaces them. A different test here would let
  # `INLINE_LEADING_GLUE` take a `..` an alternator opens on, or refuse
  # one no alternator takes.
  INLINE_GLUED_ALTERNATOR_START: "(?:{{WS}}*{{ALTERNATOR_GLUE}}{{WS}}+(?:(?={{LUAU_SHARED_SEQUENTIAL_HEAD}})(?:(?:{{LUAU_SEQUENTIAL_MODIFIER_KEYWORDS}}){{WS}}*)?(?:{{LUAU_SEQUENTIAL_ALTERNATOR_KEYWORDS}})?{{WS}}*(?=[|])|{{LUAU_SHARED_CONDITIONAL_ALTERNATOR_HEAD}}{{WS}}*(?=[(])))"

  # Newline
  NL: (?:\r\n|\r|\n)
  # Whitespace
  WS: (?:[^\S\n\r])
  # Word
  WORD: (?:[\p{L}\p{N}\p{Mn}]+)
  # End Of Line
  EOL: "(?:$|{{WS}}*$|{{WS}}*{{TAG_START}}.*$)"
  # End Of Keyword
  EOK: "(?:$|{{WS}}+|(?=[:]|{{TAG_START}}|{{COMMENT_START}}))"

  # A line that declares a scene or branch. Luau blocks end before it. It
  # starts like the `Scene` and `Branch` declaration headers, with the keyword
  # first on the line and followed by `EOK`, but unlike those headers it
  # refuses a keyword followed by an assignment operator: inside a block,
  # `scene = "none"` or `branch += 1` assigns a name and must not end the
  # block. A `scene` or `branch` later in a line is also an ordinary name.
  BEAT: (?:^{{WS}}*{{FLOW_BEAT_KEYWORDS}}{{EOK}}(?!{{WS}}*{{LUAU_ASSIGNMENT_OPERATORS}}))
  # A `BEAT` with the declared name after its keyword (`scene Next`), which
  # no Luau expression can be. A bracket left open ends before one (#1907),
  # so a story statement's unclosed `(`, `[` or `{` stops at the next header
  # with Luau's missing-closer error, while the keyword alone or before an
  # operator stays a name inside a function's brackets (`(` then `scene`
  # then `+ 1`, or `scene or true`).
  # lookaround: LuauLogicalOperator and the if expression's `then` and `else`
  # read a reserved word after the name `scene` or `branch` in a function's
  # brackets. A header's name is never a reserved word, and the bracket's
  # `end:` that uses this cannot leave the word to a child rule by order.
  NAMED_BEAT: (?:^{{WS}}*{{FLOW_BEAT_KEYWORDS}}{{WS}}+(?!{{LUAU_KEYWORD}}){{IDENTIFIER_START}})
  END: (?:{{WS}}*(?:end)\b)
  # Just after an operand that a keyword can follow with no space between
  # them: a closing bracket, a quote, a backtick, the vararg `...`, or the
  # closing `/` and flags of a regex literal (`else (x)then`, `else ...then`,
  # `else @/x/gthen`). The flags are bounded so the lookbehind stays one
  # Oniguruma accepts. `LUAU_GLUEABLE_OPERAND_END` is the operand's end
  # itself, for use inside a lookbehind (`LUAU_GLUED_THEN_BEHIND`).
  LUAU_GLUEABLE_OPERAND_END: (?:[)\]}"'`]|\.\.\.|/[dgimsuvy]{0,8})
  AFTER_LUAU_GLUEABLE_OPERAND: (?<={{LUAU_GLUEABLE_OPERAND_END}})
  # A `then` that ends just behind the current position, for use inside a
  # lookbehind: a word-bounded `then`, or one glued to a regex literal's
  # flags, where no word boundary precedes it. An if expression's
  # condition takes a `then` glued to it (`LuauTernaryExpressionCondition`),
  # and its then arm opens just after one (`LuauThenExpression`).
  LUAU_THEN_BEHIND: (?:\bthen|/[dgimsuvy]{1,8}then)
  # A `then` glued to the operand before it (`AFTER_LUAU_GLUEABLE_OPERAND`),
  # for use inside a lookbehind: the `then` an if expression's condition
  # takes (`LuauThenNextLineArm`).
  LUAU_GLUED_THEN_BEHIND: (?:{{LUAU_GLUEABLE_OPERAND_END}}then)
  # Just after a glued `then` that is code: one with no comment start before
  # it on its line, so the text of a comment that ends in `)then` is not one
  # (`LuauThenNextLineArm`).
  # lookaround: `LuauComment` reads a comment to its line's end and leaves the
  # then arm open there, so the arm's patterns meet the position after its
  # last word; only the line before that position tells code from comment.
  # The rule that would claim the position first, the arm's own `then`, has
  # already been taken by the condition, so no ordering of the arm's patterns
  # can tell the two apart. A `--` inside a string before the `then` also
  # stops it, and the line then reads as it did before `LuauThenNextLineArm`.
  AFTER_LUAU_GLUED_THEN: (?<={{LUAU_GLUED_THEN_BEHIND}})(?<!{{LUAU_COMMENT_START}}.*)
  # What begins a statement rather than a value when it begins a line: the
  # keywords `LuauReturnStatement` stops at, a `;`, and a named
  # function declaration (a `function` literal is a value).
  LUAU_STATEMENT_LINE_START: (?:(?:end|until|local|return|break|do|while|repeat|for)\b|;|function{{WS}}+{{LUAU_IDENTIFIER}})
  # What begins a statement or ends a block rather than continuing a
  # reassignment's value list when it begins the line after a comma that
  # ends its line: what ends a declaration there (`LUAU_DECLARATION_STOP`),
  # what begins a statement line (`LUAU_STATEMENT_LINE_START`), `then`, a
  # label, and the named blocks `LuauDeclarations` reaches (`define cfg`,
  # `style s` and the like). An `if` expression and a `function` literal are
  # values. Unlike a declaration, whose value rule leaves statements out,
  # the reassignment reads its values with `LuauExpression`, so a statement
  # this list misses would be read as a value.
  LUAU_LIST_LINE_START_STATEMENT: (?:{{LUAU_DECLARATION_STOP}}|{{LUAU_STATEMENT_LINE_START}}|then\b|[:][:]|(?:define|style|layout|screen|component|animation|theme|morph)\b{{WS}}+{{LUAU_IDENTIFIER}})
  # The start of a line that begins at column 0 with anything a reassignment
  # does not read on to: not a clause keyword of an if expression (`then`,
  # `else`, `elseif`), a continuation, a comment, or a closing bracket or
  # separator. A reassignment that one of its parts carried onto such a line
  # ends there, so the line is read on its own: an if expression whose
  # condition, `then`, then arm or `else` ends its line (`x = if c then 1`,
  # then `print(x)`) takes the line break and ends at the start of the next
  # line (`LuauTernaryExpression`), and the reassignment ends there too
  # rather than reading that line into itself. Anchored at the start of the
  # line, it is decided on that line alone, as VS Code's line-at-a-time
  # tokenizer and the web editor decide it.
  #
  # lookaround: the `(?!…)` leaves the line to the rules that read on to
  # it: `LuauThenExpression` and `LuauTernaryExpression` read a line that
  # begins with `then`, `else` or `elseif`, `LuauLineContinuation` a
  # continued value, `LuauComment` a comment, and the enclosing bracket
  # rule or separator its closer. Every other line belongs to the body
  # around the reassignment, whose dispatcher reads it as the next
  # statement or story line. The structural alternatives do not reach it:
  # an end is tried before the reassignment's patterns, so no ordering of
  # them lets the clause, continuation or comment rules claim the line
  # first; splitting the reassignment would not change which rule stands at
  # the line start; the body's own end cannot run while the reassignment is
  # open; and the excluded starts cannot be folded into a tighter positive
  # variable, since a positive alternative cannot name "any other line".
  LUAU_COLUMN_0_LINE_START: ^(?=\S)(?!{{LUAU_IF_BLOCK_KEYWORDS}}|{{LUAU_EXPRESSION_LINE_CONTINUATION}}|{{LUAU_COMMENT_START}}|[)}\],;])
  # Where a reassignment ends: on its own line (see `LuauReassignment`), or
  # at the start of a column-0 line that one of its parts carried it onto
  # (`LUAU_COLUMN_0_LINE_START`). The reassignment rules begin by consuming
  # their targets, so a reassignment never stands at the start of a line
  # where it opens, and this end cannot close it there; a rule whose begin
  # matched no text would open again at that position until the parser's
  # empty-match limit stopped it. A comma that ends the line carries a
  # target or value list onto the next line (`LuauCommaLineBreak`), and an
  # unindented line after it ends the reassignment too, as an unindented
  # line ends a declaration (`a,` then `g = 1, 2`): the converter reads that
  # line as the rest of the statement, as Luau does.
  # An `=` that ends its line keeps its `LuauAssignmentOperation` open
  # across the line break (`LuauAssignmentLineBreak`, #1247), so the
  # reassignment sees no line end there; it ends at the line end only when
  # the operation has closed. It ends before a bracket closer, which a
  # bracket in it that did not open the closer ends before (I-1318), as it
  # ends before a `;`.
  LUAU_REASSIGNMENT_END: "(?={{BEAT}})|{{LUAU_VALUE_COMMENT_BEFORE_STATEMENT}}|(?=\\]=*\\](?:{{LUAU_STATEMENT_CODE_AHEAD}}|[(]))|(?={{WS}}*;)|(?={{WS}}*[)\\]}])|(?={{WS}}+\\b(?:if|while|for|repeat|do|function|end|return|local|break|continue|elseif|else|then|until)\\b)|(?={{WS}}+{{LUAU_REASSIGNMENT_START}})|(?={{WS}}+{{LUAU_UNRESERVED_IDENTIFIER}}{{LUAU_SHARED_UNTIL_ACCESS_SUFFIX}}*{{WS}}*[(])|$|{{LUAU_COLUMN_0_LINE_START}}"
  # Right after an assignment's operator, where the operator's capture of
  # the whitespace after it leaves the position: the only place inside a
  # `LuauAssignmentOperation` with an `=` behind it, since the operation
  # ends at whitespace or a line comment after its value.
  # lookaround: LuauAssignmentLineBreak begins here, before the line end or
  # a comment, and LuauAssignmentOperation ends at them anywhere else.
  LUAU_AFTER_ASSIGNMENT_OPERATOR: (?<=[^=~<>]={{WS}}*)
  # lookaround: as for LUAU_AFTER_ASSIGNMENT_OPERATOR.
  LUAU_PAST_ASSIGNMENT_OPERATOR: (?<![^=~<>]={{WS}}*)
  # The first token of a line after the one an operation began on (not an
  # operator that begins it, `x` then `= 5`), where `LuauAssignmentLineBreak`
  # leaves the operation, which ends there, so the statement decides
  # whether the token is its value (an indented one) or begins a line of
  # its own.
  # lookaround: LuauVariableDefinition and LuauReassignment read an
  # indented value; the narrative statements end there.
  LUAU_AT_LATER_LINE_TOKEN: (?<=^{{WS}}*)(?!{{LUAU_ASSIGNMENT_OPERATORS}})
  # An `if` that begins its line.
  # lookaround: LuauTernaryExpression reads it where an assignment's value
  # begins; LuauIfBlock reads it anywhere else.
  LUAU_LINE_START_IF: (?<=^{{WS}}*)if{{LUAU_NAME_END}}
  # The start of a reassignment statement: its targets and an assignment
  # operator. The rules that end before a following reassignment look ahead
  # for it.
  LUAU_REASSIGNMENT_START: '{{LUAU_REASSIGNMENT_TARGETS}}{{WS}}*{{LUAU_ASSIGNMENT_OPERATORS}}'
  # A reassignment's targets: a name with `.field`, `[index]` or `(call)`
  # suffixes, or several such names separated by commas. An index may hold
  # one level of brackets (`t[k[1]].x`). The reassignment rules begin by
  # consuming them.
  LUAU_REASSIGNMENT_TARGETS: '{{LUAU_IDENTIFIER}}(?:{{WS}}*(?:[.]{{WS}}*{{LUAU_IDENTIFIER}}|{{LUAU_REASSIGNMENT_INDEX}}|\([^()\n]*\)|,{{WS}}*{{LUAU_IDENTIFIER}}))*'
  # What follows a reassignment's targets in Luau code and in a marked (`&`)
  # statement: the assignment operator, or a comma before the end of the
  # line or a comment (`a,` then `g = 1, 2`). No other statement in Luau
  # code starts with a name followed by a comma, so `LuauReassignment`
  # begins at such a target list too, and its `LuauCommaLineBreak` carries
  # the list onto the next line.
  LUAU_REASSIGNMENT_TARGETS_END: (?:{{LUAU_ASSIGNMENT_OPERATORS}}|,{{WS}}*{{LUAU_LINE_END_OR_COMMENT}})
  # A target's `[index]`, holding at most one level of nested brackets. A
  # string inside it is read whole, in any of Luau's three quotes, so a
  # bracket or another quote in a key (`t["["]`, `t["]"]`, ``t[`don't`]``)
  # is text, not structure.
  LUAU_REASSIGNMENT_INDEX: \[(?:{{LUAU_REASSIGNMENT_INDEX_TEXT}}|\[(?:{{LUAU_REASSIGNMENT_INDEX_TEXT}})*\])*\]
  # One piece of an index's text: a character that is no bracket, quote or
  # line break, or a whole string on one line in double quotes, single
  # quotes or backticks.
  LUAU_REASSIGNMENT_INDEX_TEXT: (?:[^\[\]\n"'`]|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\\n]|\\.)*`)

  # `define` is one only where it opens a define, before its name
  # (`LuauDefine`), and `const` only before the name it declares: anywhere
  # else an access path reads either as a name (`const .x = 3`,
  # `const["x"] = 3`, `a + const`, #1328, #1432). `local` and `function`
  # are Luau's keywords.
  LUAU_TERMINATOR_KEYWORDS: (?:{{LUAU_END_KEYWORDS}}|{{LUAU_FLOW_BLOCK_KEYWORDS}}|{{LUAU_IF_BLOCK_KEYWORDS}}|{{LUAU_BREAK_KEYWORDS}}|{{LUAU_ITERATOR_KEYWORDS}}|{{LUAU_REPEAT_BLOCK_KEYWORDS}}|{{LUAU_JUMP_KEYWORDS}}|{{LUAU_RETURN_KEYWORDS}}|{{LUAU_LOGICAL_KEYWORDS}}|{{LUAU_GLOBAL_DECLARATION_KEYWORDS}}{{LUAU_DECLARATION_NAME_AHEAD}}|(?:local|function)\b|const\b{{LUAU_DECLARATION_NAME_AHEAD}}|{{LUAU_MODULE_KEYWORDS}})
  LUAU_COMMENT_START: (?:[-][-])
  # The end of the line, or the start of a comment.
  LUAU_LINE_END_OR_COMMENT: (?:$|{{LUAU_COMMENT_START}})
  # lookaround: LuauForCondition and LuauWhileCondition own the line break
  # after a `for` or `while` that ends its line, since Luau lets the
  # condition begin on the next line. The loop's line-end end would win at
  # that position, where the condition's empty begin also matches, so it
  # steps aside there; the condition then reads on to its `do`.
  LUAU_NOT_AFTER_LOOP_KEYWORD: (?<!\b{{LUAU_CONDITION_LOOP_KEYWORDS}}{{WS}}*)
  # The loops whose header holds a condition before its `do`.
  LUAU_CONDITION_LOOP_KEYWORDS: (?:for|while)
  # lookaround: LuauBlockComment reads a `--[[`.
  LUAU_LINE_COMMENT_START: (?:{{LUAU_COMMENT_START}}(?!\[=*\[))
  # A Luau name, as Luau's lexer reads one: ASCII letters, digits and `_`,
  # not starting with a digit, and never one of Luau's reserved words, so
  # `end`, `until`, `else` or `elseif` never becomes a variable, field or
  # parameter name (#922, #924). The name ends where no ASCII name character
  # follows, which both engines read alike (`\b` is Unicode-aware in VS
  # Code's Oniguruma and ASCII-only in JavaScript). Lookbehinds use
  # `LUAU_NAME_BEHIND`, since Oniguruma refuses a lookaround inside one.
  # lookaround: a reserved word is a keyword the rules that own it read
  # (`LuauKeyword`, `LuauBoolean`, `LuauNil`, `LuauLogicalOperator`, the
  # blocks' begins and the closers in their ends), never a name. Excluding
  # it here, once, keeps every rule built on the class from reading it
  # (§10.1, "tighten what a variable matches").
  LUAU_IDENTIFIER: (?:(?!{{LUAU_KEYWORD}}){{LUAU_WORD}})
  # A define's key spelled as a reserved word other than a closer, or as a
  # modifier (`repeat = 3`, `local = 3`, #1081): a define's keys are
  # Sparkdown's own, as a table's bracketed keys are. Only
  # `LuauPropertyDefinition`'s begin reads one.
  # lookaround: LuauDefine ends at a closer, and LuauRepeatLoop and the
  # other blocks a reserved word begins read any word not before a lone `=`.
  LUAU_DEFINE_KEYWORD_KEY: (?:(?!{{LUAU_CLOSER}})(?:{{LUAU_KEYWORD}}|{{LUAU_SCOPE_MODIFIERS}}|{{LUAU_ACCESS_MODIFIERS}})(?={{WS}}*{{LUAU_SINGLE_EQUALS}}))
  # lookaround: a modifier before a lone `=` is the key LUAU_DEFINE_KEYWORD_KEY
  # reads.
  LUAU_NOT_BEFORE_LONE_EQUALS: (?!{{WS}}*{{LUAU_SINGLE_EQUALS}})
  # Right after a define's reserved-word key, before its lone `=`.
  # lookaround: without a key read, LuauPropertyDefinition needs a name or a
  # bracketed key before the `=`.
  LUAU_AFTER_DEFINE_KEYWORD_KEY: (?<=[a-zA-Z0-9_]){{WS}}*{{LUAU_SINGLE_EQUALS}}
  # lookaround: LuauCompareOperator reads `==`.
  LUAU_SINGLE_EQUALS: =(?!=)
  # A name or a reserved word, as one token of Luau's lexer.
  LUAU_WORD: (?:[a-zA-Z_][a-zA-Z0-9_]*{{LUAU_NAME_END}})
  # A name or one of the constants `nil`, `true` and `false`: what a type
  # name can be (`LUAU_NON_TYPE_KEYWORDS`), and a choice's bare condition
  # (`* if true …`).
  LUAU_NAME_OR_CONSTANT: (?:(?:nil|true|false){{LUAU_NAME_END}}|{{LUAU_IDENTIFIER}})
  # One of Luau's reserved words as a whole name. `continue` is not one:
  # Luau reads it as a keyword only where a statement begins.
  LUAU_KEYWORD: (?:(?:and|break|do|else|elseif|end|false|for|function|if|in|local|nil|not|or|repeat|return|then|true|until|while){{LUAU_NAME_END}})
  # Where a structural word (`queue`, `cycle`, `chain`, `shuffle`, `match`,
  # `plural`) opens a candidate alternator in an expression: before a token
  # an expression or an arm can begin with (`{cycle "a" | "b" end}`,
  # `queue | a | b`, `match(x) | 1 = "a"`, `queue("a|b")`). Whether it is an
  # alternator or a name is not decided here: the candidate is an alternator
  # only when it holds an arm separator, in its arms (`LuauAlternatorArms`),
  # which open at a `|` at the word's own level, or as the first arm's
  # separator its head took (`_LUAU_ALTERNATOR_HEAD_BEFORE_ARMS_`), and the
  # converter reads it as Luau otherwise (`opensAlternator`, I-1310, I-1408). A token that carries a name on (an
  # operator, a separator, a closer, a reserved word, a member's `.` or
  # `:`, an `=`), a line end or a comment leaves the word a plain name
  # (`local y = queue`, `queue :: number | string`, `if match then`, #984).
  # lookaround: anywhere else `LuauAccessPath` reads the word as a name; it
  # comes after the alternators in `LuauExpression`.
  LUAU_ALTERNATOR_CANDIDATE_AHEAD: (?!{{WS}}*(?:{{LUAU_EXPRESSION_GOES_ON}}|{{LUAU_LINE_END_OR_COMMENT}}))
  # Where a structural word that begins its line opens a candidate: as in
  # an expression, but also before the line's end or a comment, the block
  # form whose arms follow on the next lines (`queue -- note`, then
  # `| print(1)` lines), in a body or inside a bracket (`return (`, then
  # `chain` and its arms).
  # lookaround: a token that carries a name on leaves the word to
  # `LuauAccessPath` (`queue = 5`, `match.x = 1`).
  LUAU_ALTERNATOR_LINE_START_AHEAD: (?!{{WS}}*{{LUAU_EXPRESSION_GOES_ON}})
  # Where `match` or `plural` that begins its line opens a candidate: as
  # any line-start word does, or before any expression its condition can
  # begin with, a constant, `not`, a unary `-` or `#` included
  # (`match true`, `match not x`, `match -1`, `match #t`).
  # lookaround: as for `LUAU_ALTERNATOR_LINE_START_AHEAD`; an operator that
  # only goes on from a name (`match + 1`, `match = 1`) leaves it a name.
  LUAU_CONDITIONAL_LINE_START_AHEAD: (?:{{LUAU_ALTERNATOR_LINE_START_AHEAD}}|(?={{WS}}*{{LUAU_EXPRESSION_START}}))
  # Right after the `end` a candidate's arms took: the candidate ends with
  # them. A candidate takes no `end` of its own, and its only children are
  # its head (`LuauAlternatorHead`) and its arms. The head never ends right
  # after an `end`: before the arms' `|` it ends only where an `end` does not
  # stand against the `|`, after the whitespace before it, or after the `|`
  # itself and the first arm's key (`_LUAU_ALTERNATOR_HEAD_BEFORE_ARMS_`);
  # on a line-start candidate it ends at the start of a later line; and
  # anywhere else it ends where the candidate does. So the `end` this follows is the arms' own,
  # never a comment's last word (`match n -- end`) or the `end` of an
  # alternator in the condition (`match match(x) | a = 1 end | b = 2 end`).
  # lookaround: `LuauAlternatorArms` consumes the `end` this follows.
  LUAU_AFTER_ALTERNATOR_ARMS: (?<=\bend)
  # Where a candidate's head ends before its arms' `|`: right before it,
  # or after the whitespace before it, but never right after an `end`, which
  # would leave the candidate's end (`LUAU_AFTER_ALTERNATOR_ARMS`) to read
  # that `end` as its own arms'. Where an `end` stands against the `|` (an
  # alternator in the condition, `match match(x) | a = 1 end| b = 2 end`),
  # the head takes the `|` itself, as it takes the whitespace otherwise, with
  # what `LuauAlternatorSeparator` takes after it (the whitespace, and the
  # first arm's key, `b =`): the first arm's separator ends the head, and
  # the arms open after it (`LUAU_AFTER_HEAD_SEPARATOR`).
  # lookaround: `LuauAlternatorArms` reads the `|` the head leaves.
  _LUAU_ALTERNATOR_HEAD_BEFORE_ARMS_: (?:(?<!\bend)(?=[|])|({{WS}}+(?=[|])|(?<=\bend){{LUAU_HEAD_SEPARATOR}}))
  # The first arm's separator as a head takes it: the `|`, and what
  # `LuauAlternatorSeparator` reads after it.
  LUAU_HEAD_SEPARATOR: (?:[|]{{WS}}*(?:{{LUAU_IDENTIFIER}}{{WS}}*[=]{{WS}}*)?)
  # Right after the first arm's separator a head took
  # (`_LUAU_ALTERNATOR_HEAD_BEFORE_ARMS_`). Nowhere else does a candidate go
  # on after an `end` against a `|`: the `end` of its arms ends it. The key
  # is any word here, since Oniguruma allows no lookahead in a lookbehind
  # (`LUAU_IDENTIFIER` has one); the head's end already read it.
  # lookaround: `LuauAlternatorHead`'s end consumed the separator.
  LUAU_AFTER_HEAD_SEPARATOR: (?<=\bend[|]{{WS}}*(?:[a-zA-Z_][a-zA-Z0-9_]*{{WS}}*[=]{{WS}}*)?)
  # Right after the first arm's separator a head took, where that arm is
  # empty: before the arms' own `end` (`match match(x) | a end| end`), or
  # before the line's end, past which a candidate's arms go on to the lines
  # below. A candidate never ends there, before the arms it took the
  # separator for open: its end would read that `end` as a closer it does
  # not own, or end at the line, where the spaced spelling's arms open.
  # lookaround: `LuauAlternatorArms` opens there and takes the `end`.
  LUAU_EMPTY_ARM_AFTER_HEAD_SEPARATOR: (?:{{LUAU_AFTER_HEAD_SEPARATOR}}(?={{WS}}*(?:end{{LUAU_NAME_END}}|$)))
  # As `LUAU_EMPTY_ARM_AFTER_HEAD_SEPARATOR`, for the bounded twins, whose
  # arms end at their line: before the line's end their candidate ends, since
  # arms that opened there would end where they opened.
  # lookaround: `LuauSparkdownExplicitAlternatorArms` opens there and takes
  # the `end`.
  LUAU_EMPTY_BOUNDED_ARM_AFTER_HEAD_SEPARATOR: (?:{{LUAU_AFTER_HEAD_SEPARATOR}}(?={{WS}}*end{{LUAU_NAME_END}}))
  # Where a candidate alternator ends wherever its word stands: at a beat,
  # right after the `end` its arms took (`LUAU_AFTER_ALTERNATOR_ARMS`), or
  # before a separator, a bracket's closer or a closer it does not own.
  # lookaround: the separator, the bracket's closer and the closer are their
  # owners' (`LuauAlternatorSeparator`, the bracket rules, the block around).
  LUAU_CANDIDATE_BOUNDARY: (?:(?={{BEAT}})|{{LUAU_AFTER_ALTERNATOR_ARMS}}|(?=[,;)\]}])|(?={{WS}}*{{LUAU_CLOSER}}))
  # As `LUAU_CANDIDATE_BOUNDARY`, or at the candidate's line.
  LUAU_CANDIDATE_LINE_BOUNDARY: (?:{{LUAU_CANDIDATE_BOUNDARY}}|$|^)
  # Where a candidate alternator in an expression ends
  # (`LUAU_CANDIDATE_LINE_BOUNDARY`), but never before the empty arm whose
  # separator its head took (`LUAU_EMPTY_ARM_AFTER_HEAD_SEPARATOR`).
  # lookaround: `LuauAlternatorArms` opens before the empty arm.
  LUAU_CANDIDATE_END: (?:(?!{{LUAU_EMPTY_ARM_AFTER_HEAD_SEPARATOR}}){{LUAU_CANDIDATE_LINE_BOUNDARY}})
  # As `LUAU_CANDIDATE_END`, for a candidate whose word begins its line, which
  # goes on past its line to arms on the lines below and ends at the first
  # line that holds none (`LUAU_LINE_WITHOUT_ALTERNATOR_ARMS`).
  # lookaround: as for `LUAU_CANDIDATE_END`.
  LUAU_LINE_START_CANDIDATE_END: (?:(?!{{LUAU_EMPTY_ARM_AFTER_HEAD_SEPARATOR}})(?:{{LUAU_CANDIDATE_BOUNDARY}}|{{LUAU_LINE_WITHOUT_ALTERNATOR_ARMS}}))
  # As `LUAU_CANDIDATE_END`, for the bounded twins, whose arms end at their
  # line, so only an empty arm's `end` keeps them open
  # (`LUAU_EMPTY_BOUNDED_ARM_AFTER_HEAD_SEPARATOR`).
  # lookaround: `LuauSparkdownExplicitAlternatorArms` opens before the empty
  # arm.
  LUAU_BOUNDED_CANDIDATE_END: (?:(?!{{LUAU_EMPTY_BOUNDED_ARM_AFTER_HEAD_SEPARATOR}}){{LUAU_CANDIDATE_LINE_BOUNDARY}})
  # The start of a line that does not go on with a line-start candidate's
  # head: one that is neither blank nor a comment line.
  # lookaround: `LuauAlternatorArms` and the next statement read the line.
  LUAU_LINE_AFTER_ALTERNATOR_HEAD: ^(?!{{WS}}*(?:--|$))
  # The start of a line that does not go on with a line-start candidate's
  # arms: one that begins neither with a `|` nor with a comment, and is not
  # blank. A candidate whose word holds no arms ends there, so a call
  # (`match(1)`) leaves the next line, and the function's `end`, to the
  # body around it.
  # lookaround: `LuauAlternatorArms` opens at a `|` beginning the line.
  LUAU_LINE_WITHOUT_ALTERNATOR_ARMS: ^(?!{{WS}}*(?:[|]|--|$))
  # What goes on from a name in an expression: an operator (not a divert's
  # `->`), a separator, a closing bracket, a member's `.` or `:`, or a
  # reserved word (`or`, `then`, `end`).
  LUAU_EXPRESSION_GOES_ON: (?:[)\]},;:=.+*/%^<>~#]|{{LUAU_ARITHMETIC_MINUS}}|{{LUAU_KEYWORD}})
  # A `-` that is not a divert's `->` or a comment's `--`.
  # lookaround: `LuauDivertTargetLiteral` reads `->` and `LuauComment` reads
  # `--`, so only a lone `-` is the operator.
  LUAU_ARITHMETIC_MINUS: (?:-(?![>-]))
  # The name after a structural keyword (`style`, `layout`, `screen`,
  # `component`, `animation`, `theme`, `morph`), which its block opens only
  # before: anywhere else the keyword is a name (`local y = style`, #984).
  # A word that is not a reserved word stands for the name, even one that
  # starts with a digit (`style 2x with`), which the block's header reports.
  # Block comments may stand between the keyword and the name
  # (`style --[[ note ]] banner with`, #1343), as the name rules' lookbehinds
  # allow (`LUAU_HEADER_COMMENTS`).
  # lookaround: without a name after it `LuauAccessPath` reads the keyword
  # as a name; the name is the block's own (`LuauStyleNameAndInheritance`
  # and the like read it), so the begin only looks for it.
  LUAU_STRUCTURE_NAME_AHEAD: (?={{LUAU_HEADER_COMMENTS}}?{{LUAU_STRUCTURE_NAME}})
  # lookaround: as LUAU_STRUCTURE_NAME_AHEAD, the name's first character,
  # unless a reserved word begins there.
  LUAU_STRUCTURE_NAME: (?:(?!{{LUAU_KEYWORD}})[a-zA-Z0-9_])
  # After a declaration's word (`define`, `store`, `const`), the name it
  # declares, as a structural keyword's block opens only before its name
  # (#1328).
  # lookaround: the declaration's own rules read the name
  # (`LuauDefineNameAndInheritance`, `LuauVariableAssignment`), and without
  # one `LuauAccessPath` reads the word as a name. The rival rules cannot be
  # ordered instead: the access path tried first would take every
  # declaration's word as a name, and a declaration tried first commits at
  # its begin, which no parent `end:` can undo, so the begin must see the
  # name. Only the token after the word decides, never a scan of the line.
  LUAU_DECLARATION_NAME_AHEAD: (?={{WS}}*{{LUAU_STRUCTURE_NAME_AHEAD}})
  # The line's end or a comment after a `store` or `const` (`store` then
  # `tally = 2` on the next line, `store -- note`, `store --[[ note` then
  # `]] tally = 2`): the token that decides is out of any lookahead's sight
  # (GRAMMAR.md §11.5). Where a statement begins, the word begins its
  # declaration, as it did before the name was required, and the converter,
  # which reads the next token, takes it as a store only when a name or
  # `function` follows (`luauCodeStore` in `readLuauAst.ts`), and otherwise
  # as the name (`store --[[ c`, then `]] = 3`); `const` it reads by its
  # contextual `const`. Where an expression stands,
  # `LuauDeclarationWordAsName` reads the word first, as the name
  # (`return` then `store --[[ note`), so the context decides, not the
  # word's place on its line.
  # lookaround: as for `LUAU_DECLARATION_NAME_AHEAD`; `LuauComment` reads
  # the comment.
  LUAU_DECLARATION_NAME_HIDDEN_AHEAD: (?={{WS}}*{{LUAU_LINE_END_OR_COMMENT}})
  # A `define` with no name it can read after it, before anything but a
  # token that carries a name on (`LUAU_EXPRESSION_GOES_ON`, a call's `(` or
  # an index's `[`): `define`, `define "hero" with`. In a narrative body,
  # whose statements reach `LuauDefine` first, it is a define that its
  # validation reports. In Luau code, where a define opens only before its
  # name, `LuauDefineAsName` and `LuauDeclarationWordAsName` read it first,
  # as the name Luau reads (`define "abc"`, `define {1, 2}`, `return` then
  # `define`, `define --[[ c` then `]] = 3`), whatever its column (#1328).
  # A define's block cannot be read again as Luau once it has taken an
  # `end`, so unlike a store, a define whose name follows a comment spanning
  # lines is a name there; its name was never readable after one.
  # lookaround: before such a token `LuauAccessPath` reads the word as a
  # name; reordering cannot decide it, for the reasons
  # `LUAU_DECLARATION_NAME_AHEAD` gives.
  LUAU_DEFINE_WITHOUT_NAME_AHEAD: (?!{{WS}}*(?:{{LUAU_EXPRESSION_GOES_ON}}|[(\[]))
  # Where `define` opens a define.
  LUAU_DEFINE_AHEAD: (?:{{LUAU_DECLARATION_NAME_AHEAD}}|{{LUAU_DEFINE_WITHOUT_NAME_AHEAD}})
  # Where `store` or `const` begins a declaration in Luau code: before its
  # first name or before `function`. Anywhere else the word is a name, as
  # Luau reads it (`local store = 1`, `return const`,
  # `local a, store = 1, 2`, `{store = 4}`, #1328). `local` is Luau's
  # keyword and always begins one.
  # lookaround: without a name after it `LuauAccessPath` reads the word as a
  # name.
  LUAU_DECLARATION_WORD_AHEAD: (?:{{LUAU_DECLARATION_NAME_AHEAD}}|(?={{WS}}*function\b))
  # Sparkdown's own scope modifiers that Luau reads as names.
  LUAU_STORE_OR_CONST: (?:(?:store|const)\b)
  # `store` or `const` where it begins a declaration, which a list's
  # continuation stops before (`LUAU_DECLARATION_STOP`).
  LUAU_NAMED_DECLARATION_WORD: (?:{{LUAU_STORE_OR_CONST}}{{LUAU_DECLARATION_WORD_AHEAD}})
  # The word that begins a declaration in Luau code (`LuauVariableDefinition`):
  # also before the line's end or a comment, where a statement begins, since
  # an expression's `LuauDeclarationWordAsName` reads the word first anywhere
  # else.
  LUAU_CODE_SCOPE_MODIFIER: (?:local\b|{{LUAU_NAMED_DECLARATION_WORD}}|{{LUAU_STORE_OR_CONST}}{{LUAU_DECLARATION_NAME_HIDDEN_AHEAD}})
