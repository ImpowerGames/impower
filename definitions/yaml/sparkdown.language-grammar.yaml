  WS: (?:[^\S\n\r])
  WORD: (?:[\p{L}\p{N}\p{Mn}]+)
  EOL: "(?:$|{{WS}}*$|{{WS}}*{{TAG_START}}.*$)"
  EOK: "(?:$|{{WS}}+|(?=[:]|{{TAG_START}}|{{COMMENT_START}}))"

