  SPARKLE_BRACED_7: (?:[{](?:{{SPARKLE_BRACED_8}}|{{SPARKLE_BRACED_PART}})*(?:[}]|$))
  SPARKLE_BRACED_6: (?:[{](?:{{SPARKLE_BRACED_7}}|{{SPARKLE_BRACED_PART}})*(?:[}]|$))
  SPARKLE_BRACED_5: (?:[{](?:{{SPARKLE_BRACED_6}}|{{SPARKLE_BRACED_PART}})*(?:[}]|$))
  SPARKLE_BRACED_4: (?:[{](?:{{SPARKLE_BRACED_5}}|{{SPARKLE_BRACED_PART}})*(?:[}]|$))
  SPARKLE_BRACED_3: (?:[{](?:{{SPARKLE_BRACED_4}}|{{SPARKLE_BRACED_PART}})*(?:[}]|$))
  SPARKLE_BRACED_2: (?:[{](?:{{SPARKLE_BRACED_3}}|{{SPARKLE_BRACED_PART}})*(?:[}]|$))
  SPARKLE_BRACED: (?:[{](?:{{SPARKLE_BRACED_2}}|{{SPARKLE_BRACED_PART}})*(?:[}]|$))
