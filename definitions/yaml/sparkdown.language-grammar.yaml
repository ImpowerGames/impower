          - { include: "#DialogueCharacter" }
      3:
        patterns:
          - { include: "#ColonSeparator" }
      4:
        patterns:
          - { include: "#RequiredWhitespace" }
      5:
        patterns:
          - { include: "#LeadingGlue" }
    patterns:
      - { include: "#Annotation" }
      - { include: "#Newline" }
      - { include: "#LineChain" }
      - { include: "#AssetLine" }
      - { include: "#ParentheticalLine" }
      - { include: "#LineEnd" }
    end: (?=^{{WS}}*$)|(?=\r\n|\r|\n)
  DialogueCharacter:
    match: ({{WS}}*)(.*?)({{WS}}*)({{WS}}[(][^()\r\n]*?[)])?($|{{WS}}*)({{WS}}\[.*?\])?({{EOL}})
    captures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#DialogueCharacterName" }
      3:
        patterns:
          - { include: "#ExtraWhitespace" }
      4:
        patterns:
          - { include: "#DialogueCharacterParenthetical" }
      5:
        patterns:
          - { include: "#ExtraWhitespace" }
      6:
        patterns:
          - { include: "#DialogueCharacterPosition" }
      7:
        patterns:
          - { include: "#EndOfLine" }

  DialogueCharacterName:
    tag: typeName
    name: entity.name.type.dialogue.character.name.sd
    match: (.+$)
    captures:
      1:
        patterns:
          - { include: "#DisplayText" }

  DialogueCharacterParenthetical:
    tag: escape
    name: constant.character.escape.dialogue.character.parenthetical.sd
    match: ({{WS}})([(])({{WS}}*)([^()\r\n]*?)({{WS}}*)([)])({{WS}}*)
    captures:
      1:
        patterns:
          - { include: "#Whitespace" }
      2:
        tag: paren
        name: meta.brace.round.open.sd
      3:
        patterns:
          - { include: "#ExtraWhitespace" }
      4:
        patterns:
          - { include: "#DisplayText" }
      5:
        patterns:
          - { include: "#ExtraWhitespace" }
      6:
        tag: paren
        name: meta.brace.round.close.sd
      7:
        patterns:
          - { include: "#ExtraWhitespace" }

  DialogueCharacterPosition:
    tag: definition(escape)
    name: constant.character.escape.dialogue.character.position.sd
    match: ({{WS}})(\[)({{WS}}*)(.*?)({{WS}}*)(\])
    captures:
      1:
        patterns:
          - { include: "#Whitespace" }
      2:
        tag: bracket
        name: punctuation.definition.position.sd
      3:
        patterns:
          - { include: "#ExtraWhitespace" }
      4:
        patterns:
          - { include: "#DialogueCharacterPositionContent" }
      5:
        patterns:
          - { include: "#ExtraWhitespace" }
      6:
        tag: bracket
        name: punctuation.definition.position.sd

  DialogueCharacterPositionContent:
    match: (.+$)

  Action:
    patterns:
      - { include: "#BlockAction" }
      - { include: "#InlineAction" }
      - { include: "#ImplicitAction" }

  BlockAction:
    begin: ^({{WS}}*)([:])({{WS}}*)(?={{EOL}})
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#ColonSeparator" }
      3:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#SparkdownBlockComment" }
      - { include: "#SparkdownLineComment" }
      - { include: "#Annotation" }
      - { include: "#Newline" }
      - { include: "#BlockLineBlank" }
      - { include: "#BlockActionLineContinue" }
    end: (?=^(?!$|//|{{SPARKDOWN_BLOCK_COMMENT_START}}|\1{{WS}}))
  InlineAction:
    begin: (?<![}])({{WS}}*)(?:({{LEADING_GLUE}})|([:])($|{{WS}}+))
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LeadingGlue" }
      3:
        patterns:
          - { include: "#ColonOperator" }
      4:
        patterns:
          - { include: "#RequiredWhitespace" }
    patterns:
      - { include: "#Annotation" }
      - { include: "#Newline" }
      - { include: "#ActionLineChain" }
      - { include: "#AssetLine" }
      - { include: "#ParentheticalLine" }
      - { include: "#ActionLineEnd" }
      - { include: "#ExtraWhitespace" }
    end: (?=^{{WS}}*$)|(?=\r\n|\r|\n)|{{NOT_TAG_HASH_AFTER_TEXT}}
  ImplicitAction:
    begin: ({{WS}}*)(?!{{END}})(?=\S)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#Annotation" }
      - { include: "#Newline" }
      - { include: "#ActionLineChain" }
      - { include: "#AssetLine" }
      - { include: "#ParentheticalLine" }
      - { include: "#ActionLineEnd" }
      - { include: "#ExtraWhitespace" }
    end: (?=^{{WS}}*$)|(?=\r\n|\r|\n)|{{NOT_TAG_HASH_AFTER_TEXT}}
  BlockActionLineContinue:
    # lookaround: BlockLineBlank owns empty lines. Ordering already tries it
    # first, but this nullable begin can reopen at its end; splitting a Switch
    # does not prevent that. The parent's end bounds indentation, not emptiness.
    # No variable consumes the first display token, which must remain in the body.
    begin: ({{WS}}*)(?=\S)({{LEADING_GLUE}})?
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LeadingGlue" }
    patterns:
      - { include: "#AssetLine" }
      - { include: "#ParentheticalLine" }
      - { include: "#ActionDisplayLine" }
    end: ({{WS}}*)(?={{EOL}})
    endCaptures:
      1:
        patterns:
          - { include: "#Whitespace" }

  ActionLineChain:
    match: ({{WS}}*)({{DISPLAY_CHAIN_TEXT}})({{CHAIN}}{{DISPLAY_CHAIN_SEPARATOR}})({{EOL}})(\r\n|\r|\n)?
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#ActionLoadKeyword" }
          - { include: "#DisplayLine" }
      3:
        patterns:
          - { include: "#Chain" }
      4:
        patterns:
          - { include: "#EndOfLine" }
      5:
        patterns:
          - { include: "#Newline" }

  ActionLineChainTail:
    match: ({{DISPLAY_CHAIN_TEXT}})({{DISPLAY_CHAIN_MARK}})({{DISPLAY_CHAIN_COMMENTS}})({{EOL}})(\r\n|\r|\n)?
    captures:
      1:
        patterns:
          - { include: "#ActionLoadKeyword" }
          - { include: "#DisplayLine" }
      2:
        patterns:
          - { include: "#Chain" }
      3:
        patterns:
          - { include: "#SparkdownBlockComment" }
          - { include: "#SparkdownInlineComment" }
      4:
        patterns:
          - { include: "#EndOfLine" }
      5:
        patterns:
          - { include: "#Newline" }

  ActionLineEnd:
    # lookaround: Annotation and ExtraWhitespace own the EOL suffix. They
    # cannot win merely by reordering while this nullable begin can reopen;
    # splitting a Switch has the same issue. The parent's end leaves whitespace
    # before tags to children. Tightening WS would lose indentation captures;
    # the first nonspace display token must remain unconsumed for the body.
    # The end leaves a tag that ends in a chain mark to ActionLineChainTail
    # (DISPLAY_CHAIN_TAG_TAIL).
    begin: ({{WS}}*)(?!{{EOL}})(?=\S)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#ActionLineChainTail" }
      - { include: "#ActionDisplayLine" }
    end: (?!{{DISPLAY_CHAIN_TAG_TAIL}})(?={{EOL}})

  ActionDisplayLine:
    patterns:
      - { include: "#ActionLoadKeyword" }
      - { include: "#DisplayLine" }

  ActionLoadKeyword:
    match: ({{WS}}*)({{LOAD_CONTROL_KEYWORDS}}{{WS}})
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#DisplayLoadKeyword" }

  ParentheticalLine:
    match: ({{WS}}*)((?:[=].*?[=]|[<].*?[>]|{{WS}}+(?!{{WS}}))*)({{WS}}*)([(][^()\r\n]*?[)])({{WS}}*)((?:[=].*?[=]|[<].*?[>]|{{WS}}+(?!{{WS}}))*)($|{{EOL}}|(?={{BREAK}})|{{CHAIN}}(?:{{WS}}))
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#TextCommand" }
          - { include: "#ExtraWhitespace" }
      3:
        patterns:
          - { include: "#ExtraWhitespace" }
      4:
        patterns:
          - { include: "#ParentheticalLineContent" }
      5:
        patterns:
          - { include: "#ExtraWhitespace" }
      6:
        patterns:
          - { include: "#TextCommand" }
          - { include: "#ExtraWhitespace" }
      7:
        patterns:
          - { include: "#EndOfLine" }
          - { include: "#Chain" }

  ParentheticalLineContent:
    tag: escape
    name: constant.character.escape.sd
    match: ({{WS}}*)([(])({{WS}}*)([^()\r\n]*?)({{WS}}*)([)])({{WS}}*)
    captures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        tag: paren
        name: meta.brace.round.open.sd
      3:
        patterns:
          - { include: "#ExtraWhitespace" }
      4:
        patterns:
          - { include: "#DisplayText" }
      5:
        patterns:
          - { include: "#ExtraWhitespace" }
      6:
        tag: paren
        name: meta.brace.round.close.sd
      7:
        patterns:
          - { include: "#ExtraWhitespace" }

  BlockLineContinue:
    begin: ({{WS}}*)(?=\S)({{LEADING_GLUE}})?
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LeadingGlue" }
    patterns:
      - { include: "#AssetLine" }
      - { include: "#ParentheticalLine" }
      - { include: "#DisplayLine" }
    end: ({{WS}}*)(?={{EOL}})
    endCaptures:
      1:
        patterns:
          - { include: "#Whitespace" }

  BlockLineBlank:
    match: ^({{WS}}+$)
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }

  LineChain:
    match: ({{WS}}*)({{DISPLAY_CHAIN_TEXT}})({{CHAIN}}{{DISPLAY_CHAIN_SEPARATOR}})({{EOL}})(\r\n|\r|\n)?
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#DisplayLine" }
      3:
        patterns:
          - { include: "#Chain" }
      4:
        patterns:
          - { include: "#EndOfLine" }
      5:
        patterns:
          - { include: "#Newline" }

  LineChainTail:
    match: ({{DISPLAY_CHAIN_TEXT}})({{DISPLAY_CHAIN_MARK}})({{DISPLAY_CHAIN_COMMENTS}})({{EOL}})(\r\n|\r|\n)?
    captures:
      1:
        patterns:
          - { include: "#DisplayLine" }
      2:
        patterns:
          - { include: "#Chain" }
      3:
        patterns:
          - { include: "#SparkdownBlockComment" }
          - { include: "#SparkdownInlineComment" }
      4:
        patterns:
          - { include: "#EndOfLine" }
      5:
        patterns:
          - { include: "#Newline" }

  LineEnd:
    # lookaround: as ActionLineEnd's, whose comment names the rivals of the
    # begin; the end leaves a tag that ends in a chain mark to LineChainTail
    # (DISPLAY_CHAIN_TAG_TAIL).
    begin: ({{WS}}*)(?!{{EOL}})(?=\S)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LineChainTail" }
      - { include: "#DisplayLine" }
    end: (?!{{DISPLAY_CHAIN_TAG_TAIL}})(?={{EOL}})

  DisplayLine:
    patterns:
      - { include: "#DisplayLineCode" }
      - { include: "#SparkdownBlockComment" }
      - { include: "#DisplayLineText" }

  DisplayLineCode:
    patterns:
      - { include: "#Annotation" }
      - { include: "#Escape" }
      - { include: "#LuauFunctionCallShorthand" }
      - { include: "#LuauInterpolatedStringExpression" }
      - { include: "#ParentheticalLine" }
      - { include: "#Chain" }
      - { include: "#LuauSparkdownInlineGluedSequentialAlternatorBlock" }
      - { include: "#LuauSparkdownInlineGluedConditionalAlternatorBlock" }

  DisplayLineText:
    patterns:
      - { include: "#SparkdownInlineComment" }
      - { include: "#BreakLeadingGlue" }
      - { include: "#Break" }
      - { include: "#Glue" }
      - { include: "#TextChunk" }

  DisplayLoadKeyword:
    match: ({{LOAD_CONTROL_KEYWORDS}})({{WS}})
    captures:
      1:
        patterns:
          - { include: "#AssetCommandControl" }
      2:
        patterns:
          - { include: "#RequiredWhitespace" }

  TextChunk:
    tag: special(string)
    name: string.display.text.chunk.sd
    begin: (?=.+)
    patterns:
      - { include: "#DisplayText" }
    end: (?=$|{{WS}}*{{CHAIN}}(?:$|{{WS}})|{{GLUE}}|{{INLINE_GLUED_ALTERNATOR_START}}|{{EOL}}|{{WS}}*[/]{2}(?=$|{{WS}})|{{WS}}*{{SPARKDOWN_BLOCK_COMMENT_START}}|{{WS}}*{{BREAK_MARK}})

  DisplayText:
    patterns:
      - { include: "#Annotation" }
      - { include: "#Escape" }
      - { include: "#ImageCommand" }
      - { include: "#AudioCommand" }
      - { include: "#InlineTextAndLogic" }

  ImageLine:
    match: ^({{WS}}*)(?=\S)((?:\[\[{{IMAGE_COMMAND_CHAR}}*?\]\]|{{WS}}+)+)({{EOL}})
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#ImageCommand" }
          - { include: "#ExtraWhitespace" }
      3:
        patterns:
          - { include: "#EndOfLine" }

  AudioLine:
    match: ^({{WS}}*)(?=\S)((?:[(][(]{{AUDIO_COMMAND_CHAR}}*?[)][)]|{{WS}}+)+)({{EOL}})
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#AudioCommand" }
          - { include: "#ExtraWhitespace" }
      3:
        patterns:
          - { include: "#EndOfLine" }

  ImageAndAudioLine:
    match: ^({{WS}}*)(?=\S)((?:\[\[{{IMAGE_COMMAND_CHAR}}*?\]\]|[(][(]{{AUDIO_COMMAND_CHAR}}*?[)][)]|{{WS}}+)+)({{EOL}})
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#ImageCommand" }
          - { include: "#AudioCommand" }
          - { include: "#ExtraWhitespace" }
      3:
        patterns:
          - { include: "#EndOfLine" }

  AssetLine:
    patterns:
      - { include: "#ImageLine" }
      - { include: "#AudioLine" }
      - { include: "#ImageAndAudioLine" }

  ImageCommand:
    tag: macroName
    name: meta.image.sd
    brackets: true
    begin: (\[\[)({{DIRECTIVE_SPACE}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#ImageBeginMark" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#ImageCommandContent" }
    end: $|({{DIRECTIVE_SPACE}}*)(\]\])({{WS}}*)
    endCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#ImageEndMark" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  ImageCommandContent:
    match: ({{SPAN_DOUBLE_BRACKET_TEXT}}+)
    captures:
      1:
        patterns:
          - { include: "#ImageCommandWords" }

  ImageCommandWords:
    patterns:
      - { include: "#ImageCommandNavigation" }
      - { include: "#ImageCommandControlled" }
      - { include: "#AssetCommandUncontrolled" }

  ImageCommandNavigation:
    match: ({{NAVIGATE_CONTROL_KEYWORDS}})(?:{{_DIRECTIVE_NAVIGATE_TO_}}|({{DIRECTIVE_LATER_CLAUSES}})|{{_DIRECTIVE_NAVIGATE_SCREEN_}})?{{_DIRECTIVE_TAG_AND_END_}}
    captures:
      1:
        patterns:
          - { include: "#AssetCommandControl" }
      2:
        patterns:
          - { include: "#RequiredWhitespace" }
      3:
        patterns:
          - { include: "#AssetCommandClauses" }
      4:
        patterns:
          - { include: "#AssetCommandClauses" }
      5:
        patterns:
          - { include: "#AssetCommandClauses" }
      6:
        patterns:
          - { include: "#RequiredWhitespace" }
      7:
        patterns:
          - { include: "#AssetCommandTarget" }
      8:
        patterns:
          - { include: "#RequiredWhitespace" }
      9:
        patterns:
          - { include: "#AssetCommandClauses" }
      10:
        patterns:
          - { include: "#AssetCommandClauses" }
      11:
        patterns:
          - { include: "#Annotation" }
      12:
        patterns:
          - { include: "#ExtraWhitespace" }

  ImageCommandControlled:
    match: ({{IMAGE_DIRECTIVE_CONTROL}}){{_DIRECTIVE_CONTROLLED_WORDS_}}
    captures:
      1:
        patterns:
          - { include: "#AssetCommandControl" }
      2:
        patterns:
          - { include: "#RequiredWhitespace" }
      3:
        patterns:
          - { include: "#AssetCommandTarget" }
      4:
        patterns:
          - { include: "#AssetCommandNames" }
      5:
        patterns:
          - { include: "#AssetCommandClauses" }
      6:
        patterns:
          - { include: "#Annotation" }
      7:
        patterns:
          - { include: "#ExtraWhitespace" }

  AudioCommand:
    tag: macroName
    name: meta.audio.sd
    brackets: true
    begin: ([(][(])({{DIRECTIVE_SPACE}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#AudioBeginMark" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#AudioCommandContent" }
    end: $|({{DIRECTIVE_SPACE}}*)([)][)])({{WS}}*)
    endCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#AudioEndMark" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  AudioCommandContent:
    match: ({{SPAN_DOUBLE_PAREN_TEXT}}+)
    captures:
      1:
        patterns:
          - { include: "#AudioCommandWords" }

  AudioCommandWords:
    patterns:
      - { include: "#AudioCommandControlled" }
      - { include: "#AssetCommandUncontrolled" }

  AudioCommandControlled:
    match: ({{DIRECTIVE_CONTROL}}){{_DIRECTIVE_CONTROLLED_WORDS_}}
    captures:
      1:
        patterns:
          - { include: "#AssetCommandControl" }
      2:
        patterns:
          - { include: "#RequiredWhitespace" }
      3:
        patterns:
          - { include: "#AssetCommandTarget" }
      4:
        patterns:
          - { include: "#AssetCommandNames" }
      5:
        patterns:
          - { include: "#AssetCommandClauses" }
      6:
        patterns:
          - { include: "#Annotation" }
      7:
        patterns:
          - { include: "#ExtraWhitespace" }

  AssetCommandUncontrolled:
    patterns:
      - { include: "#AssetCommandClausesFirst" }
      - { include: "#AssetCommandTagFirst" }
      - { include: "#AssetCommandNamesFirst" }

  AssetCommandClausesFirst:
    match: ({{DIRECTIVE_FIRST_CLAUSES}}){{_DIRECTIVE_TAG_AND_END_}}
    captures:
      1:
        patterns:
          - { include: "#AssetCommandClauses" }
      2:
        patterns:
          - { include: "#Annotation" }
      3:
        patterns:
          - { include: "#ExtraWhitespace" }

  AssetCommandTagFirst:
    match: ({{DIRECTIVE_TAG}}){{_DIRECTIVE_END_}}
    captures:
      1:
        patterns:
          - { include: "#Annotation" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }

  AssetCommandNamesFirst:
    match: ({{DIRECTIVE_WORD}}{{DIRECTIVE_NAMES}})({{DIRECTIVE_LATER_CLAUSES}}?){{_DIRECTIVE_TAG_AND_END_}}
    captures:
      1:
        patterns:
          - { include: "#AssetCommandNames" }
      2:
        patterns:
          - { include: "#AssetCommandClauses" }
      3:
        patterns:
          - { include: "#Annotation" }
      4:
        patterns:
          - { include: "#ExtraWhitespace" }

  AssetCommandNames:
    patterns:
      - { include: "#AssetCommandSeparator" }
      - { include: "#AssetCommandAddOperator" }
      - { include: "#AssetCommandNoneName" }
      - { include: "#AssetCommandName" }

  AssetCommandClauses:
    patterns:
      - { include: "#AssetCommandSeparator" }
      - { include: "#AssetCommandValueClause" }
      - { include: "#AssetCommandBareClause" }
      - { include: "#AssetCommandClauseValue" }

  AssetCommandSeparator:
    match: ({{DIRECTIVE_SEPARATOR}})
    captures:
      1:
        patterns:
          - { include: "#RequiredWhitespace" }

  AssetCommandValueClause:
    match: ({{ASSET_VALUE_CLAUSE_KEYWORDS}})({{DIRECTIVE_SEPARATOR}})({{DIRECTIVE_WORD}})
    captures:
      1:
        patterns:
          - { include: "#AssetCommandClauseKeyword" }
      2:
        patterns:
          - { include: "#RequiredWhitespace" }
      3:
        patterns:
          - { include: "#AssetCommandClauseValue" }

  AssetCommandBareClause:
    match: ({{DIRECTIVE_CLAUSE_WORD}})({{DIRECTIVE_SEPARATOR}}|$)
    captures:
      1:
        patterns:
          - { include: "#AssetCommandClauseKeyword" }
      2:
        patterns:
          - { include: "#RequiredWhitespace" }

  AssetCommandClauseValue:
    match: ({{DIRECTIVE_WORD}})
    captures:
      1:
        patterns:
          - { include: "#TimeValue" }
          - { include: "#NumberValue" }
          - { include: "#NameValue" }
          - { include: "#IllegalChar" }

  ImageBeginMark:
    tag: keyword
    name: keyword.operator.expression.begin.image.sd

  ImageEndMark:
    tag: keyword
    name: keyword.operator.expression.end.image.sd

  AudioBeginMark:
    tag: keyword
    name: keyword.operator.expression.begin.audio.sd

  AudioEndMark:
    tag: keyword
    name: keyword.operator.expression.end.audio.sd

  AssetCommandControl:
    tag: controlKeyword
    name: keyword.control.asset.control.sd

  AssetCommandTarget:
    tag: typeName
    name: entity.name.type.asset.target.sd

  AssetCommandClauseKeyword:
    tag: keyword
    name: keyword.asset.clause.keyword.sd
    match: ({{IMAGE_CLAUSE_KEYWORDS}}|{{AUDIO_CLAUSE_KEYWORDS}})

  AssetCommandName:
    match: ({{DIRECTIVE_NAME_TEXT}})
    captures:
      1:
        patterns:
          - { include: "#LuauString" }
          - { include: "#AssetCommandFilteredFileName" }
          - { include: "#AssetCommandFileName" }
          - { include: "#AssetCommandFilter" }
          - { include: "#IllegalChar" }

  AssetCommandNoneName:
    match: (none)({{ASSET_FILTERS}}?)(?:([+])|({{DIRECTIVE_SEPARATOR}})|$)
    captures:
      1:
        patterns:
          - { include: "#AssetCommandKeywordNone" }
      2:
        patterns:
          - { include: "#AssetCommandFilter" }
      3:
        patterns:
          - { include: "#AssetCommandAddOperator" }
      4:
        patterns:
          - { include: "#RequiredWhitespace" }

  AssetCommandKeywordNone:
    tag: keyword
    name: keyword.asset.keyword.none.sd
    match: (none)

  AssetCommandFilteredFileName:
    tag: constant(variableName)
    name: variable.other.constant.asset.file.sd
    match: ({{IDENTIFIER}})({{ASSET_FILTERS}})
    captures:
      1:
        patterns:
          - { include: "#AssetCommandFileName" }
      2:
        patterns:
          - { include: "#AssetCommandFilter" }

  AssetCommandFileName:
    tag: constant(variableName)
    name: variable.other.constant.asset.file.sd
    match: ({{IDENTIFIER}})

  AssetCommandAddOperator:
    tag: propertyName
    name: variable.other.property.add.sd
    match: ([+])

  AssetCommandFilter:
    match: ([:~])($|[^:~\s]+)?
    captures:
      1:
        patterns:
          - { include: "#AssetCommandFilterOperator" }
      2:
        patterns:
          - { include: "#AssetCommandFilterName" }

  AssetCommandFilterOperator:
    tag: propertyName
    name: variable.other.property.filter.sd
    match: ([:~])

  AssetCommandFilterName:
    tag: constant(variableName)
    name: variable.other.constant.asset.filter.sd
    match: ([a-zA-Z_][a-zA-Z0-9_-]*(?:[.][a-zA-Z_][a-zA-Z0-9_-]*)*)

  TimeValue:
    tag: number
    name: constant.numeric.time.sd
    match: ([-]?(?:\d*[.])?\d+)(ms|s)(?=$|{{WS}})
    captures:
      1:
        tag: number
        name: constant.numeric.time.amount.sd
      2:
        tag: number
        name: constant.numeric.time.unit.sd

  NumberValue:
    tag: number
    name: constant.numeric.number.sd
    match: ([-]?(?:\d*[.])?\d+)(?=$|{{WS}})

  NameValue:
    tag: constant(variableName)
    name: variable.other.constant.sd
    match: ({{IDENTIFIER}})(?=$|{{WS}})

  # lookaround: Punctuation takes a `<` before whitespace, which never opens a
  # command, as SPAN_COMMAND_TAIL reads it.
  TextCommand:
    tag: macroName
    name: meta.text.sd
    match: ([<](?!{{WS}}))({{TEXT_COMMAND_CONTENT}})([>])
    captures:
      1:
        tag: keyword
        name: keyword.operator.expression.begin.tag.sd
      2:
        patterns:
          - { include: "#TextCommandContent" }
      3:
        tag: keyword
        name: keyword.operator.expression.end.tag.sd

  TextCommandContent:
    match: ({{WS}}*)([^ :\r\n]+)({{WS}}*)(?:([:])({{WS}}*)(.*))?
    captures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#TextCommandControl" }
      3:
        patterns:
          - { include: "#ExtraWhitespace" }
      4:
        patterns:
          - { include: "#ColonOperator" }
      5:
        patterns:
          - { include: "#ExtraWhitespace" }
      6:
        patterns:
          - { include: "#TextCommandArguments" }

  TextCommandControl:
    captures:
      1:
        patterns:
          - { include: "#LuauNumber" }
          - { include: "#TextCommandControlKeyword" }

  TextCommandControlKeyword:
    tag: keyword
    name: keyword.style.control.keyword.sd

  TextCommandArguments:
    captures:
      1:
        patterns:
          - { include: "#TextCommandArgument" }

  TextCommandArgument:
    tag: meta
    name: meta.argument.sd
    begin: (?=.+$)
    patterns:
      - { include: "#Annotation" }
      - { include: "#LuauExpression" }
    end: (?=$)|([,])
    endCaptures:
      1:
        tag: separator
        name: meta.template.expression.comma.sd

  InlineTextAndLogic:
    patterns:
      - { include: "#Escape" }
      - { include: "#Divert" }
      - { include: "#Thread" }
      - { include: "#LuauFunctionCallShorthand" }
      - { include: "#LuauInterpolatedStringExpression" }
      - { include: "#LuauSparkdownInlineGluedSequentialAlternatorBlock" }
      - { include: "#LuauSparkdownInlineGluedConditionalAlternatorBlock" }
      - { include: "#AudioCommand" }
      - { include: "#ImageCommand" }
      - { include: "#InlineText" }

  InlineText:
    patterns:
      - { include: "#Escape" }
      - { include: "#Raw" }
      - { include: "#Styling" }
      - { include: "#Emphasis" }
      - { include: "#PlainText" }

  Escape:
    match: (?:^(\\)({{WS}})|(?<!^)(\\)({{WS}})|(\\)(\S))
    captures:
      1:
        tag: definition(escape)
        name: constant.character.escape.sd
      2:
        tag: content
        name: markup.raw.text.sd
      3:
        tag: definition(escape)
        name: constant.character.escape.sd
      4:
        tag: content
        name: markup.raw.text.sd
      5:
        tag: definition(escape)
        name: constant.character.escape.sd
      6:
        tag: content
        name: markup.raw.text.sd

  Styling:
    patterns:
      - { include: "#Glue" }
      - { include: "#TextCommand" }
      - { include: "#Underline" }
      - { include: "#Bold" }
      - { include: "#Italic" }
      - { include: "#Centered" }

  SpanOpenMark:
    captures:
      1:
        tag: definition(content)
        name: markup.raw.text.sd

  SpanCloseMark:
    captures:
      1:
        tag: definition(content)
        name: markup.raw.text.sd

  # lookaround: a backtick run opens Raw only where the next run of its length
  # closes it; Punctuation takes it otherwise.
  Raw:
    tag: content
    name: markup.raw.text.sd
    match: (?<![`])([`]+)(?![`])({{RAW_CONTENT}})(\1)(?![`])
    captures:
      1:
        patterns:
          - { include: "#SpanOpenMark" }
      2:
        patterns:
          - { include: "#RawContent" }
      3:
        patterns:
          - { include: "#SpanCloseMark" }

  Bold:
    tag: strong
    name: markup.other.bold.sd
    match: ({{STAR_LEFT}}[*][*])({{STAR_BOLD_CONTENT}})({{STAR_CLOSE_BOLD}}[*][*])
    captures:
      1:
        patterns:
          - { include: "#SpanOpenMark" }
      2:
        patterns:
          - { include: "#SpanContent" }
      3:
        patterns:
          - { include: "#SpanCloseMark" }

  Italic:
    tag: emphasis
    name: markup.other.italic.sd
    match: ({{STAR_LEFT}}[*])({{STAR_ITALIC_CONTENT}})({{STAR_CLOSE_ITALIC}}[*])
    captures:
      1:
        patterns:
          - { include: "#SpanOpenMark" }
      2:
        patterns:
          - { include: "#SpanContent" }
      3:
        patterns:
          - { include: "#SpanCloseMark" }

  # lookaround: as UNDERSCORE_SHORTER; the opener takes the rest of its run.
  Underline:
    tag: link
    name: markup.other.underline.sd
    match: ({{UNDERSCORE_OPEN}}[_]+)(?![_])({{UNDERSCORE_CONTENT}})({{UNDERSCORE_CLOSE}}\1)
    captures:
      1:
        patterns:
          - { include: "#SpanOpenMark" }
      2:
        patterns:
          - { include: "#SpanContent" }
      3:
        patterns:
          - { include: "#SpanCloseMark" }

  # lookaround: as CARET_SHORTER; the opener takes the rest of its run.
  Centered:
    tag: monospace
    name: constant.character.escape.centered.sd
    match: ({{CARET_LEFT}}[\^]+)(?![\^])({{CARET_CONTENT}})({{CARET_RIGHT}}\1)
    captures:
      1:
        patterns:
          - { include: "#SpanOpenMark" }
      2:
        patterns:
          - { include: "#SpanContent" }
      3:
        patterns:
          - { include: "#SpanCloseMark" }

  Emphasis:
    patterns:
      - { include: "#EmphasisTilde" }
      - { include: "#EmphasisColon" }

  # lookaround: as TILDE_SHORTER; the opener takes the rest of its run.
  EmphasisTilde:
    tag: quote
    name: markup.emphasis.tilde.sd
    match: ({{TILDE_LEFT}}[~][~]+)(?![~])({{TILDE_CONTENT}})({{TILDE_RIGHT}}\1)
    captures:
      1:
        patterns:
          - { include: "#SpanOpenMark" }
      2:
        patterns:
          - { include: "#SpanContent" }
      3:
        patterns:
          - { include: "#SpanCloseMark" }

  # lookaround: as COLON_SHORTER; the opener takes the rest of its run.
  EmphasisColon:
    tag: quote
    name: markup.emphasis.colon.sd
    match: ({{COLON_LEFT}}[:][:]+)(?![:])({{COLON_CONTENT}})({{COLON_RIGHT}}\1)
    captures:
      1:
        patterns:
          - { include: "#SpanOpenMark" }
      2:
        patterns:
          - { include: "#SpanContent" }
      3:
        patterns:
          - { include: "#SpanCloseMark" }

  SpanContent:
    patterns:
      - { include: "#SpanEndDots" }
      - { include: "#SparkdownBlockCommentOnLine" }
      - { include: "#InlineTextAndLogic" }

  # lookaround: Glue reads `..` at a line's end, which a span's content
  # capture ends like a line; the dots before the span's closer are its text.
  SpanEndDots:
    match: ((?<![.])[.][.]$)
    captures:
      1:
        patterns:
          - { include: "#PlainText" }

  RawContent:
    patterns:
      - { include: "#PlainText" }

  PlainText:
    patterns:
      - { include: "#Newline" }
      - { include: "#Space" }
      - { include: "#Word" }
      - { include: "#Punctuation" }

  Space:
    tag: content
    name: markup.raw.space.sd
    match: ([ ])

  Word:
    tag: content
    name: markup.raw.text.sd
    match: ({{WORD}})

  Punctuation:
    tag: content
    name: markup.raw.punctuation.sd
    match: (.)

  IllegalChar:
    tag: invalid
    name: invalid.illegal.illegal-char.sd
    match: (.)

  Unknown:
    tag: invalid
    name: invalid.illegal.unknown-statement.sd
    match: (.+$)

  StylingValue:
    match: "{{_STRUCT_VALUE_THEN_COMMENT_}}"
    captures:
      1:
        patterns:
          - { include: "#NumericFieldValue" }
          - { include: "#BooleanFieldValue" }
          - { include: "#StringFieldValue" }
      2:
        patterns:
          - { include: "#LuauComment" }
      3:
        patterns:
          - { include: "#LuauStructBlockValueComment" }
      4:
        patterns:
          - { include: "#StylingValueContent" }
      5:
        patterns:
          - { include: "#LuauComment" }
      6:
        patterns:
          - { include: "#LuauStructBlockValueComment" }
      7:
        patterns:
          - { include: "#EndOfLine" }

  StylingValueContent:
    match: (.+)
    captures:
      1:
        patterns:
          - { include: "#InlinePropQuotedValue" }
          - { include: "#StylingValuePart" }
          - { include: "#StylingStringIdentifier" }
          - { include: "#UnquotedChar" }

  NumericFieldValue:
    tag: number
    name: constant.numeric.sd
    match: ([-]?(?:\d*[.])?\d+|Infinity|NaN)({{WS}}*)$
    captures:
      1:
        patterns:
          - { include: "#NumericLiteral" }
      2:
        patterns:
          - { include: "#EndOfLine" }

  BooleanFieldValue:
    tag: bool
    name: constant.language.boolean.true.sd
    match: (true|false)({{WS}}*)$
    captures:
      1:
        patterns:
          - { include: "#BooleanLiteral" }
      2:
        patterns:
          - { include: "#EndOfLine" }

  StringFieldValue:
    tag: string
    name: string.quoted.double.sd
    match: (["])({{DOUBLE_QUOTED_CHAR}}*)(["])({{WS}}*)$
    captures:
      1:
        patterns:
          - { include: "#PunctuationStringOpen" }
      2:
        patterns:
          - { include: "#PlainStringContent" }
      3:
        patterns:
          - { include: "#PunctuationStringClose" }
      4:
        patterns:
          - { include: "#EndOfLine" }

  StringFieldValueInterpolated:
    tag: string
    name: string.quoted.double.sd
    begin: (["])(?=(?:[^"{\\\r\n]|\\.)*\{)
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationStringOpen" }
    patterns:
      - { include: "#LuauFunctionCallShorthand" }
      - { include: "#LuauInterpolatedStringExpression" }
      - { include: "#StringEscape" }
      - { include: "#SparkleRichTextTag" }
      - { include: "#SparkleRichTextTagUnknown" }
      - { include: "#Color" }
      - { include: "#StringCharacter" }
    end: (["])({{EOPL}})
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationStringClose" }
      2:
        patterns:
          - { include: "#EndOfLine" }

  UnquotedStringFieldValue:
    match: "{{_STRUCT_VALUE_THEN_COMMENT_}}"
    captures:
      1:
        patterns:
          - { include: "#NumericFieldValue" }
          - { include: "#BooleanFieldValue" }
          - { include: "#StringFieldValue" }
      2:
        patterns:
          - { include: "#LuauComment" }
      3:
        patterns:
          - { include: "#LuauStructBlockValueComment" }
      4:
        patterns:
          - { include: "#UnquotedString" }
      5:
        patterns:
          - { include: "#LuauComment" }
      6:
        patterns:
          - { include: "#LuauStructBlockValueComment" }
      7:
        patterns:
          - { include: "#EndOfLine" }

  StylingDeclarationScalarPropertyName:
    match: ({{STRICT_PROPERTY_IDENTIFIER}})
    captures:
      1:
        patterns:
          - { include: "#DeclarationScalarPropertyIndex" }
          - { include: "#DeclarationScalarPropertyQuotedKey" }
          - { include: "#DeclarationScalarPropertyKey" }

  DeclarationScalarPropertyIndex:
    tag: number
    name: constant.numeric.integer.sd
    match: ({{INTEGER}})

  SelectorPropertyNamePart:
    patterns:
      - { include: "#ParenPropertyIdentifierString" }
      - { include: "#BracketPropertyIdentifierString" }
      - { include: "#BracePropertyIdentifierString" }
      - { include: "#UnitValue" }
      - { include: "#NumericLiteral" }
      - { include: "#BooleanLiteral" }
      - { include: "#StringLiteral" }
      - { include: "#SelectorOperator" }
      - { include: "#RecursiveSelectorFunction" }
      - { include: "#SimpleSelectorFunction" }
      - { include: "#StyleAttribute" }
      - { include: "#SelectorAttribute" }
      - { include: "#LabelAttribute" }
      - { include: "#Separator" }

  ComponentName:
    patterns:
      - { include: "#BuiltinComponentName" }
      - { include: "#CustomComponentName" }
      - { include: "#FunctionCallParameters" }

  BuiltinComponentName:
    tag: definitionKeyword
    name: keyword.other.component.builtin.name.sd
    # eslint-disable-next-line sparkdown-grammar/no-handwritten-alternation
    match: "{{LUAU_NAME_START}}(ordered_list|preformatted|table_footer|table_header|table_body|paragraph|table_row|checkbox|citation|dropdown|emphasis|fieldset|progress|scroller|textarea|article|caption|divider|foldout|picture|section|button|figure|footer|header|legend|option|slider|stroke|strong|switch|block|image|input|label|modal|quote|radio|small|table|cell|code|form|head|item|link|list|mask|span|text|kbd|sub|sup|h1|h2|h3|h4|h5|h6)(?![-_\\p{L}]|[@][0-9_\\p{L}])"

  CustomComponentName:
    tag: className
    name: entity.name.type.class.view.sd
    match: ({{IDENTIFIER}})

  PropertyName:
    tag: propertyName
    name: variable.other.property.sd
    match: ({{IDENTIFIER}})(?![(])

  ParenPropertyIdentifierString:
    brackets: true
    begin: ([(])({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationParenOpen" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#SelectorPseudoClass" }
      - { include: "#SelectorPropertyNamePart" }
      - { include: "#LuauSparkleElementClass" }
      - { include: "#BuiltinComponentName" }
      - { include: "#CustomComponentName" }
    end: $|({{WS}}*)([)])
    endCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#PunctuationParenClose" }

  SelectorPseudoClass:
    match: ([:]{1,2})({{IDENTIFIER}})
    captures:
      1:
        patterns:
          - { include: "#SelectorPseudoClassOperator" }
      2:
        patterns:
          - { include: "#SelectorPseudoClassName" }

  SelectorPseudoClassOperator:
    tag: function(name)
    name: entity.name.function.attribute.name.view.sd
    match: (.+)

  SelectorPseudoClassName:
    tag: function(name)
    name: entity.name.function.attribute.name.view.sd
    match: (.+)

  BracketPropertyIdentifierString:
    brackets: true
    begin: (\[)({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationBracketOpen" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#SelectorPropertyNamePart" }
    end: $|({{WS}}*)(\])
    endCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#PunctuationBracketClose" }

  BracePropertyIdentifierString:
    brackets: true
    begin: (\{)({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationBraceOpen" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#SelectorPropertyNamePart" }
    end: $|({{WS}}*)(\})
    endCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#PunctuationBraceClose" }

  AssignEqualOperator:
    match: ({{WS}}*)([=])({{WS}}*)
    captures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalSeparator" }
      2:
        patterns:
          - { include: "#EqualOperator" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalSeparator" }

  UnitValue:
    match: ([-]?(?:\d*[.])?\d+)([%]|[a-zA-Z]+)
    captures:
      1:
        tag: number
        name: constant.numeric.amount.sd
      2:
        tag: number
        name: constant.numeric.unit.sd

  Ratio:
    match: ({{NUMBER}})({{WS}}*)([/])({{WS}}*)({{NUMBER}})
    captures:
      1:
        patterns:
          - { include: "#NumericLiteral" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
      3:
        patterns:
          - { include: "#CalcOperator" }
      4:
        patterns:
          - { include: "#ExtraWhitespace" }
      5:
        patterns:
          - { include: "#NumericLiteral" }

  CalcOperator:
    tag: keyword
    name: keyword.other.calc.operator.sd
    match: ([+]|[-]|[*]|[/])

  StylingFunction:
    begin: ({{IDENTIFIER}})({{WS}}*)(?=[(])
    beginCaptures:
      1:
        patterns:
          - { include: "#StylingFunctionName" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#StylingFunctionParameters" }
    applyEndPatternLast: true
    end: (?=$|.)

  StylingFunctionName:
    tag: function(name)
    name: entity.name.function.sd
    match: ({{IDENTIFIER}})

  StylingFunctionParameters:
    brackets: true
    begin: ([(])({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationParenOpen" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#CalcOperator" }
      - { include: "#StylingValuePart" }
      - { include: "#ParameterStringIdentifier" }
      - { include: "#UnquotedChar" }
    end: $|({{WS}}*)([)])
    endCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#PunctuationParenClose" }

  StylingValuePart:
    patterns:
      - { include: "#Separator" }
      - { include: "#Color" }
      - { include: "#Ratio" }
      - { include: "#UnitValue" }
      - { include: "#NumericLiteral" }
      - { include: "#PunctuationComma" }
      - { include: "#StylingFunction" }
      - { include: "#StylingAccessPath" }

  StylingStringIdentifier:
    tag: string
    name: string.unquoted.identifier.sd
    match: ({{IDENTIFIER}})

  UnquotedChar:
    tag: string
    name: string.unquoted.char.sd
    match: (.)

  StylingAccessPath:
    begin: (?={{IDENTIFIER}}[.])
    patterns:
      - { include: "#LuauComment" }
      - { include: "#StylingAccessPart" }
    end: (?=$)|(?!{{IDENTIFIER}}|[.])

  StylingAccessPart:
    emit: true
    patterns:
      - { include: "#PropertyAccessor" }
      - { include: "#NamespaceAccessor" }
      - { include: "#VariableName" }
      - { include: "#PunctuationAccessor" }

  NamespaceAccessor:
    match: ({{IDENTIFIER}})([.])($|{{IDENTIFIER}})(?![(])
    captures:
      1:
        patterns:
          - { include: "#TypeName" }
      2:
        patterns:
          - { include: "#PunctuationAccessor" }
      3:
        patterns:
          - { include: "#VariableName" }

  PropertyAccessor:
    match: ([.])({{IDENTIFIER}})(?![(])
    captures:
      1:
        patterns:
          - { include: "#PunctuationAccessor" }
      2:
        patterns:
          - { include: "#PropertyName" }

  TypeName:
    tag: typeName
    name: support.type.sd
    match: ({{IDENTIFIER}})

  VariableName:
    tag: constant(variableName)
    name: variable.other.constant.sd
    match: ({{IDENTIFIER}})(?![(])

  NumericLiteral:
    patterns:
      - { include: "#NumberLiteral" }
      - { include: "#NumericConstantLiteral" }

  BooleanLiteral:
    patterns:
      - { include: "#BooleanTrue" }
      - { include: "#BooleanFalse" }

  PunctuationStringOpen:
    match: (["])
    tag: string
    name: punctuation.definition.string.begin.sd

  PlainStringContent:
    match: ({{DOUBLE_QUOTED_CHAR}}*?)(?=$|")
    captures:
      1:
        patterns:
          - { include: "#StringEscape" }
          - { include: "#SparkleRichTextTag" }
          - { include: "#SparkleRichTextTagUnknown" }
          - { include: "#Color" }
          - { include: "#StringCharacter" }

  PunctuationStringClose:
    match: (["])
    tag: string
    name: punctuation.definition.string.end.sd

  UnquotedString:
    tag: string
    name: string.unquoted.sd
    match: (.+)

  DeclarationScalarPropertyQuotedKey:
    tag: string
    name: string.quoted.key.sd
    match: ({{QUOTED_STRING}})

  DeclarationScalarPropertyKey:
    tag: propertyName
    name: variable.other.property.define.sd
    match: ({{IDENTIFIER}})

  SelectorOperator:
    tag: keyword
    name: keyword.other.selector.operator.sd
    match: ([>]|[+]|[~]|[*]|[&]|[\^])

  RecursiveSelectorFunction:
    begin: ([@])({{SELECTOR_FUNCTION_NAMES}})(?=[(])
    beginCaptures:
      1:
        patterns:
          - { include: "#SelectorStateOperator" }
      2:
        patterns:
          - { include: "#SelectorStateName" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#RecursiveSelectorFunctionParameters" }
    applyEndPatternLast: true
    end: (?=$|.)

  SimpleSelectorFunction:
    begin: ([@])({{IDENTIFIER}})?(?=[(])
    beginCaptures:
      1:
        patterns:
          - { include: "#SelectorStateOperator" }
      2:
        patterns:
          - { include: "#SelectorStateName" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#SimpleSelectorFunctionParameters" }
    applyEndPatternLast: true
    end: (?=$|.)

  StyleAttribute:
    emit: true
    patterns:
      - { include: "#AssignedBracedStyleAttribute" }
      - { include: "#AssignedQuotedStyleAttribute" }
      - { include: "#AssignedUnquotedStyleAttribute" }
      - { include: "#UnassignedStyleAttribute" }

  SelectorAttribute:
    emit: true
    patterns:
      - { include: "#AssignedBracedSelectorAttribute" }
      - { include: "#AssignedQuotedSelectorAttribute" }
      - { include: "#AssignedUnquotedSelectorAttribute" }
      - { include: "#UnassignedSelectorAttribute" }

  LabelAttribute:
    emit: true
    patterns:
      - { include: "#StringLiteral" }

  Separator:
    tag: definition(content)
    name: markup.raw.whitespace.separator.sd
    match: ({{WS}}+)

  FunctionCallParameters:
    brackets: true
    begin: ([(])({{WS}}*)
    beginCaptures:
      1:
        tag: keyword
        name: punctuation.definition.template-expression.begin.sd
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#Separator" }
      - { include: "#PunctuationComma" }
      - { include: "#Parameter" }
    end: $|({{WS}}*)([)])
    endCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        tag: keyword
        name: punctuation.definition.template-expression.end.sd

  OptionalSeparator:
    tag: definition(content)
    name: markup.raw.whitespace.separator.optional.sd
    match: ({{WS}}*)

  EqualOperator:
    tag: updateOperator
    name: keyword.operator.assignment.sd
    match: ([=])

  ParameterStringIdentifier:
    tag: string
    name: string.unquoted.identifier.sd
    match: ({{IDENTIFIER}})

  PunctuationComma:
    tag: operator
    name: keyword.operator.comma.sd
    match: ([,])

  NumberLiteral:
    tag: number
    name: constant.numeric.sd
    match: ([-]?(?:\d*[.])?\d+)

  NumericConstantLiteral:
    patterns:
      - { include: "#Infinity" }
      - { include: "#NaN" }

  BooleanTrue:
    tag: bool
    name: constant.language.boolean.true.sd
    match: "{{BEFORE_KEYWORD}}true{{AFTER_KEYWORD}}"

  BooleanFalse:
    tag: bool
    name: constant.language.boolean.false.sd
    match: "{{BEFORE_KEYWORD}}false{{AFTER_KEYWORD}}"

  StringEscape:
    match: (\\)(.)
    captures:
      1:
        tag: definition(escape)
        name: constant.character.escape.sd
      2:
        tag: content
        name: markup.raw.whitespace.sd

  StringCharacter:
    tag: content
    name: markup.raw.whitespace.sd
    match: (.)

  EventAttributeOperator:
    tag: function(name)
    name: entity.name.function.attribute.name.view.sd
    match: ([@])

  EventAttributeName:
    tag: function(name)
    name: entity.name.function.attribute.name.view.sd
    match: (.+)

  SelectorStateOperator:
    tag: function(name)
    name: entity.name.function.attribute.name.view.sd
    match: ([@])

  SelectorStateName:
    tag: function(name)
    name: entity.name.function.attribute.name.view.sd
    match: (.+)

  RecursiveSelectorFunctionParameters:
    brackets: true
    begin: ([(])({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationParenOpen" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#SelectorPropertyNamePart" }
      - { include: "#ComponentName" }
      - { include: "#IllegalChar" }
    end: $|({{WS}}*)([)])
    endCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#PunctuationParenClose" }

  SimpleSelectorFunctionParameters:
    brackets: true
    begin: ([(])({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationParenOpen" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#SelectorPropertyNamePart" }
      - { include: "#ParameterStringIdentifier" }
      - { include: "#IllegalChar" }
    end: $|({{WS}}*)([)])
    endCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#PunctuationParenClose" }

  AssignedBracedStyleAttribute:
    begin: ([#])({{IDENTIFIER}})?({{COMPARISON_OPERATOR}})?([=])([{])
    beginCaptures:
      1:
        patterns:
          - { include: "#StyleAttributeOperator" }
      2:
        patterns:
          - { include: "#StyleAttributeName" }
      3:
        patterns:
          - { include: "#ComparisonOperator" }
      4:
        patterns:
          - { include: "#EqualOperator" }
      5:
        patterns:
          - { include: "#PunctuationBraceOpen" }
    patterns:
      - { include: "#LuauComment" }
    end: ([}])
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationBraceClose" }

  AssignedQuotedStyleAttribute:
    tag: string
    name: string.quoted.double.view.sd
    begin: ([#])({{IDENTIFIER}})?({{COMPARISON_OPERATOR}})?([=])(["])
    beginCaptures:
      1:
        patterns:
          - { include: "#StyleAttributeOperator" }
      2:
        patterns:
          - { include: "#StyleAttributeName" }
      3:
        patterns:
          - { include: "#ComparisonOperator" }
      4:
        patterns:
          - { include: "#EqualOperator" }
      5:
        patterns:
          - { include: "#PunctuationStringOpen" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#StringContent" }
    end: $|(["])
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationStringClose" }

  AssignedUnquotedStyleAttribute:
    begin: ([#])({{IDENTIFIER}})?({{COMPARISON_OPERATOR}})?([=])
    beginCaptures:
      1:
        patterns:
          - { include: "#StyleAttributeOperator" }
      2:
        patterns:
          - { include: "#StyleAttributeName" }
      3:
        patterns:
          - { include: "#ComparisonOperator" }
      4:
        patterns:
          - { include: "#EqualOperator" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#UnquotedStyleAttributeValue" }
    end: (?={{UNQUOTED_STRING_TERMINATOR}})

  UnassignedStyleAttribute:
    match: ([#])({{IDENTIFIER}})?
    captures:
      1:
        patterns:
          - { include: "#StyleAttributeOperator" }
      2:
        patterns:
          - { include: "#StyleAttributeName" }

  AssignedBracedSelectorAttribute:
    begin: ([@])({{IDENTIFIER}})?({{COMPARISON_OPERATOR}})?([=])([{])
    beginCaptures:
      1:
        patterns:
          - { include: "#SelectorStateOperator" }
      2:
        patterns:
          - { include: "#SelectorStateName" }
      3:
        patterns:
          - { include: "#ComparisonOperator" }
      4:
        patterns:
          - { include: "#EqualOperator" }
      5:
        patterns:
          - { include: "#PunctuationBraceOpen" }
    patterns:
      - { include: "#LuauComment" }
    end: ([}])
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationBraceClose" }

  AssignedQuotedSelectorAttribute:
    tag: string
    name: string.quoted.double.view.sd
    begin: ([@])({{IDENTIFIER}})?({{COMPARISON_OPERATOR}})?([=])(["])
    beginCaptures:
      1:
        patterns:
          - { include: "#SelectorStateOperator" }
      2:
        patterns:
          - { include: "#SelectorStateName" }
      3:
        patterns:
          - { include: "#ComparisonOperator" }
      4:
        patterns:
          - { include: "#EqualOperator" }
      5:
        patterns:
          - { include: "#PunctuationStringOpen" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#StringContent" }
    end: $|(["])
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationStringClose" }

  AssignedUnquotedSelectorAttribute:
    begin: ([@])({{IDENTIFIER}})?({{COMPARISON_OPERATOR}})?([=])
    beginCaptures:
      1:
        patterns:
          - { include: "#SelectorStateOperator" }
      2:
        patterns:
          - { include: "#LuauComment" }
          - { include: "#SelectorStateName" }
      3:
        patterns:
          - { include: "#ComparisonOperator" }
      4:
        patterns:
          - { include: "#EqualOperator" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#UnquotedSelectorAttributeValue" }
    end: (?={{UNQUOTED_STRING_TERMINATOR}})

  UnassignedSelectorAttribute:
    match: ([@])({{IDENTIFIER}})?
    captures:
      1:
        patterns:
          - { include: "#SelectorStateOperator" }
      2:
        patterns:
          - { include: "#SelectorStateName" }

  StringLiteral:
    tag: string
    name: string.quoted.double.sd
    begin: (["])
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationStringOpen" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#StringContent" }
    end: (["])|($)
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationStringClose" }

  Parameter:
    tag: meta
    name: meta.parameter.sd
    begin: (?=.+$)
    patterns:
      - { include: "#LuauComment" }
    end: $|(?={{WS}}*(?:[)]|[,]))

  Infinity:
    tag: atom
    name: constant.language.infinity.sd
    match: "{{BEFORE_KEYWORD}}Infinity{{AFTER_KEYWORD}}"

  NaN:
    tag: atom
    name: constant.language.nan.sd
    match: "{{BEFORE_KEYWORD}}NaN{{AFTER_KEYWORD}}"

  StyleAttributeOperator:
    tag: constant(variableName)
    name: variable.other.constant.attribute.style.sd
    match: ([#])

  StyleAttributeName:
    tag: constant(variableName)
    name: variable.other.constant.attribute.style.sd
    match: (.+)

  ComparisonOperator:
    tag: updateOperator
    name: keyword.operator.comparison.sd
    match: ({{COMPARISON_OPERATOR}})

  StringContent:
    match: ({{DOUBLE_QUOTED_CHAR}}*?)(?=$|")
    captures:
      1:
        patterns:
          - { include: "#StringEscape" }
          - { include: "#LuauFunctionCallShorthand" }
          - { include: "#LuauInterpolatedStringExpression" }
          - { include: "#StringCharacter" }

  UnquotedStyleAttributeValue:
    tag: string
    name: string.unquoted.attribute.value.sd
    match: ((?:(?!{{UNQUOTED_STRING_TERMINATOR}}).)+)

  UnquotedSelectorAttributeValue:
    match: ((?:(?!{{UNQUOTED_STRING_TERMINATOR}}).)+)
    captures:
      1:
        patterns:
          - { include: "#DivertTarget" }






  InlinePropQuotedValue:
    tag: string
    name: string.quoted.double.sd
    match: (["])({{DOUBLE_QUOTED_CHAR}}*)(["])
    captures:
      1:
        patterns:
          - { include: "#PunctuationStringOpen" }
      2:
        patterns:
          - { include: "#PlainStringContent" }
      3:
        patterns:
          - { include: "#PunctuationStringClose" }

  InlinePropLiteralValue:
    match: ([^\s]+)
    captures:
      1:
        patterns:
          - { include: "#InlinePropNumericValue" }
          - { include: "#InlinePropBooleanValue" }
          - { include: "#InlinePropWordValue" }

  InlinePropNumericValue:
    match: -?\d+(?:\.\d+)?$
    tag: number
    name: constant.numeric.sd

  InlinePropBooleanValue:
    match: (?:true|false)$
    tag: bool
    name: constant.language.boolean.sd

  InlinePropWordValue:
    match: ([^\s]+)
    captures:
      1:
        patterns:
          - { include: "#Color" }
          - { include: "#UnquotedString" }

  SparkdownExplicitTagContent:
    tag: definition(docComment)
    name: punctuation.definition.comment.content.sd
    # lookaround: Tag owns the marker; this content scope opens only when content follows it.
    # See bounded-entry rationale above for the structural alternatives.
    begin: (?=.)
    patterns:
      - { include: "#LuauSparkdownExplicitFunctionCallShorthand" }
      - { include: "#LuauSparkdownExplicitInterpolatedStringExpression" }
      - { include: "#TagText" }
    end: (?=$|{{TAG_START}})

  SparkdownExplicitTag:
    tag: docComment
    name: comment.line.sd entity.tag.sd
    match: "({{WS}}*)({{TAG_START}})(.*?){{LUAU_SHARED_TAG_END}}"
    captures:
      1:
        patterns:
          - { include: "#Whitespace" }
      2:
        tag: definition(docComment)
        name: punctuation.definition.comment.sd comment.line.sd entity.tag.begin.sd
      3:
        patterns:
          - { include: "#SparkdownExplicitTagContent" }

  SparkdownExplicitTags:
    tag: docComment
    name: comment.line.sd entity.tag.sd
    # lookaround: Tag owns each tag marker; this list opens only at the first marker.
    # See bounded-entry rationale above for the structural alternatives.
    begin: ({{WS}}*)(?={{TAG_START}})
    captures:
      1:
        patterns:
          - { include: "#RequiredWhitespace" }
    patterns:
      - { include: "#SparkdownExplicitTag" }
    end: (?=$)

  SparkdownExplicitAnnotation:
    patterns:
      - { include: "#SparkdownExplicitTags" }

  SparkdownExplicitDivertPath:
    tag: heading
    name: keyword.control.divert.path.sd
    # lookaround: DivertPart owns identifier and dotted target parts; this path ends before any token that is not a target part.
    # See bounded-entry rationale above for the structural alternatives.
    begin: (?={{IDENTIFIER}}|[.^])
    patterns:
      - { include: "#SparkdownExplicitAnnotation" }
      - { include: "#DivertPart" }
    # lookaround: DivertPart owns identifier and dotted target parts; this path ends before any token that is not a target part.
    # See bounded-exit rationale above for the structural alternatives.
    end: (?=$)|(?!{{IDENTIFIER}}|[.^])

  SparkleRichTextTag:
    match: (</?)(font-weight|line-height|uppercase|lowercase|smallcaps|allcaps|voffset|noparse|cspace|indent|color|align|alpha|nobr|mark|size|sub|sup|br|b|i|u|s)(?:(=)("[^"\r\n]*"|[^>\r\n]*))?(>)
    captures:
      "1":
        tag: keyword
        name: punctuation.definition.tag.begin.sd
      "2":
        tag: keyword
        name: keyword.other.richtext.tag.sd
      "3":
        tag: updateOperator
        name: keyword.operator.assignment.sd
      "4":
        tag: string
        name: string.other.richtext.value.sd
        patterns:
          - include: "#Color"
      "5":
        tag: keyword
        name: punctuation.definition.tag.end.sd

  SparkleRichTextTagUnknown:
    match: (</?)([a-zA-Z][a-zA-Z0-9-]*)(?:(=)("[^"\r\n]*"|[^>\r\n]*))?(>)
    captures:
      "1":
        tag: invalid
        name: punctuation.definition.tag.begin.sd
      "2":
        tag: invalid
        name: invalid.illegal.richtext.tag.sd
      "3":
        tag: updateOperator
        name: keyword.operator.assignment.sd
      "4":
        tag: string
        name: string.other.richtext.value.sd
        patterns:
          - include: "#Color"
      "5":
        tag: invalid
        name: punctuation.definition.tag.end.sd

  PlainStringContentSingleQuoted:
    match: ({{SINGLE_QUOTED_CHAR}}*?)(?=$|')
    captures:
      "1":
        patterns:
          - include: "#StringEscape"
          - include: "#SparkleRichTextTag"
          - include: "#SparkleRichTextTagUnknown"
          - include: "#Color"
          - include: "#StringCharacter"
