  SPARKLE_PARENS_4: (?:[(](?:{{SPARKLE_PARENS_5}}|{{SPARKLE_PARENS_PART}})*(?:[)]|$))
  SPARKLE_PARENS_3: (?:[(](?:{{SPARKLE_PARENS_4}}|{{SPARKLE_PARENS_PART}})*(?:[)]|$))
  SPARKLE_PARENS_2: (?:[(](?:{{SPARKLE_PARENS_3}}|{{SPARKLE_PARENS_PART}})*(?:[)]|$))
  SPARKLE_PARENS: (?:[(](?:{{SPARKLE_PARENS_2}}|{{SPARKLE_PARENS_PART}})*(?:[)]|$))
  SPARKLE_PROP_PARENS_7: (?:[(][^\n]*$)
  SPARKLE_PROP_PARENS_6: (?:[(](?:{{SPARKLE_PROP_PARENS_7}}|{{SPARKLE_PROP_PARENS_PART}})*(?:[)]|$))
  SPARKLE_PROP_PARENS_5: (?:[(](?:{{SPARKLE_PROP_PARENS_6}}|{{SPARKLE_PROP_PARENS_PART}})*(?:[)]|$))
  SPARKLE_PROP_PARENS_4: (?:[(](?:{{SPARKLE_PROP_PARENS_5}}|{{SPARKLE_PROP_PARENS_PART}})*(?:[)]|$))
  SPARKLE_PROP_PARENS_3: (?:[(](?:{{SPARKLE_PROP_PARENS_4}}|{{SPARKLE_PROP_PARENS_PART}})*(?:[)]|$))
  SPARKLE_PROP_PARENS_2: (?:[(](?:{{SPARKLE_PROP_PARENS_3}}|{{SPARKLE_PROP_PARENS_PART}})*(?:[)]|$))
