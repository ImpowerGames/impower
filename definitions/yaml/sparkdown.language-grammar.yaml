variables:
  LUAU_SHARED_UNTIL_ACCESS_SUFFIX: "(?:{{WS}}*(?:[.:]{{WS}}*{{LUAU_IDENTIFIER}}|\\[[^\\]\\n]*\\]))"
  LUAU_SHARED_TYPE_DECLARATION_END: "(?:$|{{LUAU_SHARED_TYPE_DECLARATION_END_GUARD}})"
  # lookaround: LuauComment and LuauAssignmentOperation keep trailing comments and assignment values inside the declaration.
  LUAU_SHARED_TYPE_DECLARATION_END_GUARD: "(?!{{LUAU_COMMENT_START}}|{{LUAU_IDENTIFIER}}|[=])"
  _LUAU_SHARED_EXPORTED_TYPE_PREFIX_: "(?:(export)\\b({{WS}}*))"
  # lookaround: LuauFunctionAccessor owns a colon followed by a method call; LuauAccessPath must leave that suffix to it.
  LUAU_SHARED_PATH_NO_METHOD_CALL: "(?!{{WS}}*[:]{{WS}}*{{LUAU_IDENTIFIER}}{{LUAU_SHARED_PATH_TRIVIA}}*{{LUAU_FUNCTION_CALL_START}})"
  # lookaround: LuauForLoop owns binding names before its condition; LuauAccessPath must finish each binding there.
  # A binding is a name right after `for`, or after a comma in the binding
  # list before the header's `in` or `=`, whatever types and comments the
  # earlier names carry (`for k: {a: T} --[[c]], v: nil in t`). A name after
  # a comma past the header's `in` or `=` is a value's (`for k in a, b:end
  # do`, `for i = 1, n:end do`, I-1448), whose `:` is a method's. A
  # lookbehind holds no lookaround, so the list is read as text with no `=`
  # and no `in` standing as a word (`LUAU_FOR_BINDING_LIST_BEHIND`); an `in`
  # inside a comment of that list ends it too.
  LUAU_SHARED_FOR_BINDING_BEHIND: "(?<=\\bfor{{WS}}+{{LUAU_NAME_BEHIND}}|\\bfor\\b{{LUAU_FOR_BINDING_LIST_BEHIND}}[,]{{WS}}*{{LUAU_NAME_BEHIND}})"
  # lookaround: read only in lookbehinds, with no lookaround of its own (VS Code's regex engine refuses one inside a lookbehind).
  LUAU_FOR_BINDING_LIST_BEHIND: (?:{{LUAU_QUOTED_STRING_BEHIND}}|{{LUAU_LEVEL_BLOCK_COMMENT_BEHIND}}|[^\n\r=i"'`-]|-[^\n\r-]|\Bi|i\b|i[^n\n\r=]|in\w)*
  # lookaround: read only in lookbehinds, with no lookaround of its own.
  LUAU_QUOTED_STRING_BEHIND: (?:"[^"\n\r]*"|'[^'\n\r]*'|`[^`\n\r]*`)
  # lookaround: LuauChainedPropertyAccess and LuauChainedFunctionCall keep member and call continuations inside the path.
  # A name goes on the path only right after its accessor: after whitespace
  # it begins the next statement (`Hello there`), which no path reads on to.
  LUAU_SHARED_PATH_NO_CONTINUATION: "(?!{{LUAU_IDENTIFIER}}|{{WS}}*{{LUAU_SHARED_PATH_CONTINUATION}})"
  # lookaround: LuauTypeAnnotationOperation owns a declaration's colon; LuauAccessPath must yield before the annotation.
  LUAU_SHARED_PATH_TYPE_ANNOTATION_AHEAD: "(?={{WS}}*{{LUAU_TYPE_ANNOTATION_OPERATOR}})"
  LUAU_SHARED_PATH_CONTINUATION: "(?:{{LUAU_ACCESSOR_OPERATOR}}|{{LUAU_INDEXER_START}})"
  LUAU_SHARED_PATH_END_KEYWORDS: "(?:{{LUAU_BINARY_OPERATORS}}|{{LUAU_TERMINATOR_KEYWORDS}})"
  LUAU_SHARED_PATH_TRIVIA: "(?:{{LUAU_BLOCK_COMMENT_ON_LINE}}|{{WS}})"
  # lookaround: LuauEndKeyword and LuauUntilKeyword own terminators rather than identifier paths.
  LUAU_SHARED_PATH_KEYWORD_GUARD: "(?!{{LUAU_TERMINATOR_KEYWORDS}})"
  LUAU_SHARED_SCOPE_MODIFIER_WORD: "(?:{{LUAU_SCOPE_MODIFIERS}})"
  # lookaround: LuauVariableAssignment and LuauComment keep commas, assignments and comments inside a declaration.
  LUAU_SHARED_DECLARATION_END_GUARD: "(?!{{WS}}|{{LUAU_COMMENT_START}}|[,=])"
  LUAU_SHARED_CONDITIONAL_ALTERNATOR_HEAD: "(?:{{LUAU_CONDITIONAL_ALTERNATOR_KEYWORDS}})"
  # lookaround: LuauThenExpression owns then; LuauOperatorMissingOperand must not report the clause delimiter as an operand.
  LUAU_SHARED_MISSING_OPERAND_WORDS: "(?:and|or|not|if(?!{{WS}}*then\\b))"
  # lookaround: LuauIfBlock owns statement clauses on the next line; LuauTernaryExpression must yield to them.
  LUAU_SHARED_TERNARY_NEXT_LINE_GUARD: "(?!{{WS}}*{{LUAU_IF_BLOCK_KEYWORDS}})"
  # lookaround: LuauElseifBlock owns elseif; LuauTernaryExpression must not treat its suffix as a separate if.
  LUAU_SHARED_NOT_ELSEIF: "(?<!\\belseif)"
  LUAU_SHARED_WRITTEN_BLOCK_CLOSER_KEYWORDS: "(?:end|until)"
  LUAU_SHARED_CONDITION_CLOSER_KEYWORDS: "(?:then|do)"
  LUAU_SHARED_TERNARY_CONTEXT: "(?:{{AFTER_LUAU_TERNARY_PRECEDING_TOKEN}}|{{LUAU_TERNARY_WITH_ELSE_AHEAD}})"
  LUAU_SHARED_PROPERTY_CHAIN_START: "(?:[.]{{LUAU_SHARED_SINGLE_DOT_GUARD}}|{{LUAU_INDEXER_START}})"
  # lookaround: LuauConcatOperation owns consecutive dots; LuauChainedPropertyAccess accepts only a single member dot.
  LUAU_SHARED_SINGLE_DOT_GUARD: "(?![.])"
  _LUAU_SHARED_SEQUENTIAL_MODIFIER_PREFIX_: "(?:({{LUAU_SEQUENTIAL_MODIFIER_KEYWORDS}})({{WS}}*))"
  LUAU_SHARED_SEQUENTIAL_HEAD: "(?:{{LUAU_SEQUENTIAL_MODIFIER_KEYWORDS}}|{{LUAU_SEQUENTIAL_ALTERNATOR_KEYWORDS}})"
  # lookaround: a head that read no word leaves the word to LuauAccessPath.
  LUAU_AFTER_SEQUENTIAL_HEAD: "(?<=[a-zA-Z0-9_])"
  # lookaround: LuauAccessPath owns dotted keyword members; LuauSequentialAlternatorBlock accepts only standalone keywords.
  LUAU_SHARED_ALTERNATOR_NON_MEMBER: "(?!{{WS}}*[.])"
  # lookaround: LuauIfBlock and LuauLineContinuation own following clauses and expression continuations respectively.
  LUAU_SHARED_THEN_NEXT_LINE_GUARD: "(?!{{WS}}*{{LUAU_IF_BLOCK_KEYWORDS}}|{{LUAU_EXPRESSION_LINE_CONTINUATION}})"
  LUAU_SHARED_THEN_ARM_END: "(?:else\\b|elseif\\b|[)}\\],;])"
  LUAU_SHARED_THEN_ARM_CLOSER: "(?:{{BEAT}}|{{WS}}*{{LUAU_SHARED_THEN_ARM_END}}|{{WS}}+{{LUAU_SHARED_CONDITION_CLOSER_KEYWORDS}}\\b|{{AFTER_LUAU_GLUEABLE_OPERAND}}{{LUAU_SHARED_CONDITION_CLOSER_KEYWORDS}}\\b|{{LUAU_COLON_BEFORE_HEADER_END}}|{{LUAU_COLON_BEFORE_LONG_COMMENT}})"
  # lookaround: LuauExpression owns value keywords; LuauTypeLiteral accepts only names that can introduce a type.
  LUAU_SHARED_TYPE_KEYWORD_GUARD: "(?!{{LUAU_NON_TYPE_KEYWORDS}})"
  LUAU_SHARED_PATH_OR_CALL_CONTINUATION: "(?:{{LUAU_ACCESSOR_OPERATOR}}{{WS}}*{{LUAU_IDENTIFIER}}|{{LUAU_DANGLING_ACCESSOR_START}}|{{LUAU_FUNCTION_CALL_START}}|\\[|{{LUAU_LINE_CONTINUATION_OPERATOR}})"
  # lookaround: LuauThenExpression and LuauLineContinuation keep then and operator continuations inside the condition.
  LUAU_SHARED_TERNARY_CONDITION_LINE_END: "(?!{{WS}}*then\\b|{{LUAU_EXPRESSION_LINE_CONTINUATION}})"
  # lookaround: LuauTypeofFunction owns typeof calls; LuauVariableAssignment must not mistake typeof for a binding name.
  LUAU_SHARED_NOT_TYPEOF: "(?!typeof\\b)"
  # lookaround: LuauTypeAnnotationOperation and LuauAssignmentOperation own annotations and values; LuauVariableAssignment must yield before either.
  LUAU_SHARED_VARIABLE_HEAD_END: "(?:[,]|[=](?![=])|[:](?![:])(?!{{WS}}*{{LUAU_SHARED_NOT_TYPEOF}}{{LUAU_IDENTIFIER}}{{WS}}*[(])|--|\\n|\\r|$)"
  LUAU_SHARED_DIVERT_DOTTED_PART: "(?:[.]{{IDENTIFIER}})"
  # lookaround: Tags owns the next tag marker; Tag ends before that marker rather than consuming its sibling.
  LUAU_SHARED_TAG_END: "(?:(?={{TAG_START}})|$)"
  DISPLAY_CHAIN_SEPARATOR: (?:$|{{WS}}+)
  # lookaround: LuauIfBlock, LuauRepeatLoop and the bodies' end patterns
  # own the four closers, which can close a block the unread run cannot
  # see, so LuauUnreadName and LuauUnreadCharacter leave them to those
  # rules.
  LUAU_UNREAD_NOT_CLOSER: (?!{{LUAU_IF_BRANCH_END_KEYWORDS}}|{{LUAU_REPEAT_BLOCK_KEYWORDS}})
  LUAU_CLOSER: (?:(?:end|else|elseif|until){{LUAU_NAME_END}})
  LUAU_BRANCH_OR_UNTIL: (?:(?:else|elseif|until){{LUAU_NAME_END}})
  LUAU_UNTIL: (?:until{{LUAU_NAME_END}})
  LUAU_END_OR_BRANCH: (?:(?:end|else|elseif){{LUAU_NAME_END}})
  LUAU_METHOD_TRIVIA: (?:{{WS}}*{{LUAU_EXACT_LEVEL_BLOCK_COMMENT}}*)
  LUAU_EXACT_LEVEL_BLOCK_COMMENT: (?:{{LUAU_COMMENT_START}}\[(?:{{LUAU_BLOCK_COMMENT_REST}}|{{LUAU_BLOCK_COMMENT_LEVELS_4_TO_8_REST}}){{WS}}*)
  LUAU_METHOD_TRIVIA_TO_LONG_COMMENT: (?:{{LUAU_METHOD_TRIVIA}}{{LUAU_LONG_BLOCK_COMMENT_START}})
  # lookaround: `LUAU_TYPECAST_OPERATOR` owns `::`; read only inside the `end:` lookaheads of the path and of a type, which hand the `:` to those rules (GRAMMAR.md §10.1, the end carrying the load).
  LUAU_COLON_BEFORE_LONG_COMMENT: (?:[:](?![:]){{LUAU_METHOD_TRIVIA_TO_LONG_COMMENT}})
  # lookaround: read only in `LuauExpressionKeywordMethodAccessor`'s negative lookbehind, with no lookaround of its own.
  LUAU_TYPE_OPERATOR_BEHIND: (?:(?:[|&:]|->){{WS}}*)
  LUAU_LONG_BLOCK_COMMENT_START: (?:{{LUAU_COMMENT_START}}\[={9,}\[)
  LUAU_NON_TYPE_KEYWORD_OR_LONG_COMMENT: (?:{{LUAU_NON_TYPE_KEYWORDS}}|{{LUAU_LONG_BLOCK_COMMENT_START}})
  # lookaround: `LuauExpressionKeywordMethodAccessor`'s and the long-comment header rules' ends yield to their `LuauKeywordMethodName` only on the `:`'s line, which only the text the rule has read shows.
  LUAU_KEYWORD_ON_COLON_LINE_AHEAD: (?:(?<={{LUAU_METHOD_COLON_LINE_BEHIND}}){{LUAU_KEYWORD}})
  # lookaround: read only in lookbehinds, with no lookaround of its own (VS Code's regex engine refuses one inside a lookbehind).
  LUAU_METHOD_COLON_LINE_BEHIND: (?:[:]{{LUAU_TRIVIA_ON_LINE_BEHIND}})
  # lookaround: read only in lookbehinds, with no lookaround of its own.
  LUAU_TRIVIA_ON_LINE_BEHIND: (?:{{WS}}*(?:{{LUAU_LEVEL_BLOCK_COMMENT_BEHIND}}{{WS}}*)*)
  # lookaround: read only in lookbehinds, with no lookaround of its own.
  LUAU_LEVEL_BLOCK_COMMENT_BEHIND: (?:--\[(?:\[[^\n\r]*?\]\]|=\[[^\n\r]*?\]=\]|==\[[^\n\r]*?\]==\]|===\[[^\n\r]*?\]===\]|={4}\[[^\n\r]*?\]={4}\]|={5}\[[^\n\r]*?\]={5}\]|={6}\[[^\n\r]*?\]={6}\]|={7}\[[^\n\r]*?\]={7}\]|={8}\[[^\n\r]*?\]={8}\]|={9}\[[^\n\r]*?\]={9}\]|={10}\[[^\n\r]*?\]={10}\]|={11}\[[^\n\r]*?\]={11}\]|={12}\[[^\n\r]*?\]={12}\]|={13}\[[^\n\r]*?\]={13}\]|={14}\[[^\n\r]*?\]={14}\]|={15}\[[^\n\r]*?\]={15}\]|={16}\[[^\n\r]*?\]={16}\]|={17,}\[[^\n\r]*?\]={17,}\]))
  # lookaround: read only in lookbehinds, with no lookaround of its own.
  LUAU_DECLARATION_TARGETS_BEHIND: (?:\b(?:local|store|const)\b[^\n\r(){}\[\]:=]*)
  # lookaround: `LuauLoopHeaderMethodColon`, `LuauIfHeaderMethodColon` and `LuauExpressionKeywordMethodAccessor` read a `:` before `do` or `then`; `LuauKeywordMethodAccessor`, which a type tries before its stray-colon token, steps aside for them.
  LUAU_KEYWORD_NOT_HEADER_END: (?:(?!{{LUAU_SHARED_CONDITION_CLOSER_KEYWORDS}}{{LUAU_NAME_END}}){{LUAU_KEYWORD}})
  # lookaround: read only in lookbehinds, with no lookaround of its own (VS Code's regex engine refuses one inside a lookbehind).
  LUAU_TYPE_AFTER_COLON_BEHIND: (?:{{LUAU_DECLARATION_TARGETS_BEHIND}}[:]{{LUAU_TRIVIA_ON_LINE_BEHIND}}{{LUAU_TYPE_BEHIND}}{{LUAU_TRIVIA_ON_LINE_BEHIND}})
  # lookaround: read only in lookbehinds, with no lookaround of its own.
  LUAU_TYPE_BEHIND: (?:{{LUAU_TYPE_TOKEN_BEHIND}}{{LUAU_TYPE_OPERATOR_TOKEN_BEHIND}}*)
  # lookaround: read only in lookbehinds, with no lookaround of its own.
  LUAU_TYPE_OPERATOR_TOKEN_BEHIND: (?:{{LUAU_TRIVIA_ON_LINE_BEHIND}}(?:[|&]|->){{LUAU_TRIVIA_ON_LINE_BEHIND}}{{LUAU_TYPE_TOKEN_BEHIND}})
  # lookaround: `LuauExpressionKeywordMethodAccessor` reads a `:` that `do` or `then` follows after an annotation's complete type, and only the text since the annotation's `:` shows that a type stands there; `LuauTypeAnnotationMissingType` steps aside for it.
  # The lookahead goes first, so the lookbehind, which reads back along the
  # line, runs only at such a `:`.
  LUAU_METHOD_COLON_AFTER_TYPE_AHEAD: (?:(?={{LUAU_COLON_BEFORE_HEADER_END}}|{{LUAU_COLON_BEFORE_LONG_COMMENT}})(?<={{LUAU_TYPE_AFTER_COLON_BEHIND}}))
  # lookaround: read only in lookbehinds, with no lookaround of its own.
  LUAU_TYPE_TOKEN_BEHIND: (?:(?:[^\s,;=:(){}\[\]|&]|{{LUAU_TYPE_BRACKETS_BEHIND}})+)
  # lookaround: read only in lookbehinds, with no lookaround of its own.
  LUAU_TYPE_BRACKETS_BEHIND: (?:[(]{{LUAU_TYPE_BRACKET_PART_BEHIND}}*[)]|[{]{{LUAU_TYPE_BRACKET_PART_BEHIND}}*[}]|\[{{LUAU_TYPE_BRACKET_PART_BEHIND}}*\]|[<]{{LUAU_TYPE_GENERIC_PART_BEHIND}}*[>])
  # lookaround: read only in lookbehinds, with no lookaround of its own.
  LUAU_TYPE_BRACKET_PART_BEHIND: (?:[^\n\r(){}\[\]]|{{LUAU_TYPE_INNER_BRACKETS_BEHIND}})
  # lookaround: read only in lookbehinds, with no lookaround of its own.
  LUAU_TYPE_GENERIC_PART_BEHIND: (?:[^\n\r(){}\[\]<>]|{{LUAU_TYPE_INNER_BRACKETS_BEHIND}})
  # lookaround: read only in lookbehinds, with no lookaround of its own.
  LUAU_TYPE_INNER_BRACKETS_BEHIND: (?:[(]{{LUAU_TYPE_INNER_PART_BEHIND}}*[)]|[{]{{LUAU_TYPE_INNER_PART_BEHIND}}*[}]|\[{{LUAU_TYPE_INNER_PART_BEHIND}}*\]|[<]{{LUAU_TYPE_INNER_GENERIC_PART_BEHIND}}*[>])
  # lookaround: read only in lookbehinds, with no lookaround of its own.
  LUAU_TYPE_INNER_PART_BEHIND: (?:[^\n\r(){}\[\]]|{{LUAU_TYPE_INNERMOST_BRACKETS_BEHIND}})
  # lookaround: read only in lookbehinds, with no lookaround of its own.
  LUAU_TYPE_INNER_GENERIC_PART_BEHIND: (?:[^\n\r(){}\[\]<>]|{{LUAU_TYPE_INNERMOST_BRACKETS_BEHIND}})
  # lookaround: read only in lookbehinds, with no lookaround of its own.
  LUAU_TYPE_INNERMOST_BRACKETS_BEHIND: (?:[(][^\n\r(){}\[\]]*[)]|[{][^\n\r(){}\[\]]*[}]|\[[^\n\r(){}\[\]]*\]|[<][^\n\r(){}\[\]<>]*[>])
  # lookaround: `LUAU_TYPECAST_OPERATOR` owns `::`, which is no method's `:`; the variable is read only inside the `end:` lookaheads of the path and of an operation (GRAMMAR.md §10.1, the end carrying the load).
  LUAU_COLON_BEFORE_HEADER_END: (?:[:](?![:]){{LUAU_METHOD_TRIVIA}}{{LUAU_SHARED_CONDITION_CLOSER_KEYWORDS}}{{LUAU_NAME_END}})
  # lookaround: `LUAU_TYPECAST_OPERATOR` owns `::`, which is no method's `:`; the variable is read only inside a type's `end:` lookahead and an accessor's begin lookahead (GRAMMAR.md §10.1, the end carrying the load).
  LUAU_COLON_BEFORE_RESERVED_WORD: (?:[:](?![:]){{LUAU_METHOD_TRIVIA}}{{LUAU_NON_TYPE_KEYWORD_OR_LONG_COMMENT}})
  # lookaround: `LuauTypeLiteral`'s begin refuses this `:` only where its own `end:` and its rivals' (`LuauTypeBinaryOperation`, `LuauTypeCastOperation`) would close at it; a begin without the lookbehind refuses a `:` no end stops before, which leaves the operation around it with nothing to read (GRAMMAR.md §17.2).
  LUAU_TYPE_ENDS_BEFORE_RESERVED_WORD: (?:(?={{LUAU_COLON_BEFORE_RESERVED_WORD}})(?<={{LUAU_TYPE_END}}{{WS}}*))
  LUAU_NOT_PARENTHESIS_CLOSER: (?:{{LUAU_CLOSER}}|[\]}])
  LUAU_NOT_SQUARE_BRACKET_CLOSER: (?:{{LUAU_CLOSER}}|[)}])
  LUAU_NOT_BRACE_CLOSER: (?:{{LUAU_CLOSER}}|[)\]])
  LUAU_NOT_TYPE_PARENTHESIS_CLOSER: (?:[\]}]|{{LUAU_TYPE_GENERIC_CLOSER}})
  LUAU_NOT_TYPE_SQUARE_BRACKET_CLOSER: (?:[)}]|{{LUAU_TYPE_GENERIC_CLOSER}})
  LUAU_NOT_TYPE_BRACE_CLOSER: (?:[)\]]|{{LUAU_TYPE_GENERIC_CLOSER}})
  LUAU_NOT_TYPE_GENERIC_CLOSER: (?:[)\]}])
  # lookaround: `LUAU_TYPE_BINARY_OPERATORS` reads a function type's `->` whole, so a `>` right after a `-` is the arrow's, never a generic's closer.
  LUAU_TYPE_GENERIC_CLOSER: (?:(?<![-])[>])
  LUAU_GLUED_KEYWORD: (?:(?:then|do|end|else|elseif|until){{LUAU_NAME_END}})
  # lookaround: a name character after a word makes it a longer name,
  # which `LuauAccessPath` and `LuauUnreadName` read whole (`ending`,
