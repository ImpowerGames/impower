  # a comma that ends the entry or precedes another one. Any other comma stays
  # part of the value, and a quoted run or an attribute selector
  # (`STRUCT_BLOCK_BRACKET`) is read whole. A value that reaches a comment
  # takes the comment, to the end of the line, into its text, as an indented
  # value line does, so the value rules (`StylingValue`) end the value before
  # the comment alike in both forms, and nothing in the comment is structure.
  # A literal followed by `//` is the exception: it ends before the
  # comment, which the property or list value reads as a
  # `LuauStructBlockValueComment`, the node `StylingValue` gives a `//`
  # comment after a literal.
