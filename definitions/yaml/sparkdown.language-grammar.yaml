    - "while"
    - "for"
    - "repeat"
    - "do"
    - "function"
    - "end"
    - "return"
    - "local"
    - "break"
    - "continue"
    - "elseif"
    - "else"
    - "then"
  # Keywords that end a `return` statement's value list
