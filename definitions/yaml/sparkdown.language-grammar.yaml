variables:
  IMAGE_CONTROL_KEYWORDS: ["show", "hide", "animate"]
  IMAGE_CLAUSE_KEYWORDS: ["over", "after", "with", "wait", "ease"]
  AUDIO_CONTROL_KEYWORDS: ["play", "stop", "fade", "queue", "await"]
  AUDIO_CLAUSE_KEYWORDS:
    ["over", "after", "to", "loop", "once", "mute", "unmute", "now"]
  # Screen lifecycle directives — `[[open hud with fade over 1s]]` /
  # `[[close hud]]` / `[[navigate menu to settings]]`. They flow through the same
  # AssetCommand grammar as image directives, so they inherit every
  # IMAGE_CLAUSE_KEYWORD (over/after/with/wait/ease) for free; the runtime
  # InterpreterModule routes the verbs to screen mount/unmount/navigate instead of
  # the image path. `open`/`close` are overlay primitives; `navigate <container>
  # to <screen>` routes within a container (close that container's open screens,
  # open the target), leaving other containers / uncategorized screens untouched.
  LAYOUT_CONTROL_KEYWORDS: ["open", "close", "navigate"]
  # `[[load NAME…]]` — preload the named scenes (and worlds) behind the
  # loading layout before the story goes on. Every `load` arrow (`-> load X`,
  # `-> load X ->`, `<- load X`) lowers to this directive on its own line.
  LOAD_CONTROL_KEYWORDS: ["load"]

  FLOW_BEAT_KEYWORDS: ["scene", "branch"]
  # referenced-from: packages/sparkdown-language-server/src/utils/providers/getCompletions.ts
  # (keyword completions; no pattern expands it).
  FLOW_MODULE_KEYWORDS: ["include", "run"]

  LUAU_SCOPE_MODIFIERS: ["store", "local", "const"]
  LUAU_ACCESS_MODIFIERS: ["read", "write"]
  LUAU_END_KEYWORDS: ["end"]
  LUAU_CONDITIONAL_ALTERNATOR_KEYWORDS: ["match", "plural"]
  LUAU_SEQUENTIAL_ALTERNATOR_KEYWORDS: ["queue", "cycle", "chain"]
  LUAU_SEQUENTIAL_MODIFIER_KEYWORDS: ["shuffle"]
  LUAU_FLOW_BLOCK_KEYWORDS: ["do", "if", "for", "while", "repeat"]
  LUAU_IF_BLOCK_KEYWORDS: ["then", "elseif", "else"]
  LUAU_IF_BRANCH_END_KEYWORDS: ["end", "elseif", "else"]
  LUAU_LOOP_BLOCK_KEYWORDS: ["break", "continue"]
  LUAU_ITERATOR_KEYWORDS: ["in"]
  LUAU_REPEAT_BLOCK_KEYWORDS: ["until"]
  LUAU_JUMP_KEYWORDS: ["goto"]
  LUAU_RETURN_KEYWORDS: ["return"]
  LUAU_LOGICAL_KEYWORDS: ["and", "or", "not"]
  LUAU_MODULE_KEYWORDS: ["require", "export"]
  LUAU_PRESENTATION_DEFINITION_KEYWORDS: ["animation", "theme", "morph"]
  LUAU_MATCH_CASE_END_KEYWORDS: ["case", "else", "end"]
  LUAU_TERNARY_PRECEDING_KEYWORDS: ["return", "and", "or", "not", "then", "else"]
  # Statement-boundary keywords that end an `until` condition
  # (`LuauUntilStatement`); `until` itself is left out.
  LUAU_UNTIL_CONDITION_END_KEYWORDS:
