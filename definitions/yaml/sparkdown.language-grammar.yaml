  # comment. It is ignored.
  STRUCT_BLOCK_TRAILING_COMMA: (?:[,]{{WS}}*(?:$|[;}]|{{STRUCT_BLOCK_COMMENT_AFTER_WS}}))
  # A comma followed by another entry on the same line: a property, with any
  # key a property may have (`, b = 2`, `, "b" = 2`, `, $b = 2`), or a block
  # (`, b {`, `, > text {`). A value cannot hold an unquoted `{`, so text
  # after a comma that runs to a `{` is the next block's header.
