  STRUCT_LITERAL_SLASH_COMMENT: (?:{{WS}}*[/][/].*)
  STRUCT_VALUE_TEXT_PART: (?:{{STRUCT_BLOCK_QUOTED}}|[^"\r\n])
  STRUCT_TEXT_DASH_COMMENT: (?:{{WS}}+{{LUAU_COMMENT_START}}.*)
  STRUCT_TEXT_SLASH_COMMENT: (?:{{WS}}+[/][/](?:{{WS}}.*)?)
