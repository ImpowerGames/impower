  # A literal followed by a `--` comment, taking the comment to the line end.
  STRUCT_BLOCK_LITERAL_THEN_LUAU_COMMENT: '{{STRUCT_BLOCK_LITERAL}}(?={{WS}}*{{LUAU_COMMENT_START}})[^\n]*'
  # A literal followed by a `//` comment, ending before the comment.
  STRUCT_BLOCK_LITERAL_BEFORE_SLASH_COMMENT: '{{STRUCT_BLOCK_LITERAL}}(?={{WS}}*[/][/])'
  # One unit of an unquoted property value: a quoted run, a bracket, or a character.
  STRUCT_BLOCK_VALUE_PART: (?:{{STRUCT_BLOCK_QUOTED}}|{{STRUCT_BLOCK_BRACKET}}|{{STRUCT_BLOCK_LONE_BRACKET}}|[^;{}"\n\[])
  # One unit of a bare list value, which a comma also ends.
  STRUCT_BLOCK_ITEM_PART: (?:{{STRUCT_BLOCK_QUOTED}}|{{STRUCT_BLOCK_BRACKET}}|{{STRUCT_BLOCK_LONE_BRACKET}}|[^;{},"\n\[])
  # A comment inside a value, taken with the rest of the line into the value.
  STRUCT_BLOCK_COMMENT_IN_VALUE_TO_LINE_END: (?={{STRUCT_BLOCK_COMMENT_IN_VALUE}})[^\n]*
