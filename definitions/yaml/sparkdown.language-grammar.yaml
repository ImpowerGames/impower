  IDENTIFIER_START_CHAR: '_\p{L}'
  IDENTIFIER_END_CHAR: '0-9_\p{L}-'
  IDENTIFIER_START: "[{{IDENTIFIER_START_CHAR}}]"
  IDENTIFIER_END: "[{{IDENTIFIER_END_CHAR}}]*"
  IDENTIFIER: (?:{{IDENTIFIER_START}}{{IDENTIFIER_END}}\b)

  TAG_START: (?:[#]+(?=$|{{WS}}))
  COMMENT_START: (?:[-][-])
  # A `>` in display text, which may touch the words around it (`A>B`), and
  # each `>` of `>>` is one. The marks that hold a `>` are matched before it:
  # `Escape` takes `\>`, `TextCommand` takes `<wait 1>`, and `Divert` takes
  # `->`. Display text reads a dash at a time, so the last `-` of `-->` reaches
  # `Divert` and the dashes before it are text.
  BREAK_MARK: (?:[>])
  BREAK: (?:{{WS}}*{{BREAK_MARK}}{{WS}}*)
  CHAIN: (?:[\\])
  # A `..` that ends a line, or the part of a line before a `>` break. It joins
  # the next line or part onto it when that one begins with `..`. Anything but a
  # dot may touch it (`A..`), so `Wait...` stays an ellipsis. Tags and a `//`
  # comment may follow it.
  GLUE: (?:(?<![.])[.][.]{{GLUE_END}})
  # What may follow a line-ending `..`: spaces, then the end of the line, tags,
  # a `//` comment or a `>` break.
  GLUE_END: (?={{WS}}*(?:$|{{TAG_START}}|[/]{2}(?:$|{{WS}})|{{BREAK_MARK}}))
  # A `..` that begins a line. The line joins the one shown before it when
  # that one ends with `..`, which the engine checks as the story runs. A third
  # dot makes it an ellipsis (`...and then`).
  LEADING_GLUE: (?:[.][.](?![.]))
  # The `..` that begins the text after an inline title's, heading's,
  # transition's, write line's or cue's colon.
  #
  # lookaround: `(?!{{INLINE_GLUED_ALTERNATOR_START}})` leaves an opening
  # `..` to `LuauSparkdownInlineGluedSequentialAlternatorBlock` and
  # `LuauSparkdownInlineGluedConditionalAlternatorBlock`
  # (`BUNNY: .. queue | Hi | Hello ..`). The mark is the begin's last capture
  # because only the begin knows where the text starts: tried from the
  # body instead (`LeadingGlue` after the alternators in each body), it
  # was tried again after a `ParentheticalLine`, so `(aside) \ ..` then
  # `..joined` lost its trailing glue, and an alternator outside `LineEnd`
  # left the spaces after its closing `..` to `LineEnd`'s begin, which the
  # formatter removes. The tree parser has no `\G` to anchor a body pattern
  # to the text's start, and `LEADING_GLUE` cannot refuse the mark by
  # itself, since `.. Wait.` is leading glue. The exclusion is kept here,
  # once, for the five begins that use it.
  INLINE_LEADING_GLUE: (?:(?!{{INLINE_GLUED_ALTERNATOR_START}}){{LEADING_GLUE}})
  # The `..` that opens and closes an inline alternator mid-line
  # (`.. queue|a|b ..`).
  ALTERNATOR_GLUE: (?:(?<=^|{{WS}})[.][.](?=$|{{WS}}))
  INLINE_GLUED_ALTERNATOR_START: (?:{{WS}}*{{ALTERNATOR_GLUE}}{{WS}}+(?:(?:(?:{{LUAU_SEQUENTIAL_MODIFIER_KEYWORDS}}){{WS}}+)?(?:{{LUAU_SEQUENTIAL_ALTERNATOR_KEYWORDS}}){{WS}}*(?!{{WS}}*[.])|(?:{{LUAU_CONDITIONAL_ALTERNATOR_KEYWORDS}}){{WS}}*(?=[(])))

  # Newline
  NL: (?:\r\n|\r|\n)
  # Whitespace
  WS: (?:[^\S\n\r])
  # Word
  WORD: (?:[\p{L}\p{N}\p{Mn}]+)
  # End Of Line
  EOL: "(?:$|{{WS}}*$|{{WS}}*{{TAG_START}}.*$)"
  # End Of Keyword
  EOK: "(?:$|{{WS}}+|(?=[:]|{{TAG_START}}|{{COMMENT_START}}))"

  # A line that declares a scene or branch. Luau blocks end before it. It
  # starts like the `Scene` and `Branch` declaration headers, with the keyword
  # first on the line and followed by `EOK`, but unlike those headers it
  # refuses a keyword followed by an assignment operator: inside a block,
  # `scene = "none"` or `branch += 1` assigns a name and must not end the
  # block. A `scene` or `branch` later in a line is also an ordinary name.
  BEAT: (?:^{{WS}}*{{FLOW_BEAT_KEYWORDS}}{{EOK}}(?!{{WS}}*{{LUAU_ASSIGNMENT_OPERATORS}}))
  END: (?:{{WS}}*(?:end)\b)
  # Just after an operand that a keyword can follow with no space between
  # them: a closing bracket, a quote, a backtick, the vararg `...`, or the
  # closing `/` and flags of a regex literal (`else (x)then`, `else ...then`,
  # `else @/x/gthen`). The flags are bounded so the lookbehind stays one
  # Oniguruma accepts.
  AFTER_LUAU_GLUEABLE_OPERAND: (?<=[)\]}"'`]|\.\.\.|/[dgimsuvy]{0,8})
  # What begins a statement rather than a value when it begins a line: the
  # keywords `LuauReturnStatement` stops at, a `;`, and a named
  # function declaration (a `function` literal is a value).
  LUAU_STATEMENT_LINE_START: (?:(?:end|until|local|return|break|do|while|repeat|for)\b|;|function{{WS}}+{{LUAU_IDENTIFIER}})
  # What begins a statement or ends a block rather than continuing a
  # reassignment's value list when it begins the line after a comma that
  # ends its line: what ends a declaration there (`LUAU_DECLARATION_STOP`),
  # what begins a statement line (`LUAU_STATEMENT_LINE_START`), `then`, a
  # label, and the named blocks `LuauDeclarations` reaches (`define cfg`,
  # `style s` and the like). An `if` expression and a `function` literal are
  # values. Unlike a declaration, whose value rule leaves statements out,
  # the reassignment reads its values with `LuauExpression`, so a statement
  # this list misses would be read as a value.
  LUAU_LIST_LINE_START_STATEMENT: (?:{{LUAU_DECLARATION_STOP}}|{{LUAU_STATEMENT_LINE_START}}|then\b|[:][:]|(?:define|style|layout|screen|component|animation|theme|morph)\b{{WS}}+{{LUAU_IDENTIFIER}})
  # Where a reassignment ends on its own line (see `LuauReassignment`).
  LUAU_REASSIGNMENT_END: (?={{BEAT}})|{{LUAU_VALUE_COMMENT_BEFORE_STATEMENT}}|(?=\]=*\](?:{{LUAU_STATEMENT_CODE_AHEAD}}|[(]))|(?={{WS}}*;)|(?={{WS}}*[}])|(?={{WS}}+\b(?:if|while|for|repeat|do|function|end|return|local|break|continue|elseif|else|then|until)\b)|(?={{WS}}+{{LUAU_REASSIGNMENT_START}})|(?={{WS}}+{{LUAU_UNRESERVED_IDENTIFIER}}(?:{{WS}}*(?:[.:]{{WS}}*{{LUAU_IDENTIFIER}}|\[[^\]\n]*\]))*{{WS}}*[(])|$
  # The start of a reassignment statement: its targets (a name with `.field`,
  # `[index]` or `(call)` suffixes, or several names separated by commas) and
  # an assignment operator. `LuauReassignment` begins here, and the rules that
  # end before a following reassignment look ahead for it. An index may hold
  # one level of brackets (`t[k[1]].x`).
  LUAU_REASSIGNMENT_START: '{{LUAU_IDENTIFIER}}(?:{{WS}}*(?:[.]{{WS}}*{{LUAU_IDENTIFIER}}|{{LUAU_REASSIGNMENT_INDEX}}|\([^()\n]*\)|,{{WS}}*{{LUAU_IDENTIFIER}}))*{{WS}}*{{LUAU_ASSIGNMENT_OPERATORS}}'
  # A target's `[index]`, holding at most one level of nested brackets. A
  # string inside it is read whole, in any of Luau's three quotes, so a
  # bracket or another quote in a key (`t["["]`, `t["]"]`, ``t[`don't`]``)
  # is text, not structure.
  LUAU_REASSIGNMENT_INDEX: \[(?:{{LUAU_REASSIGNMENT_INDEX_TEXT}}|\[(?:{{LUAU_REASSIGNMENT_INDEX_TEXT}})*\])*\]
  # One piece of an index's text: a character that is no bracket, quote or
  # line break, or a whole string on one line in double quotes, single
  # quotes or backticks.
  LUAU_REASSIGNMENT_INDEX_TEXT: (?:[^\[\]\n"'`]|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\\n]|\\.)*`)
  # The start of a reassignment in Luau code whose target list ends its line
  # with a comma (`a,` then `g = 1, 2`): targets, then a comma before the end
  # of the line or a comment. No other statement in Luau code starts with a
  # name followed by a comma, so `LuauReassignment` begins here too, and its
  # `LuauCommaLineBreak` carries the target list onto the next line.
  LUAU_REASSIGNMENT_TARGETS_CONTINUED: '{{LUAU_IDENTIFIER}}(?:{{WS}}*(?:[.]{{WS}}*{{LUAU_IDENTIFIER}}|{{LUAU_REASSIGNMENT_INDEX}}|\([^()\n]*\)|,{{WS}}*{{LUAU_IDENTIFIER}}))*{{WS}}*,{{WS}}*(?:$|{{LUAU_COMMENT_START}})'
  # Just before the line break of an if expression's line when the next line
  # begins at column 0 with anything an if expression does not read on to:
  # not a clause keyword (`then`, `else`, `elseif`), a continuation, a
  # comment, or a closing bracket or separator. Such a line ends the
  # expression anyway, so the expression stops before the line break instead
  # of taking it, and a statement it is part of, such as a `LuauReassignment`
  # (which has nothing at a line start that ends it), ends at the end of its
  # own line rather than reading the next line (`x = 6`, `print(x)`,
  # `local y = 1`) into itself. The `\S` keeps it from matching at the end of
  # a line that a line-by-line tokenizer (VS Code) sees with nothing after.
  BEFORE_LUAU_COLUMN_0_LINE: (?={{NL}}(?=\S)(?!(?:then|else|elseif)\b|{{LUAU_EXPRESSION_LINE_CONTINUATION}}|{{LUAU_COMMENT_START}}|[)}\],;]))
  # The same, for an `else` that ends its line: its arm takes a column-0 value
  # from the next line (`else` then `"c"`), so it stops only before a column-0
  # line that cannot be a value, one that begins a statement
  # (`LUAU_STATEMENT_LINE_START`) or a reassignment (`x = 6`, `a.b += 1`).
  BEFORE_LUAU_COLUMN_0_STATEMENT: (?={{NL}}(?:{{LUAU_STATEMENT_LINE_START}}|(?!(?:then|else|elseif)\b){{LUAU_REASSIGNMENT_START}}))

  LUAU_TERMINATOR_KEYWORDS: (?:{{LUAU_END_KEYWORDS}}|{{LUAU_FLOW_BLOCK_KEYWORDS}}|{{LUAU_IF_BLOCK_KEYWORDS}}|{{LUAU_LOOP_BLOCK_KEYWORDS}}|{{LUAU_ITERATOR_KEYWORDS}}|{{LUAU_REPEAT_BLOCK_KEYWORDS}}|{{LUAU_JUMP_KEYWORDS}}|{{LUAU_RETURN_KEYWORDS}}|{{LUAU_LOGICAL_KEYWORDS}}|{{LUAU_GLOBAL_DECLARATION_KEYWORDS}}|{{LUAU_LOCAL_DECLARATION_KEYWORDS}}|{{LUAU_MODULE_KEYWORDS}})
  LUAU_COMMENT_START: (?:[-][-])
  LUAU_IDENTIFIER: (?:[a-zA-Z_][a-zA-Z0-9_]*\b)
  # Style/UI property names follow CSS/sparkle spelling — hyphens are
  # allowed (e.g. `bg-color`, `corner-top-left`, `c-tl`). This is
  # deliberately wider than LUAU_IDENTIFIER (which forbids hyphens) and
  # is only used inside `style` blocks, where a value is a raw CSS-like
  # token rather than a Luau expression.
  STYLE_PROPERTY_NAME: (?:[a-zA-Z_][a-zA-Z0-9_-]*)
  # Restored value/selector highlighting helpers (pre-Luau-port leaf rules).
  INTEGER: "[0-9]+"
  NUMBER: (?:[-]?(?:\d*[.])?\d+)
  QUOTED_STRING: (?:["](?:\\.|[^"\r\n])*["])
  STRICT_PROPERTY_IDENTIFIER: (?:{{INTEGER}}|{{IDENTIFIER}}|{{QUOTED_STRING}})
  BEFORE_KEYWORD: (?<![{{IDENTIFIER_END_CHAR}}])(?:(?<=\.\.\.)|(?<!\.))
  AFTER_KEYWORD: (?![{{IDENTIFIER_END_CHAR}}])(?:(?=\.\.\.)|(?!\.))
  COMPARISON_OPERATOR: (?:[~]|[|]|[\^]|[$]|[*])
  UNQUOTED_STRING_TERMINATOR: (?:$|[\s"'`<>=:(){}\[\]]|{{COMMENT_START}})
  PROPERTY_NAME_TERMINATOR: (?:[:]|[=]|[\r\n])
  EOPL: "(?:$|{{WS}}*$|{{WS}}*[/][/].*$)"
  # Assignment whitespace shared by struct and element blocks.
  ASSIGN_EQUAL_OPERATOR: (?:{{WS}}*[=]{{WS}}*)
  STRUCT_BLOCK_EQUAL: (?:[=]{{WS}}*)
  SPARKLE_ELEMENT_BOUNDARY: (?:[;},:]|$|{{SPARKLE_ELEMENT_NAME}})
  # Brace blocks in struct bodies (`LuauStructBlockLine`). A quoted run holds
  # no `"` of its own, so it can only close at its first unescaped quote or run
  # to the end of the line, and the value patterns below cannot backtrack into
  # it to end a value at a `;` or `}` it contains.
  STRUCT_BLOCK_QUOTED: (?:"(?:\\.|[^"\\\n])*(?:"|$))
  # A comment inside a block starts where one starts after a struct value
  # (`StylingValue`): `--` after whitespace, `//` after whitespace and
  # before whitespace or the end of the line, and `--` after a value that is a
  # whole number, boolean or quoted string (`opacity = 1-- note`). Any other
  # `--` or `//` is text (`var(--gap)`, `&.card--large`, `http://example.com`).
  STRUCT_BLOCK_COMMENT_AFTER_WS: (?:{{LUAU_COMMENT_START}}|[/][/](?={{WS}}|$))
  # Whitespace that is not followed by a comment.
  STRUCT_BLOCK_WS_IN_TEXT: (?:{{WS}}(?!{{WS}}*{{STRUCT_BLOCK_COMMENT_AFTER_WS}}))
  # A single-quoted run, closed on its line. Outside an attribute selector a
  # `'` is an apostrophe, so only `STRUCT_BLOCK_BRACKET` reads one.
  STRUCT_BLOCK_SQUOTED: (?:'(?:\\.|[^'\\\n])*')
  # An attribute selector (`[data-label='a;b']`, `[data-label="x" i]`), read
  # whole: its quoted runs may hold braces, `;` and `--`. Outside them it
  # holds no brace, `'`, `"` or comment, so a `[` that does not start one is
  # an ordinary character (`STRUCT_BLOCK_LONE_BRACKET`).
  STRUCT_BLOCK_BRACKET_BODY: (?:{{STRUCT_BLOCK_QUOTED}}|{{STRUCT_BLOCK_SQUOTED}}|{{STRUCT_BLOCK_WS_IN_TEXT}}|[^\]\s"'{}])*
  STRUCT_BLOCK_BRACKET: (?:[\[]{{STRUCT_BLOCK_BRACKET_BODY}}[\]])
  STRUCT_BLOCK_LONE_BRACKET: (?:[\[](?!{{STRUCT_BLOCK_BRACKET_BODY}}[\]]))
  # A block header: a key, a selector or a keyframe position. It holds no
  # unquoted brace or `;` and no comment, and does not start with `=` or `,`,
  # so a brace in a comment never opens a block. A quoted run and an
  # attribute selector are read whole (`"quoted key"`, `&[data-label="x"]`,
  # `&[data-label='a;b']`). It does not end in a comma, so in
  # `{ "a", { v = 1 } }` the comma separates two entries (and is reported)
  # rather than ending a header; a selector list (`&.a, &.b {`) ends in a name.
  STRUCT_BLOCK_HEADER: (?:(?:{{STRUCT_BLOCK_QUOTED}}|{{STRUCT_BLOCK_BRACKET}}|{{STRUCT_BLOCK_LONE_BRACKET}}|[^\s{};"=,\[])(?:{{STRUCT_BLOCK_BRACKET}}|{{STRUCT_BLOCK_LONE_BRACKET}}|[^\s{};"\[]|{{STRUCT_BLOCK_QUOTED}}|{{STRUCT_BLOCK_WS_IN_TEXT}})*?(?<![\s,]))
  # Between a header and its `{`: whitespace and the optional `=`.
  STRUCT_BLOCK_ASSIGN: (?:{{WS}}*{{STRUCT_BLOCK_EQUAL}}?)
  # A whole number, boolean or quoted value, spelled as `NumericFieldValue`,
  # `BooleanFieldValue` and `StringFieldValue` spell it. After one, `--`
  # or `//` begins a comment with no whitespace before it.
  STRUCT_BLOCK_LITERAL: (?:[-]?(?:\d*[.])?\d+|Infinity|NaN|true|false|"(?:\\.|[^"\\\n])*")
  STRUCT_BLOCK_AFTER_LITERAL_COMMENT: (?:{{WS}}*(?:{{LUAU_COMMENT_START}}|[/][/]))
  STRUCT_BLOCK_LITERAL_THEN_COMMENT: (?:{{STRUCT_BLOCK_LITERAL}}{{STRUCT_BLOCK_AFTER_LITERAL_COMMENT}})
  # A struct value and the comment after it, for `StylingValue` and
  # `UnquotedStringFieldValue`. Captures: 1 a literal, 2 and 3 the `--` or
  # `//` comment after it (no whitespace needed), 4 any other value, 5 the
  # `--` comment after that (whitespace needed, so `var(--x)` stays whole),
