  LUAU_FUNCTION_HEADER_LINE_BREAK_START: (?<=[)])(?={{LUAU_HEADER_REST_OF_LINE}})
  # The rest of a header's line: spaces, block comments that close on it (read
  # whole, as `LUAU_METHOD_TRIVIA` reads one) and a line comment.
  LUAU_HEADER_REST_OF_LINE: (?:{{WS}}*{{LUAU_EXACT_LEVEL_BLOCK_COMMENT}}*(?:$|{{LUAU_LINE_COMMENT_START}}))
  # Where `LuauTargetLineBreak` and `LuauFunctionHeaderLineBreak` end: at the
  # start of a line that is not blank, a line comment or a `:` and a reserved
  # word, and anywhere past the `:` such a line begins with but its end,
  # once the annotation that read the `:` has ended.
  LUAU_COLON_LINE_BREAK_END: (?={{BEAT}})|{{LUAU_UNCARRIED_LINE_START}}|{{LUAU_PAST_LINE_START_COLON}}
  # lookaround: the line-start end needs to know what the line begins with
  # (GRAMMAR.md §11.5): a later line goes on being carried only while it is
  # blank or a line comment, and the `:` line is the carrier's, which
  # `LuauLineContinuation` would otherwise read.
  LUAU_UNCARRIED_LINE_START: ^(?!{{LUAU_CARRIED_LINE}})
  # A line the carrier reads: blank, a line comment, or a `:` and a reserved word.
  LUAU_CARRIED_LINE: (?:{{WS}}*(?:$|{{LUAU_LINE_COMMENT_START}}|{{LUAU_LINE_START_KEYWORD_METHOD}}))
  # lookaround: once `LuauTypeAnnotationOperation` has read the `:` line's
  # colon, the carrier ends at whatever follows it on the line, which only
  # the text before it shows, and leaves the line's end to the line rule.
  LUAU_PAST_LINE_START_COLON: (?<={{LUAU_LINE_START_COLON_BEHIND}})(?!$)
  # A line that begins with a `:`, up to a later position on it, inside a lookbehind.
  LUAU_LINE_START_COLON_BEHIND: (?:^{{WS}}*[:][^\n\r]*)
  # A `-` that is neither a `--` comment nor a `->` divert.
  LUAU_MINUS_LINE_START: -(?![->])
  # A `.` that is not concatenation, which a continuation line keeps reading
  # after its access parts, as a member access or a dangling accessor
  # (`LuauDanglingAccessor`), so the line does not end before it.
  LUAU_DANGLING_ACCESSOR_START: "[.]{{LUAU_SHARED_SINGLE_DOT_GUARD}}"
  # lookaround: LuauMultilineString claims a long-bracket opener. Tightening
  # the shared indexer token keeps LuauAccessPath and its chained/line ends
  # from waiting for LuauPropertyIndexer where only a string can follow.
  # Reordering a child list cannot close those parent scopes; no Switch is
  # involved, and the parent ends still need the same token distinction.
  LUAU_INDEXER_START: \[(?!=*\[)
  # A `[` that begins an indexer, not a `[[` or `[=[` long string.
  LUAU_INDEXER_LINE_CONTINUATION: (?:{{WS}}*{{LUAU_INDEXER_START}})
  # A line that continues a value inside an expression that spans lines (an
  # if expression's condition or arm): a continuation line, an indexer line,
  # or a `-` line, which there reads as subtraction from the value before it.
  LUAU_EXPRESSION_LINE_CONTINUATION: (?:{{LUAU_LINE_CONTINUATION}}|{{LUAU_INDEXER_LINE_CONTINUATION}}|{{WS}}*{{LUAU_MINUS_LINE_START}})
  # The `.` after a type's module name, with the whitespace Luau allows before
  # it. Every type rule that reads or yields to a qualified name uses this.
  LUAU_TYPE_QUALIFIER_DOT: '{{WS}}*[.]'
  # `?` is a postfix suffix (`number?`) that takes no right operand, so it
  # is not one of the binary type operators.
  LUAU_TYPE_OPTIONAL_OPERATOR: (?:[?])
  # The last character of a type: a name, a closing bracket or quote, or an
  # optional type's `?`. The `>` of a function type's `->` is not one, since
  # no type ends there: a type after the arrow is the function's result
  # (`() -> <b>(b) -> b`), and a `?` after it is a stray operator. The
  # lookbehinds this goes in spell that out as `[^-]>` (or a `>` that begins
  # its line) because VS Code's regex engine refuses a lookbehind nested in
  # another.
  LUAU_TYPE_END: (?:[\w)}\]"'`?]|[^-]>|^>)
  # A function header up to its parameter list: a header keyword, an optional
  # dotted or colon name path and an optional generics `<T>` run, which Luau
  # lets a space precede (`function`, `function t.g`, `function t:m`,
  # `function f<T>`, `function f <T>`). `LuauFunctionParameters` opens its
  # `(` only right after one, and `LuauFunctionBody` never opens there.
  LUAU_FUNCTION_HEADER: (?:(?:\b{{LUAU_HEADER_KEYWORDS}}\b{{WS}}*|{{LUAU_HEADER_LINE_START}}{{LUAU_HEADER_KEYWORDS}}\b{{LUAU_HEADER_COMMENTS}})(?:{{LUAU_NAME_BEHIND}}(?:{{WS}}*[.:]{{WS}}*{{LUAU_NAME_BEHIND}})*)?(?:{{WS}}*<[^<>\n]*>)?)
  # A token that a declaration's comma line break (`LuauCommaLineBreak`)
  # can reach but that begins a statement rather than a value: a statement
  # keyword or a type declaration. An `if` there is an if expression, as in
  # Luau. The declaration ends before it, so it is the enclosing block's
  # next statement.
  # `continue` is not one: where a value is due (after `=` or a comma, on
  # its line or the next) Luau reads it as a name, and a `continue` that
  # follows a complete declaration on its line is already a statement the
  # declaration's whitespace end leaves to the body (#984). Nor are `store`
  # and `const` without a name after them, which Luau reads as names
  # (`local a,` then `store = 1, 2`, #1328).
  LUAU_DECLARATION_STOP: (?:(?:end|else|elseif|until|return|break|goto|local|do|while|repeat|for)\b|{{LUAU_NAMED_DECLARATION_WORD}}|(?:export{{WS}}+)?type{{WS}}+{{LUAU_IDENTIFIER}})
  # After `continue`, where Luau reads it as a statement: the end of the
  # word, with no assignment, comma, call, index or member after it, which
  # make it a name (`continue = 2`, `continue(x)`), as Luau's parser decides
  # once it has read the name (#984).
  # lookaround: before those, `continue` is a name that `LuauReassignment`
  # or `LuauAccessPath` reads, after `LuauContinueStatement` in
  # `LuauDeclarations`. A begin cannot read the name first and decide after,
  # as Luau's parser does, and putting the statement after them would let
  # a bare `continue` begin an access path.
  LUAU_CONTINUE_STATEMENT_AHEAD: (?:{{LUAU_NAME_END}}(?!{{WS}}*(?:{{LUAU_ASSIGNMENT_OPERATORS}}|[,.:(\[{"'`])))
  # The whitespace that ends a type, unless the optional-type suffix follows
  # it (`number ?`), which Luau allows and which still belongs to the type,
  # or a union or intersection operator does (`number | string`), which
  # continues the type.
  LUAU_TYPE_WHITESPACE_END: (?:{{WS}}(?!{{WS}}*(?:{{LUAU_TYPE_OPTIONAL_OPERATOR}}|[&]|[|])))
  LUAU_TYPE_BINARY_OPERATORS: (?:[&]|[|]|[-][>])
  # The start of a line that ends the type before it, and every rule that
  # contains the type: any line with text that does not start with `|`. A
  # line starting with `|` continues the type as a union, and a blank line
  # keeps it open for the line after. In story text `&` begins a Luau
  # statement and `->` a divert at the start of a line, so they end the type
  # there; in Luau code an `&` line continues the type as its own node
  # (`LuauTypeOperatorLineContinuation`).
  LUAU_TYPE_LINE_BREAK: (?:^{{WS}}*[^|\s])
  # A block comment that closes on its own line, with the whitespace after
  # it. Its text may hold a `]` that does not close it (`--[[a]b]]`,
  # `--[=[a]b]=]`). After a type or a value, when code follows it, the type,
  # every rule around it, and a declaration end before it
  # (`function f(): number --[[c]] g()`, `local w: number --[[c]] print(w)`).
  # Each use checks that a type or value ends before it, so a comment after
  # an operator or a comma (`type A = --[[c]] number`,
  # `local a, --[[c]] b = 1, 2`) leaves the rule going.
  # The comment closes only at brackets of its own level, as
  # `LuauBlockComment` does, so a `]]` inside `--[=[a]]b]=]` does not close
  # it. A variable cannot hold a backreference that every use can number, so
  # levels up to three are spelled out, and a comment of a longer level is
  # never one of these: after a value or a type it is read by
  # `LuauValueTrailingBlockComment` or `LuauTypeTrailingBlockComment`,
  # whose ends match the level, on its opening line as on a later one.
  LUAU_BLOCK_COMMENT_ON_LINE: (?:{{WS}}*{{LUAU_COMMENT_START}}\[{{LUAU_BLOCK_COMMENT_REST}}(?:{{WS}}*))
  # The rest of a block comment of level up to three after `--[`.
  LUAU_BLOCK_COMMENT_REST: (?:{{LUAU_BLOCK_COMMENT_LEVEL_0_REST}}|{{LUAU_BLOCK_COMMENT_LEVEL_1_REST}}|{{LUAU_BLOCK_COMMENT_LEVEL_2_REST}}|{{LUAU_BLOCK_COMMENT_LEVEL_3_REST}})
  # The rest of a level-0 block comment after `--[`: `[`, its text, `]]`.
  LUAU_BLOCK_COMMENT_LEVEL_0_REST: \[(?:[^\]\n]|\](?!\]))*\]\]
  # The rest of a level-1 block comment after `--[`: `=[`, its text, `]=]`.
  LUAU_BLOCK_COMMENT_LEVEL_1_REST: =\[(?:[^\]\n]|\](?!=\]))*\]=\]
  # The rest of a level-2 block comment after `--[`: `==[`, its text, `]==]`.
  LUAU_BLOCK_COMMENT_LEVEL_2_REST: ==\[(?:[^\]\n]|\](?!==\]))*\]==\]
  # The rest of a level-3 block comment after `--[`: `===[`, its text, `]===]`.
  LUAU_BLOCK_COMMENT_LEVEL_3_REST: ===\[(?:[^\]\n]|\](?!===\]))*\]===\]
  # The comments after a block's closing `end` that run to the end of its
  # line: block comments on the line, a line comment, or both
  # (`function m() return 1 end --[[ c ]]`, `do x = 1 end -- c`, #1314). A
  # block's end takes them, so they belong to the block it closes: at story
  # scope nothing is displayed for them. A comment with code after it on the
  # line is left to the rule that reads that code. This matches only when
  # there is a comment, so whitespace alone after `end` stays where it is.
  LUAU_END_TRAILING_COMMENTS: (?:{{WS}}*(?:{{LUAU_ANY_LEVEL_BLOCK_COMMENT}}+{{LUAU_LINE_COMMENT_TO_LINE_END}}?|{{LUAU_LINE_COMMENT_TO_LINE_END}})$)
  # One or more block comments that close on their line, with the
  # whitespace around them, where no value or type has begun: between a
  # scope modifier and `function`, after an assignment operator, and after a
  # block's closing `end` (#1321). `LuauBlockComment` reads each comment in
  # the rule that takes them; this finds where they end. A variable cannot
  # match a close to its opening's level with a backreference: a nested
  # capture moves the captures after it, and an `end` reads `\N` as the
  # begin's capture. So levels up to eight are spelled out, each closing
  # only at its own level (`--[====[a]=====]b]====]` is one comment), and a
  # longer level closes at the first close of nine or more `=`. The
  # whitespace before the first comment is read once, and each comment
  # takes only the whitespace after it, so a run of spaces between two
  # comments has one reading: with whitespace on both sides of each, a
  # failing match tried every split of every run, which grew exponentially
  # with the number of comments on the line.
  LUAU_BLOCK_COMMENTS_ON_LINE: (?:{{WS}}*{{LUAU_ANY_LEVEL_BLOCK_COMMENT}}+)
  # A block comment of any level that closes on its line, with the
  # whitespace after it.
  LUAU_ANY_LEVEL_BLOCK_COMMENT: (?:{{LUAU_COMMENT_START}}\[{{LUAU_ANY_LEVEL_BLOCK_COMMENT_REST}}{{WS}}*)
  # The rest of a block comment of any level after `--[`.
  LUAU_ANY_LEVEL_BLOCK_COMMENT_REST: (?:{{LUAU_BLOCK_COMMENT_REST}}|{{LUAU_BLOCK_COMMENT_LEVELS_4_TO_8_REST}}|{{LUAU_BLOCK_COMMENT_LONGER_LEVEL_REST}})
  # The rest of a block comment of level four to eight after `--[`.
  LUAU_BLOCK_COMMENT_LEVELS_4_TO_8_REST: (?:{{LUAU_BLOCK_COMMENT_LEVEL_4_REST}}|{{LUAU_BLOCK_COMMENT_LEVEL_5_REST}}|{{LUAU_BLOCK_COMMENT_LEVEL_6_REST}}|{{LUAU_BLOCK_COMMENT_LEVEL_7_REST}}|{{LUAU_BLOCK_COMMENT_LEVEL_8_REST}})
  # The rest of a level-four block comment after `--[`: `====[`, its text,
  # `]====]`. Like the levels below it, its text takes any character but
  # the `]` of its own close.
  # lookaround: LuauBlockComment reads the comment, closing at its own level
  # with a backreference no variable can hold; a negated class cannot stop
  # the text before a close several characters long.
  LUAU_BLOCK_COMMENT_LEVEL_4_REST: (?:====\[(?:[^\]\r\n]|\](?!====\]))*\]====\])
  # The rest of a level-five block comment after `--[`.
  # lookaround: LuauBlockComment reads the comment; see
  # `LUAU_BLOCK_COMMENT_LEVEL_4_REST`.
  LUAU_BLOCK_COMMENT_LEVEL_5_REST: (?:=====\[(?:[^\]\r\n]|\](?!=====\]))*\]=====\])
  # The rest of a level-six block comment after `--[`.
  # lookaround: LuauBlockComment reads the comment; see
  # `LUAU_BLOCK_COMMENT_LEVEL_4_REST`.
  LUAU_BLOCK_COMMENT_LEVEL_6_REST: (?:======\[(?:[^\]\r\n]|\](?!======\]))*\]======\])
  # The rest of a level-seven block comment after `--[`.
  # lookaround: LuauBlockComment reads the comment; see
  # `LUAU_BLOCK_COMMENT_LEVEL_4_REST`.
  LUAU_BLOCK_COMMENT_LEVEL_7_REST: (?:=======\[(?:[^\]\r\n]|\](?!=======\]))*\]=======\])
  # The rest of a level-eight block comment after `--[`.
  # lookaround: LuauBlockComment reads the comment; see
  # `LUAU_BLOCK_COMMENT_LEVEL_4_REST`.
  LUAU_BLOCK_COMMENT_LEVEL_8_REST: (?:========\[(?:[^\]\r\n]|\](?!========\]))*\]========\])
  # The rest of a block comment of level nine or more after `--[`. Its text
  # takes any character but a `]` that nine or more `=` and a `]` follow, so
  # a close of a lower level stays text; a close of another level of nine or
  # more ends it early.
  # lookaround: LuauBlockComment reads the comment; see
  # `LUAU_BLOCK_COMMENT_LEVEL_4_REST`.
  LUAU_BLOCK_COMMENT_LONGER_LEVEL_REST: (?:=========+\[(?:[^\]\r\n]|\](?!=========+\]))*\]=========+\])
  # What `LuauTypeOperatorComments` and its story twin go on reading: another
  # block comment, or the generics of a function type after the comments.
  LUAU_BLOCK_COMMENT_OR_GENERICS_START: (?:{{LUAU_COMMENT_START}}\[=*\[|[<])
  # A line comment and the rest of its line.
  LUAU_LINE_COMMENT_TO_LINE_END: (?:{{LUAU_LINE_COMMENT_START}}[^\r\n]*)
  # Block comments after an operator with code after them on the line, which
  # the operator takes (`w = --[[ c ]] --[[ d ]] if c then`, #1298).
  # lookaround: LuauAssignmentLineBreak and the operation's LuauComment read
  # comments that end the line or come before a line comment, so the value
  # is read from the next line (`w = --[[c]]` then `5`). The operator's
  # end can see only its own line, so it tells the two apart by what
  # follows the last comment; reordering cannot, since both begin at the
  # same comment.
  LUAU_OPERATOR_COMMENTS_BEFORE_CODE: (?:{{LUAU_BLOCK_COMMENTS_ON_LINE}}(?!{{WS}}*(?:{{LUAU_COMMENT_START}}|$)))
  # What follows a block comment that ends a type: anything but a type
  # operator, the `?` suffix, a qualifier or generics, or what ends the type
  # anyway (a comma, `=`, a closing bracket, `;`, the line's end). A `:`
  # that a reserved word follows is no code either: the type reads it as a
  # method's after the comment (`local x: T --[[c]] :end`, I-1447).
  LUAU_TYPE_CODE_AHEAD: (?![|&?.<>=,;)\]}]|[-][>]|{{WS}}|$|{{LUAU_COMMENT_START}}|{{LUAU_COLON_BEFORE_RESERVED_WORD}})
  # What follows a block comment that ends a declaration or its assignment:
  # a word that begins a statement, not `and` or `or`.
  LUAU_STATEMENT_CODE_AHEAD: (?=(?!(?:and|or)\b)[A-Za-z_])
  # Just after a value and the whitespace before a comment: the value ends
  # in a word, a closing bracket, a quote, the vararg `...` or a regex literal
  # (`@/x/`, whose closing `/` is never read as division), and the word is
  # not a keyword operator (`a and --[[c]] b` keeps its operand) or a scope
  # modifier (`local --[[c]] w = 5`).
  AFTER_LUAU_VALUE: (?:(?<=(?:[\w)}\]"'`]|\.\.\.|@/{{LUAU_REGEX_BODY}}/){{WS}}*)(?<!(?:^|[^\w.])(?:and|or|not|local|store|const){{WS}}*))
  # Just after a value that Luau cannot call, which a statement beginning
  # with `(` can follow (`5 --[[c]] (function() end)()`): a literal, which is
  # not a prefix expression. That is a word that is a number of any spelling
  # (`0x5`, `5e0`, `1_000`, `.5`), `true`, `false`, `nil` or a function's
  # `end`; `...`; a regex literal; or a closing quote, `}` or long bracket
  # (`]]`, `]=]`), read as a string or table literal. After a prefix
  # expression, `(` is a call of it, as in Luau: after a name (`g (2)`), a
  # call (`g() --[[c]] (2)`), a parenthesized value or an index (`t[1]`), whose
  # closing `)` or single `]` is not in this set. A call written with a string
  # or table argument (`f"x"`, `f{1}`) or an index holding an index
  # (`t[a[1]]`) ends like a literal, so a `(` statement after one of those and
  # a comment is read as a new statement.
  AFTER_LUAU_UNCALLABLE_VALUE: (?<=(?:[}"'`]|\]=*\]|\.\.\.|@/{{LUAU_REGEX_BODY}}/[dgimsuvy]*|(?:^|[^\w.])(?:\.?\d[\w.]*|true|false|nil|end)){{WS}}*)
  # A block comment after a value, with a statement after it on the same
  # line (`w = 5 --[[c]] print(1)`, `local w = 5--[[c]] print(1)`). The
  # comment takes the whitespace after it, so a rule that ends at whitespace
  # before the next statement ends here instead, before the comment. A
  # comment that spans lines is `LuauValueTrailingBlockComment`.
  LUAU_VALUE_COMMENT_BEFORE_STATEMENT: (?:{{AFTER_LUAU_VALUE}}{{LUAU_BLOCK_COMMENT_THEN_STATEMENT_AHEAD}}|{{AFTER_LUAU_UNCALLABLE_VALUE}}{{LUAU_BLOCK_COMMENT_THEN_PAREN_AHEAD}})
  # A block comment on this line, then a word that begins a statement.
  LUAU_BLOCK_COMMENT_THEN_STATEMENT_AHEAD: (?={{LUAU_BLOCK_COMMENT_ON_LINE}}{{LUAU_STATEMENT_CODE_AHEAD}})
  # A block comment on this line, then a `(` that begins a statement.
  LUAU_BLOCK_COMMENT_THEN_PAREN_AHEAD: (?={{LUAU_BLOCK_COMMENT_ON_LINE}}[(])
  # The openings of `LuauFunctionBody`, in the order its comment gives them:
  # Before the closing brackets a multiline return-type comment leaves.
  LUAU_FUNCTION_BODY_AT_COMMENT_CLOSE: (?<!{{LUAU_FUNCTION_HEADER}})(?=\]=*\]{{LUAU_TYPE_CODE_AHEAD}})
  # After the header's last character, before whitespace and a statement.
  LUAU_FUNCTION_BODY_AT_SPACED_STATEMENT: (?<={{LUAU_TYPE_END}})(?<!{{LUAU_FUNCTION_HEADER}})(?={{WS}}+{{LUAU_NOT_END_COMMENT_OR_RETURN_TYPE_AHEAD}}\S)
  # Right after the parameter list's `)`, before a statement's first character.
  LUAU_FUNCTION_BODY_AFTER_PARAMETERS: (?<=[)])(?={{LUAU_NOT_END_OR_COMMENT_AHEAD}}(?:[\w"'`(\[{&\-@#;]|::))
  # After the header, before a `;` or a block comment.
  LUAU_FUNCTION_BODY_AT_SEMICOLON_OR_COMMENT: (?<={{LUAU_TYPE_END}}{{WS}}*)(?<!{{LUAU_FUNCTION_HEADER}}{{WS}}*)(?={{WS}}*(?:;|{{LUAU_COMMENT_START}}\[=*\[))
  # The line break after the header.
  LUAU_FUNCTION_BODY_AT_LINE_BREAK: (?<={{LUAU_TYPE_END}}){{WS}}*\n
  # The start of a line that does not close the function and begins a statement.
  LUAU_FUNCTION_BODY_AT_LINE_START: ^(?!{{BEAT}}|{{WS}}*\bend\b)(?={{WS}}*[\w"'`(\[{&\-@#:;.])
  # A code line at a define's method header's own indentation that is not
  # the method's `end`: the define's next member, or the line after a call
  # (I-1454). After the indentation comes a character other than whitespace
  # or `-`, or a `-` that begins no `--` comment, so a blank or comment line
  # decides nothing. `\1` is `LuauMethodDefinition`'s begin capture, the
  # header's indentation.
  # lookaround: a deeper line is the method's body (LuauBlockBody), and the
  # method's own `end` at that indentation is the end's last alternative;
  # neither can be told from this line by order, since all three begin at
  # the line start.
  LUAU_METHOD_SAME_INDENT_CODE: \1(?!end\b)(?:[^\s-]|[-][^-])
  # The start of a line a define's method does not hold (I-1454): a code
  # line at the header's indentation (`LUAU_METHOD_SAME_INDENT_CODE`), or an
  # `end` written left of the header, which is the define's. A line of
  # another kind left of the header stays in the method, so a body written
  # less indented than its header is still the method's, and the formatter
  # indents it. It matches no text: the line is the define's.
  # lookaround: as for `LUAU_METHOD_SAME_INDENT_CODE`; an `end` at the
  # header's indentation or deeper starts with `\1`, and is the method's.
  LUAU_METHOD_LINE_AFTER_BODY: ^(?={{LUAU_METHOD_SAME_INDENT_CODE}})|^(?!\1)(?={{WS}}*end\b)
  # Not `end` or a comment.
  LUAU_NOT_END_OR_COMMENT_AHEAD: (?!end\b|{{LUAU_COMMENT_START}})
  # Not `end`, a comment, a return type's `:` or generics' `<`.
  LUAU_NOT_END_COMMENT_OR_RETURN_TYPE_AHEAD: (?!end\b|{{LUAU_COMMENT_START}}|{{LUAU_SINGLE_COLON}}|[<])
  # A `:` that is not the start of `::`.
  LUAU_SINGLE_COLON: '[:](?![:])'
  # Just after a token an inline `if` expression can follow: a line start,
  # an operator, an opening bracket, a comma, `..` or a keyword, with block
  # comments after it on its line or not (`local x = --[[c]] if c then`).
  #
  # Luau reads past such comments; without them the `if` would be read as
  # a bare keyword, and an `else` that begins a later line of the
  # expression would close the body around it (#1906).
  #
  # lookaround: LuauIfBlock and LuauSparkdownIfBlock own an `if` that begins
  # a statement, and LuauTernaryExpression one that begins a value. Both
  # begin at the `if`, and a body tries the statement rules first, so only
  # what comes before the `if` tells them apart: a token no statement ends
  # with can only be followed by a value. The parent's end cannot carry the
  # choice, and splitting the rules leaves the same `if` to both. A comment
  # between the token and the `if` leaves the token the one the `if` follows.
  AFTER_LUAU_TERNARY_PRECEDING_TOKEN: (?<=^{{WS}}*|{{LUAU_TERNARY_PRECEDING_TOKEN}}{{WS}}*|{{LUAU_TERNARY_PRECEDING_TOKEN}}{{LUAU_PLAIN_BLOCK_COMMENTS}})
  # A block comment that closes on its line, for a lookbehind. A lookbehind
  # holds no lookaround or backreference in VS Code's regex engine, so this
  # is `LUAU_BLOCK_COMMENT_ON_LINE` spelled without them. Up to level three,
  # each level's text takes a `]` only together with the character after it
  # when that character does not go on to the level's close (`--[[a]b]]`,
  # `--[=[a]]b]=]`), and may end with the part of the close a longer close
  # holds (`--[=[a]]=]`, `--[==[a]=]==]`), so the comment closes only at
  # brackets of its own level and never runs on past its close into the
  # text after it. A longer level's text holds no `]` at all
  # (`--[====[c]====]`), so it too closes at its first close; that close's
  # level is not checked against the opening's.
  LUAU_PLAIN_BLOCK_COMMENT: (?:--{{LUAU_PLAIN_LONG_BRACKET}})
  # The long bracket of such a comment, also a long string's on its line.
  LUAU_PLAIN_LONG_BRACKET: (?:\[(?:{{LUAU_PLAIN_LONG_BRACKET_LEVELS_TO_3}}|{{LUAU_PLAIN_BLOCK_COMMENT_LONGER_LEVEL}}))
  LUAU_PLAIN_LONG_BRACKET_LEVELS_TO_3: (?:{{LUAU_PLAIN_BLOCK_COMMENT_LEVEL_0}}|{{LUAU_PLAIN_BLOCK_COMMENT_LEVEL_1}}|{{LUAU_PLAIN_BLOCK_COMMENT_LEVEL_2}}|{{LUAU_PLAIN_BLOCK_COMMENT_LEVEL_3}})
  LUAU_PLAIN_BLOCK_COMMENT_LONGER_LEVEL: ====+\[{{LUAU_PLAIN_COMMENT_CHAR}}*\]====+\]
  # A comment character other than a `]`, or a `]` the next character keeps
  # from closing a level-0 comment.
  LUAU_PLAIN_COMMENT_CHAR: (?:[^\]\r\n])
  LUAU_PLAIN_BLOCK_COMMENT_LEVEL_0: \[(?:{{LUAU_PLAIN_COMMENT_CHAR}}|\]{{LUAU_PLAIN_COMMENT_CHAR}})*\]\]
  LUAU_PLAIN_BLOCK_COMMENT_LEVEL_1: =\[(?:{{LUAU_PLAIN_COMMENT_CHAR}}|\][^=\r\n]|\]={{LUAU_PLAIN_COMMENT_CHAR}})*\]?\]=\]
  LUAU_PLAIN_BLOCK_COMMENT_LEVEL_2: ==\[(?:{{LUAU_PLAIN_COMMENT_CHAR}}|\][^=\r\n]|\]=[^=\r\n]|\]=={{LUAU_PLAIN_COMMENT_CHAR}})*(?:\]=?)?\]==\]
  LUAU_PLAIN_BLOCK_COMMENT_LEVEL_3: ===\[(?:{{LUAU_PLAIN_COMMENT_CHAR}}|\][^=\r\n]|\]=[^=\r\n]|\]==[^=\r\n]|\]==={{LUAU_PLAIN_COMMENT_CHAR}})*(?:\]={0,2})?\]===\]
  # One or more such comments, with the whitespace around them.
  LUAU_PLAIN_BLOCK_COMMENTS: (?:{{WS}}*(?:{{LUAU_PLAIN_BLOCK_COMMENT}}{{WS}}*)+)
  # Block comments between a header keyword and its name, when the keyword
  # begins its line (`style --[[ note ]] banner with`,
  # `local function --[[ c ]] f(x)`). Only then: a keyword written inside a
  # comment of a body line (`--[[style --[[note]] accidental`) is no header,
  # and the name rules are tried again at every position of the body. A
  # comment that spans lines still hides the name, since a lookbehind sees
  # no further back than its line in VS Code.
  LUAU_HEADER_COMMENTS: (?:{{LUAU_PLAIN_BLOCK_COMMENTS}})
  # Block comments that begin a line and close on it, for a lookbehind that
  # starts at `^` (`LuauMethodDefinition`, I-1506). Besides
  # `LUAU_PLAIN_BLOCK_COMMENTS`, a comment of level four or more may hold a
  # `]` (`--[====[a]b]====]`): its text runs to the last close of level four
  # or more before the position, so the reading stays as it was before the
  # header's begin was anchored to its line. The cost: two such comments with
  # code between them pass over that code (`--[====[a]====] y = 1;
  # --[====[b]====] f()`).
  LUAU_LINE_LEADING_BLOCK_COMMENTS: (?:{{LUAU_PLAIN_BLOCK_COMMENTS}}|{{LUAU_PLAIN_BLOCK_COMMENTS}}?{{WS}}*{{LUAU_LONGER_LEVEL_COMMENT_TO_LAST_CLOSE}}{{LUAU_PLAIN_BLOCK_COMMENTS}}?{{WS}}*)
  # A define's header up to its `with` and the whitespace or block comments
  # after it (`define X with`, `define X as Y with --[[c]]`), for a
  # lookbehind: a method written there (`define X with f() return 1 end
  # end`) opens as one written at a line's start does (I-1506). It is the
  # header's own shape, `define`, a name, any `as` and parent clauses
  # (`LuauInheritanceOperation` reads each), then `with`, so a `with` that
  # is a value in the body (`z = with f()`) is no header's, and a define
  # nested in a one-line block (`if c then define X with f() …`) is. The
  # line before `define` holds code and closed block comments only
  # (`LUAU_CODE_BEFORE_DEFINE_HEADER`), so header-shaped text in a comment
  # (`y = 1; --[[define Fake with --[[c]] print(1)`) is no header. The cost:
  # a `--` in a string before the header (`s = "--"; define X with f() …`)
  # hides the header-line method.
  LUAU_DEFINE_HEADER_TO_WITH: (?:{{LUAU_CODE_BEFORE_DEFINE_HEADER}}\bdefine{{LUAU_DEFINE_HEADER_GAP}}{{LUAU_NAME_BEHIND}}{{LUAU_DEFINE_HEADER_PARENT}}*{{LUAU_DEFINE_HEADER_GAP}}with\b{{WS}}*{{LUAU_LINE_LEADING_BLOCK_COMMENTS}}?)
  # The line's start up to such a header: characters that open no comment,
  # and block comments that close on the line.
  LUAU_CODE_BEFORE_DEFINE_HEADER: (?:^{{LUAU_CODE_CHAR_OR_CLOSED_COMMENT}}*)
  LUAU_CODE_CHAR_OR_CLOSED_COMMENT: (?:[^\-\r\n]|-[^\-\r\n]|{{LUAU_PLAIN_BLOCK_COMMENT}})
  # An `as` and parent name of such a header.
  LUAU_DEFINE_HEADER_PARENT: (?:{{LUAU_DEFINE_HEADER_GAP}}as{{LUAU_DEFINE_HEADER_GAP}}{{LUAU_NAME_BEHIND}})
  # Whitespace or block comments between the words of such a header.
  LUAU_DEFINE_HEADER_GAP: (?:{{LUAU_PLAIN_BLOCK_COMMENTS}}|{{WS}}+)
  # A comment of level four or more, whose text runs to the last close of
  # level four or more on its line, `]` included.
  LUAU_LONGER_LEVEL_COMMENT_TO_LAST_CLOSE: --\[====+\[[^\r\n]*\]====+\]
  # The start of the line a header keyword begins, with the attributes and
  # modifiers a declaration's keyword may follow (`@native local function`,
  # `export type function`).
  LUAU_HEADER_LINE_START: (?:^{{WS}}*{{LUAU_HEADER_ATTRIBUTE}}*{{LUAU_DECLARATION_MODIFIER}}*)
  # An attribute before a function's header keyword, with the whitespace or
  # block comments after it (`@native function`, `@native --[[c]] function`).
  # A list holding a long string of level four or more with a `]` in it
  # hides a commented header's name (`LUAU_PLAIN_ATTRIBUTE_LIST_TEXT`).
  LUAU_HEADER_ATTRIBUTE: (?:(?:{{LUAU_ATTRIBUTE_NAME_ON_LINE}}|@\[{{LUAU_PLAIN_ATTRIBUTE_LIST_TEXT}}*\]){{LUAU_ATTRIBUTE_TRIVIA}}*)
  LUAU_DECLARATION_MODIFIER: (?:{{LUAU_DECLARATION_MODIFIER_WORDS}}\b{{WS}}*)
  LUAU_DECLARATION_MODIFIER_WORDS: (?:local|export|type)
  # The keywords that declare a function's name.
  LUAU_DECLARATION_KEYWORDS: (?:function|external)
  # The keywords that begin a header whose parameter list follows its name.
  LUAU_HEADER_KEYWORDS: (?:function|scene|branch|external|component)
  # A token an inline `if` expression can follow, other than a line start.
  LUAU_TERNARY_PRECEDING_TOKEN: (?:[-+*/%^<>=~(\[{,]|[.][.]|{{LUAU_TERNARY_PRECEDING_KEYWORDS}})
  # An `if` whose line holds an `else`, `elseif` or `}` before any lone `=`.
  LUAU_TERNARY_WITH_ELSE_AHEAD: (?={{WS}}*if\b{{LUAU_TERNARY_CONDITION_CHAR}}*{{LUAU_TERNARY_ELSE_OR_CLOSE}})
  # A character of an inline `if` line other than `=`, or a comparison.
  LUAU_TERNARY_CONDITION_CHAR: (?:[^\n=]|==|~=|<=|>=)
  # The `else`, `elseif` or `}` that marks an inline `if` expression.
  LUAU_TERNARY_ELSE_OR_CLOSE: (?:\belse(?:if)?\b|\})
  # Just after a braced alternator's `|`, with any `name =` of a match arm.
  AFTER_ALTERNATOR_ARM_SEPARATOR: (?<=[|]{{WS}}*(?:{{LUAU_NAME_BEHIND}}{{WS}}*[=]{{WS}}*)?)
  # A `-> end` that the alternator's `}` directly follows.
  END_DIVERT_CLOSING_ALTERNATOR: '{{WS}}*[-][>]{{WS}}*{{LUAU_END_KEYWORDS}}(?![{{IDENTIFIER_END_CHAR}}]){{WS}}*[}]'
  # A block comment between `.` and a member; captures the comment's level,
  # which its close matches with `\3`, so it must follow exactly two groups.
  _LUAU_DANGLING_ACCESSOR_COMMENT_: (?:--\[(=*)\[(?:[^\]\r\n]|\](?!\3\]))*\]\3\]{{WS}}*)
  # A name that is not a reserved word.
  LUAU_UNRESERVED_IDENTIFIER: (?!{{LUAU_RESERVED_WORDS}}){{LUAU_IDENTIFIER}}
  LUAU_VALUE_BINARY_OPERATORS: (?:{{LUAU_LOGICAL_KEYWORDS}}|{{LUAU_ASSIGNMENT_OPERATORS}}|{{LUAU_COMPARE_OPERATORS}}|{{LUAU_ARITHMETIC_OPERATORS}}|{{LUAU_CONCAT_OPERATOR}}|{{LUAU_TYPECAST_OPERATOR}})
  # lookaround: LuauTypeGenerics, LuauTypeBinaryOperation, LuauComment and
  # the cast operator retain `<`, `->`, comments and `::`. Splitting the
  # enclosing type rules cannot return other value operators to their parent.
  LUAU_VALUE_OPERATOR_AFTER_TYPE: (?![-][>]|{{LUAU_TYPECAST_OPERATOR}}|{{LUAU_COMMENT_START}}){{LUAU_VALUE_BINARY_OPERATORS}}
  # lookaround: LuauCompareOperation owns `<=`, which cannot open arguments.
  # Splitting the reference wrapper cannot distinguish the shared `<` token.
  LUAU_TYPE_GENERIC_OPEN: '[<](?![=])'
  # lookaround: LuauConcatOperation owns `..`; only a single dot qualifies.
  LUAU_TYPE_QUALIFICATION_OPEN: "[.]{{LUAU_SHARED_SINGLE_DOT_GUARD}}"
  LUAU_TYPE_QUALIFICATION_END: '[,;)\]}>=?&|<]'
  LUAU_TYPE_QUALIFICATION_RECOVERY: (?:{{LUAU_NON_TYPE_KEYWORDS}}|{{LUAU_TYPE_QUALIFICATION_END}}|{{LUAU_VALUE_OPERATOR_AFTER_TYPE}})
  # lookaround: LuauComment and LuauNamedTypeArguments retain trivia and the
  # first argument list; ending before either loses reference ownership.
  LUAU_NAMED_TYPE_FOLLOW: (?!{{LUAU_COMMENT_START}}|{{LUAU_TYPE_GENERIC_OPEN}}|{{LUAU_TYPE_QUALIFICATION_OPEN}})[^\s]
  LUAU_TYPE_QUALIFIED_NAME_SEGMENT: (?:{{LUAU_TYPE_QUALIFIER_DOT}}{{WS}}*{{LUAU_IDENTIFIER}})
  # The `;` that ends a statement, after any whitespace and comments on its
  # line, which Luau reads as trivia. Both engines match a regex against its
  # line alone (GRAMMAR.md §11.5), so this never reaches the next line. A block
  # comment closes on its line at the first closing bracket of its own level,
  # as `LuauBlockComment` does, so its level is captured and matched by `\4`:
  # every rule using this must put exactly three capture groups before it. A
  # line comment must run to its line end, so the token is never a character
  # inside it (`local x: -- a, b`).
  _LUAU_TRIVIA_AHEAD_: (?:{{WS}}|--\[(=*)\[(?:[^\]\r\n]|\](?!\4\]))*\]\4\]|--(?!\[=*\[)[^\r\n]*(?![^\r\n]))*
  _LUAU_SEMICOLON_AHEAD_: (?:{{_LUAU_TRIVIA_AHEAD_}}[;])
  # The same, ending at a token that cannot start an expression: a `;`, `,`
  # or `=` (not `==`, nor the end of an operator such as `<=` or `+=`, which
  # the operator before it keeps whole), a closing bracket, or a keyword that
  # cannot start an expression, which is where the next statement or the
  # block's `end` begins. Same capture-group rule.
  _LUAU_EXPRESSION_END_AHEAD_: (?:{{_LUAU_TRIVIA_AHEAD_}}(?:[;,)\]}]|(?<![-+*/%^.<>~=])=(?!=)|{{LUAU_NON_EXPRESSION_KEYWORDS}}))
  # Whitespace and block comments that close on their line, which every
  # tokenizer reads from the line alone. It holds no capture: textmate-grammar-tree
  # requires a match's captures to cover the match exactly, so a level captured
  # inside a lookahead (`--[==[c]==]`) would throw.
  LUAU_LINE_TRIVIA_AHEAD: (?:{{WS}}*{{LUAU_ANY_LEVEL_BLOCK_COMMENT}}*)
  # A token that cannot start the type that must follow a type annotation's
  # `:` or a type's `|`, `&` or `->`: a `;`, `,` or `=` (not `==`), a closing
  # bracket or `>`, or a keyword that cannot start a type, which is where the
  # next statement or the block's `end` begins.
  # lookaround: LuauCompareOperator reads `==`.
  LUAU_TYPE_ANNOTATION_END_TOKEN: (?:[;,)\]}>]|=(?!=)|{{LUAU_NON_TYPE_KEYWORDS}})
  # That token after trivia on the same line. It stops at the line's end,
  # unlike `_LUAU_TRIVIA_AHEAD_`, so a `:` or operator that ends its line is
  # judged by its own line in both engines (I-1453): the type after it takes
  # the line break, and where the next line leaves it empty (`local w:` then
  # `local z = 1`), the converter reports the missing type from the tree.
  LUAU_TYPE_ANNOTATION_END_AHEAD: (?:{{LUAU_LINE_TRIVIA_AHEAD}}{{LUAU_TYPE_ANNOTATION_END_TOKEN}})
  # The same in a story statement, which ends at its line, so its line's end,
  # after any line comment, ends the type too.
  LUAU_SPARKDOWN_TYPE_ANNOTATION_END_AHEAD: (?:{{LUAU_LINE_TRIVIA_AHEAD}}{{LUAU_LINE_COMMENT_TO_LINE_END}}?(?:$|{{LUAU_TYPE_ANNOTATION_END_TOKEN}}))
  LUAU_BINARY_OPERATORS: (?:{{LUAU_TYPE_OPTIONAL_OPERATOR}}|{{LUAU_TYPE_BINARY_OPERATORS}}|{{LUAU_VALUE_BINARY_OPERATORS}}|{{LUAU_ALTERNATOR_OPERATOR}})
  # Used as the lookahead set in `_LUAU_BINARY_OPERATOR_AHEAD_`. Deliberately
  # excludes the bare `|` token — `|` is overloaded as both a type-union
  # operator (`Foo | Bar`) AND the alternator-arm separator. When a value
  # expression (parenthetical, string, number, table, etc.) is followed by
  # ` | <arm-name> = ...`, treating the pipe as a binary operator would
  # consume the trailing whitespace and prevent the surrounding alternator
  # block's `LuauAlternatorSeparator` from matching `<ws>|<ws>` itself.
  # Type unions written in expression context are an edge case that loses
  # the trailing-WS-as-OptionalSeparator optimization here — `|` in unions
  # still highlights via the type-context rules separately.
  # Also excludes the optional-type suffix `?`: it is glued to the type it
  # ends (`number?`), so the type rules that end with this pattern must not
  # capture a zero-width separator before it for the formatter to widen into
  # `number ?`. `LuauTypeOptionalOperator` reads the `?` itself, together with
  # any whitespace before it.
  # Includes a comment start: a value or a type takes the whitespace before a
  # comment as its separator, so the rule around it stays open across a
  # block comment to what follows (a call's arguments, `g --[[c]] (2)`; a
  # type's `?`, `|` or `&`), as Luau reads a comment as trivia. A value still
  # ends before a comment with a statement after it on the line, through
  # `LUAU_VALUE_COMMENT_BEFORE_STATEMENT`, and a type through
  # `LUAU_BLOCK_COMMENT_ON_LINE`. `--` itself is never an operator (see
  # `LUAU_ARITHMETIC_OPERATORS`).
  LUAU_BINARY_OPERATOR_AHEAD_LOOKAHEAD: (?:{{LUAU_VALUE_BINARY_OPERATORS}}|[&]|[-][>]|{{LUAU_COMMENT_START}})
  # NOTE: Intentional exception to the "no capture groups in variables" rule. The `({{WS}}*)` group is captured on purpose — host
  # rules use the captured trailing whitespace as their final
  # `OptionalSeparator`. This pattern is appended to the end of nearly every
  # Luau expression rule, so writing it as a variable (with the capture
  # baked in) is far more readable than re-typing
  # `(?:({{WS}}*)(?={{LUAU_BINARY_OPERATOR_AHEAD_LOOKAHEAD}})|(?=$|.))`
  # at every use site. The capture-index
  # math at each call site is local and stable; the maintenance win is
  # significant. If you reach for this pattern elsewhere, remember it adds
  # exactly one capture group to the host rule.
  _LUAU_BINARY_OPERATOR_AHEAD_: (?:({{WS}}*)(?={{LUAU_BINARY_OPERATOR_AHEAD_LOOKAHEAD}})|(?=$|.))
  # The same lookahead for the value-only rules (access paths, numbers, `nil`,
  # tables, parentheses), which keep `?`: a value followed by a stray `?`
  # still takes the whitespace before it as a separator, so formatting
  # settles. Rules that a type can also
  # be (strings and booleans) use `_LUAU_SHARED_OPERATOR_AHEAD_` below, because a
  # type is glued to its `?`. Like the one above, this adds exactly one capture
  # group to the host rule.
  LUAU_VALUE_OPERATOR_AHEAD_LOOKAHEAD: (?:{{LUAU_BINARY_OPERATOR_AHEAD_LOOKAHEAD}}|[?])
  _LUAU_VALUE_OPERATOR_AHEAD_: (?:({{WS}}*)(?={{LUAU_VALUE_OPERATOR_AHEAD_LOOKAHEAD}})|(?=$|.))
  # The same lookahead for the rules a type and a value share (strings and
  # booleans). As a type argument (`Box<"ok">`, `Box<true>`) one is followed
  # directly by its generic's `>`, which is not a comparison, so no separator
  # is taken before a `>` right after it. A comparison written with a space
  # (`"a" > "b"`) still takes that space as a separator. Like the one above,
  # this adds exactly one capture group to the host rule.
  _LUAU_SHARED_OPERATOR_AHEAD_: (?:({{WS}}+|(?![>]))(?={{LUAU_BINARY_OPERATOR_AHEAD_LOOKAHEAD}})|(?=$|.))
  # The same lookahead for the type-only rules (names, primitives and the
  # bracketed types). A `<` or `>` after a type is a generic's bracket, never a
  # comparison, so it is not an operator here: the bracket stays glued to the
  # type (`Array<number>`, `Map<string, number>`). Whitespace before it is
  # taken as extra whitespace, which the formatter removes (`Array <number >`
  # becomes `Array<number>`). This adds two capture groups to the host rule:
  # the separator before an operator, then the whitespace before a bracket.
  _LUAU_TYPE_OPERATOR_AHEAD_: (?:({{WS}}*)(?![<>])(?={{LUAU_BINARY_OPERATOR_AHEAD_LOOKAHEAD}})|({{WS}}+)(?=[<>])|(?=$|.))

patterns:
  - { include: "#EndOfLine" }
  - { include: "#Newline" }

  - { include: "#FrontMatter" }
  - { include: "#Annotation" }

  - { include: "#Include" }
  - { include: "#Run" }

  - { include: "#Scene" }
  - { include: "#Branch" }

  # `external message(x)` — declaration of a host-bound callable. Only legal
  # at top level (no `&` prefix, not inside scenes/branches/functions). The
  # declaration registers a signature with the parsed-hierarchy `Story.externals`
  # map; the call site (`& message("hi")` or `{multiply(5,3)}`) goes through
  # the regular `FunctionCall` → `Divert` lowering, and `Divert.
  # GenerateRuntimeObject` flips `runtimeDivert.isExternal = true` when the
  # target name matches a registered external.
  - { include: "#LuauExternalDeclaration" }

  - { include: "#LuauSparkdownExplicitStatement" }
  - { include: "#LuauFunctionAttributes" }
  - { include: "#LuauFunctionDefinition" }
  - { include: "#LuauSparkdownVariableDefinition" }
  - { include: "#LuauDeclarations" }
  - { include: "#LuauSparkdownControlBlock" }
  - { include: "#LuauEndKeyword" }

  # A line that starts with `{x}` or `{{fn}}` is a display line like any
  # other, so the interpolation, the text after it and the line's tags stay
  # one action and one beat (#1746), as they already are in a block body.
  - { include: "#SparkdownStatement" }

  - { include: "#Whitespace" }

repository:
  ########## Luau File ##########

  # The root of a `.luau` document, which is Luau from its first line to its
  # last (GRAMMAR.md §1.5): a parser for one starts on these patterns
  # instead of the root `patterns:` above, which read a `.sd` script's top
  # level as story. It is the body of a function (`LuauFunctionBody`), so a
  # `local` list continues after a trailing comma and a call is a statement,
  # with the top level's own `@attribute` lines, and a closer no block takes
  # (`end`, `else`, `until`) read as unread tokens, which Luau's reading
  # reports. Nothing of the `.sd` root is reachable from here but what a
  # function body reaches.
  LuauFile:
    patterns:
      - { include: "#LuauFileSparkdownWord" }
      - { include: "#LuauFunctionAttributes" }
      - { include: "#LuauBlockBody" }
      - { include: "#LuauStrayCloser" }
      - { include: "#LuauUnreadToken" }

  # A word that begins a statement of Sparkdown's own (`define`, `store`,
  # `layout` and the other structures) or a divert's `->`, at the top level
  # of a `.luau` file, where Luau reads it as a name or a symbol. It is taken
  # as an unread token, before `LuauBlockBody` would read the Sparkdown
  # construct, so Luau's reading reports the statement in Luau's words.
  LuauFileSparkdownWord:
    match: ({{WS}}*)(?:({{LUAU_FILE_SPARKDOWN_WORDS}})|(->))
    captures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#LuauUnreadName" }
      3:
        patterns:
          - { include: "#LuauUnreadCharacter" }

  ########## Sparkdown Statements ##########

  SparkdownStatement:
    patterns:
      - { include: "#Choice" }
      - { include: "#FlowStatements" }
      - { include: "#DisplayStatements" }

  FlowStatements:
    patterns:
      - { include: "#DoneStatement" }
      - { include: "#FinStatement" }
      - { include: "#Divert" }
      - { include: "#Thread" }
      - { include: "#LabelAnchor" }

  DisplayStatements:
    patterns:
      # `//` line comment for DISPLAY/prose contexts only. Luau scope uses
      # `--` for comments (and `//` for floor division); display uses `--`
      # for em-dashes, so `//` is the prose comment. DisplayStatements is
      # NOT included in Luau-code contexts, so this never shadows `//`
      # floor division there. First, so a `//` line isn't eaten as Action.
      - { include: "#SparkdownLineComment" }
      - { include: "#Title" }
      - { include: "#Heading" }
      - { include: "#Transitional" }
      - { include: "#Write" }
      - { include: "#Dialogue" }
      - { include: "#AssetLine" }
      - { include: "#Action" }

  # A whole-line `//` comment (after optional indent). Display-only — see
  # DisplayStatements. The captures tile the line so the parser advances.
  # `//` must be followed by whitespace or end-of-line (mirroring the `#`
  # tag convention `[#]+(?=$|{{WS}})`); this also keeps a protocol URL like
  # `//cdn…` — where a non-space follows `//` — from reading as a comment.
  SparkdownLineComment:
    tag: lineComment
    name: comment.line.double-slash.sd
    match: ^({{WS}}*)([/]{2})(?=$|{{WS}})([^\n]*)$
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        name: punctuation.definition.comment.sd
      3:
        name: comment.line.double-slash.content.sd

  # An end-of-line `//` comment that follows display text on the same line
  # (e.g. `Some dialogue. // a note`). `//` must be followed by whitespace or
  # end-of-line (the marker convention), so a URL (`https://…`) — where `//`
  # is followed by a host char — is never mistaken for a comment. Any
  # whitespace BEFORE `//` is consumed into the comment so no trailing space
  # is left on the visible text. Whole-line comments are handled earlier by
  # SparkdownLineComment; this only fires mid-line, reached from DisplayLine
  # after TextChunk yields at the `//` boundary.
  SparkdownInlineComment:
    tag: lineComment
    name: comment.line.double-slash.sd
    match: ({{WS}}*)([/]{2})(?=$|{{WS}})([^\r\n]*)
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        name: punctuation.definition.comment.sd
      3:
        name: comment.line.double-slash.content.sd

  # A trailing `//` comment in SPARKLE UI markup — on a control-block opener
  # (`if ok then // note`, `for r in rows do // note`). A third context, so a
  # third rule: `SparkdownLineComment` is `^`-anchored (whole-line only) and
  # `SparkdownInlineComment` belongs to display text. Without one, the comment
  # matched nothing, the opener's scope never closed on it, and the block's
  # body plus every following line fell out of the layout — into the compiled
  # ink, emitted as spoken action text, with no diagnostic.
  #
  # `//` must be followed by whitespace or end-of-line (the marker convention),
  # so a `://` URL is never mistaken for a comment.
  SparkleTrailingLineComment:
    tag: lineComment
    name: comment.line.double-slash.sd
    match: ({{WS}}*)([/]{2})(?=$|{{WS}})([^\r\n]*)
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        name: punctuation.definition.comment.sd
      3:
        name: comment.line.double-slash.content.sd

  ########## Annotation ##########

  # `Annotation` is the DISPLAY-context line decoration: screenplay
  # `[[tag]]` markup only. It must NOT include Luau comments. Display/prose
  # uses `--` for em-dashes and `---` for the front-matter fence, so a
  # Luau-comment rule here would (a) swallow the opening `---` of the title
  # page as a `---` doc comment and (b) turn every prose em-dash into a
  # line comment. Luau comments belong ONLY to actual Luau-code contexts
  # (`LuauExpression`, `LuauFunctionBody`, `LuauBlockBody`, define bodies,
  # …), which each include `#LuauComment` directly — never through here.
  Annotation:
    patterns:
      - { include: "#Tags" }

  ########## Tag ##########

  Tags:
    tag: docComment
    name: comment.line.sd entity.tag.sd
    begin: ({{WS}}*)(?={{TAG_START}})
    captures:
      1:
        patterns:
          - { include: "#RequiredWhitespace" }
    patterns:
      - { include: "#Tag" }
    end: (?=$)

  Tag:
    tag: docComment
    name: comment.line.sd entity.tag.sd
    match: "({{WS}}*)({{TAG_START}})(.*?){{LUAU_SHARED_TAG_END}}"
    captures:
      1:
        patterns:
          - { include: "#Whitespace" }
      2:
        tag: definition(docComment)
        name: punctuation.definition.comment.sd comment.line.sd entity.tag.begin.sd
      3:
        patterns:
          - { include: "#TagContent" }

  # A tag body. `{...}` interpolations become their own
  # `LuauInterpolatedStringExpression` nodes (the same display-text
  # interpolation rule) so the lowerer reads them as structure instead of
  # re-scanning the raw text for braces (GRAMMAR.md §5). The interleaved
  # literal runs are `TagText`. No `^` anchors and the text run always
  # consumes from the body's first character, so vscode-textmate and the
  # tree agree per character (GRAMMAR.md §17). Bounded by end-of-line or the
  # next `#` tag start, exactly like the old flat match.
  TagContent:
    tag: definition(docComment)
    name: punctuation.definition.comment.content.sd
    begin: (?=.)
    patterns:
      - { include: "#LuauFunctionCallShorthand" }
      - { include: "#LuauInterpolatedStringExpression" }
      - { include: "#TagText" }
    end: (?=$|{{TAG_START}})

  TagText:
    tag: definition(docComment)
    name: punctuation.definition.comment.content.sd
    match: ([^\n{]+?)(?=$|[{]|{{TAG_START}})

  ########## Include ##########

  # An `include` line includes nothing: every script under the project's
  # folder is already part of the story (#1387). The rule stays so the
  # compiler's error for the line, whose quick fix deletes it, has a range,
  # and its operand reads as invalid rather than as a path.
  Include:
    tag: meta
    name: meta.import.include.sd
    begin: ^({{WS}}*)(include)({{EOK}})
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#IncludeKeyword" }
      3:
        patterns:
          - { include: "#RequiredWhitespace" }
    patterns:
      - { include: "#Annotation" }
      - { include: "#IncludeContent" }
    end: (?=$)

  IncludeKeyword:
    tag: controlKeyword
    name: keyword.control.definition.include.sd

  IncludeContent:
    tag: invalid
    name: invalid.deprecated.include.sd
    match: (.+?)(?={{EOL}})

  ########## Run ##########

  # `run "path"` (extension implicit — always `.luau`). Top-level
  # statement only. Reads the named `.luau` file, wraps its body in
  # an anonymous function, and calls it immediately. dofile-style:
  # no return value, no module binding. Lets authors splice verbatim
  # Luau source into a sparkdown program by reference. Cycles error.
  Run:
    tag: meta
    name: meta.import.run.sd
    begin: ^({{WS}}*)(run)({{EOK}})
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#RunKeyword" }
      3:
        patterns:
          - { include: "#RequiredWhitespace" }
    patterns:
      - { include: "#Annotation" }
      - { include: "#RunContent" }
    end: (?=$)

  RunKeyword:
    tag: controlKeyword
    name: keyword.control.definition.run.sd

  RunContent:
    tag: string
    name: string.run.luau.sd
    # lookaround: Annotation owns the EOL tail. Reordering cannot stop a
    # path already being matched; splitting quoted/unquoted paths still
    # needs that boundary, and Run's end must leave annotations in its body.
    match: (?:(".*?"|'.*?')({{WS}}*)|(.+?))(?={{EOL}})
    captures:
      1:
        patterns:
          - { include: "#RunQuotedPath" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
      3:
        patterns:
          - { include: "#RunUnquotedPath" }

  RunQuotedPath:
    match: (?:".*"|'.*')
    tag: string
    name: string.quoted.run.luau.sd

  RunUnquotedPath:
    match: .+
    tag: string
    name: string.unquoted.run.luau.sd

  ########## Break ##########

  Break:
    tag: special(content)
    name: meta.break.sd
    match: ({{BREAK}})
    captures:
      1:
        tag: keyword
        name: keyword.other.break.sd

  # A `>` break in the middle of a line with a `..` right after it, when words
  # follow (`A .. > .. B`, `A .. >..B`): the `..` begins the part after the
  # click, as a `..` that begins a line does.
  BreakLeadingGlue:
    match: ({{BREAK}})({{LEADING_GLUE}})(?={{WS}}*\S)
    captures:
      1:
        patterns:
          - { include: "#Break" }
      2:
        patterns:
          - { include: "#LeadingGlue" }

  ########## Chain ##########

  Chain:
    tag: special(meta)
    name: meta.chain.sd
    match: ({{WS}}*)({{CHAIN}})(?:({{WS}}+)$|({{WS}}*))
    captures:
      1:
        patterns:
          - { include: "#Whitespace" }
      2:
        tag: keyword
        name: keyword.other.chain.sd
      3:
        patterns:
          - { include: "#ExtraWhitespace" }
      4:
        patterns:
          - { include: "#RequiredWhitespace" }

  ########## Glue ##########

  Glue:
    tag: meta
    name: meta.glue.sd
    match: ({{WS}}*)({{GLUE}})
    captures:
      1:
        patterns:
          - { include: "#Whitespace" }
      2:
        tag: keyword
        name: keyword.other.glue.sd

  # Whether a `..` that begins a line joins depends on the line the run shows
  # before it, so this mark is never coloured as an error; the engine warns
  # about one that joins nothing. It is tagged as `Glue` is, so the editor
  # colours it as a mark and the screenplay leaves it out.
  LeadingGlue:
    tag: meta
    name: meta.glue.leading.sd
    match: ({{LEADING_GLUE}})
    captures:
      1:
        tag: keyword
        name: keyword.other.glue.sd

  AlternatorGlue:
    tag: keyword
    name: keyword.other.glue.sd
    match: ({{ALTERNATOR_GLUE}})

  ########## Inline Glued Alternators ##########
  #
  # Inline display-text alternators are bracketed by `..` glue markers
  # within narrative text:
  #
  #   Here is some text .. queue|a|b|c .. and more text after.
  #
  # The head takes the same keywords as the other alternator forms: an
  # optional `shuffle` and an optional `queue`, `cycle` or `chain`, at
  # least one of them (`.. shuffle|a|b ..` is a plain shuffle, #1706).
  #
  # The head is `LuauSparkdownSingleLineSequentialAlternatorBlock`'s:
  # the first arm separator must follow it.
  #
  # Required `..` delimiters give the grammar an unambiguous scope.
  # Inside the scope, arm bodies are parsed as display content (text +
  # nested `{interp}`), with `|` separating arms.
  #
  # Mirrors the structural shape of `LuauSparkdownSequentialAlternatorBlock`
  # (and the conditional variant) so the existing lowerer's dynamic
  # prefix derivation handles all three uniformly. The lowerer reads
  # `<prefix>_begin` for the keyword + modifier and `<prefix>_content`
  # for the arms.

  LuauSparkdownInlineGluedSequentialAlternatorBlock:
    # lookaround: `(?={{LUAU_SHARED_SEQUENTIAL_HEAD}})` makes one of the
    # two optional keywords present, so `.. |a|b ..` opens no alternator;
    # the captures stay optional so the lowerer reads the modifier and the
    # keyword from fixed indices. `(?=[|])` leaves the first separator to
    # `LuauAlternatorSeparator`, the body's first pattern. The rival is the
    # glued text path (`TextChunk`, and `LeadingGlue` through
    # `INLINE_LEADING_GLUE`), which takes any `..` this begin refuses.
    # Without the separator lookahead, keyword-shaped text after `..`
    # opened a scope: `.. shuffle,a,b ..` became a shuffle over no arms
    # that the engine cannot run, `.. queue,a ..` emitted nothing, and
    # backtracking past an optional keyword accepted `.. shuffle queue.x`
    # and `.. queue.x`. Reordering cannot replace it: this rule is tried
    # before `TextChunk`, which accepts anything. The parent's `end:`
    # closes the line, not this begin, and no keyword variable can be
    # tightened to say what follows the keyword. Fixture
    # alternator/inline-glued-plain-shuffle changes without it.
    begin: "({{WS}}*)({{ALTERNATOR_GLUE}})({{WS}}+)(?={{LUAU_SHARED_SEQUENTIAL_HEAD}}){{_LUAU_SHARED_SEQUENTIAL_MODIFIER_PREFIX_}}?({{LUAU_SEQUENTIAL_ALTERNATOR_KEYWORDS}})?({{WS}}*)(?=[|])"
    beginCaptures:
      1:
        patterns:
          - { include: "#Whitespace" }
      2:
        patterns:
          - { include: "#AlternatorGlue" }
      3:
        patterns:
          - { include: "#ExtraWhitespace" }
      4:
        patterns:
          - { include: "#LuauControlKeyword" }
      5:
        patterns:
          - { include: "#ExtraWhitespace" }
      6:
        patterns:
          - { include: "#LuauControlKeyword" }
      7:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauAlternatorSeparator" }
      - { include: "#LuauSparkdownInlineGluedAlternatorArm" }
    end: ({{WS}}+)({{ALTERNATOR_GLUE}})
    endCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#AlternatorGlue" }

  LuauSparkdownInlineGluedConditionalAlternatorBlock:
    begin: ({{WS}}*)({{ALTERNATOR_GLUE}})({{WS}}+)({{LUAU_CONDITIONAL_ALTERNATOR_KEYWORDS}})({{WS}}*)(?=[(])
    beginCaptures:
      1:
        patterns:
          - { include: "#Whitespace" }
      2:
        patterns:
          - { include: "#AlternatorGlue" }
      3:
        patterns:
          - { include: "#ExtraWhitespace" }
      4:
        patterns:
          - { include: "#LuauControlKeyword" }
      5:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauConditionalAlternatorCondition" }
      - { include: "#LuauAlternatorSeparator" }
      - { include: "#LuauSparkdownInlineGluedAlternatorArm" }
    end: ({{WS}}+)({{ALTERNATOR_GLUE}})
    endCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#AlternatorGlue" }

  # Arm body of an inline-glued alternator. Display content bounded by
  # the next `|` separator OR the closing `..` of the surrounding
  # alternator. Supports nested `{interp}` expressions, escape
  # sequences, plain text, and `# tag` annotations (`ArmTag` matches
  # bounded by `|` / closing-`..` instead of EOL).
  LuauSparkdownInlineGluedAlternatorArm:
    begin: (?=\S)(?![|])
    patterns:
      - { include: "#Escape" }
      # `ArmDivert` is matched before `InlineText` so `-> target` inside
      # an arm is recognized as a real divert rather than three characters
      # of display text. Critical for flat-weave-style alternators-with-
      # diverts (`{chain | -> A | B end}`) where the first arm transfers
      # control on each visit. Without this include, the arm body lowerer
      # would have nothing structural to dispatch through and the divert
      # would be silently stringified.
      - { include: "#ArmDivert" }
      - { include: "#LuauFunctionCallShorthand" }
      - { include: "#LuauInterpolatedStringExpression" }
      - { include: "#ArmTag" }
      - { include: "#InlineText" }
    end: (?=[|]|{{WS}}+{{ALTERNATOR_GLUE}})

  # Arm body of a block-form alternator (`queue | a | b | c end` on one
  # line, or the multi-line `queue\n  | a\n  | b\nend` shape). Display
  # content bounded by the next `|` separator, the closing `end`
  # keyword, or end-of-line.
  LuauSparkdownAlternatorArm:
    begin: (?=\S)(?![|])
    patterns:
      - { include: "#Escape" }
      # See note on `LuauSparkdownInlineGluedAlternatorArm` above —
      # diverts inside arms need to be matched as structural nodes so
      # the lowerer can route them through `buildDivert`.
      - { include: "#ArmDivert" }
      - { include: "#LuauFunctionCallShorthand" }
      - { include: "#LuauInterpolatedStringExpression" }
      - { include: "#ArmTag" }
      - { include: "#InlineText" }
    end: (?=[|]|{{END}}(?:$|{{WS}})|$|{{NL}})

  # Context-bounded divert for alternator arms. The standard `Divert`
  # rule's `end: (?=$)` terminates at end-of-line, which inside an
  # alternator arm would swallow the `|` separator and `end` keyword
  # that bound the arm. `ArmDivert` mirrors the inkjs `ArmTag` pattern:
  # same captures as `Divert` (TunnelMark/DivertMark + target + tunnel
  # chain) but with an end pattern that stops at the alternator
  # boundaries. The lowerer dispatch sees the same `Divert` node name
  # via the `name:` field below, so `buildDivert` handles it uniformly.
  # Its tunnel chain is `ArmTunnel`, and its stray text `ArmUnknown`, both
  # bounded by the same alternator boundaries.
  ArmDivert:
    name: meta.divert
    begin: ({{WS}}*)([-][>][-][>]|[-][>])
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#TunnelMark" }
          - { include: "#DivertMark" }
    patterns:
      - { include: "#Annotation" }
      - { include: "#ArmTunnel" }
      - { include: "#DivertLoad" }
      - { include: "#DivertTarget" }
      - { include: "#ExtraWhitespace" }
      # Anything else after the targets (`> y`, stray punctuation) is stray
      # text. Tile it so the rule always reaches `end` instead of closing
      # ERROR_INCOMPLETE mid-arm (GRAMMAR.md §17).
      - { include: "#ArmUnknown" }
    end: (?=[|]|{{END}}(?:$|{{WS}})|$|{{NL}}|{{WS}}+{{ALTERNATOR_GLUE}})

  # A `->` after a target inside `ArmDivert`. It is `Tunnel` bounded by
  # the arm: the line-ending `Tunnel` would run past the arm's `|`, `end`
  # or closing `..`, and read the next arm as another target. For the
  # same reason it takes stray text as `ArmUnknown`, and it has no `//`
  # comment rule: inside an arm `//` is display text, and a comment would
  # run to the line end over the arm's boundaries. `buildDivert` walks
  # `ArmTunnel` and `Tunnel` nodes alike.
  ArmTunnel:
    begin: ({{WS}}*)([-][>])
    beginCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#DivertMark" }
    patterns:
      - { include: "#Annotation" }
      - { include: "#ArmTunnel" }
      - { include: "#DivertLoad" }
      - { include: "#DivertTarget" }
      - { include: "#ExtraWhitespace" }
      - { include: "#ArmUnknown" }
    end: (?=[|]|{{END}}(?:$|{{WS}})|$|{{NL}}|{{WS}}+{{ALTERNATOR_GLUE}})

  # Stray text after an arm divert's targets: the rest of the arm, up to
  # the `|`, the ` end` or the closing ` ..` that ends `ArmDivert` and
  # `ArmTunnel`, as `Unknown` takes the rest of a `Divert` line. Spaces
  # before that boundary are left to `ExtraWhitespace`. An `end` counts at
  # the start of a word, as it does in plain arm text (`>end` closes the
  # alternator), so a word such as `blend` stays stray text.
  ArmUnknown:
    tag: invalid
    name: invalid.illegal.unknown-statement.sd
    match: ((?:(?!{{WS}}*[|]|{{WS}}+{{ALTERNATOR_GLUE}}|{{WS}}*\bend(?:$|{{WS}})|{{WS}}*$)[^\r\n])+)

  # Context-bounded `# tag` annotation for alternator arms. The
  # standard `Tag` rule terminates at end-of-line, which inside an
  # alternator would swallow subsequent `|` separators / closing
  # `end` / closing `..`. `ArmTag` stops at the alternator boundary
  # instead, preserving per-arm scoping.
  ArmTag:
    tag: docComment
    name: comment.line.sd entity.tag.sd
    match: ({{WS}}*)({{TAG_START}})(.*?)(?=[|]|{{WS}}+{{ALTERNATOR_GLUE}}|{{END}}(?:$|{{WS}})|$)
    captures:
      1:
        patterns:
          - { include: "#Whitespace" }
      2:
        tag: definition(docComment)
        name: punctuation.definition.comment.sd comment.line.sd entity.tag.begin.sd
      3:
        patterns:
          - { include: "#ArmTagContent" }

  ArmTagContent:
    tag: content
    name: punctuation.definition.comment.content.sd

  ########## Choice ##########

  Choice:
    name: entity.choice.sd
    # Begin pattern, captures by group:
    #   1: leading indent
    #   2: `*` / `+` mark (with optional repeated marks)
    #   3: optional `(label)`
    #   4: optional `if` keyword (gate)
    #   5: mandatory whitespace after `if`
    #   6: optional condition expression — single identifier
    #      `if has_key`, dotted path `if player.alive`, optional `not`
    #      prefix `if not has_key`, or parenthesized arbitrary
    #      expression `if (a and b > 0)`. Followed by mandatory
    #      whitespace before the choice text. Wrapped by the
    #      `ChoiceCondition` named rule so the lowerer can address
    #      it by name (§6.4) — `Choice_begin_c6` would otherwise be
    #      auto-generated and unstable.
    #   7: optional trailing newline
    begin: ({{WS}}*)((?:[*]{{EOK}})+|(?:[+]{{EOK}})+)([(][^()\r\n]*[)]{{WS}}*)?(?:(if)\b({{WS}}+)((?:not\b{{WS}}+)?(?:[(][^()\r\n]*[)]|{{LUAU_NAME_OR_CONSTANT}}(?:[.]{{LUAU_IDENTIFIER}})*))(?={{WS}}|$))?(\r\n|\r|\n)?
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#ChoiceMark" }
      3:
        patterns:
          - { include: "#Label" }
      4:
        patterns:
          - { include: "#LuauIfKeyword" }
      5:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      6:
        patterns:
          - { include: "#ChoiceCondition" }
      7:
        patterns:
          - { include: "#Newline" }

    patterns:
      - { include: "#Annotation" }
      - { include: "#Newline" }
      - { include: "#ChoiceConditional" }
      - { include: "#ChoiceWithSuppressedText" }
      - { include: "#ChoiceWithNoSuppressedText" }
    end: (?=$)

  ChoiceCondition:
    emit: true
    patterns:
      - { include: "#LuauExpression" }

  ChoiceConditional:
    name: entity.choice.sd
    match: ^({{WS}}*)((?:[{][^{}\r\n]*[}]{{WS}}*)+)(\r\n|\r|\n)
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauInterpolatedStringExpression" }
      3:
        patterns:
          - { include: "#Newline" }

  ChoiceMark:
    tag: keyword
    name: keyword.operator.expression.list.sd

  ChoiceWithSuppressedText:
    match: (.*?)(\[)(.*?)(\])(.*?)(?:({{WS}}*)$|({{WS}}*)([-][>].*$))
    captures:
      1:
        patterns:
          - { include: "#ChoiceStartText" }
      2:
        tag: keyword
        name: punctuation.definition.template-expression.begin.choice.suppression.sd
      3:
        patterns:
          - { include: "#ChoiceOnlyText" }
      4:
        tag: keyword
        name: punctuation.definition.template-expression.end.choice.suppression.sd
      5:
        patterns:
          - { include: "#ChoiceInnerText" }
      6:
        patterns:
          - { include: "#ExtraWhitespace" }
      7:
        patterns:
          - { include: "#RequiredWhitespace" }
      8:
        patterns:
          - { include: "#Divert" }

  ChoiceWithNoSuppressedText:
    # `.*?` (not `.+?`) so a fallback `* -> target` choice — which has
    # NO text between the mark and the divert — leaves capture group 1
    # empty and routes the `-> target` into the divert capture instead
    # of greedily consuming it as choice text.
    match: (.*?)(?:({{WS}}*)$|({{WS}}*)([-][>].*$))
    captures:
      1:
        patterns:
          - { include: "#ChoicePlainText" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
      3:
        patterns:
          - { include: "#RequiredWhitespace" }
      4:
        patterns:
          - { include: "#Divert" }

  # Named wrappers for the four choice-text captures — distinct per
  # capture so the lowerer can address each by name (§6.4) instead of
  # the auto-generated `_cN` capture-index strings. Inner highlighting
  # is delegated to `ChoiceTextContent` (text before/inside the
  # brackets) or `DisplayText` (text after the closing bracket).
  # `emit: true` is required so the wrapper node appears in the tree —
  # a pure-`patterns:` dispatcher would be invisible (§5.3).
  ChoiceStartText:
    emit: true
    patterns:
      - { include: "#ChoiceTextContent" }

  ChoiceOnlyText:
    emit: true
    patterns:
      - { include: "#ChoiceTextContent" }

  ChoiceInnerText:
    emit: true
    patterns:
      - { include: "#DisplayText" }

  ChoicePlainText:
    emit: true
    patterns:
      - { include: "#ChoiceTextContent" }

  ChoiceTextContent:
    tag: string
    name: string.choice.sd

    captures:
      1:
        patterns:
          - { include: "#Annotation" }
          - { include: "#LuauFunctionCallShorthand" }
          - { include: "#LuauInterpolatedStringExpression" }
          - { include: "#DisplayText" }

  ########## Label Anchor ##########
  # `label NAME` declares a named divert target outside a weave —
  # typically inside an `if` block, knot, etc. (Weave gathers use
  # `then (label)` inside a `choose` block — see DIVERGENCES.md.)
  # The line's body content after the label is parsed as sibling
  # statements that the inkjs Weave assembly attaches as the anchor's
  # body, mirroring how the legacy `- (label)` form worked.

  LabelAnchor:
    match: ^({{WS}}*)(label)\b({{WS}}*)({{IDENTIFIER}})({{WS}}*)
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauLabelKeyword" }
      3:
        patterns:
          - { include: "#OptionalWhitespace" }
      4:
        patterns:
          - { include: "#LabelDeclarationName" }
      5:
        patterns:
          - { include: "#ExtraWhitespace" }

  LuauLabelKeyword:
    tag: controlKeyword
    name: keyword.control.label.luau
    match: (label)\b

  ########## Label ##########

  Label:
    match: ([(])({{WS}}*)({{IDENTIFIER}})({{WS}}*)([)])({{WS}}*)
    captures:
      1:
        patterns:
          - { include: "#LabelBeginMark" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
      3:
        patterns:
          - { include: "#LabelDeclarationName" }
      4:
        patterns:
          - { include: "#ExtraWhitespace" }
      5:
        patterns:
          - { include: "#LabelEndMark" }
      6:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  LabelBeginMark:
    tag: keyword
    name: keyword.flow.label.sd

  LabelEndMark:
    tag: keyword
    name: keyword.flow.label.sd

  LabelDeclarationName:
    tag: definition(heading)
    name: keyword.control.section.sd

  ########## Scene ##########

  Scene:
    # Scenes are *boundary-only* Scoped rules — they cover the
    # declaration line and nothing more. The scene body lives at root
    # so an edit inside a large scene doesn't force a re-parse of the
    # whole scene. See GRAMMAR.md §16.3 (the canonical "don't wrap
    # potentially-large regions" example) and §16.4 (why
    # LuauFunctionDefinition gets to break this rule but Scene
    # doesn't). The terminating `end` keyword is matched separately
    # by `LuauEndKeyword` at the top-level patterns list; the lowerer
    # pairs declarations with their matching `end` to reconstruct
    # scope hierarchy.
    begin: ^({{WS}}*)(scene)({{EOK}})
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#SceneKeyword" }
      3:
        patterns:
          - { include: "#RequiredWhitespace" }
    patterns:
      - { include: "#SceneWithParametersDeclaration" }
      - { include: "#SceneWithoutParametersDeclaration" }
      # A boundary rule MUST consume its entire declaration line so it
      # always closes at `end: $` rather than `ERROR_INCOMPLETE`. The tree
      # parser matches contiguously and cannot skip over un-tiled trailing
      # text the way vscode-textmate's per-line scanner does; if a stray
      # `:` / `//` / `#` were left un-consumed here the rule would close
      # incomplete, the tree would re-enter root matching MID-LINE, and an
      # `^`-anchored `begin` rule (e.g. `BlockAction`) would spuriously fire
      # where vscode never opens one. Tiling the rest of the line keeps both
      # engines in lock-step. See GRAMMAR.md §17.
      - { include: "#SparkdownLineComment" }
      - { include: "#Annotation" }
      # A `--` comment after the header is a comment, as after a
      # definition's `end` (#674); other text is `Unknown`, which the
      # validator reports on the header line.
      - { include: "#LuauLineComment" }
      - { include: "#Unknown" }
    end: $

  # The name is the word right after the keyword; a word after the header
  # is `Unknown`, which the validator reports (#674).
  # lookaround: the lookbehind keeps the name to the word right after the
  # line's own `scene` keyword, from the line's start, so a word later on
  # the header line is `Unknown`'s rather than a second name, even after a
  # name that is itself `scene` (`scene scene oops`); the begin's `(` lookahead and the end's leave the parameter
  # list to `LuauFunctionParameters` and the rest of the line to `Unknown`
  # or `LuauLineComment`.
  SceneWithParametersDeclaration:
    begin: (?<=^{{WS}}*scene{{WS}}+)({{IDENTIFIER}})({{WS}}*)(?=[(])
    beginCaptures:
      1:
        patterns:
          - { include: "#SceneDeclarationName" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauFunctionParameters" }
    end: (?=$|{{COMMENT_START}}|{{WS}}*(?![(]))

  # lookaround: as `SceneWithParametersDeclaration`'s, so a word after the
  # name is `Unknown`'s rather than a second name.
  SceneWithoutParametersDeclaration:
    match: (?<=^{{WS}}*scene{{WS}}+)({{IDENTIFIER}})({{WS}}*)
    captures:
      1:
        patterns:
          - { include: "#SceneDeclarationName" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }

  SceneKeyword:
    tag: controlKeyword
    name: keyword.control.scene.sd

  SceneDeclarationName:
    tag: definition(heading)
    name: keyword.control.section.sd

  ########## Branch ##########

  Branch:
    # Like `Scene`, branch is a boundary-only Scoped rule — declaration
    # line only, body at root, lowerer pairs with `end` keyword. See
    # GRAMMAR.md §16.3.
    begin: ^({{WS}}*)(branch)({{EOK}})
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#BranchKeyword" }
      3:
        patterns:
          - { include: "#RequiredWhitespace" }
    patterns:
      - { include: "#SparkdownLineComment" }
      - { include: "#Annotation" }
      - { include: "#BranchWithParametersDeclaration" }
      - { include: "#BranchWithoutParametersDeclaration" }
      # Tile the rest of the line so the rule always closes at `end: $`
      # rather than `ERROR_INCOMPLETE` (see the matching note on `Scene`
      # and GRAMMAR.md §17), a `--` comment as one (#674).
      - { include: "#LuauLineComment" }
      - { include: "#Unknown" }
    end: $

  # As `SceneWithParametersDeclaration`, the word right after the keyword.
  # lookaround: as `SceneWithParametersDeclaration`'s, after `branch`, so a
  # word later on the line is `Unknown`'s; `LuauFunctionParameters` reads the
  # list the `(` lookahead leaves it.
  BranchWithParametersDeclaration:
    begin: (?<=^{{WS}}*branch{{WS}}+)({{IDENTIFIER}})({{WS}}*)(?=[(])
    beginCaptures:
      1:
        patterns:
          - { include: "#BranchDeclarationName" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauFunctionParameters" }
    end: (?=$|{{COMMENT_START}}|{{WS}}*(?![(]))

  # lookaround: as `SceneWithParametersDeclaration`'s, after `branch`, so a
  # word after the name is `Unknown`'s rather than a second name.
  BranchWithoutParametersDeclaration:
    match: (?<=^{{WS}}*branch{{WS}}+)({{IDENTIFIER}})({{WS}}*)
    captures:
      1:
        patterns:
          - { include: "#BranchDeclarationName" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }

  BranchKeyword:
    tag: controlKeyword
    name: keyword.control.branch.sd

  BranchDeclarationName:
    tag: definition(heading)
    name: keyword.control.section.sd

  ########## Divert & Thread ##########

  Divert:
    begin: ({{WS}}*)([-][>][-][>]|[-][>])
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#TunnelMark" }
          - { include: "#DivertMark" }
    patterns:
      - { include: "#Annotation" }
      - { include: "#DivertLoad" }
      - { include: "#Tunnel" }
      - { include: "#DivertTarget" }
      # A `// note` after the targets is a comment, as on any display line.
      # It comes before `ExtraWhitespace` so the space before `//` is the
      # comment's own, which the formatter keeps as one space.
      - { include: "#SparkdownInlineComment" }
      - { include: "#DivertStrayTextSpace" }
      - { include: "#ExtraWhitespace" }
      # The divert ends its line, so anything else after the targets
      # (`> After`, stray punctuation) is stray text. Tile it so the rule
      # always reaches `end` instead of closing ERROR_INCOMPLETE mid-line
      # (GRAMMAR.md §17).
      - { include: "#Unknown" }
    end: (?=$)

  # The space between a divert's targets and stray text after them
  # (`-> later > After`) is the author's spacing, so it is `Whitespace`, which
  # the formatter keeps as written. Whitespace that ends the line is still
  # `ExtraWhitespace`.
  DivertStrayTextSpace:
    match: ({{WS}}+)(?=\S)
    captures:
      1:
        patterns:
          - { include: "#Whitespace" }

  # `-> load NAME`: preload NAME's scene (and world) behind the loading layout
  # before diverting to it. Listed before DivertTarget so the keyword is not
  # read as a target name; only a following identifier makes it the keyword.
  DivertLoad:
    match: ({{WS}}*)({{LOAD_CONTROL_KEYWORDS}})({{WS}}+)(?={{IDENTIFIER}}|[.^])
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#DivertLoadKeyword" }
      3:
        patterns:
          - { include: "#RequiredWhitespace" }

  DivertLoadKeyword:
    tag: controlKeyword
    name: keyword.control.divert.load.sd

  Tunnel:
    begin: ({{WS}}*)([-][>])
    beginCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#DivertMark" }
    patterns:
      - { include: "#Annotation" }
      - { include: "#Tunnel" }
      - { include: "#DivertLoad" }
      - { include: "#DivertTarget" }
      # A tunnel chain ends its line as `Divert` does, so the same `// note`
      # comment and stray-text rules follow its targets.
      - { include: "#SparkdownInlineComment" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Unknown" }
    end: (?=$)

  Thread:
    begin: ^({{WS}}*)([<][-])
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#ThreadMark" }
    patterns:
      - { include: "#Annotation" }
      - { include: "#DivertLoad" }
      - { include: "#DivertTarget" }
      - { include: "#ExtraWhitespace" }
    end: (?=$|[^\s{{IDENTIFIER_END_CHAR}}])

  DivertMark:
    tag: controlKeyword
    name: keyword.control.divert.mark.sd
    match: ([-][>])

  TunnelMark:
    tag: controlKeyword
    name: keyword.control.divert.mark.sd
    match: ([-][>][-][>])

  ThreadMark:
    tag: controlKeyword
    name: keyword.control.thread.mark.sd
    match: ([<][-])

  DoneStatement:
    match: ^({{WS}}*)(done)({{EOK}})
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#DoneKeyword" }
      3:
        patterns:
          - { include: "#OptionalWhitespace" }

  FinStatement:
    match: ^({{WS}}*)(fin)({{EOK}})
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#FinKeyword" }
      3:
        patterns:
          - { include: "#OptionalWhitespace" }

  DoneKeyword:
    tag: controlKeyword
    name: keyword.control.divert.done.sd

  FinKeyword:
    tag: controlKeyword
    name: keyword.control.divert.fin.sd

  DivertTarget:
    tag: heading
    name: keyword.control.divert.path.sd
    begin: ({{WS}}*)(?={{IDENTIFIER}}|[.^])
    beginCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    # A relative call (`-> f(x)`) is a `LuauFunctionCall`, whose name cannot
    # span a `.`. A dotted path (`-> a.b(x)`) is a `DivertPath` followed by its
    # `DivertArguments`, which owns the optional space before its `(` as a
    # relative call does. The end is tried after the patterns, so the target
    # goes on exactly as far as one of them continues it: an argument list
    # (and a second one, `-> a.b(x)(y)`, which the compiler reports as not
    # passed) stays in the target, and anything else (a space before `->`,
    # `//` or stray text) ends it for the parent.
    patterns:
      - { include: "#LuauFunctionCall" }
      - { include: "#DivertPath" }
      - { include: "#DivertArguments" }
    applyEndPatternLast: true
    end: (?=$)|(?!{{IDENTIFIER}}|[.^])

  # The argument list after a dotted divert target. A bracketed argument list
  # spans lines in every spelling of a divert, as a relative call's
  # `LuauFunctionCallParameters` does: the editor closes a `(` as it is typed,
  # so the list reads to its `)`. The dotted path before it stays on its line
  # (`DivertPath` ends with the line), so `-> a.` while typing never reads the
  # next line as part of the target.
  DivertArguments:
    tag: meta
    name: meta.parameter.luau
    brackets: true
    begin: ({{WS}}*)([(])
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#PunctuationParenOpen" }
    # `DivertArgumentsUnknown` tiles what no argument rule reads (`(1; 2)`),
    # so the list reaches its `)` in both engines instead of closing
    # incomplete at that character (GRAMMAR.md §17).
    patterns:
      - { include: "#LuauLineContinuation" }
      - { include: "#LuauIndexerLineContinuation" }
      - { include: "#LuauComment" }
      - { include: "#LuauExpression" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
      - { include: "#DivertArgumentsUnknown" }
    # An unclosed list still ends before the next `scene` or `branch` line,
    # so the flows after it keep their shape in both engines, and before a
    # closer, which closes a block around it, as a relative call's does.
    end: (?={{BEAT}})|([)])|(?={{WS}}*{{LUAU_CLOSER}})
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationParenClose" }

  # A character in a divert's argument list that no argument rule reads. The
  # compiler reports it. A word character is not one: a word no argument rule
  # reads (`done`) closes the list there, as it closes a relative call's, so
  # an unclosed list ends where a relative one does rather than reading the
  # rest of the script.
  DivertArgumentsUnknown:
    tag: invalid
    name: invalid.illegal.unknown-statement.sd
    match: ([^\s\w)])

  DivertPath:
    tag: heading
    name: keyword.control.divert.path.sd
    begin: (?={{IDENTIFIER}}|[.^])
    patterns:
      - { include: "#Annotation" }
      - { include: "#DivertPart" }
    end: (?=$)|(?!{{IDENTIFIER}}|[.^])

  DivertPart:
    emit: true
    patterns:
      - { include: "#PunctuationAccessor" }
      - { include: "#DivertPartNumber" }
      - { include: "#DivertPartOperator" }
      - { include: "#DivertPartName" }

  DivertPartNumber:
    tag: heading
    name: keyword.control.divert.path.sd
    match: ([0-9]+)

  DivertPartOperator:
    tag: heading
    name: keyword.control.divert.path.sd
    match: ([.^])

  DivertPartName:
    tag: heading
    name: keyword.control.divert.path.sd
    match: ({{IDENTIFIER}})

  ########## Whitespace ##########

  Newline:
    tag: content
    name: punctuation.whitespace.newline.sd
    match: ({{NL}})

  # Whitespace taxonomy (see GRAMMAR.md §12). The formatter dispatches
  # by *position* first — line-start runs are treated as indent and
  # line-end runs as trailing whitespace regardless of which capture
  # they sit under — and falls back to the node name for mid-line
  # runs:
  #   - Whitespace         — preserve as-is (dialogue body text,
  #                          glue/break pacing).
  #   - ExtraWhitespace    — collapse to nothing.
  #   - RequiredWhitespace — normalize to exactly one space; insert
  #                          one if the capture matched zero chars.
  #   - OptionalWhitespace — at line start the formatter treats it as
  #                          indent; mid-line, normalize to one space
  #                          (insert if zero-width); at end of line,
  #                          trim. Use this for leading-WS captures.
  #
  # `RequiredWhitespace` (regex `+`) and `OptionalWhitespace` (regex
  # `*`) are grammar-side documentation of the rule author's intent;
  # mid-line, the formatter treats them identically.
  #
  # There's no dedicated `Indent` / `TrailingWhitespace` rule — the
  # formatter detects those positions via line-start / line-end
  # checks and routes to the right edit type. Trailing whitespace
  # respects the LSP `trimTrailingWhitespace` option.
  ExtraWhitespace:
    tag: content
    name: punctuation.whitespace.extra.sd
    match: ({{WS}}+)

  Whitespace:
    tag: content
    name: punctuation.whitespace.sd
    match: ({{WS}}+)

  RequiredWhitespace:
    tag: definition(content)
    name: punctuation.whitespace.required.sd
    match: ({{WS}}+)

  OptionalWhitespace:
    tag: definition(content)
    name: punctuation.whitespace.optional.sd
    match: ({{WS}}*)

  # Restored just for the `EndOfLine` Switch — the formatter's
  # position-based line-end check would catch this, but we still
  # need a *parser*-level rule that only matches at line end so we
  # don't accidentally consume leading whitespace inside `EndOfLine`
  # at top-level. The formatter still routes the node through the
  # "trailing" path via name-based dispatch.
  TrailingWhitespace:
    tag: local(content)
    name: punctuation.whitespace.trailing.sd
    match: (?<!^)({{WS}}+)$

  EndOfLine:
    patterns:
      - { include: "#Annotation" }
      - { include: "#TrailingWhitespace" }

  ########## Operators ##########

  ColonOperator:
    tag: logicOperator
    name: meta.template.expression.operator.colon.sd
    match: ([:])

  ColonSeparator:
    tag: definition(logicOperator)
    name: meta.template.expression.operator.colon.sd
    match: ([:])

  PunctuationStringDoubleQuoteOpen:
    tag: definition(string)
    name: punctuation.definition.string.double.begin.sd
    match: (["])

  PunctuationStringDoubleQuoteClose:
    tag: definition(string)
    name: punctuation.definition.string.double.end.sd
    match: (["])

  PunctuationStringSingleQuoteOpen:
    tag: definition(string)
    name: punctuation.definition.string.single.begin.sd
    match: (['])

  PunctuationStringSingleQuoteClose:
    tag: definition(string)
    name: punctuation.definition.string.single.end.sd
    match: (['])

  PunctuationStringBacktickQuoteOpen:
    tag: definition(string)
    name: punctuation.definition.string.backtick.begin.sd
    match: ([`])

  PunctuationStringBacktickQuoteClose:
    tag: definition(string)
    name: punctuation.definition.string.backtick.end.sd
    match: ([`])

  PunctuationStringBracketQuoteOpen:
    tag: definition(string)
    name: punctuation.definition.string.bracket.begin.sd
    match: (\[)

  PunctuationStringBracketQuoteClose:
    tag: definition(string)
    name: punctuation.definition.string.bracket.end.sd
    match: (\])

  PunctuationStringEqualQuoteOpen:
    tag: definition(string)
    name: punctuation.definition.string.equal.begin.sd
    match: ([=]+)

  PunctuationStringEqualQuoteClose:
    tag: definition(string)
    name: punctuation.definition.string.equal.end.sd
    match: ([=]+)

  PunctuationParenOpen:
    tag: keyword
    name: punctuation.definition.template-expression.begin.sd
    match: ([(])

  PunctuationParenClose:
    tag: keyword
    name: punctuation.definition.template-expression.end.sd
    match: ([)])

  PunctuationBracketOpen:
    tag: keyword
    name: punctuation.definition.template-expression.begin.sd
    match: (\[)

  PunctuationBracketClose:
    tag: keyword
    name: punctuation.definition.template-expression.end.sd
    match: (\])

  PunctuationBraceOpen:
    tag: keyword
    name: punctuation.definition.template-expression.begin.sd
    match: (\{)

  PunctuationBraceClose:
    tag: keyword
    name: punctuation.definition.template-expression.end.sd
    match: (\})

  PunctuationAngleOpen:
    tag: keyword
    name: punctuation.definition.template-expression.begin.sd
    match: ([<])

  PunctuationAngleClose:
    tag: keyword
    name: punctuation.definition.template-expression.end.sd
    match: ([>])

  PunctuationDoubleAngleOpen:
    tag: keyword
    name: punctuation.definition.template-expression.begin.sd
    match: ([<][<])

  PunctuationDoubleAngleClose:
    tag: keyword
    name: punctuation.definition.template-expression.end.sd
    match: ([>][>])

  PunctuationAccessor:
    tag: separator
    name: meta.template.expression.accessor.sd
    match: ([.])

  ########## Color ##########

  Color:
    emit: true
    patterns:
      - { include: "#HEXColor" }
      - { include: "#RGBColor" }
      - { include: "#HSLColor" }

  HEXColor:
    tag: string
    name: string.color.hex.sd
    match: (#)([0-9a-fA-F]{3,})
    color: true

  RGBColor:
    tag: string
    name: string.color.rgb.sd
    match: (rgb)(a)?([(])(.*)([)])
    color: true

  HSLColor:
    tag: string
    name: string.color.hsl.sd
    match: (hsl)(a)?([(])(.*)([)])
    color: true

  ########## FrontMatter ##########

  FrontMatter:
    tag: meta
    name: meta.front-matter.sd
    begin: ^([-]{3,})($|{{WS}}*$)
    beginCaptures:
      1:
        tag: keyword
        name: keyword.other.front-matter.dashes.start.sd
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#FrontMatterField" }
      - { include: "#Newline" }
      - { include: "#Unknown" }
    end: ^([-]{3,})($|{{WS}}*$)?
    endCaptures:
      1:
        tag: keyword
        name: keyword.other.front-matter.dashes.end.sd
      2:
        patterns:
          - { include: "#ExtraWhitespace" }

  FrontMatterField:
    tag: meta
    name: meta.front-matter.field.sd
    begin: ^(?!{{WS}}+)([^{}:\r\n]+)({{WS}}*)($|[:])($|.*$(?:\r\n|\r|\n)?)
    beginCaptures:
      1:
        patterns:
          - { include: "#FrontMatterFieldKeyword" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
      3:
        patterns:
          - { include: "#ColonOperator" }
      4:
        patterns:
          - { include: "#FrontMatterStringInline" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#FrontMatterStringBlock" }
      - { include: "#Newline" }
      - { include: "#Unknown" }
    end: (?=^(?!{{WS}}+)[^{}:\r\n]+{{WS}}*(?:$|[:])|[-]{3,})

  FrontMatterFieldKeyword:
    tag: keyword
    name: keyword.other.front-matter.field.sd

  FrontMatterStringInline:
    match: ({{WS}}*)($|.+$(?:\r\n|\r|\n)?)
    captures:
      1:
        patterns:
          - { include: "#RequiredWhitespace" }
      2:
        patterns:
          - { include: "#FrontMatterString" }

  FrontMatterStringBlock:
    match: ^({{WS}}+)(.*$(?:\r\n|\r|\n)?)
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#FrontMatterString" }

  FrontMatterString:
    tag: string
    name: string.front-matter.string.sd
    begin: (?=.*$)
    patterns:
      - { include: "#LuauComment" }
      - { include: "#InlineText" }
    end: ($(?:\r\n|\r|\n)?)
    endCaptures:
      1:
        patterns:
          - { include: "#Newline" }

  ########## Title ##########

  Title:
    patterns:
      - { include: "#BlockTitle" }
      - { include: "#InlineTitle" }

  BlockTitle:
    tag: monospace
    name: string.display.title.block.sd
    begin: ^({{WS}}*)(\^)([:])({{WS}}*)(?={{EOL}})
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#TitleMark" }
      3:
        patterns:
          - { include: "#ColonSeparator" }
      4:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#SparkdownLineComment" }
      - { include: "#Annotation" }
      - { include: "#Newline" }
      - { include: "#BlockLineBlank" }
      - { include: "#BlockLineContinue" }
    end: (?=^(?!$|//|\1{{WS}}))
  InlineTitle:
    tag: monospace
    name: string.display.title.inline.sd
    begin: ({{WS}}*)(\^)([:])($|{{WS}}+)({{INLINE_LEADING_GLUE}})?
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#TitleMark" }
      3:
        patterns:
          - { include: "#ColonOperator" }
      4:
        patterns:
          - { include: "#RequiredWhitespace" }
      5:
        patterns:
          - { include: "#LeadingGlue" }
    patterns:
      - { include: "#Annotation" }
      - { include: "#Newline" }
      - { include: "#LineChain" }
      - { include: "#AssetLine" }
      - { include: "#ParentheticalLine" }
      - { include: "#LineEnd" }
      - { include: "#ExtraWhitespace" }
    end: (?=^{{WS}}*$)|(?=\r\n|\r|\n)|{{NOT_TAG_HASH_AFTER_TEXT}}
  TitleMark:
    tag: definition(punctuation)
    name: punctuation.title.mark.sd

  ########## Heading ##########

  Heading:
    patterns:
      - { include: "#BlockHeading" }
      - { include: "#InlineHeading" }

  BlockHeading:
    tag: regexp
    name: string.display.heading.block.sd
    begin: ^({{WS}}*)([$])([:])({{WS}}*)(?={{EOL}})
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#HeadingMark" }
      3:
        patterns:
          - { include: "#ColonSeparator" }
      4:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#SparkdownLineComment" }
      - { include: "#Annotation" }
      - { include: "#Newline" }
      - { include: "#BlockLineBlank" }
      - { include: "#BlockLineContinue" }
    end: (?=^(?!$|//|\1{{WS}}))
  InlineHeading:
    tag: regexp
    name: string.display.heading.inline.sd
    begin: ({{WS}}*)([$])([:])($|{{WS}}+)({{INLINE_LEADING_GLUE}})?
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#HeadingMark" }
      3:
        patterns:
          - { include: "#ColonOperator" }
      4:
        patterns:
          - { include: "#RequiredWhitespace" }
      5:
        patterns:
          - { include: "#LeadingGlue" }
    patterns:
      - { include: "#Annotation" }
      - { include: "#Newline" }
      - { include: "#LineChain" }
      - { include: "#AssetLine" }
      - { include: "#ParentheticalLine" }
      - { include: "#LineEnd" }
      - { include: "#ExtraWhitespace" }
    end: (?=^{{WS}}*$)|(?=\r\n|\r|\n)|{{NOT_TAG_HASH_AFTER_TEXT}}
  HeadingMark:
    tag: definition(punctuation)
    name: punctuation.heading.mark.sd

  ########## Transitional ##########

  Transitional:
    patterns:
      - { include: "#BlockTransitional" }
      - { include: "#InlineTransitional" }

  BlockTransitional:
    tag: labelName
    name: string.display.transitional.block.sd
    begin: ^({{WS}}*)([%])([:])({{WS}}*)(?={{EOL}})
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#TransitionalMark" }
      3:
        patterns:
          - { include: "#ColonSeparator" }
      4:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#SparkdownLineComment" }
      - { include: "#Annotation" }
      - { include: "#Newline" }
      - { include: "#BlockLineBlank" }
      - { include: "#BlockLineContinue" }
    end: (?=^(?!$|//|\1{{WS}}))
  InlineTransitional:
    tag: labelName
    name: string.display.transitional.inline.sd
    begin: ({{WS}}*)([%])([:])($|{{WS}}+)({{INLINE_LEADING_GLUE}})?
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#TransitionalMark" }
      3:
        patterns:
          - { include: "#ColonOperator" }
      4:
        patterns:
          - { include: "#RequiredWhitespace" }
      5:
        patterns:
          - { include: "#LeadingGlue" }
    patterns:
      - { include: "#Annotation" }
      - { include: "#Newline" }
      - { include: "#LineChain" }
      - { include: "#AssetLine" }
      - { include: "#ParentheticalLine" }
      - { include: "#LineEnd" }
      - { include: "#ExtraWhitespace" }
    end: (?=^{{WS}}*$)|(?=\r\n|\r|\n)|{{NOT_TAG_HASH_AFTER_TEXT}}
  TransitionalMark:
    tag: definition(punctuation)
    name: punctuation.transitional.mark.sd

  ########## Write ##########

  Write:
    patterns:
      - { include: "#BlockWrite" }
      - { include: "#InlineWrite" }

  BlockWrite:
    tag: definition(string)
    name: string.display.write.block.sd
    begin: ^({{WS}}*)([@])({{WS}}*)((?:\\.|[^:\r\n])*)((?<!\\)[:])({{WS}}*)(?={{EOL}})
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#WriteMark" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      4:
        patterns:
          - { include: "#WriteTarget" }
      5:
        patterns:
          - { include: "#ColonSeparator" }
      6:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#SparkdownLineComment" }
      - { include: "#Annotation" }
      - { include: "#Newline" }
      - { include: "#BlockLineBlank" }
      - { include: "#BlockLineContinue" }
    end: (?=^(?!$|//|\1{{WS}}))
  InlineWrite:
    tag: definition(string)
    name: string.display.write.inline.sd
    begin: ({{WS}}*)([@])({{WS}}*)((?:\\.|[^:\r\n])*)((?<!\\)[:])($|{{WS}}+)({{INLINE_LEADING_GLUE}})?
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#WriteMark" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      4:
        patterns:
          - { include: "#WriteTarget" }
      5:
        patterns:
          - { include: "#ColonSeparator" }
      6:
        patterns:
          - { include: "#RequiredWhitespace" }
      7:
        patterns:
          - { include: "#LeadingGlue" }
    patterns:
      - { include: "#Annotation" }
      - { include: "#Newline" }
      - { include: "#LineChain" }
      - { include: "#AssetLine" }
      - { include: "#ParentheticalLine" }
      - { include: "#LineEnd" }
    end: (?=^{{WS}}*$)|(?=\r\n|\r|\n)
  WriteMark:
    tag: keyword
    name: keyword.action.mark.sd

  WriteTarget:
    tag: propertyName
    name: variable.other.property.write.target.sd

  ########## Dialogue ##########

  Dialogue:
    patterns:
      - { include: "#BlockDialogue" }
      - { include: "#InlineDialogue" }

  BlockDialogue:
    tag: definition(string)
    name: string.display.dialogue.block.sd
    begin: ^({{WS}}*)((?=\S)(?:\\.|[^{}:\r\n])+)((?<!\\)[:])({{WS}}*)(?={{EOL}})
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#Annotation" }
          - { include: "#DialogueCharacter" }
      3:
        patterns:
          - { include: "#ColonSeparator" }
      4:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#SparkdownLineComment" }
      - { include: "#Annotation" }
      - { include: "#Newline" }
      - { include: "#BlockLineBlank" }
      - { include: "#BlockLineContinue" }
    # End when the next line:
    #  - is shallower than (or equal-indent to) the speaker line —
    #    `\1` is the captured leading WS of the speaker. `\1{{WS}}`
    #    requires at least one MORE whitespace char, so any line at
    #    or below the speaker's indent ends the block.
    #  - starts a structural construct that cannot be dialogue body
    #    regardless of its indent: a choice marker (`+` / `*`),
    #    divert (`->`), branch / scene / function / define
    #    declaration, or a `&`-prefixed Luau statement.
    # Without the explicit structural terminators, perturbing a
    # sibling choice's leading whitespace (e.g. `  + foo` →
    # `   + foo`) would absorb it into the prior dialogue's body.
    # The choice-marker terminator is `[*+]{{EOK}}` (NOT a bare `[*+]`):
    # a choice bullet requires an end-of-keyword boundary after it (EOL,
    # whitespace, or `:`/tag/comment — same `{{EOK}}` the `Choice` mark uses).
    # A bare `[*+]` also matched leading `*`/`+` of body markup (e.g. an
    # italic line `*Ay*, thank the Lord`), kicking the dialogue text out as a
    # top-level ImplicitAction — leaving the box empty AND dropping the
    # block's pathLocations (so it was unpreviewable).
    end: (?=^(?!$|//|\1{{WS}}))|(?=^{{WS}}*(?:[*+]{{EOK}}|->|[&%$^]|scene\b|branch\b|function\b|define\b|const\b|store\b|local\b))
  InlineDialogue:
    tag: definition(string)
    name: string.display.dialogue.inline.sd
    begin: ({{WS}}*)((?=\S)(?:\\.|[^{}:\r\n])+)((?<!\\)[:])($|{{WS}}+)({{INLINE_LEADING_GLUE}})?
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#Annotation" }
          - { include: "#DialogueCharacter" }
      3:
        patterns:
          - { include: "#ColonSeparator" }
      4:
        patterns:
          - { include: "#RequiredWhitespace" }
      5:
        patterns:
          - { include: "#LeadingGlue" }
    patterns:
      - { include: "#Annotation" }
      - { include: "#Newline" }
      - { include: "#LineChain" }
      - { include: "#AssetLine" }
      - { include: "#ParentheticalLine" }
      - { include: "#LineEnd" }
    end: (?=^{{WS}}*$)|(?=\r\n|\r|\n)
  DialogueCharacter:
    match: ({{WS}}*)(.*?)({{WS}}*)({{WS}}[(][^()\r\n]*?[)])?($|{{WS}}*)({{WS}}\[.*?\])?({{EOL}})
    captures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#DialogueCharacterName" }
      3:
        patterns:
          - { include: "#ExtraWhitespace" }
      4:
        patterns:
          - { include: "#DialogueCharacterParenthetical" }
      5:
        patterns:
          - { include: "#ExtraWhitespace" }
      6:
        patterns:
          - { include: "#DialogueCharacterPosition" }
      7:
        patterns:
          - { include: "#EndOfLine" }

  DialogueCharacterName:
    tag: typeName
    name: entity.name.type.dialogue.character.name.sd
    match: (.+$)
    captures:
      1:
        patterns:
          - { include: "#DisplayText" }

  DialogueCharacterParenthetical:
    tag: escape
    name: constant.character.escape.dialogue.character.parenthetical.sd
    match: ({{WS}})([(])({{WS}}*)([^()\r\n]*?)({{WS}}*)([)])({{WS}}*)
    captures:
      1:
        patterns:
          - { include: "#Whitespace" }
      2:
        tag: paren
        name: meta.brace.round.open.sd
      3:
        patterns:
          - { include: "#ExtraWhitespace" }
      4:
        patterns:
          - { include: "#DisplayText" }
      5:
        patterns:
          - { include: "#ExtraWhitespace" }
      6:
        tag: paren
        name: meta.brace.round.close.sd
      7:
        patterns:
          - { include: "#ExtraWhitespace" }

  DialogueCharacterPosition:
    tag: definition(escape)
    name: constant.character.escape.dialogue.character.position.sd
    match: ({{WS}})(\[)({{WS}}*)(.*?)({{WS}}*)(\])
    captures:
      1:
        patterns:
          - { include: "#Whitespace" }
      2:
        tag: bracket
        name: punctuation.definition.position.sd
      3:
        patterns:
          - { include: "#ExtraWhitespace" }
      4:
        patterns:
          - { include: "#DialogueCharacterPositionContent" }
      5:
        patterns:
          - { include: "#ExtraWhitespace" }
      6:
        tag: bracket
        name: punctuation.definition.position.sd

  DialogueCharacterPositionContent:
    match: (.+$)

  ########## Action ##########

  Action:
    patterns:
      - { include: "#BlockAction" }
      - { include: "#InlineAction" }
      - { include: "#ImplicitAction" }

  BlockAction:
    begin: ^({{WS}}*)([:])({{WS}}*)(?={{EOL}})
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#ColonSeparator" }
      3:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#SparkdownLineComment" }
      - { include: "#Annotation" }
      - { include: "#Newline" }
      - { include: "#BlockLineBlank" }
      - { include: "#BlockActionLineContinue" }
    end: (?=^(?!$|//|\1{{WS}}))
  # A `..` right after an interpolation (`{x} .. more`) is text the player
  # shows, so it does not begin an action there. A line that starts with an
  # interpolation is read whole as a display line (#1746); the guard is still
  # reached after a declaration that ends in `}` (`store t = {a=1} : more`),
  # where it leaves the rest of the line to ImplicitAction.
  InlineAction:
    begin: (?<![}])({{WS}}*)(?:({{LEADING_GLUE}})|([:])($|{{WS}}+))
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LeadingGlue" }
      3:
        patterns:
          - { include: "#ColonOperator" }
      4:
        patterns:
          - { include: "#RequiredWhitespace" }
    patterns:
      - { include: "#Annotation" }
      - { include: "#Newline" }
      - { include: "#ActionLineChain" }
      - { include: "#AssetLine" }
      - { include: "#ParentheticalLine" }
      - { include: "#ActionLineEnd" }
      - { include: "#ExtraWhitespace" }
    end: (?=^{{WS}}*$)|(?=\r\n|\r|\n)|{{NOT_TAG_HASH_AFTER_TEXT}}
  ImplicitAction:
    begin: ({{WS}}*)(?!{{END}})(?=\S)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#Annotation" }
      - { include: "#Newline" }
      - { include: "#ActionLineChain" }
      - { include: "#AssetLine" }
      - { include: "#ParentheticalLine" }
      - { include: "#ActionLineEnd" }
      - { include: "#ExtraWhitespace" }
    end: (?=^{{WS}}*$)|(?=\r\n|\r|\n)|{{NOT_TAG_HASH_AFTER_TEXT}}
  # Action bodies share display parsing, but also expose the load directive.
  # Keep the enclosing line shapes parallel to the ordinary display rules.
  BlockActionLineContinue:
    # lookaround: BlockLineBlank owns empty lines. Ordering already tries it
    # first, but this nullable begin can reopen at its end; splitting a Switch
    # does not prevent that. The parent's end bounds indentation, not emptiness.
    # No variable consumes the first display token, which must remain in the body.
    begin: ({{WS}}*)(?=\S)({{LEADING_GLUE}})?
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LeadingGlue" }
    patterns:
      - { include: "#AssetLine" }
      - { include: "#ParentheticalLine" }
      - { include: "#ActionDisplayLine" }
    end: ({{WS}}*)(?={{EOL}})
    endCaptures:
      1:
        patterns:
          - { include: "#Whitespace" }

  ActionLineChain:
    match: ({{WS}}*)(.*?)({{CHAIN}}{{DISPLAY_CHAIN_SEPARATOR}})({{EOL}})(\r\n|\r|\n)?
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#ActionDisplayLine" }
      3:
        patterns:
          - { include: "#Chain" }
      4:
        patterns:
          - { include: "#EndOfLine" }
      5:
        patterns:
          - { include: "#Newline" }

  ActionLineEnd:
    # lookaround: Annotation and ExtraWhitespace own the EOL suffix. They
    # cannot win merely by reordering while this nullable begin can reopen;
    # splitting a Switch has the same issue. The parent's end leaves whitespace
    # before tags to children. Tightening WS would lose indentation captures;
    # the first nonspace display token must remain unconsumed for the body.
    begin: ({{WS}}*)(?!{{EOL}})(?=\S)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#ActionDisplayLine" }
    end: (?={{EOL}})

  ActionDisplayLine:
    patterns:
      - { include: "#ActionLoadKeyword" }
      - { include: "#DisplayLine" }

  # LeadingGlue leaves its separator for the action body. Keep that whitespace
  # outside DisplayLoadKeyword so body walking can skip it and still encounter
  # the keyword node at its exact source start. OptionalWhitespace preserves
  # authored spacing immediately after LeadingGlue during formatting.
  ActionLoadKeyword:
    match: ({{WS}}*)({{LOAD_CONTROL_KEYWORDS}}{{WS}})
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#DisplayLoadKeyword" }

  ########## Parenthetical ##########

  ParentheticalLine:
    # NOTE: the whitespace arm inside the starred decoration groups must be a
    # MAXIMAL run ({{WS}}+(?!{{WS}})), never a nullable {{WS}}* — a nullable
    # alternative inside a star makes a failing match explore every partition
    # of a whitespace run (catastrophic backtracking: ~15s on a line with 28
    # leading spaces). See issue #280 and grammarRegexSafety.test.ts.
    match: ({{WS}}*)((?:[=].*?[=]|[<].*?[>]|{{WS}}+(?!{{WS}}))*)({{WS}}*)([(][^()\r\n]*?[)])({{WS}}*)((?:[=].*?[=]|[<].*?[>]|{{WS}}+(?!{{WS}}))*)($|{{EOL}}|(?={{BREAK}})|{{CHAIN}}(?:{{WS}}))
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#TextCommand" }
          - { include: "#ExtraWhitespace" }
      3:
        patterns:
          - { include: "#ExtraWhitespace" }
      4:
        patterns:
          - { include: "#ParentheticalLineContent" }
      5:
        patterns:
          - { include: "#ExtraWhitespace" }
      6:
        patterns:
          - { include: "#TextCommand" }
          - { include: "#ExtraWhitespace" }
      7:
        patterns:
          - { include: "#EndOfLine" }
          - { include: "#Chain" }

  ParentheticalLineContent:
    tag: escape
    name: constant.character.escape.sd
    match: ({{WS}}*)([(])({{WS}}*)([^()\r\n]*?)({{WS}}*)([)])({{WS}}*)
    captures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        tag: paren
        name: meta.brace.round.open.sd
      3:
        patterns:
          - { include: "#ExtraWhitespace" }
      4:
        patterns:
          - { include: "#DisplayText" }
      5:
        patterns:
          - { include: "#ExtraWhitespace" }
      6:
        tag: paren
        name: meta.brace.round.close.sd
      7:
        patterns:
          - { include: "#ExtraWhitespace" }

  ########## Text ##########

  BlockLineContinue:
    begin: ({{WS}}*)(?=\S)({{LEADING_GLUE}})?
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LeadingGlue" }
    patterns:
      - { include: "#AssetLine" }
      - { include: "#ParentheticalLine" }
      - { include: "#DisplayLine" }
    end: ({{WS}}*)(?={{EOL}})
    endCaptures:
      1:
        patterns:
          - { include: "#Whitespace" }

  BlockLineBlank:
    match: ^({{WS}}+$)
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }

  LineChain:
    match: ({{WS}}*)(.*?)({{CHAIN}}{{DISPLAY_CHAIN_SEPARATOR}})({{EOL}})(\r\n|\r|\n)?
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#DisplayLine" }
      3:
        patterns:
          - { include: "#Chain" }
      4:
        patterns:
          - { include: "#EndOfLine" }
      5:
        patterns:
          - { include: "#Newline" }

  LineEnd:
    begin: ({{WS}}*)(?!{{EOL}})(?=\S)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#DisplayLine" }
    end: (?={{EOL}})

  DisplayLine:
    patterns:
      - { include: "#Annotation" }
      - { include: "#Escape" }
      - { include: "#LuauFunctionCallShorthand" }
      - { include: "#LuauInterpolatedStringExpression" }
      - { include: "#ParentheticalLine" }
      - { include: "#Chain" }
      # Inline-glued alternators (`.. queue|a|b|c ..`) must come before
      # `Glue` so the alternator-opening `..` wins when followed by an
      # alternator keyword. If the `..` is plain glue, the alternator
      # begin pattern fails to match and the Glue rule takes over.
      - { include: "#LuauSparkdownInlineGluedSequentialAlternatorBlock" }
      - { include: "#LuauSparkdownInlineGluedConditionalAlternatorBlock" }
      # End-of-line `//` comment after text — must come before Glue/TextChunk
      # so the ` //…` tail is consumed as a comment rather than display text.
      - { include: "#SparkdownInlineComment" }
      # A `>` anywhere in the line ends the beat before it, and a `..` right
      # after it begins the part after it.
      - { include: "#BreakLeadingGlue" }
      - { include: "#Break" }
      - { include: "#Glue" }
      - { include: "#TextChunk" }

  # The load word at the beginning of an action-text run. Only a beat
  # beginning with this token is a directive. Include its separator so the
  # lowerer removes one token. Dialogue and other display kinds never use it.
  DisplayLoadKeyword:
    match: ({{LOAD_CONTROL_KEYWORDS}})({{WS}})
    captures:
      1:
        patterns:
          - { include: "#AssetCommandControl" }
      2:
        patterns:
          - { include: "#RequiredWhitespace" }

  TextChunk:
    tag: special(string)
    name: string.display.text.chunk.sd
    begin: (?=.+)
    patterns:
      - { include: "#DisplayText" }
    end: (?=$|{{WS}}*{{CHAIN}}(?:$|{{WS}})|{{GLUE}}|{{INLINE_GLUED_ALTERNATOR_START}}|{{EOL}}|{{WS}}*[/]{2}(?=$|{{WS}})|{{WS}}*{{BREAK_MARK}})

  DisplayText:
    patterns:
      - { include: "#Annotation" }
      - { include: "#Escape" }
      - { include: "#ImageCommand" }
      - { include: "#AudioCommand" }
      - { include: "#InlineTextAndLogic" }

  ########## Commands ##########

  ImageLine:
    match: ^({{WS}}*)(?=\S)((?:\[\[{{IMAGE_COMMAND_CHAR}}*?\]\]|{{WS}}+)+)({{EOL}})
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#ImageCommand" }
          - { include: "#ExtraWhitespace" }
      3:
        patterns:
          - { include: "#EndOfLine" }

  AudioLine:
    match: ^({{WS}}*)(?=\S)((?:[(][(]{{AUDIO_COMMAND_CHAR}}*?[)][)]|{{WS}}+)+)({{EOL}})
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#AudioCommand" }
          - { include: "#ExtraWhitespace" }
      3:
        patterns:
          - { include: "#EndOfLine" }

  ImageAndAudioLine:
    match: ^({{WS}}*)(?=\S)((?:\[\[{{IMAGE_COMMAND_CHAR}}*?\]\]|[(][(]{{AUDIO_COMMAND_CHAR}}*?[)][)]|{{WS}}+)+)({{EOL}})
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#ImageCommand" }
          - { include: "#AudioCommand" }
          - { include: "#ExtraWhitespace" }
      3:
        patterns:
          - { include: "#EndOfLine" }

  AssetLine:
    patterns:
      - { include: "#ImageLine" }
      - { include: "#AudioLine" }
      - { include: "#ImageAndAudioLine" }

  ImageCommand:
    tag: macroName
    name: meta.image.sd
    brackets: true
    begin: (\[\[)({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#ImageBeginMark" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#ImageCommandContent" }
    end: $|({{WS}}*)(\]\])({{WS}}*)
    endCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#ImageEndMark" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  ImageCommandContent:
    match: ({{IMAGE_COMMAND_CHAR}}*?)(?=$|{{WS}}*\]\])
    captures:
      1:
        patterns:
          - { include: "#AssetCommandContent" }

  AudioCommand:
    tag: macroName
    name: meta.audio.sd
    brackets: true
    begin: ([(][(])({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#AudioBeginMark" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#AudioCommandContent" }
    end: $|({{WS}}*)([)][)])({{WS}}*)
    endCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#AudioEndMark" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  AudioCommandContent:
    match: ({{AUDIO_COMMAND_CHAR}}*?)(?=$|{{WS}}*[)][)])
    captures:
      1:
        patterns:
          - { include: "#AssetCommandContent" }

  AssetCommandContent:
    match: (.*?)($|(?:{{IMAGE_CLAUSE_KEYWORDS}}|{{AUDIO_CLAUSE_KEYWORDS}})(?=$|{{WS}}).*)
    captures:
      1:
        patterns:
          - { include: "#RequiredWhitespace" }
          - { include: "#AssetCommandInstruction" }
      2:
        patterns:
          - { include: "#Annotation" }
          - { include: "#RequiredWhitespace" }
          - { include: "#AssetCommandClauseKeyword" }
          - { include: "#TimeValue" }
          - { include: "#NumberValue" }
          - { include: "#NameValue" }

  AssetCommandInstruction:
    match: (?:({{IMAGE_CONTROL_KEYWORDS}}|{{AUDIO_CONTROL_KEYWORDS}}|{{LAYOUT_CONTROL_KEYWORDS}}|{{LOAD_CONTROL_KEYWORDS}})({{WS}}*)($|\S+)({{WS}}*))?(.*)
    captures:
      1:
        patterns:
          - { include: "#AssetCommandControl" }
      2:
        patterns:
          - { include: "#RequiredWhitespace" }
      3:
        patterns:
          - { include: "#AssetCommandTarget" }
      4:
        patterns:
          - { include: "#RequiredWhitespace" }
      5:
        patterns:
          - { include: "#AssetCommandAddOperator" }
          - { include: "#AssetCommandName" }
          - { include: "#RequiredWhitespace" }
          - { include: "#IllegalChar" }

  ImageBeginMark:
    tag: keyword
    name: keyword.operator.expression.begin.image.sd

  ImageEndMark:
    tag: keyword
    name: keyword.operator.expression.end.image.sd

  AudioBeginMark:
    tag: keyword
    name: keyword.operator.expression.begin.audio.sd

  AudioEndMark:
    tag: keyword
    name: keyword.operator.expression.end.audio.sd

  AssetCommandControl:
    tag: controlKeyword
    name: keyword.control.asset.control.sd

  AssetCommandTarget:
    tag: typeName
    name: entity.name.type.asset.target.sd

  AssetCommandClauseKeyword:
    tag: keyword
    name: keyword.asset.clause.keyword.sd
    match: ({{IMAGE_CLAUSE_KEYWORDS}}|{{AUDIO_CLAUSE_KEYWORDS}})

  AssetCommandName:
    match: (.+?)(?=$|[+])
    captures:
      1:
        patterns:
          - { include: "#RequiredWhitespace" }
          - { include: "#LuauString" }
          - { include: "#AssetCommandKeywordNone" }
          - { include: "#AssetCommandFilteredFileName" }
          - { include: "#AssetCommandFileName" }
          - { include: "#AssetCommandFilter" }
          - { include: "#IllegalChar" }

  AssetCommandKeywordNone:
    tag: keyword
    name: keyword.asset.keyword.none.sd
    match: (none)

  AssetCommandFilteredFileName:
    tag: constant(variableName)
    name: variable.other.constant.asset.file.sd
    match: ({{IDENTIFIER}})((?:[:~][^:~\s]+)+)
    captures:
      1:
        patterns:
          - { include: "#AssetCommandFileName" }
      2:
        patterns:
          - { include: "#AssetCommandFilter" }

  AssetCommandFileName:
    tag: constant(variableName)
    name: variable.other.constant.asset.file.sd
    match: ({{IDENTIFIER}})

  AssetCommandAddOperator:
    tag: propertyName
    name: variable.other.property.add.sd
    match: ({{WS}}*[+]{{WS}}*)

  AssetCommandFilter:
    match: ([:~])($|[^:~\s]+)?
    captures:
      1:
        patterns:
          - { include: "#AssetCommandFilterOperator" }
      2:
        patterns:
          - { include: "#AssetCommandFilterName" }

  AssetCommandFilterOperator:
    tag: propertyName
    name: variable.other.property.filter.sd
    match: ([:~])

  AssetCommandFilterName:
    tag: constant(variableName)
    name: variable.other.constant.asset.filter.sd
    match: ([a-zA-Z_][a-zA-Z0-9_-]*(?:[.][a-zA-Z_][a-zA-Z0-9_-]*)*)

  TimeValue:
    tag: number
    name: constant.numeric.time.sd
    match: ([-]?(?:\d*[.])?\d+)(ms|s)(?=$|{{WS}})
    captures:
      1:
        tag: number
        name: constant.numeric.time.amount.sd
      2:
        tag: number
        name: constant.numeric.time.unit.sd

  NumberValue:
    tag: number
    name: constant.numeric.number.sd
    match: ([-]?(?:\d*[.])?\d+)(?=$|{{WS}})

  NameValue:
    tag: constant(variableName)
    name: variable.other.constant.sd
    match: ({{IDENTIFIER}})(?=$|{{WS}})

  TextCommand:
    tag: macroName
    name: meta.text.sd
    match: ([<](?!{{WS}}))((?:\\.|[^>\r\n])*?)((?<![-])[>])
    captures:
      1:
        tag: keyword
        name: keyword.operator.expression.begin.tag.sd
      2:
        patterns:
          - { include: "#TextCommandContent" }
      3:
        tag: keyword
        name: keyword.operator.expression.end.tag.sd

  TextCommandContent:
    match: ({{WS}}*)([^ :\r\n]+)({{WS}}*)(?:([:])({{WS}}*)(.*))?
    captures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#TextCommandControl" }
      3:
        patterns:
          - { include: "#ExtraWhitespace" }
      4:
        patterns:
          - { include: "#ColonOperator" }
      5:
        patterns:
          - { include: "#ExtraWhitespace" }
      6:
        patterns:
          - { include: "#TextCommandArguments" }

  TextCommandControl:
    captures:
      1:
        patterns:
          - { include: "#LuauNumber" }
          - { include: "#TextCommandControlKeyword" }

  TextCommandControlKeyword:
    tag: keyword
    name: keyword.style.control.keyword.sd

  TextCommandArguments:
    captures:
      1:
        patterns:
          - { include: "#TextCommandArgument" }

  TextCommandArgument:
    tag: meta
    name: meta.argument.sd
    begin: (?=.+$)
    patterns:
      - { include: "#Annotation" }
      - { include: "#LuauExpression" }
    end: (?=$)|([,])
    endCaptures:
      1:
        tag: separator
        name: meta.template.expression.comma.sd

  ########## Text ##########

  InlineTextAndLogic:
    patterns:
      - { include: "#Escape" }
      - { include: "#Divert" }
      - { include: "#Thread" }
      - { include: "#LuauFunctionCallShorthand" }
      - { include: "#LuauInterpolatedStringExpression" }
      # Inline-glued alternators (`.. queue|a|b|c ..`) must come before
      # `InlineText` / `Styling` so the alternator-opening `..` is
      # consumed by the alternator rule rather than by the regular
      # glue path (`Styling` includes `Glue`).
      - { include: "#LuauSparkdownInlineGluedSequentialAlternatorBlock" }
      - { include: "#LuauSparkdownInlineGluedConditionalAlternatorBlock" }
      - { include: "#AudioCommand" }
      - { include: "#ImageCommand" }
      - { include: "#InlineText" }

  InlineText:
    patterns:
      - { include: "#Escape" }
      - { include: "#Raw" }
      - { include: "#Styling" }
      - { include: "#Emphasis" }
      - { include: "#PlainText" }

  Escape:
    match: (?:^(\\)({{WS}})|(?<!^)(\\)({{WS}})|(\\)(\S))
    captures:
      1:
        tag: definition(escape)
        name: constant.character.escape.sd
      2:
        tag: content
        name: markup.raw.text.sd
      3:
        tag: definition(escape)
        name: constant.character.escape.sd
      4:
        tag: content
        name: markup.raw.text.sd
      5:
        tag: definition(escape)
        name: constant.character.escape.sd
      6:
        tag: content
        name: markup.raw.text.sd

  Styling:
    patterns:
      - { include: "#Glue" }
      - { include: "#TextCommand" }
      - { include: "#Underline" }
      - { include: "#BoldItalic" }
      - { include: "#Bold" }
      - { include: "#Italic" }
      - { include: "#Centered" }

  StylingMark:
    captures:
      1:
        tag: definition(content)
        name: markup.raw.text.sd

  Raw:
    tag: content
    name: markup.raw.text.sd
    begin: ([`]+)
    beginCaptures:
      1:
        patterns:
          - { include: "#StylingMark" }
    patterns:
      - { include: "#PlainText" }
    end: (\1)|(?={{EOL}})
    endCaptures:
      1:
        patterns:
          - { include: "#StylingMark" }

  BoldItalic:
    tag: strong
    name: markup.other.bold.sd
    begin: ([*][*])(?=[*])
    beginCaptures:
      1:
        patterns:
          - { include: "#StylingMark" }
    patterns:
      - { include: "#Italic" }
    end: (\1)|(?={{EOL}})
    endCaptures:
      1:
        patterns:
          - { include: "#StylingMark" }

  Bold:
    tag: strong
    name: markup.other.bold.sd
    begin: ([*][*])(?![*])
    beginCaptures:
      1:
        patterns:
          - { include: "#StylingMark" }
    patterns:
      - { include: "#InlineTextAndLogic" }
    end: (\1)|(?={{EOL}})
    endCaptures:
      1:
        patterns:
          - { include: "#StylingMark" }

  Italic:
    tag: emphasis
    name: markup.other.italic.sd
    begin: ([*])(?![*])
    beginCaptures:
      1:
        patterns:
          - { include: "#StylingMark" }
    patterns:
      - { include: "#InlineTextAndLogic" }
    end: (\1)|(?={{EOL}})
    endCaptures:
      1:
        patterns:
          - { include: "#StylingMark" }

  Underline:
    tag: link
    name: markup.other.underline.sd
    begin: ([_]+)
    beginCaptures:
      1:
        patterns:
          - { include: "#StylingMark" }
    patterns:
      - { include: "#InlineTextAndLogic" }
    end: (\1)|(?={{EOL}})
    endCaptures:
      1:
        patterns:
          - { include: "#StylingMark" }

  Centered:
    tag: monospace
    name: constant.character.escape.centered.sd
    begin: ([\^]+)
    beginCaptures:
      1:
        patterns:
          - { include: "#StylingMark" }
    patterns:
      - { include: "#InlineTextAndLogic" }
    end: (\1)|(?={{EOL}})
    endCaptures:
      1:
        patterns:
          - { include: "#StylingMark" }

  Emphasis:
    patterns:
      - { include: "#EmphasisTilde" }
      - { include: "#EmphasisColon" }

  EmphasisTilde:
    tag: quote
    name: markup.emphasis.tilde.sd
    begin: ([~][~]+)
    beginCaptures:
      1:
        patterns:
          - { include: "#StylingMark" }
    patterns:
      - { include: "#InlineTextAndLogic" }
    end: (\1)|(?={{EOL}})
    endCaptures:
      1:
        patterns:
          - { include: "#StylingMark" }

  EmphasisColon:
    tag: quote
    name: markup.emphasis.colon.sd
    begin: ([:][:]+)
    beginCaptures:
      1:
        patterns:
          - { include: "#StylingMark" }
    patterns:
      - { include: "#InlineTextAndLogic" }
    end: (\1)|(?={{EOL}})
    endCaptures:
      1:
        patterns:
          - { include: "#StylingMark" }

  PlainText:
    patterns:
      - { include: "#Newline" }
      - { include: "#Space" }
      - { include: "#Word" }
      # One character at a time, so `Divert` is tried at every dash and takes
      # the last `-` of `-->`.
      - { include: "#Punctuation" }

  Space:
    tag: content
    name: markup.raw.space.sd
    match: ([ ])

  Word:
    tag: content
    name: markup.raw.text.sd
    match: ({{WORD}})

  Punctuation:
    tag: content
    name: markup.raw.punctuation.sd
    match: (.)

  ########## Errors ##########

  IllegalChar:
    tag: invalid
    name: invalid.illegal.illegal-char.sd
    match: (.)

  Unknown:
    tag: invalid
    name: invalid.illegal.unknown-statement.sd
    match: (.+$)

  # LUAU

  LuauDivertTargetLiteral:
    # `-> name` (optionally `-> a.b.c`) as a first-class value: stores
    # a pointer to the target which can later be invoked with `-> x`
    # or `-> x(args)`, or compared with `==`. Mirrors inkjs's
    # `DivertTarget` (which extends `Expression`). Single-line match
    # to keep the boundary clean — the rule deliberately doesn't try
    # to swallow argument parentheses; `-> place(5)` as a literal
    # isn't a common ink shape, and stripping the arg call form here
    # would conflict with the `-> name(args)` divert syntax. The
    # trailing `(WS*)` is required so that, when this literal is used
    # mid-expression (e.g. `if -> X == -> Y then`), the LuauIfBlockCondition's
    # `(?=WS)` end-lookahead doesn't fire between the literal and the
    # following operator. In the last arm of a braced alternator, after a `|`
    # (and a `name =` for match and plural arms), an `end` directly before
    # the `}` is not a target: in `{queue | "a" | -> end}` the `->` is an
    # empty divert and `end` closes the alternator. Labels may take keyword
    # names, so `end` in any other position (`count.turns(-> end)`,
    # `{ -> end }` as a table value) is a target, as is every other keyword
    # and a name that only begins with `end` (`end-game`).
    match: "(?!{{AFTER_ALTERNATOR_ARM_SEPARATOR}}{{END_DIVERT_CLOSING_ALTERNATOR}})({{WS}}*)([-][>])({{WS}}*)({{IDENTIFIER}}{{LUAU_SHARED_DIVERT_DOTTED_PART}}*)({{WS}}*)"
    captures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#DivertMark" }
      3:
        patterns:
          - { include: "#OptionalWhitespace" }
      4:
        patterns:
          - { include: "#DivertPath" }
      5:
        patterns:
          - { include: "#ExtraWhitespace" }

  LuauExpression:
    patterns:
      - { include: "#LuauComment" }
      # Returns belong to Luau code (functions and explicit `&` islands).
      # Story bodies try display text before their expression fallback.
      - { include: "#LuauReturnStatement" }
      - { include: "#LuauTernaryExpression" }
      - { include: "#LuauAlternatorBlocks" }
      # Divert-target literal (`-> name`) is an inkjs-style first-class
      # value: e.g. `store x = -> place` stores a pointer to the `place`
      # scene that can later be re-invoked via `-> x`. Must come before
      # the arithmetic / compare operations so `->` isn't greedily split
      # into a `-` operator + `>` comparator.
      - { include: "#LuauDivertTargetLiteral" }
      # Before the declarations: a word that declares nothing here is a name.
      - { include: "#LuauDeclarationWordAsName" }
      - { include: "#LuauExpressionDeclarations" }
      - { include: "#LuauAssignmentOperation" }
      - { include: "#LuauRegexLiteral" }
      # An explicit type instantiation after a method's name (`t:f<<T>>()`),
      # which ends the access path before it. Luau has no `<<` operator, so
      # it comes before the compare operation, which would read its `<`s.
      - { include: "#LuauGenericsInstantiation" }
      - { include: "#LuauOperatorMissingOperand" }
      - { include: "#LuauArithmeticOperation" }
      - { include: "#LuauCompareOperation" }
      - { include: "#LuauConcatOperation" }
      - { include: "#LuauLengthOperation" }
      - { include: "#LuauLogicalOperation" }
      - { include: "#LuauTypeCastOperation" }
      - { include: "#LuauParenthetical" }
      - { include: "#LuauAttributedFunctionValue" }
      - { include: "#LuauAttributeList" }
      - { include: "#LuauAttribute" }
      - { include: "#LuauNumber" }
      - { include: "#LuauString" }
      - { include: "#LuauBoolean" }
      - { include: "#LuauNil" }
      - { include: "#LuauKeyword" }
      # `LuauStdLibGlobals` is reached via `LuauVariable`'s capture
      # patterns when `_G` / `_VERSION` appear in expression context.
      # Including it standalone here too would short-circuit the
      # access-path lowerer (which needs to see them as identifiers
      # for the `STDLIB_CONSTANTS` short-circuit).
      # `LuauTypeofFunction` is intentionally NOT included in value
      # expressions: in value context, `type(x)` and `typeof(x)` are
      # Luau stdlib function calls returning the type-name string,
      # and route through `LuauFunctionCall` like any other call.
      # The type-context inclusion (in `LuauTypeName`'s pattern list)
      # handles the `local x: typeof(y) = ...` type-inference form
      # where `typeof(y)` is a type expression.
      # `new ClassName(...)` instance construction — must come BEFORE
      # `LuauAccessPath` so `new` isn't lexed as an ordinary
      # identifier path. The constructor's arg list parses as the
      # following sibling `LuauParenthetical` (the lowerer pairs them,
      # mirroring method-call arg pairing). A bare `new` variable
      # reference still works: the rule requires a following
      # identifier, so `print(new)` falls through to the access path.
      - { include: "#LuauNewExpression" }
      - { include: "#LuauAccessPath" }
      # A `:` the path ended before, with `do` or `then` as the method's name
      # (`local b = a:do`, `(t):do()`); a header's condition reads the `:`
      # before its own keyword first.
      - { include: "#LuauExpressionKeywordMethodAccessor" }
      - { include: "#LuauTable" }
      # `LuauChainedFunctionCall` must come BEFORE
      # `LuauTypeAnnotationOperation`: after a `LuauParenthetical`, a
      # following `:method(args)` sequence must be tokenized as a method-
      # call chain link, not as a type annotation. Since both rules begin
      # with `:`, the order here decides which takes priority — chained
      # method calls win.
      - { include: "#LuauChainedFunctionCall" }
      # `LuauChainedPropertyAccess` extends a method-call chain with
      # trailing `.name` / `[expr]` links. Sits next to
      # `LuauChainedFunctionCall` so any mix of `:m(x).y[i]:n()` works.
      - { include: "#LuauChainedPropertyAccess" }
      - { include: "#LuauTypeAnnotationOperation" }
      # NB: `LuauSemicolonSeparator` is deliberately NOT included here.
      # `;` is a STATEMENT separator — it lives in `LuauBlockBody` (and
      # `LuauTable`, where it separates fields). When it was included
      # at expression level, statement rules whose patterns include
      # `LuauExpression` (e.g. `LuauVariableDefinition`) swallowed the
      # `;` and the following statement instead of closing — turning
      # `local x = {}; for i=1,n do ... end; return ...` into one
      # mangled definition (the for-loop degraded to a once-through
      # do-block).

  LuauDeclarations:
    # NOTE: `#LuauComment` is deliberately NOT included here. `LuauDeclarations`
    # is reached from the top-level (root) patterns and from every mixed
    # sparkdown+display body (`LuauSparkdownBlockBody`, `LuauSparkdownChooseBlock`,
    # `LuauSparkdownChooseThenClause`), which is exactly where scene/action/
    # dialogue prose lives. A `--` there is a display em-dash (and `---` a
    # front-matter fence / title-page divider), never a comment — the R&B
    # screenplay opens dozens of action lines with `-- …`. Pulling `#LuauComment`
    # in here made every such line parse as a `LuauLineComment` and vanish from
    # the preview. Luau comments belong ONLY to genuine Luau-code contexts, which
    # each reach comments directly: `LuauExpression` (the sibling in every pure
    # `LuauBlockBody` scope) includes `#LuauComment`,
    # and function/param/define bodies include it themselves. See
    # [[feedback_grammar_golden_rule]]: separate the two contexts in the grammar
    # rather than disambiguate downstream. Regression: FrontMatterAndCommentContext.test.ts.
    patterns:
      - { include: "#LuauExpressionDeclarations" }
      - { include: "#LuauBreakStatement" }
      - { include: "#LuauContinueStatement" }

  # The declarations `LuauExpression` reaches: all of `LuauDeclarations` but
  # `break` and `continue`, which are statements only where a statement
  # begins. Where an expression stands, `continue` is a name and `break` a
  # keyword Luau reports (#984).
  LuauExpressionDeclarations:
    patterns:
      - { include: "#LuauShebang" }
      - { include: "#LuauStyle" }
      - { include: "#LuauLayout" }
      - { include: "#LuauScreen" }
      - { include: "#LuauComponent" }
      - { include: "#LuauAnimation" }
      - { include: "#LuauTheme" }
      - { include: "#LuauMorph" }
      - { include: "#LuauDefine" }
      - { include: "#LuauFunctionDefinition" }
      - { include: "#LuauVariableDefinition" }
      - { include: "#LuauFunctionTypeDeclaration" }
      - { include: "#LuauDataTypeDeclaration" }
      - { include: "#LuauGotoStatement" }
      - { include: "#LuauLabel" }

  # ----------------------------------------------------------------------------
  # Explicit Statement
  # ----------------------------------------------------------------------------

  # Story code islands end at their line unless a bracket carries them on,
  # as every story statement does (#1907, GRAMMAR.md §11.5). A `do` here
  # uses the bounded counterpart so its unfinished body cannot capture the
  # next prose line.
  # Only story text has this marker: a function body is Luau throughout,
  # and a `&` that starts a line there continues a type
  # (`LuauTypeOperatorLineContinuation`).
  LuauSparkdownExplicitStatement:
    begin: ({{WS}}*)([&])($|{{WS}}+)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauExplicitStatementMark" }
      3:
        patterns:
          - { include: "#RequiredWhitespace" }
    patterns:
      # First: it opens only right after a `repeat` loop's `until`.
      - { include: "#LuauSparkdownExplicitUntilCondition" }
      - { include: "#LuauFunctionDefinition" }
      - { include: "#LuauSparkdownExplicitDoBlock" }
      # The bounded control blocks a `& do` island holds also stand on
      # their own marked line (`& for ... do ... end`, `& if ... end`).
      - { include: "#LuauSparkdownExplicitIfBlock" }
      - { include: "#LuauSparkdownExplicitLoop" }
      - { include: "#LuauSparkdownExplicitRepeatLoop" }
      - { include: "#LuauSparkdownVariableDefinition" }
      - { include: "#LuauSparkdownExplicitDeclarations" }
      - { include: "#LuauCommaSeparator" }
      # A declaration yields its separator here. Keeping it in the marked
      # wrapper makes the following statement code rather than story text.
      - { include: "#LuauSemicolonSeparator" }
      - { include: "#LuauSparkdownExplicitExpression" }
      - { include: "#ExtraWhitespace" }
      # Keep unmatched punctuation in the authored code island so the
      # checker reports its written token rather than losing it to prose.
      - { include: "#LuauInvalidStatementToken" }
    # A closer the statement's own blocks did not take closes a block around
    # the statement (`repeat & x() until c`), so the statement ends before it.
    end: (?={{BEAT}})|$|(?=^)|(?={{WS}}*{{LUAU_CLOSER}})

  LuauExplicitStatementMark:
    tag: keyword
    name: keyword.other.statement.explicit.luau.mark.sd

  # ----------------------------------------------------------------------------
  # Implicit Assignment Statement
  #
  # `x = 5`, `obj.field = value`, `obj.a[k].b = …`, etc. — a bare reassignment
  # with no leading `&`. Without this rule competing for the match,
  # statement-bearing contexts that also accept Sparkdown display lines
  # (if/else bodies, scene bodies) would parse `x = 5` as ImplicitAction text.
  #
  # The begin approximates Lua's "suffixed expression then `=`" rule:
  # identifier, then any number of `.<ident>` segments or one-level `[…]`
  # brackets, then an assignment operator. Deeply nested bracket targets that
  # the begin can't recognize fall through to the lowerer's sibling-pair
  # detection in `lowerStatements`, so this rule is a disambiguator of
  # convenience — the lowerer is the real source of truth.
  # ----------------------------------------------------------------------------

  LuauReassignment:
    # The begin consumes the targets (`LUAU_REASSIGNMENT_TARGETS`) and looks
    # ahead for the assignment operator, which `LuauAssignmentOperation`
    # reads with the first value. A target may include dot-accessors
    # (`a.b`), bracket indexers (`a[k]`), OR a multi-target comma list
    # (`a, b`), so `a, b = 10, 20` parses as a single reassignment.
    # `LuauCommaSeparator` is in the inner patterns too, for the commas
    # between RHS expressions. In Luau code a target list may also end its
    # line with a comma (`a,` then `g = 1, 2`); the narrative rule does not
    # begin there, since `a,` is prose in a scene. Consuming the targets
    # keeps the reassignment from standing at the start of a line where it
    # opens, so its column-0 end (`LUAU_REASSIGNMENT_END`) never closes it
    # there.
    begin: ({{WS}}*)({{LUAU_REASSIGNMENT_TARGETS}})(?={{WS}}*{{LUAU_REASSIGNMENT_TARGETS_END}})
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauReassignmentTargets" }
    # End (`LUAU_REASSIGNMENT_END`) at: next BEAT (scene/branch), end of line, an upcoming
    # statement-boundary keyword (`if`, `while`, `for`, `repeat`, `do`,
    # `function`, `end`, `return`, `local`, `break`, `continue`,
    # `elseif`, `else`, `then`, `until`), an upcoming bare
    # reassignment statement, OR an upcoming bare call statement on
    # the same line. Without the keyword lookaheads,
    # `b = b * 2 if a == 1 then break end` would let
    # LuauReassignment swallow the trailing `if`; without the
    # reassignment-start lookahead, two adjacent same-line reassignments
    # (e.g. `a = 1 a = 2` or `b = 2 a, b = b, a`, common inside
    # single-line function bodies like
    # `function() a = 1 a = 2 return a end` and basic.luau's swap
    # idiom) would parse as a SINGLE LuauReassignment node — and the
    # lowerer would silently drop everything after the first pair. The
    # reassignment-start lookahead mirrors the `begin` pattern's shape:
    # `IDENT (access-chain)* WS* ASSIGN_OP`, where access-chain covers
    # `.field`, `[...]`, and `,IDENT` (the multi-target form).
    #
    # The call-statement lookahead (`IDENT (access-chain)* WS* (`)
    # handles `mt = { ... } setmetatable(a, mt)` — without it the
    # trailing call is swallowed into the value expression and
    # silently dropped by the lowerer. The call's leading name is
    # `LUAU_UNRESERVED_IDENTIFIER`, which no keyword is, because a
    # parenthesized operand after a logical keyword (`a = b and (x)`)
    # would otherwise match the call shape and truncate the value
    # mid-expression. This is
    # safe at value-START positions because every operator/separator
    # rule consumes its TRAILING whitespace, so a call that begins an
    # operand never has the `{{WS}}+` prefix this lookahead requires.
    #
    # `(?={{WS}}*[}])` closes the reassignment at a `}` boundary — needed
    # for an inline event-handler closure (`@input={ name = event.value }`,
    # see LuauSparkleHandlerClosure) whose LAST statement is a bare
    # reassignment: without it the reassignment runs out of patterns
    # before the closure's `}` and the scoped rule appends an
    # ERROR_INCOMPLETE node. Safe elsewhere — a reassignment is only ever
    # followed by `}` inside such a closure (function/if bodies close at
    # `end`/newline, never `}`; a table-literal VALUE consumes its own
    # braces before this end is checked, and reassignment statements never
    # appear inside a table).
    #
    # A block comment between the value and the next statement takes the
    # whitespace these lookaheads need, so `LUAU_VALUE_COMMENT_BEFORE_STATEMENT`
    # ends the reassignment before that comment instead. It also ends before
    # the closing brackets that a `LuauValueTrailingBlockComment` spanning
    # lines leaves when a statement follows them directly (`]]print(1)`).
    #
    # This is the reassignment in Luau code (function bodies and Luau
    # blocks). As in Luau, a comma that ends its line continues the value
    # list on the next line: `LuauCommaLineBreak` carries the reassignment
    # across the line break, as it does `LuauVariableDefinition`. That line
    # then belongs to the enclosing block when it starts with a statement
    # (`LUAU_LIST_LINE_START_STATEMENT`, checked only at the start of a
    # line, which a reassignment reaches only through that line break), and
    # the comma before it is left without a value (the lowerer reports it,
    # as Luau does). A narrative body reassigns with
    # `LuauSparkdownReassignment`, which ends at its line.
    #
    # Both rules end at the start of a column-0 line that an if expression
    # carried them onto (`x = if c then 1` then `print(x)`; see
    # `LUAU_COLUMN_0_LINE_START`).
    #
    # An `=` that ends its line, or has only comments after it, reads the
    # value from a later line, as Luau does: its `LuauAssignmentOperation`
    # stays open across the line break (`LuauAssignmentLineBreak`). An `if`
    # that begins that line is the if expression it reads (#1247); before
    # any other token it ends, and this rule reads that token as its value
    # unless it begins a statement, which ends the reassignment without a
    # value.
    patterns:
      - { include: "#LuauCommaLineBreak" }
      - { include: "#LuauValueTrailingBlockComment" }
      - { include: "#LuauComment" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#LuauAccessPath" }
      - { include: "#LuauAssignmentOperation" }
      - { include: "#LuauExpression" }
      - { include: "#ExtraWhitespace" }
    end: "{{LUAU_REASSIGNMENT_END}}|(?={{LUAU_GLUED_KEYWORD}})|(?<=^{{WS}}*)(?={{LUAU_LIST_LINE_START_STATEMENT}})"

  # The reassignment in a narrative body (a scene, or a sparkdown `if`, loop
  # or `choose` around dialogue and actions). It ends at its line (#1907):
  # the next line is story, never a continued value, so a comma, an operator,
  # an if expression's `then` or `else`, or an `=` that ends the line is left
  # without its value and the converter reports it. Only a bracket, a long
  # string or a block comment that opens on the line carries it on. Its
  # values are the bounded family's (`LuauSparkdownExplicitExpression`),
  # whose operations and arms end at the line and whose brackets span lines.
  # Its begin and end are otherwise `LuauReassignment`'s, but for its
  # operation, `LuauSparkdownAssignmentOperation`, which has no line break
  # after its `=` (#1906); `reassignmentRules.test.ts` holds the two rules
  # together.
  LuauSparkdownReassignment:
    begin: ({{WS}}*)({{LUAU_REASSIGNMENT_TARGETS}})(?={{WS}}*(?:{{LUAU_ASSIGNMENT_OPERATORS}}))
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauReassignmentTargets" }
    patterns:
      - { include: "#LuauValueTrailingBlockComment" }
      - { include: "#LuauComment" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#LuauSparkdownExplicitAccessPath" }
      - { include: "#LuauSparkdownAssignmentOperation" }
      - { include: "#LuauSparkdownExplicitExpression" }
      - { include: "#ExtraWhitespace" }
    end: "{{LUAU_REASSIGNMENT_END}}|(?={{LUAU_GLUED_KEYWORD}})"

  # A reassignment's targets, which its begin consumes, read as its content
  # would read them. A capture is tokenized on its own text, so the rules
  # here see nothing after the last target: a first target named `scene` or
  # `branch` (`scene = "none"`) looks like a header there (`BEAT`), which
  # `LuauAccessPath` does not begin at, so `LuauVariable` reads the name.
  LuauReassignmentTargets:
    patterns:
      - { include: "#LuauCommaSeparator" }
      - { include: "#LuauAccessPath" }
      - { include: "#LuauExpression" }
      - { include: "#LuauVariable" }
      - { include: "#ExtraWhitespace" }
  # ----------------------------------------------------------------------------
  # Define (Syntactic Sugar for OOP Classes)
  # ----------------------------------------------------------------------------

  # At a statement's start in Luau code, a `define` that is not before its
  # name (`LUAU_DECLARATION_NAME_AHEAD`) and has no token after it that
  # carries a name on, which a narrative body's `LuauDefine` would still
  # open as a define without a name (`LUAU_DEFINE_WITHOUT_NAME_AHEAD`): the
  # name Luau reads, before a string or a table it is called with, a comment
  # or the line's end (`define "abc"`, `define {1, 2}`, `define --[[ c`
  # then `]] = 3`), so the `end` after it is its block's (#1328).
  # Pure-Luau bodies (`LuauBlockBody`) try it before their declarations; a
  # narrative body's statements reach `LuauDefine` first, and an expression
  # has `LuauDeclarationWordAsName`.
  # lookaround: before its name `LuauDefine` opens; ordering alone cannot
  # leave that to it, since this rule comes first so that it takes the rest
  # from `LuauDefine`, and both rules share `LuauDeclarations`' path into a
  # narrative body and a Luau one, so the Switch cannot be split by context
  # there.
  LuauDefineAsName:
    match: ({{WS}}*)(define)\b(?!{{LUAU_DECLARATION_NAME_AHEAD}}){{LUAU_DEFINE_WITHOUT_NAME_AHEAD}}
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauAccessPath" }

  # Where an expression stands, a declaration's word that is not before the
  # name it declares is the name Luau reads: `define` as `LuauDefineAsName`
  # reads it, and `store` or `const` before the line's end or a comment
  # (`return` then `store --[[ note`), which only a statement's start makes
  # a declaration (`LUAU_DECLARATION_NAME_HIDDEN_AHEAD`). `LuauExpression`
  # and `LuauVariableDefinitionValue` try it before their declarations; a
  # statement's `LuauControlBlock` reaches the declarations first (#1328).
  # lookaround: before its name `LuauDefine` or `LuauVariableDefinition`
  # opens, and before a token that carries a name on `LuauAccessPath` reads
  # the word; this rule comes first in an expression so that it takes the
  # rest from the declarations, which a statement shares through
  # `LuauDeclarations`, so ordering alone cannot decide it.
  LuauDeclarationWordAsName:
    match: ({{WS}}*)(define\b(?!{{LUAU_DECLARATION_NAME_AHEAD}}){{LUAU_DEFINE_WITHOUT_NAME_AHEAD}}|{{LUAU_STORE_OR_CONST}}{{LUAU_DECLARATION_NAME_HIDDEN_AHEAD}})
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauAccessPath" }
          - { include: "#LuauVariable" }

  # A define opens before its name, as a structural keyword's block does
  # (`LUAU_DECLARATION_NAME_AHEAD`); in a narrative body, also without a
  # name it can read (`LUAU_DEFINE_WITHOUT_NAME_AHEAD`), which its
  # validation reports. Anywhere else `define` is a name, as Luau reads it
  # (`return define`, `define()`, `{define = 4}`, `LuauDefineAsName`), and
  # the `end` after it is its block's (#1328).
  LuauDefine:
    tag: meta
    name: meta.function.luau
    begin: ({{WS}}*)(define)\b{{LUAU_DEFINE_AHEAD}}({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauDefineKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauDefineNameAndInheritance" }
      - { include: "#LuauFunctionDefinition" }
      - { include: "#LuauPropertyDefinition" }
      - { include: "#LuauMethodDefinition" }
      - { include: "#LuauBlockBody" }
      - { include: "#LuauStrayCloser" }
      - { include: "#LuauUnreadToken" }
    end: (?={{BEAT}})|({{WS}}*)(end)\b({{LUAU_END_TRAILING_COMMENTS}})?
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauEndKeyword" }
      3:
        patterns:
          - { include: "#LuauComment" }

  # ----------------------------------------------------------------------------
  # Method Definition (`name(args) ... end` shorthand inside `define`)
  #
  # Inside a `define` block, a line that looks like an identifier followed by
  # `(...)` and a body is a method definition — the `function` keyword is
  # implicit. This rule only appears inside `LuauDefine.patterns`, not at the
  # top level (where bare `name()` is a function-call expression statement).
  # The lookahead `(?={{WS}}*[(])` prevents this rule from swallowing property
  # names that don't have a parameter list.
  #
  # No pattern on the header's line can see the next one, so a call written
  # as a line of the body (`print("x")`) opens this rule too (I-1411). The
  # method ends before a code line at its header's indentation that is not
  # its `end` (the define's next member), and before an `end` written left of
  # the header, which is the define's (`LUAU_METHOD_LINE_AFTER_BODY`). So a
  # method its body leaves open (an `if` its `end` closes) ends there without
  # one and reports Luau's error for its function (I-1402), and one that
  # holds no line below it and takes no `end` is a call, a statement of the
  # define's body (`isDefineMethodCall` in
  # `compiler/utils/defineMethodCall.ts`). The end's back-reference is the
  # header's indentation, the begin's first capture.
  # ----------------------------------------------------------------------------

  # lookaround: the begin's `(?=[(])` leaves a name without a parameter list
  # to LuauPropertyDefinition and LuauBlockBody. The begin's `^`, or its
  # lookbehind over block comments that begin the line (`--[[c]] f()`,
  # comments being trivia, `LUAU_LINE_LEADING_BLOCK_COMMENTS`), or right
  # after the define header's `with` (`LUAU_DEFINE_HEADER_TO_WITH`), leaves a
  # `name(` after code on its line (`y = 1; print(1)`) to LuauBlockBody,
  # which reads it as a call statement of the define's body: `LuauDefine`
  # tries its patterns again at every position of its body, so without it a
  # call after a `;` opened this rule and took the define's `end` (I-1506).
  # Ordering cannot decide it: LuauBlockBody tried first reads every
  # header's `name(` as a call too, and tried after, as here, it is reached
  # only where this rule declines. Splitting the rule cannot either, since a
  # header and a call share their whole prefix; the define's end cannot
  # decide where a child opens; and the name pattern cannot see what came
  # before it on the line. Only the position is left, which the `^` and the
  # lookbehind read. A comment that spans lines still hides the header,
  # since a lookbehind sees no further back than its line. The end's
  # line-start
  # alternative leaves any line but a code line at the header's indentation
  # and an `end` left of it to the method's body (LuauBlockBody), and the
  # method's own `end` to the end's last alternative; those two lines are
  # the define's (its `end`, LuauPropertyDefinition, this rule again).
  LuauMethodDefinition:
    tag: meta
    name: meta.function.luau
    begin: (?:^|(?<=^{{LUAU_LINE_LEADING_BLOCK_COMMENTS}})|(?<={{LUAU_DEFINE_HEADER_TO_WITH}}))({{WS}}*)({{LUAU_IDENTIFIER}})({{WS}}*)(?=[(])
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauFunctionName" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauFunctionParameters" }
      - { include: "#LuauFunctionReturnMissingType" }
      - { include: "#LuauFunctionReturnType" }
      - { include: "#LuauBlockBody" }
      - { include: "#LuauStrayCloser" }
      - { include: "#LuauUnreadToken" }
    end: (?={{BEAT}})|{{LUAU_METHOD_LINE_AFTER_BODY}}|({{WS}}*)(end)\b
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauEndKeyword" }

  # lookaround: `(?<=define\b{{WS}}*)` keeps the name to the header, out of
  # the define's body, where `LuauBlockBody` reads statements that begin with
  # a name. `LuauDefine` tries its patterns again at every position of its
  # body, and textmate-grammar-tree has no `\G` to match only where the
  # begin ended. `LuauBlockBody` reads a name in the middle of a line, so it
  # would take the define's name if it were tried first, and a name rule
  # tried before it takes `x` and `if` from a body line that begins at
  # column 0 (fixture luau-declaration/define-column-0-body). The lookbehind
  # passes over block comments that close on the keyword's line
  # when the keyword begins its line (`LUAU_HEADER_COMMENTS`); the cost: one
  # that spans lines hides the name.
  LuauDefineNameAndInheritance:
    begin: (?<=define\b{{WS}}*|{{LUAU_HEADER_LINE_START}}define\b{{LUAU_HEADER_COMMENTS}})({{LUAU_IDENTIFIER}})
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauDefineName" }
    patterns:
      - { include: "#LuauInheritanceOperation" }
      - { include: "#ExtraWhitespace" }
    end: (?={{BEAT}})|({{WS}}*)(with)\b
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauWithKeyword" }

  LuauInheritanceOperation:
    match: ({{WS}}*)(as)\b({{WS}}*)($|{{LUAU_IDENTIFIER}})($|{{WS}}*)
    captures:
      1:
        # The space before `as` is a SEPARATOR (normalize to one
        # space), not ExtraWhitespace (collapse). Without this, the
        # formatter eats the space producing `companionas`.
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauAsKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      4:
        patterns:
          - { include: "#LuauDefineParentName" }
      5:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  LuauPropertyDefinition:
    # A define-body property: `<key> = <value>`. The key is either a plain
    # identifier (`name = …`) OR a Luau bracket-key (`["selector"] = …`,
    # `["$link"] = …`) so define bodies are table-faithful and can express
    # CSS-style selector keys / `$`-prefixed metadata keys (which aren't valid
    # identifiers). The bracket form reuses the table-constructor pieces
    # (LuauTableIndexDeclaration + LuauAssignmentOperation).
    # A key spelled as a reserved word or a modifier (`repeat = 3`,
    # `local = 3`, #1081) is read in the begin's last capture, so a define's
    # keys stay Sparkdown's own without any Luau binding taking a reserved
    # word; its `=` and value are the `LuauAssignmentOperation` after it. A
    # modifier before a lone `=` is that key, not a modifier.
    begin: ({{WS}}*)(?:({{LUAU_SCOPE_MODIFIERS}}|{{LUAU_ACCESS_MODIFIERS}}){{LUAU_NOT_BEFORE_LONE_EQUALS}})?({{WS}}*)({{LUAU_DEFINE_KEYWORD_KEY}})?(?=(?:{{LUAU_IDENTIFIER}}|\[[^\]\r\n]*\]){{WS}}*{{LUAU_ASSIGNMENT_OPERATORS}}|{{LUAU_AFTER_DEFINE_KEYWORD_KEY}})
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauScopeModifier" }
          - { include: "#LuauAccessModifier" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      4:
        patterns:
          - { include: "#LuauDefineKeywordKey" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauBracketKeyAssignment" }
      - { include: "#LuauVariableAssignment" }
      - { include: "#LuauAssignmentOperation" }
    applyEndPatternLast: true
    end: (?={{BEAT}})|(?=$|{{WS}}*(?!{{LUAU_COMMENT_START}}))

  # A bracket-keyed define-body property: `[<keyExpr>] = <value>`. The key is a
  # Luau expression in brackets (a string literal for selectors / `$`-keys, or
  # any computed key); the value is a normal assignment RHS. Used ONLY inside
  # LuauPropertyDefinition (define bodies) — general statements keep the strict
  # identifier-keyed LuauVariableAssignment.
  LuauBracketKeyAssignment:
    begin: (?=\[)
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauTableIndexDeclaration" }
      - { include: "#LuauAssignmentOperation" }
    end: (?={{BEAT}})|(?=$|{{WS}}|,)

  # ----------------------------------------------------------------------------
  # Style (structured UI — sparkle style block, struct-registry only)
  #
  # `style NAME [as PARENT] with <prop = value> ... end`. A top-level
  # structural keyword (parallel to `scene` / `branch`), NOT a `define`.
  # Lowers purely to a compile-time `style` struct in
  # `program.context.style.<name>` — no runtime table, no global.
  # Property names use CSS/sparkle spelling (hyphens allowed); values are
  # captured raw to end-of-line and interpreted later by the engine's
  # sparkle-style-transformer. `as PARENT` records style inheritance.
  # ----------------------------------------------------------------------------

  LuauStyle:
    tag: meta
    name: meta.style.luau
    # Only in its shape, the keyword and a name (`LUAU_STRUCTURE_NAME_AHEAD`):
    # anywhere else `style` is a name (#984).
    begin: ({{WS}}*)(style)({{WS}}+){{LUAU_STRUCTURE_NAME_AHEAD}}
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauStyleKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauStyleNameAndInheritance" }
      - { include: "#LuauStructBlockLine" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}})|({{WS}}*)(end)\b({{LUAU_END_TRAILING_COMMENTS}})?
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauEndKeyword" }
      3:
        patterns:
          - { include: "#LuauComment" }

  # `animation NAME [as PARENT] with <struct body> end` — static presentation
  # config (keyframes/timing), style-family (NOT reactive). Same struct-body
  # grammar as `style`, so values use the unquoted CSS vocabulary. Lowered to a
  # compile-time struct (context.animation.<name>) that implicitly `$extends`
  # the `animation` type for its $default timing. See lowerLuauStructDefine.
  LuauAnimation:
    tag: meta
    name: meta.animation.luau
    # Only in its shape, the keyword and a name (`LUAU_STRUCTURE_NAME_AHEAD`),
    # so `animation.fadein`, `animation(...)` and a bare `animation` stay
    # names; only a true `animation NAME with …` block starts.
    begin: ({{WS}}*)(animation)({{WS}}+){{LUAU_STRUCTURE_NAME_AHEAD}}
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauAnimationKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauAnimationThemeNameAndInheritance" }
      - { include: "#LuauStructBlockLine" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}})|({{WS}}*)(end)\b({{LUAU_END_TRAILING_COMMENTS}})?
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauEndKeyword" }
      3:
        patterns:
          - { include: "#LuauComment" }

  # `theme NAME [as PARENT] with <struct body> end` — static token config,
  # style-family. Same shape as `animation`.
  LuauTheme:
    tag: meta
    name: meta.theme.luau
    # See LuauAnimation: `theme.X` refs and the `theme(...)` selector
    # function stay names.
    begin: ({{WS}}*)(theme)({{WS}}+){{LUAU_STRUCTURE_NAME_AHEAD}}
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauThemeKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauAnimationThemeNameAndInheritance" }
      - { include: "#LuauStructBlockLine" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}})|({{WS}}*)(end)\b({{LUAU_END_TRAILING_COMMENTS}})?
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauEndKeyword" }
      3:
        patterns:
          - { include: "#LuauComment" }

  # `morph NAME [as PARENT] with <struct body> end` — how a layered image's
  # attribute states and layers move between poses (keyframes/timing/layers/
  # clips). Same shape as `animation`. It binds to images by the attribute
  # groups its keyframes name, not by a target. See lowerLuauStructDefine.
  LuauMorph:
    tag: meta
    name: meta.morph.luau
    # See LuauAnimation: `morph.blink` stays a reference.
    begin: ({{WS}}*)(morph)({{WS}}+){{LUAU_STRUCTURE_NAME_AHEAD}}
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauMorphKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauAnimationThemeNameAndInheritance" }
      - { include: "#LuauStructBlockLine" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}})|({{WS}}*)(end)\b({{LUAU_END_TRAILING_COMMENTS}})?
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauEndKeyword" }
      3:
        patterns:
          - { include: "#LuauComment" }



  # Name + optional `as PARENT`, ending at the `with` block opener.
  # Reuses LuauDefineName / LuauInheritanceOperation (→ LuauDefineParentName)
  # so the lowerer reads names through the same node names as `define`.
  #
  # lookaround: `(?<=style\b{{WS}}*)` keeps the name to the header. `LuauStyle`
  # takes the keyword and the whitespace after it in its begin, but it tries
  # its patterns again at every position of its body, and
  # textmate-grammar-tree has no `\G` to match only where the begin ended.
  # Without the lookbehind, tried first, the name rule takes a brace line at
  # column 0 that `LuauStructBlockLine` reads (`label { … }` in fixture
  # struct/column-0-brace-lines). Tried after the body-line rules, which
  # begin only at a line start, it still meets the body wherever
  # `LuauComment` has read the start of a line: `--[[ note ]] accidental` at
  # column 0 declares `accidental` as a second style (declarationAnnotator
  # test "a word after a comment in a block body declares nothing"). Nothing
  # but the text before it tells the header's name from that word. The
  # lookbehind passes over block comments that close on the keyword's line
  # when the keyword begins its line (`LUAU_HEADER_COMMENTS`); the cost: one
  # that spans lines hides the name.
  LuauStyleNameAndInheritance:
    begin: (?<=style\b{{WS}}*|{{LUAU_HEADER_LINE_START}}style\b{{LUAU_HEADER_COMMENTS}})({{LUAU_IDENTIFIER}})
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauDefineName" }
    patterns:
      - { include: "#LuauInheritanceOperation" }
      - { include: "#ExtraWhitespace" }
    end: (?={{BEAT}})|({{WS}}*)(with)\b
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauWithKeyword" }

  # Name + optional `as PARENT` for `animation`/`theme`/`morph` blocks
  # (variable-length lookbehind over the keywords). Mirrors
  # LuauStyleNameAndInheritance / LuauUINameAndInheritance so the lowerer reads
  # the name/parent through the same LuauDefineName / LuauDefineParentName node
  # names as `define`.
  #
  # lookaround: as in `LuauStyleNameAndInheritance` (fixture
  # struct/column-0-brace-lines has an `animation` brace line at column 0).
  LuauAnimationThemeNameAndInheritance:
    begin: (?<={{LUAU_PRESENTATION_DEFINITION_KEYWORDS}}{{WS}}*|{{LUAU_HEADER_LINE_START}}{{LUAU_PRESENTATION_DEFINITION_KEYWORDS}}{{LUAU_HEADER_COMMENTS}})({{LUAU_IDENTIFIER}})
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauDefineName" }
    patterns:
      - { include: "#LuauInheritanceOperation" }
      - { include: "#ExtraWhitespace" }
    end: (?={{BEAT}})|({{WS}}*)(with)\b
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauWithKeyword" }

  LuauStyleKeyword:
    tag: controlKeyword
    name: keyword.control.style.luau
    match: (style)\b

  LuauAnimationKeyword:
    tag: controlKeyword
    name: keyword.control.animation.luau
    match: (animation)\b

  LuauThemeKeyword:
    tag: controlKeyword
    name: keyword.control.theme.luau
    match: (theme)\b

  LuauMorphKeyword:
    tag: controlKeyword
    name: keyword.control.morph.luau
    match: (morph)\b

  LuauStylePropertyName:
    tag: attributeName
    name: entity.other.attribute-name.style.luau
    match: ({{STYLE_PROPERTY_NAME}})

  LuauStyleAssignmentMark:
    tag: separator
    name: keyword.operator.assignment.style.luau
    match: (=)

  LuauStylePropertyValue:
    tag: string
    name: string.unquoted.style.luau
    match: ([^\n]*)


  # A struct value the literal rules alone do not take: an unquoted value, or a
  # literal followed by a comment. The value ends where a trailing
  # comment begins (`_STRUCT_VALUE_THEN_COMMENT_`), so the comment is the
  # value node's sibling and the lowerers read the value node whole.
  StylingValue:
    match: "{{_STRUCT_VALUE_THEN_COMMENT_}}"
    captures:
      1:
        patterns:
          - { include: "#NumericFieldValue" }
          - { include: "#BooleanFieldValue" }
          - { include: "#StringFieldValue" }
      2:
        patterns:
          - { include: "#LuauComment" }
      3:
        patterns:
          - { include: "#LuauStructBlockValueComment" }
      4:
        patterns:
          - { include: "#StylingValueContent" }
      5:
        patterns:
          - { include: "#LuauComment" }
      6:
        patterns:
          - { include: "#LuauStructBlockValueComment" }
      7:
        patterns:
          - { include: "#EndOfLine" }

  # The text of a `StylingValue` that is not a lone literal. A quoted run in it
  # is read whole, as the value's boundary reads it, so a `--` inside the
  # quotes is not colored as a comment. It holds no comment: a comment after
  # text begins after whitespace, which `StylingValue` splits off, so a `--`
  # with no whitespace before it (`gap = --gap`, `Arial 1--display`) is part
  # of the value, which the lowerers read whole (`structValueNode`). A `--`
  # right after a lone literal (`gap = 1--x`) is `StylingValue`'s literal
  # branch and stays a comment (GRAMMAR.md §11.7).
  StylingValueContent:
    match: (.+)
    captures:
      1:
        patterns:
          - { include: "#InlinePropQuotedValue" }
          - { include: "#StylingValuePart" }
          - { include: "#StylingStringIdentifier" }
          - { include: "#UnquotedChar" }

  NumericFieldValue:
    tag: number
    name: constant.numeric.sd
    match: ([-]?(?:\d*[.])?\d+|Infinity|NaN)({{WS}}*)$
    captures:
      1:
        patterns:
          - { include: "#NumericLiteral" }
      2:
        patterns:
          - { include: "#EndOfLine" }

  BooleanFieldValue:
    tag: bool
    name: constant.language.boolean.true.sd
    match: (true|false)({{WS}}*)$
    captures:
      1:
        patterns:
          - { include: "#BooleanLiteral" }
      2:
        patterns:
          - { include: "#EndOfLine" }

  StringFieldValue:
    tag: string
    name: string.quoted.double.sd
    match: (["])({{DOUBLE_QUOTED_CHAR}}*)(["])({{WS}}*)$
    captures:
      1:
        patterns:
          - { include: "#PunctuationStringOpen" }
      2:
        patterns:
          - { include: "#PlainStringContent" }
      3:
        patterns:
          - { include: "#PunctuationStringClose" }
      4:
        patterns:
          - { include: "#EndOfLine" }

  # A double-quoted sparkle content string that contains at least one `{expr}`
  # interpolation or `{{fn}}` call shorthand (reactive content, spec §6).
  # Listed BEFORE StringFieldValue at every value site so PLAIN
  # (non-interpolated) strings fall through to StringFieldValue unchanged —
  # its highlighting tree stays byte-identical. Same
  # `string`/`string.quoted.double.sd` scope so the color matches; each
  # `{expr}` reuses the existing LuauInterpolatedStringExpression node (so it
  # colors like backtick interpolation AND is the named node the reactive
  # lowerer reads to build bindings). The begin-lookahead requires an
  # UNESCAPED `{` (skipping `\{`-style escapes) so a string with only escaped
  # braces is left to plain StringFieldValue. Literal braces are written
  # `\{` / `\}` (D3 superseded by #223 — `{{` now means a function call).
  StringFieldValueInterpolated:
    tag: string
    name: string.quoted.double.sd
    begin: (["])(?=(?:[^"{\\\r\n]|\\.)*\{)
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationStringOpen" }
    patterns:
      - { include: "#LuauFunctionCallShorthand" }
      - { include: "#LuauInterpolatedStringExpression" }
      - { include: "#StringEscape" }
      - { include: "#SparkleRichTextTag" }
      - { include: "#SparkleRichTextTagUnknown" }
      - { include: "#Color" }
      - { include: "#StringCharacter" }
    end: (["])({{EOPL}})
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationStringClose" }
      2:
        patterns:
          - { include: "#EndOfLine" }

  # Bounded as `StylingValue` is; `UnquotedString` is the value node.
  UnquotedStringFieldValue:
    match: "{{_STRUCT_VALUE_THEN_COMMENT_}}"
    captures:
      1:
        patterns:
          - { include: "#NumericFieldValue" }
          - { include: "#BooleanFieldValue" }
          - { include: "#StringFieldValue" }
      2:
        patterns:
          - { include: "#LuauComment" }
      3:
        patterns:
          - { include: "#LuauStructBlockValueComment" }
      4:
        patterns:
          - { include: "#UnquotedString" }
      5:
        patterns:
          - { include: "#LuauComment" }
      6:
        patterns:
          - { include: "#LuauStructBlockValueComment" }
      7:
        patterns:
          - { include: "#EndOfLine" }

  StylingDeclarationScalarPropertyName:
    match: ({{STRICT_PROPERTY_IDENTIFIER}})
    captures:
      1:
        patterns:
          - { include: "#DeclarationScalarPropertyIndex" }
          - { include: "#DeclarationScalarPropertyQuotedKey" }
          - { include: "#DeclarationScalarPropertyKey" }

  DeclarationScalarPropertyIndex:
    tag: number
    name: constant.numeric.integer.sd
    match: ({{INTEGER}})

  SelectorPropertyNamePart:
    patterns:
      - { include: "#ParenPropertyIdentifierString" }
      - { include: "#BracketPropertyIdentifierString" }
      - { include: "#BracePropertyIdentifierString" }
      - { include: "#UnitValue" }
      - { include: "#NumericLiteral" }
      - { include: "#BooleanLiteral" }
      - { include: "#StringLiteral" }
      - { include: "#SelectorOperator" }
      - { include: "#RecursiveSelectorFunction" }
      - { include: "#SimpleSelectorFunction" }
      - { include: "#StyleAttribute" }
      - { include: "#EventAttribute" }
      - { include: "#LabelAttribute" }
      - { include: "#Separator" }

  ComponentName:
    patterns:
      - { include: "#BuiltinComponentName" }
      - { include: "#CustomComponentName" }
      - { include: "#FunctionCallParameters" }

  # Ordered LONGEST-FIRST: regex alternation takes the first branch that
  # matches, so `table` ahead of `table_header` would leave the longer name
  # permanently unmatched. builtinNamesHighlighted.test.ts pins both that
  # ordering and the fact that every name in the engine's tag tables appears
  # here — this list had already drifted out of the generated JSON once, and a
  # regeneration silently reverted the editor to a stale set.
  BuiltinComponentName:
    tag: definitionKeyword
    name: keyword.other.component.builtin.name.sd
    # Inline rather than a `variables:` array: an array adds a closing `\b`,
    # which would stop `h10` highlighting its `h1` prefix, and
    # spark-web-player's builtinNamesHighlighted test reads this alternation
    # from the generated grammar.
    # eslint-disable-next-line sparkdown-grammar/no-handwritten-alternation
    match: \b(ordered_list|preformatted|table_footer|table_header|table_body|paragraph|table_row|checkbox|citation|dropdown|emphasis|fieldset|progress|scroller|textarea|article|caption|divider|foldout|picture|section|button|figure|footer|header|legend|option|slider|stroke|strong|switch|block|image|input|label|modal|quote|radio|small|table|cell|code|form|head|item|link|list|mask|span|text|kbd|sub|sup|h1|h2|h3|h4|h5|h6)(?!(?:[-_\p{L}][0-9_\p{L}-]*\b))

  CustomComponentName:
    tag: className
    name: entity.name.type.class.view.sd
    match: ({{IDENTIFIER}})

  OperatorPrefixedPropertyName:
    begin: (?=\S)(?!{{IDENTIFIER}})(?!{{PROPERTY_NAME_TERMINATOR}})
    patterns:
      - { include: "#LuauComment" }
      - { include: "#SelectorPropertyNamePart" }
      - { include: "#ComponentName" }
      - { include: "#IllegalChar" }
    end: (?=$|{{EOPL}}|{{WS}}*{{PROPERTY_NAME_TERMINATOR}})

  PropertyName:
    tag: propertyName
    name: variable.other.property.sd
    match: ({{IDENTIFIER}})(?![(])

  ParenPropertyIdentifierString:
    brackets: true
    begin: ([(])({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationParenOpen" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#SelectorPropertyNamePart" }
    end: $|({{WS}}*)([)])
    endCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#PunctuationParenClose" }

  BracketPropertyIdentifierString:
    brackets: true
    begin: (\[)({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationBracketOpen" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#SelectorPropertyNamePart" }
    end: $|({{WS}}*)(\])
    endCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#PunctuationBracketClose" }

  BracePropertyIdentifierString:
    brackets: true
    begin: (\{)({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationBraceOpen" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#SelectorPropertyNamePart" }
    end: $|({{WS}}*)(\})
    endCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#PunctuationBraceClose" }

  AssignEqualOperator:
    match: ({{WS}}*)([=])({{WS}}*)
    captures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalSeparator" }
      2:
        patterns:
          - { include: "#EqualOperator" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalSeparator" }

  UnitValue:
    match: ([-]?(?:\d*[.])?\d+)([%]|[a-zA-Z]+)
    captures:
      1:
        tag: number
        name: constant.numeric.amount.sd
      2:
        tag: number
        name: constant.numeric.unit.sd

  Ratio:
    match: ({{NUMBER}})({{WS}}*)([/])({{WS}}*)({{NUMBER}})
    captures:
      1:
        patterns:
          - { include: "#NumericLiteral" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
      3:
        patterns:
          - { include: "#CalcOperator" }
      4:
        patterns:
          - { include: "#ExtraWhitespace" }
      5:
        patterns:
          - { include: "#NumericLiteral" }

  CalcOperator:
    tag: keyword
    name: keyword.other.calc.operator.sd
    match: ([+]|[-]|[*]|[/])

  StylingFunction:
    begin: ({{IDENTIFIER}})({{WS}}*)(?=[(])
    beginCaptures:
      1:
        patterns:
          - { include: "#StylingFunctionName" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#StylingFunctionParameters" }
    applyEndPatternLast: true
    end: (?=$|.)

  StylingFunctionName:
    # function(name) → functionName color (yellow), matching pre-Luau-port.
    # NOT function(variableName): that tag is mapped to the parameterName color
    # for Luau function parameters, which would recolor `calc(…)` etc.
    tag: function(name)
    name: entity.name.function.sd
    match: ({{IDENTIFIER}})

  StylingFunctionParameters:
    brackets: true
    begin: ([(])({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationParenOpen" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
    # No comment, as in `StylingValueContent`: these parameters are part of a
    # value's text, from which `StylingValue` has already split a comment
    # after whitespace, so a `--` here (`var(--gap)`) is the argument and the
    # `)` after it closes the function.
    patterns:
      - { include: "#CalcOperator" }
      - { include: "#StylingValuePart" }
      - { include: "#ParameterStringIdentifier" }
      - { include: "#UnquotedChar" }
    end: $|({{WS}}*)([)])
    endCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#PunctuationParenClose" }

  StylingValuePart:
    patterns:
      - { include: "#Separator" }
      - { include: "#Color" }
      - { include: "#Ratio" }
      - { include: "#UnitValue" }
      - { include: "#NumericLiteral" }
      - { include: "#PunctuationComma" }
      - { include: "#StylingFunction" }
      # `image.foo` / `font.foo` define-references: color the namespace as a
      # type and the member as a variable (matches pre-Luau-port styling
      # values). Must come before StylingStringIdentifier swallows it as a
      # plain unquoted string. StylingFunction above still wins for `calc(…)`.
      - { include: "#StylingAccessPath" }

  StylingStringIdentifier:
    tag: string
    name: string.unquoted.identifier.sd
    match: ({{IDENTIFIER}})

  UnquotedChar:
    tag: string
    name: string.unquoted.char.sd
    match: (.)

  # Access-path coloring for styling values (`image.foo`, `font.foo`,
  # `theme.colors.bg`). Ported from the pre-Luau-port grammar so define
  # references keep their typeName/variableName/propertyName coloring inside
  # struct-body values. Begin requires `IDENT.` so bare identifiers fall
  # through to StylingStringIdentifier instead.
  StylingAccessPath:
    begin: (?={{IDENTIFIER}}[.])
    patterns:
      - { include: "#LuauComment" }
      - { include: "#StylingAccessPart" }
    end: (?=$)|(?!{{IDENTIFIER}}|[.])

  StylingAccessPart:
    emit: true
    patterns:
      - { include: "#PropertyAccessor" }
      - { include: "#NamespaceAccessor" }
      - { include: "#VariableName" }
      - { include: "#PunctuationAccessor" }

  NamespaceAccessor:
    match: ({{IDENTIFIER}})([.])($|{{IDENTIFIER}})(?![(])
    captures:
      1:
        patterns:
          - { include: "#TypeName" }
      2:
        patterns:
          - { include: "#PunctuationAccessor" }
      3:
        patterns:
          - { include: "#VariableName" }

  PropertyAccessor:
    match: ([.])({{IDENTIFIER}})(?![(])
    captures:
      1:
        patterns:
          - { include: "#PunctuationAccessor" }
      2:
        patterns:
          - { include: "#PropertyName" }

  TypeName:
    tag: typeName
    name: support.type.sd
    match: ({{IDENTIFIER}})

  VariableName:
    # constant(variableName) → constantVariableName color (#4FC1FF cyan),
    # matching pre-Luau-port styling access-path members. The plain
    # `variableName` color was repurposed to #9CDCFE during the port (with
    # #4FC1FF moved to constantVariableName); this keeps UI refs cyan without
    # reverting the global var/const palette split.
    tag: constant(variableName)
    name: variable.other.constant.sd
    match: ({{IDENTIFIER}})(?![(])

  NumericLiteral:
    patterns:
      - { include: "#NumberLiteral" }
      - { include: "#NumericConstantLiteral" }

  BooleanLiteral:
    patterns:
      - { include: "#BooleanTrue" }
      - { include: "#BooleanFalse" }

  PunctuationStringOpen:
    match: (["])
    tag: string
    name: punctuation.definition.string.begin.sd

  PlainStringContent:
    match: ({{DOUBLE_QUOTED_CHAR}}*?)(?=$|")
    captures:
      1:
        patterns:
          - { include: "#StringEscape" }
          - { include: "#SparkleRichTextTag" }
          - { include: "#SparkleRichTextTagUnknown" }
          - { include: "#Color" }
          - { include: "#StringCharacter" }

  PunctuationStringClose:
    match: (["])
    tag: string
    name: punctuation.definition.string.end.sd

  UnquotedString:
    tag: string
    name: string.unquoted.sd
    match: (.+)

  DeclarationScalarPropertyQuotedKey:
    tag: string
    name: string.quoted.key.sd
    match: ({{QUOTED_STRING}})

  DeclarationScalarPropertyKey:
    tag: propertyName
    name: variable.other.property.define.sd
    match: ({{IDENTIFIER}})

  InvalidSelectorPropertyName:
    tag: invalid
    name: invalid.illegal.unknown-statement.sd
    begin: (?=\S)(?!{{PROPERTY_NAME_TERMINATOR}})
    patterns:
      - { include: "#LuauComment" }
      - { include: "#SelectorPropertyNamePart" }
      - { include: "#ComponentName" }
      - { include: "#IllegalChar" }
    end: (?=$|{{EOPL}}|{{WS}}*{{PROPERTY_NAME_TERMINATOR}})

  SelectorOperator:
    tag: keyword
    name: keyword.other.selector.operator.sd
    match: ([>]|[+]|[~]|[*]|[&]|[\^])

  RecursiveSelectorFunction:
    begin: ([@])({{SELECTOR_FUNCTION_NAMES}})(?=[(])
    beginCaptures:
      1:
        patterns:
          - { include: "#EventAttributeOperator" }
      2:
        patterns:
          - { include: "#EventAttributeName" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#RecursiveSelectorFunctionParameters" }
    applyEndPatternLast: true
    end: (?=$|.)

  SimpleSelectorFunction:
    begin: ([@])({{IDENTIFIER}})?(?=[(])
    beginCaptures:
      1:
        patterns:
          - { include: "#EventAttributeOperator" }
      2:
        patterns:
          - { include: "#EventAttributeName" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#SimpleSelectorFunctionParameters" }
    applyEndPatternLast: true
    end: (?=$|.)

  StyleAttribute:
    emit: true
    patterns:
      - { include: "#AssignedBracedStyleAttribute" }
      - { include: "#AssignedQuotedStyleAttribute" }
      - { include: "#AssignedUnquotedStyleAttribute" }
      - { include: "#UnassignedStyleAttribute" }

  EventAttribute:
    emit: true
    patterns:
      - { include: "#AssignedBracedEventAttribute" }
      - { include: "#AssignedQuotedEventAttribute" }
      - { include: "#AssignedUnquotedEventAttribute" }
      - { include: "#UnassignedEventAttribute" }

  LabelAttribute:
    emit: true
    patterns:
      - { include: "#StringLiteral" }

  Separator:
    tag: definition(content)
    name: markup.raw.whitespace.separator.sd
    match: ({{WS}}+)

  FunctionCallParameters:
    brackets: true
    begin: ([(])({{WS}}*)
    beginCaptures:
      1:
        tag: keyword
        name: punctuation.definition.template-expression.begin.sd
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#Separator" }
      - { include: "#PunctuationComma" }
      - { include: "#Parameter" }
    end: $|({{WS}}*)([)])
    endCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        tag: keyword
        name: punctuation.definition.template-expression.end.sd

  OptionalSeparator:
    tag: definition(content)
    name: markup.raw.whitespace.separator.optional.sd
    match: ({{WS}}*)

  EqualOperator:
    tag: updateOperator
    name: keyword.operator.assignment.sd
    match: ([=])

  ParameterStringIdentifier:
    tag: string
    name: string.unquoted.identifier.sd
    match: ({{IDENTIFIER}})

  PunctuationComma:
    tag: operator
    name: keyword.operator.comma.sd
    match: ([,])

  NumberLiteral:
    tag: number
    name: constant.numeric.sd
    match: ([-]?(?:\d*[.])?\d+)

  NumericConstantLiteral:
    patterns:
      - { include: "#Infinity" }
      - { include: "#NaN" }

  BooleanTrue:
    tag: bool
    name: constant.language.boolean.true.sd
    match: "{{BEFORE_KEYWORD}}true{{AFTER_KEYWORD}}"

  BooleanFalse:
    tag: bool
    name: constant.language.boolean.false.sd
    match: "{{BEFORE_KEYWORD}}false{{AFTER_KEYWORD}}"

  StringEscape:
    match: (\\)(.)
    captures:
      1:
        tag: definition(escape)
        name: constant.character.escape.sd
      2:
        tag: content
        name: markup.raw.whitespace.sd

  StringCharacter:
    tag: content
    name: markup.raw.whitespace.sd
    match: (.)

  EventAttributeOperator:
    tag: function(name)
    name: entity.name.function.attribute.name.view.sd
    match: ([@])

  EventAttributeName:
    tag: function(name)
    name: entity.name.function.attribute.name.view.sd
    match: (.+)

  RecursiveSelectorFunctionParameters:
    brackets: true
    begin: ([(])({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationParenOpen" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#SelectorPropertyNamePart" }
      - { include: "#ComponentName" }
      - { include: "#IllegalChar" }
    end: $|({{WS}}*)([)])
    endCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#PunctuationParenClose" }

  SimpleSelectorFunctionParameters:
    brackets: true
    begin: ([(])({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationParenOpen" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#SelectorPropertyNamePart" }
      - { include: "#ParameterStringIdentifier" }
      - { include: "#IllegalChar" }
    end: $|({{WS}}*)([)])
    endCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#PunctuationParenClose" }

  AssignedBracedStyleAttribute:
    begin: ([#])({{IDENTIFIER}})?({{COMPARISON_OPERATOR}})?([=])([{])
    beginCaptures:
      1:
        patterns:
          - { include: "#StyleAttributeOperator" }
      2:
        patterns:
          - { include: "#StyleAttributeName" }
      3:
        patterns:
          - { include: "#ComparisonOperator" }
      4:
        patterns:
          - { include: "#EqualOperator" }
      5:
        patterns:
          - { include: "#PunctuationBraceOpen" }
    patterns:
      - { include: "#LuauComment" }
    end: ([}])
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationBraceClose" }

  AssignedQuotedStyleAttribute:
    tag: string
    name: string.quoted.double.view.sd
    begin: ([#])({{IDENTIFIER}})?({{COMPARISON_OPERATOR}})?([=])(["])
    beginCaptures:
      1:
        patterns:
          - { include: "#StyleAttributeOperator" }
      2:
        patterns:
          - { include: "#StyleAttributeName" }
      3:
        patterns:
          - { include: "#ComparisonOperator" }
      4:
        patterns:
          - { include: "#EqualOperator" }
      5:
        patterns:
          - { include: "#PunctuationStringOpen" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#StringContent" }
    end: $|(["])
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationStringClose" }

  AssignedUnquotedStyleAttribute:
    begin: ([#])({{IDENTIFIER}})?({{COMPARISON_OPERATOR}})?([=])
    beginCaptures:
      1:
        patterns:
          - { include: "#StyleAttributeOperator" }
      2:
        patterns:
          - { include: "#StyleAttributeName" }
      3:
        patterns:
          - { include: "#ComparisonOperator" }
      4:
        patterns:
          - { include: "#EqualOperator" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#UnquotedStyleAttributeValue" }
    end: (?={{UNQUOTED_STRING_TERMINATOR}})

  UnassignedStyleAttribute:
    match: ([#])({{IDENTIFIER}})?
    captures:
      1:
        patterns:
          - { include: "#StyleAttributeOperator" }
      2:
        patterns:
          - { include: "#StyleAttributeName" }

  AssignedBracedEventAttribute:
    begin: ([@])({{IDENTIFIER}})?({{COMPARISON_OPERATOR}})?([=])([{])
    beginCaptures:
      1:
        patterns:
          - { include: "#EventAttributeOperator" }
      2:
        patterns:
          - { include: "#EventAttributeName" }
      3:
        patterns:
          - { include: "#ComparisonOperator" }
      4:
        patterns:
          - { include: "#EqualOperator" }
      5:
        patterns:
          - { include: "#PunctuationBraceOpen" }
    patterns:
      - { include: "#LuauComment" }
    end: ([}])
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationBraceClose" }

  AssignedQuotedEventAttribute:
    tag: string
    name: string.quoted.double.view.sd
    begin: ([@])({{IDENTIFIER}})?({{COMPARISON_OPERATOR}})?([=])(["])
    beginCaptures:
      1:
        patterns:
          - { include: "#EventAttributeOperator" }
      2:
        patterns:
          - { include: "#EventAttributeName" }
      3:
        patterns:
          - { include: "#ComparisonOperator" }
      4:
        patterns:
          - { include: "#EqualOperator" }
      5:
        patterns:
          - { include: "#PunctuationStringOpen" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#StringContent" }
    end: $|(["])
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationStringClose" }

  AssignedUnquotedEventAttribute:
    begin: ([@])({{IDENTIFIER}})?({{COMPARISON_OPERATOR}})?([=])
    beginCaptures:
      1:
        patterns:
          - { include: "#EventAttributeOperator" }
      2:
        patterns:
          - { include: "#LuauComment" }
          - { include: "#EventAttributeName" }
      3:
        patterns:
          - { include: "#ComparisonOperator" }
      4:
        patterns:
          - { include: "#EqualOperator" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#UnquotedEventAttributeValue" }
    end: (?={{UNQUOTED_STRING_TERMINATOR}})

  UnassignedEventAttribute:
    match: ([@])({{IDENTIFIER}})?
    captures:
      1:
        patterns:
          - { include: "#EventAttributeOperator" }
      2:
        patterns:
          - { include: "#EventAttributeName" }

  StringLiteral:
    tag: string
    name: string.quoted.double.sd
    begin: (["])
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationStringOpen" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#StringContent" }
    end: (["])|($)
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationStringClose" }

  Parameter:
    tag: meta
    name: meta.parameter.sd
    begin: (?=.+$)
    patterns:
      - { include: "#LuauComment" }
    end: $|(?={{WS}}*(?:[)]|[,]))

  Infinity:
    tag: atom
    name: constant.language.infinity.sd
    match: "{{BEFORE_KEYWORD}}Infinity{{AFTER_KEYWORD}}"

  NaN:
    tag: atom
    name: constant.language.nan.sd
    match: "{{BEFORE_KEYWORD}}NaN{{AFTER_KEYWORD}}"

  StyleAttributeOperator:
    # constant(variableName) → #4FC1FF cyan, matching pre-Luau-port (see VariableName).
    tag: constant(variableName)
    name: variable.other.constant.attribute.style.sd
    match: ([#])

  StyleAttributeName:
    tag: constant(variableName)
    name: variable.other.constant.attribute.style.sd
    match: (.+)

  ComparisonOperator:
    tag: updateOperator
    name: keyword.operator.comparison.sd
    match: ({{COMPARISON_OPERATOR}})

  StringContent:
    match: ({{DOUBLE_QUOTED_CHAR}}*?)(?=$|")
    captures:
      1:
        patterns:
          - { include: "#StringEscape" }
          - { include: "#LuauFunctionCallShorthand" }
          - { include: "#LuauInterpolatedStringExpression" }
          - { include: "#StringCharacter" }

  UnquotedStyleAttributeValue:
    tag: string
    name: string.unquoted.attribute.value.sd
    match: ((?:(?!{{UNQUOTED_STRING_TERMINATOR}}).)+)

  UnquotedEventAttributeValue:
    match: ((?:(?!{{UNQUOTED_STRING_TERMINATOR}}).)+)
    captures:
      1:
        patterns:
          - { include: "#DivertTarget" }






  # `from` / `to` / a percentage standing alone as a container header key: the
  # CSS `@keyframes` selector spelling for one keyframe's position inside a
  # `keyframes { … }` block. The lookarounds keep it to a key that is ENTIRELY a
  # position, so `from_left` and `duration` fall through to the ordinary
  # property patterns.
  LuauKeyframeSelector:
    tag: constant(variableName)
    name: constant.other.keyframe-selector.sd
    match: (?<![\w.%-])(?:from|to|[-+]?(?:\d*[.])?\d+%)(?![\w.%-])



  # Inline element attributes (spec §4.5): trailing `@event=handler` bindings on
  # an element line. `#prop=value` follows in a later increment. Each event's
  # handler is a Luau expression (a bare function name or a call); inline
  # closures `@e={ … }` come later.
  LuauElementAttribute:
    patterns:
      # Consume inter-attribute whitespace (non-zero-width, so it isn't flagged
      # by the zero-width-include guard and doesn't halt capture tokenization on
      # an unrecognized space between two attributes).
      - { include: "#RequiredWhitespace" }
      - { include: "#LuauComment" }
      - { include: "#SparkdownLineComment" }
      - { include: "#LuauEventAttribute" }
      - { include: "#LuauPropAttribute" }

  # A BARE `@e=name` handler. The lookahead lists everything that can legally
  # follow the name: another attribute, a trailing comment, end-of-line — and a
  # QUOTE, because `button @click=on_click "Press"` is the element's content
  # string. Without the quote, this rule declined, `#LuauExpression` took over,
  # and Luau's adjacency-call syntax (`f "str"`) read the label as the handler's
  # ARGUMENT: a blank button whose handler received the string instead of the
  # event, with no diagnostic — the corruption was purely positional, since
  # `button "Press" @click=on_click` was always correct.
  LuauSparkleEventHandlerName:
    tag: heading
    name: keyword.control.divert.path.sd
    match: ((?:[_\p{L}][0-9_\p{L}]*\b))(?=(?:[^\S\n\r])*(?:[@#"']|--|//(?=$|[^\S\n\r])|$))

  LuauEventAttribute:
    begin: ([@])({{LUAU_WORD}})({{WS}}*)([=])({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#EventAttributeOperator" }
      2:
        patterns:
          - { include: "#EventAttributeName" }
      4:
        patterns:
          - { include: "#EqualOperator" }
    patterns:
      - { include: "#LuauSparkleHandlerClosure" }
      - { include: "#LuauSparkleEventHandlerName" }
      - { include: "#LuauExpression" }
    # A whitespace-preceded quote closes the attribute: it starts the element's
    # CONTENT, not more handler. Safe for `@click=f(1, "x")` — the argument list
    # is its own begin/end scope (`LuauFunctionCallParameters`), and this end is
    # never tested while a child scope is open.
    end: (?=$|{{WS}}+["'@#])

  LuauSparkleHandlerClosure:
    brackets: true
    begin: ([{])
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationBraceOpen" }
    patterns:
      - { include: "#LuauBlockBody" }
      - { include: "#LuauStrayCloser" }
      - { include: "#LuauUnreadToken" }
    end: ([}])|(?={{SPARKLE_BLOCK_BAIL}})
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationBraceClose" }

  # Inline style/attribute prop (spec §4.2/§4.4): `#prop=value`, e.g.
  # `row #gap=16`, `#background-color={team_color}`, `image #src="a.png"`. The
  # value is `{expr}` (reactive — reuses LuauInterpolatedStringExpression so
  # `{…}` is interpolation, NOT a Luau table), a quoted string, or an unquoted
  # literal (number / keyword / `#hex`). Prop names allow hyphens. Value rules
  # carry no `{{EOPL}}` (the value is mid-line; more attrs may follow).
  # The name capture admits a leading `--` so an inline CUSTOM PROPERTY
  # (`#--my-var=4`) parses. No pattern used to, so `#--…` matched nothing here,
  # `LuauComment` claimed the rest of the line, and the prop AND every attribute
  # after it vanished with zero diagnostics — while the unrecognized-prop
  # warning was actively recommending that spelling. The existing "a `--custom`
  # property does not warn" test passed vacuously: a swallowed line produces no
  # warning either.
  LuauPropAttribute:
    begin: ([#])((?:[-]{2})?{{LUAU_WORD}}(?:[-]{{LUAU_WORD}})*)({{WS}}*)([=])({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#StyleAttributeOperator" }
      2:
        patterns:
          - { include: "#StyleAttributeName" }
      4:
        patterns:
          - { include: "#EqualOperator" }
    patterns:
      - { include: "#LuauFunctionCallShorthand" }
      - { include: "#LuauInterpolatedStringExpression" }
      # A quoted value with a `{expr}` interpolates like display content
      # (`#label="HP: {hp}"`), tried before the plain quoted value so a string
      # with only literal text (or `\{`/`\}` escapes) still falls through to
      # InlinePropQuotedValue.
      - { include: "#LuauElementContentStringInterpolated" }
      - { include: "#InlinePropQuotedValue" }
      - { include: "#InlinePropLiteralValue" }
    end: (?=$|{{WS}}+[@#])

  InlinePropQuotedValue:
    tag: string
    name: string.quoted.double.sd
    match: (["])({{DOUBLE_QUOTED_CHAR}}*)(["])
    captures:
      1:
        patterns:
          - { include: "#PunctuationStringOpen" }
      2:
        patterns:
          - { include: "#PlainStringContent" }
      3:
        patterns:
          - { include: "#PunctuationStringClose" }

  InlinePropLiteralValue:
    match: ([^\s]+)
    captures:
      1:
        patterns:
          - { include: "#InlinePropNumericValue" }
          - { include: "#InlinePropBooleanValue" }
          - { include: "#InlinePropWordValue" }

  InlinePropNumericValue:
    # The enclosing capture is exactly one non-whitespace literal. Anchor
    # its end so a unit such as 16px remains a whole word value.
    match: -?\d+(?:\.\d+)?$
    tag: number
    name: constant.numeric.sd

  InlinePropBooleanValue:
    match: (?:true|false)$
    tag: bool
    name: constant.language.boolean.sd

  InlinePropWordValue:
    match: ([^\s]+)
    captures:
      1:
        patterns:
          - { include: "#Color" }
          - { include: "#UnquotedString" }

  # Adjacency content string for inline element positions where a class or
  # attribute may follow on the same line (e.g. `button primary "Use" @click=x`).
  # Unlike StringFieldValue(Interpolated) these end at the closing quote rather
  # than requiring end-of-property-line, so a trailing attribute doesn't break
  # the match. Same scope/highlighting as StringFieldValue; the interpolated
  # variant (a real `{expr}` present) is tried first.
  LuauElementContentStringInterpolated:
    tag: string
    name: string.quoted.double.sd
    begin: (["])(?=(?:[^"{\\\r\n]|\\.)*\{)
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationStringOpen" }
    patterns:
      - { include: "#LuauFunctionCallShorthand" }
      - { include: "#LuauInterpolatedStringExpression" }
      - { include: "#StringEscape" }
      - { include: "#SparkleRichTextTag" }
      - { include: "#SparkleRichTextTagUnknown" }
      - { include: "#Color" }
      - { include: "#StringCharacter" }
    end: (["])
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationStringClose" }

  LuauElementContentStringPlain:
    tag: string
    name: string.quoted.double.sd
    match: (["])({{DOUBLE_QUOTED_CHAR}}*)(["])
    captures:
      1:
        patterns:
          - { include: "#PunctuationStringOpen" }
      2:
        patterns:
          - { include: "#PlainStringContent" }
      3:
        patterns:
          - { include: "#PunctuationStringClose" }



  LuauStructBlockLine:
    # lookaround: LuauEndKeyword and BEAT must remain outside this line wrapper;
    # reordering entries cannot prevent its zero-width begin from claiming them.
    # Splitting entries or changing the parent's end cannot identify a blank
    # line before this wrapper opens; the second assertion leaves it to Newline.
    begin: ^(?!{{STRUCT_BLOCK_BAIL}})(?=\S|{{WS}}+\S)
    patterns:
      - { include: "#LuauStructStrayBlockClose" }
      - { include: "#LuauStructBlockEntries" }
    end: $|(?={{STRUCT_BLOCK_BAIL}})

  # Everything an entry position inside a block (or after one on a block line)
  # can hold. Every character is tiled: a bare list value takes anything the
  # rules before it leave (GRAMMAR.md §17).
  LuauStructBlockEntries:
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauStructBlockSlashComment" }
      - { include: "#Whitespace" }
      - { include: "#Newline" }
      - { include: "#LuauStructBlockSeparator" }
      - { include: "#LuauStructBlockTrailingComma" }
      - { include: "#LuauStructBlockEntryComma" }
      # Invalid colon and dash marks are tried before a block, so `- { … }` and
      # `key: { … }` report the mark rather than opening a block keyed by it.
      - { include: "#LuauStructBlockItemMark" }
      # A property is tried before a block, so a block header never starts at
      # a property (`a = 1, b { … }` is a property, a comma and a block).
      - { include: "#LuauStructBlockProperty" }
      - { include: "#LuauStructInvalidHeader" }
      - { include: "#LuauStructBlock" }
      - { include: "#LuauStructListBlock" }
      - { include: "#LuauStructListValue" }

  # `header { … }` / `header = { … }`. The `{ … }` is its own bracket rule, so
  # bracket matching pairs the braces alone.
  LuauStructBlock:
    # lookaround: LuauStructListValue owns literals followed by comments whose
    # text may contain a brace. Moving the whole list rule first consumes real
    # headers; splitting its value forms duplicates their comment boundaries.
    # The brace belongs to LuauStructBlockBody for bracket matching, so begin
    # cannot consume it; the end assertion returns after that child closes.
    begin: (?!{{STRUCT_BLOCK_LITERAL_THEN_COMMENT}})({{STRUCT_BLOCK_HEADER}})({{STRUCT_BLOCK_ASSIGN}})(?=[{])
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauStructBlockKey" }
      2:
        patterns:
          - { include: "#AssignEqualOperator" }
          - { include: "#Whitespace" }
    patterns:
      - { include: "#LuauStructBlockBody" }
    end: (?<=[}])|(?={{STRUCT_BLOCK_BAIL}})

  # A brace block's header: its key, selector or keyframe position. The parts
  # use their corresponding token rules, so a keyframe position (`from`, `40%`)
  # is a `LuauKeyframeSelector`. A character
  # none of them reads is a `LuauStructBlockKeyChar`, so the key always spans
  # the whole header and both engines read every part of it (GRAMMAR.md §17).
  LuauStructBlockKey:
    match: (.+)
    captures:
      1:
        patterns:
          - { include: "#LuauStructBlockKeyBracket" }
          - { include: "#LuauStructBlockKeyString" }
          - { include: "#LuauElementAttribute" }
          - { include: "#LuauKeyframeSelector" }
          - { include: "#LuauSparkleElementClass" }
          - { include: "#SelectorPropertyNamePart" }
          - { include: "#ComponentName" }
          - { include: "#PropertyName" }
          - { include: "#LuauStructBlockKeyChar" }

  LuauStructBlockKeyChar:
    match: (.)

  # An attribute selector in a header (`&[data-label="x"]`), read as one
  # match. The indented key's bracket rule is a scoped rule, which a capture
  # cannot hold in the tree engine, so the two engines would read it apart.
  LuauStructBlockKeyBracket:
    match: ({{STRUCT_BLOCK_BRACKET}})
    captures:
      1:
        patterns:
          - { include: "#LuauStructBlockKeyString" }
          - { include: "#LuauStructBlockKeyChar" }

  # A quoted run in a header (`&[data-label="x"]`, `&[data-label='x']`) is
  # plain text: a selector's attribute value is not an interpolated string.
  LuauStructBlockKeyString:
    tag: string
    name: string.quoted.struct-block-key.sd
    match: ({{STRUCT_BLOCK_QUOTED}}|{{STRUCT_BLOCK_SQUOTED}})

  # The braces of a `header { … }` block and their entries. Without its `}` the
  # block ends where the declaration's `end` starts a line, or at the next
  # `scene` / `branch`.
  LuauStructBlockBody:
    brackets: true
    begin: ([{])
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauStructBlockOpen" }
    patterns:
      - { include: "#LuauStructBlockEntries" }
    end: ([}])|(?={{STRUCT_BLOCK_BAIL}})
    endCaptures:
      1:
        patterns:
          - { include: "#LuauStructBlockClose" }

  # A bare `{ … }` entry: one object of the enclosing list.
  LuauStructListBlock:
    brackets: true
    begin: ([{])
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauStructBlockOpen" }
    patterns:
      - { include: "#LuauStructBlockEntries" }
    end: ([}])|(?={{STRUCT_BLOCK_BAIL}})
    endCaptures:
      1:
        patterns:
          - { include: "#LuauStructBlockClose" }

  LuauStructBlockOpen:
    tag: keyword
    name: punctuation.definition.template-expression.begin.sd
    match: ([{])

  LuauStructBlockClose:
    tag: keyword
    name: punctuation.definition.template-expression.end.sd
    match: ([}])

  # `name = value` inside a block. The key and value are read by the same rules
  # as a `name = value` entry; the value ends at the line's end, a
  # `;` or the block's `}` (`STRUCT_BLOCK_VALUE`). A value that would start
  # with `{` is the block form `name = { … }`, so the rule leaves it to
  # `LuauStructBlock`.
  #
  # lookaround: `(?!{{WS}}*[{])` steps aside for `LuauStructBlock`
  # (`timing = { … }`) and, in a layout body (`LuauSparkleBlockEntries`),
  # `LuauSparkleElement` (`row = { … }`). Without it the property reads
  # `name =` with an empty value and the braces become a list block
  # (fixtures struct/animation-brace-keyframes and
  # sparkle/layout-brace-blocks). Reordering does not replace it: in a
  # struct body `LuauStructBlock` could go after
  # `LuauStructInvalidHeader` and before the property only if
  # `STRUCT_BLOCK_HEADER` also stopped at `=` (else it reads
  # `a = 1, b { … }` as one header), and in a layout body the element must
  # come after the property so `image = "black"` stays a property, which
  # leaves `row = { … }` to this rule. The value may be empty while an
  # author types (`key =`), so the value variable cannot refuse the brace,
  # and a property is a match, so no end can carry it. Splitting out a
  # narrower `name = {` rule to try first would copy `LuauStructBlock` in
  # struct bodies and `LuauSparkleElement` in layout bodies, and its begin
  # would still have to look for the brace, as `LuauStructBlock`'s
  # `(?=[{])` does.
  LuauStructBlockProperty:
    match: ({{STRUCT_BLOCK_PROPERTY_KEY}})({{ASSIGN_EQUAL_OPERATOR}})(?!{{WS}}*[{])({{STRUCT_BLOCK_VALUE}}?)({{WS}}*[/][/][^\n]*)?
    captures:
      1:
        patterns:
          - { include: "#BuiltinComponentName" }
          - { include: "#StylingDeclarationScalarPropertyName" }
      2:
        patterns:
          - { include: "#AssignEqualOperator" }
      3:
        patterns:
          - { include: "#NumericFieldValue" }
          - { include: "#BooleanFieldValue" }
          - { include: "#StringFieldValueInterpolated" }
          - { include: "#StringFieldValue" }
          - { include: "#StylingValue" }
          - { include: "#UnquotedStringFieldValue" }
      # The `//` comment after a literal value.
      4:
        patterns:
          - { include: "#LuauStructBlockValueComment" }

  # A bare value entry: one scalar of the enclosing list.
  LuauStructListValue:
    match: ({{STRUCT_BLOCK_ITEM}})({{WS}}*[/][/][^\n]*)?
    captures:
      1:
        patterns:
          - { include: "#NumericFieldValue" }
          - { include: "#BooleanFieldValue" }
          - { include: "#StringFieldValueInterpolated" }
          - { include: "#StringFieldValue" }
          - { include: "#StylingValue" }
          - { include: "#UnquotedStringFieldValue" }
      2:
        patterns:
          - { include: "#LuauStructBlockValueComment" }

  # The `//` comment after a literal property or list value.
  LuauStructBlockValueComment:
    tag: lineComment
    name: comment.line.double-slash.sd
    match: ({{WS}}*)([/]{2})([^\n]*)
    captures:
      1:
        patterns:
          - { include: "#Whitespace" }
      2:
        name: punctuation.definition.comment.sd
      3:
        name: comment.line.double-slash.content.sd

  LuauStructBlockSeparator:
    tag: punctuation
    name: punctuation.separator.semicolon.sd
    match: ([;])

  # A comma that ends an entry is ignored, so a block written like a multi-line
  # `define` table reads.
  LuauStructBlockTrailingComma:
    tag: punctuation
    name: punctuation.separator.comma.sd
    match: (?={{STRUCT_BLOCK_TRAILING_COMMA}})([,])

  # A comma between two entries on one line. Entries are separated by `;`.
  LuauStructBlockEntryComma:
    tag: invalid
    name: invalid.illegal.struct-entry-comma.sd
    match: ([,])

  # A `//` comment inside a block: after whitespace (or at the start of an
  # entry) and before whitespace or the end of the line, as the indented
  # form's value readers strip one (`stripTrailingLineComment`).
  LuauStructBlockSlashComment:
    tag: lineComment
    name: comment.line.double-slash.sd
    match: ({{WS}}*)([/]{2})(?={{WS}}|$)([^\n]*)
    captures:
      1:
        patterns:
          - { include: "#Whitespace" }
      2:
        name: punctuation.definition.comment.sd
      3:
        name: comment.line.double-slash.content.sd

  LuauStructInvalidHeader:
    # lookaround: LuauStructListValue must keep embedded colons in values such
    # as URLs. Ordering marks first alone would consume those colons; splitting
    # headers still needs an entry boundary. The boundary remains unconsumed
    # for LuauStructBlockSeparator, comments and braces to own their tokens.
    # Literals followed by comments belong to LuauStructListValue; without
    # the literal-comment guard this rule can consume a colon in that comment.
    # Moving the whole list rule first also takes real invalid headers;
    # splitting its literal forms here duplicates their value/comment bounds.
    # A parent's line end cannot distinguish a header colon from one in a
    # comment. The shared literal-comment variable supplies that distinction.
    match: (?!{{STRUCT_BLOCK_LITERAL_THEN_COMMENT}})((?:{{STRUCT_BLOCK_QUOTED}}|{{STRUCT_BLOCK_BRACKET}}|{{STRUCT_BLOCK_LONE_BRACKET}}|[^\s{};"\[]|{{STRUCT_BLOCK_WS_IN_TEXT}})+?{{WS}}*)([:])(?={{WS}}*(?:$|[;{},]|{{STRUCT_BLOCK_COMMENT_AFTER_WS}}))
    captures:
      2:
        patterns:
          - { include: "#LuauStructInvalidColon" }

  LuauStructInvalidColon:
    tag: invalid
    name: invalid.illegal.struct-colon.sd
    match: ([:])

  LuauStructBlockItemMark:
    tag: invalid
    name: invalid.illegal.struct-block-item.sd
    match: ([-])(?={{WS}}|$)

  # A `}` that closes no block.
  LuauStructStrayBlockClose:
    tag: invalid
    name: invalid.illegal.struct-block-close.sd
    match: ([}])

  LuauSparkleBlockLine:
    begin: ^(?!{{SPARKLE_BLOCK_BAIL}})(?=\S|{{WS}}+\S)
    patterns:
      - { include: "#LuauStructStrayBlockClose" }
      - { include: "#LuauSparkleBlockEntries" }
    end: $|(?={{SPARKLE_BLOCK_BAIL}})

  # Everything an entry position in a layout or component block can hold.
  # Every character is tiled: `LuauSparkleBlockUnknown` takes whatever the
  # rules before it leave (GRAMMAR.md §17).
  LuauSparkleBlockEntries:
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauStructBlockSlashComment" }
      # Before `Whitespace`, so a continuation line's begin takes its indent.
      - { include: "#LuauSparkleElementContinuation" }
      - { include: "#Whitespace" }
      - { include: "#Newline" }
      - { include: "#LuauStructBlockSeparator" }
      - { include: "#LuauStructBlockTrailingComma" }
      - { include: "#LuauStructBlockEntryComma" }
      - { include: "#LuauSparkleBlockIf" }
      - { include: "#LuauSparkleBlockFor" }
      - { include: "#LuauSparkleBlockMatch" }
      # Invalid colon and dash marks are tried before an element, so `- text`
      # and `row:` report the mark rather than reading as an element.
      - { include: "#LuauStructBlockItemMark" }
      # A property is tried before an element, so `image = "black"` keeps
      # its property meaning. A property whose value would
      # start with `{` is left to the element (`row = { … }`).
      - { include: "#LuauStructBlockProperty" }
      - { include: "#LuauStructInvalidHeader" }
      - { include: "#LuauSparkleElement" }
      # A block with no element before it.
      - { include: "#LuauSparkleElementBlock" }
      - { include: "#LuauSparkleBlockUnknown" }

  # An element: its name, a component call's arguments, the rest of its line
  # (its head: classes, attributes, content and comments) and an optional
  # block. The head is the first `LuauSparkleElementParts`, read from a
  # capture, so a quote or brace left open in it never runs past its line; it
  # is not part of the begin, so the one large pattern that reads it is
  # compiled once for elements and continuation lines alike. An event
  # closure the line leaves open ends the head; it and the parts after its
  # `}` are read by the element's patterns. The element ends after its block,
  # or at the end of the line its parts end on when it has none. A line after
  # it that starts with one of its parts is a `LuauSparkleElementContinuation`,
  # which the lowerers join to it.
  LuauSparkleElement:
    begin: ({{SPARKLE_ELEMENT_NAME}})({{WS}}*{{SPARKLE_PARENS}})?
    beginCaptures:
      1:
        patterns:
          - { include: "#BuiltinComponentName" }
          - { include: "#LuauSparkleElementName" }
      # Arguments nested too deep run to the end of the line; what follows
      # their `)` there is invalid.
      2:
        patterns:
          - { include: "#LuauSparkleCallArguments" }
          - { include: "#ExtraWhitespace" }
          - { include: "#LuauSparkleElementInvalid" }
    patterns:
      - { include: "#LuauSparkleEventClosureAttribute" }
      - { include: "#LuauSparkleElementParts" }
      - { include: "#LuauSparkleElementAssign" }
      - { include: "#LuauSparkleElementBlock" }
    end: (?<=[}])(?!{{WS}}*{{STRUCT_BLOCK_EQUAL}}?[{])|(?={{WS}}*{{SPARKLE_ELEMENT_BOUNDARY}})|(?={{SPARKLE_BLOCK_BAIL}})

  # A line that continues the element above it (#1225): it starts with a
  # class's `.`, an attribute's `#` or `@`, or a quote, and reads the parts
  # an element's head reads, an event closure that goes on at the next line,
  # and an optional block, as the element's own line does. The grammar cannot
  # see the element above it from here, so it is a node of its own, which the
  # lowerers join to the element before it (GRAMMAR.md §11.8). A line that
  # starts with `{` is the element's block, read as a block with no element
  # before it and joined the same way.
  LuauSparkleElementContinuation:
    begin: ^(?={{SPARKLE_CONTINUATION_START}})({{WS}}*)
    beginCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauSparkleEventClosureAttribute" }
      - { include: "#LuauSparkleElementParts" }
      - { include: "#LuauSparkleElementAssign" }
      - { include: "#LuauSparkleElementBlock" }
    end: (?<=[}])(?!{{WS}}*{{STRUCT_BLOCK_EQUAL}}?[{])|(?={{WS}}*{{SPARKLE_ELEMENT_BOUNDARY}})|(?={{SPARKLE_BLOCK_BAIL}})

  # A run of an element's parts (`SPARKLE_HEAD`): its head after its name, a
  # continuation line's parts, and the parts after an event closure's `}`.
  # The run is read from a capture, so nothing left open in it passes its
  # line. It ends before a `{` (with whitespace and an optional `=` before
  # it), a `;`, a `}`, a comma that ends the entry, an event closure its line
  # leaves open, or the end of the line.
  LuauSparkleElementParts:
    match: ((?:{{SPARKLE_HEAD_TOKEN}})+)
    captures:
      1:
        patterns:
          - { include: "#LuauSparkleElementPart" }

  # `@event={` with a closure its line leaves open (`SPARKLE_OPEN_BRACED`):
  # the closure's statements go on over the lines after it, up to its `}`.
  # A closure left without its `}` ends where a line starts with `end`,
  # `else`, `elseif` or `case`, or at the next `scene` or `branch`
  # (`SPARKLE_BLOCK_BAIL`, through `LuauSparkleHandlerClosure`), and the
  # lowerer reports it on its `{`. The parts after the `}` on its line, glued
  # to it or after whitespace (`}"Hi"`, `} .b`), are read here as a run of
  # parts, so the element around the attribute never ends at the closure's
  # `}` as it ends at its block's. The attribute ends where a run of parts
  # would: before a `{` (with whitespace and an optional `=` before it), a
  # `;`, a `}`, a comma, the end of the line, or another closure its line
  # leaves open; never at its own begin, which ends in `=` or whitespace.
  # The name is any name an attribute token takes (`SPARKLE_EVENT_NAME`), so
  # the line is tiled whatever it is; the validator reports one that names
  # no event.
  LuauSparkleEventClosureAttribute:
    begin: ([@])([^\s=;{}"'(),]*)({{WS}}*)([=])({{WS}}*)(?={{SPARKLE_OPEN_BRACED}})
    beginCaptures:
      1:
        patterns:
          - { include: "#EventAttributeOperator" }
      2:
        patterns:
          - { include: "#EventAttributeName" }
      3:
        patterns:
          - { include: "#ExtraWhitespace" }
      4:
        patterns:
          - { include: "#EqualOperator" }
      5:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauSparkleHandlerClosure" }
      - { include: "#LuauSparkleElementParts" }
    end: (?<![=\s])(?={{WS}}*(?:[;{},]|$|[=]{{WS}}*[{]))|(?={{SPARKLE_EVENT_NAME}}{{WS}}*[=]{{WS}}*{{SPARKLE_OPEN_BRACED}})|(?={{SPARKLE_BLOCK_BAIL}})

  # A name that is not a builtin element: a component, or a plain container
  # that carries its name as a class.
  LuauSparkleElementName:
    tag: className
    name: entity.name.type.class.view.sd
    match: (.+)

  # The parts of an element's head.
  LuauSparkleElementPart:
    patterns:
      - { include: "#RequiredWhitespace" }
      - { include: "#LuauComment" }
      - { include: "#LuauStructBlockSlashComment" }
      - { include: "#LuauSparkleElementClass" }
      - { include: "#LuauSparkleEventAttribute" }
      - { include: "#LuauSparklePropAttribute" }
      - { include: "#LuauElementContentStringInterpolated" }
      - { include: "#LuauElementContentStringPlain" }
      - { include: "#LuauElementContentStringSingleQuoted" }
      - { include: "#LuauSparkleElementInvalid" }

  # `.name`: a class.
  LuauSparkleElementClass:
    match: ([.])({{SPARKLE_CLASS_NAME}})
    captures:
      1:
        patterns:
          - { include: "#LuauSparkleClassDot" }
      2:
        patterns:
          - { include: "#LuauSparkleClassName" }

  LuauSparkleClassDot:
    tag: className
    name: punctuation.definition.class.sd
    match: ([.])

  LuauSparkleClassName:
    tag: className
    name: entity.name.type.class.view.sd
    match: (.+)


  # A character no part of an element reads.
  LuauSparkleElementInvalid:
    tag: invalid
    name: invalid.illegal.sparkle-element.sd
    match: (\S)

  # Text a prop's value or an event's handler cannot hold. No value has
  # whitespace outside its quotes, braces and parens, so text after
  # whitespace there follows a value that runs to the end of its line: one
  # nested deeper than the limits (`SPARKLE_PARENS`, `SPARKLE_BRACED`), a
  # quote left open, or a brace in the run (`#gap=4{ text }`, where the `{`
  # is part of the value, as in `#label=a{b}`). It is reported.
  LuauSparkleValueOverflow:
    match: ({{WS}}+)(\S[^\n]*)
    captures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
          - { include: "#LuauSparkleElementInvalid" }

  # `#prop=value` on an element in a block. Its value is one token: a
  # `{expr}` binding, a quoted string, or an unquoted run that ends at
  # whitespace (the head already ends it at `;` or `}`).
  LuauSparklePropAttribute:
    match: ([#])((?:[-]{2})?{{LUAU_WORD}}(?:[-]{{LUAU_WORD}})*)({{WS}}*)([=])({{WS}}*)({{SPARKLE_ATTR_VALUE}}?)
    captures:
      1:
        patterns:
          - { include: "#StyleAttributeOperator" }
      2:
        patterns:
          - { include: "#StyleAttributeName" }
      4:
        patterns:
          - { include: "#EqualOperator" }
      6:
        patterns:
          - { include: "#LuauFunctionCallShorthand" }
          - { include: "#LuauInterpolatedStringExpression" }
          - { include: "#LuauElementContentStringInterpolated" }
          - { include: "#InlinePropQuotedValue" }
          - { include: "#LuauSparkleValueOverflow" }
          - { include: "#InlinePropLiteralValue" }
          - { include: "#RequiredWhitespace" }

  # `@event=handler` on an element in a block. The handler is a closure, a
  # name or a call, and ends at whitespace.
  LuauSparkleEventAttribute:
    match: ([@])({{LUAU_WORD}})({{WS}}*)([=])({{WS}}*)({{SPARKLE_EVENT_VALUE}}?)
    captures:
      1:
        patterns:
          - { include: "#EventAttributeOperator" }
      2:
        patterns:
          - { include: "#EventAttributeName" }
      4:
        patterns:
          - { include: "#EqualOperator" }
      6:
        patterns:
          - { include: "#LuauSparkleEventHandler" }

  # The handler of an `@event=` in a block: everything its value covers, so
  # the handler and the parts after it on the line cannot run into each other.
  # A value nested too deep runs to the end of its line, so what follows the
  # handler there is tiled as well.
  LuauSparkleEventHandler:
    match: (.+)
    captures:
      1:
        patterns:
          - { include: "#LuauSparkleValueOverflow" }
          - { include: "#LuauSparkleHandlerClosure" }
          - { include: "#LuauSparkleEventHandlerName" }
          - { include: "#LuauExpression" }
          - { include: "#ExtraWhitespace" }
          - { include: "#LuauSparkleElementInvalid" }

  # A component call's arguments: `card("Inventory", hero.hp)`.
  LuauSparkleCallArguments:
    begin: ({{WS}}*)([(])
    beginCaptures:
      1:
        patterns:
          - { include: "#Whitespace" }
      2:
        patterns:
          - { include: "#PunctuationParenOpen" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#LuauElementContentStringInterpolated" }
      - { include: "#LuauExpression" }
      - { include: "#ExtraWhitespace" }
    end: ([)])
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationParenClose" }

  # The whitespace and optional `=` between an element and its `{`.
  LuauSparkleElementAssign:
    match: (?=[^{])({{WS}}*(?:[=]{{WS}}*)?)(?=[{])
    captures:
      1:
        patterns:
          - { include: "#AssignEqualOperator" }
          - { include: "#Whitespace" }

  # An element's `{ … }`. Without its `}` the block ends where a line starts
  # with `end`, `else`, `elseif` or `case`, or at the next `scene` / `branch`
  # (`SPARKLE_BLOCK_BAIL`).
  LuauSparkleElementBlock:
    brackets: true
    begin: ([{])
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauStructBlockOpen" }
    patterns:
      - { include: "#LuauSparkleBlockEntries" }
    end: ([}])|(?={{SPARKLE_BLOCK_BAIL}})
    endCaptures:
      1:
        patterns:
          - { include: "#LuauStructBlockClose" }

  # Text at an entry position that starts no entry (`.title` or `"text"` with
  # no element before it).
  LuauSparkleBlockUnknown:
    tag: invalid
    name: invalid.illegal.sparkle-block-entry.sd
    match: ((?:{{STRUCT_BLOCK_QUOTED}}|[^\s;{},"])+)

  # `if` / `for` / `match` inside a block. Their branches hold block entries.
  # Each stops at the `}` of the block around it, so a missing `end` does not
  # read past that block, and a block inside a branch stops where a line
  # starts with the branch's closer (`SPARKLE_BLOCK_BAIL`).
  LuauSparkleBlockIf:
    begin: (if){{SPARKLE_KEYWORD_END}}({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauIfKeyword" }
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauIfBlockCondition" }
      - { include: "#LuauSparkleBlockElseif" }
      - { include: "#LuauSparkleBlockElse" }
      - { include: "#LuauSparkleBlockEntries" }
    end: (end){{SPARKLE_KEYWORD_END}}|(?=[}])|(?={{BEAT}})
    endCaptures:
      1:
        patterns:
          - { include: "#LuauEndKeyword" }

  LuauSparkleBlockElseif:
    begin: (elseif){{SPARKLE_KEYWORD_END}}({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauElseifKeyword" }
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauElseifBlockCondition" }
      - { include: "#LuauSparkleBlockEntries" }
    end: (?={{LUAU_IF_BRANCH_END_KEYWORDS}}{{SPARKLE_KEYWORD_END}})|(?=[}])|(?={{BEAT}})

  LuauSparkleBlockElse:
    begin: (else){{SPARKLE_KEYWORD_END}}({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauElseKeyword" }
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauSparkleBlockEntries" }
    end: (?=end{{SPARKLE_KEYWORD_END}})|(?=[}])|(?={{BEAT}})

  LuauSparkleBlockFor:
    begin: (for){{SPARKLE_KEYWORD_END}}({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauForKeyword" }
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauForCondition" }
      - { include: "#LuauSparkleDoMark" }
      - { include: "#LuauSparkleBlockElse" }
      - { include: "#LuauSparkleBlockEntries" }
    end: (end){{SPARKLE_KEYWORD_END}}|(?=[}])|(?={{BEAT}})
    endCaptures:
      1:
        patterns:
          - { include: "#LuauEndKeyword" }

  LuauSparkleBlockMatch:
    begin: (match){{SPARKLE_KEYWORD_END}}({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauMatchKeyword" }
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauSparkleMatchCondition" }
      - { include: "#LuauSparkleDoMark" }
      - { include: "#LuauSparkleBlockCase" }
      - { include: "#LuauSparkleBlockElse" }
      - { include: "#LuauSparkleBlockEntries" }
    end: (end){{SPARKLE_KEYWORD_END}}|(?=[}])|(?={{BEAT}})
    endCaptures:
      1:
        patterns:
          - { include: "#LuauEndKeyword" }

  LuauSparkleBlockCase:
    begin: (case){{SPARKLE_KEYWORD_END}}({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauCaseKeyword" }
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauSparkleCaseValue" }
      - { include: "#LuauSparkleBlockEntries" }
    end: (?={{LUAU_MATCH_CASE_END_KEYWORDS}}{{SPARKLE_KEYWORD_END}})|(?=[}])|(?={{BEAT}})

  LuauSparkleControlBlock:
    patterns:
      - { include: "#LuauSparkleIfBlock" }
      - { include: "#LuauSparkleForLoop" }
      - { include: "#LuauSparkleMatchBlock" }

  LuauSparkleIfBlock:
    begin: ({{WS}}*)(if)\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauIfKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauIfBlockCondition" }
      - { include: "#LuauComment" }
      - { include: "#SparkleTrailingLineComment" }
      - { include: "#LuauSparkleElseifBlock" }
      - { include: "#LuauSparkleElseBlock" }
      - { include: "#LuauSparkleControlBlock" }
      - { include: "#LuauSparkleBlockLine" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}})|({{WS}}*)(end)\b
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauEndKeyword" }

  LuauSparkleElseifBlock:
    begin: ({{WS}}*)(elseif)\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauElseifKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauElseifBlockCondition" }
      - { include: "#LuauComment" }
      - { include: "#SparkleTrailingLineComment" }
      - { include: "#LuauSparkleControlBlock" }
      - { include: "#LuauSparkleBlockLine" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}})|(?={{WS}}*{{LUAU_IF_BRANCH_END_KEYWORDS}})

  LuauSparkleElseBlock:
    begin: ({{WS}}*)(else)\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauElseKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#SparkleTrailingLineComment" }
      - { include: "#LuauSparkleControlBlock" }
      - { include: "#LuauSparkleBlockLine" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}})|(?={{WS}}*(?:end)\b)

  # `for <bindings> in <expr> do <element lines> [else <empty fallback>] end`
  # (spec §4.6). Reuses the Luau `LuauForCondition` (bindings + `in` + iterable,
  # ends before `do`) and `LuauSparkleElseBlock` (the empty-iterable fallback).
  # `do` is consumed here (not via LuauDoBlock, whose body is Luau statements);
  # the body is sparkle element lines + nested control blocks.
  LuauSparkleForLoop:
    begin: ({{WS}}*)(for)\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauForKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauForCondition" }
      - { include: "#LuauComment" }
      - { include: "#SparkleTrailingLineComment" }
      - { include: "#LuauSparkleDoMark" }
      - { include: "#LuauSparkleElseBlock" }
      - { include: "#LuauSparkleControlBlock" }
      - { include: "#LuauSparkleBlockLine" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}})|({{WS}}*)(end)\b
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauEndKeyword" }

  # The `do` keyword that opens a for-loop's body (consumed after the condition).
  LuauSparkleDoMark:
    match: ({{WS}}*)(do)\b({{WS}}*)
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauDoKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  # `match <expr> do  case <value> …  [else …]  end` (spec §4.6). Distinct from
  # the alternator `match | arm` (display context): this is a UI control block
  # with `case` arms whose bodies are sparkle element lines. `do` is consumed by
  # LuauSparkleDoMark; the empty/default arm reuses LuauSparkleElseBlock.
  LuauSparkleMatchBlock:
    begin: ({{WS}}*)(match)\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauMatchKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauSparkleMatchCondition" }
      - { include: "#LuauComment" }
      - { include: "#SparkleTrailingLineComment" }
      - { include: "#LuauSparkleDoMark" }
      - { include: "#LuauSparkleCaseClause" }
      - { include: "#LuauSparkleElseBlock" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}})|({{WS}}*)(end)\b
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauEndKeyword" }

  # The matched expression, between `match` and `do` (may span lines).
  #
  # lookaround: the lookbehind opens the expression once (see
  # `LuauIfBlockCondition`). Its parents try it first at every position, so
  # without it the expression takes the block's `case` arms and, in a brace
  # block, its entries (`LuauSparkleCaseClause`, `LuauSparkleBlockEntries`;
  # fixture sparkle/layout-match). `(?!do\b)` is as in
  # `LuauForCondition`, leaving `do` to `LuauSparkleDoMark`.
  LuauSparkleMatchCondition:
    begin: (?<=match\b{{WS}}*)(?!do\b)
    patterns:
      - { include: "#LuauExpression" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}}|{{END}}|[}])|(?={{WS}}*do\b)

  LuauSparkleCaseClause:
    begin: ({{WS}}*)(case)\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauCaseKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauSparkleCaseValue" }
      - { include: "#LuauSparkleControlBlock" }
      - { include: "#LuauSparkleBlockLine" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}})|(?={{WS}}*{{LUAU_MATCH_CASE_END_KEYWORDS}})

  # The case value expression (on the `case` line, ends at end-of-line).
  #
  # lookaround: the lookbehind opens the value once (see
  # `LuauIfBlockCondition`). Without it the empty begin opens again on the
  # arm's element lines and, in a brace block, its entries
  # (`LuauSparkleBlockLine`, `LuauSparkleBlockEntries`; fixture
  # sparkle/layout-match). `(?!$)` leaves a `case` with nothing
  # after it on its line without a value, so the line break goes to
  # `LuauSparkleCaseClause`'s `Newline`.
  LuauSparkleCaseValue:
    begin: (?<=case\b{{WS}}*)(?!$)
    patterns:
      - { include: "#LuauExpression" }
      - { include: "#ExtraWhitespace" }
    # In a brace block a `;`, a `}` or the match's `end` on the same line ends
    # the value too.
    end: (?=$|[;}]|{{WS}}*end{{SPARKLE_KEYWORD_END}})



  LuauLayout:
    tag: meta
    name: meta.layout.luau
    # See LuauStyle: only in its shape.
    begin: ({{WS}}*)(layout)({{WS}}+){{LUAU_STRUCTURE_NAME_AHEAD}}
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauLayoutKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauLayoutNameAndInheritance" }
      - { include: "#LuauSparkleControlBlock" }
      - { include: "#LuauSparkleBlockLine" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}})|({{WS}}*)(end)\b({{LUAU_END_TRAILING_COMMENTS}})?
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauEndKeyword" }
      3:
        patterns:
          - { include: "#LuauComment" }

  # ----------------------------------------------------------------------------
  # Screen (navigation group for layouts)
  #
  # `screen NAME with <optional config> end` — a named group that holds
  # mutually-exclusive layouts (`layout X in NAME`). Explicitly declared so
  # `in SCREEN` references and `[[navigate SCREEN to LAYOUT]]` validate against
  # it (undefined screen = error, catching typos). The body is reserved for
  # future screen-level config; empty is allowed but `with` is required. Lowers
  # to a compile-time `screen` struct in program.context.screen.<name>. See
  # lowerLuauScreen.
  # ----------------------------------------------------------------------------

  LuauScreen:
    tag: meta
    name: meta.screen.luau
    # See LuauStyle: only in its shape.
    begin: ({{WS}}*)(screen)({{WS}}+){{LUAU_STRUCTURE_NAME_AHEAD}}
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauScreenKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauScreenNameHeader" }
      # A screen body carries no content yet; a brace block there is read as
      # a struct block, and nothing reads it.
      - { include: "#LuauStructBlockLine" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}})|({{WS}}*)(end)\b({{LUAU_END_TRAILING_COMMENTS}})?
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauEndKeyword" }
      3:
        patterns:
          - { include: "#LuauComment" }

  # `screen NAME`, ending at `with`. Reuses LuauDefineName so the lowerer reads
  # the name through the same node as define / style / layout.
  #
  # lookaround: as in `LuauStyleNameAndInheritance`. A screen body holds no
  # line a name could begin (its brace line, `LuauStructBlockLine`, begins
  # with `{`), so here the evidence is the word after a comment, tried first
  # or last: the declarationAnnotator test's `screen menu` declares `extra`
  # without the lookbehind.
  LuauScreenNameHeader:
    begin: (?<=screen\b{{WS}}*|{{LUAU_HEADER_LINE_START}}screen\b{{LUAU_HEADER_COMMENTS}})({{LUAU_IDENTIFIER}})
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauDefineName" }
    patterns:
      - { include: "#ExtraWhitespace" }
    end: (?={{BEAT}})|({{WS}}*)(with)\b
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauWithKeyword" }

  LuauComponent:
    tag: meta
    name: meta.component.luau
    # See LuauStyle: only in its shape.
    begin: ({{WS}}*)(component)({{WS}}+){{LUAU_STRUCTURE_NAME_AHEAD}}
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauComponentKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauComponentNameAndInheritance" }
      - { include: "#LuauSparkleControlBlock" }
      - { include: "#LuauSparkleBlockLine" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}})|({{WS}}*)(end)\b({{LUAU_END_TRAILING_COMMENTS}})?
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauEndKeyword" }
      3:
        patterns:
          - { include: "#LuauComment" }

  # Screen header: `NAME [as PARENT] [in CONTAINER]`, ending at `with`. The
  # `in CONTAINER` clause groups screens for `[[navigate CONTAINER to NAME]]`
  # routing — it is SCREEN-ONLY (components are mounted, never navigated), which
  # is why the screen/component headers are two distinct rules instead of one
  # shared rule (Golden Rule: distinct contexts → distinct grammar). Reuses
  # LuauDefineName / LuauInheritanceOperation → LuauDefineParentName so the
  # lowerer reads name/parent through the same node names as `define` / `style`;
  # adds LuauLayoutScreenOperation → LuauLayoutScreenName for `in`.
  #
  # lookaround: as in `LuauStyleNameAndInheritance`. Here the rivals at
  # column 0 are `LuauSparkleControlBlock` (`if`, `for`, `match`) and
  # `LuauSparkleBlockLine` (fixture sparkle/column-0-body-lines).
  LuauLayoutNameAndInheritance:
    begin: (?<=layout\b{{WS}}*|{{LUAU_HEADER_LINE_START}}layout\b{{LUAU_HEADER_COMMENTS}})({{LUAU_IDENTIFIER}})
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauDefineName" }
    patterns:
      - { include: "#LuauInheritanceOperation" }
      - { include: "#LuauLayoutScreenOperation" }
      - { include: "#ExtraWhitespace" }
    end: (?={{BEAT}})|({{WS}}*)(with)\b
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauWithKeyword" }

  # Component header: `NAME[(p1, p2)] [as PARENT]`, ending at `with`. No
  # `in CONTAINER` (containers are a screen-navigation concept). Reuses
  # LuauDefineName / LuauInheritanceOperation → LuauDefineParentName like the
  # screen header; the optional `(params)` reuses LuauFunctionParameters (spec
  # §4.7 — `component card(title) with …`), so param names tokenize as
  # LuauFunctionParameter and the lowerer reads them into ComponentNode.params.
  #
  # lookaround: as in `LuauLayoutNameAndInheritance` (fixture
  # sparkle/column-0-body-lines has a component body at column 0).
  LuauComponentNameAndInheritance:
    begin: (?<=component\b{{WS}}*|{{LUAU_HEADER_LINE_START}}component\b{{LUAU_HEADER_COMMENTS}})({{LUAU_IDENTIFIER}})
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauDefineName" }
    patterns:
      - { include: "#LuauFunctionParameters" }
      - { include: "#LuauInheritanceOperation" }
      - { include: "#ExtraWhitespace" }
    end: (?={{BEAT}})|({{WS}}*)(with)\b
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauWithKeyword" }

  # `in CONTAINER` — the screen's navigation container. Mirrors
  # LuauInheritanceOperation (`as PARENT`): the space before `in` is a SEPARATOR
  # (normalize to one space) so the formatter doesn't eat it (`hudin`). The
  # container name lowers through LuauLayoutScreenName.
  LuauLayoutScreenOperation:
    match: ({{WS}}*)(in)\b({{WS}}*)($|{{LUAU_IDENTIFIER}})($|{{WS}}*)
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauInKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      4:
        patterns:
          - { include: "#LuauLayoutScreenName" }
      5:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  # `#name=value` (structural/style attr) or `@event=handler` (deferred to
  # a later phase). Value is a quoted string, a `{closure}`, or a bare
  # token. The optional value group is captured raw; the lowerer strips
  # surrounding quotes.
  LuauUIAttribute:
    match: ({{WS}}*)([#@])({{STYLE_PROPERTY_NAME}})(?:({{WS}}*)(=)({{WS}}*)("[^"\n]*"|\{[^}\n]*\}|[^\s"]+))?
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauUIAttributeSigil" }
      3:
        patterns:
          - { include: "#LuauUIAttributeName" }
      4:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      5:
        patterns:
          - { include: "#LuauUIAttributeEquals" }
      6:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      7:
        patterns:
          - { include: "#LuauUIAttributeValue" }

  # A bare quoted string on an element line = its text content. Every
  # character must sit inside a capture group (the parser requires capture
  # groups to tile the whole match), so the quotes get their own group.
  LuauUIContent:
    match: ({{WS}}*)(")([^"\n]*)(")
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauUIQuote" }
      3:
        patterns:
          - { include: "#LuauUIContentText" }
      4:
        patterns:
          - { include: "#LuauUIQuote" }

  LuauLayoutKeyword:
    tag: controlKeyword
    name: keyword.control.layout.luau
    match: (layout)\b

  LuauScreenKeyword:
    tag: controlKeyword
    name: keyword.control.screen.luau
    match: (screen)\b

  LuauComponentKeyword:
    tag: controlKeyword
    name: keyword.control.component.luau
    match: (component)\b

  LuauUIAttributeSigil:
    tag: separator
    name: punctuation.definition.attribute.ui.luau
    match: ([#@])

  LuauUIAttributeName:
    tag: attributeName
    name: entity.other.attribute-name.ui.luau
    match: ({{STYLE_PROPERTY_NAME}})

  LuauUIAttributeEquals:
    tag: separator
    name: keyword.operator.assignment.ui.luau
    match: (=)

  LuauUIAttributeValue:
    tag: string
    name: string.unquoted.ui.luau
    match: ([^\n]+)

  LuauUIContentText:
    tag: string
    name: string.quoted.ui.luau
    match: ([^"\n]*)

  LuauUIQuote:
    tag: string
    name: punctuation.definition.string.ui.luau
    match: (")

  # ----------------------------------------------------------------------------
  # New Expression (`new ClassName(...)` — instance construction for
  # `define`-declared classes)
  # ----------------------------------------------------------------------------

  LuauNewExpression:
    tag: meta
    name: meta.new.luau
    match: (new)\b({{WS}}*)({{LUAU_IDENTIFIER}})
    captures:
      1:
        patterns:
          - { include: "#LuauNewKeyword" }
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      3:
        patterns:
          - { include: "#LuauNewClassName" }

  LuauNewKeyword:
    tag: controlKeyword
    name: keyword.control.new.luau
    match: (new)\b

  LuauNewClassName:
    tag: typeName
    name: entity.name.type.new.luau
    match: ({{LUAU_IDENTIFIER}})

  LuauDefineKeyword:
    tag: controlKeyword
    name: keyword.control.define.luau
    match: (define)\b

  LuauAsKeyword:
    tag: controlKeyword
    name: keyword.control.as.luau
    match: (as)\b

  LuauWithKeyword:
    tag: controlKeyword
    name: keyword.control.as.luau
    match: (with)\b

  LuauDefineName:
    tag: definition(typeName)
    name: entity.name.type.define.luau
    match: ({{LUAU_IDENTIFIER}})

  LuauDefineParentName:
    tag: typeName
    name: entity.name.type.define.parent.luau
    match: ({{LUAU_IDENTIFIER}})

  # The screen's navigation container name (from `screen NAME in CONTAINER`).
  LuauLayoutScreenName:
    tag: typeName
    name: entity.name.type.layout.screen.luau
    match: ({{LUAU_IDENTIFIER}})

  # ----------------------------------------------------------------------------
  # Function Definition
  # ----------------------------------------------------------------------------

  LuauFunctionDefinition:
    tag: meta
    name: meta.function.luau
    # Block comments between the scope modifier and `function` are trivia
    # (`local --[[c]] function k()`, #1305): the begin takes them, so the
    # modifier is not read as a variable declaration without a name.
    begin: ({{WS}}*)(?:({{LUAU_SCOPE_MODIFIERS}})\b({{WS}}*{{LUAU_ANY_LEVEL_BLOCK_COMMENT}}*))?(function)\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauScopeModifier" }
      3:
        emit: true
        patterns:
          - { include: "#LuauComment" }
          - { include: "#OptionalWhitespace" }
      4:
        patterns:
          - { include: "#LuauFunctionKeyword" }
      5:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      # `LuauFunctionBody` opens AFTER the close-paren of the param
      # list (or after a return-type annotation), so its lookbehind
      # anchors on the last header char. Keeping body in
      # its own rule lets `bare-assignment-in-body` style content
      # (e.g. `& x = expr`) parse without polluting the function-
      # header context. `LuauBlockBody` then matches statements inside.
      # It comes before the name and parameter rules because it can open
      # at the start of a line, where the parameter rule would take a
      # body line such as `print(x)` as a parameter list, and before the
      # comment rule because a block comment right after the header begins
      # at the same position and belongs to the body. A parameter list that
      # ends its line carries the header across the line break first
      # (`LuauFunctionHeaderLineBreak`, I-1449), and the body opens at the
      # next line's start.
      - { include: "#LuauFunctionHeaderLineBreak" }
      - { include: "#LuauFunctionBody" }
      - { include: "#LuauComment" }
      - { include: "#LuauGenericsDeclaration" }
      - { include: "#LuauFunctionReturnMissingType" }
      - { include: "#LuauFunctionReturnType" }
      - { include: "#LuauFunctionDeclarationName" }
      - { include: "#LuauFunctionParameters" }
      - { include: "#LuauBlockBody" }
      - { include: "#LuauStrayCloser" }
      - { include: "#LuauUnreadToken" }
    # The comments after `end` that run to the line's end are the
    # definition's (`LUAU_END_TRAILING_COMMENTS`). Before a `::`, the end
    # takes the whitespace up to it, as a value takes the whitespace before
    # an operator (`_LUAU_VALUE_OPERATOR_AHEAD_`): a function literal's type
    # assertion (`local f = function() end :: T`, I-1364) then follows with
    # no whitespace left to close a story declaration or its value, both of
    # which end at whitespace.
    end: (?={{BEAT}})|({{WS}}*)(end)\b(?:({{LUAU_END_TRAILING_COMMENTS}})|({{WS}}*)(?={{LUAU_TYPECAST_OPERATOR}}))?
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauEndKeyword" }
      3:
        patterns:
          - { include: "#LuauComment" }
      4:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  LuauFunctionBody:
    tag: meta
    name: meta.function.body.luau
    # Anchored: opens once the function header (params / return type)
    # is closed, so every statement of the function is inside it. The
    # lookbehind takes the header's last character: the parameter list's
    # `)` or the end of a return type (`number`, `number?`, `{number}`,
    # `Array<T>`, `"x"`). The body opens there when a statement follows on
    # the same line (`function f() return 1 end`), or on the line break
    # after it; a parameter list that ends its line leaves its line break to
    # `LuauFunctionHeaderLineBreak`, and the body opens at the start of the
    # next line that begins a statement (I-1449). The name and generics
    # also end in a type-end character, so
    # the body never opens right after `LUAU_FUNCTION_HEADER`, where
    # `LuauFunctionParameters` opens instead (`function f (x)`,
    # `function f<T>(x)`). A single `:` begins a return type, not a
    # statement; `::` begins a label. Right after the parameter list's `)`
    # the body also opens with no whitespace, before a character a statement
    # can begin with (`function f()(g)() end`, `function f()return 1 end`);
    # anywhere else, a statement needs whitespace before it, or the body
    # would reopen before every character after one that closed it. It also
    # opens before a `;` or a block comment right after the header, with or
    # without whitespace (`function f(): number; g()`,
    # `function f() --[[c]] g()`); left in the header, a block comment takes
    # the whitespace after it, and the body would open only at the next
    # statement's own whitespace, leaving the one before it out. A
    # parameter list moved to the next line is not supported with or
    # without generics. A return type takes in the line break after it,
    # as any type does, so the body also opens at the start of a line,
    # unless that line closes the function. That opening also needs the
    # line to start with a character a statement can begin with: a line the
    # body cannot read (a stray `|` or `)`) closes the body, and reopening
    # it there would match nothing, again and again. After a return type whose
    # trailing block comment spans lines and closes right before code
    # (`b]]print(1)`), it opens before the closing brackets the comment
    # leaves, which the body reads (`LuauTypeTrailingBlockCommentClose`).
    begin: "{{LUAU_FUNCTION_BODY_AT_COMMENT_CLOSE}}|{{LUAU_FUNCTION_BODY_AT_SPACED_STATEMENT}}|{{LUAU_FUNCTION_BODY_AFTER_PARAMETERS}}|{{LUAU_FUNCTION_BODY_AT_SEMICOLON_OR_COMMENT}}|{{LUAU_FUNCTION_BODY_AT_LINE_BREAK}}|{{LUAU_FUNCTION_BODY_AT_LINE_START}}"
    patterns:
      - { include: "#LuauBlockBody" }
      - { include: "#LuauStrayCloser" }
      - { include: "#LuauUnreadToken" }
    # Don't consume `end` — the outer `LuauFunctionDefinition.end`
    # owns that. Stop at `end` or at a scene or branch declaration.
    end: (?={{BEAT}}|{{WS}}*\bend\b)

  LuauFunctionParameters:
    tag: meta
    name: meta.parameter.luau
    brackets: true
    # Anchored to HEADER position: a parameter list's `(` is preceded
    # (modulo inline whitespace) by one of:
    #   - a header keyword (`function` / `scene` / `branch` /
    #     `external`) plus an optional dotted/colon name path and an
    #     optional generics `<T>` run — covers `function (x)`,
    #     `function pack(first, ...)`, `function t.g(x)`,
    #     `function t:m(x)`, `function f<T>(x)`, `scene foo(x)`,
    #     `external host(x)`; or
    #   - line-start + identifier — define-block method headers
    #     (`NAME(params)` on its own line inside LuauMethodDefinition).
    # Naming the header keywords, rather than accepting any identifier,
    # keeps a call written after the header from being read as a
    # parameter list: in
    #   function pack(first, ...) table.insert(t, 1, first) end
    # `table.insert(` has no header keyword before it and is mid-line.
    begin: ((?<={{LUAU_FUNCTION_HEADER}}{{WS}}*|^{{WS}}*{{LUAU_NAME_BEHIND}}{{WS}}*)[(])
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationParenOpen" }
    patterns:
      - { include: "#LuauTypeTrailingBlockCommentClose" }
      - { include: "#LuauTypeOperatorLineContinuation" }
      - { include: "#LuauComment" }
      - { include: "#LuauVariadicParameter" }
      - { include: "#LuauFunctionParameter" }
      - { include: "#LuauTypeAnnotationOperation" }
      - { include: "#LuauExpression" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
      - { include: "#LuauUnreadToken" }
    end: (?={{NAMED_BEAT}})|([)])|(?={{WS}}*{{LUAU_NOT_PARENTHESIS_CLOSER}})
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationParenClose" }

  LuauVariadicType:
    match: ({{LUAU_IDENTIFIER}}[.][.][.])
    tag: special(typeName)
    name: variable.parameter.function.varargs.luau

  # The `...` of a variadic type written before its type (`...number`, a
  # pack of any number of numbers), highlighted as `T...` is; the type
  # after it is read on as the type.
  LuauVariadicTypePack:
    match: ([.][.][.])
    tag: special(typeName)
    name: variable.parameter.function.varargs.luau

  LuauVariadicParameter:
    match: ([.][.][.])
    tag: special(variableName)
    name: variable.parameter.function.varargs.luau

  LuauFunctionParameter:
    match: ({{LUAU_IDENTIFIER}})
    tag: function(variableName)
    name: variable.parameter.function.luau

  LuauFunctionReturnType:
    begin: (?<=[)]{{WS}}*)([:])(?![:])({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauTypeOperator" }
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauTypeOperatorComments" }
      - { include: "#LuauComment" }
      - { include: "#LuauTypeLiteral" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    # A `;` ends the return type as it ends the type, so the body opens
    # before it (`function f(): number; g()`), and so does a block comment
    # on its line that code follows (`function f(): number --[[c]] g()`), and
    # so does the `]` a trailing block comment spanning lines leaves before
    # code (`LuauTypeTrailingBlockCommentClose`). It also ends at another
    # token that cannot start the type, which leaves the return type empty
    # (`function f(): end`, `function f(): = nil end`). After a complete type
    # it ends before a `:` that a reserved word follows, as the type does
    # (`function f(): T:end`, `LUAU_COLON_BEFORE_RESERVED_WORD`), where the
    # body's expression reads the `:` and the word as a method's (I-1447).
    end: (?={{BEAT}})|(?={{LUAU_TYPE_LINE_BREAK}}|$|{{WS}}|[;=,)\]}>]|{{LUAU_NON_TYPE_KEYWORDS}})|(?<={{LUAU_TYPE_END}}{{WS}}*)(?={{LUAU_BLOCK_COMMENT_ON_LINE}}{{LUAU_TYPE_CODE_AHEAD}}|{{LUAU_COLON_BEFORE_RESERVED_WORD}})

  LuauFunctionName:
    tag: function(name)
    name: entity.name.function.luau
    match: ({{LUAU_IDENTIFIER}})

  # ----------------------------------------------------------------------------
  # Variable Definition
  # ----------------------------------------------------------------------------

  # `store` and `const` begin one only before a name
  # (`LUAU_CODE_SCOPE_MODIFIER`, #1328).
  LuauVariableDefinition:
    begin: ({{WS}}*)({{LUAU_CODE_SCOPE_MODIFIER}})({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauScopeModifier" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    # Multi-target multi-RHS shape (`local a, b = 10, 20`): each
    # `LuauVariableAssignment` terminates at `,` so the comma + any
    # subsequent expressions live at the `LuauVariableDefinition`
    # level. `LuauCommaSeparator` handles the comma between targets
    # AND the comma between RHS values; `LuauExpression` (added here
    # rather than only inside `LuauVariableAssignment`) captures
    # trailing RHS values after the assignment's `= <first-value>`
    # has terminated at the first comma. The lowerer reassembles the
    # multi-RHS list by walking the def's content children.
    #
    # This is the declaration in Luau code (function bodies and Luau
    # blocks). As in Luau, a comma that ends its line continues the list
    # on the next line: `LuauCommaLineBreak` carries the declaration across
    # the line break. A narrative body declares with
    # `LuauSparkdownVariableDefinition`, which ends at its line.
    #
    # After a line break it must not take a statement: a line that starts
    # with `end`, `else`, `until`, `return`, another statement keyword or a
    # `scene` header belongs to the enclosing block, and the comma before it
    # is left without a value (the lowerer reports it, as Luau does).
    # `LuauVariableDefinitionValue` is `LuauExpression` without its
    # statements for that reason, `LuauVariableAssignment` refuses a
    # reserved word before a comma or the end of its line, and the end
    # stops at `LUAU_DECLARATION_STOP`.
    #
    # `local function`, `store function` and `const function` are
    # `LuauFunctionDefinition`, whose begin takes the scope modifier itself:
    # every list that includes either declaration rule includes
    # `LuauFunctionDefinition` before it (`LuauDeclarations` for this rule).
    # `luauVariableDefinitionValue.test.ts` holds the two rules' begin,
    # captures and end together.
    #
    # An `=` that ends its line, or has only comments after it, reads the
    # value from a later line, as Luau does: its `LuauAssignmentOperation`
    # stays open across the line break (`LuauAssignmentLineBreak`). An `if`
    # that begins that line, at any indentation, is the if expression it
    # reads (#1247); before any other token it ends, with its
    # `LuauVariableAssignment`, and this rule reads an indented value there,
    # while an unindented line ends the declaration without a value.
    #
    # A target that ends its line, with no `=` before it, carries the
    # declaration across the line break (`LuauTargetLineBreak`), so that a
    # later line's `:` is its annotation (I-1449).
    patterns:
      - { include: "#LuauTargetLineBreak" }
      - { include: "#LuauCommaLineBreak" }
      - { include: "#LuauValueTrailingBlockComment" }
      - { include: "#LuauComment" }
      - { include: "#LuauTargetTypeCast" }
      - { include: "#LuauVariableAssignment" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#LuauVariableDefinitionValue" }
    # The definition's parts follow one another directly (a value's call
    # arguments are a sibling `LuauParenthetical`), or after whitespace
    # when the next part is a comment, a comma or the `=` before the values
    # (a target with a type annotation ends before its ` = value`). It
    # ends at whitespace before anything else, so a statement later on the
    # line (`local x = 5 return x`) is the enclosing body's next statement;
    # at a `;` or a closing bracket; at the end of the line; before a
    # statement that a comma's line break reaches; and at the start of the
    # next line, where the line break was taken in by a type annotation
    # that could have gone on as a union. That last end has to win over the
    # patterns, which would read the next line's call or assignment as a
    # value, so the end is checked before the patterns are. After a
    # trailing comma, an indented value is read here, since
    # `LuauCommaLineBreak` then ends past the line start; an unindented one
    # ends the declaration, and the lowerer carries that line in as the
    # value (`collectLineContinuation`). An unindented if expression, which
    # would otherwise be read as an if statement, is read inside
    # `LuauCommaLineBreak` instead. At the end of a line that a target ends,
    # `LuauTargetLineBreak` carries the line break instead.
    end: "(?={{BEAT}})|(?=^|[;)\\]}])|(?<!{{LUAU_TARGET_LINE_END_BEHIND}})(?=$)|(?={{WS}}+{{LUAU_SHARED_DECLARATION_END_GUARD}})|(?={{LUAU_DECLARATION_STOP}})|(?<={{LUAU_TYPE_END}}{{WS}}*)(?={{LUAU_BLOCK_COMMENT_ON_LINE}}{{LUAU_STATEMENT_CODE_AHEAD}})|{{LUAU_VALUE_COMMENT_BEFORE_STATEMENT}}"

  # The declaration in a narrative body (the root, a scene, or a sparkdown
  # `if`, loop or `choose` around dialogue and actions). It ends at its line
  # (#1907): the next line is story, never a continued value, so a comma, an
  # operator, an if expression's `then` or `else`, a type that a `|` line
  # might continue, or an `=` that ends the line is left without what it
  # needs, and the converter reports it. Only a bracket, a long string or a
  # block comment that opens on the line carries it on: its targets, types
  # and values are the bounded family's, whose operations, arms and types
  # end at the line and whose brackets span lines. It ends as the Luau
  # declaration does, so a statement after it on the same line
  # (`local x = 5 return`) is the body's next statement. A second
  # declaration on the line is this rule too, ahead of the Luau declaration
  # `LuauExpression` reaches, so it also ends at the line
  # (`store a = 1 local b = 2,`). Its targets are
  # `LuauSparkdownVariableAssignment`, whose operation has no line break
  # after its `=`: an `=` that ends its line has no value, so a value on
  # the next line, or after a comment that opens on a later line, is not
  # read as its value (#1906). A block comment that opens on the `=`'s line
  # is read whole by `LuauComment`, so a value after its close is still the
  # declaration's (`local q = --[[ a` then `]] 4`).
  LuauSparkdownVariableDefinition:
    #
    # A block comment is read inside the declaration, as Luau reads it,
    # wherever it stands: the begin takes those between the scope modifier
    # and the first target (`local --[[c]] r = 1`, #1200), and after a
    # target, a type or a value the declaration reads the comment and what
    # follows it on the line (`local a --[[b]]print(1)`, #1207), which the
    # converter reads as Luau does, as the next statement. Before
    # whitespace, a statement after a target or value with no comment
    # between still ends the declaration.
    begin: ({{WS}}*)({{LUAU_SCOPE_MODIFIERS}})\b({{WS}}*(?:{{LUAU_BLOCK_COMMENT_ON_LINE}})*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauScopeModifier" }
      3:
        emit: true
        patterns:
          - { include: "#LuauComment" }
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauSparkdownExplicitTargetTypeCast" }
      - { include: "#LuauSparkdownVariableAssignment" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#LuauFunctionDefinition" }
      - { include: "#LuauSparkdownVariableDefinition" }
      - { include: "#LuauSparkdownExplicitExpression" }
    end: "(?={{BEAT}})|(?=^|$|[;)\\]}])|(?={{WS}}+{{LUAU_SHARED_DECLARATION_END_GUARD}})|(?={{LUAU_DECLARATION_STOP}})"

  # `LuauExpression` without the statements it reaches through
  # `LuauDeclarations` and without bare keywords (see
  # `LuauVariableDefinition`), keeping `LuauFunctionDefinition` in place
  # of the statements, so an anonymous function is still a value, and
  # `LuauUnitKeywords` in place of the keywords, so `...` is. The order is
  # `LuauExpression`'s; `luauVariableDefinitionValue.test.ts` holds the
  # two lists together.
  LuauVariableDefinitionValue:
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauTernaryExpression" }
      - { include: "#LuauAlternatorBlocks" }
      - { include: "#LuauDivertTargetLiteral" }
      - { include: "#LuauDeclarationWordAsName" }
      - { include: "#LuauFunctionDefinition" }
      - { include: "#LuauAssignmentOperation" }
      - { include: "#LuauRegexLiteral" }
      - { include: "#LuauGenericsInstantiation" }
      - { include: "#LuauOperatorMissingOperand" }
      - { include: "#LuauArithmeticOperation" }
      - { include: "#LuauCompareOperation" }
      - { include: "#LuauConcatOperation" }
      - { include: "#LuauLengthOperation" }
      - { include: "#LuauLogicalOperation" }
      - { include: "#LuauTypeCastOperation" }
      - { include: "#LuauParenthetical" }
      - { include: "#LuauAttributedFunctionValue" }
      - { include: "#LuauAttributeList" }
      - { include: "#LuauAttribute" }
      - { include: "#LuauNumber" }
      - { include: "#LuauString" }
      - { include: "#LuauBoolean" }
      - { include: "#LuauNil" }
      - { include: "#LuauUnitKeywords" }
      - { include: "#LuauNewExpression" }
      - { include: "#LuauAccessPath" }
      - { include: "#LuauExpressionKeywordMethodAccessor" }
      - { include: "#LuauTable" }
      - { include: "#LuauChainedFunctionCall" }
      - { include: "#LuauChainedPropertyAccess" }
      - { include: "#LuauTypeAnnotationOperation" }

  # One target of a declaration (`local a, b: number = …`), or a define
  # body's property name, with its annotation and `= value`.
  #
  # lookaround: the begin's lookaheads step aside for the values after a
  # declaration's `=`, which `LuauVariableDefinition` and
  # `LuauSparkdownVariableDefinition` read with `LuauVariableDefinitionValue`
  # and `LuauExpression` after this rule. A target is a name followed by
  # `,`, `=` (not `==`), `:` (not `::`, `LuauTargetTypeCast`, and not a
  # method call `s:upper()`, though `t: typeof(x)` is an annotation), a
  # comment or the line's end, and is not a reserved word before a comma,
  # a comment or the line's end (`nil`, `true`, `false`, or `and` ending a
  # line that the next line continues). Removing any one part changes the
  # tree of luau-declaration/target-or-value (`local a, b = 10, g()`,
  # `1, s:upper()`, `x, x == 1`, `1, nil`, `t: typeof(x)`). The
  # fixes in GRAMMAR.md §10.1 do not reach it: which side of the `=` a
  # name is on is state that only a scope can hold, and the targets and
  # values are siblings in the declaration, so no order of its patterns
  # tells them apart, and the lowerer reads the values as those siblings.
  # The declaration's end cannot carry it either: the values are inside the
  # declaration, so its end cannot stop before them. Ordering `LuauBoolean` and `LuauNil` before this rule covers `nil`,
  # `true` and `false`, but not `x and` at a line's end. A reserved word
  # before `=` stays a target, so a define body can name a property
  # `repeat`.
  LuauVariableAssignment:
    begin: "(?!{{LUAU_RESERVED_WORDS}}{{WS}}*(?:--|,|$))({{LUAU_IDENTIFIER}})({{WS}}*)(?={{WS}}*{{LUAU_SHARED_VARIABLE_HEAD_END}})"
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauVariableName" }
      2:
        # `Separator` (normalize to one space) rather than
        # `ExtraWhitespace` (collapse to nothing): the formatter would
        # otherwise eat the space between the variable name and the
        # following `=` / `+=` / `-=` operator, producing `x= 1`.
        patterns:
          - { include: "#OptionalWhitespace" }
    # The begin takes in the whitespace before a comment that follows the
    # target, and the comment stands between the target and its annotation,
    # `=` or comma (`local x --[[c]] = 1`, #1212). The end cannot match before
    # the comment, so without `LuauComment` here the rule is left unfinished.
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauTargetTypeCastAfterComment" }
      - { include: "#LuauTypeAnnotationOperation" }
      - { include: "#LuauAssignmentOperation" }
      - { include: "#LuauFunctionDefinition" }
    # Terminate at `,` (in addition to WS / EOL / `BEAT`) so the
    # outer `LuauVariableDefinition` owns the comma between
    # multi-RHS values. Previously the VA's own `LuauCommaSeparator`
    # pattern consumed the comma and an `ERROR_INCOMPLETE` followed —
    # the trailing RHS values were silently dropped from the tree.
    # `^` ends it at the next line when its type annotation took in the
    # line break. Terminate before `;` too, so `local x = f();` closes this
    # rule and `LuauVariableDefinition` before the `;`, which the enclosing
    # statement context reads as `LuauSemicolonSeparator`. It ends before the
    # `]` that a type's trailing block comment leaves before code
    # (`LuauTypeTrailingBlockCommentClose`), as the declaration does, and
    # before a comment that ends the `=`'s line, which the declaration's
    # `LuauAssignmentLineBreak` reads. It ends before a `)` or a `}` too,
    # which a bracket in its type annotation that did not open it ends
    # before (`local x: {a: number) = 1`, I-1318), and the body reads.
    end: (?={{BEAT}})|(?=^|$|{{WS}}|[,;)\]}])|(?<={{LUAU_TYPE_END}}{{WS}}*)(?={{LUAU_BLOCK_COMMENT_ON_LINE}}{{LUAU_STATEMENT_CODE_AHEAD}})|{{LUAU_VALUE_COMMENT_BEFORE_STATEMENT}}|(?={{LUAU_GLUED_KEYWORD}})|{{LUAU_AT_LATER_LINE_TOKEN}}

  # One target of a narrative declaration (`LuauSparkdownVariableDefinition`),
  # with its annotation and `= value`: `LuauVariableAssignment` but for its
  # type and operation, which end at a line end (#1906, #1907). An `=` that
  # ends its line has no value, and a type that ends its line is not
  # continued by a `|` line; only a block comment that opens on the line,
  # or a bracket in the type, carries the target past it.
  # lookaround: as for `LuauVariableAssignment`.
  LuauSparkdownVariableAssignment:
    begin: "(?!{{LUAU_RESERVED_WORDS}}{{WS}}*(?:--|,|$))({{LUAU_IDENTIFIER}})({{WS}}*)(?={{WS}}*{{LUAU_SHARED_VARIABLE_HEAD_END}})"
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauVariableName" }
      2:
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauSparkdownExplicitTargetTypeCastAfterComment" }
      - { include: "#LuauSparkdownExplicitTypeAnnotationOperation" }
      - { include: "#LuauSparkdownAssignmentOperation" }
      - { include: "#LuauFunctionDefinition" }
    # Before a block comment that a statement follows on its line, the target
    # ends and leaves the comment and the statement to the declaration
    # (#1207). A comment that spans lines is read here, since its opening
    # line cannot see what follows its close, so after its close the target
    # ends before a statement glued to it (`local a --[[b` then `]]print(1)`).
    end: (?={{BEAT}})|(?=^|$|{{WS}}|[,;)\]}])|(?<={{LUAU_TYPE_END}}{{WS}}*)(?={{LUAU_BLOCK_COMMENT_ON_LINE}}{{LUAU_STATEMENT_CODE_AHEAD}})|{{LUAU_VALUE_COMMENT_BEFORE_STATEMENT}}|(?={{LUAU_GLUED_KEYWORD}})|(?<=\]=*\])(?={{LUAU_STATEMENT_CODE_AHEAD}})

  # ----------------------------------------------------------------------------
  # Control Blocks (For, While, Repeat, If, Elseif, Else, Do)
  # ----------------------------------------------------------------------------

  LuauSparkdownControlBlock:
    patterns:
      # First: it opens only right after a `repeat` loop's `until`. A story
      # loop's condition ends at its line, as every story statement does
      # (#1907), so it is the bounded one.
      - { include: "#LuauSparkdownExplicitUntilCondition" }
      # An `until` that no story `repeat` took, which Luau reports.
      - { include: "#LuauStrayUntilStatement" }
      - { include: "#LuauSparkdownForLoop" }
      - { include: "#LuauSparkdownWhileLoop" }
      - { include: "#LuauSparkdownRepeatLoop" }
      - { include: "#LuauSparkdownDoBlock" }
      - { include: "#LuauSparkdownChooseBlock" }
      - { include: "#LuauSparkdownIfBlock" }
      - { include: "#LuauSparkdownElseifBlock" }
      - { include: "#LuauSparkdownElseBlock" }
      - { include: "#LuauSparkdownAlternatorBlocks" }
      - { include: "#LuauSparkdownReassignment" }

  LuauControlBlock:
    patterns:
      # First: it opens only right after a `repeat` loop's `until`.
      - { include: "#LuauUntilCondition" }
      - { include: "#LuauForLoop" }
      - { include: "#LuauWhileLoop" }
      - { include: "#LuauRepeatLoop" }
      - { include: "#LuauDoBlock" }
      - { include: "#LuauIfBlock" }
      - { include: "#LuauAlternatorBlocks" }
      # `LuauDeclarations` covers declarations (`local x = …`,
      # `function …`, `break`, `continue`, `goto`, labels,
      # type declarations), valid inside every pure-luau body (function
      # definitions, `if`/`for`/`while`/`do` blocks). A pure-Luau body has
      # no `&` statement marker: everything in it is Luau, so a call or an
      # assignment is written as it is in Luau, and a line that starts with
      # `&` continues a type (`LuauTypeOperatorLineContinuation`).
      - { include: "#LuauDeclarations" }
      - { include: "#LuauReassignment" }

  # Shared body-content pattern set for every sparkdown-context block-shaped
  # rule (`LuauSparkdownIfBlock`, `LuauSparkdownForLoop`, etc.). Each of
  # those rules typically lists a block-specific prefix (a condition rule)
  # followed by `{ include: "#LuauSparkdownBlockBody" }`. This keeps the
  # set of accepted body constructs in ONE place — when a new statement
  # type lands, add it here once and every block picks it up automatically
  # (GRAMMAR.md §5.4: the audit-every-block discipline collapses to
  # audit-one-rule).
  #
  # `LuauCommaSeparator` is intentionally excluded — a display line could
  # legitimately start with a comma (`, she muttered`), and treating that
  # comma as a structural separator would mangle the display text.
  LuauSparkdownBlockBody:
    patterns:
      - { include: "#LuauSparkdownExplicitStatement" }
      - { include: "#LuauFunctionDefinition" }
      - { include: "#LuauSparkdownVariableDefinition" }
      - { include: "#LuauDeclarations" }
      - { include: "#LuauSparkdownControlBlock" }
      - { include: "#SparkdownStatement" }
      - { include: "#LuauExpression" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }

  # Pure-Luau counterpart of `LuauSparkdownBlockBody`. Used inside every
  # Luau-only block rule (`LuauIfBlock`, `LuauForLoop`, `LuauFunctionDefinition`,
  # etc.). `LuauControlBlock` already transitively includes
  # `LuauDeclarations` / `LuauReassignment` / etc., so the
  # body tail here is shorter than the Sparkdown variant.
  #
  # `LuauCommaSeparator` is included as a forgiveness measure — bare
  # commas at body level aren't valid Luau syntax (commas live inside
  # function-call args, declarations, table literals, etc.) but if an
  # author writes one we'd rather highlight it than emit an `UNRECOGNIZED`.
  LuauBlockBody:
    patterns:
      - { include: "#LuauTypeTrailingBlockCommentClose" }
      - { include: "#LuauTypeOperatorLineContinuation" }
      - { include: "#LuauLineContinuation" }
      - { include: "#LuauIndexerLineContinuation" }
      - { include: "#LuauMinusLineContinuation" }
      # Before `LuauControlBlock`'s declarations: a `define` that opens no
      # define is a name, whatever its column.
      - { include: "#LuauDefineAsName" }
      - { include: "#LuauControlBlock" }
      - { include: "#LuauExpression" }
      - { include: "#LuauCommaSeparator" }
      # Statement separator (`local x = {}; for i=1,n do ... end`).
      # Owned by the statement context, NOT by `LuauExpression` — see
      # the note there. Statement rules close before the `;` (their
      # patterns no longer match it), this consumes it, and the next
      # statement parses fresh.
      - { include: "#LuauSemicolonSeparator" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
      - { include: "#LuauUnreadToken" }

  # The catch-all that tiles a pure-Luau body or bracket (GRAMMAR.md §3.2,
  # §13.2): the last pattern of every rule whose `end` consumes a closer
  # (`end`, `until`, `)`, `]`, `}`, `>>`, a type's `>`) and of the bodies
  # those rules hold. It takes one token that no pattern before it could
  # read (a comment, a string, a number, a name, one of Luau's symbols of
  # more than one character, or one character other than a space), so the
  # rule never closes before its closer, a bail-out its own `end` has (a
  # beat for a body; a bracket has none, so `scene` on its own line inside
  # one stays a name) or the end of the input, and the text after the token
  # is read by the rule's own patterns again. The converter reads the run of tokens as Luau reads them
  # (`readLuauAst.ts`), and Luau's errors for it are reported there.
  #
  # The name and the character refuse `end`, `else`, `elseif` and `until`:
  # each can close a block around the rule that the rule cannot see, so the
  # rule closes there and that block's end reads it. A line break is never
  # taken (`Newline` stands before this rule in every list). A rule whose
  # `end` is zero-width, which ends where its content stops matching, and an
  # `applyEndPatternLast` rule, whose content is tried before its end, never
  # include it (the `luau-unread-token` grammar lint).
  LuauUnreadToken:
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauString" }
      - { include: "#LuauNumber" }
      - { include: "#LuauUnreadName" }
      - { include: "#LuauUnreadCharacter" }

  LuauUnreadName:
    tag: variableName
    name: variable.other.readwrite.luau
    # A reserved word other than a closer is one token too (`then` where no
    # `if` owns it), which the converter reads as Luau's keyword.
    match: "{{LUAU_UNREAD_NOT_CLOSER}}{{LUAU_WORD}}"

  # No scope or tag: where a statement rule is open at such a character,
  # vscode-textmate passes over it inside that rule, with the rule's scopes,
  # and the tree ends the rule there and reads it here, with the body's.
  # The statement rules of a pure-Luau body have no scope of their own, so
  # both give the character the body's scopes. Its error marks it.
  LuauUnreadCharacter:
    match: "{{LUAU_UNREAD_NOT_CLOSER}}(?:{{LUAU_UNREAD_SYMBOL}}|[^\\s])"

  # A closer that no block in a function's body takes: an `else` or
  # `elseif` no `if` owns, an `until` no `repeat` does, or, in a sparkle
  # closure, which closes at its `}`, an `end`. The
  # blocks and brackets inside a body close before such a closer and leave
  # it to the block around them; the body of a function, a define, a method
  # or a sparkle closure is the last such block, with no Luau block around
  # it to take the closer, so it reads the closer here, as an unread token,
  # and goes on to its own closer. Luau's reading reports the closer, in
  # Luau's words (`Expected 'end' (to close 'do' at line 2), got 'until'`),
  # rather than the closer falling out of the function into story text.
  LuauStrayCloser:
    tag: invalid
    name: invalid.illegal.unread.luau
    match: "{{LUAU_CLOSER}}"

  # The tokens of a `&` statement's code that its rules could not read
  # (`LuauSparkdownExplicitStatement`, `LuauSparkdownExplicitBlockBody`),
  # highlighted as Luau reads them. They are rules of their own, not
  # `LuauVariableName` and the other expression rules, so Sparkdown's own
  # reference checks leave the names alone; Luau's type checker still reads
  # them and warns about them as Luau does. A character Luau has no token
  # for (`!`, `?`) is invalid.
  LuauInvalidStatementToken:
    patterns:
      - { include: "#LuauComment" }
      # Luau's own string and number rules, so a long string (`[[end]]`) and
      # a hexadecimal number (`0xFF`) read as Luau reads them.
      - { include: "#LuauString" }
      - { include: "#LuauNumber" }
      - { include: "#LuauInvalidStatementLogicalKeyword" }
      - { include: "#LuauInvalidStatementKeyword" }
      - { include: "#LuauInvalidStatementName" }
      - { include: "#LuauInvalidStatementAccessor" }
      - { include: "#LuauInvalidStatementComma" }
      - { include: "#LuauInvalidStatementOperator" }
      - { include: "#LuauInvalidStatementCharacter" }

  LuauInvalidStatementLogicalKeyword:
    tag: logicOperator
    name: keyword.operator.logical.luau keyword.operator.wordlike.luau
    match: \b(?:{{LUAU_LOGICAL_KEYWORDS}})\b

  # Not `end`, `else`, `elseif` or `until`, which close a block around the
  # statement (see `LuauUnreadToken`).
  LuauInvalidStatementKeyword:
    tag: controlKeyword
    name: keyword.control.luau
    match: "{{LUAU_UNREAD_NOT_CLOSER}}\\b(?:{{LUAU_RESERVED_WORDS}})\\b"

  LuauInvalidStatementName:
    tag: variableName
    name: variable.other.readwrite.luau
    match: ({{LUAU_IDENTIFIER}})

  LuauInvalidStatementAccessor:
    tag: separator
    name: meta.template.expression.accessor.sd
    match: "[.]"

  LuauInvalidStatementComma:
    tag: operator
    name: keyword.operator.comma.luau
    match: "[,]"

  LuauInvalidStatementOperator:
    tag: operator
    name: keyword.operator.luau
    match: "[-+*/%^#=<>~(){}\\[\\]:;]"

  LuauInvalidStatementCharacter:
    tag: invalid
    name: invalid.illegal.luau
    match: "{{LUAU_UNREAD_NOT_CLOSER}}[^\\s]"

  # ----------------------------------------------------------------------------
  # For Loop
  # ----------------------------------------------------------------------------

  LuauSparkdownForLoop:
    begin: ({{WS}}*)(for)\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauForKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauSparkdownExplicitLoopCondition" }
      - { include: "#LuauSparkdownBlockBody" }
    # `(?<=\bend)` — close right after the do-block's `end` so one-line
    # `for ... do BODY end return x` doesn't swallow trailing
    # statements (see LuauSparkdownWhileLoop). The header ends at its line,
    # as every story statement does (#1907): its condition is the bounded
    # one, and a loop whose `do` is not on the header's line ends there,
    # missing it. This reverses #1344's condition on the line after `for` at
    # story scope, on the maintainer's instruction; in Luau code
    # (`LuauForLoop`) the condition still begins on the next line.
    end: (?={{BEAT}})|(?<=\bend)|$|(?={{WS}}*{{LUAU_CLOSER}})

  LuauForLoop:
    begin: ({{WS}}*)(for)\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauForKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauForCondition" }
      - { include: "#LuauBlockBody" }
      - { include: "#LuauUnreadToken" }
    # See LuauSparkdownWhileLoop's end comment (one-line trailing
    # statements, a condition on the next line).
    end: (?={{BEAT}})|(?<=\bend)|{{LUAU_NOT_AFTER_LOOP_KEYWORD}}$|(?={{WS}}*{{LUAU_CLOSER}})

  LuauForCondition:
    # See `LuauIfBlockCondition` for the multi-line trick: begin's
    # lookbehind is intra-line but the rule's patterns include
    # `Newline`/`RequiredWhitespace` so the condition can span
    # newlines until the `do` keyword closes it, or a `}` it did not open
    # closes the block around it.
    #
    # lookaround: the lookbehind opens the condition once (see
    # `LuauIfBlockCondition`). Without it, the empty begin opens again at the
    # whitespace before `do` (fixture luau-function/with-for-in-loop), and in
    # a layout it takes the loop's entries and body lines
    # (`LuauSparkleBlockEntries`; fixture
    # sparkle/layout-brace-control). A begin that also refuses the tokens the
    # condition ends before still opens an empty condition at any character
    # the condition cannot read, again and again (see `LuauWhileCondition`).
    # `(?!do\b)` keeps an empty condition from opening right before `do`
    # (`for do`), which `LuauDoBlock` or `LuauSparkleDoMark` reads instead.
    # No beat needs excluding: a beat begins its line, and the lookbehind
    # puts `for` before the begin on the same line.
    begin: (?<=for\b{{WS}}*)(?!do\b)
    patterns:
      - { include: "#LuauLineContinuation" }
      - { include: "#LuauIndexerLineContinuation" }
      - { include: "#LuauInKeyword" }
      - { include: "#LuauLoopHeaderLongCommentMethodColon" }
      - { include: "#LuauLoopHeaderMethodColon" }
      - { include: "#LuauExpression" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#RequiredWhitespace" }
      - { include: "#Newline" }
    # End just before `do` (allowing a leading WS run, but NOT bare
    # whitespace alone) so multi-line for-in headers parse. Any closer ends
    # it, not only `end`, as in `LuauWhileCondition`.
    end: (?={{BEAT}}|{{WS}}*{{LUAU_CLOSER}}|[)\]}])|(?={{WS}}*do\b)

  # ----------------------------------------------------------------------------
  # While Loop
  # ----------------------------------------------------------------------------

  LuauSparkdownWhileLoop:
    begin: ({{WS}}*)(while)\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauWhileKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauSparkdownExplicitLoopCondition" }
      - { include: "#LuauSparkdownBlockBody" }
    # `(?<=\bend)` closes the loop immediately after its do-block's
    # `end` token, so a one-line `while c do BODY end return x` doesn't
    # swallow the trailing statements into the loop (the `$` alternative
    # only fires at end-of-line). The lookbehind can't false-trigger on
    # identifiers like `friend` — `\b` requires a word boundary before
    # the `e`. The header ends at its line, as every story statement does
    # (#1907; see `LuauSparkdownForLoop`): a `while` whose condition or `do`
    # is not on its line ends there, missing it. In Luau code
    # (`LuauWhileLoop`) the condition still begins on the next line.
    end: (?={{BEAT}})|(?<=\bend)|$|(?={{WS}}*{{LUAU_CLOSER}})

  LuauWhileLoop:
    begin: ({{WS}}*)(while)\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauWhileKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauWhileCondition" }
      - { include: "#LuauBlockBody" }
      - { include: "#LuauUnreadToken" }
    # See LuauSparkdownWhileLoop's end comment (one-line trailing
    # statements, a condition on the next line).
    end: (?={{BEAT}})|(?<=\bend)|{{LUAU_NOT_AFTER_LOOP_KEYWORD}}$|(?={{WS}}*{{LUAU_CLOSER}})

  LuauWhileCondition:
    # See `LuauIfBlockCondition` for the multi-line trick.
    #
    # lookaround: as in `LuauForCondition`. Without the lookbehind the empty
    # begin opens again at the whitespace before `do`, ahead of the
    # `LuauDoBlock` in `LuauBlockBody` (fixture
    # flow/for-comment-before-condition). A begin that refuses `do` and `end`
    # instead (`(?!{{BEAT}}|{{WS}}*(?:do|end)\b)`) keeps every fixture, but
    # reopens an empty condition at each character the condition cannot
    # read: `while x) do` repeats it at the `)` until the parser's limit on
    # empty matches. `(?!do\b)` is as in `LuauForCondition`.
    begin: (?<=while\b{{WS}}*)(?!do\b)
    patterns:
      - { include: "#LuauLineContinuation" }
      - { include: "#LuauIndexerLineContinuation" }
      - { include: "#LuauLoopHeaderLongCommentMethodColon" }
      - { include: "#LuauLoopHeaderMethodColon" }
      - { include: "#LuauExpression" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    # Any closer ends the condition, not only `end`: the condition reads no
    # keyword, so at a closer it has not read (a column-0 `else` after an if
    # expression's then-arm ended) it would otherwise stay open, and
    # vscode-textmate would pass over the closer's first letter and read the
    # rest as a name.
    end: (?={{BEAT}}|{{WS}}*{{LUAU_CLOSER}}|[)\]}])|(?={{WS}}*do\b)

  # ----------------------------------------------------------------------------
  # Repeat Loop
  # ----------------------------------------------------------------------------

  LuauSparkdownRepeatLoop:
    begin: ({{WS}}*)(repeat)\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauRepeatKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauSparkdownBlockBody" }
    # See `LuauRepeatLoop`: the loop takes its own `until`.
    end: (?={{BEAT}})|({{WS}}*)(until)\b
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauUntilKeyword" }

  LuauRepeatLoop:
    begin: ({{WS}}*)(repeat)\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauRepeatKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauBlockBody" }
      - { include: "#LuauUnreadToken" }
    # The loop takes its own `until`, as a block takes its `end`, so a
    # `repeat` nested in another closes at the first `until` and leaves the
    # next one to the loop around it (#1195). A zero-width end would close
    # every `repeat` open at that `until` at once. Its condition is the
    # `LuauUntilCondition` that follows the loop.
    end: (?={{BEAT}})|({{WS}}*)(until)\b|(?={{WS}}*{{LUAU_END_OR_BRANCH}})
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauUntilKeyword" }

  # The condition after a `repeat` loop's `until`, which the loop's end
  # took. `until` is readable nowhere else (GRAMMAR.md §13.2), so the
  # lookbehind holds only right after a loop's end, and the condition is
  # read by the body around the loop, where it is included first. The
  # begin looks ahead for a token an expression can start with
  # (`LUAU_EXPRESSION_START`), so it never opens where the expression
  # can read nothing: an empty condition would open again at the same
  # position until the parser's empty-match limit stopped it.
  # lookaround: `LuauRepeatLoop`'s end takes the `until`, so the condition
  # cannot begin with it; without the lookbehind it would take any
  # expression of the body around the loop, which `LuauExpression` reads.
  LuauUntilCondition:
    begin: (?<=\buntil)({{WS}}*){{LUAU_EXPRESSION_START}}
    beginCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauExpression" }
      - { include: "#ExtraWhitespace" }
    # Terminate the until-condition at an upcoming statement-boundary
    # keyword, bare reassignment, or bare call statement so a one-line
    # `repeat BODY until cond return x` doesn't swallow `return x`
    # into the condition expression. Mirrors LuauReassignment's end
    # lookaheads (see there for why the call-statement alternative's name
    # is `LUAU_UNRESERVED_IDENTIFIER`). `until` is one of the keywords: in
    # `repeat repeat f() until a until b`, the inner loop's condition ends
    # before the outer loop's `until`. A `;` ends it too, as it ends every
    # statement (`until x >= 3;`), and the body around the loop reads it as
    # a `LuauSemicolonSeparator`.
    end: "(?={{BEAT}})|(?={{WS}}+{{LUAU_UNTIL_CONDITION_END_KEYWORDS}})|(?={{WS}}+{{LUAU_REASSIGNMENT_START}})|(?={{WS}}+{{LUAU_UNRESERVED_IDENTIFIER}}{{LUAU_SHARED_UNTIL_ACCESS_SUFFIX}}*{{WS}}*[(])|$|(?={{LUAU_GLUED_KEYWORD}})|(?={{WS}}*[;])|(?={{WS}}*[)\\]}])"

  # ----------------------------------------------------------------------------
  # Do Block
  # ----------------------------------------------------------------------------

  LuauSparkdownDoBlock:
    begin: ({{WS}}*)(do)\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauDoKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauSparkdownBlockBody" }
    end: (?={{BEAT}})|({{WS}}*)(end)\b({{LUAU_END_TRAILING_COMMENTS}})?|(?={{WS}}*{{LUAU_UNTIL}})
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauEndKeyword" }
      3:
        patterns:
          - { include: "#LuauComment" }

  # Pure code inside a story's single-line `& do ... end` island. Nested
  # do-blocks share the same line boundary; written function bodies retain
  # their own Luau scope through LuauFunctionDefinition.
  LuauSparkdownExplicitDoBlock:
    begin: ({{WS}}*)(do)\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauDoKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauSparkdownExplicitBlockBody" }
    end: (?={{BEAT}})|({{WS}}*)(end)\b({{LUAU_END_TRAILING_COMMENTS}})?|$
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauEndKeyword" }
      3:
        patterns:
          - { include: "#LuauComment" }

  # Used on a narrative `&` line, standing alone (`& if ... end`) or inside an
  # explicit do island. Its branches and nested blocks end at the same line;
  # the ordinary function rules remain multiline.
  LuauSparkdownExplicitIfBlock:
    begin: ({{WS}}*)(if)\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauIfKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauSparkdownExplicitIfCondition" }
      - { include: "#LuauSparkdownExplicitElseifBlock" }
      - { include: "#LuauSparkdownExplicitElseBlock" }
      - { include: "#LuauSparkdownExplicitBlockBody" }
    end: (?={{BEAT}})|({{WS}}*)(end)\b({{LUAU_END_TRAILING_COMMENTS}})?|$
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauEndKeyword" }
      3:
        patterns:
          - { include: "#LuauComment" }

  LuauSparkdownExplicitElseifBlock:
    begin: ({{WS}}*)(elseif)\b({{WS}}*)
    beginCaptures:
      1: { patterns: [{ include: "#OptionalWhitespace" }] }
      2: { patterns: [{ include: "#LuauElseifKeyword" }] }
      3: { emit: true, patterns: [{ include: "#OptionalWhitespace" }] }
    patterns:
      - { include: "#LuauSparkdownExplicitIfCondition" }
      - { include: "#LuauSparkdownExplicitBlockBody" }
    end: (?={{BEAT}})|(?={{WS}}*{{LUAU_IF_BRANCH_END_KEYWORDS}})|$

  LuauSparkdownExplicitElseBlock:
    begin: ({{WS}}*)(else)\b({{WS}}*)
    beginCaptures:
      1: { patterns: [{ include: "#OptionalWhitespace" }] }
      2: { patterns: [{ include: "#LuauElseKeyword" }] }
      3: { emit: true, patterns: [{ include: "#OptionalWhitespace" }] }
    patterns:
      - { include: "#LuauSparkdownExplicitBlockBody" }
    end: (?={{BEAT}})|(?={{WS}}*end\b)|$

  LuauSparkdownExplicitIfCondition:
    # lookaround: the keyword lookbehind opens the condition once after if or
    # elseif. Reordering cannot separate a condition from the same tokens in
    # LuauSparkdownExplicitBlockBody; an unanchored empty begin would reopen
    # over its assignments (StoryReturnText931 nested-if effects controls).
    # No line break is accepted in this narrative island outside a bracket.
    # It is also the condition of a story `if` or `elseif` (#1907), whose
    # block goes on past the header's line, so it never opens at a line end:
    # there it would end where it opened, and the block would open it again
    # at the same place until the parser's empty-match limit stopped it. A
    # header with no condition on its line has none, which the validator
    # reports as Luau's missing expression.
    begin: (?<=\b(?:else)?if\b{{WS}}*)(?!$)
    patterns:
      - { include: "#LuauParenthetical" }
      - { include: "#LuauSparkdownExplicitExpression" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#ExtraWhitespace" }
    end: ({{WS}}*)(then)\b|(?={{BEAT}}|{{END}}|[)\]}])|$
    endCaptures:
      1: { emit: true, patterns: [{ include: "#OptionalWhitespace" }] }
      2: { patterns: [{ include: "#LuauThenKeyword" }] }

  LuauSparkdownExplicitLoop:
    begin: ({{WS}}*)(for|while)\b({{WS}}*)
    beginCaptures:
      1: { patterns: [{ include: "#OptionalWhitespace" }] }
      2: { patterns: [{ include: "#LuauForKeyword" }, { include: "#LuauWhileKeyword" }] }
      3: { emit: true, patterns: [{ include: "#OptionalWhitespace" }] }
    patterns:
      - { include: "#LuauSparkdownExplicitDoBlock" }
      - { include: "#LuauSparkdownExplicitLoopCondition" }
      - { include: "#LuauSparkdownExplicitBlockBody" }
    # lookaround: LuauSparkdownExplicitDoBlock consumes the loop's written end.
    # Close after that child rather than before end, which would leave the loop
    # body unclosed; ordering cannot make the parent consume its child's closer
    # (StoryReturnText931 numeric/generic-for and while effects controls).
    end: (?={{BEAT}})|(?<=\bend)|$

  LuauSparkdownExplicitLoopCondition:
    # lookaround: anchor the header once after for/while so it cannot reopen
    # over LuauSparkdownExplicitBlockBody assignments. The specific do rule
    # precedes this header, so it owns do when the condition is missing.
    # It is also the condition of a story `for` or `while` (#1907), whose
    # loop reads its `do` block after the header, so it never opens at a
    # line end or right before `do`: there it would end where it opened,
    # and the loop would open it again at the same place until the parser's
    # empty-match limit stopped it.
    begin: (?<=\b{{LUAU_CONDITION_LOOP_KEYWORDS}}\b{{WS}}*)(?!$|do\b)
    # The whitespace between its names and `in` is a separator, as in
    # `LuauForCondition`, so the formatter keeps one space there
    # (`for i in pairs(t)`, never `for iinpairs(t)`).
    patterns:
      - { include: "#LuauInKeyword" }
      - { include: "#LuauParenthetical" }
      - { include: "#LuauSparkdownExplicitExpression" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#RequiredWhitespace" }
    end: (?={{BEAT}}|{{END}}|[)\]}]|{{WS}}*do\b)|$

  LuauSparkdownExplicitRepeatLoop:
    begin: ({{WS}}*)(repeat)\b({{WS}}*)
    beginCaptures:
      1: { patterns: [{ include: "#OptionalWhitespace" }] }
      2: { patterns: [{ include: "#LuauRepeatKeyword" }] }
      3: { emit: true, patterns: [{ include: "#OptionalWhitespace" }] }
    patterns:
      - { include: "#LuauSparkdownExplicitBlockBody" }
    # See `LuauRepeatLoop`: the loop takes its own `until`.
    end: (?={{BEAT}})|({{WS}}*)(until)\b|$
    endCaptures:
      1: { emit: true, patterns: [{ include: "#OptionalWhitespace" }] }
      2: { patterns: [{ include: "#LuauUntilKeyword" }] }

  LuauSparkdownExplicitBlockBody:
    patterns:
      # First: it opens only right after a `repeat` loop's `until`.
      - { include: "#LuauSparkdownExplicitUntilCondition" }
      - { include: "#LuauSparkdownExplicitBlockStatement" }
      - { include: "#LuauSparkdownExplicitDoBlock" }
      - { include: "#LuauSparkdownExplicitIfBlock" }
      - { include: "#LuauSparkdownExplicitLoop" }
      - { include: "#LuauSparkdownExplicitRepeatLoop" }
      - { include: "#LuauSparkdownExplicitReassignment" }
      - { include: "#LuauSparkdownExplicitExpression" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#LuauSemicolonSeparator" }
      - { include: "#ExtraWhitespace" }
      # The enclosing block takes its own closer first; other unmatched
      # punctuation remains code for native diagnostic recovery.
      - { include: "#LuauInvalidStatementToken" }

  # A nested marker stays in its code block. Leave the enclosing block's
  # branch/end/until token to that block instead of closing incomplete there.
  LuauSparkdownExplicitBlockStatement:
    begin: ({{WS}}*)([&])($|{{WS}}+)
    beginCaptures:
      1: { patterns: [{ include: "#OptionalWhitespace" }] }
      2: { patterns: [{ include: "#LuauExplicitStatementMark" }] }
      3: { patterns: [{ include: "#RequiredWhitespace" }] }
    patterns:
      - { include: "#LuauFunctionDefinition" }
      - { include: "#LuauSparkdownVariableDefinition" }
      - { include: "#LuauSparkdownExplicitBlockBody" }
    # lookaround: branch/end/until belong to the enclosing bounded block;
    # consuming them here steals its closer. A sibling reorder cannot close
    # an already-open marker scope (BoundedExplicitBlock931 ownership cases).
    end: (?={{BEAT}})|(?={{WS}}*(?:{{LUAU_IF_BRANCH_END_KEYWORDS}}|until\b))|$|(?=^)

  # Closed expression family for story-scope statements: `&` islands, and
  # the values, types and conditions of story declarations, reassignments
  # and `if` headers (#1907). Recursive expression children stop at the
  # story line; complete opaque strings/comments/regex, genuine function
  # headers/bodies and structured definitions retain their established
  # ownership. A bracket (`(`, `[`, `{`, in a value or a type) is the one
  # place a story statement goes on past its line: the family includes the
  # Luau bracket rules themselves, whose content spans lines as Luau reads
  # it, up to their closer, a block closer or the next scene or branch
  # header, where an unclosed opener gets Luau's missing-closer error.
  # Names/scopes/captures otherwise mirror Luau rules.
  # Zero-width wrapper contract used by the lookaround rationales below:
  # the named child owns its operator, argument opener, type or clause token;
  # its wrapper owns the recursive content. Consuming that token in a wrapper
  # begin/end instead changes the child's scope/capture and converter inputs.
  # Splitting a Switch or reordering specific children before fallback rules
  # is already used here, but cannot close a wrapper that has opened or give
  # a consumed introducer back to a child. The parent's end is unavailable
  # while that child is open. Shared guard variables factor identical token
  # tests; moving a zero-width test into one does not remove this ownership
  # requirement. BoundedExpressionFamily931's strict scope/counterpart cases
  # and the bounded-expression-family fixture pin the retained child shapes.
  # bounded-entry rationale: specific-before-fallback ordering and narrower
  # Switches already choose the named child. The wrapper must still open
  # before that child's token, or just after an introducer a sibling consumed
  # (GRAMMAR.md section 10.1's keyword-child exception). Reordering/splitting
  # children cannot make the wrapper test that prefix without taking it;
  # a parent's end cannot select its child entry. Tightening a variable to
  # consume the tested token changes its owner; shared guard variables
  # already factor exclusions without changing scope/capture ownership.
  # bounded-consuming-entry rationale: these rules consume a name, keyword
  # or comma shared with the named rival. Ordering the specific form first
  # still requires recognizing its suffix: f() versus f, name: T versus T,
  # and a comma gap versus another value. Splitting that prefix cannot decide
  # which suffix follows; a parent end acts after the entry decision. A global
  # name/operator restriction would reject the rival's valid form. Consuming
  # the suffix here instead would change the existing child's capture owner.
  # bounded-exit rationale: these predicates are the wrapper's own end,
  # leaving a delimiter/operator/next statement to its named owner. Reordering
  # or splitting children cannot close an already-open wrapper, and its
  # parent's end is unavailable while it is open. Tightening a variable into
  # a consuming end steals that next token. For example f().x .. value must
  # close the property chain before LuauConcatOperation claims the dots;
  # a method suffix must leave its colon and argument opener to their children.
  # bounded-invalid-token rationale: valid and invalid forms share the same
  # operator/type prefix; their operand or terminator decides invalid scope.
  # Reordering/splitting token rules cannot decide that from the prefix alone;
  # a parent's end cannot emit the prefix's invalid scope. Tightening the
  # operator/identifier variable globally would also reject its valid use.
  # These matches leave the following delimiter with its owner. Direct native
  # EOF and valid-value controls in BoundedExpressionFamily931 pin both paths.
  LuauSparkdownExplicitTernaryExpressionCondition:
    # lookaround: LuauThenExpression owns then; this condition opens only after if or elseif and stops before the clause delimiter.
    # See bounded-entry rationale above for the structural alternatives.
    begin: (?<=\b(?:else)?if\b{{WS}}*)({{WS}}*)(?!$|{{WS}}|then\b)
    beginCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauSparkdownExplicitLineContinuation" }
      - { include: "#LuauSparkdownExplicitIndexerLineContinuation" }
      - { include: "#LuauSparkdownExplicitExpression" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#ExtraWhitespace" }
    end: "({{WS}}+)(?=then\\b)|(?=^then\\b)|(?={{BEAT}}|[)}\\],;]|^{{LUAU_SHARED_TERNARY_CONDITION_LINE_END}})|{{AFTER_LUAU_GLUEABLE_OPERAND}}(then)\\b|$"
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauThenKeyword" }

  LuauSparkdownExplicitLineContinuation:
    # lookaround: LuauAccessPath owns ordinary identifiers; this continuation opens only at an accessor or operator and yields when its continuation ends.
    # See bounded-entry rationale above for the structural alternatives.
    begin: ^({{WS}}*)(?={{LUAU_LINE_CONTINUATION}})
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauSparkdownExplicitLogicalOperation" }
      - { include: "#LuauSparkdownExplicitAccessPart" }
      - { include: "#LuauParenthetical" }
      - { include: "#LuauString" }
      - { include: "#LuauTable" }
      - { include: "#LuauSparkdownExplicitArithmeticOperation" }
      - { include: "#LuauSparkdownExplicitCompareOperation" }
      - { include: "#LuauSparkdownExplicitConcatOperation" }
      - { include: "#LuauSparkdownExplicitTypeCastOperation" }
    # lookaround: LuauAccessPath owns ordinary identifiers; this continuation opens only at an accessor or operator and yields when its continuation ends.
    # See bounded-exit rationale above for the structural alternatives.
    end: "(?={{BEAT}})|(?!{{WS}}*{{LUAU_SHARED_PATH_OR_CALL_CONTINUATION}})|$"

  LuauSparkdownExplicitIndexerLineContinuation:
    # lookaround: LuauAccessPath owns ordinary identifiers; this indexer continuation opens only at an indexer and yields when its continuation ends.
    # See bounded-entry rationale above for the structural alternatives.
    begin: ^({{WS}}*)(?={{LUAU_INDEXER_LINE_CONTINUATION}})
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauSparkdownExplicitAccessPart" }
      - { include: "#LuauParenthetical" }
      - { include: "#LuauString" }
      - { include: "#LuauTable" }
      - { include: "#LuauSparkdownExplicitArithmeticOperation" }
      - { include: "#LuauSparkdownExplicitCompareOperation" }
      - { include: "#LuauSparkdownExplicitConcatOperation" }
      - { include: "#LuauSparkdownExplicitLogicalOperation" }
      - { include: "#LuauSparkdownExplicitTypeCastOperation" }
    # lookaround: LuauAccessPath owns ordinary identifiers; this indexer continuation opens only at an indexer and yields when its continuation ends.
    # See bounded-exit rationale above for the structural alternatives.
    end: "(?={{BEAT}})|(?!{{WS}}*{{LUAU_SHARED_PATH_OR_CALL_CONTINUATION}})|$"

  LuauSparkdownExplicitTypeLiteral:
    # lookaround: LuauExpression owns non-type keywords and values; this type scope opens only at a valid type introducer.
    # See bounded-entry rationale above for the structural alternatives.
    begin: "(?={{LUAU_SHARED_TYPE_KEYWORD_GUARD}}{{LUAU_NAME_OR_CONSTANT}}|[?]|[&]|[|]|[{]|[(]|[<]|[\"]|[']|[`]|[-][>]|[:]|[.][.][.])"
    patterns:
      - { include: "#LuauTypeTrailingBlockComment" }
      - { include: "#LuauComment" }
      - { include: "#LuauTypeOptionalOperator" }
      - { include: "#LuauTypeStrayOptionalOperator" }
      - { include: "#LuauTypeStrayColon" }
      - { include: "#LuauSparkdownExplicitTypeBinaryOperation" }
      - { include: "#LuauTypeTableStruct" }
      - { include: "#LuauString" }
      - { include: "#LuauBoolean" }
      - { include: "#LuauSparkdownExplicitTypeofFunction" }
      - { include: "#LuauVariadicType" }
      - { include: "#LuauVariadicTypePack" }
      - { include: "#LuauSparkdownExplicitQualifiedTypeReference" }
      - { include: "#LuauSparkdownExplicitNamedTypeReference" }
      - { include: "#LuauPrimitiveType" }
      - { include: "#LuauDivertTargetType" }
      - { include: "#LuauTypeFunctionParameters" }
      - { include: "#LuauSparkdownExplicitTypeGenerics" }
      - { include: "#LuauTypeName" }
      # This bounded type keeps same-line whitespace, but the authored
      # story-line boundary ends ordinary type continuation. Genuine
      # function headers retain their separate multiline type rules.
      - { include: "#ExtraWhitespace" }
    # Whitespace in the middle of a line ends the type, unless a type
    # operator has taken it in or the optional-type suffix follows it
    # (`number ?`); whitespace before the line break does not. It also ends
    # before a block comment on its line that code follows
    # (`function f(): number --[[c]] g()`, see `LUAU_BLOCK_COMMENT_ON_LINE`),
    # and before a keyword that cannot start a type. A value operator after
    # a complete type belongs outside it (notably after a `::` cast);
    # the function-type arrow and comments continue the type instead.
    # lookaround: the enclosing cast's end cannot close this nested scope.
    # Reordering/splitting these type patterns still leaves `+` unclaimed;
    # this type's own end must return it to LuauArithmeticOperation.
    # Tightening the shared value-operator variable would change values;
    # `<`, `->`, `::` and comments retain their existing type rules.
    end: (?={{BEAT}})|(?=[,;)\]}>=]|{{LUAU_TYPE_LINE_BREAK}}|{{LUAU_NON_TYPE_KEYWORDS}})|(?<=\S)(?={{LUAU_TYPE_WHITESPACE_END}}{{WS}}*\S)|(?<={{LUAU_TYPE_END}}{{WS}}*)(?={{LUAU_VALUE_OPERATOR_AFTER_TYPE}}|{{LUAU_BLOCK_COMMENT_ON_LINE}}{{LUAU_TYPE_CODE_AHEAD}})|$

  LuauSparkdownExplicitQualifiedTypeReference:
    begin: ({{LUAU_IDENTIFIER}}{{LUAU_TYPE_QUALIFIED_NAME_SEGMENT}}+){{_LUAU_TYPE_OPERATOR_AHEAD_}}
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauTypeName" }
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      3:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauTypeTrailingBlockComment" }
      - { include: "#LuauComment" }
      - { include: "#LuauSparkdownExplicitNamedTypeArguments" }
      - { include: "#LuauExtraTypeQualification" }
      - { include: "#LuauSparkdownExplicitTypeNameExtraQualifierContinuation" }
      - { include: "#ExtraWhitespace" }
    # lookaround: LuauNamedTypeArguments consumes the close and its whitespace;
    # this wrapper must yield to LuauCompareOperation before a second `<`.
    # LuauTypeTrailingBlockComment owns comments while the type continues;
    # code after a completed type must return to its surrounding statement.
    end: (?={{BEAT}})|(?<=[>]{{WS}}*)|(?={{WS}}*{{LUAU_NAMED_TYPE_FOLLOW}})|(?<={{LUAU_TYPE_END}}{{WS}}*)(?={{LUAU_BLOCK_COMMENT_ON_LINE}}{{LUAU_TYPE_CODE_AHEAD}})|$

  LuauSparkdownExplicitNamedTypeArguments:
    brackets: true
    begin: ([<])
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationAngleOpen" }
    patterns:
      - { include: "#LuauSparkdownExplicitTypeArgumentContents" }
    # lookaround: LuauReturnStatement must escape unfinished arguments before
    # indentation is consumed; splitting the argument contents cannot do so.
    end: (?={{BEAT}})|([>]){{_LUAU_TYPE_OPERATOR_AHEAD_}}|(?={{WS}}*{{LUAU_NON_TYPE_KEYWORDS}})|$
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationAngleClose" }
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      3:
        patterns:
          - { include: "#ExtraWhitespace" }

  LuauSparkdownExplicitTypeNameExtraQualifierContinuation:
    tag: invalid
    name: invalid.illegal.type-name-qualifier.luau
    begin: '{{LUAU_TYPE_QUALIFICATION_OPEN}}'
    patterns:
      - { include: "#LuauComment" }
      - { include: "#ExtraWhitespace" }
    end: (?={{BEAT}})|(?={{WS}}*{{LUAU_TYPE_QUALIFICATION_RECOVERY}})|({{LUAU_IDENTIFIER}}{{LUAU_TYPE_QUALIFIED_NAME_SEGMENT}}*)|$

  LuauSparkdownExplicitNamedTypeReference:
    begin: ({{LUAU_NAME_OR_CONSTANT}}){{_LUAU_TYPE_OPERATOR_AHEAD_}}
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauPrimitiveType" }
          - { include: "#LuauTypeName" }
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      3:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauSparkdownExplicitNamedTypeQualification" }
      - { include: "#LuauPrimitiveType" }
      - { include: "#LuauTypeName" }
      - { include: "#LuauTypeTrailingBlockComment" }
      - { include: "#LuauComment" }
      - { include: "#LuauSparkdownExplicitNamedTypeArguments" }
      - { include: "#ExtraWhitespace" }
    # lookaround: LuauNamedTypeArguments owns the close; the reference must
    # end immediately when that child returns, before another `<` can open.
    # LuauComment owns trivia until an argument list or another token follows.
    end: (?={{BEAT}})|(?<=[>]{{WS}}*)|(?={{WS}}*{{LUAU_NAMED_TYPE_FOLLOW}})|(?<={{LUAU_TYPE_END}}{{WS}}*)(?={{LUAU_BLOCK_COMMENT_ON_LINE}}{{LUAU_TYPE_CODE_AHEAD}})|$

  LuauSparkdownExplicitNamedTypeQualification:
    begin: ({{LUAU_TYPE_QUALIFICATION_OPEN}})
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauAccessorOperator" }
    patterns:
      - { include: "#LuauTypeTrailingBlockComment" }
      - { include: "#LuauComment" }
      - { include: "#LuauQualifiedTypeFinalName" }
      - { include: "#LuauSparkdownExplicitNamedTypeArguments" }
      - { include: "#LuauExtraTypeQualification" }
      - { include: "#LuauSparkdownExplicitTypeNameExtraQualifierContinuation" }
      - { include: "#ExtraWhitespace" }
    # lookaround: LuauNamedTypeArguments consumes the close; after it,
    # LuauCompareOperation owns another `<`. Before the qualified name is
    # read, LuauQualifiedTypeFinalName owns the identifier after dot trivia;
    # only a completed name may return another token to the statement.
    # A missing final name must also leave the type's closer to its parent.
    end: (?={{BEAT}})|(?<=[>]{{WS}}*)|(?<={{LUAU_NAME_BEHIND}}{{WS}}*)(?={{LUAU_NAMED_TYPE_FOLLOW}})|(?={{WS}}*{{LUAU_TYPE_QUALIFICATION_RECOVERY}})|$

  LuauSparkdownExplicitTypeGenerics:
    brackets: true
    begin: ([<])
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationAngleOpen" }
    patterns:
      - { include: "#LuauSparkdownExplicitTypeArgumentContents" }
    # lookaround: LuauReturnStatement must escape an unfinished generic type.
    # Splitting the type patterns cannot return indentation to its statement.
    end: ([>]){{_LUAU_TYPE_OPERATOR_AHEAD_}}|(?={{WS}}*{{LUAU_NON_TYPE_KEYWORDS}})|$
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationAngleClose" }
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      3:
        patterns:
          - { include: "#ExtraWhitespace" }

  LuauSparkdownExplicitThenExpression:
    # lookaround: LuauElseExpression owns the next clause; the then arm opens at then and yields before else or a following statement clause.
    # See bounded-entry rationale above for the structural alternatives.
    begin: (?=(?:then)\b)|(?<={{LUAU_THEN_BEHIND}})
    patterns:
      - { include: "#LuauSparkdownExplicitThenOperator" }
      - { include: "#LuauComment" }
      - { include: "#LuauSparkdownExplicitLineContinuation" }
      - { include: "#LuauSparkdownExplicitIndexerLineContinuation" }
      - { include: "#LuauSparkdownExplicitExpression" }
      - { include: "#ExtraWhitespace" }
    # Same-line clause keywords and punctuation still end this arm.
    # Unlike the ordinary Luau arm, its bounded continuation children
    # cannot take an else/elseif or value from the next story line.
    # lookaround: LuauElseExpression owns the next clause; the then arm opens at then and yields before else or a following statement clause.
    # See bounded-exit rationale above for the structural alternatives.
    end: "(?={{BEAT}}|{{WS}}*{{LUAU_SHARED_THEN_ARM_END}}|^{{LUAU_SHARED_THEN_NEXT_LINE_GUARD}})|(?<=^{{WS}}*)(?={{LUAU_STATEMENT_LINE_START}})|$"

  # The bounded twin of `LuauConditionalAlternatorBlock`, a candidate
  # alternator that ends at its line unless its arms opened on it.
  LuauSparkdownExplicitConditionalAlternatorBlock:
    begin: "({{WS}}*)({{LUAU_CONDITIONAL_ALTERNATOR_KEYWORDS}})({{WS}}*){{LUAU_SHARED_ALTERNATOR_NON_MEMBER}}{{LUAU_ALTERNATOR_CANDIDATE_AHEAD}}"
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauControlKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauSparkdownExplicitAlternatorArms" }
      - { include: "#LuauSparkdownExplicitAlternatorHead" }
    end: "{{LUAU_BOUNDED_CANDIDATE_END}}"

  # The bounded twin of `LuauAlternatorHead`.
  # lookaround: as for `LuauAlternatorHead`.
  LuauSparkdownExplicitAlternatorHead:
    begin: (?!{{WS}}*[|])
    patterns:
      - { include: "#LuauSparkdownExplicitConditionalAlternatorCondition" }
      - { include: "#LuauSparkdownExplicitExpression" }
      - { include: "#ExtraWhitespace" }
    end: (?={{BEAT}})|{{_LUAU_ALTERNATOR_HEAD_BEFORE_ARMS_}}|(?=[,;)\]}])|(?={{WS}}*{{LUAU_CLOSER}})|$|^
    endCaptures:
      1:
        patterns:
          - { include: "#LuauAlternatorSeparator" }
          - { include: "#ExtraWhitespace" }

  # The bounded twin of `LuauAlternatorArms`, which ends at its line. Like
  # it, the arms end before a branch keyword or `until` (`& if c then local
  # v = cycle | 1 | else end`), which the block around them owns.
  LuauSparkdownExplicitAlternatorArms:
    # lookaround: LuauAlternatorSeparator reads the `|` this opens before.
    begin: (?={{WS}}*[|])|{{LUAU_AFTER_HEAD_SEPARATOR}}
    patterns:
      - { include: "#LuauAlternatorSeparator" }
      - { include: "#LuauSparkdownExplicitBlockBody" }
    # lookaround: the block around reads the branch keyword or `until`.
    end: (?={{BEAT}})|({{WS}}*)(end)\b|(?=[,;)\]}])|(?={{WS}}*{{LUAU_BRANCH_OR_UNTIL}})|$
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauEndKeyword" }

  LuauSparkdownExplicitSequentialAlternatorBlock:
    # See `LuauSparkdownSequentialAlternatorBlock` for the leading-
    # lookahead structure — same shape, same zero-width-match concern.
    # lookaround: LuauAccessPath owns dotted keyword members; this alternator opens only at a standalone sequential keyword.
    # See bounded-consuming-entry rationale above; the modifier/keyword
    # prefix also occurs in ordinary member expressions such as queue.field.
    begin: "({{WS}}*)(?={{LUAU_SHARED_SEQUENTIAL_HEAD}}\\b{{LUAU_SHARED_ALTERNATOR_NON_MEMBER}}){{_LUAU_SHARED_SEQUENTIAL_MODIFIER_PREFIX_}}?({{LUAU_SEQUENTIAL_ALTERNATOR_KEYWORDS}})?{{LUAU_AFTER_SEQUENTIAL_HEAD}}({{WS}}*){{LUAU_ALTERNATOR_CANDIDATE_AHEAD}}"
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauControlKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      4:
        patterns:
          - { include: "#LuauControlKeyword" }
      5:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauSparkdownExplicitAlternatorArms" }
      - { include: "#LuauSparkdownExplicitAlternatorHead" }
    end: "{{LUAU_BOUNDED_CANDIDATE_END}}"

  LuauSparkdownExplicitFunctionCallShorthand:
    tag: meta
    name: meta.template.expression.function-shorthand.luau
    contentName: meta.embedded.line.luau
    brackets: true
    begin: ([{])([{])
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationBraceOpen" }
      2:
        patterns:
          - { include: "#PunctuationBraceOpen" }
    patterns:
      - { include: "#LuauSparkdownExplicitExpression" }
      - { include: "#ExtraWhitespace" }
    end: ([}])([}])?|$|(?={{WS}}*[)\]])
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationBraceClose" }
      2:
        patterns:
          - { include: "#PunctuationBraceClose" }

  LuauSparkdownExplicitCommaLineBreak:
    # lookaround: LuauCommaSeparator owns ordinary commas; this gap opens only after a comma and yields before a closing delimiter or following condition.
    # See bounded-consuming-entry rationale above for comma-gap selection.
    begin: ({{WS}}*)([,])({{WS}}*)(?=$|{{LUAU_COMMENT_START}})
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        tag: operator
        name: keyword.operator.comma.luau
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauSparkdownExplicitCommaLineBreakGap" }
      - { include: "#LuauSparkdownExplicitTernaryExpression" }
    # lookaround: LuauCommaSeparator owns ordinary commas; this gap opens only after a comma and yields before a closing delimiter or following condition.
    # See bounded-exit rationale above for the structural alternatives.
    end: (?={{BEAT}})|(?<!,{{WS}}*)(?!^if\b)|$

  LuauSparkdownExplicitGenericsInstantiation:
    begin: ([<][<])
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationDoubleAngleOpen" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#ExtraWhitespace" }
      - { include: "#LuauVariadicType" }
      - { include: "#LuauSparkdownExplicitTypeLiteral" }
      - { include: "#LuauCommaSeparator" }
    end: ([>][>])|$
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationDoubleAngleClose" }

  LuauSparkdownExplicitChainedFunctionCall:
    # lookaround: LuauFunctionCallParameters and LuauString own argument forms; this chain opens only at a call suffix and closes when no further suffix follows.
    # See bounded-entry rationale above for the structural alternatives.
    begin: ({{WS}}*)(?=[:]{{LUAU_IDENTIFIER}}{{WS}}*{{LUAU_FUNCTION_CALL_START}})
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauFunctionAccessor" }
      - { include: "#LuauParenthetical" }
    # lookaround: LuauFunctionCallParameters and LuauString own argument forms; this chain opens only at a call suffix and closes when no further suffix follows.
    # See bounded-exit rationale above for the structural alternatives.
    end: (?!{{WS}}*[:]{{LUAU_IDENTIFIER}}{{WS}}*{{LUAU_FUNCTION_CALL_START}})|$

  LuauSparkdownExplicitChainedPropertyAccess:
    # lookaround: LuauConcatOperation owns consecutive dots; this chain opens only at a member dot and ends before unrelated expressions.
    # See bounded-entry rationale above for the structural alternatives.
    begin: "(?<=\\))({{WS}}*)(?=[.]{{LUAU_SHARED_SINGLE_DOT_GUARD}}|{{LUAU_INDEXER_START}})"
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauDanglingAccessor" }
      - { include: "#LuauPropertyAccessor" }
      - { include: "#LuauPropertyIndexer" }
    # lookaround: LuauConcatOperation owns consecutive dots; this chain opens only at a member dot and ends before unrelated expressions.
    # See bounded-exit rationale above for the structural alternatives.
    end: "(?!{{WS}}*{{LUAU_SHARED_PROPERTY_CHAIN_START}})|$"

  LuauSparkdownExplicitReassignment:
    # The begin is `LuauReassignment`'s: it consumes the targets
    # (`LUAU_REASSIGNMENT_TARGETS`) and looks ahead for the assignment
    # operator. A target may include dot-accessors (`a.b`), bracket indexers
    # (`a[k]`), OR a multi-target comma list (`a, b`), so `a, b = 10, 20`
    # parses as a single reassignment. `LuauCommaSeparator` is in the inner
    # patterns too, for the commas between RHS expressions.
    # The marked opener recognizes a trailing target comma, but its bounded
    # children cannot obtain another target from the next story line.
    # Genuine Luau contexts use the original rule for multiline target lists.
    # lookaround: LuauVariableDefinition owns declarations; this reassignment opens only at identifier bindings followed by an assignment and ends before unrelated content.
    # See bounded-entry rationale above for the structural alternatives.
    begin: ({{WS}}*)({{LUAU_REASSIGNMENT_TARGETS}})(?={{WS}}*{{LUAU_REASSIGNMENT_TARGETS_END}})
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauSparkdownExplicitReassignmentTargets" }
    # End (`LUAU_REASSIGNMENT_END`) at: next BEAT (scene/branch), end of line, an upcoming
    # statement-boundary keyword (`if`, `while`, `for`, `repeat`, `do`,
    # `function`, `end`, `return`, `local`, `break`, `continue`,
    # `elseif`, `else`, `then`, `until`), an upcoming bare
    # reassignment statement, OR an upcoming bare call statement on
    # the same line. Without the keyword lookaheads,
    # `b = b * 2 if a == 1 then break end` would let
    # LuauReassignment swallow the trailing `if`; without the
    # reassignment-start lookahead, two adjacent same-line reassignments
    # (e.g. `a = 1 a = 2` or `b = 2 a, b = b, a`, common inside
    # single-line function bodies like
    # `function() a = 1 a = 2 return a end` and basic.luau's swap
    # idiom) would parse as a SINGLE LuauReassignment node — and the
    # lowerer would silently drop everything after the first pair. The
    # reassignment-start lookahead mirrors the `begin` pattern's shape:
    # `IDENT (access-chain)* WS* ASSIGN_OP`, where access-chain covers
    # `.field`, `[...]`, and `,IDENT` (the multi-target form).
    #
    # The call-statement lookahead (`IDENT (access-chain)* WS* (`)
    # handles `mt = { ... } setmetatable(a, mt)` — without it the
    # trailing call is swallowed into the value expression and
    # silently dropped by the lowerer. The call's leading name is
    # `LUAU_UNRESERVED_IDENTIFIER`, which no keyword is, because a
    # parenthesized operand after a logical keyword (`a = b and (x)`)
    # would otherwise match the call shape and truncate the value
    # mid-expression. This is
    # safe at value-START positions because every operator/separator
    # rule consumes its TRAILING whitespace, so a call that begins an
    # operand never has the `{{WS}}+` prefix this lookahead requires.
    #
    # `(?={{WS}}*[}])` closes the reassignment at a `}` boundary — needed
    # for an inline event-handler closure (`@input={ name = event.value }`,
    # see LuauSparkleHandlerClosure) whose LAST statement is a bare
    # reassignment: without it the reassignment runs out of patterns
    # before the closure's `}` and the scoped rule appends an
    # ERROR_INCOMPLETE node. Safe elsewhere — a reassignment is only ever
    # followed by `}` inside such a closure (function/if bodies close at
    # `end`/newline, never `}`; a table-literal VALUE consumes its own
    # braces before this end is checked, and reassignment statements never
    # appear inside a table).
    #
    # A block comment between the value and the next statement takes the
    # whitespace these lookaheads need, so `LUAU_VALUE_COMMENT_BEFORE_STATEMENT`
    # ends the reassignment before that comment instead. It also ends before
    # the closing brackets that a `LuauValueTrailingBlockComment` spanning
    # lines leaves when a statement follows them directly (`]]print(1)`).
    #
    # This reassignment belongs to a bounded marked story island.
    # Its comma child keeps same-line list ownership without taking the
    # following story line as another value. A trailing comma therefore
    # leaves an operand missing at authored EOF. Ordinary function-body
    # reassignments continue through their original LuauCommaLineBreak.
    patterns:
      - { include: "#LuauSparkdownExplicitCommaLineBreak" }
      - { include: "#LuauValueTrailingBlockComment" }
      - { include: "#LuauComment" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#LuauSparkdownExplicitAccessPath" }
      - { include: "#LuauSparkdownExplicitAssignmentOperation" }
      - { include: "#LuauSparkdownExplicitExpression" }
      - { include: "#ExtraWhitespace" }
    # lookaround: LuauVariableDefinition owns declarations; this reassignment opens only at identifier bindings followed by an assignment and ends before unrelated content.
    # See bounded-exit rationale above for the structural alternatives.
    end: "{{LUAU_REASSIGNMENT_END}}|(?={{LUAU_GLUED_KEYWORD}})|(?<=^{{WS}}*)(?={{LUAU_LIST_LINE_START_STATEMENT}})|$"

  # The marked reassignment's targets, read as `LuauReassignmentTargets`
  # reads them, with the bounded access path and expression.
  LuauSparkdownExplicitReassignmentTargets:
    patterns:
      - { include: "#LuauCommaSeparator" }
      - { include: "#LuauSparkdownExplicitAccessPath" }
      - { include: "#LuauSparkdownExplicitExpression" }
      - { include: "#LuauVariable" }
      - { include: "#ExtraWhitespace" }

  LuauSparkdownExplicitExpression:
    patterns:
      - { include: "#LuauComment" }
      # Returns belong to Luau code (functions and explicit `&` islands).
      # Story bodies try display text before their expression fallback.
      - { include: "#LuauSparkdownExplicitReturnStatement" }
      - { include: "#LuauSparkdownExplicitTernaryExpression" }
      - { include: "#LuauSparkdownExplicitAlternatorBlocks" }
      # Divert-target literal (`-> name`) is an inkjs-style first-class
      # value: e.g. `store x = -> place` stores a pointer to the `place`
      # scene that can later be re-invoked via `-> x`. Must come before
      # the arithmetic / compare operations so `->` isn't greedily split
      # into a `-` operator + `>` comparator.
      - { include: "#LuauSparkdownExplicitDivertTargetLiteral" }
      - { include: "#LuauSparkdownExplicitExpressionDeclarations" }
      - { include: "#LuauSparkdownExplicitAssignmentOperation" }
      - { include: "#LuauRegexLiteral" }
      - { include: "#LuauSparkdownExplicitGenericsInstantiation" }
      - { include: "#LuauSparkdownExplicitOperatorMissingOperand" }
      - { include: "#LuauSparkdownExplicitArithmeticOperation" }
      - { include: "#LuauSparkdownExplicitCompareOperation" }
      - { include: "#LuauSparkdownExplicitConcatOperation" }
      - { include: "#LuauSparkdownExplicitLengthOperation" }
      - { include: "#LuauSparkdownExplicitLogicalOperation" }
      - { include: "#LuauSparkdownExplicitTypeCastOperation" }
      - { include: "#LuauParenthetical" }
      - { include: "#LuauAttributeList" }
      - { include: "#LuauAttribute" }
      - { include: "#LuauNumber" }
      - { include: "#LuauString" }
      - { include: "#LuauBoolean" }
      - { include: "#LuauNil" }
      - { include: "#LuauKeyword" }
      # `LuauStdLibGlobals` is reached via `LuauVariable`'s capture
      # patterns when `_G` / `_VERSION` appear in expression context.
      # Including it standalone here too would short-circuit the
      # access-path lowerer (which needs to see them as identifiers
      # for the `STDLIB_CONSTANTS` short-circuit).
      # `LuauTypeofFunction` is intentionally NOT included in value
      # expressions: in value context, `type(x)` and `typeof(x)` are
      # Luau stdlib function calls returning the type-name string,
      # and route through `LuauFunctionCall` like any other call.
      # The type-context inclusion (in `LuauTypeName`'s pattern list)
      # handles the `local x: typeof(y) = ...` type-inference form
      # where `typeof(y)` is a type expression.
      # `new ClassName(...)` instance construction — must come BEFORE
      # `LuauAccessPath` so `new` isn't lexed as an ordinary
      # identifier path. The constructor's arg list parses as the
      # following sibling `LuauParenthetical` (the lowerer pairs them,
      # mirroring method-call arg pairing). A bare `new` variable
      # reference still works: the rule requires a following
      # identifier, so `print(new)` falls through to the access path.
      - { include: "#LuauNewExpression" }
      - { include: "#LuauSparkdownExplicitAccessPath" }
      - { include: "#LuauTable" }
      # `LuauChainedFunctionCall` must come BEFORE
      # `LuauTypeAnnotationOperation`: after a `LuauParenthetical`, a
      # following `:method(args)` sequence must be tokenized as a method-
      # call chain link, not as a type annotation. Since both rules begin
      # with `:`, the order here decides which takes priority — chained
      # method calls win.
      - { include: "#LuauSparkdownExplicitChainedFunctionCall" }
      # `LuauChainedPropertyAccess` extends a method-call chain with
      # trailing `.name` / `[expr]` links. Sits next to
      # `LuauChainedFunctionCall` so any mix of `:m(x).y[i]:n()` works.
      - { include: "#LuauSparkdownExplicitChainedPropertyAccess" }
      - { include: "#LuauSparkdownExplicitTypeAnnotationOperation" }

  LuauSparkdownExplicitReturnStatement:
    tag: meta
    name: meta.function.luau
    begin: ({{WS}}*)(return)\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauControlKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    # Narrative bodies reach this bounded return only through an explicit
    # Luau island. Its values stay on that authored line, except complete
    # opaque constructs owning their closing-line suffix. A bare narrative
    # `return` is prose. Genuine function returns use the ordinary rule and
    # retain multiline values; written block closers remain with the block.
    #
    # `;` alternative: `return f(x); end`-style one-liners close the
    # return statement before the separator (`;` no longer parses
    # inside `LuauExpression`).
    #
    # Unread-character alternative: as in `LuauReturnStatement`, the return
    # closes before a character no expression reads (`& return x名`).
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#LuauSparkdownExplicitExpression" }
    # lookaround: LuauIfBlock and LuauRepeatLoop own their closing keywords; this return yields before written closers while retaining same-line values and owned opaque/function spans.
    # See bounded-exit rationale above for the structural alternatives.
    end: (?={{BEAT}})|(?<!^{{WS}}*return{{WS}}*)(?=$)|(?={{WS}}|;|[$@!?\\]|[^\x00-\x7F])|(?={{LUAU_RETURN_END_KEYWORDS}})|(?=^{{LUAU_LINE_CONTINUATION}}|^{{LUAU_INDEXER_LINE_CONTINUATION}})

  LuauSparkdownExplicitTernaryExpression:
    begin: "{{LUAU_SHARED_TERNARY_CONTEXT}}({{WS}}*)(if)\\b({{WS}}*)"
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauIfKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauSparkdownExplicitTernaryExpressionCondition" }
      - { include: "#LuauSparkdownExplicitThenExpression" }
      - { include: "#LuauSparkdownExplicitElseExpression" }
      - { include: "#LuauSparkdownExplicitExpression" }
      # `then`/`else`/`elseif` fallback — `LuauKeyword` no longer matches
      # them (so other rules' end-patterns can fire), but the inline-
      # ternary form still needs them tokenised when they appear free-
      # standing inside this expression.
      - { include: "#LuauTernaryKeyword" }
      - { include: "#LuauCommaSeparator" }
      # The whitespace between a clause and the next keyword (`1 else`,
      # `1 elseif`) separates them, so the formatter keeps it as one space.
      # `RequiredWhitespace`, not `OptionalWhitespace`: a zero-width match in a
      # scoped rule's patterns would stall the parser (GRAMMAR.md §12).
      - { include: "#RequiredWhitespace" }
    # End on a BEAT (next scene/branch), at end-of-line (statement
    # position: `local x = if c then 1 else 2` must close before the
    # newline or the open scope swallows the next line and the
    # enclosing statement force-closes with ERROR_INCOMPLETE), or on
    # the natural closing delimiter of any expression-host context —
    # interpolation `}`, call/paren `)`, index `]`, an arg separator
    # `,` or `;`. Without the bracket alternatives, the rule would
    # only close via parent force-close (an
    # `[ScopedRule:LuauTernaryExpression] Incomplete scope` warning at
    # parse time).
    #
    # Bounded condition/arm/operator children cannot continue onto the next
    # story line. A missing clause or operand remains this island's error;
    # ordinary function ternaries retain their original multiline rules.
    # The final alternatives end the expression before the `then` of an if
    # statement or the `do` of a while loop whose condition it is:
    # `if if c then 1 else 2 then`. Each condition takes the whitespace
    # before its own `then`, and a `then` glued to its end, so whitespace
    # followed by `then` or `do` at this level only follows a completed arm,
    # and so does a glued `then` or `do`: `if if c then 1 else (2)then`.
    # Right after `elseif`, a `then` is that clause's own, with its condition
    # missing (`elseif then 2`).
    # A completed bounded arm yields the enclosing block's written closer.
    # lookaround: LuauIfBlock owns statement if and LuauElseifBlock owns elseif; this expression opens only in value context and yields to written block or clause closers.
    # See bounded-exit rationale above for the structural alternatives.
    end: "(?={{BEAT}}|$|{{WS}}*{{LUAU_SHARED_WRITTEN_BLOCK_CLOSER_KEYWORDS}}\\b|^{{LUAU_SHARED_TERNARY_NEXT_LINE_GUARD}}|[)}\\],;]|{{LUAU_SHARED_NOT_ELSEIF}}{{WS}}+{{LUAU_SHARED_CONDITION_CLOSER_KEYWORDS}}\\b|{{AFTER_LUAU_GLUEABLE_OPERAND}}{{LUAU_SHARED_CONDITION_CLOSER_KEYWORDS}}\\b)|(?<=^{{WS}}*)(?={{LUAU_STATEMENT_LINE_START}})"

  LuauSparkdownExplicitLogicalOperation:
    # lookaround: LuauLogicalOperator owns the operator token; this expression wrapper opens only at that token so ordinary values remain with LuauExpression.
    # See bounded-entry rationale above for the structural alternatives.
    begin: ({{WS}}*)(?={{LUAU_LOGICAL_KEYWORDS}})
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauSparkdownExplicitOperatorMissingOperand" }
      - { include: "#LuauSparkdownExplicitLogicalOperator" }
      - { include: "#LuauValueTrailingBlockComment" }
      - { include: "#LuauComment" }
      - { include: "#LuauSparkdownExplicitExpression" }
    end: (?={{BEAT}})|(?=$|{{WS}}|[,;)\]}])|{{LUAU_VALUE_COMMENT_BEFORE_STATEMENT}}|(?={{LUAU_GLUED_KEYWORD}})

  LuauSparkdownExplicitAccessPart:
    emit: true
    patterns:
      - { include: "#LuauSparkdownExplicitTypeAnnotationMissingType" }
      - { include: "#LuauFunctionAccessor" }
      - { include: "#LuauDanglingAccessor" }
      - { include: "#LuauPropertyAccessor" }
      - { include: "#LuauPropertyIndexer" }
      - { include: "#LuauFunctionDeclarationName" }
      - { include: "#LuauSparkdownExplicitFunctionCall" }
      - { include: "#LuauVariable" }

  LuauSparkdownExplicitArithmeticOperation:
    # lookaround: LuauArithmeticOperator owns the operator token; this expression wrapper opens only at that token so ordinary values remain with LuauExpression.
    # See bounded-entry rationale above for the structural alternatives.
    begin: ({{WS}}*)(?={{LUAU_ARITHMETIC_OPERATORS}})
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauSparkdownExplicitOperatorMissingOperand" }
      - { include: "#LuauSparkdownExplicitArithmeticOperator" }
      - { include: "#LuauValueTrailingBlockComment" }
      - { include: "#LuauComment" }
      - { include: "#LuauSparkdownExplicitExpression" }
    end: (?={{BEAT}})|(?=$|{{WS}}|[,;)\]}])|{{LUAU_VALUE_COMMENT_BEFORE_STATEMENT}}|(?={{LUAU_GLUED_KEYWORD}})

  LuauSparkdownExplicitCompareOperation:
    # lookaround: LuauCompareOperator owns the operator token; this expression wrapper opens only at that token so ordinary values remain with LuauExpression.
    # See bounded-entry rationale above for the structural alternatives.
    begin: ({{WS}}*)(?={{LUAU_COMPARE_OPERATORS}})
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauSparkdownExplicitOperatorMissingOperand" }
      - { include: "#LuauSparkdownExplicitCompareOperator" }
      - { include: "#LuauValueTrailingBlockComment" }
      - { include: "#LuauComment" }
      - { include: "#LuauSparkdownExplicitExpression" }
    end: (?={{BEAT}})|(?=$|{{WS}}|[,;)\]}])|{{LUAU_VALUE_COMMENT_BEFORE_STATEMENT}}|(?={{LUAU_GLUED_KEYWORD}})

  LuauSparkdownExplicitConcatOperation:
    # lookaround: LuauConcatOperator owns the operator token; this expression wrapper opens only at that token so ordinary values remain with LuauExpression.
    # See bounded-entry rationale above for the structural alternatives.
    begin: ({{WS}}*)(?={{LUAU_CONCAT_OPERATOR}})
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauSparkdownExplicitOperatorMissingOperand" }
      - { include: "#LuauSparkdownExplicitConcatOperator" }
      - { include: "#LuauValueTrailingBlockComment" }
      - { include: "#LuauComment" }
      - { include: "#LuauSparkdownExplicitExpression" }
    end: (?={{BEAT}})|(?=$|{{WS}}|[,;)\]}])|{{LUAU_VALUE_COMMENT_BEFORE_STATEMENT}}|(?={{LUAU_GLUED_KEYWORD}})

  LuauSparkdownExplicitTypeCastOperation:
    # lookaround: LuauTypeCastOperator owns the operator token; this expression wrapper opens only at that token so ordinary values remain with LuauExpression.
    # See bounded-entry rationale above for the structural alternatives.
    begin: ({{WS}}*)(?={{LUAU_TYPECAST_OPERATOR}})
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauSparkdownExplicitOperatorMissingOperand" }
      - { include: "#LuauSparkdownExplicitTypeCastOperator" }
      - { include: "#LuauTypeTrailingBlockComment" }
      - { include: "#LuauComment" }
      - { include: "#LuauSparkdownExplicitTypeLiteral" }
    # A cast's type can be followed by a value operator. The type reader
    # takes its trailing whitespace, so close here even without whitespace
    # remaining; `->` and comments still belong to the type.
    # lookaround: LuauArithmeticOperation must claim `+`/`-` outside the
    # cast. Reordering or splitting the type's patterns cannot hand a token
    # back to its parent; this end carries that boundary. Tightening the
    # shared value-operator variable would break ordinary expressions.
    # Excluding `::` prevents closing before the cast operator is consumed;
    # `<` belongs to LuauTypeGenerics and `->` to LuauTypeBinaryOperation.
    end: (?={{BEAT}})|(?={{LUAU_TYPE_LINE_BREAK}}|$|{{LUAU_TYPE_WHITESPACE_END}}|[,;)\]}>=]|{{LUAU_NON_TYPE_KEYWORDS}})|(?<={{LUAU_TYPE_END}}{{WS}}*)(?={{LUAU_VALUE_OPERATOR_AFTER_TYPE}}|{{LUAU_BLOCK_COMMENT_ON_LINE}}{{LUAU_TYPE_CODE_AHEAD}})

  LuauSparkdownExplicitTypeBinaryOperation:
    # lookaround: LuauTypeBinaryOperator owns the operator token; this expression wrapper opens only at that token so ordinary values remain with LuauExpression.
    # See bounded-entry rationale above for the structural alternatives.
    begin: ({{WS}}*)(?={{LUAU_TYPE_BINARY_OPERATORS}})
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauSparkdownExplicitTypeBinaryOperatorMissingType" }
      - { include: "#LuauSparkdownExplicitTypeBinaryOperator" }
      - { include: "#LuauComment" }
      - { include: "#LuauSparkdownExplicitTypeLiteral" }
    # lookaround: LuauArithmeticOperation must claim value operators after a
    # complete union, intersection or function return type. The nested type
    # has ended, but reordering its patterns or ending the enclosing cast
    # cannot close this intervening scope. Generic openers/arrows stay types.
    end: (?={{BEAT}})|(?={{LUAU_TYPE_LINE_BREAK}}|$|{{LUAU_TYPE_WHITESPACE_END}}|[,;)\]}>=]|{{LUAU_NON_TYPE_KEYWORDS}})|(?<={{LUAU_TYPE_END}}{{WS}}*)(?={{LUAU_VALUE_OPERATOR_AFTER_TYPE}}|{{LUAU_BLOCK_COMMENT_ON_LINE}}{{LUAU_TYPE_CODE_AHEAD}})

  LuauSparkdownExplicitTypeAnnotationOperation:
    # lookaround: LuauFunctionAccessor owns method colons; this annotation opens only at a type colon and yields before a following method call.
    # See bounded-entry rationale above for the structural alternatives.
    begin: ({{WS}}*)(?={{LUAU_TYPE_ANNOTATION_OPERATOR}})
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauSparkdownExplicitTypeAnnotationMissingType" }
      - { include: "#LuauSparkdownExplicitTypeAnnotationOperator" }
      - { include: "#LuauSparkdownExplicitTypeOperatorComments" }
      - { include: "#LuauComment" }
      - { include: "#LuauSparkdownExplicitTypeLiteral" }
    # lookaround: LuauFunctionAccessor owns method colons; this annotation opens only at a type colon and yields before a following method call.
    # See bounded-exit rationale above for the structural alternatives.
    end: (?={{BEAT}})|(?={{LUAU_TYPE_LINE_BREAK}}|$|{{LUAU_TYPE_WHITESPACE_END}}|[,;)\]}>=]|{{LUAU_NON_TYPE_KEYWORDS}})|(?<={{LUAU_TYPE_END}}{{WS}}*)(?={{LUAU_BLOCK_COMMENT_ON_LINE}}{{LUAU_TYPE_CODE_AHEAD}})

  LuauSparkdownExplicitTypeofFunction:
    # lookaround: LuauAccessPath owns ordinary names; this type expression opens only at the typeof keyword.
    # See bounded-consuming-entry rationale above; the parenthesized suffix
    # distinguishes this type expression from a type/name declaration.
    begin: (typeof|type)\b({{WS}}*)(?=[(])
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauTypeofFunctionName" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauTypeofFunctionParameters" }
    applyEndPatternLast: true
    end: (?={{BEAT}})|(?=$|.)

  LuauSparkdownExplicitTypeArgumentContents:
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauVariadicType" }
      - { include: "#LuauSparkdownExplicitTypeLiteral" }
      - { include: "#LuauTypeAssignmentOperator" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#ExtraWhitespace" }

  LuauSparkdownExplicitFunctionCall:
    # lookaround: LuauString owns string argument forms; this call scope opens only at parentheses or a supported string/table argument.
    # See bounded-consuming-entry rationale above for call/name selection;
    # parentheses, table and string suffixes remain with their named children.
    begin: ({{LUAU_IDENTIFIER}})({{WS}}*)(?={{LUAU_FUNCTION_CALL_START}})
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauStdLibFunctions" }
          - { include: "#LuauFunctionName" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauSparkdownExplicitGenericsInstantiation" }
      - { include: "#LuauFunctionCallParameters" }
      # Lua/Luau sugar: `f"..."`, `f'...'`, `f[[...]]`, `f{...}` are
      # function calls with a single string/table argument (equivalent
      # to `f("...")` / `f({...})`). Without these inclusions, the
      # function-call begin matches via `LUAU_FUNCTION_CALL_START` but
      # the body can't consume the argument, leaving the parser stuck
      # and desyncing the enclosing scope's `end`-matching.
      - { include: "#LuauString" }
      - { include: "#LuauTable" }
    applyEndPatternLast: true
    end: (?={{BEAT}})|(?=$|.)

  LuauSparkdownExplicitElseExpression:
    # lookaround: LuauThenExpression owns the preceding clause; this else arm opens only at else and yields before a following statement clause.
    # See bounded-entry rationale above for the structural alternatives.
    begin: (?=(?:else)\b)
    patterns:
      - { include: "#LuauSparkdownExplicitElseOperator" }
      - { include: "#LuauComment" }
      - { include: "#LuauSparkdownExplicitExpression" }
    # Mirror `LuauThenExpression`'s end. We need explicit
    # closing-delimiter alternatives because inline ternary lives
    # inside `{…}` / `(…)` / `[…]` and the bare `(?=$|{{WS}})` would
    # otherwise leave the scope to be force-closed by the outer
    # interpolation / paren / index rule. The glued alternative closes the
    # arm before the `then` or `do` of the statement whose condition it
    # ends (see `LuauTernaryExpression`'s `end`). An `else` at authored EOF
    # leaves this bounded arm empty; no following prose can supply its value.
    # lookaround: LuauThenExpression owns the preceding clause; this else arm opens only at else and yields before a following statement clause.
    # See bounded-exit rationale above for the structural alternatives.
    end: "(?={{BEAT}}|elseif\\b|$|{{WS}}|[)}\\],;]|{{AFTER_LUAU_GLUEABLE_OPERAND}}{{LUAU_SHARED_CONDITION_CLOSER_KEYWORDS}}\\b)|(?<=^{{WS}}*)(?={{LUAU_STATEMENT_LINE_START}})"

  LuauSparkdownExplicitAlternatorBlocks:
    patterns:
      - { include: "#LuauSparkdownExplicitConditionalAlternatorBlock" }
      - { include: "#LuauSparkdownExplicitSequentialAlternatorBlock" }

  LuauSparkdownExplicitArithmeticOperator:
    begin: ({{WS}}*)({{LUAU_ARITHMETIC_OPERATORS}})({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        tag: arithmeticOperator
        name: keyword.operator.arithmetic.luau
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    # `ExtraWhitespace` (not `OptionalWhitespace`) here on purpose:
    # this rule's `patterns:` list is iterated by the parser inside
    # an open scope, and `OptionalWhitespace` (`{{WS}}*`) can match
    # zero chars — that wedges the loop with no progress and trips
    # the `Too many consecutive empty matches` warning. See GRAMMAR.md
    # §12 ("Switch rules can't include OptionalWhitespace") — same
    # constraint applies to a scoped rule's own patterns list.
    patterns:
      - { include: "#ExtraWhitespace" }
    # lookaround: LuauExpression owns the following operand; this operator scope must close at its first non-whitespace token. Reordering children cannot close an already-open scope.
    # See bounded-exit rationale above for the structural alternatives.
    end: (?={{BEAT}})|(?!$|{{WS}})|(?=$)

  LuauSparkdownExplicitCompareOperator:
    begin: ({{WS}}*)({{LUAU_COMPARE_OPERATORS}})({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        tag: compareOperator
        name: keyword.operator.comparison.luau
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    # `ExtraWhitespace` (not `OptionalWhitespace`) here on purpose:
    # this rule's `patterns:` list is iterated by the parser inside
    # an open scope, and `OptionalWhitespace` (`{{WS}}*`) can match
    # zero chars — that wedges the loop with no progress and trips
    # the `Too many consecutive empty matches` warning. See GRAMMAR.md
    # §12 ("Switch rules can't include OptionalWhitespace") — same
    # constraint applies to a scoped rule's own patterns list.
    patterns:
      - { include: "#ExtraWhitespace" }
    # lookaround: LuauExpression owns the following operand; this operator scope must close at its first non-whitespace token. Reordering children cannot close an already-open scope.
    # See bounded-exit rationale above for the structural alternatives.
    end: (?={{BEAT}})|(?!$|{{WS}})|(?=$)

  LuauSparkdownExplicitConcatOperator:
    begin: ({{WS}}*)({{LUAU_CONCAT_OPERATOR}})({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        tag: special(operator)
        name: keyword.operator.concat.luau
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    # `ExtraWhitespace` (not `OptionalWhitespace`) here on purpose:
    # this rule's `patterns:` list is iterated by the parser inside
    # an open scope, and `OptionalWhitespace` (`{{WS}}*`) can match
    # zero chars — that wedges the loop with no progress and trips
    # the `Too many consecutive empty matches` warning. See GRAMMAR.md
    # §12 ("Switch rules can't include OptionalWhitespace") — same
    # constraint applies to a scoped rule's own patterns list.
    patterns:
      - { include: "#ExtraWhitespace" }
    # lookaround: LuauExpression owns the following operand; this operator scope must close at its first non-whitespace token. Reordering children cannot close an already-open scope.
    # See bounded-exit rationale above for the structural alternatives.
    end: (?={{BEAT}})|(?!$|{{WS}})|(?=$)

  LuauSparkdownExplicitLengthOperator:
    begin: ({{WS}}*)({{LUAU_LENGTH_OPERATOR}})({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        tag: special(operator)
        name: keyword.operator.length.luau
      3:
        # `#` is a prefix operator — no space between it and its
        # operand (`#myTable`, not `# myTable`). ExtraWhitespace
        # collapses any captured spaces to nothing.
        emit: true
        patterns:
          - { include: "#ExtraWhitespace" }
    # `ExtraWhitespace` (not `OptionalWhitespace`) here on purpose:
    # this rule's `patterns:` list is iterated by the parser inside
    # an open scope, and `OptionalWhitespace` (`{{WS}}*`) can match
    # zero chars — that wedges the loop with no progress and trips
    # the `Too many consecutive empty matches` warning. See GRAMMAR.md
    # §12 ("Switch rules can't include OptionalWhitespace") — same
    # constraint applies to a scoped rule's own patterns list.
    patterns:
      - { include: "#ExtraWhitespace" }
    # lookaround: LuauExpression owns the following operand; this operator scope must close at its first non-whitespace token. Reordering children cannot close an already-open scope.
    # See bounded-exit rationale above for the structural alternatives.
    end: (?={{BEAT}})|(?!$|{{WS}})|(?=$)

  LuauSparkdownExplicitLogicalOperator:
    begin: ({{WS}}*)({{LUAU_LOGICAL_KEYWORDS}})({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        tag: special(logicOperator)
        name: keyword.operator.logical.luau keyword.operator.wordlike.luau
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    # `ExtraWhitespace` (not `OptionalWhitespace`) here on purpose:
    # this rule's `patterns:` list is iterated by the parser inside
    # an open scope, and `OptionalWhitespace` (`{{WS}}*`) can match
    # zero chars — that wedges the loop with no progress and trips
    # the `Too many consecutive empty matches` warning. See GRAMMAR.md
    # §12 ("Switch rules can't include OptionalWhitespace") — same
    # constraint applies to a scoped rule's own patterns list.
    patterns:
      - { include: "#ExtraWhitespace" }
    # lookaround: LuauExpression owns the following operand; this operator scope must close at its first non-whitespace token. Reordering children cannot close an already-open scope.
    # See bounded-exit rationale above for the structural alternatives.
    end: (?={{BEAT}})|(?!$|{{WS}})|(?=$)

  LuauSparkdownExplicitTypeCastOperator:
    begin: ({{WS}}*)({{LUAU_TYPECAST_OPERATOR}})({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        tag: typeOperator
        name: keyword.operator.typecast.luau
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    # `ExtraWhitespace` (not `OptionalWhitespace`) here on purpose:
    # this rule's `patterns:` list is iterated by the parser inside
    # an open scope, and `OptionalWhitespace` (`{{WS}}*`) can match
    # zero chars — that wedges the loop with no progress and trips
    # the `Too many consecutive empty matches` warning. See GRAMMAR.md
    # §12 ("Switch rules can't include OptionalWhitespace") — same
    # constraint applies to a scoped rule's own patterns list.
    patterns:
      - { include: "#ExtraWhitespace" }
    # lookaround: LuauExpression owns the following operand; this operator scope must close at its first non-whitespace token. Reordering children cannot close an already-open scope.
    # See bounded-exit rationale above for the structural alternatives.
    end: (?={{BEAT}})|(?!$|{{WS}})|(?=$)

  LuauSparkdownExplicitCommaLineBreakGap:
    # lookaround: LuauCommaSeparator owns ordinary commas; this gap opens only at a line-ending comma and yields at the next non-trivia token.
    # See bounded-entry rationale above for the structural alternatives.
    begin: (?=$|{{LUAU_COMMENT_START}})
    patterns:
      - { include: "#LuauComment" }
      - { include: "#ExtraWhitespace" }
    # lookaround: LuauCommaSeparator owns ordinary commas; this gap opens only at a line-ending comma and yields at the next non-trivia token.
    # See bounded-exit rationale above for the structural alternatives.
    end: (?={{BEAT}})|(?!$|{{WS}}|{{LUAU_COMMENT_START}})|(?=$)

  LuauSparkdownExplicitTypeBinaryOperator:
    begin: ({{WS}}*)({{LUAU_TYPE_BINARY_OPERATORS}})({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        tag: typeOperator
        name: keyword.operator.type.luau
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    # `ExtraWhitespace` (not `OptionalWhitespace`) here on purpose:
    # this rule's `patterns:` list is iterated by the parser inside
    # an open scope, and `OptionalWhitespace` (`{{WS}}*`) can match
    # zero chars — that wedges the loop with no progress and trips
    # the `Too many consecutive empty matches` warning. See GRAMMAR.md
    # §12 ("Switch rules can't include OptionalWhitespace") — same
    # constraint applies to a scoped rule's own patterns list.
    # Comments after the operator are its own, as in
    # `LuauTypeBinaryOperator`; the operator still ends at its line.
    patterns:
      - { include: "#ExtraWhitespace" }
      - { include: "#LuauSparkdownExplicitTypeOperatorComments" }
      - { include: "#LuauComment" }
    # lookaround: LuauExpression owns the following operand; this operator scope must close at its first non-whitespace token. Reordering children cannot close an already-open scope.
    # See bounded-exit rationale above for the structural alternatives.
    end: (?={{BEAT}})|(?!$|{{WS}}|{{LUAU_COMMENT_START}})|(?=$)

  # `LuauTypeOperatorComments` in a story statement's type: the same
  # reading, ending at its line (#1907), with the story generics
  # (`local id: --[[c]] <T>(T) -> T = f`, #1321).
  # lookaround: the begin opens at a block comment only, where the parent's
  # LuauComment would read it; this rule is tried first so the comments and
  # the generics after them are read in one scope, which a match on the
  # comment alone cannot carry on to the generics.
  LuauSparkdownExplicitTypeOperatorComments:
    begin: (?={{WS}}*{{LUAU_COMMENT_START}}\[=*\[)
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauSparkdownExplicitTypeGenerics" }
    # lookaround: LuauSparkdownExplicitTypeLiteral reads a type after the
    # comments, and the ends around the operator read a `<` after a
    # comment's close as a comparison after a complete type; see
    # `LuauTypeOperatorComments`.
    end: (?={{BEAT}})|(?!{{WS}}*{{LUAU_BLOCK_COMMENT_OR_GENERICS_START}})|$

  LuauSparkdownExplicitTypeAnnotationOperator:
    begin: ({{WS}}*)({{LUAU_TYPE_ANNOTATION_OPERATOR}})({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        tag: typeOperator
        name: keyword.operator.type.luau
      3:
        # Prettier-style: one space after `:` in type annotations
        # (`c: companion`). OptionalWhitespace's zero-width match
        # still emits an empty node (see textmate-grammar-tree's
        # MatchRule), so the formatter's mid-line "separator"
        # dispatch fires and inserts the space.
        patterns:
          - { include: "#OptionalWhitespace" }
    # `ExtraWhitespace` (not `OptionalWhitespace`) here on purpose:
    # this rule's `patterns:` list is iterated by the parser inside
    # an open scope, and `OptionalWhitespace` (`{{WS}}*`) can match
    # zero chars — that wedges the loop with no progress and trips
    # the `Too many consecutive empty matches` warning. See GRAMMAR.md
    # §12 ("Switch rules can't include OptionalWhitespace") — same
    # constraint applies to a scoped rule's own patterns list.
    patterns:
      - { include: "#ExtraWhitespace" }
    # lookaround: LuauExpression owns the following operand; this operator scope must close at its first non-whitespace token. Reordering children cannot close an already-open scope.
    # See bounded-exit rationale above for the structural alternatives.
    end: (?={{BEAT}})|(?!$|{{WS}})|(?=$)

  # Missing operands at a bounded line end cannot borrow the next story line.
  LuauSparkdownExplicitOperatorMissingOperand:
    tag: invalid
    name: invalid.illegal.luau
    # lookaround: LuauExpression and LuauTypeLiteral own valid operands; this diagnostic matches only a bounded end or a terminator, excluding member words and divert arrows.
    # See bounded-invalid-token rationale above for the structural alternatives.
    match: "({{WS}}*)(?<![-])(?![-][>])({{LUAU_ASSIGNMENT_OPERATORS}}|{{LUAU_ARITHMETIC_OPERATORS}}|{{LUAU_COMPARE_OPERATORS}}|{{LUAU_CONCAT_OPERATOR}}|{{LUAU_TYPECAST_OPERATOR}}|{{LUAU_LENGTH_OPERATOR}}|(?<![\\w.]){{LUAU_SHARED_MISSING_OPERAND_WORDS}}(?!\\w))({{WS}}*)(?=$|{{_LUAU_EXPRESSION_END_AHEAD_}})"

  LuauSparkdownExplicitTypeAnnotationMissingType:
    tag: invalid
    name: invalid.illegal.luau
    # lookaround: LuauExpression and LuauTypeLiteral own valid operands; this diagnostic matches only a bounded end or a terminator, excluding member words and divert arrows.
    # See bounded-invalid-token rationale above for the structural alternatives.
    match: ({{WS}}*)({{LUAU_TYPE_ANNOTATION_OPERATOR}})({{WS}}*)(?={{LUAU_SPARKDOWN_TYPE_ANNOTATION_END_AHEAD}})

  LuauSparkdownExplicitTypeBinaryOperatorMissingType:
    tag: invalid
    name: invalid.illegal.luau
    # lookaround: LuauExpression and LuauTypeLiteral own valid operands; this diagnostic matches only a bounded end or a terminator, excluding member words and divert arrows.
    # See bounded-invalid-token rationale above for the structural alternatives.
    match: ({{WS}}*)((?:[&]|[|])|(?<={{LUAU_TYPE_END}}{{WS}}*)[-][>])({{WS}}*)(?={{LUAU_SPARKDOWN_TYPE_ANNOTATION_END_AHEAD}})

  # The bounded twin of `LuauThenOperator`, with the same two begin
  # alternatives; it never reads past its line.
  # lookaround: the second alternative's lookbehind is
  # `LuauSparkdownExplicitThenExpression`'s, and its `(?={{WS}})` keeps it
  # from opening empty, as in `LuauThenOperator`; at the line end the arm
  # itself ends first.
  LuauSparkdownExplicitThenOperator:
    begin: ((?:then)\b)({{WS}}*)|(?<={{LUAU_THEN_BEHIND}})(?={{WS}})({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauThenKeyword" }
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#ExtraWhitespace" }
    # lookaround: LuauExpression owns the following operand; this operator scope must close at its first non-whitespace token. Reordering children cannot close an already-open scope.
    # See bounded-exit rationale above for the structural alternatives.
    end: (?=$)|(?!{{WS}})

  LuauSparkdownExplicitElseOperator:
    begin: ((?:else)\b)({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauElseKeyword" }
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#ExtraWhitespace" }
    # lookaround: LuauExpression owns the following operand; this operator scope must close at its first non-whitespace token. Reordering children cannot close an already-open scope.
    # See bounded-exit rationale above for the structural alternatives.
    end: (?=$)|(?!{{WS}})

  LuauSparkdownExplicitConditionalAlternatorCondition:
    # lookaround: LuauConditionalAlternatorBlock owns its keyword; this condition opens only immediately after that introducer.
    # See bounded-entry rationale above for the structural alternatives.
    begin: "(?<={{LUAU_SHARED_CONDITIONAL_ALTERNATOR_HEAD}}{{WS}}*){{LUAU_EXPRESSION_START}}"
    patterns:
      - { include: "#LuauSparkdownExplicitExpression" }
      - { include: "#ExtraWhitespace" }
    end: (?={{BEAT}})|(?=$|{{WS}}|[,;)\]}|])

  SparkdownExplicitTagContent:
    tag: definition(docComment)
    name: punctuation.definition.comment.content.sd
    # lookaround: Tag owns the marker; this content scope opens only when content follows it.
    # See bounded-entry rationale above for the structural alternatives.
    begin: (?=.)
    patterns:
      - { include: "#LuauSparkdownExplicitFunctionCallShorthand" }
      - { include: "#LuauSparkdownExplicitInterpolatedStringExpression" }
      - { include: "#TagText" }
    end: (?=$|{{TAG_START}})

  LuauSparkdownExplicitVariableDefinition:
    begin: ({{WS}}*)({{LUAU_SCOPE_MODIFIERS}})\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauScopeModifier" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    # Multi-target multi-RHS shape (`local a, b = 10, 20`): each
    # `LuauVariableAssignment` terminates at `,` so the comma + any
    # subsequent expressions live at the `LuauVariableDefinition`
    # level. `LuauCommaSeparator` handles the comma between targets
    # AND the comma between RHS values; `LuauExpression` (added here
    # rather than only inside `LuauVariableAssignment`) captures
    # trailing RHS values after the assignment's `= <first-value>`
    # has terminated at the first comma. The lowerer reassembles the
    # multi-RHS list by walking the def's content children.
    #
    # This declaration belongs to a bounded marked story island. A comma
    # cannot continue its list into the next story line. The bounded value
    # and assignment children leave a missing operand at authored EOF;
    # genuine function declarations use the original multiline rules.
    #
    # `local function`, `store function` and `const function` are
    # `LuauFunctionDefinition`, whose begin takes the scope modifier itself:
    # every list that includes either declaration rule includes
    # `LuauFunctionDefinition` before it (`LuauDeclarations` for this rule).
    # `luauVariableDefinitionValue.test.ts` holds the two rules' begin,
    # captures and end together.
    patterns:
      - { include: "#LuauSparkdownExplicitCommaLineBreak" }
      - { include: "#LuauValueTrailingBlockComment" }
      - { include: "#LuauComment" }
      - { include: "#LuauSparkdownExplicitTargetTypeCast" }
      - { include: "#LuauSparkdownExplicitVariableAssignment" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#LuauSparkdownExplicitVariableDefinitionValue" }
    # The definition's parts follow one another directly (a value's call
    # arguments are a sibling `LuauParenthetical`), or after whitespace
    # when the next part is a comment, a comma or the `=` before the values
    # (a target with a type annotation ends before its ` = value`). It
    # ends at whitespace before anything else, so a statement later on the
    # line (`local x = 5 return x`) is the enclosing body's next statement;
    # at a `;` or a closing bracket; and at the authored line's end. The
    # bounded type/value children cannot carry a trailing comma or ordinary
    # expression into the next line, regardless of indentation. Complete
    # opaque constructs and genuine functions retain their own ownership;
    # the declaration resumes after those children return. The original
    # LuauVariableDefinition alone uses multiline list continuation.
    # lookaround: LuauAssignmentOperation and LuauTypeAnnotationOperation own declaration values and annotations; this declaration ends only after their content is complete.
    # See bounded-exit rationale above for the structural alternatives.
    end: "(?={{BEAT}})|(?=^|$|[;)\\]}])|(?={{WS}}+{{LUAU_SHARED_DECLARATION_END_GUARD}})|(?={{LUAU_DECLARATION_STOP}})|(?<={{LUAU_TYPE_END}}{{WS}}*)(?={{LUAU_BLOCK_COMMENT_ON_LINE}}{{LUAU_STATEMENT_CODE_AHEAD}})|{{LUAU_VALUE_COMMENT_BEFORE_STATEMENT}}"

  LuauSparkdownExplicitTargetTypeCast:
    # No lookaround inside the lookbehind: VS Code's Oniguruma refuses one
    # there ("invalid pattern in look-behind").
    # lookaround: LuauVariableDefinition owns bindings; this target cast opens only after a scope modifier and binding name.
    # See bounded-entry rationale above for the structural alternatives.
    begin: "(?<=\\b{{LUAU_SHARED_SCOPE_MODIFIER_WORD}}{{WS}}+[^=\\n\\r]*{{LUAU_NAME_BEHIND}}{{WS}}*)({{LUAU_TYPECAST_OPERATOR}})({{WS}}*)"
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauTargetTypeCastOperator" }
      2:
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauSparkdownExplicitTypeLiteral" }
    end: (?={{BEAT}})|(?={{LUAU_TYPE_LINE_BREAK}}|$|{{LUAU_TYPE_WHITESPACE_END}}|[,;)\]}>=]|{{LUAU_NON_TYPE_KEYWORDS}})

  LuauSparkdownExplicitVariableAssignment:
    # lookaround: LuauFunctionAccessor owns method colons and LuauTypeofFunction owns typeof; this binding yields to annotations or assignment values.
    # See bounded-consuming-entry rationale above; annotation/assignment
    # suffixes distinguish a binding from an ordinary value name.
    begin: "(?!{{LUAU_RESERVED_WORDS}}{{WS}}*(?:--|,|$))({{LUAU_IDENTIFIER}})({{WS}}*)(?={{WS}}*{{LUAU_SHARED_VARIABLE_HEAD_END}})"
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauVariableName" }
      2:
        # `Separator` (normalize to one space) rather than
        # `ExtraWhitespace` (collapse to nothing): the formatter would
        # otherwise eat the space between the variable name and the
        # following `=` / `+=` / `-=` operator, producing `x= 1`.
        patterns:
          - { include: "#OptionalWhitespace" }
    # The begin takes in the whitespace before a comment that follows the
    # target, and the comment stands between the target and its annotation,
    # `=` or comma (`local x --[[c]] = 1`, #1212). The end cannot match before
    # the comment, so without `LuauComment` here the rule is left unfinished.
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauSparkdownExplicitTargetTypeCastAfterComment" }
      - { include: "#LuauSparkdownExplicitTypeAnnotationOperation" }
      - { include: "#LuauSparkdownExplicitAssignmentOperation" }
      - { include: "#LuauFunctionDefinition" }
    # Terminate at `,` (in addition to WS / EOL / `BEAT`) so the
    # outer `LuauVariableDefinition` owns the comma between
    # multi-RHS values. Previously the VA's own `LuauCommaSeparator`
    # pattern consumed the comma and an `ERROR_INCOMPLETE` followed —
    # the trailing RHS values were silently dropped from the tree.
    # Authored EOF also ends an unfinished bounded type annotation.
    # Terminate before `;` too, so `local x = f();` closes this
    # rule and `LuauVariableDefinition` before the `;`, which the enclosing
    # statement context reads as `LuauSemicolonSeparator`. It ends before the
    # `]` that a type's trailing block comment leaves before code
    # (`LuauTypeTrailingBlockCommentClose`), as the declaration does.
    # lookaround: LuauFunctionAccessor owns method colons and LuauTypeofFunction owns typeof; this binding yields to annotations or assignment values.
    # See bounded-exit rationale above for the structural alternatives.
    end: (?={{BEAT}})|(?=^|$|{{WS}}|[,;)\]}])|(?<={{LUAU_TYPE_END}}{{WS}}*)(?={{LUAU_BLOCK_COMMENT_ON_LINE}}{{LUAU_STATEMENT_CODE_AHEAD}})|{{LUAU_VALUE_COMMENT_BEFORE_STATEMENT}}|(?={{LUAU_GLUED_KEYWORD}})

  LuauSparkdownExplicitAssignmentOperation:
    # lookaround: LuauAssignmentOperator owns assignment tokens; this value wrapper opens only at an assignment operator.
    # See bounded-entry rationale above for the structural alternatives.
    begin: ({{WS}}*)(?={{LUAU_ASSIGNMENT_OPERATORS}})
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauSparkdownExplicitOperatorMissingOperand" }
      - { include: "#LuauAssignmentOperator" }
      - { include: "#LuauValueTrailingBlockComment" }
      - { include: "#LuauComment" }
      - { include: "#LuauSparkdownExplicitExpression" }
    # An ordinary marked assignment value ends at authored EOF, including
    # an unfinished if expression; it cannot take the next prose line.
    # Complete opaque constructs and genuine functions keep their own spans.
    # It also yields before a block comment followed by another statement.
    end: (?={{BEAT}})|(?=$|^|{{WS}}|[,;)\]}])|{{LUAU_VALUE_COMMENT_BEFORE_STATEMENT}}|(?={{LUAU_GLUED_KEYWORD}})

  LuauSparkdownExplicitVariableDefinitionValue:
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauSparkdownExplicitTernaryExpression" }
      - { include: "#LuauSparkdownExplicitAlternatorBlocks" }
      - { include: "#LuauSparkdownExplicitDivertTargetLiteral" }
      - { include: "#LuauFunctionDefinition" }
      - { include: "#LuauSparkdownExplicitAssignmentOperation" }
      - { include: "#LuauRegexLiteral" }
      - { include: "#LuauSparkdownExplicitGenericsInstantiation" }
      - { include: "#LuauSparkdownExplicitOperatorMissingOperand" }
      - { include: "#LuauSparkdownExplicitArithmeticOperation" }
      - { include: "#LuauSparkdownExplicitCompareOperation" }
      - { include: "#LuauSparkdownExplicitConcatOperation" }
      - { include: "#LuauSparkdownExplicitLengthOperation" }
      - { include: "#LuauSparkdownExplicitLogicalOperation" }
      - { include: "#LuauSparkdownExplicitTypeCastOperation" }
      - { include: "#LuauParenthetical" }
      - { include: "#LuauAttributeList" }
      - { include: "#LuauAttribute" }
      - { include: "#LuauNumber" }
      - { include: "#LuauString" }
      - { include: "#LuauBoolean" }
      - { include: "#LuauNil" }
      - { include: "#LuauUnitKeywords" }
      - { include: "#LuauNewExpression" }
      - { include: "#LuauSparkdownExplicitAccessPath" }
      - { include: "#LuauTable" }
      - { include: "#LuauSparkdownExplicitChainedFunctionCall" }
      - { include: "#LuauSparkdownExplicitChainedPropertyAccess" }
      - { include: "#LuauSparkdownExplicitTypeAnnotationOperation" }

  LuauSparkdownExplicitLengthOperation:
    # lookaround: LuauLengthOperator owns the operator token; this expression wrapper opens only at that token so ordinary values remain with LuauExpression.
    # See bounded-entry rationale above for the structural alternatives.
    begin: ({{WS}}*)(?={{LUAU_LENGTH_OPERATOR}})
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauSparkdownExplicitOperatorMissingOperand" }
      - { include: "#LuauSparkdownExplicitLengthOperator" }
      - { include: "#LuauValueTrailingBlockComment" }
      - { include: "#LuauComment" }
      - { include: "#LuauSparkdownExplicitExpression" }
    end: (?={{BEAT}})|(?=$|{{WS}}|[,;)\]}])|{{LUAU_VALUE_COMMENT_BEFORE_STATEMENT}}|(?={{LUAU_GLUED_KEYWORD}})

  LuauSparkdownExplicitAccessPath:
    # Not at a `scene` or `branch` header: the end closes there at once, and
    # an empty path repeated at the header is an empty-match loop for the
    # rule that includes it (a declaration whose comma ends the line before
    # the header). A declaration that begins with a contextual word
    # (`type T`, `export type T`, `store x`) after a comma that ends a line
    # is not read as a value: the declaration or reassignment whose list the
    # comma continues ends before it (`LUAU_DECLARATION_STOP`), and its end
    # is tried before its values.
    # lookaround: LuauVariableDefinition owns declaration headers and LuauEndKeyword owns terminators; this path opens only at an ordinary expression identifier.
    # See bounded-entry rationale above for the structural alternatives.
    begin: "(?!{{BEAT}})(?={{LUAU_SHARED_PATH_KEYWORD_GUARD}}{{LUAU_IDENTIFIER}})"
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauSparkdownExplicitAccessPart" }
    # A `for` loop variable's path is its name alone, and ends before the
    # `:` of the variable's type annotation (`for k: number | string, v in t`,
    # `for i: number = 1, 3`), which is then read as the type it is. The
    # variable is a name in the list right after `for`, before the header's
    # `in` or `=` (`LUAU_SHARED_FOR_BINDING_BEHIND`; a name after a comma
    # past them is a value's, I-1448). A `:` after a name
    # followed by a method name and its arguments stays a method call, with
    # block comments before the arguments too (`t:m --[[c]] ()`).
    end: "(?={{BEAT}})|(?=$|{{WS}}*{{LUAU_SHARED_PATH_END_KEYWORDS}}|{{LUAU_SHARED_PATH_NO_CONTINUATION}}|{{LUAU_SHARED_FOR_BINDING_BEHIND}}{{LUAU_SHARED_PATH_TYPE_ANNOTATION_AHEAD}}{{LUAU_SHARED_PATH_NO_METHOD_CALL}}){{_LUAU_VALUE_OPERATOR_AHEAD_}}"
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  LuauSparkdownExplicitDataTypeDeclaration:
    # Positive lookahead `(?={{WS}}+{{LUAU_IDENTIFIER}})` requires
    # `type` to be followed by whitespace + an identifier (the type
    # alias being defined — `type Foo = number`). Without this,
    # bare `type` in expression position (`type(type)`,
    # `local f = type`) is misparsed as the start of a type
    # declaration, leaving the actual stdlib reference unresolved.
    # A call (`type(x)`, `type "x"`, `type { x }`) has no name after
    # `type`, so it is never a declaration.
    # lookaround: LuauTypeLiteral owns type values; this declaration opens only at type followed by a declared name.
    # See bounded-consuming-entry rationale above; a declared name separates
    # this type prefix from the parenthesized LuauTypeofFunction spelling.
    begin: "({{WS}}*){{_LUAU_SHARED_EXPORTED_TYPE_PREFIX_}}?(type)\\b(?={{WS}}+{{LUAU_IDENTIFIER}})({{WS}}*)"
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauExportModifier" }
      3:
        patterns:
          - { include: "#OptionalWhitespace" }
      4:
        patterns:
          - { include: "#LuauTypeKeyword" }
      5:
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauSparkdownExplicitTypeLiteral" }
      - { include: "#LuauSparkdownExplicitTypeAssignment" }
    end: "(?={{BEAT}})|(?={{LUAU_TYPE_LINE_BREAK}}|{{WS}}*{{LUAU_SHARED_TYPE_DECLARATION_END}})"

  LuauSparkdownExplicitTypeAssignment:
    begin: ([=])({{WS}}*)
    beginCaptures:
      1:
        tag: updateOperator
        name: keyword.operator.assignment.luau
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauSparkdownExplicitTypeOperatorComments" }
      - { include: "#LuauComment" }
      - { include: "#LuauSparkdownExplicitTypeLiteral" }
    # lookaround: LuauTypeLiteral owns annotation content; this assignment yields only after that type and before unrelated content.
    # See bounded-exit rationale above for the structural alternatives.
    end: (?={{BEAT}})|(?={{LUAU_TYPE_LINE_BREAK}}|$|{{LUAU_TYPE_WHITESPACE_END}}|[,;)\]}>=]|{{LUAU_NON_TYPE_KEYWORDS}})|(?<={{LUAU_TYPE_END}}{{WS}}*)(?={{LUAU_BLOCK_COMMENT_ON_LINE}}{{LUAU_TYPE_CODE_AHEAD}})

  # An `until` in a story body that no story `repeat` took (its loop's end
  # is tried first), with its condition: a line of Luau, not story text
  # (`until true` with no `repeat`). Only story bodies hold it
  # (`LuauSparkdownControlBlock`); in Luau code `until` is read by a loop's
  # end or, where nothing takes it, as a `LuauStrayCloser`.
  LuauStrayUntilStatement:
    begin: ({{WS}}*)(until)\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauUntilKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauExpression" }
      - { include: "#ExtraWhitespace" }
    # See `LuauUntilCondition`.
    end: "(?={{BEAT}})|(?={{WS}}+{{LUAU_UNTIL_CONDITION_END_KEYWORDS}})|(?={{WS}}+{{LUAU_REASSIGNMENT_START}})|(?={{WS}}+{{LUAU_UNRESERVED_IDENTIFIER}}{{LUAU_SHARED_UNTIL_ACCESS_SUFFIX}}*{{WS}}*[(])|$|(?={{LUAU_GLUED_KEYWORD}})"

  # The bounded counterpart of `LuauUntilCondition`, after the `until` a
  # `LuauSparkdownExplicitRepeatLoop` took.
  # lookaround: as for `LuauUntilCondition`, the loop's end takes the
  # `until`, and `LuauSparkdownExplicitExpression` reads anything else.
  LuauSparkdownExplicitUntilCondition:
    begin: (?<=\buntil)({{WS}}*){{LUAU_EXPRESSION_START}}
    beginCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauSparkdownExplicitExpression" }
      - { include: "#ExtraWhitespace" }
    # See `LuauUntilCondition`.
    end: "(?={{BEAT}})|(?={{WS}}+{{LUAU_UNTIL_CONDITION_END_KEYWORDS}})|(?={{WS}}+{{LUAU_REASSIGNMENT_START}})|(?={{WS}}+{{LUAU_UNRESERVED_IDENTIFIER}}{{LUAU_SHARED_UNTIL_ACCESS_SUFFIX}}*{{WS}}*[(])|$|(?={{LUAU_GLUED_KEYWORD}})|(?={{WS}}*[;])|(?={{WS}}*[)\\]}])"

  SparkdownExplicitTag:
    tag: docComment
    name: comment.line.sd entity.tag.sd
    match: "({{WS}}*)({{TAG_START}})(.*?){{LUAU_SHARED_TAG_END}}"
    captures:
      1:
        patterns:
          - { include: "#Whitespace" }
      2:
        tag: definition(docComment)
        name: punctuation.definition.comment.sd comment.line.sd entity.tag.begin.sd
      3:
        patterns:
          - { include: "#SparkdownExplicitTagContent" }

  LuauSparkdownExplicitDeclarations:
    # NOTE: `#LuauComment` is deliberately NOT included here. `LuauDeclarations`
    # is reached from the top-level (root) patterns and from every mixed
    # sparkdown+display body (`LuauSparkdownBlockBody`, `LuauSparkdownChooseBlock`,
    # `LuauSparkdownChooseThenClause`), which is exactly where scene/action/
    # dialogue prose lives. A `--` there is a display em-dash (and `---` a
    # front-matter fence / title-page divider), never a comment — the R&B
    # screenplay opens dozens of action lines with `-- …`. Pulling `#LuauComment`
    # in here made every such line parse as a `LuauLineComment` and vanish from
    # the preview. Luau comments belong ONLY to genuine Luau-code contexts, which
    # each reach comments directly: `LuauExpression` (the sibling in every pure
    # `LuauBlockBody` scope) includes `#LuauComment`,
    # and function/param/define bodies include it themselves. See
    # [[feedback_grammar_golden_rule]]: separate the two contexts in the grammar
    # rather than disambiguate downstream. Regression: FrontMatterAndCommentContext.test.ts.
    patterns:
      - { include: "#LuauSparkdownExplicitExpressionDeclarations" }
      - { include: "#LuauBreakStatement" }
      - { include: "#LuauContinueStatement" }

  # The bounded counterpart of `LuauExpressionDeclarations`.
  LuauSparkdownExplicitExpressionDeclarations:
    patterns:
      - { include: "#LuauShebang" }
      - { include: "#LuauStyle" }
      - { include: "#LuauLayout" }
      - { include: "#LuauScreen" }
      - { include: "#LuauComponent" }
      - { include: "#LuauAnimation" }
      - { include: "#LuauTheme" }
      - { include: "#LuauMorph" }
      - { include: "#LuauDefine" }
      - { include: "#LuauFunctionDefinition" }
      - { include: "#LuauSparkdownExplicitVariableDefinition" }
      - { include: "#LuauFunctionTypeDeclaration" }
      - { include: "#LuauSparkdownExplicitDataTypeDeclaration" }
      - { include: "#LuauGotoStatement" }
      - { include: "#LuauLabel" }

  SparkdownExplicitTags:
    tag: docComment
    name: comment.line.sd entity.tag.sd
    # lookaround: Tag owns each tag marker; this list opens only at the first marker.
    # See bounded-entry rationale above for the structural alternatives.
    begin: ({{WS}}*)(?={{TAG_START}})
    captures:
      1:
        patterns:
          - { include: "#RequiredWhitespace" }
    patterns:
      - { include: "#SparkdownExplicitTag" }
    end: (?=$)

  SparkdownExplicitAnnotation:
    patterns:
      - { include: "#SparkdownExplicitTags" }

  SparkdownExplicitDivertPath:
    tag: heading
    name: keyword.control.divert.path.sd
    # lookaround: DivertPart owns identifier and dotted target parts; this path ends before any token that is not a target part.
    # See bounded-entry rationale above for the structural alternatives.
    begin: (?={{IDENTIFIER}}|[.^])
    patterns:
      - { include: "#SparkdownExplicitAnnotation" }
      - { include: "#DivertPart" }
    # lookaround: DivertPart owns identifier and dotted target parts; this path ends before any token that is not a target part.
    # See bounded-exit rationale above for the structural alternatives.
    end: (?=$)|(?!{{IDENTIFIER}}|[.^])

  LuauSparkdownExplicitDivertTargetLiteral:
    # `-> name` (optionally `-> a.b.c`) as a first-class value: stores
    # a pointer to the target which can later be invoked with `-> x`
    # or `-> x(args)`, or compared with `==`. Mirrors inkjs's
    # `DivertTarget` (which extends `Expression`). Single-line match
    # to keep the boundary clean — the rule deliberately doesn't try
    # to swallow argument parentheses; `-> place(5)` as a literal
    # isn't a common ink shape, and stripping the arg call form here
    # would conflict with the `-> name(args)` divert syntax. The
    # trailing `(WS*)` is required so that, when this literal is used
    # mid-expression (e.g. `if -> X == -> Y then`), the LuauIfBlockCondition's
    # `(?=WS)` end-lookahead doesn't fire between the literal and the
    # following operator. In the last arm of a braced alternator, after a `|`
    # (and a `name =` for match and plural arms), an `end` directly before
    # the `}` is not a target: in `{queue | "a" | -> end}` the `->` is an
    # empty divert and `end` closes the alternator. Labels may take keyword
    # names, so `end` in any other position (`count.turns(-> end)`,
    # `{ -> end }` as a table value) is a target, as is every other keyword
    # and a name that only begins with `end` (`end-game`).
    # lookaround: LuauArithmeticOperation owns subtraction and LuauEndKeyword owns an empty alternator arm; this divert literal requires an actual dotted target.
    # The arm's expression is already open, so reordering/splitting its
    # siblings or relying on the alternator's end cannot give that parent
    # this empty-arm closer. Restricting IDENTIFIER would also restrict the
    # target everywhere, instead of this arm-separator plus closing-brace
    # context. The guard leaves the closer unconsumed; end-game stays a name.
    match: "(?!{{AFTER_ALTERNATOR_ARM_SEPARATOR}}{{END_DIVERT_CLOSING_ALTERNATOR}})({{WS}}*)([-][>])({{WS}}*)({{IDENTIFIER}}{{LUAU_SHARED_DIVERT_DOTTED_PART}}*)({{WS}}*)"
    captures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#DivertMark" }
      3:
        patterns:
          - { include: "#OptionalWhitespace" }
      4:
        patterns:
          - { include: "#SparkdownExplicitDivertPath" }
      5:
        patterns:
          - { include: "#ExtraWhitespace" }

  LuauDoBlock:
    begin: ({{WS}}*)(do)\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauDoKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauBlockBody" }
      - { include: "#LuauUnreadToken" }
    end: (?={{BEAT}})|({{WS}}*)(end)\b|(?={{WS}}*{{LUAU_BRANCH_OR_UNTIL}})
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauEndKeyword" }

  # ----------------------------------------------------------------------------
  # If Block
  # ----------------------------------------------------------------------------

  LuauSparkdownIfBlock:
    begin: ({{WS}}*)(if)\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauIfKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauSparkdownExplicitIfCondition" }
      - { include: "#LuauSparkdownBlockBody" }
    end: (?={{BEAT}})|({{WS}}*)(end)\b({{LUAU_END_TRAILING_COMMENTS}})?|(?={{WS}}*{{LUAU_UNTIL}})
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauEndKeyword" }
      3:
        patterns:
          - { include: "#LuauComment" }

  LuauIfBlock:
    begin: ({{WS}}*)(if)\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauIfKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    # Its branches are its own: no other body reads `elseif` or `else`
    # (`LuauControlBlock`), so a stray one closes the body it stands in, and
    # the `if` around that body takes it, as Luau reads it (#1906).
    patterns:
      - { include: "#LuauIfBlockCondition" }
      - { include: "#LuauElseifBlock" }
      - { include: "#LuauElseBlock" }
      - { include: "#LuauBlockBody" }
      - { include: "#LuauUnreadToken" }
    end: (?={{BEAT}})|({{WS}}*)(end)\b|(?={{WS}}*{{LUAU_UNTIL}})
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauEndKeyword" }

  LuauIfBlockCondition:
    # Begin fires immediately after `if` regardless of whether the
    # condition starts on the same line or on a continuation line.
    # The trick (cf. `LuauLogicalOperator`'s patterns array): the
    # `begin` lookbehind is intra-line, but the rule's `patterns`
    # array includes both `Newline` and `ExtraWhitespace`, so once
    # the scope is open, the condition can span newlines until the
    # `then` keyword closes it. Critically, `then` is excluded from
    # `LuauKeyword` so the inner `LuauExpression` can't snatch it
    # before this rule's end pattern fires.
    # A later line continues the condition only when it begins with its
    # `then`, continues the expression (`LuauLineContinuation`), or is blank
    # or holds only a comment, which Luau reads past. Any other line ends it,
    # so a condition written without `then` ends with its own line rather than
    # reading the branch's first line into the expression;
    # `ValidationAnnotator` reports the missing `then`. A condition that
    # begins on the line after `if` (`if` alone on its line) reads its first
    # line through `LuauConditionLeadingBreak`. A `then` right after `if`
    # leaves the condition empty (`if then end`), which Luau rejects; the
    # condition still takes the `then`, so the block's body and `end` stay in
    # the block (#1175). A `}` the condition did not open closes the block
    # around it (a closure, or a layout's brace block), so a condition left
    # without `then` ends before it.
    #
    # lookaround: `(?<=\bif\b{{WS}}*)` opens the condition once, right after
    # the `if` its parent's begin took. The parent tries this rule first
    # again at every position of its body, so without the lookbehind the
    # condition takes the statements of the branch (`LuauBlockBody`,
    # `LuauSparkdownBlockBody`, `LuauSparkleBlockEntries`; fixture
    # flow/if-with-bare-assignment). Beginning at the next token instead
    # does not help: a condition can begin with any token a statement can,
    # so no begin tells the two apart, and textmate-grammar-tree has no `\G`
    # to match only where the parent's begin ended. Tried after the body
    # rules, it would never be reached. `LuauElseifBlockCondition`,
    # `LuauForCondition`, `LuauWhileCondition`, `LuauSparkleMatchCondition`,
    # `LuauSparkleCaseValue`, `LuauTernaryExpressionCondition` and
    # `LuauConditionalAlternatorCondition` keep theirs for the same reason.
    # The begin needs no beat exclusion: a beat begins its line, and the
    # lookbehind puts `if` before the begin on the same line. The end's
    # `^(?!…)` is the line rule above: a positive alternative cannot name "any other
    # line", so the line that begins the branch's first statement
    # (`LuauBlockBody`) ends the condition through it.
    begin: (?<=\bif\b{{WS}}*)
    patterns:
      - { include: "#LuauConditionLeadingBreak" }
      - { include: "#LuauLineContinuation" }
      - { include: "#LuauIndexerLineContinuation" }
      - { include: "#LuauIfHeaderLongCommentMethodColon" }
      - { include: "#LuauIfHeaderMethodColon" }
      - { include: "#LuauExpression" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: ({{WS}}*)((?:then)\b)|(?={{BEAT}}|{{END}}|[)\]}]|^(?!{{WS}}*then\b|{{LUAU_EXPRESSION_LINE_CONTINUATION}}|{{WS}}*$|{{WS}}*{{LUAU_COMMENT_START}}))
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauThenKeyword" }

  # The `if` or `elseif` before a condition must start a word, so a name
  # ending in `if` (`motif`) never opens a condition after itself.
  # A condition takes the whitespace before its own `then`, so the enclosing
  # `LuauTernaryExpression` stands directly on that `then` and only meets
  # whitespace followed by `then` after a completed arm (see its `end`).
  # A `then` glued to the end of a condition, as in `if (c)then` (see
  # `AFTER_LUAU_GLUEABLE_OPERAND`), is taken by the condition itself, so the
  # enclosing expression only meets a glued `then` after its else arm.
  # It also takes the whitespace after `elseif`, so an expression whose own
  # rule begins by taking leading whitespace (`not`, `#`, `-`, a `function`
  # literal) still lands inside the condition rather than beside it.
  # The whitespace after `if` or `elseif` and before `then` separates a keyword
  # from its operand, so it is a separator the formatter keeps as one space
  # (`if c then`, not `if cthen`).
  # A condition reads on to the next line only when that line begins with its
  # `then` or continues the condition (`LuauLineContinuation`). Any other
  # line ends it, so a condition whose `then` is not yet written ends with
  # its own line rather than reading the lines below into the expression.
  # A `then` right after `if` leaves the condition empty (`if then 1 else 2`),
  # which Luau rejects; the expression reads the `then` arm (#1175).
  #
  # lookaround: the lookbehind opens the condition only after the `if` or
  # `elseif` (see `LuauIfBlockCondition`). `LuauTernaryExpression` tries this
  # rule before `LuauExpression`, which reads its arms, so without it the
  # condition would take each arm's value (fixture
  # luau-function/if-expression-condition). The begin's `(?!…)` keeps the
  # condition from opening at a line end, before more
  # whitespace (the begin takes the whitespace itself) or right before
  # `then`, where `LuauThenExpression` reads the arm (`if then 1`). The
  # end's `^(?!…)` is the line rule above, as in `LuauIfBlockCondition`.
  LuauTernaryExpressionCondition:
    begin: (?<=\b(?:else)?if\b{{WS}}*)({{WS}}*)(?!$|{{WS}}|then\b)
    beginCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauLineContinuation" }
      - { include: "#LuauIndexerLineContinuation" }
      - { include: "#LuauIfHeaderLongCommentMethodColon" }
      - { include: "#LuauIfHeaderMethodColon" }
      - { include: "#LuauExpression" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    # A `then` glued to a `:` that `LuauIfHeaderMethodColon` read (`if t:then`)
    # ends it too, as the block condition's end takes it with no space.
    # lookaround: the `(?<=[:])` beside `AFTER_LUAU_GLUEABLE_OPERAND` is that one case; the variable's other users read a glued keyword after an operand, which a `:` is not.
    end: "({{WS}}+)(?=then\\b)|(?=^then\\b)|(?={{BEAT}}|[)}\\],;]|^{{LUAU_SHARED_TERNARY_CONDITION_LINE_END}})|(?:{{AFTER_LUAU_GLUEABLE_OPERAND}}|(?<=[:]))(then)\\b"
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauThenKeyword" }

  # ----------------------------------------------------------------------------
  # Elseif Block
  # ----------------------------------------------------------------------------

  LuauSparkdownElseifBlock:
    begin: ({{WS}}*)(elseif)\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauElseifKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauSparkdownExplicitIfCondition" }
      - { include: "#LuauSparkdownBlockBody" }
    end: (?={{BEAT}})|(?={{WS}}*{{LUAU_IF_BRANCH_END_KEYWORDS}})|(?={{WS}}*{{LUAU_UNTIL}})

  LuauElseifBlock:
    begin: ({{WS}}*)(elseif)\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauElseifKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauElseifBlockCondition" }
      - { include: "#LuauBlockBody" }
      - { include: "#LuauUnreadToken" }
    end: (?={{BEAT}})|(?={{WS}}*{{LUAU_IF_BRANCH_END_KEYWORDS}})|(?={{WS}}*{{LUAU_UNTIL}})

  LuauElseifBlockCondition:
    # See `LuauIfBlockCondition` for the multi-line trick and the line that
    # ends a condition written without `then`, and for an empty one.
    #
    # lookaround: as in `LuauIfBlockCondition`, the lookbehind keeps the
    # condition out of the branch's statements (`LuauBlockBody`,
    # `LuauSparkleBlockEntries`; fixture sparkle/layout-if). Its end's
    # `^(?!…)` is as there.
    begin: (?<=\belseif\b{{WS}}*)
    patterns:
      - { include: "#LuauConditionLeadingBreak" }
      - { include: "#LuauLineContinuation" }
      - { include: "#LuauIndexerLineContinuation" }
      - { include: "#LuauIfHeaderLongCommentMethodColon" }
      - { include: "#LuauIfHeaderMethodColon" }
      - { include: "#LuauExpression" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: ({{WS}}*)((?:then)\b)|(?={{BEAT}}|{{END}}|[)\]}]|^(?!{{WS}}*then\b|{{LUAU_EXPRESSION_LINE_CONTINUATION}}|{{WS}}*$|{{WS}}*{{LUAU_COMMENT_START}}))
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauThenKeyword" }

  # The line breaks, blank lines, comments and indentation between an `if` or
  # `elseif` that ends its line (or has only a comment after it) and the
  # condition's first token on a later line. Taking them here means the
  # condition's line-start end is first tested on the line after the one the
  # condition begins on, not on that line itself.
  #
  # lookaround: the lookbehind keeps this rule to the line the `if` or
  # `elseif` ends. Both conditions try it first at every position, so
  # without it every line break inside a condition would be taken here,
  # past the condition's line-start end (fixtures flow/if-condition-next-line
  # and luau-access/leading-dot-continuation). See `LuauIfBlockCondition`.
  # The begin's `(?=…)` is what the rule is for: it opens only where the
  # line ends or a comment follows, and otherwise leaves the first token to
  # the condition's `LuauExpression`. The end's `(?!{{LUAU_COMMENT_START}})`
  # keeps a comment line in the break, where `LuauComment` reads it, rather
  # than beginning the condition with it.
  LuauConditionLeadingBreak:
    begin: (?<=\b(?:else)?if\b{{WS}}*)(?={{WS}}*{{LUAU_LINE_END_OR_COMMENT}})
    patterns:
      - { include: "#LuauComment" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?=\S)(?!{{LUAU_COMMENT_START}})

  # ----------------------------------------------------------------------------
  # Else Block
  # ----------------------------------------------------------------------------

  LuauSparkdownElseBlock:
    begin: ({{WS}}*)(else)\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauElseKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauSparkdownBlockBody" }
    end: (?={{BEAT}})|(?={{WS}}*(?:end)\b)|(?={{WS}}*{{LUAU_UNTIL}})

  LuauElseBlock:
    begin: ({{WS}}*)(else)\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauElseKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauBlockBody" }
      - { include: "#LuauUnreadToken" }
    end: (?={{BEAT}})|(?={{WS}}*(?:end)\b)|(?={{WS}}*{{LUAU_BRANCH_OR_UNTIL}})

  # ----------------------------------------------------------------------------
  # Choose Block (Sparkdown weave / branching narrative)
  #
  # `choose ... [then [(label)] ... ] end` is sparkdown's block-based
  # weave syntax. Replaces ink's mark-counting (`* * *`) + dash-prefix
  # gathers (`- text`) — depth comes from block nesting, not from
  # counting marks.
  #
  #   choose
  #     * "Hi."
  #     * "Hey."
  #   then
  #     She nods.
  #   choose                    -- closes previous, starts next
  #     * "Coffee?"
  #     * "Tea?"
  #   then (coffee) She picks coffee.    -- labeled, inline body
  #   end
  #
  # Inside a `choose` block:
  #   - `*` (once-only) and `+` (sticky) choices live at the block's
  #     depth — no mark-counting needed.
  #   - `if cond then ... end` blocks can wrap choices for conditional
  #     gating (e.g. `if has_key then * Unlock end` inside `choose`).
  #   - `then` introduces the gather body. Optional `(label)` names
  #     the gather as a divert target.
  #   - Another `choose` keyword chains a new block, closing the
  #     previous block implicitly (mirrors `elseif` in if-blocks).
  #   - `end` closes the chain.
  # ----------------------------------------------------------------------------

  LuauSparkdownChooseBlock:
    begin: ({{WS}}*)(choose)\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauChooseKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    # Order matters: the `then` clause must be checked before
    # `SparkdownStatement` / `LuauDeclarations`, otherwise a bare
    # `then` line gets swallowed as display text. Similarly `Choice`
    # comes first so `*`-prefixed lines don't get re-routed elsewhere.
    # Free-form lines like `      foo` (a plain action under a choice)
    # have to match SOMETHING inside the block — without these patterns
    # textmate's parser can't advance through them and the begin/end
    # rule effectively stops contributing children.
    patterns:
      - { include: "#Choice" }
      - { include: "#LuauSparkdownChooseThenClause" }
      - { include: "#LuauSparkdownControlBlock" }
      - { include: "#LuauSparkdownExplicitStatement" }
      - { include: "#LuauFunctionDefinition" }
      - { include: "#LuauSparkdownVariableDefinition" }
      - { include: "#LuauDeclarations" }
      - { include: "#FlowStatements" }
      # `#`/`##` section tags and `[[...]]` annotations are scene content
      # the body can contain. Without #Annotation the parser can't advance
      # through a standalone tag line (e.g. `## FinalImage`) and spins on
      # empty matches ("possible infinite loop"). Before DisplayStatements
      # so a tag line isn't swallowed as Action text.
      - { include: "#Annotation" }
      - { include: "#DisplayStatements" }
      - { include: "#LuauExpression" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    # Same shape as every other sparkdown block: ends on `end`. Nested
    # `choose` blocks inside a choice's body are matched by the
    # `LuauSparkdownControlBlock` pattern (which routes back to
    # `LuauSparkdownChooseBlock`) and consume their own `end` before
    # the outer block sees it. No chaining: sequential weaves write
    # `choose ... then ... end` twice — clean and unambiguous.
    end: (?={{BEAT}})|({{WS}}*)(end)\b({{LUAU_END_TRAILING_COMMENTS}})?|(?={{WS}}*{{LUAU_UNTIL}})
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauEndKeyword" }
      3:
        patterns:
          - { include: "#LuauComment" }

  LuauSparkdownChooseThenClause:
    begin: ({{WS}}*)(then)\b({{WS}}*)([(][^()\r\n]*[)]{{WS}}*)?
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauThenKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      4:
        patterns:
          - { include: "#Label" }
    patterns:
      - { include: "#LuauSparkdownExplicitStatement" }
      - { include: "#LuauFunctionDefinition" }
      - { include: "#LuauSparkdownVariableDefinition" }
      - { include: "#LuauDeclarations" }
      - { include: "#LuauSparkdownControlBlock" }
      - { include: "#FlowStatements" }
      # See LuauSparkdownChooseBlock: `#`/`##` section tags must be
      # matched here too, or a standalone tag line in the then-body spins
      # on empty matches.
      - { include: "#Annotation" }
      - { include: "#DisplayStatements" }
      - { include: "#LuauExpression" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    # The then-clause body ends when the enclosing `choose` block
    # sees its `end`. Nested blocks inside the then-body consume
    # their own end keywords, so the lookahead only fires on the
    # outer choose's terminator.
    end: (?={{BEAT}})|(?={{WS}}*end\b)

  LuauChooseKeyword:
    tag: controlKeyword
    name: keyword.control.choose.luau
    match: (choose)\b

  # ----------------------------------------------------------------------------
  # If-Then-Else Expression
  # ----------------------------------------------------------------------------

  # Luau's `if cond then a else b` ternary EXPRESSION (no `end`).
  # Distinguishing from block-form `if ... end` is tricky because
  # both use `if cond then ...`. The lookahead requires that, before
  # any `=` (assignment statement marker), one of:
  #   - `else` / `elseif` appears (true ternary form), or
  #   - `}` appears (sparkdown's inline-conditional in interpolation
  #     `{if cond then expr}`, may omit `else`).
  # Block form `if cond then a = 1 else a = 2 end` is excluded
  # because `=` appears between `if` and `else`. Without this
  # discrimination, an inline statement-position `if cond then stmt
  # end` parses as a ternary, eats the `end`, and cascades the parse
  # out of the enclosing function-body context.
  # An `if` that follows an operator, an opening bracket, a comma, `return`
  # or the `then` or `else` of an enclosing if expression on its line can
  # only begin an expression, so it begins one whatever follows on that line;
  # its clauses may then continue on the lines below. So does an `if` that
  # begins its line where an expression is read, such as an arm's value on
  # the line after its `then` or `else`; where a statement is read, the
  # statement rules take a line-starting `if` before any expression rule.
  LuauTernaryExpression:
    begin: "{{LUAU_SHARED_TERNARY_CONTEXT}}({{WS}}*)(if)\\b({{WS}}*)"
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauIfKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauTernaryExpressionCondition" }
      - { include: "#LuauThenExpression" }
      - { include: "#LuauElseExpression" }
      - { include: "#LuauExpression" }
      # `then`/`else`/`elseif` fallback — `LuauKeyword` no longer matches
      # them (so other rules' end-patterns can fire), but the inline-
      # ternary form still needs them tokenised when they appear free-
      # standing inside this expression.
      - { include: "#LuauTernaryKeyword" }
      - { include: "#LuauCommaSeparator" }
      # The whitespace between a clause and the next keyword (`1 else`,
      # `1 elseif`) separates them, so the formatter keeps it as one space.
      # `RequiredWhitespace`, not `OptionalWhitespace`: a zero-width match in a
      # scoped rule's patterns would stall the parser (GRAMMAR.md §12).
      - { include: "#RequiredWhitespace" }
      - { include: "#Newline" }
    # End on a BEAT (next scene/branch), at end-of-line (statement
    # position: `local x = if c then 1 else 2` must close before the
    # newline or the open scope swallows the next line and the
    # enclosing statement force-closes with ERROR_INCOMPLETE), or on
    # the natural closing delimiter of any expression-host context —
    # interpolation `}`, call/paren `)`, index `]`, an arg separator
    # `,` or `;`. Without the bracket alternatives, the rule would
    # only close via parent force-close (an
    # `[ScopedRule:LuauTernaryExpression] Incomplete scope` warning at
    # parse time).
    #
    # A clause may begin a line of its own. The condition reads on to a
    # line that begins with its `then`, the then arm to a line that begins
    # with its `else` or `elseif`, and the `then` and `else` keywords take
    # the line break after them, so while a clause is still to come on the
    # next line, one of those rules is open and this level does not meet
    # the end of the line. Any other line ends the clause and, at the start
    # of that line, this expression, so an expression whose `then` or
    # `else` is not yet written ends with its own lines instead of reading
    # the lines below into itself. An arm whose `then` or `else` ends its
    # line takes its value from the next line, unless that line begins a
    # statement (`LUAU_STATEMENT_LINE_START`), which ends the arm empty and
    # this expression with it. `ValidationAnnotator` reports the missing
    # clause or value.
    #
    # The statement the expression belongs to ends at the start of that
    # line too when it is unindented, so the line is read on its own: a
    # reassignment ends at a column-0 line (`LUAU_REASSIGNMENT_END`), and a
    # declaration at the start of any line it reaches.
    #
    # The last alternative ends the expression before the `then` of an if
    # statement or the `do` of a while loop whose condition it is:
    # `if if c then 1 else 2 then`. Each condition takes the whitespace
    # before its own `then`, and a `then` glued to its end, so whitespace
    # followed by `then` or `do` at this level only follows a completed arm,
    # and so does a glued `then` or `do`: `if if c then 1 else (2)then`.
    # Right after `elseif`, a `then` is that clause's own, with its condition
    # missing (`elseif then 2`). It also ends before a `:` that `do` or
    # `then` follows after its last arm (`while if t then a else b:do`,
    # `LUAU_COLON_BEFORE_HEADER_END`), as the access path does, so the
    # condition around it reads the `:` before its own keyword, and an
    # expression reads the word as a method's name (I-1351).
    #
    # lookaround: a `then` glued to its condition is taken by the condition,
    # so at a line end right after it no then arm is open yet, and the end,
    # tried before the patterns, would close the expression there. The
    # `(?<!…)`, which looks back only on the current line, keeps the end of
    # the line from ending the expression right after a `then`, so that
    # `LuauThenExpression` opens and its `LuauThenOperator` reads the line
    # break. Reordering the patterns cannot help, since the end is tried
    # first, and the condition cannot leave the `then` to the arm (see
    # `LuauThenExpression`).
    #
    # It also ends before an `end` or `until` after its last arm, which
    # closes the block around it (`return if a then 2 else 3 end`), as its
    # `LuauSparkdownExplicitTernaryExpression` twin does.
    end: "(?={{BEAT}}|(?<!{{LUAU_THEN_BEHIND}})$|{{WS}}*{{LUAU_SHARED_WRITTEN_BLOCK_CLOSER_KEYWORDS}}\\b|^{{LUAU_SHARED_TERNARY_NEXT_LINE_GUARD}}|[)}\\],;]|{{LUAU_SHARED_NOT_ELSEIF}}{{WS}}+{{LUAU_SHARED_CONDITION_CLOSER_KEYWORDS}}\\b|{{AFTER_LUAU_GLUEABLE_OPERAND}}{{LUAU_SHARED_CONDITION_CLOSER_KEYWORDS}}\\b|{{LUAU_COLON_BEFORE_HEADER_END}}|{{LUAU_COLON_BEFORE_LONG_COMMENT}})|(?<=^{{WS}}*)(?={{LUAU_STATEMENT_LINE_START}})"

  # The second `begin` alternative opens the then arm after a glued `then`
  # that its condition took (see `LuauTernaryExpressionCondition`); this
  # expression's own level stands just after a `then` in no other case.
  #
  # lookaround: `(?<={{LUAU_THEN_BEHIND}})` finds that `then`, which a
  # sibling's end took, not a parent's begin. Without it the empty alternative opens the arm at
  # every position of `LuauTernaryExpression`, ahead of `LuauElseExpression`
  # and `LuauExpression` (fixture luau-function/if-expression-glued-then).
  # The condition cannot leave the glued `then` to this rule's first
  # alternative instead: `LuauTernaryExpression`'s end stops before a glued
  # `then` or `do`, and an end is tried before the patterns. The first
  # alternative's `(?=…)` opens the arm without taking `then`, which
  # `LuauThenOperator` inside it reads, so the keyword and the line break
  # after it are part of the arm. The second alternative takes nothing, so
  # that `LuauThenOperator` inside it still finds the glued `then` and reads
  # the whitespace and line break after it. The end's `^(?!…)` and
  # `(?<=^{{WS}}*)(?=…)` are the line rules described below: a line that
  # begins a statement (`LUAU_STATEMENT_LINE_START`) ends the arm.
  LuauThenExpression:
    begin: (?=(?:then)\b)|(?<={{LUAU_THEN_BEHIND}})
    patterns:
      - { include: "#LuauThenNextLineArm" }
      - { include: "#LuauThenOperator" }
      - { include: "#LuauComment" }
      - { include: "#LuauLineContinuation" }
      - { include: "#LuauIndexerLineContinuation" }
      - { include: "#LuauExpression" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    # End at the next ternary clause keyword, at a BEAT, or at a closing
    # bracket / arg separator. The arm reads on to the next line only when
    # that line begins with its `else` or `elseif` or continues the arm's
    # value (`LuauLineContinuation`), so the enclosing
    # expression, which ends at the end of a line, stays open while that
    # clause is still to come, and a line that begins anything else ends
    # the arm (see `LuauTernaryExpression`'s `end`). After a `then` that
    # ends its line, a next line that begins a statement also ends the arm.
    # A `then` or `do` after the arm's value is not the arm's own `then`,
    # which opens it, but the keyword of the statement whose condition the
    # expression is (`if if c then a then`), so the arm ends before it, as
    # `LuauElseExpression` does, and `LuauTernaryExpression`'s end leaves it
    # to that condition: after whitespace, glued to the value
    # (`if if c then (a)then`), or after a `:` (`while if c then a:do`,
    # `LUAU_COLON_BEFORE_HEADER_END`). Read as the arm's operator, it would
    # take the next line as the arm's value (`LuauThenNextLineArm`). The
    # arm's own `then` is never one of these: a glued one is the
    # condition's, and the arm opens after it. `LUAU_SHARED_THEN_ARM_CLOSER`
    # holds these ends on a line, which `LuauThenNextLineArm` shares.
    end: "(?={{LUAU_SHARED_THEN_ARM_CLOSER}}|^{{LUAU_SHARED_THEN_NEXT_LINE_GUARD}})|(?<=^{{WS}}*)(?={{LUAU_STATEMENT_LINE_START}})"

  # A then arm whose `then` ends its line, optionally with a comment, takes
  # its value from the next line, wherever that value begins, as Luau reads
  # it (`then` then `false` at column 0, I-1522). `LuauThenOperator` reads
  # the `then` and the line break, and this rule reads the value up to the
  # end of its line, after which `LuauThenExpression` reads on as after any
  # value. It ends where the arm does, before a clause keyword, a closer or
  # the `then` or `do` of the statement around the expression. A next line
  # that begins a statement, a clause keyword or a closer
  # ends this rule empty, and `LuauThenExpression` with it; so does a
  # reassignment at column 0, as it ends an `else` arm (`LuauElseExpression`).
  # `ValidationAnnotator` and the lowerer read this rule's parts as the arm's
  # own.
  #
  # lookaround: `LuauThenExpression`'s end, tried before its patterns, ends
  # the arm at the start of any line that does not begin with a clause
  # keyword or a continuation, because there a value is already behind it.
  # Only an open rule can tell the line that holds the arm's first value
  # from the lines after it, and it has to open before that line's start,
  # where the arm's end would already have closed the arm: so this rule
  # opens at the `then`, whose line it sees whole. The second alternative is
  # a `then` glued to its condition, which the condition took (see
  # `LuauThenExpression`), found behind the position (`AFTER_LUAU_GLUED_THEN`)
  # as code, not as the end of a comment's text. A glued `then` that ends its
  # line puts this rule at that line's end as it opens, where
  # `LuauThenOperator` has yet to read the line break, so the end's `(?!…)`
  # keeps it from closing there. Ending at the end of the value's line, this
  # rule never reaches a later line's start, where the arm's end decides as
  # before.
  LuauThenNextLineArm:
    begin: (?=then\b{{WS}}*(?:--.*)?$)|{{AFTER_LUAU_GLUED_THEN}}(?={{WS}}*(?:--.*)?$)
    patterns:
      - { include: "#LuauThenOperator" }
      - { include: "#LuauComment" }
      - { include: "#LuauLineContinuation" }
      - { include: "#LuauIndexerLineContinuation" }
      - { include: "#LuauExpression" }
      - { include: "#ExtraWhitespace" }
    end: "(?={{LUAU_SHARED_THEN_ARM_CLOSER}})|(?!{{AFTER_LUAU_GLUED_THEN}})(?=$)|(?<=^{{WS}}*)(?={{LUAU_STATEMENT_LINE_START}})|^(?!{{LUAU_IF_BLOCK_KEYWORDS}})(?={{LUAU_REASSIGNMENT_START}})"

  # The `then` of an if expression's then arm and the whitespace and line
  # break after it. The second `begin` alternative is the arm's own `then`
  # glued to its condition, which the condition took (see
  # `LuauThenExpression`), so it reads only what follows that `then`, and an
  # arm whose glued `then` ends its line takes its value from the next line
  # as it does after a spaced `then`. Every reader of the arm skips this
  # rule as the clause's keyword, whichever alternative opened it.
  #
  # A comment after the `then` is read inside the operator, as Luau skips
  # it, so a `then` followed by a comment that ends its line also takes its
  # value from the next line (`then -- note`).
  #
  # lookaround: the second alternative's lookbehind is
  # `LuauThenExpression`'s, and holds only right after that `then`. Its
  # `(?=$|{{WS}}|--)` keeps it from opening empty before a value glued to
  # the `then` (`(c)then(1)`), where the end would close it at once and the
  # arm would open it again at the same position; a comment glued to the
  # `then` (`(c)then--x`) opens it, and the end's `--` keeps it open for
  # the comment. A separate rule for the glued case cannot work: the arm's
  # readers would take it for the arm's value. The end's `(?!$|{{WS}}|--)`
  # holds the operator open over the comment, which `LuauComment` reads;
  # ending at the comment instead leaves the arm empty at the line end.
  # Luau has no `--` operator, so `--` here always begins a comment.
  LuauThenOperator:
    begin: ((?:then)\b)({{WS}}*)|(?<={{LUAU_THEN_BEHIND}})(?=$|{{WS}}|--)({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauThenKeyword" }
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    # `ExtraWhitespace` (not `OptionalWhitespace`) here on purpose:
    # this rule's `patterns:` list is iterated by the parser inside
    # an open scope, and `OptionalWhitespace` (`{{WS}}*`) can match
    # zero chars — that wedges the loop with no progress and trips
    # the `Too many consecutive empty matches` warning. See GRAMMAR.md
    # §12 ("Switch rules can't include OptionalWhitespace") — same
    # constraint applies to a scoped rule's own patterns list.
    patterns:
      - { include: "#LuauComment" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}})|(?!$|{{WS}}|--)

  LuauElseExpression:
    begin: (?=(?:else)\b)
    patterns:
      - { include: "#LuauElseOperator" }
      - { include: "#LuauComment" }
      - { include: "#LuauExpression" }
    # Mirror `LuauThenExpression`'s end. We need explicit
    # closing-delimiter alternatives because inline ternary lives
    # inside `{…}` / `(…)` / `[…]` and the bare `(?=$|{{WS}})` would
    # otherwise leave the scope to be force-closed by the outer
    # interpolation / paren / index rule. The glued alternative closes the
    # arm before the `then` or `do` of the statement whose condition it
    # ends (see `LuauTernaryExpression`'s `end`), and so does a `:` that one
    # of them follows (`else b:do`, `LUAU_COLON_BEFORE_HEADER_END`). After an
    # `else` that ends its line, a next line that begins a statement ends
    # the arm empty, and so does a reassignment at column 0 (`else` then
    # `y = 6`), which the reassignment around the expression then ends
    # before.
    #
    # lookaround: the `(?!…)` in the column-0 reassignment end leaves a
    # clause keyword to `LuauElseOperator` and `LuauTernaryExpression`.
    # This rule's begin takes no text, so at a column-0 `else` it opens where
    # that end is tried, and `LUAU_REASSIGNMENT_START` reads `else = 2` as a
    # target and an operator; without the exclusion the end would close the
    # arm as it opens and the arm would open again at the same position until
    # the parser's empty-match limit stopped it. Ordering the patterns cannot
    # help, since the end is tried before them; the parent's end cannot carry
    # the boundary while this arm is open; and the begin cannot take the
    # keyword, which `LuauElseOperator` reads with the line break after it.
    end: "(?={{BEAT}}|elseif\\b|$|{{WS}}|[)}\\],;]|{{AFTER_LUAU_GLUEABLE_OPERAND}}{{LUAU_SHARED_CONDITION_CLOSER_KEYWORDS}}\\b|{{LUAU_COLON_BEFORE_HEADER_END}}|{{LUAU_COLON_BEFORE_LONG_COMMENT}})|(?<=^{{WS}}*)(?={{LUAU_STATEMENT_LINE_START}})|^(?!{{LUAU_IF_BLOCK_KEYWORDS}})(?={{LUAU_REASSIGNMENT_START}})"

  LuauElseOperator:
    begin: ((?:else)\b)({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauElseKeyword" }
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    # `ExtraWhitespace` (not `OptionalWhitespace`) here on purpose:
    # this rule's `patterns:` list is iterated by the parser inside
    # an open scope, and `OptionalWhitespace` (`{{WS}}*`) can match
    # zero chars — that wedges the loop with no progress and trips
    # the `Too many consecutive empty matches` warning. See GRAMMAR.md
    # §12 ("Switch rules can't include OptionalWhitespace") — same
    # constraint applies to a scoped rule's own patterns list.
    # A comment after the `else` is read inside the operator, as for
    # `LuauThenOperator`, and the end's `--` holds it open for the comment.
    patterns:
      - { include: "#LuauComment" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}})|(?!$|{{WS}}|--)

  # ----------------------------------------------------------------------------
  # Alternator Blocks
  # ----------------------------------------------------------------------------

  LuauSparkdownAlternatorBlocks:
    patterns:
      - { include: "#LuauSparkdownSingleLineConditionalAlternatorBlock" }
      - { include: "#LuauSparkdownSingleLineSequentialAlternatorBlock" }
      - { include: "#LuauSparkdownConditionalAlternatorBlock" }
      - { include: "#LuauSparkdownSequentialAlternatorBlock" }

  # A structural word that begins its line opens a candidate that may go on
  # past its line, to arms on the lines below; one later on its line opens a
  # candidate that ends at its line unless its arms open on it.
  LuauAlternatorBlocks:
    patterns:
      - { include: "#LuauConditionalAlternatorLineStart" }
      - { include: "#LuauSequentialAlternatorLineStart" }
      - { include: "#LuauConditionalAlternatorBlock" }
      - { include: "#LuauSequentialAlternatorBlock" }

  # A candidate alternator's head: what follows the word before its arms
  # (a condition, a call's arguments, a first arm's value), in an
  # expression. It never ends right after its own text, so the candidate's
  # end never takes the head's last word for the arms' `end`
  # (`LUAU_AFTER_ALTERNATOR_ARMS`): before the arms' `|` it takes the
  # whitespace, or the first arm's separator where an `end` stands against
  # the `|` (I-1408), and anywhere else it ends where the candidate does.
  # lookaround: `LuauAlternatorArms` opens at the `|` this yields before,
  # and the candidate's own end reads the closer, beat or line end.
  LuauAlternatorHead:
    begin: (?!{{WS}}*[|])
    patterns:
      - { include: "#LuauConditionalAlternatorCondition" }
      - { include: "#LuauExpression" }
      - { include: "#ExtraWhitespace" }
    end: (?={{BEAT}})|{{_LUAU_ALTERNATOR_HEAD_BEFORE_ARMS_}}|(?=[,;)\]}])|(?={{WS}}*{{LUAU_CLOSER}})|$|^
    endCaptures:
      1:
        patterns:
          - { include: "#LuauAlternatorSeparator" }
          - { include: "#ExtraWhitespace" }

  # A line-start candidate's head, which goes on past its line through the
  # blank and comment lines before its arms (`queue -- end`, a blank line,
  # `-- the end`, then `| print(1)` lines), and ends at the start of the
  # first line that is neither (`LUAU_LINE_AFTER_ALTERNATOR_HEAD`). So the
  # candidate's end never sees a comment's last word as the arms' `end`.
  # lookaround: as for `LuauAlternatorHead`.
  LuauAlternatorLineStartHead:
    begin: (?!{{WS}}*[|])
    patterns:
      - { include: "#LuauConditionalAlternatorCondition" }
      - { include: "#LuauExpression" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}})|{{_LUAU_ALTERNATOR_HEAD_BEFORE_ARMS_}}|(?=[,;)\]}])|(?={{WS}}*{{LUAU_CLOSER}})|{{LUAU_LINE_AFTER_ALTERNATOR_HEAD}}
    endCaptures:
      1:
        patterns:
          - { include: "#LuauAlternatorSeparator" }
          - { include: "#ExtraWhitespace" }

  # A candidate alternator's arms, from its first `|` at the word's own
  # level to the `end` they take. The candidate is an alternator only when
  # it holds them (`opensAlternator`, I-1310): a `|` there is never valid
  # Luau, which has `|` only in a type, and the grammar reads a type, a
  # string, a comment and a bracket whole, so the `|` that opens them is
  # always an arm separator.
  LuauAlternatorArms:
    # lookaround: LuauAlternatorSeparator reads the `|` this opens before.
    begin: (?={{WS}}*[|])|{{LUAU_AFTER_HEAD_SEPARATOR}}
    patterns:
      - { include: "#LuauAlternatorSeparator" }
      - { include: "#LuauBlockBody" }
      - { include: "#LuauUnreadToken" }
    end: (?={{BEAT}})|({{WS}}*)(end)\b|(?=[,;)\]}])|(?={{WS}}*{{LUAU_BRANCH_OR_UNTIL}})
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauEndKeyword" }

  LuauAlternatorSeparator:
    match: ({{WS}}*)([|])({{WS}}*)(?:({{LUAU_IDENTIFIER}})({{WS}}*)([=])({{WS}}*))?
    captures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        tag: operator
        name: keyword.operator.alternator.luau
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      4:
        patterns:
          - { include: "#LuauAlternatorAssignmentName" }
      5:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      6:
        patterns:
          - { include: "#LuauAlternatorAssignmentOperator" }
      7:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  LuauAlternatorAssignmentName:
    tag: variableName
    name: variable.other.readwrite.luau
    match: ({{LUAU_IDENTIFIER}})

  LuauAlternatorAssignmentOperator:
    tag: updateOperator
    name: keyword.operator.equal.luau
    match: ([=])

  # ----------------------------------------------------------------------------
  # Conditional Alternator Block
  # ----------------------------------------------------------------------------

  LuauSparkdownConditionalAlternatorBlock:
    begin: "({{WS}}*)({{LUAU_CONDITIONAL_ALTERNATOR_KEYWORDS}})({{WS}}*){{LUAU_SHARED_ALTERNATOR_NON_MEMBER}}"
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauControlKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      4:
        patterns:
          - { include: "#Newline" }
    patterns:
      - { include: "#LuauConditionalAlternatorCondition" }
      - { include: "#LuauAlternatorSeparator" }
      - { include: "#LuauSparkdownBlockBody" }
    end: (?={{BEAT}})|({{WS}}*)(end)\b({{LUAU_END_TRAILING_COMMENTS}})?|(?={{WS}}*{{LUAU_UNTIL}})
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauEndKeyword" }
      3:
        patterns:
          - { include: "#LuauComment" }

  # A candidate conditional alternator in an expression (`{match(x) | 1 =
  # "a" | 2 = "b"}`, `local s = match x | 1 = "a" end`): the word, its
  # condition, and the arms if a `|` follows at its own level. Without arms
  # it is a name, and the converter reads its text as Luau (`match(1)` is a
  # call, I-1304). It ends at its line unless its arms opened on it, and at
  # the next line's start when a child took the line break (a cast's type,
  # whose union may go on below: `queue(x) :: string`). The
  # word carries the keyword's scope whichever it is, since its arms come
  # later; the semantic tokens give a name its own (GRAMMAR.md §10.1), so
  # until they arrive a call (`match(1)`) shows the keyword's colour.
  LuauConditionalAlternatorBlock:
    begin: "({{WS}}*)({{LUAU_CONDITIONAL_ALTERNATOR_KEYWORDS}})({{WS}}*){{LUAU_SHARED_ALTERNATOR_NON_MEMBER}}{{LUAU_ALTERNATOR_CANDIDATE_AHEAD}}"
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauControlKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauAlternatorArms" }
      - { include: "#LuauAlternatorHead" }
    end: "{{LUAU_CANDIDATE_END}}"

  # A candidate conditional alternator whose word begins its line, in a body
  # or an expression. Its arms may begin on the lines below (`match n`, then
  # `| 1 = print(1)` lines and `end`), so it goes on past its line, to the
  # first line that does not begin with a `|`, a comment or nothing.
  LuauConditionalAlternatorLineStart:
    begin: "^({{WS}}*)({{LUAU_CONDITIONAL_ALTERNATOR_KEYWORDS}})({{WS}}*){{LUAU_SHARED_ALTERNATOR_NON_MEMBER}}{{LUAU_CONDITIONAL_LINE_START_AHEAD}}"
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauControlKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauAlternatorArms" }
      - { include: "#LuauAlternatorLineStartHead" }
    end: "{{LUAU_LINE_START_CANDIDATE_END}}"

  # lookaround: the lookbehind opens the condition once, after the `match` or
  # `plural` its parent's begin took (see `LuauIfBlockCondition`). The
  # parents try it before the arms (`LuauSparkdownBlockBody`,
  # `LuauBlockBody`), so without it the condition takes each arm's first
  # token (fixture alternator/match-paren-less). `(?!$|{{WS}})` keeps an
  # empty condition from opening at a line end (`match` alone on its line)
  # or before whitespace, where the arms and
  # `LuauAlternatorSeparator` begin.
  LuauConditionalAlternatorCondition:
    begin: "(?<={{LUAU_SHARED_CONDITIONAL_ALTERNATOR_HEAD}}{{WS}}*){{LUAU_EXPRESSION_START}}"
    patterns:
      - { include: "#LuauExpression" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}})|(?=$|{{WS}}|[,;)\]}|])

  # ----------------------------------------------------------------------------
  # Sequential Alternator Block
  # ----------------------------------------------------------------------------

  LuauSparkdownSequentialAlternatorBlock:
    # The leading lookahead does double duty: it gates the rule on a
    # sequential keyword AND folds in the "not an access path" check.
    # Putting `(?!{{WS}}*[.])` inside the leading lookahead (after the
    # keyword + `\b`) ties the `.` exclusion to the keyword position,
    # so backtracking through the trailing optional captures can't
    # produce a zero-width match. A trailing `(?!{{WS}}*[.])` is
    # reachable via backtracking that consumes nothing — see GRAMMAR.md
    # §3.2 (zero-width Scoped rule → infinite loop).
    begin: "({{WS}}*)(?={{LUAU_SHARED_SEQUENTIAL_HEAD}}\\b{{LUAU_SHARED_ALTERNATOR_NON_MEMBER}}){{_LUAU_SHARED_SEQUENTIAL_MODIFIER_PREFIX_}}?({{LUAU_SEQUENTIAL_ALTERNATOR_KEYWORDS}})?({{WS}}*)"
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauControlKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      4:
        patterns:
          - { include: "#LuauControlKeyword" }
      5:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauAlternatorSeparator" }
      - { include: "#LuauSparkdownBlockBody" }
    end: (?={{BEAT}})|({{WS}}*)(end)\b({{LUAU_END_TRAILING_COMMENTS}})?|(?={{WS}}*{{LUAU_UNTIL}})
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauEndKeyword" }
      3:
        patterns:
          - { include: "#LuauComment" }

  LuauSparkdownSingleLineSequentialAlternatorBlock:
    begin: "({{WS}}*)(?={{LUAU_SHARED_SEQUENTIAL_HEAD}}){{_LUAU_SHARED_SEQUENTIAL_MODIFIER_PREFIX_}}?({{LUAU_SEQUENTIAL_ALTERNATOR_KEYWORDS}})?({{WS}}*)(?=[|])"
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauControlKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      4:
        patterns:
          - { include: "#LuauControlKeyword" }
      5:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauAlternatorSeparator" }
      - { include: "#LuauSparkdownAlternatorArm" }
      - { include: "#ExtraWhitespace" }
    end: (?={{BEAT}})|({{WS}}*)(end)\b({{LUAU_END_TRAILING_COMMENTS}})?
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauEndKeyword" }
      3:
        patterns:
          - { include: "#LuauComment" }

  LuauSparkdownSingleLineConditionalAlternatorBlock:
    begin: ({{WS}}*)({{LUAU_CONDITIONAL_ALTERNATOR_KEYWORDS}})({{WS}}*)(?=[(][^()\r\n]*[)]{{WS}}*[|])
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauControlKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauConditionalAlternatorCondition" }
      - { include: "#LuauAlternatorSeparator" }
      - { include: "#LuauSparkdownAlternatorArm" }
      - { include: "#ExtraWhitespace" }
    end: $|(?={{BEAT}})|({{WS}}*)(end)\b({{LUAU_END_TRAILING_COMMENTS}})?
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauEndKeyword" }
      3:
        patterns:
          - { include: "#LuauComment" }

  # A candidate sequential alternator in an expression (`{cycle "a" | "b"
  # end}`, `local x = queue | 1 | 2 end`), as `LuauConditionalAlternatorBlock`
  # is for `match`. See `LuauSparkdownSequentialAlternatorBlock` for the
  # leading-lookahead structure — same shape, same zero-width-match concern.
  LuauSequentialAlternatorBlock:
    begin: "({{WS}}*)(?={{LUAU_SHARED_SEQUENTIAL_HEAD}}\\b{{LUAU_SHARED_ALTERNATOR_NON_MEMBER}}){{_LUAU_SHARED_SEQUENTIAL_MODIFIER_PREFIX_}}?({{LUAU_SEQUENTIAL_ALTERNATOR_KEYWORDS}})?{{LUAU_AFTER_SEQUENTIAL_HEAD}}({{WS}}*){{LUAU_ALTERNATOR_CANDIDATE_AHEAD}}"
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauControlKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      4:
        patterns:
          - { include: "#LuauControlKeyword" }
      5:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauAlternatorArms" }
      - { include: "#LuauAlternatorHead" }
    end: "{{LUAU_CANDIDATE_END}}"

  # A candidate sequential alternator whose word begins its line
  # (`queue -- note`, then `| print(1)` lines and `end`), as
  # `LuauConditionalAlternatorLineStart` is for `match`.
  # lookaround: LuauAccessPath owns dotted keyword members; this candidate opens only at a standalone sequential keyword.
  LuauSequentialAlternatorLineStart:
    begin: "^({{WS}}*)(?={{LUAU_SHARED_SEQUENTIAL_HEAD}}\\b{{LUAU_SHARED_ALTERNATOR_NON_MEMBER}}){{_LUAU_SHARED_SEQUENTIAL_MODIFIER_PREFIX_}}?({{LUAU_SEQUENTIAL_ALTERNATOR_KEYWORDS}})?{{LUAU_AFTER_SEQUENTIAL_HEAD}}({{WS}}*){{LUAU_ALTERNATOR_LINE_START_AHEAD}}"
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauControlKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      4:
        patterns:
          - { include: "#LuauControlKeyword" }
      5:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauAlternatorArms" }
      - { include: "#LuauAlternatorLineStartHead" }
    end: "{{LUAU_LINE_START_CANDIDATE_END}}"

  # ----------------------------------------------------------------------------
  # Flow Statements
  # ----------------------------------------------------------------------------

  LuauBreakStatement:
    match: ({{WS}}*)(break)\b
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauBreakKeyword" }

  # Only where a statement begins (`LuauDeclarations`, never
  # `LuauExpressionDeclarations`) and only as Luau reads the statement
  # (`LUAU_CONTINUE_STATEMENT_AHEAD`): `continue = 2` is an assignment.
  LuauContinueStatement:
    match: ({{WS}}*)(continue){{LUAU_CONTINUE_STATEMENT_AHEAD}}
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauContinueKeyword" }

  LuauGotoStatement:
    tag: meta
    name: meta.function.luau
    begin: ({{WS}}*)(goto)\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauControlKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauLabelName" }
    applyEndPatternLast: true
    end: (?={{BEAT}})|(?=$|{{WS}}*(?!{{LUAU_COMMENT_START}}))

  LuauReturnStatement:
    tag: meta
    name: meta.function.luau
    begin: ({{WS}}*)(return)\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauControlKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    # As in Luau, a `return` that is the whole of its line (optionally with a
    # comment) reads its values from the next line: `LuauReturnLineBreak`
    # carries the scope across the line break (GRAMMAR.md §11.5). The end
    # does not fire at the end of such a line for that reason, and closes
    # before a keyword that ends the block (`end`, `else`, `elseif`, `until`)
    # or starts a statement that is not an expression, so a bare `return`
    # still returns nothing and leaves that keyword to its block.
    #
    # A `return` after other code on its line (`& return`, `local x = 5
    # return`) ends at the line, because narrative bodies reach this rule
    # through `LuauSparkdownExplicitStatement` and `LuauExpression`, and the line
    # after them is prose. An unmarked `return` in a narrative body is
    # display text and never reaches this rule. A
    # `return` after `then`, `else`, `do` or `repeat` ends at the line too:
    # an `&` statement can put a bare `repeat` or a ternary `else` there
    # (`& repeat return`, `& y = if c then 1 else return`), and the line
    # after it is prose.
    #
    # `;` alternative: `return f(x); end`-style one-liners close the
    # return statement before the separator (`;` no longer parses
    # inside `LuauExpression`).
    #
    # Unread-character alternative: Luau reads a non-ASCII character, or
    # `$ @ ! ?` or a backslash, only inside a string or comment, which are
    # rules of their own, so the return can never read one (`return x名`,
    # `return x$`). It closes before it, and the body reads
    # the character as an unread token in both engines; without it
    # vscode-textmate passes over the character inside the return and the
    # tree closes the return incomplete there (GRAMMAR.md §17.2).
    patterns:
      - { include: "#LuauReturnLineBreak" }
      - { include: "#LuauComment" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#LuauExpression" }
    end: (?={{BEAT}})|(?<!^{{WS}}*return{{WS}}*)(?=$)|(?={{WS}}|;|[$@!?\\]|[^\x00-\x7F])|(?={{LUAU_RETURN_END_KEYWORDS}})|(?=^{{LUAU_LINE_CONTINUATION}}|^{{LUAU_INDEXER_LINE_CONTINUATION}})

  # A line that continues the line before it (`LuauLineContinuation`, or a
  # `[` line) is not the returned value, so the break ends at its start and
  # leaves it to the body, which reports it.
  LuauReturnLineBreak:
    begin: (?<=^{{WS}}*return{{WS}}*)(?=$|{{LUAU_COMMENT_START}})
    patterns:
      - { include: "#LuauComment" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}})|(?=^{{LUAU_LINE_CONTINUATION}}|^{{LUAU_INDEXER_LINE_CONTINUATION}})|(?!$|{{WS}}|{{LUAU_COMMENT_START}})

  # `external message(x)` — single-line declaration of a host-bound callable.
  # Captures the `external` keyword, the function name (via the regular
  # `LuauFunctionDeclarationName`), and a paren-delimited parameter list
  # (via the regular `LuauFunctionParameters`). No body — the declaration
  # ends at the closing `)` (in practice at the trailing line break, since
  # the parameters rule consumes the paren pair). Only legal at top level
  # (included from the file-scope pattern list, not from `LuauDeclarations`).
  LuauExternalDeclaration:
    tag: meta
    name: meta.function.external.sd
    begin: ({{WS}}*)(external)\b({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauExternalKeyword" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauFunctionDeclarationName" }
      - { include: "#LuauFunctionParameters" }
      - { include: "#ExtraWhitespace" }
    end: (?=$|{{WS}}*$)

  LuauExternalKeyword:
    tag: modifier
    name: storage.modifier.external.sd
    match: (external)\b

  # ----------------------------------------------------------------------------
  # Modifiers & Keywords
  # ----------------------------------------------------------------------------

  LuauAccessModifier:
    tag: modifier
    name: storage.modifier.access.luau
    match: ({{LUAU_ACCESS_MODIFIERS}})

  LuauScopeModifier:
    tag: modifier
    name: storage.modifier.scope.luau
    match: ({{LUAU_SCOPE_MODIFIERS}})

  LuauControlKeyword:
    tag: controlKeyword
    name: keyword.control.luau

  # Scope-ending keywords are pulled OUT of `LuauKeyword` so general
  # expression contexts don't greedily match them as keyword tokens
  # before the surrounding scope's end-pattern fires. `end` is already
  # excluded for the same reason. Each scope-ender is matched by the
  # rule that owns its scope:
  #   • `then`              → `LuauIfBlockCondition` end / `LuauThenExpression`
  #   • `else` / `elseif`   → `LuauElseBlock` / `LuauElseifBlock` / `LuauElseExpression`
  #   • `do`                → `LuauForCondition` / `LuauWhileCondition` end / `LuauDoBlock` begin
  #   • `until`             → `LuauRepeatLoop` end
  # Inline ternary additionally re-includes the if-style scope-enders
  # via `LuauTernaryKeyword` so `then`/`else`/`elseif` still highlight
  # when they appear free-standing inside a `LuauTernaryExpression`.
  LuauTernaryKeyword:
    patterns:
      - { include: "#LuauThenKeyword" }
      - { include: "#LuauElseifKeyword" }
      - { include: "#LuauElseKeyword" }

  # Not `continue`, which is a name where an expression stands (#984).
  LuauKeyword:
    patterns:
      - { include: "#LuauBreakKeyword" }
      - { include: "#LuauReturnKeyword" }
      - { include: "#LuauInKeyword" }
      - { include: "#LuauLocalKeyword" }
      - { include: "#LuauConstKeyword" }
      - { include: "#LuauUnitKeywords" }
      - { include: "#LuauIfKeyword" }
      - { include: "#LuauForKeyword" }
      - { include: "#LuauWhileKeyword" }
      - { include: "#LuauRepeatKeyword" }
      - { include: "#LuauLocalKeyword" }
      - { include: "#LuauConstKeyword" }
      - { include: "#LuauFunctionKeyword" }

  LuauEndKeyword:
    tag: controlKeyword
    name: keyword.control.end.luau
    match: (end)\b

  LuauDoKeyword:
    tag: controlKeyword
    name: keyword.control.do.luau
    match: (do)\b

  LuauThenKeyword:
    tag: controlKeyword
    name: keyword.control.then.luau
    match: (then)\b

  LuauIfKeyword:
    tag: controlKeyword
    name: keyword.control.if.luau
    match: (if)\b

  LuauElseifKeyword:
    tag: controlKeyword
    name: keyword.control.elseif.luau
    match: (elseif)\b

  LuauElseKeyword:
    tag: controlKeyword
    name: keyword.control.else.luau
    match: (else)\b

  LuauForKeyword:
    tag: controlKeyword
    name: keyword.control.for.luau
    match: (for)\b

  LuauMatchKeyword:
    tag: controlKeyword
    name: keyword.control.match.luau
    match: (match)\b

  LuauCaseKeyword:
    tag: controlKeyword
    name: keyword.control.case.luau
    match: (case)\b

  LuauWhileKeyword:
    tag: controlKeyword
    name: keyword.control.while.luau
    match: (while)\b

  LuauRepeatKeyword:
    tag: controlKeyword
    name: keyword.control.repeat.luau
    match: (repeat)\b

  LuauUntilKeyword:
    tag: controlKeyword
    name: keyword.control.until.luau
    match: (until)\b

  LuauBreakKeyword:
    tag: controlKeyword
    name: keyword.control.break.luau
    match: (break)\b

  LuauContinueKeyword:
    tag: controlKeyword
    name: keyword.control.continue.luau
    match: (continue)\b

  LuauReturnKeyword:
    tag: controlKeyword
    name: keyword.control.return.luau
    match: (return)\b

  LuauInKeyword:
    tag: controlKeyword
    name: keyword.control.end.luau
    match: (in)\b

  LuauLocalKeyword:
    tag: modifier
    name: storage.modifier.local.luau
    match: (local)\b

  # `const` is a keyword only before the name it declares (#1328, #1432).
  # lookaround: anywhere else `LuauAccessPath`, which `LuauExpression` tries
  # after `LuauKeyword`, reads it as a name (`a + const + 1`, `(const)`);
  # reordering them would let the path take every keyword's word.
  LuauConstKeyword:
    tag: modifier
    name: storage.modifier.const.luau
    match: (const)\b{{LUAU_DECLARATION_NAME_AHEAD}}

  LuauFunctionKeyword:
    tag: controlKeyword
    name: keyword.control.luau
    match: (function)\b

  LuauSelfKeyword:
    tag: self
    name: variable.language.self.luau
    match: (self)\b

  LuauUnitKeywords:
    tag: variableName
    name: variable.other.readwrite.unit.luau
    match: (?<!\.)[.][.][.](?!\.)

  # ----------------------------------------------------------------------------
  # Identifiers
  # ----------------------------------------------------------------------------

  LuauAccessPath:
    # Not at a `scene` or `branch` header: the end closes there at once, and
    # an empty path repeated at the header is an empty-match loop for the
    # rule that includes it (a declaration whose comma ends the line before
    # the header). A declaration that begins with a contextual word
    # (`type T`, `export type T`, `store x`) after a comma that ends a line
    # is not read as a value: the declaration or reassignment whose list the
    # comma continues ends before it (`LUAU_DECLARATION_STOP`), and its end
    # is tried before its values.
    begin: "(?!{{BEAT}})(?={{LUAU_SHARED_PATH_KEYWORD_GUARD}}{{LUAU_IDENTIFIER}})"
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauAccessPart" }
    # A `for` loop variable's path is its name alone, and ends before the
    # `:` of the variable's type annotation (`for k: number | string, v in t`,
    # `for i: number = 1, 3`), which is then read as the type it is. The
    # variable is a name in the list right after `for`, before the header's
    # `in` or `=` (`LUAU_SHARED_FOR_BINDING_BEHIND`; a name after a comma
    # past them is a value's, I-1448). A `:` after a name
    # followed by a method name and its arguments stays a method call, with
    # block comments before the arguments too (`t:m --[[c]] ()`). A `:` that
    # a header's `do` or `then` follows on its line ends the path, so the
    # rule around it reads the `:` (`LUAU_COLON_BEFORE_HEADER_END`).
    end: "(?={{BEAT}})|(?=$|{{WS}}*{{LUAU_SHARED_PATH_END_KEYWORDS}}|{{WS}}*{{LUAU_COLON_BEFORE_HEADER_END}}|{{WS}}*{{LUAU_COLON_BEFORE_LONG_COMMENT}}|{{LUAU_SHARED_PATH_NO_CONTINUATION}}|{{LUAU_SHARED_FOR_BINDING_BEHIND}}{{LUAU_SHARED_PATH_TYPE_ANNOTATION_AHEAD}}{{LUAU_SHARED_PATH_NO_METHOD_CALL}}){{_LUAU_VALUE_OPERATOR_AHEAD_}}"
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  # A `:` with no name before the token after it that no name can be (`;`,
  # `,`, `=`, a closing bracket or a keyword) is a part of the path
  # (`t.a: = 2`), so the path does not stop unfinished at the colon. The
  # validator reports it as Luau words it, a missing method name, except
  # after a `for` loop variable the path reads on a line the header
  # continues onto, where the type checker reports a missing type.
  LuauAccessPart:
    emit: true
    patterns:
      - { include: "#LuauKeywordMethodAccessor" }
      - { include: "#LuauNextLineMethodAccessor" }
      - { include: "#LuauTypeAnnotationMissingType" }
      - { include: "#LuauFunctionAccessor" }
      - { include: "#LuauDanglingAccessor" }
      - { include: "#LuauPropertyAccessor" }
      - { include: "#LuauPropertyIndexer" }
      - { include: "#LuauFunctionDeclarationName" }
      - { include: "#LuauFunctionCall" }
      - { include: "#LuauVariable" }

  # A method access whose `:` ends its line, or is followed on it only by a
  # comment (`flag:` with `Hello there.` on the next line), which Luau reads
  # across the line break and its trivia: the first name after the `:`,
  # past spaces, blank lines and comments, is the method's name, and what
  # follows it the call's arguments, in error (#780). The function's line
  # after it is part of the function, as Luau's rules say. A line that
  # begins with no name and is no blank or comment line (`end`, a `(`)
  # leaves the `:` alone, so the word stays the token it is and Luau's error
  # for the missing name is reported at it. A `for` loop variable's `:` is
  # its type's: the path ends before it. The rule's `end:` reads the name,
  # since only the rule that reads the `:` knows the next word is a method's
  # name.
  # It is tried after `LuauKeywordMethodAccessor`, which reads a keyword
  # the `:`'s own line holds after block comments (`a: --[[x]] end`).
  # lookaround: the begin's lookahead keeps the rule to a `:` that ends its
  # line or a comment follows, the one `:` whose method name is past the
  # line's end or a comment. The §10.1 alternatives: ordering alone cannot
  # do it, since without the lookahead this rule, tried first, takes every
  # `:` of a path, and tried after the rivals that read what follows a `:`
  # on its own line (a name and its call, `LuauFunctionAccessor`; a keyword,
  # `LuauKeywordMethodAccessor`; a missing type,
  # `LuauTypeAnnotationMissingType`), it takes the `:` they leave mid-line
  # too. A `begin:` cannot read the name, since a regex never spans the line
  # break, and the parent's `end:` cannot, since the path ends with its
  # line, so this rule's `end:` reads it, wherever the trivia the rule's
  # patterns read leaves it. The end's `BEAT` lookahead ends the rule before
  # a header line (`scene`, `branch`), whose keyword story reads; its last
  # lookahead ends it before a token that is no name, space, line break or
  # comment, wherever the trivia leaves it (`end` at a line's start or after
  # a block comment, a `(`), leaving what is there to be read as what it
  # is, so the rule never closes incomplete (§17.2).
  LuauNextLineMethodAccessor:
    begin: ({{WS}}*)([:](?![:]))(?={{WS}}*{{LUAU_LINE_END_OR_COMMENT}})
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#LuauAccessorOperator" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}})|({{WS}}*)({{LUAU_UNRESERVED_IDENTIFIER}})|(?!{{WS}}|$|{{LUAU_COMMENT_START}}|{{LUAU_UNRESERVED_IDENTIFIER}})
    endCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#LuauFunctionName" }

  # A method access whose name is a reserved word on the `:`'s line
  # (`a:do`, `a:end`), which Luau reads as the method's name, in error
  # (`Expected identifier when parsing method name, got 'do'`, which the
  # validator reports at the word, Luau's first error). The word is the
  # method's name (`LuauKeywordMethodName`), so it opens no block and closes
  # none (`a:end` leaves the function its own `end`). It never meets `do`
  # or `then`: the path ends before a `:` that one of them follows, which
  # the rule around the path reads (`LUAU_COLON_BEFORE_HEADER_END`). It is
  # tried before `LuauTypeAnnotationMissingType`, which would read the `:`
  # as an annotation missing its type and leave the word to begin a
  # statement. Spaces and block comments may stand between the `:` and the
  # word (`a: --[[c]] end`), as in Luau; they are read inside the rule.
  # lookaround: `LUAU_TYPECAST_OPERATOR` owns `::`, which this access never takes; the begin's lookahead and the end's lookbehind are `LuauExpressionKeywordMethodAccessor`'s, for the reasons given there.
  LuauKeywordMethodAccessor:
    begin: ({{WS}}*)([:](?![:]))(?={{LUAU_METHOD_TRIVIA}}{{LUAU_KEYWORD_NOT_HEADER_END}})
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#LuauAccessorOperator" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#ExtraWhitespace" }
      - { include: "#LuauKeywordMethodName" }
    end: (?<=[a-z])|$

  # A method access whose name is `do` or `then` on the `:`'s line, in an
  # expression (`local b = a:  do`, `a: --[[c]] then()`), which Luau reads as
  # the method's name, in error, as `LuauKeywordMethodAccessor` reads the
  # other keywords inside a path. The access path ends before the `:`
  # (`LUAU_COLON_BEFORE_HEADER_END`) so a header can read the `:` alone
  # first before its own keyword (`LuauLoopHeaderMethodColon`,
  # `LuauIfHeaderMethodColon`); this reads the keyword everywhere else,
  # including the other header's keyword in a condition (`if t:do() then`)
  # and after a value in brackets (`(t):do()`). The `:` must not follow a
  # type operator (`LUAU_TYPE_OPERATOR_BEHIND`): after one with no right operand
  # (`t :: T | :do`) the stray-colon token reads it and the word is left to
  # the rule around, as on base, since a header's condition (`while t ::
  # {a: T | :do end`) or an if-expression's arm may hold it there. Before a
  # comment of level nine or more the `:` must follow a value
  # (`LUAU_TYPE_END`). The word opens no block,
  # so the function keeps its own `end`. The spaces and block comments between
  # the `:` and the word, and the word, are read inside the rule, which ends
  # right after the word.
  #
  # After a value no access path holds, it also takes every other reserved
  # word no type can begin (I-1344): a bracketed receiver (`(t):end`,
  # `f():function`, `(t)[1]:end`), a type that ends before the `:`
  # (`t :: T:end`, `LUAU_COLON_BEFORE_RESERVED_WORD`), or any other value
  # Luau reads a method's `:` after, in error (`1:end`). The value's last
  # character is one a type can end with (`LUAU_TYPE_END`), which a
  # bracket's, a name's, a string's and a table's last character is. A
  # `for` loop's variable is excluded, since there the `:` is its type's
  # (`for k: in t`, `LUAU_SHARED_FOR_BINDING_BEHIND`); `do` and `then` keep
  # the first alternative there, as before. `nil`, `true` and `false` are
  # types, so a type annotation reads them as it did.
  #
  # A block comment of level nine or more on the `:`'s line hides the word
  # from the begin (I-1459), so there the begin takes the `:` before the
  # comment (`LUAU_METHOD_TRIVIA_TO_LONG_COMMENT`), after any value an
  # expression reads, a path and a complete type both ending before such a `:`
  # (`LUAU_COLON_BEFORE_LONG_COMMENT`); a loop's or an `if`'s condition
  # tries its own colon rule first, which leaves the header its keyword
  # (`LuauLoopHeaderLongCommentMethodColon`). The patterns read the comment
  # at its own level, and the end decides on the token after it: any
  # reserved word is the name, `do` and `then` too, since no header holds
  # the access here, and before a name or any other token the access ends,
  # leaving it to be read as what it is (`(t): --[=========[c]=========] m()`,
  # whose call the expression reads and the converter reads as the
  # method's, as Luau does). In an annotation, the annotation's operator is
  # tried before this rule, so the annotation's own `:` stays its own.
  #
  # lookaround: the begin's lookahead is what tells this `:` from the rivals
  # that begin at the same character (`LuauTypeAnnotationOperation`,
  # `LuauChainedFunctionCall`, `LuauTypeAnnotationMissingType`), and keeps the
  # access to a keyword on the `:`'s line, as Luau reads it. The §10.1
  # alternatives were each tried: ordering cannot do it, since this rule
  # tried first would take every `:` of the expression, and tried after its
  # rivals it never meets the colon. A narrower rule is what this is,
  # included only where an expression stands, with the header's own colon
  # rules tried before it in each condition. The parent's `end:` already
  # does its part (the path ends before the `:`). A match that took the
  # keyword with no lookahead would have to capture the block comments
  # between, and no capture here reads a comment, since `LuauBlockComment`
  # is a scoped rule. An `end:` that took the keyword would end on `end`
  # in `a:end`, a closer, which a rule bounded by it must refuse when it
  # did not open it. So the keyword is read by the rule's patterns, and
  # the end is zero-width right after it: a lowercase letter stands before
  # only the keyword's end, since the trivia ends in a space, a `]` or the
  # `:`. The `$` is the end's bail-out, which the begin's lookahead never
  # leaves it to need. The begin's lookbehinds name the value before the
  # `:`, which no rule that reads the `:` can know: the receiver is a
  # sibling the expression read before it, and the type that ended before
  # the `:` cannot read it either, since a type's `:` is no method's. The
  # begin first looks for the `:` itself, so the lookbehinds, which read back
  # along the line, run only at a `:` and not at every character an
  # expression tries the rule at.
  LuauExpressionKeywordMethodAccessor:
    begin: (?={{WS}}*{{LUAU_SINGLE_COLON}})(?:(?={{WS}}*{{LUAU_COLON_BEFORE_LONG_COMMENT}})(?<={{LUAU_TYPE_END}}{{WS}}*)|(?={{WS}}*{{LUAU_COLON_BEFORE_HEADER_END}})(?<!{{LUAU_TYPE_OPERATOR_BEHIND}})|(?={{WS}}*{{LUAU_COLON_BEFORE_RESERVED_WORD}})(?<={{LUAU_TYPE_END}}{{WS}}*)(?!{{LUAU_SHARED_FOR_BINDING_BEHIND}}))({{WS}}*)([:](?![:]))(?={{LUAU_METHOD_TRIVIA}}{{LUAU_KEYWORD}}|{{LUAU_METHOD_TRIVIA_TO_LONG_COMMENT}})
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#LuauAccessorOperator" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#ExtraWhitespace" }
      - { include: "#LuauKeywordMethodName" }
    end: (?<=[a-z])|$|(?!{{WS}}|{{LUAU_COMMENT_START}}|{{LUAU_KEYWORD_ON_COLON_LINE_AHEAD}})

  # The `:` of a method access whose name is missing before the keyword
  # that ends a loop's header (`while t: do`, `for k in t: do`). Luau reads
  # the keyword as the name, in error, but the header ends at it here, as
  # it would with the name in place, so the loop keeps its block. The
  # validator reports Luau's missing method name at the keyword. The `for`
  # and `while` conditions try it before their expression; an `if`'s
  # condition does not, since its `do` is no header's end, so there the
  # expression reads the `do` as the name (`if t:do() then`).
  #
  # lookaround: the lookahead leaves the keyword to the condition's `end:`,
  # which reads it (GRAMMAR.md §10.1, the end carrying the load), and tells
  # this `:` from the method access that an expression would read there
  # (`LuauExpressionKeywordMethodAccessor`). Ordering does the rest: each
  # loop condition tries this rule before `LuauExpression`, so the header's
  # `:` never reaches that access. A colon rule without the lookahead would
  # take every other `:` the condition reads first (`while t:m() do`). Split
  # from the `if`'s rule (`LuauIfHeaderMethodColon`), each condition holds
  # only the colon its own end can follow. The access path cannot make this
  # choice, since it cannot see whether a header holds it; it ends before
  # the `:` (`LUAU_COLON_BEFORE_HEADER_END`), which is how the colon is left
  # to the condition.
  LuauLoopHeaderMethodColon:
    tag: invalid
    name: invalid.illegal.luau
    match: ({{WS}}*)([:](?![:]))(?={{LUAU_METHOD_TRIVIA}}do{{LUAU_NAME_END}})
    captures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#LuauAccessorOperator" }

  # The same for the `then` that ends an `if`'s, an `elseif`'s or an if
  # expression's condition (`if t: then`, `local x = if t: then 1 else 2`).
  # lookaround: as `LuauLoopHeaderMethodColon`'s, for `then`.
  LuauIfHeaderMethodColon:
    tag: invalid
    name: invalid.illegal.luau
    match: ({{WS}}*)([:](?![:]))(?={{LUAU_METHOD_TRIVIA}}then{{LUAU_NAME_END}})
    captures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#LuauAccessorOperator" }

  # A method's `:` in a loop's condition whose trivia reaches a block
  # comment of level nine or more (`while t: --[=========[c]=========] do`,
  # I-1459), which hides the word after it from every lookahead, so the
  # access path ends before the `:` (`LUAU_COLON_BEFORE_LONG_COMMENT`) and
  # this rule reads the `:` and the comments. It ends before the loop's
  # `do`, which the header takes, as `LuauLoopHeaderMethodColon` leaves it
  # when a lookahead sees it; it reads any other reserved word as the
  # method's name, as Luau reads it, and ends before any other token, which
  # the condition reads (a method's name and its call).
  # lookaround: the end's lookahead is the header's own keyword, which the condition's `end:` reads (GRAMMAR.md §10.1, the end carrying the load); the begin's lookahead keeps the rule to a `:` that the path ended before, which only the trivia after it shows. Tried before `LuauLoopHeaderMethodColon` and the expression.
  LuauLoopHeaderLongCommentMethodColon:
    begin: (?!{{LUAU_SHARED_FOR_BINDING_BEHIND}})({{WS}}*)([:](?![:]))(?={{LUAU_METHOD_TRIVIA_TO_LONG_COMMENT}})
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#LuauAccessorOperator" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#ExtraWhitespace" }
      - { include: "#LuauKeywordMethodName" }
    end: (?=do{{LUAU_NAME_END}})|(?<=[a-z])|$|(?!{{WS}}|{{LUAU_COMMENT_START}}|{{LUAU_KEYWORD_ON_COLON_LINE_AHEAD}})

  # The same in an `if`'s, an `elseif`'s or an if expression's condition,
  # before its `then`.
  # lookaround: as `LuauLoopHeaderLongCommentMethodColon`'s, for `then`.
  LuauIfHeaderLongCommentMethodColon:
    begin: (?!{{LUAU_SHARED_FOR_BINDING_BEHIND}})({{WS}}*)([:](?![:]))(?={{LUAU_METHOD_TRIVIA_TO_LONG_COMMENT}})
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#LuauAccessorOperator" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#ExtraWhitespace" }
      - { include: "#LuauKeywordMethodName" }
    end: (?=then{{LUAU_NAME_END}})|(?<=[a-z])|$|(?!{{WS}}|{{LUAU_COMMENT_START}}|{{LUAU_KEYWORD_ON_COLON_LINE_AHEAD}})

  # A reserved word in a method's name (`LuauKeywordMethodAccessor`).
  LuauKeywordMethodName:
    tag: invalid
    name: invalid.illegal.luau
    match: ({{LUAU_WORD}})

  LuauFunctionAccessor:
    match: ({{WS}}*)({{LUAU_ACCESSOR_OPERATOR}})({{WS}}*)({{LUAU_IDENTIFIER}})({{WS}}*)(?={{LUAU_FUNCTION_CALL_START}})
    captures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#LuauAccessorOperator" }
      3:
        patterns:
          - { include: "#ExtraWhitespace" }
      4:
        patterns:
          - { include: "#LuauStdLibMethods" }
          - { include: "#LuauFunctionName" }
      5:
        patterns:
          - { include: "#ExtraWhitespace" }

  # The lookbehind matches either `function ` (regular definition) or
  # `external ` (host-binding declaration) — same identifier-capture shape,
  # different surrounding keyword. Adding `external` here means the
  # `LuauExternalDeclaration` rule can reuse this declaration-name pattern
  # without a parallel `LuauExternalDeclarationName` rule.
  #
  # lookaround: the lookbehind keeps the name to the header of
  # `LuauFunctionDefinition` and `LuauExternalDeclaration`, which take the
  # keyword in their begins but try their patterns again after the header,
  # and textmate-grammar-tree has no `\G` to match only where the begin
  # ended. `LuauFunctionBody`, tried first, opens right after a definition's
  # header, so its own patterns meet a name only in the header or where the
  # header leaves a comment and then a word on its line: without the
  # lookbehind, `external e(x) --[[ c ]] w` declares a second function `w`.
  # `LuauAccessPart` also includes this rule, before `LuauVariable`, so a
  # name after `function` or `external` inside an expression
  # (`return external value`, written before the author finishes) is read
  # as a declared name; there the lookbehind is the rule's context as well
  # as its anchor, and without it every name of every access path would be
  # a declared name (fixture luau-access/chained-property).
  # `(?!{{LUAU_ACCESSOR_OPERATOR}})` leaves a dotted or method name
  # (`function a.b()`, `function a:m()`) to `LuauBlockBody`'s access path,
  # where `LuauPropertyAccessor` and `LuauFunctionAccessor` read its parts
  # and `lowerLuauFunctionDefinition` reads it as a path. The §10.1 fixes do
  # not replace it: tried first, the access path would also take a plain
  # name, which must stay this rule's; `a` in `a.b` and a plain name are the
  # same identifier, so no tightened variable separates them; and a name
  # has no end that could stop before a `.` it has not reached. Only the
  # character after the name tells the two apart. The lookbehind passes over
  # block comments that close on the keyword's line when the keyword begins
  # its line (`LUAU_HEADER_COMMENTS`); the cost: one that spans lines hides
  # the name.
  LuauFunctionDeclarationName:
    match: (?<={{LUAU_DECLARATION_KEYWORDS}}\b{{WS}}*|{{LUAU_HEADER_LINE_START}}{{LUAU_DECLARATION_KEYWORDS}}\b{{LUAU_HEADER_COMMENTS}})({{LUAU_IDENTIFIER}})\b({{WS}}*)(?!{{LUAU_ACCESSOR_OPERATOR}})
    captures:
      1:
        patterns:
          - { include: "#LuauFunctionName" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }

  # Chained method-call rule. After a value-expression element ends in
  # a `LuauParenthetical` (function-call result), one or more
  # `:method(args)` sequences may follow. The grammar's `LuauAccessPath`
  # can't pick them up because it requires beginning with an identifier,
  # not `:`. Without this rule, the `:` after `)` would be consumed by
  # `LuauTypeAnnotationOperation` and misparsed as a type annotation —
  # see the order comment in `LuauExpression` for why this rule must
  # come first.
  #
  # The begin pattern is a positive lookahead for `:identifier(`. The
  # body matches one or more `LuauFunctionAccessor` + `LuauParenthetical`
  # pairs (handled by the patterns iterating until they no longer match).
  # The end pattern triggers when the next position is no longer the
  # start of another chained call.
  LuauChainedFunctionCall:
    begin: ({{WS}}*)(?=[:]{{LUAU_IDENTIFIER}}{{WS}}*{{LUAU_FUNCTION_CALL_START}})
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauFunctionAccessor" }
      - { include: "#LuauParenthetical" }
    end: (?!{{WS}}*[:]{{LUAU_IDENTIFIER}}{{WS}}*{{LUAU_FUNCTION_CALL_START}})

  # Trailing property / indexer access after a `LuauAccessPath +
  # LuauParenthetical` pair (i.e. after a method call's sibling
  # parenthetical). Without this, `a:m(x).y` parses as `LuauAccessPath
  # [a, :m] + LuauParenthetical [(x)]` and the trailing `.y` falls
  # through to narrative text — which knocks the parser out of the
  # enclosing function/block context entirely. With it, the chain
  # continues via `LuauPropertyAccessor` / `LuauPropertyIndexer` links
  # so the access path is properly contained.
  #
  # The begin uses a lookbehind for `)` to scope this rule to
  # positions immediately following a parenthetical (the call-args
  # sibling of a method call). Without the lookbehind, the bare `[`
  # lookahead would steal `[key]` entries inside table literals
  # (`{ ["k"] = v }` etc.). The patterns consume any mix of dot /
  # indexer chain links; the end fires once no more follow.
  # A `.` with no name after it (`(t).a.`) is a dangling accessor, as after
  # a path; `..` is the concatenation operator.
  #
  # An access also continues a table constructor or a string (`{}.x`,
  # `"s"[1]`), a value Luau indexes only in brackets, so the statement keeps
  # the access and the converter reports Luau's errors for it (#1348).
  LuauChainedPropertyAccess:
    begin: "(?<=[)}\"'`])({{WS}}*)(?=[.]{{LUAU_SHARED_SINGLE_DOT_GUARD}}|{{LUAU_INDEXER_START}})"
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauDanglingAccessor" }
      - { include: "#LuauPropertyAccessor" }
      - { include: "#LuauPropertyIndexer" }
    end: "(?!{{WS}}*{{LUAU_SHARED_PROPERTY_CHAIN_START}})"

  # A line of Luau code that begins with `.name`, `:name`, a binary operator
  # or a cast's `::` continues the expression on the line before it: its
  # access parts, the call arguments and indexers after them, and the
  # operations and casts that follow. The statement or expression that
  # ended on the previous line has already closed, because no rule can see
  # the next line when its line ends, so this node is that statement's
  # sibling and the lowerer joins the two (GRAMMAR.md §11.6).
  #
  # Only Luau-only contexts include it: in a body that also holds display
  # lines, a line starting with `.` is prose.
  #
  # `and` and `or` are tried before an access part, which would otherwise
  # read either as a name.
  #
  # A line that begins with a `:` and a reserved word
  # (`LUAU_LINE_START_KEYWORD_METHOD`, I-1449) is one too: the word is the
  # method's name, so it opens no block and closes none (`(t)` then `:end`
  # leaves the function its own `end`). `LuauLineStartKeywordMethodAccessor`
  # reads the `:` and the word, and the end does not fire before that `:`.
  LuauLineContinuation:
    begin: ^({{WS}}*)(?={{LUAU_LINE_CONTINUATION}})
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauLineStartKeywordMethodAccessor" }
      - { include: "#LuauLogicalOperation" }
      - { include: "#LuauAccessPart" }
      - { include: "#LuauParenthetical" }
      - { include: "#LuauString" }
      - { include: "#LuauTable" }
      - { include: "#LuauArithmeticOperation" }
      - { include: "#LuauCompareOperation" }
      - { include: "#LuauConcatOperation" }
      - { include: "#LuauTypeCastOperation" }
    end: "(?={{BEAT}})|(?!{{WS}}*{{LUAU_SHARED_PATH_OR_CALL_CONTINUATION}}|{{LUAU_LINE_START_KEYWORD_METHOD}})"

  # The `:` that begins a continuation line and the reserved word after it on
  # that line, the method's name in error (`(t)` then `:end`, I-1449), with
  # the spaces and block comments between them, as `LuauKeywordMethodAccessor`
  # reads them after a value on the `:`'s own line. Past a block comment of
  # level nine or more, which hides the word from the begin, the end decides
  # on the token after the comment: any reserved word but a header's `do` or
  # `then` is the name, and before any other token the access ends, leaving
  # it to be read as what it is (`LuauExpressionKeywordMethodAccessor`'s
  # end).
  # lookaround: the begin's lookahead is the line rule's own
  # (`LUAU_LINE_START_KEYWORD_METHOD`), which tells this `:` from the
  # `:name` access `LuauAccessPart` reads; the end's lookahead keeps a
  # header's `do` or `then` past a long comment to the condition that may
  # hold the line, as `LuauLoopHeaderLongCommentMethodColon` leaves it.
  LuauLineStartKeywordMethodAccessor:
    begin: ({{WS}}*)(?={{LUAU_LINE_START_KEYWORD_METHOD}})([:])
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#LuauAccessorOperator" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#ExtraWhitespace" }
      - { include: "#LuauKeywordMethodName" }
    end: (?<=[a-z])|$|(?!{{WS}}|{{LUAU_COMMENT_START}}|{{LUAU_LINE_START_NAME_PAST_COMMENT_AHEAD}})

  # A line of Luau code in a statement body that begins with `-` continues the
  # expression on the line before it, since no statement begins with `-`
  # (`local total = a` then `- b`). Inside brackets and conditions a `-` line
  # may begin a new value (`{ 1,` then `-2 }`), and it already reads as part
  # of the expression there, so only `LuauBlockBody` includes this rule. A
  # `--` line is a comment, and a `->` line a divert.
  LuauMinusLineContinuation:
    begin: ^({{WS}}*)(?={{LUAU_MINUS_LINE_START}})
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauAccessPart" }
      - { include: "#LuauParenthetical" }
      - { include: "#LuauString" }
      - { include: "#LuauTable" }
      - { include: "#LuauArithmeticOperation" }
      - { include: "#LuauCompareOperation" }
      - { include: "#LuauConcatOperation" }
      - { include: "#LuauLogicalOperation" }
      - { include: "#LuauTypeCastOperation" }
    end: (?={{BEAT}})|(?!{{WS}}*(?:{{LUAU_ACCESSOR_OPERATOR}}{{WS}}*{{LUAU_IDENTIFIER}}|{{LUAU_DANGLING_ACCESSOR_START}}|{{LUAU_FUNCTION_CALL_START}}|\[|{{LUAU_MINUS_LINE_START}}|{{LUAU_LINE_CONTINUATION_OPERATOR}}))

  # A line of Luau code that begins with `[` indexes the value on the line
  # before it (`local y = t` then `[1]` reads as `t[1]`), since outside a table
  # constructor no value begins with `[`. In a table it begins a key
  # (`{ a,` then `[2] = b }`), so `LuauTable` leaves this rule out; every other
  # context that includes `LuauLineContinuation` includes it. A `[[` or `[=[`
  # line begins a long string.
  # A line of Luau code that begins with `|` or `&` continues, as a union or
  # intersection member, the type that ended an earlier line. A type takes in
  # blank lines and a `|` line itself, but a `--` line ends it, since outside
  # Luau code a `--` line is story text, and so does an `&` line, since in
  # story text `&` marks a Luau statement (`LUAU_TYPE_LINE_BREAK`). So a `|`
  # line is this rule after a comment-only line (`local v: number` then
  # `-- note` then `| string`), and an `&` line always is (`type T = A` then
  # `& B`). Only `LuauBlockBody` and `LuauFunctionParameters` include this
  # rule: in a narrative body a `|` line is an alternator arm and an `&` line
  # a statement. Types do not reach the runtime, so the lowerer skips the
  # line, and a declaration that ended before it takes the `= value` the line
  # ends with.
  #
  # The begin takes an `&` itself: a type that began at the `&` would begin
  # at the line's start, where `LUAU_TYPE_LINE_BREAK` ends it before it reads
  # anything. The type after the `&` is `LuauTypeLiteral`.
  #
  # lookaround: LuauComment and the enclosing body's declarations and
  # returns (LuauVariableDefinition, LuauReturnStatement) own a block
  # comment and the statement after it later on the line. No pattern of
  # this rule can close it before them, so its end carries the boundary
  # (§10.1), as LuauVariableDefinition's end does with the same variables.
  LuauTypeOperatorLineContinuation:
    begin: ^({{WS}}*)(?:([&])({{WS}}*)|(?=[|](?![|])))
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#LuauTypeIntersectionLineOperator" }
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauTypeBinaryOperation" }
      - { include: "#LuauAssignmentOperation" }
      - { include: "#LuauComment" }
      - { include: "#LuauTypeLiteral" }
    # It ends where its type does: at the line's end, at the start of the
    # next line of code that is not a `|` line (`LUAU_TYPE_LINE_BREAK`; the
    # begin has taken this line's own `&`, so a following `&` line is a
    # member line of its own, at any indentation), or at a comma or closing
    # bracket (`| string)` in a parameter list). It also ends, as
    # `LuauVariableDefinition` does, before a statement later on the line,
    # which Luau reads as the next statement: at whitespace before it
    # (`& number local a = 9`), at its keyword right after the type
    # (`& {}local a = 9`, `& {}return v`, `& {}function g() end`: any
    # reserved word that cannot start a type, as `LuauTypeAssignment` ends,
    # or, only after a type has ended, a declaration's stop word, some of
    # which are contextual and may name the member itself, as in
    # `& store`), and before a block comment that such a statement follows,
    # after the type (`& number --[[c]] local a`) or after the `= value` the
    # line ends with, which stays in it. A name glued to the type
    # (`& {}a = 9`) is read into it as a declaration's annotation reads it
    # (#2044); Luau's reading of the line still finds the statement there.
    end: (?={{BEAT}})|(?={{LUAU_TYPE_LINE_BREAK}}|$|[,;)\]}])|(?={{WS}}+{{LUAU_SHARED_DECLARATION_END_GUARD}})|(?={{LUAU_NON_TYPE_KEYWORDS}})|(?<={{LUAU_TYPE_END}})(?={{LUAU_DECLARATION_STOP}})|(?<={{LUAU_TYPE_END}}{{WS}}*)(?={{LUAU_BLOCK_COMMENT_ON_LINE}}{{LUAU_STATEMENT_CODE_AHEAD}})|{{LUAU_VALUE_COMMENT_BEFORE_STATEMENT}}

  # The `&` that begins an intersection member line. Its node tells the
  # lowerer the line is an intersection: Luau reports one that continues no
  # type itself, since it reads that `&` as the start of an expression.
  LuauTypeIntersectionLineOperator:
    tag: typeOperator
    name: keyword.operator.type.luau

  LuauIndexerLineContinuation:
    begin: ^({{WS}}*)(?={{LUAU_INDEXER_LINE_CONTINUATION}})
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauAccessPart" }
      - { include: "#LuauParenthetical" }
      - { include: "#LuauString" }
      - { include: "#LuauTable" }
      - { include: "#LuauArithmeticOperation" }
      - { include: "#LuauCompareOperation" }
      - { include: "#LuauConcatOperation" }
      - { include: "#LuauLogicalOperation" }
      - { include: "#LuauTypeCastOperation" }
    end: "(?={{BEAT}})|(?!{{WS}}*{{LUAU_SHARED_PATH_OR_CALL_CONTINUATION}})"

  LuauFunctionCall:
    begin: ({{LUAU_IDENTIFIER}})({{WS}}*)(?={{LUAU_FUNCTION_CALL_START}})
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauStdLibFunctions" }
          - { include: "#LuauFunctionName" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      # An explicit type instantiation before the arguments (`f<<T>>()`),
      # which `LUAU_FUNCTION_CALL_START` opens the call at.
      - { include: "#LuauGenericsInstantiation" }
      - { include: "#LuauFunctionCallParameters" }
      # Lua/Luau sugar: `f"..."`, `f'...'`, `f[[...]]`, `f{...}` are
      # function calls with a single string/table argument (equivalent
      # to `f("...")` / `f({...})`). Without these inclusions, the
      # function-call begin matches via `LUAU_FUNCTION_CALL_START` but
      # the body can't consume the argument, leaving the parser stuck
      # and desyncing the enclosing scope's `end`-matching.
      - { include: "#LuauString" }
      - { include: "#LuauTable" }
    applyEndPatternLast: true
    end: (?={{BEAT}})|(?=$|.)

  LuauFunctionCallParameters:
    tag: meta
    name: meta.parameter.luau
    brackets: true
    begin: ([(])
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationParenOpen" }
    patterns:
      - { include: "#LuauLineContinuation" }
      - { include: "#LuauIndexerLineContinuation" }
      - { include: "#LuauComment" }
      - { include: "#LuauExpression" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
      - { include: "#LuauUnreadToken" }
    end: (?={{NAMED_BEAT}})|([)])|(?={{WS}}*{{LUAU_NOT_PARENTHESIS_CLOSER}})
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationParenClose" }

  # A name in an access path. `end` and the other keywords that end a
  # path are not names: `LuauAccessPath` does not begin at one, and its end
  # stops before one, so the path never reaches this rule there.
  LuauVariable:
    match: ({{LUAU_IDENTIFIER}})
    captures:
      1:
        patterns:
          - { include: "#LuauSelfKeyword" }
          - { include: "#LuauStdLibConstants" }
          # `LuauStdLibGlobals` tags `_G` / `_VERSION` so they get
          # the `constant.language.luau` highlight even when used in
          # access-path context (e.g. as standalone `_VERSION` or
          # the receiver of a `_G.foo` access).
          - { include: "#LuauStdLibGlobals" }
          - { include: "#LuauVariableName" }

  LuauPropertyAccessor:
    match: ({{WS}}*)({{LUAU_ACCESSOR_OPERATOR}})({{WS}}*)({{LUAU_WORD}})
    captures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#LuauAccessorOperator" }
      3:
        patterns:
          - { include: "#ExtraWhitespace" }
      4:
        patterns:
          - { include: "#LuauStdLibMethods" }
          - { include: "#LuauPropertyName" }

  # A member access whose last `.` has no name after it on its line (`t.`,
  # `t.a.`), which Luau rejects. That `.` is read as its own token, so the
  # access path, its statement and the enclosing block end where they would
  # with the name in place, and the type checker or the validator reports it.
  #
  # It stands after any receiver an access part follows: a path, a call, an
  # indexer, a parenthesized value (`LuauChainedPropertyAccess`), a path after
  # a comment, a line that continues the one before it, and a path at the
  # start of a statement (`t.a. = 1`), so the enclosing function still ends
  # at its own `end` (#1156), as the `.` that ends a line in a Luau body that
  # is not a statement does (`Hello there.`, `Well, friend.`). A name directly after the `.` is the member, even a keyword
  # (`cfg.repeat`). After whitespace or block comments on the same line, a
  # reserved word is not a name (`if t.a. then`) and any other name is
  # (`t.a.--[[note]]b`); and `..` is the concatenation operator. A block
  # comment ends at its first closing bracket and at the end of its line, so
  # the lookahead never skips code between two comments
  # (`t.a.--[[a]] + --[[b]]c`) or reads a name on a later line as the member.
  # It is tried before `LuauPropertyAccessor`, which would take `. then` as a
  # member.
  LuauDanglingAccessor:
    match: ({{WS}}*)([.])(?![.]|{{LUAU_WORD}}|{{WS}}*{{_LUAU_DANGLING_ACCESSOR_COMMENT_}}*{{LUAU_UNRESERVED_IDENTIFIER}})
    captures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        tag: invalid
        name: invalid.illegal.luau

  LuauPropertyIndexer:
    brackets: true
    # A long-string opener belongs to call sugar, never to an indexer.
    begin: ({{WS}}*)({{LUAU_INDEXER_START}})
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#PunctuationBracketOpen" }
    patterns:
      - { include: "#LuauLineContinuation" }
      - { include: "#LuauIndexerLineContinuation" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#LuauExpression" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
      - { include: "#LuauUnreadToken" }
    end: (?={{NAMED_BEAT}})|(\])|(?={{WS}}*{{LUAU_NOT_SQUARE_BRACKET_CLOSER}})
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationBracketClose" }

  LuauParameterName:
    tag: function(variableName)
    name: variable.other.property.luau
    match: ({{LUAU_IDENTIFIER}})

  # A member's name, which may be a reserved word written directly after
  # its `.` (`LuauDanglingAccessor`): Luau reads that word as the name, in
  # error (`t.a.return`), so a closer there (`t.end`) closes nothing.
  LuauPropertyName:
    tag: propertyName
    name: variable.other.property.luau
    match: ({{LUAU_WORD}})

  LuauVariableName:
    tag: variableName
    name: variable.other.readwrite.luau
    match: ({{LUAU_IDENTIFIER}})

  # A define's key spelled as a reserved word (`LUAU_DEFINE_KEYWORD_KEY`),
  # read only in the capture of `LuauPropertyDefinition`'s begin that admits
  # it.
  LuauDefineKeywordKey:
    tag: variableName
    name: variable.other.readwrite.luau
    match: ({{LUAU_WORD}})

  LuauAccessorOperator:
    tag: separator
    name: meta.template.expression.accessor.sd
    match: ({{LUAU_ACCESSOR_OPERATOR}})

  # ----------------------------------------------------------------------------
  # Standard Library
  # ----------------------------------------------------------------------------

  LuauStdLibGlobals:
    tag: atom
    name: constant.language.luau
    match: ({{LUAU_STANDARD_LIB_GLOBALS}})\b

  LuauStdLibFunctions:
    tag: standard(function(name))
    name: support.function.luau
    match: ({{LUAU_STANDARD_LIB_FUNCTIONS}})

  LuauStdLibConstants:
    tag: standard(variableName)
    name: support.type.standard.sd
    match: ({{LUAU_STANDARD_LIB_CONSTANTS}})

  LuauStdLibMethods:
    tag: standard(function(name))
    name: support.function.luau
    match: ({{LUAU_META_METHODS}})

  # ----------------------------------------------------------------------------
  # Shebang
  # ----------------------------------------------------------------------------

  LuauShebang:
    match: ([#][!])(.*)$
    captures:
      1:
        patterns:
          - { include: "#LuauShebangPunctuation" }
      2:
        patterns:
          - { include: "#LuauShebangContent" }

  LuauShebangPunctuation:
    tag: punctuation
    name: punctuation.definition.comment.luau

  LuauShebangContent:
    tag: lineComment
    name: comment.line.shebang.luau

  # ----------------------------------------------------------------------------
  # Comments
  # ----------------------------------------------------------------------------

  LuauComment:
    patterns:
      - { include: "#LuauBlockComment" }
      - { include: "#LuauDocLineComment" }
      - { include: "#LuauLineComment" }

  LuauBlockComment:
    tag: blockComment
    name: comment.block.luau
    begin: ({{WS}}*)(--\[)([=]*)(\[)
    beginCaptures:
      1:
        patterns:
          - { include: "#Whitespace" }
      2:
        patterns:
          - { include: "#LuauCommentMark" }
      3:
        patterns:
          - { include: "#LuauCommentMark" }
      4:
        patterns:
          - { include: "#LuauCommentMark" }
    patterns:
      - { include: "#LuauDocCommentTags" }
      - { include: "#LuauBlockCommentContent" }
      - { include: "#Newline" }
    end: (\])(\3)(\])({{WS}}*)
    endCaptures:
      1:
        patterns:
          - { include: "#LuauCommentMark" }
      2:
        patterns:
          - { include: "#LuauCommentMark" }
      3:
        patterns:
          - { include: "#LuauCommentMark" }
      4:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  LuauBlockCommentContent:
    tag: definition(blockComment)
    name: punctuation.definition.comment.content.sd
    match: (.)

  LuauCommentMark:
    tag: comment
    name: comment.luau

  LuauDocLineComment:
    tag: docComment
    name: comment.line.double-dash.documentation.luau
    begin: ({{WS}}*)(---)
    beginCaptures:
      1:
        patterns:
          - { include: "#Whitespace" }
      2:
        patterns:
          - { include: "#LuauCommentMark" }
    patterns:
      - { include: "#LuauDocCommentTags" }
      - { include: "#LuauLineCommentContent" }
    end: (?={{BEAT}})|$

  LuauLineComment:
    tag: lineComment
    name: comment.line.double-dash.luau
    begin: ({{WS}}*)(--)
    beginCaptures:
      1:
        patterns:
          - { include: "#Whitespace" }
      2:
        patterns:
          - { include: "#LuauCommentMark" }
    patterns:
      - { include: "#LuauLineCommentContent" }
    end: (?={{BEAT}})|$

  LuauLineCommentContent:
    tag: definition(lineComment)
    name: punctuation.definition.comment.content.sd
    match: (.+?)(?=$)

  LuauDocCommentTags:
    patterns:
      - { include: "#LuauDocTagModifier" }
      - { include: "#LuauDocParamModifier" }

  LuauDocTagModifier:
    tag: annotation
    name: storage.type.class.luadoc.luau
    match: '@\w+'

  LuauDocParamModifier:
    match: ((?<=[\s*!/])[\\@]param)({{WS}}+)(\b\w+\b)
    captures:
      1:
        patterns:
          - { include: "#LuauDocTagAnnotation" }
      2:
        patterns:
          - { include: "#Whitespace" }
      3:
        patterns:
          - { include: "#LuauDocParamName" }

  LuauDocTagAnnotation:
    tag: annotation
    name: storage.type.class.luadoc.luau

  LuauDocParamName:
    tag: variableName
    name: variable.parameter.luau

  # ----------------------------------------------------------------------------
  # Literal Values
  # ----------------------------------------------------------------------------

  # ----------------------------------------------------------------------------
  # Number Values
  # ----------------------------------------------------------------------------

  # Note: `nan` and `inf` are ORDINARY IDENTIFIERS, not literals —
  # matching Luau, where `local nan = tonumber("nan")` declares a
  # plain variable (basic.luau line 201). They were briefly grammar
  # literals (LuauNaN / LuauInfinity), which hijacked any variable
  # named `nan`/`inf` into a constant node the lowerer didn't even
  # handle. Authors write `0/0` and `math.huge` (or `1/0`) for the
  # values.
  LuauNumber:
    patterns:
      - { include: "#LuauNumericHex" }
      - { include: "#LuauNumericBinary" }
      - { include: "#LuauNumericDecimal" }

  LuauNumericHex:
    match: (0_*[xX]_*[\da-fA-F_]*(?:[eE][\+\-]?_*\d[\d_]*(?:\.[\d_]*)?)?){{_LUAU_VALUE_OPERATOR_AHEAD_}}
    captures:
      1:
        tag: number
        name: constant.numeric.hex.luau
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  LuauNumericBinary:
    match: (0_*[bB][01_]+(?:[eE][\+\-]?_*\d[\d_]*(?:\.[\d_]*)?)?){{_LUAU_VALUE_OPERATOR_AHEAD_}}
    captures:
      1:
        tag: number
        name: constant.numeric.binary.luau
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  LuauNumericDecimal:
    match: ((?:\d[\d_]*(?:\.[\d_]*)?|\.\d[\d_]*)(?:[eE][\+\-]?_*\d[\d_]*(?:\.[\d_]*)?)?){{_LUAU_VALUE_OPERATOR_AHEAD_}}
    captures:
      1:
        tag: number
        name: constant.numeric.decimal.luau
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  # ----------------------------------------------------------------------------
  # String Values
  # ----------------------------------------------------------------------------

  LuauString:
    patterns:
      - { include: "#LuauDoubleQuotedString" }
      - { include: "#LuauSingleQuotedString" }
      - { include: "#LuauMultilineString" }
      - { include: "#LuauInterpolatedString" }

  # A quoted string ends at its line when its closing quote is not on it
  # (`$`), as Luau's lexer ends it, and the converter reports Luau's
  # malformed-string error at it, so the code after it on later lines (a
  # function's `end`) stays outside it. A line ends inside it only after a
  # `\` or a `\z` that carries it on (`LuauEscapeLine`).
  LuauDoubleQuotedString:
    tag: definition(string)
    name: string.quoted.double.luau
    begin: (["])
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationStringDoubleQuoteOpen" }
    patterns:
      - { include: "#LuauStringEscape" }
      - { include: "#LuauDoubleQuotedFunctionCallShorthand" }
      - { include: "#LuauDoubleQuotedStringInterpolation" }
      - { include: "#Color" }
      - { include: "#PlainText" }
    end: (["]){{_LUAU_SHARED_OPERATOR_AHEAD_}}|$
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationStringDoubleQuoteClose" }
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  LuauSingleQuotedString:
    tag: definition(string)
    name: string.quoted.single.luau
    begin: (['])
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationStringSingleQuoteOpen" }
    patterns:
      - { include: "#LuauStringEscape" }
      - { include: "#Color" }
      - { include: "#PlainText" }
    end: ([']){{_LUAU_SHARED_OPERATOR_AHEAD_}}|$
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationStringSingleQuoteClose" }
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  LuauMultilineString:
    tag: definition(string)
    name: string.other.multiline.luau
    begin: (\[)([=]*)(\[)
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationStringBracketQuoteOpen" }
      2:
        patterns:
          - { include: "#PunctuationStringEqualQuoteOpen" }
      3:
        patterns:
          - { include: "#PunctuationStringBracketQuoteOpen" }
    patterns:
      - { include: "#Color" }
      - { include: "#PlainText" }
      - { include: "#Newline" }
    end: (\])(\2)(\]){{_LUAU_BINARY_OPERATOR_AHEAD_}}
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationStringBracketQuoteClose" }
      2:
        patterns:
          - { include: "#PunctuationStringEqualQuoteClose" }
      3:
        patterns:
          - { include: "#PunctuationStringBracketQuoteClose" }
      4:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  LuauInterpolatedString:
    tag: definition(string)
    name: string.interpolated.luau
    begin: ([`])
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationStringBacktickQuoteOpen" }
    patterns:
      - { include: "#LuauBacktickFunctionCallShorthand" }
      - { include: "#LuauBacktickStringInterpolation" }
      - { include: "#LuauStringEscape" }
      - { include: "#Color" }
      - { include: "#PlainText" }
    # Like a quoted string, its text ends at its line when its closing
    # backtick is not on it (`$`). An interpolation may go on over lines, as
    # in Luau, and ends before a closer it did not open, where Luau's lexer
    # has stopped reading the string at a line it could not finish
    # (`` f(`a {b`) `` and then `end`). The string ends there too, before a
    # closer that begins the line, so the call and the function around it
    # take their own closers.
    end: ([`]){{_LUAU_BINARY_OPERATOR_AHEAD_}}|$|(?=^{{WS}}*{{LUAU_NOT_BRACE_CLOSER}})
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationStringBacktickQuoteClose" }
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  # A tag interpolation is an expression container, not an opaque string.
  LuauSparkdownExplicitInterpolatedStringExpression:
    tag: meta
    name: meta.template.expression.luau
    contentName: meta.embedded.line.luau
    brackets: true
    # lookaround: PunctuationBraceClose owns an empty pair; this interpolation requires expression content after its opener.
    begin: ([{])(?![}])
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationBraceOpen" }
    patterns:
      - { include: "#LuauSparkdownExplicitExpression" }
      - { include: "#ExtraWhitespace" }
    end: (?=$)|([}])|(?={{WS}}*[)\]])
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationBraceClose" }

  LuauInterpolatedStringExpression:
    tag: meta
    name: meta.template.expression.luau
    contentName: meta.embedded.line.luau
    brackets: true
    begin: ([{])(?![}])
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationBraceOpen" }
    patterns:
      - { include: "#LuauExpression" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: ([}])|(?={{WS}}*[)\]])
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationBraceClose" }

  LuauDoubleQuotedStringInterpolation:
    tag: meta
    name: meta.template.expression.luau
    contentName: meta.embedded.line.luau
    brackets: true
    begin: ([{])
    beginCaptures:
      "1":
        patterns:
          - include: "#PunctuationBraceOpen"
    patterns:
      - include: "#LuauExpression"
      - include: "#ExtraWhitespace"
      - include: "#Newline"
    # The `"` string around it ends at its line (`LuauDoubleQuotedString`),
    # which Luau does not read past, so the interpolation ends there too.
    end: ([}])|(?=["])|$|(?={{WS}}*[)\]])
    endCaptures:
      "1":
        patterns:
          - include: "#PunctuationBraceClose"

  LuauBacktickStringInterpolation:
    tag: meta
    name: meta.template.expression.luau
    contentName: meta.embedded.line.luau
    brackets: true
    begin: ([{])
    beginCaptures:
      "1":
        patterns:
          - include: "#PunctuationBraceOpen"
    patterns:
      - include: "#LuauExpression"
      - include: "#ExtraWhitespace"
      - include: "#Newline"
      - include: "#LuauUnreadToken"
    # It may go on over lines, as Luau's are, and ends before a closer it did
    # not open, where Luau's lexer has stopped reading the string around it
    # (see `LuauInterpolatedString`), or before a beat. A string its line
    # ends inside (`` `a {b`) ``) ends it too, taken into its end: Luau reads
    # nothing of the interpolation after it, so the interpolation does not
    # go on to the next line, and the converter reports Luau's error at it
    # (`Malformed interpolated string; did you forget to add a '}'?`). A
    # string finished on its line is an expression (`` `a {`b`} c` ``).
    end: ([}])|({{WS}}*)({{LUAU_UNFINISHED_LINE_STRING}})|(?={{WS}}*{{LUAU_NOT_BRACE_CLOSER}})|(?={{BEAT}})
    endCaptures:
      "1":
        patterns:
          - include: "#PunctuationBraceClose"
      "2":
        patterns:
          - include: "#ExtraWhitespace"
      "3":
        patterns:
          - include: "#LuauString"

  # `{{fn}}` / `{{fn(args)}}` — function-call shorthand (issue #223). Doubled
  # braces mean "call the named function and output its return value", in EVERY
  # interpolation context (display text, element content strings, field/prop
  # values, Luau interpolated strings) — one rule, no per-context exceptions.
  # Must be listed BEFORE the matching interpolation rule at every include site
  # so `{{` isn't taken as an interpolation opening at the first `{`. The two
  # opening braces are REQUIRED adjacent (`{ {tbl} }` with a space stays a
  # table interpolation). The body reuses #LuauExpression so `{{fn(a, b)}}`
  # tokenizes exactly like `{fn(a, b)}`; the LOWERER supplies the shorthand
  # semantics (a bare name is coerced to a call; a non-call body is the
  # "expected a function name" error — see lowerFunctionCallShorthand).
  LuauFunctionCallShorthand:
    tag: meta
    name: meta.template.expression.function-shorthand.luau
    contentName: meta.embedded.line.luau
    brackets: true
    begin: ([{])([{])
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationBraceOpen" }
      2:
        patterns:
          - { include: "#PunctuationBraceOpen" }
    patterns:
      - { include: "#LuauExpression" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: ([}])([}])?|(?={{WS}}*[)\]])
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationBraceClose" }
      2:
        patterns:
          - { include: "#PunctuationBraceClose" }

  # `{{fn}}` inside a `"..."` Luau string — string-bounded like
  # LuauDoubleQuotedStringInterpolation so an unterminated `{{` can't swallow
  # past the closing quote.
  LuauDoubleQuotedFunctionCallShorthand:
    tag: meta
    name: meta.template.expression.function-shorthand.luau
    contentName: meta.embedded.line.luau
    brackets: true
    begin: ([{])([{])
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationBraceOpen" }
      2:
        patterns:
          - { include: "#PunctuationBraceOpen" }
    patterns:
      - { include: "#LuauExpression" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: ([}])([}])?|(?=["])|$|(?={{WS}}*[)\]])
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationBraceClose" }
      2:
        patterns:
          - { include: "#PunctuationBraceClose" }

  # `{{fn}}` inside a backtick string — bounded as
  # LuauBacktickStringInterpolation is.
  LuauBacktickFunctionCallShorthand:
    tag: meta
    name: meta.template.expression.function-shorthand.luau
    contentName: meta.embedded.line.luau
    brackets: true
    begin: ([{])([{])
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationBraceOpen" }
      2:
        patterns:
          - { include: "#PunctuationBraceOpen" }
    patterns:
      - { include: "#LuauExpression" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
      - { include: "#LuauUnreadToken" }
    # Ends as `LuauBacktickStringInterpolation` does.
    end: ([}])([}])?|({{WS}}*)({{LUAU_UNFINISHED_LINE_STRING}})|(?={{WS}}*{{LUAU_NOT_BRACE_CLOSER}})|(?={{BEAT}})
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationBraceClose" }
      2:
        patterns:
          - { include: "#PunctuationBraceClose" }
      3:
        patterns:
          - { include: "#ExtraWhitespace" }
      4:
        patterns:
          - { include: "#LuauString" }

  LuauStringEscape:
    patterns:
      - { include: "#LuauEscapeLine" }
      - { include: "#LuauEscapeSkipWhitespace" }
      - { include: "#LuauEscapeStandard" }
      - { include: "#LuauEscapeDecimal" }
      - { include: "#LuauEscapeHex" }
      - { include: "#LuauEscapeUnicode" }
      - { include: "#LuauEscapeAny" }

  LuauEscapeStandard:
    tag: escape
    name: constant.character.escape.luau
    match: \\[abfnrtvz'"\{\\]

  LuauEscapeDecimal:
    tag: escape
    name: constant.character.escape.luau
    match: \\\d{1,3}

  LuauEscapeHex:
    tag: escape
    name: constant.character.escape.luau
    match: \\x[0-9a-fA-F]{2}

  LuauEscapeUnicode:
    tag: escape
    name: constant.character.escape.luau
    match: \\u\{[0-9a-fA-F]*\}

  # A `\` that ends its line carries a string on to the next line, as Luau's
  # lexer reads it. It takes the line break with it, so the string's end at
  # its line (`$`) is never met there, and it takes the next line's first
  # character as the string's text too, so the string never stands at the
  # start of that line, where a backtick string ends before a closer that
  # begins the line (`LuauInterpolatedString`): `` `a\ `` and then `end` is
  # text. A quote, an interpolation's `{` or another escape is left to the
  # string (`LUAU_STRING_UNCARRIED_CHARACTER`).
  LuauEscapeLine:
    begin: (\\)({{NL}}|$)
    beginCaptures:
      1:
        tag: escape
        name: constant.character.escape.luau
      2:
        patterns:
          - { include: "#Newline" }
    end: ({{LUAU_STRING_CARRIED_CHARACTER}})|(?={{LUAU_STRING_UNCARRIED_CHARACTER}})|$

  # A `\z` skips the whitespace after it, line breaks and blank lines
  # included, as Luau's lexer reads it, so the string goes on at the next
  # character that is not whitespace, which it takes as the string's text as
  # `LuauEscapeLine` does; while it is open the string's end at its line
  # (`$`) is not tried. The whitespace is the ASCII set Luau's lexer skips,
  # so a non-breaking space ends the run as it does in Luau. It is tried
  # before `LuauEscapeStandard`, which would read the `\z` alone.
  LuauEscapeSkipWhitespace:
    begin: (\\z)
    beginCaptures:
      1:
        tag: escape
        name: constant.character.escape.luau
    patterns:
      - { include: "#Newline" }
      - { include: "#LuauEscapeSkippedWhitespace" }
    end: ({{LUAU_STRING_CARRIED_TEXT_START}})|(?={{LUAU_STRING_UNCARRIED_CHARACTER}})

  # The whitespace a `\z` skips on a line.
  LuauEscapeSkippedWhitespace:
    match: "[ \\t\\v\\f]+"

  LuauEscapeAny:
    tag: escape
    name: constant.character.escape.luau
    match: \\.

  # ----------------------------------------------------------------------------
  # Constant Values
  # ----------------------------------------------------------------------------

  LuauBoolean:
    match: (true|false)\b{{_LUAU_SHARED_OPERATOR_AHEAD_}}
    captures:
      1:
        tag: bool
        name: constant.language.boolean.luau
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  # `nil` before a `:` is a value too (`while nil:do`), whose method access
  # Luau reports (#1350), as after any value Luau calls no method on.
  LuauNil:
    match: (nil)\b{{_LUAU_VALUE_OPERATOR_AHEAD_}}
    captures:
      1:
        tag: "null"
        name: constant.language.nil.luau
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  # ----------------------------------------------------------------------------
  # Table Value
  # ----------------------------------------------------------------------------

  LuauTable:
    brackets: true
    begin: ([{])
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationBraceOpen" }
    patterns:
      - { include: "#LuauLineContinuation" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#LuauSemicolonSeparator" }
      - { include: "#LuauTableIndexDeclaration" }
      - { include: "#LuauExpression" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
      - { include: "#LuauUnreadToken" }
    end: (?={{NAMED_BEAT}})|([}]){{_LUAU_VALUE_OPERATOR_AHEAD_}}|(?={{WS}}*{{LUAU_NOT_BRACE_CLOSER}})
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationBraceClose" }
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  LuauTableIndexDeclaration:
    brackets: true
    begin: (\[)
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationBracketOpen" }
    patterns:
      - { include: "#LuauLineContinuation" }
      - { include: "#LuauIndexerLineContinuation" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#LuauExpression" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
      - { include: "#LuauUnreadToken" }
    end: (?={{NAMED_BEAT}})|(\])|(?={{WS}}*{{LUAU_NOT_SQUARE_BRACKET_CLOSER}})
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationBracketClose" }

  # ----------------------------------------------------------------------------
  # Parenthetical Value
  # ----------------------------------------------------------------------------

  LuauParenthetical:
    brackets: true
    begin: ([(])
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationParenOpen" }
    patterns:
      - { include: "#LuauLineContinuation" }
      - { include: "#LuauIndexerLineContinuation" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#LuauExpression" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
      - { include: "#LuauUnreadToken" }
    end: (?={{NAMED_BEAT}})|([)]){{_LUAU_VALUE_OPERATOR_AHEAD_}}|(?={{WS}}*{{LUAU_NOT_PARENTHESIS_CLOSER}})
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationParenClose" }
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  # ----------------------------------------------------------------------------
  # Operations
  # ----------------------------------------------------------------------------

  # The whitespace before the operator is a separator, as after it, so a
  # bracketed table key keeps one space before its `=` (`{[k] = v}`).
  LuauAssignmentOperation:
    begin: ({{WS}}*)(?={{LUAU_ASSIGNMENT_OPERATORS}})
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauOperatorMissingOperand" }
      - { include: "#LuauAssignmentOperator" }
      - { include: "#LuauAssignmentLineBreak" }
      - { include: "#LuauValueTrailingBlockComment" }
      - { include: "#LuauComment" }
      - { include: "#LuauExpression" }
    # An assignment's value ends at its line's end; it only stands at the
    # start of a line when a value that spans lines, such as an unfinished if
    # expression, took the line break and ended there, which ends it too. It
    # also ends before a block comment with a statement after it. Right
    # after the operator, the line's end and any comments are
    # `LuauAssignmentLineBreak`'s, which carries the operation to its value
    # (#1247); the operation then ends at the first token of a later line,
    # so the statement around it decides whether that token is the value.
    end: (?={{BEAT}})|(?=^|{{WS}}|[,;)\]}])|{{LUAU_PAST_ASSIGNMENT_OPERATOR}}(?=$|{{LUAU_LINE_COMMENT_START}})|{{LUAU_AT_LATER_LINE_TOKEN}}|{{LUAU_VALUE_COMMENT_BEFORE_STATEMENT}}|(?={{LUAU_GLUED_KEYWORD}})

  # The `= value` of a narrative declaration or reassignment
  # (`LuauSparkdownVariableAssignment`, `LuauSparkdownReassignment`):
  # `LuauAssignmentOperation` without `LuauAssignmentLineBreak`, so a
  # narrative statement whose `=` has no value on its line ends there
  # (#1906), and with the bounded family's value, whose operations and if
  # expression arms end at the line too (#1907).
  # lookaround: `LuauAssignmentOperator`, the operation's first part, reads
  # the operator the begin looks for, as in `LuauAssignmentOperation`.
  LuauSparkdownAssignmentOperation:
    begin: ({{WS}}*)(?={{LUAU_ASSIGNMENT_OPERATORS}})
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauSparkdownExplicitOperatorMissingOperand" }
      - { include: "#LuauAssignmentOperator" }
      - { include: "#LuauValueTrailingBlockComment" }
      - { include: "#LuauComment" }
      - { include: "#LuauSparkdownExplicitExpression" }
    end: (?={{BEAT}})|(?=$|^|{{WS}}|[,;)\]}])|{{LUAU_VALUE_COMMENT_BEFORE_STATEMENT}}|(?={{LUAU_GLUED_KEYWORD}})
  # Block comments after the operator, when code follows them on the line,
  # are the operator's own (`local w = --[[ c ]] --[[ d ]] if c then`,
  # #1298): no value has begun while only comments separate the operator
  # from the next word, and a rule that ends at a comment's close before a
  # statement word (`LUAU_VALUE_COMMENT_BEFORE_STATEMENT`) would otherwise
  # end the assignment between two of them. Comments that end the line are
  # left to the operation, whose value then comes from a later line
  # (`LUAU_OPERATOR_COMMENTS_BEFORE_CODE`).
  LuauAssignmentOperator:
    begin: ({{WS}}*)({{LUAU_ASSIGNMENT_OPERATORS}})({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        tag: updateOperator
        name: keyword.operator.assignment.luau
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    # `ExtraWhitespace` (not `OptionalWhitespace`) here on purpose:
    # this rule's `patterns:` list is iterated by the parser inside
    # an open scope, and `OptionalWhitespace` (`{{WS}}*`) can match
    # zero chars — that wedges the loop with no progress and trips
    # the `Too many consecutive empty matches` warning. See GRAMMAR.md
    # §12 ("Switch rules can't include OptionalWhitespace") — same
    # constraint applies to a scoped rule's own patterns list.
    # The assignment operator does NOT span the line break. An empty
    # RHS (`name =` with nothing after `=` on the same line) leaves the
    # value empty and closes at end-of-line, so the next line's `end`
    # is seen fresh by the enclosing `define` block. Previously this
    # rule included `#Newline` to allow a bare `x =\n  rhs`
    # continuation; that let an empty RHS consume the line break and
    # park the cursor before `end`, which was then mis-read as the
    # property VALUE (`name = "end"`), so the `define` never closed
    # (ERROR_INCOMPLETE). No authored content uses bare `=`-then-
    # newline continuation — multi-line table/closure values always
    # open their `{`/`(` on the `=` line (e.g. `const X = {` … `}`),
    # which still parses because the operator never needs to cross a
    # newline there. Unlike the parallel binary-operator rules
    # (arithmetic/compare/concat/logical), an assignment operator can
    # only ever appear at statement start, so it never needs to absorb
    # a continuation that began on a previous line. See GRAMMAR.md
    # §11.5 corollary 2 ("`(?=$|{{WS}})` is a single-line bound").
    patterns:
      - { include: "#ExtraWhitespace" }
      - { include: "#LuauComment" }
    end: (?={{BEAT}})|(?=$|{{WS}}|[,;)\]}])|(?!{{WS}}|{{LUAU_OPERATOR_COMMENTS_BEFORE_CODE}})

  # An operator, or the `if` that starts an expression, with no operand
  # before a token that cannot start one (`local foo = -;`, `local x = ;`,
  # `local x = a and)`, `local x = if;`, `local y = 1 +` before `local` or
  # `end` on the next line), which Luau rejects. The value rules end before
  # it, so the operator is read as one token here, and the type checker or
  # the validator reports the token Luau finds instead (#1131, #1171).
  # `LuauAssignmentOperation` tries it before its own operator, so an empty
  # value is caught too. Line breaks and comments may stand between it and
  # that token (`local foo = -` then `;` on the next line,
  # `local foo = - --[[c]] ;`); they stay outside the token, so the statement
  # still ends at the line end and the comment is still read as one. An
  # operator whose operand starts the next line still continues onto it.
  # A divert's `->` is neither a `-` nor a `>` (`{a | -> end}`). An `if`
  # right before `then` begins an if expression with no condition, which
  # `LuauTernaryExpression` reads (`local a = if then 1 else 2`).
  LuauOperatorMissingOperand:
    tag: invalid
    name: invalid.illegal.luau
    match: "({{WS}}*)(?<![-])(?![-][>])({{LUAU_ASSIGNMENT_OPERATORS}}|{{LUAU_ARITHMETIC_OPERATORS}}|{{LUAU_COMPARE_OPERATORS}}|{{LUAU_CONCAT_OPERATOR}}|{{LUAU_TYPECAST_OPERATOR}}|{{LUAU_LENGTH_OPERATOR}}|(?<![\\w.]){{LUAU_SHARED_MISSING_OPERAND_WORDS}}(?!\\w))({{WS}}*)(?={{_LUAU_EXPRESSION_END_AHEAD_}})"

  # A type annotation `:` with no type before the `;`, `,` or `=` after it
  # (`local x: ;`, `local x: = 1`, `local a: , b`), read as one token as
  # `LuauOperatorMissingOperand` reads an operator. Luau words this one
  # differently, so it has its own rule. `LuauAccessPart` also reads it, after
  # a name (`t.a: = 2`). A `:` with nothing after it on its line takes its
  # type from the next line; this rule does not read that line, so a next
  # line that starts with a statement keyword or `end` leaves the type empty
  # for the converter to report (`local w:` then `local z = 1`, I-1453).
  # After an annotation's complete type, a `:` that a reserved word follows
  # is a method's (`local x: T:end`, `LUAU_TYPE_AFTER_COLON_BEHIND`), which
  # `LuauExpressionKeywordMethodAccessor`, tried next, reads (I-1447).
  # lookaround: `LuauExpressionKeywordMethodAccessor` reads the `:` after an annotation's complete type (`LUAU_METHOD_COLON_AFTER_TYPE_AHEAD`). The annotation's own `:` and this one both follow a name (`local x:end`, `local x: T:end`), and `LuauTypeAnnotationOperation`, whose begin reads nothing, holds no state that tells them apart, so no order of its patterns can; its end cannot either, since `LuauVariableAssignment` would begin another annotation at the `:`.
  LuauTypeAnnotationMissingType:
    tag: invalid
    name: invalid.illegal.luau
    match: ({{WS}}*)(?!{{LUAU_METHOD_COLON_AFTER_TYPE_AHEAD}})({{LUAU_TYPE_ANNOTATION_OPERATOR}})({{WS}}*)(?={{LUAU_TYPE_ANNOTATION_END_AHEAD}})

  # The same for a function's return type (`function g():` then `return 1`,
  # `function g(a: number): end`), which follows the parameter list's `)`.
  LuauFunctionReturnMissingType:
    tag: invalid
    name: invalid.illegal.luau
    match: (?<=[)]{{WS}}*)({{WS}}*)({{LUAU_TYPE_ANNOTATION_OPERATOR}})({{WS}}*)(?={{LUAU_TYPE_ANNOTATION_END_AHEAD}})

  # A `::` after a declaration's target (`local x :: number`), where a type
  # annotation takes a single `:`. Luau rejects it; without this token the
  # target reads as an expression and the `::` as a cast. It needs an
  # identifier right before it and no `=` between the scope modifier and
  # it on the same line, so a cast in a value (`local y = x :: number`) is
  # untouched, and a target on a continuation line is not seen. The type
  # after it is read as an annotation's type, so the declaration goes on
  # past it: a narrative one does not leave the type as a line of prose,
  # and the type is not read as another target before a comment. The type
  # takes in the line break after it, as any type does, so this rule also
  # ends at the start of the next line (`LUAU_TYPE_LINE_BREAK`), as
  # `LuauTypeAnnotationOperation` does.
  #
  # lookaround: the lookbehind is what tells a target from a value, so the
  # parents' begins cannot carry it. `LuauVariableDefinition` and
  # `LuauSparkdownVariableDefinition` read the values after the first one
  # with their own patterns, so in `local a, b = x :: number, y :: string`
  # the second `::` reaches this rule; without the lookbehind it reads that
  # value's cast, which `LuauTypeCastOperation` reads now (fixture
  # luau-declaration/cast-after-value-comma). The §10.1 alternatives do not
  # reach it: a target's `::` and a value's `::` are the same token at the
  # same level of the same list, so no order can pick between this rule and
  # the `LuauTypeCastOperation` in `LuauExpression` (tried first, it would
  # read `local x :: number` as a cast); splitting the list needs a scope
  # that holds the values after `=`, but the targets and values are
  # siblings in the declaration and the lowerer reads them as such (see
  # `LuauVariableAssignment`); and the declaration cannot end at its `=`,
  # since the values are inside it. Whether the `::` comes before the `=`
  # is history that only this lookbehind sees.
  LuauTargetTypeCast:
    # No lookaround inside the lookbehind: VS Code's Oniguruma refuses one
    # there ("invalid pattern in look-behind").
    begin: "(?<=\\b{{LUAU_SHARED_SCOPE_MODIFIER_WORD}}{{WS}}+[^=\\n\\r]*{{LUAU_NAME_BEHIND}}{{WS}}*)({{LUAU_TYPECAST_OPERATOR}})({{WS}}*)"
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauTargetTypeCastOperator" }
      2:
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauTypeLiteral" }
    end: (?={{BEAT}})|(?={{LUAU_TYPE_LINE_BREAK}}|$|{{LUAU_TYPE_WHITESPACE_END}}|[,;)\]}>=]|{{LUAU_NON_TYPE_KEYWORDS}})

  # The same `::`, right after a block comment that follows the target
  # (`local x --[[c]] :: number`), which `LuauTargetTypeCast`'s lookbehind
  # cannot see past. It is read inside `LuauVariableAssignment`, where the
  # comment was read and the whitespace after it taken in, so a `]` right
  # before the `::` is that comment's close (#1212).
  # The cast helper is code after a comment, not an opaque comment body.
  # lookaround: LuauVariableAssignment owns the binding; this recovery cast opens only after its comment's closing bracket.
  LuauSparkdownExplicitTargetTypeCastAfterComment:
    begin: (?<=\]{{WS}}*)({{LUAU_TYPECAST_OPERATOR}})({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauTargetTypeCastOperator" }
      2:
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauSparkdownExplicitTypeLiteral" }
    end: (?={{BEAT}})|(?={{LUAU_TYPE_LINE_BREAK}}|$|{{LUAU_TYPE_WHITESPACE_END}}|[,;)\]}>=])

  LuauTargetTypeCastAfterComment:
    begin: (?<=\]{{WS}}*)({{LUAU_TYPECAST_OPERATOR}})({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauTargetTypeCastOperator" }
      2:
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauTypeLiteral" }
    end: (?={{BEAT}})|(?={{LUAU_TYPE_LINE_BREAK}}|$|{{LUAU_TYPE_WHITESPACE_END}}|[,;)\]}>=])

  LuauTargetTypeCastOperator:
    tag: invalid
    name: invalid.illegal.luau
    match: {{LUAU_TYPECAST_OPERATOR}}

  LuauArithmeticOperation:
    begin: ({{WS}}*)(?={{LUAU_ARITHMETIC_OPERATORS}})
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauOperatorMissingOperand" }
      - { include: "#LuauArithmeticOperator" }
      - { include: "#LuauValueTrailingBlockComment" }
      - { include: "#LuauComment" }
      - { include: "#LuauExpression" }
    # It ends before a glued keyword, and before a `:` that a header's `do`
    # or `then` follows (`while not t: do`), which the expression or
    # condition around the operation reads (`LUAU_COLON_BEFORE_HEADER_END`).
    end: (?={{BEAT}})|(?=$|{{WS}}|[,;)\]}])|{{LUAU_VALUE_COMMENT_BEFORE_STATEMENT}}|(?={{LUAU_GLUED_KEYWORD}}|{{LUAU_COLON_BEFORE_HEADER_END}}|{{LUAU_COLON_BEFORE_LONG_COMMENT}})

  LuauArithmeticOperator:
    begin: ({{WS}}*)({{LUAU_ARITHMETIC_OPERATORS}})({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        tag: arithmeticOperator
        name: keyword.operator.arithmetic.luau
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    # `ExtraWhitespace` (not `OptionalWhitespace`) here on purpose:
    # this rule's `patterns:` list is iterated by the parser inside
    # an open scope, and `OptionalWhitespace` (`{{WS}}*`) can match
    # zero chars — that wedges the loop with no progress and trips
    # the `Too many consecutive empty matches` warning. See GRAMMAR.md
    # §12 ("Switch rules can't include OptionalWhitespace") — same
    # constraint applies to a scoped rule's own patterns list.
    patterns:
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}})|(?!$|{{WS}})

  LuauCompareOperation:
    begin: ({{WS}}*)(?={{LUAU_COMPARE_OPERATORS}})
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauOperatorMissingOperand" }
      - { include: "#LuauCompareOperator" }
      - { include: "#LuauValueTrailingBlockComment" }
      - { include: "#LuauComment" }
      - { include: "#LuauExpression" }
    # It ends before a glued keyword, and before a `:` that a header's `do`
    # or `then` follows (`while not t: do`), which the expression or
    # condition around the operation reads (`LUAU_COLON_BEFORE_HEADER_END`).
    end: (?={{BEAT}})|(?=$|{{WS}}|[,;)\]}])|{{LUAU_VALUE_COMMENT_BEFORE_STATEMENT}}|(?={{LUAU_GLUED_KEYWORD}}|{{LUAU_COLON_BEFORE_HEADER_END}}|{{LUAU_COLON_BEFORE_LONG_COMMENT}})

  LuauCompareOperator:
    begin: ({{WS}}*)({{LUAU_COMPARE_OPERATORS}})({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        tag: compareOperator
        name: keyword.operator.comparison.luau
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    # `ExtraWhitespace` (not `OptionalWhitespace`) here on purpose:
    # this rule's `patterns:` list is iterated by the parser inside
    # an open scope, and `OptionalWhitespace` (`{{WS}}*`) can match
    # zero chars — that wedges the loop with no progress and trips
    # the `Too many consecutive empty matches` warning. See GRAMMAR.md
    # §12 ("Switch rules can't include OptionalWhitespace") — same
    # constraint applies to a scoped rule's own patterns list.
    patterns:
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}})|(?!$|{{WS}})

  LuauConcatOperation:
    begin: ({{WS}}*)(?={{LUAU_CONCAT_OPERATOR}})
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauOperatorMissingOperand" }
      - { include: "#LuauConcatOperator" }
      - { include: "#LuauValueTrailingBlockComment" }
      - { include: "#LuauComment" }
      - { include: "#LuauExpression" }
    # It ends before a glued keyword, and before a `:` that a header's `do`
    # or `then` follows (`while not t: do`), which the expression or
    # condition around the operation reads (`LUAU_COLON_BEFORE_HEADER_END`).
    end: (?={{BEAT}})|(?=$|{{WS}}|[,;)\]}])|{{LUAU_VALUE_COMMENT_BEFORE_STATEMENT}}|(?={{LUAU_GLUED_KEYWORD}}|{{LUAU_COLON_BEFORE_HEADER_END}}|{{LUAU_COLON_BEFORE_LONG_COMMENT}})

  LuauConcatOperator:
    begin: ({{WS}}*)({{LUAU_CONCAT_OPERATOR}})({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        tag: special(operator)
        name: keyword.operator.concat.luau
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    # `ExtraWhitespace` (not `OptionalWhitespace`) here on purpose:
    # this rule's `patterns:` list is iterated by the parser inside
    # an open scope, and `OptionalWhitespace` (`{{WS}}*`) can match
    # zero chars — that wedges the loop with no progress and trips
    # the `Too many consecutive empty matches` warning. See GRAMMAR.md
    # §12 ("Switch rules can't include OptionalWhitespace") — same
    # constraint applies to a scoped rule's own patterns list.
    patterns:
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}})|(?!$|{{WS}})

  LuauLengthOperation:
    begin: ({{WS}}*)(?={{LUAU_LENGTH_OPERATOR}})
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauOperatorMissingOperand" }
      - { include: "#LuauLengthOperator" }
      - { include: "#LuauValueTrailingBlockComment" }
      - { include: "#LuauComment" }
      - { include: "#LuauExpression" }
    # It ends before a glued keyword, and before a `:` that a header's `do`
    # or `then` follows (`while not t: do`), which the expression or
    # condition around the operation reads (`LUAU_COLON_BEFORE_HEADER_END`).
    end: (?={{BEAT}})|(?=$|{{WS}}|[,;)\]}])|{{LUAU_VALUE_COMMENT_BEFORE_STATEMENT}}|(?={{LUAU_GLUED_KEYWORD}}|{{LUAU_COLON_BEFORE_HEADER_END}}|{{LUAU_COLON_BEFORE_LONG_COMMENT}})

  LuauLengthOperator:
    begin: ({{WS}}*)({{LUAU_LENGTH_OPERATOR}})({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        tag: special(operator)
        name: keyword.operator.length.luau
      3:
        # `#` is a prefix operator — no space between it and its
        # operand (`#myTable`, not `# myTable`). ExtraWhitespace
        # collapses any captured spaces to nothing.
        emit: true
        patterns:
          - { include: "#ExtraWhitespace" }
    # `ExtraWhitespace` (not `OptionalWhitespace`) here on purpose:
    # this rule's `patterns:` list is iterated by the parser inside
    # an open scope, and `OptionalWhitespace` (`{{WS}}*`) can match
    # zero chars — that wedges the loop with no progress and trips
    # the `Too many consecutive empty matches` warning. See GRAMMAR.md
    # §12 ("Switch rules can't include OptionalWhitespace") — same
    # constraint applies to a scoped rule's own patterns list.
    patterns:
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}})|(?!$|{{WS}})

  LuauLogicalOperation:
    begin: ({{WS}}*)(?={{LUAU_LOGICAL_KEYWORDS}})
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauOperatorMissingOperand" }
      - { include: "#LuauLogicalOperator" }
      - { include: "#LuauValueTrailingBlockComment" }
      - { include: "#LuauComment" }
      - { include: "#LuauExpression" }
    # It ends before a glued keyword, and before a `:` that a header's `do`
    # or `then` follows (`while not t: do`), which the expression or
    # condition around the operation reads (`LUAU_COLON_BEFORE_HEADER_END`).
    end: (?={{BEAT}})|(?=$|{{WS}}|[,;)\]}])|{{LUAU_VALUE_COMMENT_BEFORE_STATEMENT}}|(?={{LUAU_GLUED_KEYWORD}}|{{LUAU_COLON_BEFORE_HEADER_END}}|{{LUAU_COLON_BEFORE_LONG_COMMENT}})

  LuauLogicalOperator:
    begin: ({{WS}}*)({{LUAU_LOGICAL_KEYWORDS}})({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        tag: special(logicOperator)
        name: keyword.operator.logical.luau keyword.operator.wordlike.luau
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    # `ExtraWhitespace` (not `OptionalWhitespace`) here on purpose:
    # this rule's `patterns:` list is iterated by the parser inside
    # an open scope, and `OptionalWhitespace` (`{{WS}}*`) can match
    # zero chars — that wedges the loop with no progress and trips
    # the `Too many consecutive empty matches` warning. See GRAMMAR.md
    # §12 ("Switch rules can't include OptionalWhitespace") — same
    # constraint applies to a scoped rule's own patterns list.
    patterns:
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}})|(?!$|{{WS}})
  LuauTypeCastOperation:
    begin: ({{WS}}*)(?={{LUAU_TYPECAST_OPERATOR}})
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauOperatorMissingOperand" }
      - { include: "#LuauTypeCastOperator" }
      - { include: "#LuauTypeTrailingBlockComment" }
      - { include: "#LuauComment" }
      - { include: "#LuauTypeLiteral" }
    # A cast's type can be followed by a value operator. The type reader
    # takes its trailing whitespace, so close here even without whitespace
    # remaining; `->` and comments still belong to the type.
    # lookaround: LuauArithmeticOperation must claim `+`/`-` outside the
    # cast. Reordering or splitting the type's patterns cannot hand a token
    # back to its parent; this end carries that boundary. Tightening the
    # shared value-operator variable would break ordinary expressions.
    # Excluding `::` prevents closing before the cast operator is consumed;
    # `<` belongs to LuauTypeGenerics and `->` to LuauTypeBinaryOperation.
    # It ends where its type does before a `:` and a reserved word
    # (`t :: T:do`, `LUAU_COLON_BEFORE_RESERVED_WORD`), so the expression
    # reads them as a method access (I-1351).
    end: (?={{BEAT}})|(?={{LUAU_TYPE_LINE_BREAK}}|$|{{LUAU_TYPE_WHITESPACE_END}}|[,;)\]}>=]|{{LUAU_NON_TYPE_KEYWORDS}})|(?<={{LUAU_TYPE_END}}{{WS}}*)(?={{LUAU_VALUE_OPERATOR_AFTER_TYPE}}|{{LUAU_BLOCK_COMMENT_ON_LINE}}{{LUAU_TYPE_CODE_AHEAD}}|{{LUAU_COLON_BEFORE_RESERVED_WORD}})

  LuauTypeCastOperator:
    begin: ({{WS}}*)({{LUAU_TYPECAST_OPERATOR}})({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        tag: typeOperator
        name: keyword.operator.typecast.luau
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    # `ExtraWhitespace` (not `OptionalWhitespace`) here on purpose:
    # this rule's `patterns:` list is iterated by the parser inside
    # an open scope, and `OptionalWhitespace` (`{{WS}}*`) can match
    # zero chars — that wedges the loop with no progress and trips
    # the `Too many consecutive empty matches` warning. See GRAMMAR.md
    # §12 ("Switch rules can't include OptionalWhitespace") — same
    # constraint applies to a scoped rule's own patterns list.
    patterns:
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}})|(?!$|{{WS}})

  # ----------------------------------------------------------------------------
  # Syntax Punctuation
  # ----------------------------------------------------------------------------

  LuauCommaSeparator:
    match: ({{WS}}*)([,])({{WS}}*)
    captures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        tag: operator
        name: keyword.operator.comma.luau
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  # A comma followed by the end of its line or by a comment. Its
  # `LuauCommaLineBreakGap` consumes the comment and, when the comma ends its
  # line, the line break, any blank or comment-only lines and the next
  # line's indent, so the list continues on the next line (GRAMMAR.md
  # §11.5); the scope ends before the next token, which after a block
  # comment can be on the comma's own line (`1, --[[c]] 2`). Only
  # `LuauVariableDefinition` and `LuauReassignment` include it: a rule that
  # includes it elsewhere must teach its consumers this second comma name
  # beside `LuauCommaSeparator` (`isListCommaName`), and the value it can
  # hold (`commaLineBreakValue`).
  #
  # An `if` that starts an unindented line after the comma is an if
  # expression, the list's next value, as in Luau. The declaration cannot
  # read it: it ends at the start of a line, where a line break taken in by
  # a type leaves it (`local v: number` then an `if` statement). So this
  # scope reads it, and ends after it. The gap is a scope of its own so
  # that this one meets the end of a line only after that value.
  LuauCommaLineBreak:
    begin: ({{WS}}*)([,])({{WS}}*)(?=$|{{LUAU_COMMENT_START}})
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        tag: operator
        name: keyword.operator.comma.luau
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauCommaLineBreakGap" }
      - { include: "#LuauTernaryExpression" }
    end: (?={{BEAT}})|(?<!,{{WS}}*)(?!^if\b)

  # The line break after a declaration's target that ends its line
  # (`local x`, `LUAU_TARGET_LINE_BREAK_START`), which Luau reads on past:
  # a `:` that begins a later line is the target's annotation, so the
  # reserved word after it is no method's name (`local x` then `: end`, whose
  # `end` closes the block, I-1449). A line that begins with a `:` and a
  # reserved word is otherwise a continuation (`LUAU_LINE_START_KEYWORD_METHOD`),
  # and no rule at that line can see the target before it, so this scope
  # holds the declaration open across the line break, with the blank and
  # line-comment lines after it, and reads that line's `:` as the annotation
  # missing its type, as the body read it before. It ends at the start of
  # any other line (GRAMMAR.md §11.5, ending at the next line's start), where
  # the declaration ends too, and right after the annotation.
  LuauTargetLineBreak:
    begin: "{{LUAU_TARGET_LINE_BREAK_START}}"
    patterns:
      - { include: "#LuauTypeAnnotationOperation" }
      - { include: "#LuauComment" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: "{{LUAU_COLON_LINE_BREAK_END}}"

  # The line break after a function's parameter list that ends its line
  # (`function f()`, `LUAU_FUNCTION_HEADER_LINE_BREAK_START`), where a `:`
  # that begins a later line is the function's return type, as Luau reads it
  # (`local function f()` then `: end`, whose `end` closes the function,
  # I-1449). As `LuauTargetLineBreak` holds a declaration open, this holds
  # the header open across the line break, with the comments after the `)`
  # and the blank and line-comment lines after it, and reads such a line's
  # `:` as the type's colon with its type missing, as the body read it
  # before. `LuauFunctionBody` then opens at the start of the next line
  # (`LUAU_FUNCTION_BODY_AT_LINE_START`).
  LuauFunctionHeaderLineBreak:
    begin: "{{LUAU_FUNCTION_HEADER_LINE_BREAK_START}}"
    patterns:
      - { include: "#LuauTypeAnnotationOperation" }
      - { include: "#LuauComment" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: "{{LUAU_COLON_LINE_BREAK_END}}"

  # What stands between an assignment's operator and its value: comments,
  # line breaks and whitespace (`LuauCommaLineBreakGap`), from right after
  # the operator (an `=` that ends its line, or has a comment after it) to
  # the value's first token, on that line or a later one. A
  # `LuauAssignmentOperation` holds it, so the operation stays open, on any
  # line and in both engines' tokenizers, until its value begins: the
  # comments are read by `LuauComment`, never by a pattern that has to
  # decide where one ends. An `if` that begins a later line is the if
  # expression this scope reads (#1247), which `LuauIfBlock` would otherwise
  # take as a statement; before any other token it ends, and the operation
  # ends with it on a later line (`LUAU_AT_LATER_LINE_TOKEN`), where the
  # statement around it decides.
  # lookaround: it begins only right after the operator
  # (`LUAU_AFTER_ASSIGNMENT_OPERATOR`), where its end does not end it, and
  # the operation's `LuauComment` reads a comment anywhere else.
  LuauAssignmentLineBreak:
    begin: "{{LUAU_AFTER_ASSIGNMENT_OPERATOR}}(?=$|{{LUAU_COMMENT_START}})"
    patterns:
      - { include: "#LuauCommaLineBreakGap" }
      - { include: "#LuauTernaryExpression" }
    end: (?={{BEAT}})|{{LUAU_PAST_ASSIGNMENT_OPERATOR}}(?!{{LUAU_LINE_START_IF}})

  # The comments, line breaks and whitespace after a `LuauCommaLineBreak`'s
  # comma, up to the next token.
  LuauCommaLineBreakGap:
    begin: (?=$|{{LUAU_COMMENT_START}})
    patterns:
      - { include: "#LuauComment" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}})|(?!$|{{WS}}|{{LUAU_COMMENT_START}})

  LuauSemicolonSeparator:
    match: ({{WS}}*)([;])({{WS}}*)
    captures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        tag: operator
        name: keyword.operator.semicolon.luau
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  # ----------------------------------------------------------------------------
  # Types and Generics
  # ----------------------------------------------------------------------------
  LuauGenericsDeclaration:
    begin: ([<])
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationAngleOpen" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauTypeLiteral" }
      - { include: "#LuauTypeAssignmentOperator" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
      - { include: "#LuauUnreadToken" }
    # A type never holds a keyword that cannot begin one, so an unclosed
    # generic list ends before it, as `LuauTypeGenerics` does.
    end: ([>])|(?={{WS}}*{{LUAU_NON_TYPE_KEYWORDS}})|(?={{WS}}*{{LUAU_NOT_TYPE_GENERIC_CLOSER}})
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationAngleClose" }

  LuauGenericsInstantiation:
    begin: ([<][<])
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationDoubleAngleOpen" }
    patterns:
      - { include: "#LuauTypeArgumentContents" }
      - { include: "#LuauUnreadToken" }
    # A type never holds a keyword that cannot begin one, so an unclosed
    # instantiation ends before it, as `LuauTypeGenerics` does.
    end: ([>][>])|(?={{WS}}*{{LUAU_NON_TYPE_KEYWORDS}})|(?={{WS}}*{{LUAU_NOT_TYPE_GENERIC_CLOSER}})
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationDoubleAngleClose" }

  LuauFunctionTypeDeclaration:
    tag: meta
    name: meta.function.luau
    begin: "({{WS}}*){{_LUAU_SHARED_EXPORTED_TYPE_PREFIX_}}?(type)\\b({{WS}}*)(function)\\b({{WS}}*)"
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauExportModifier" }
      3:
        patterns:
          - { include: "#OptionalWhitespace" }
      4:
        patterns:
          - { include: "#LuauTypeKeyword" }
      5:
        patterns:
          - { include: "#OptionalWhitespace" }
      6:
        patterns:
          - { include: "#LuauFunctionKeyword" }
      7:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    # A type function is written as a function is: a header, then a body of
    # statements that ends at its own `end`. The body runs only while types
    # are checked, so the compiler emits nothing for the declaration.
    patterns:
      - { include: "#LuauFunctionBody" }
      - { include: "#LuauComment" }
      - { include: "#LuauGenericsDeclaration" }
      - { include: "#LuauFunctionReturnMissingType" }
      - { include: "#LuauFunctionReturnType" }
      - { include: "#LuauTypeFunctionName" }
      - { include: "#LuauFunctionParameters" }
      - { include: "#LuauBlockBody" }
      - { include: "#LuauStrayCloser" }
      - { include: "#LuauUnreadToken" }
    end: (?={{BEAT}})|({{WS}}*)(end)\b
    endCaptures:
      1:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauEndKeyword" }

  # lookaround: as in `LuauFunctionDeclarationName`, the lookbehind keeps the
  # name to `LuauFunctionTypeDeclaration`'s header. `LuauFunctionBody` cannot
  # open right after a header that has no parameter list yet, so without
  # the lookbehind a comment and a word after the name on its line
  # (`type function T --[[ c ]] q`, while the author is still typing) make
  # `q` a second name, ahead of `LuauBlockBody`, which reads it otherwise
  # (keywordLookbehinds.test.ts asserts the one name directly). Tried after
  # `LuauBlockBody`, the rule would never meet its name.
  # The lookbehind passes over block comments that close on the keyword's
  # line when the keyword begins its line (`LUAU_HEADER_COMMENTS`); the cost:
  # one that spans lines hides the name.
  LuauTypeFunctionName:
    match: (?<=\bfunction\b{{WS}}*|{{LUAU_HEADER_LINE_START}}function\b{{LUAU_HEADER_COMMENTS}})({{LUAU_IDENTIFIER}})\b({{WS}}*)
    captures:
      1:
        tag: typeName
        name: entity.name.type.luau
      2:
        patterns:
          - { include: "#ExtraWhitespace" }

  LuauDataTypeDeclaration:
    # Positive lookahead `(?={{WS}}+{{LUAU_IDENTIFIER}})` requires
    # `type` to be followed by whitespace + an identifier (the type
    # alias being defined — `type Foo = number`). Without this,
    # bare `type` in expression position (`type(type)`,
    # `local f = type`) is misparsed as the start of a type
    # declaration, leaving the actual stdlib reference unresolved.
    # A call (`type(x)`, `type "x"`, `type { x }`) has no name after
    # `type`, so it is never a declaration.
    begin: "({{WS}}*){{_LUAU_SHARED_EXPORTED_TYPE_PREFIX_}}?(type)\\b(?={{WS}}+{{LUAU_IDENTIFIER}})({{WS}}*)"
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauExportModifier" }
      3:
        patterns:
          - { include: "#OptionalWhitespace" }
      4:
        patterns:
          - { include: "#LuauTypeKeyword" }
      5:
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauTypeLiteral" }
      - { include: "#LuauTypeAssignment" }
    end: "(?={{BEAT}})|(?={{LUAU_TYPE_LINE_BREAK}}|{{WS}}*{{LUAU_SHARED_TYPE_DECLARATION_END}})"

  LuauTypeAssignment:
    begin: ([=])({{WS}}*)
    beginCaptures:
      1:
        tag: updateOperator
        name: keyword.operator.assignment.luau
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    # A `:` that `do`, `then` or a comment of level nine or more follows
    # after the alias's complete type, which the type ends before
    # (`type A = T:do`, `type A = T: --[=========[c]=========] end`), is a
    # method's, in error, as Luau reads it: no header holds an alias, so the
    # expression's accessor reads it and the word here (I-1447, I-1459).
    patterns:
      - { include: "#LuauTypeOperatorComments" }
      - { include: "#LuauComment" }
      - { include: "#LuauExpressionKeywordMethodAccessor" }
      - { include: "#LuauTypeLiteral" }
    end: (?={{BEAT}})|(?={{LUAU_TYPE_LINE_BREAK}}|$|{{LUAU_TYPE_WHITESPACE_END}}|[,;)\]}>=]|{{LUAU_NON_TYPE_KEYWORDS}})|(?<={{LUAU_TYPE_END}}{{WS}}*)(?={{LUAU_BLOCK_COMMENT_ON_LINE}}{{LUAU_TYPE_CODE_AHEAD}})

  LuauTypeAssignmentOperator:
    match: ([=])({{WS}}*)
    captures:
      1:
        tag: updateOperator
        name: keyword.operator.assignment.luau
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  LuauExportModifier:
    tag: modifier
    name: storage.modifier.visibility.luau

  LuauTypeKeyword:
    tag: definitionKeyword
    name: storage.type.luau

  # A type reference is `Name` or a module-qualified `Name.Name`, as in Luau,
  # which also allows whitespace around the `.`. Luau rejects any further
  # `.Name` segment; they are still read into the type, as
  # `LuauTypeNameExtraQualifier`, so the validator can report them and the
  # rest of the line stays inside the enclosing scope.
  LuauTypeName:
    match: (?:({{LUAU_IDENTIFIER}})({{LUAU_TYPE_QUALIFIER_DOT}}{{WS}}*))?({{LUAU_NAME_OR_CONSTANT}})({{LUAU_TYPE_QUALIFIED_NAME_SEGMENT}}+)?{{_LUAU_TYPE_OPERATOR_AHEAD_}}
    captures:
      1:
        patterns:
          - { include: "#LuauVariableName" }
      2:
        patterns:
          - { include: "#Whitespace" }
          - { include: "#LuauAccessorOperator" }
      3:
        tag: typeName
        name: entity.name.type.luau
      4:
        patterns:
          - { include: "#LuauTypeNameExtraQualifier" }
      5:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      6:
        patterns:
          - { include: "#ExtraWhitespace" }

  LuauTypeNameExtraQualifier:
    tag: invalid
    name: invalid.illegal.type-name-qualifier.luau
    match: (.+)

  # lookaround: `(?!{{LUAU_NON_TYPE_KEYWORDS}})` leaves a keyword that
  # cannot start a type (`end`, `do`, `then`) to the statement around the
  # type (`LuauFunctionReturnType` and `LuauTypeAssignment` end before one).
  # Removing it changes no fixture, but the bracketed types that include
  # this rule (`LuauTypeFunctionParameters`, `LuauTypeTableStruct`,
  # `LuauTypeGenerics`, `LuauTypeTableIndexer`) end only at their bracket,
  # so no end can stop before the keyword there: `type V = (end)` then
  # opens an empty type at `end`, and VS Code leaves every later line of
  # the file unhighlighted (the tree reads that line with `ERROR_INCOMPLETE`
  # either way). No rule reads the keyword as a type, so none can be
  # ordered first. Splitting the begin into a name opener and a punctuation
  # opener leaves the name opener needing the same exclusion, and a
  # type-name variable used only here would hold the lookahead without
  # replacing it.
  # A `:` right after a complete type that a reserved word no type can begin
  # follows begins no type either: the type ends before one
  # (`LUAU_TYPE_ENDS_BEFORE_RESERVED_WORD`), so a type opened there would end
  # where it began, again and again.
  LuauTypeLiteral:
    begin: "(?={{LUAU_SHARED_TYPE_KEYWORD_GUARD}}{{LUAU_NAME_OR_CONSTANT}}|[?]|[&]|[|]|[{]|[(]|[<]|[\"]|[']|[`]|[-][>]|(?!{{LUAU_TYPE_ENDS_BEFORE_RESERVED_WORD}})[:]|[.][.][.])"
    patterns:
      - { include: "#LuauTypeTrailingBlockComment" }
      - { include: "#LuauComment" }
      - { include: "#LuauTypeOptionalOperator" }
      - { include: "#LuauTypeStrayOptionalOperator" }
      # A single `:` that a reserved word follows on its line, or a comment
      # or the line's end, is a method's, whose name Luau reads in error,
      # so the word opens and closes no block. That holds after a complete
      # type (`t :: T:end`, `local x: {a: {b: T}}:end`, I-1447), which
      # never goes on at a `:`, and where a type must begin
      # (`t :: T | :end`, I-1450), where Luau first reports the missing type
      # at the `:`. The method accessors read the `:` and the name as a
      # path's do, tried before the stray-colon token, which reads any other
      # `:` and every `::`. A `:` that `do`, `then` or a comment of level
      # nine or more follows ends a complete type
      # (`LUAU_COLON_BEFORE_HEADER_END`, `LUAU_COLON_BEFORE_LONG_COMMENT`),
      # since a header may hold it, so the rule around decides; where a type
      # must begin, the stray-colon token reads it, as on base. After a complete type the expression's accessor
      # reads a reserved word no type can begin, as it did when the type
      # ended before it, so the validator leaves that name to the checker
      # as it does there (a define's method, `f(): T:end`).
      - { include: "#LuauExpressionKeywordMethodAccessor" }
      - { include: "#LuauKeywordMethodAccessor" }
      - { include: "#LuauNextLineMethodAccessor" }
      - { include: "#LuauTypeStrayColon" }
      - { include: "#LuauTypeBinaryOperation" }
      - { include: "#LuauTypeTableStruct" }
      - { include: "#LuauString" }
      - { include: "#LuauBoolean" }
      - { include: "#LuauTypeofFunction" }
      - { include: "#LuauVariadicType" }
      - { include: "#LuauVariadicTypePack" }
      - { include: "#LuauQualifiedTypeReference" }
      - { include: "#LuauNamedTypeReference" }
      - { include: "#LuauPrimitiveType" }
      - { include: "#LuauDivertTargetType" }
      - { include: "#LuauTypeFunctionParameters" }
      - { include: "#LuauTypeGenerics" }
      - { include: "#LuauTypeName" }
      # A type goes on across the line break (GRAMMAR.md §11.5): the
      # whitespace before it and the line break are the type's own, and
      # the next line either continues it with `|` or ends it at its start.
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    # Whitespace in the middle of a line ends the type, unless a type
    # operator has taken it in or the optional-type suffix follows it
    # (`number ?`); whitespace before the line break does not. It also ends
    # before a block comment on its line that code follows
    # (`function f(): number --[[c]] g()`, see `LUAU_BLOCK_COMMENT_ON_LINE`),
    # and before a keyword that cannot start a type. A value operator after
    # a complete type belongs outside it (notably after a `::` cast);
    # the function-type arrow and comments continue the type instead.
    # lookaround: the enclosing cast's end cannot close this nested scope.
    # Reordering/splitting these type patterns still leaves `+` unclaimed;
    # this type's own end must return it to LuauArithmeticOperation.
    # Tightening the shared value-operator variable would change values;
    # `<`, `->`, `::` and comments retain their existing type rules.
    # A complete type also ends before a `:` that `do` or `then` follows
    # (`while t :: T:do`, `LUAU_COLON_BEFORE_HEADER_END`), where a header
    # may read the `:` alone before its own keyword, or else the rule around
    # the type reads it as a method's (I-1351). Before any other reserved
    # word, and before a comment, the type reads the `:` itself as a
    # method's (`t :: T:end`, `local x: {a: number}:end`, I-1447): see the
    # accessors among its patterns.
    end: (?={{BEAT}})|(?=[,;)\]}>=]|{{LUAU_TYPE_LINE_BREAK}}|{{LUAU_NON_TYPE_KEYWORDS}})|(?<=\S)(?={{LUAU_TYPE_WHITESPACE_END}}{{WS}}*\S)|(?<={{LUAU_TYPE_END}}{{WS}}*)(?={{LUAU_VALUE_OPERATOR_AFTER_TYPE}}|{{LUAU_BLOCK_COMMENT_ON_LINE}}{{LUAU_TYPE_CODE_AHEAD}}|{{LUAU_COLON_BEFORE_HEADER_END}}|{{LUAU_COLON_BEFORE_LONG_COMMENT}})

  # A block comment right after a type that closes on a later line
  # (`local w: number --[[a` then `b]] print(1)`). No pattern on the
  # opening line can see what follows the close, so the type reads the
  # comment in, and the close decides: this rule ends as `LuauBlockComment`
  # does, but takes the whitespace after the close only when the type can go
  # on there (a type operator, the `?` suffix, what ends the type anyway, a
  # comment or the line's end). Before code it leaves that whitespace, so the
  # type, the rules around it and a declaration end there as they do after
  # `number print(1)`, and a return type's body opens there. Before code
  # right after the close (`b]]print(1)`) there is no whitespace to leave, so
  # it ends before its closing brackets instead: the type and every rule
  # around it end before a `]`, and the enclosing body or parameter list
  # reads the brackets as `LuauTypeTrailingBlockCommentClose`. A comment that
  # closes on its line is `LuauBlockComment`, which ends the type before it
  # when code follows (`LUAU_BLOCK_COMMENT_ON_LINE`). The opening line alone
  # cannot tell a comment after a type from one after an operator or a comma
  # on a later line, so only `LuauTypeLiteral`, which reads a comment only
  # after type text of its own, includes this rule.
  LuauTypeTrailingBlockComment:
    tag: blockComment
    name: comment.block.luau
    begin: (?<={{LUAU_TYPE_END}}{{WS}}*)(?!{{LUAU_BLOCK_COMMENT_ON_LINE}})({{WS}}*)(--\[)([=]*)(\[)
    beginCaptures:
      1:
        patterns:
          - { include: "#Whitespace" }
      2:
        patterns:
          - { include: "#LuauCommentMark" }
      3:
        patterns:
          - { include: "#LuauCommentMark" }
      4:
        patterns:
          - { include: "#LuauCommentMark" }
    patterns:
      - { include: "#LuauDocCommentTags" }
      - { include: "#LuauBlockCommentContent" }
      - { include: "#Newline" }
    end: (?=\]\3\]{{LUAU_TYPE_CODE_AHEAD}})|(\])(\3)(\])({{WS}}*(?!{{WS}})(?!{{LUAU_TYPE_CODE_AHEAD}})|)
    endCaptures:
      1:
        patterns:
          - { include: "#LuauCommentMark" }
      2:
        patterns:
          - { include: "#LuauCommentMark" }
      3:
        patterns:
          - { include: "#LuauCommentMark" }
      4:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  # A block comment after a value that closes on a later line (or on its
  # own line, at a level `LUAU_BLOCK_COMMENT_ON_LINE` does not spell out), read as
  # `LuauTypeTrailingBlockComment` reads one after a type: when a statement
  # follows the close (`local w = 5 --[[a` then `]] print(1)`), it leaves
  # the whitespace after the close, so the value, the rules around it and
  # the declaration or reassignment end there as they do after
  # `5 print(1)`; with no whitespace (`]]print(1)`) it ends before its
  # closing brackets, which the enclosing body reads as
  # `LuauTypeTrailingBlockCommentClose`. Anything else after the close (an
  # operator, a comma, a call's arguments after a name) keeps the value
  # going, and the comment takes the whitespace as `LuauBlockComment` does.
  # A statement beginning with `(` counts only after a value that cannot be
  # called (see `AFTER_LUAU_UNCALLABLE_VALUE`). The rules that end before a
  # comment on one line (`LUAU_VALUE_COMMENT_BEFORE_STATEMENT`) include this
  # one ahead of `LuauComment`.
  LuauValueTrailingBlockComment:
    patterns:
      - { include: "#LuauUncallableValueTrailingBlockComment" }
      - { include: "#LuauCallableValueTrailingBlockComment" }

  LuauUncallableValueTrailingBlockComment:
    tag: blockComment
    name: comment.block.luau
    begin: (?:{{AFTER_LUAU_UNCALLABLE_VALUE}})(?!{{LUAU_BLOCK_COMMENT_ON_LINE}})({{WS}}*)(--\[)([=]*)(\[)
    beginCaptures:
      1:
        patterns:
          - { include: "#Whitespace" }
      2:
        patterns:
          - { include: "#LuauCommentMark" }
      3:
        patterns:
          - { include: "#LuauCommentMark" }
      4:
        patterns:
          - { include: "#LuauCommentMark" }
    patterns:
      - { include: "#LuauDocCommentTags" }
      - { include: "#LuauBlockCommentContent" }
      - { include: "#Newline" }
    end: (?=\]\3\](?:{{LUAU_STATEMENT_CODE_AHEAD}}|[(]))|(\])(\3)(\])({{WS}}*(?!{{WS}})(?!{{LUAU_STATEMENT_CODE_AHEAD}}|[(])|)
    endCaptures:
      1:
        patterns:
          - { include: "#LuauCommentMark" }
      2:
        patterns:
          - { include: "#LuauCommentMark" }
      3:
        patterns:
          - { include: "#LuauCommentMark" }
      4:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  LuauCallableValueTrailingBlockComment:
    tag: blockComment
    name: comment.block.luau
    begin: (?:{{AFTER_LUAU_VALUE}})(?!{{LUAU_BLOCK_COMMENT_ON_LINE}})({{WS}}*)(--\[)([=]*)(\[)
    beginCaptures:
      1:
        patterns:
          - { include: "#Whitespace" }
      2:
        patterns:
          - { include: "#LuauCommentMark" }
      3:
        patterns:
          - { include: "#LuauCommentMark" }
      4:
        patterns:
          - { include: "#LuauCommentMark" }
    patterns:
      - { include: "#LuauDocCommentTags" }
      - { include: "#LuauBlockCommentContent" }
      - { include: "#Newline" }
    end: (?=\]\3\]{{LUAU_STATEMENT_CODE_AHEAD}})|(\])(\3)(\])({{WS}}*(?!{{WS}})(?!{{LUAU_STATEMENT_CODE_AHEAD}})|)
    endCaptures:
      1:
        patterns:
          - { include: "#LuauCommentMark" }
      2:
        patterns:
          - { include: "#LuauCommentMark" }
      3:
        patterns:
          - { include: "#LuauCommentMark" }
      4:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  # The closing brackets of a `LuauTypeTrailingBlockComment` that code
  # follows directly, which that rule leaves so the rules around the type
  # end before them (`b]]print(1)`). Only a statement body and a parameter
  # list, where those rules stop, include it, and only before code. No
  # pattern can see the comment's opening on an earlier line, so it also
  # matches brackets no comment opened (`]]print(1)` alone); the validator
  # reports those, as Luau does.
  LuauTypeTrailingBlockCommentClose:
    tag: blockComment
    name: comment.block.luau
    match: (\]=*\])(?={{LUAU_TYPE_CODE_AHEAD}})
    captures:
      1:
        patterns:
          - { include: "#LuauCommentMark" }

  # `->` as a type annotation marks the parameter as carrying a
  # divert-target value (sparkdown's analogue of ink's typed-divert
  # parameter `function f(-> target)`). The runtime ignores type
  # annotations and accepts any value as a divert-target if used as
  # one (validated by `tunnel-onwards-variable-target` in
  # `Diverts.test.ts`); this marker is purely declarative — it signals
  # author intent and gives the typechecker something to validate
  # against in the future. Example: `function cut_to(escape: ->) ... end`.
  LuauDivertTargetType:
    tag: standard(typeName)
    name: support.type.divert-target.sd
    match: ([-][>])

  # The suffix ends the type it follows, so it matches only after the end
  # of a type (a name, a closing bracket or quote, or another `?`). Luau
  # allows whitespace before it, and scripts formatted before #1065 contain
  # some, so it takes in that whitespace as extra whitespace the formatter
  # joins away (`number ?` becomes `number?`). The lookbehind also allows
  # whitespace, because a block comment between the type and the `?` has
  # already taken it in. It takes in the whitespace after it only when a
  # binary operator follows on the same line (`number? | string`,
  # `local u: number? = 1`), so it never takes in the next statement's
  # first word. Whether the next line continues the type is decided by
  # LuauTypeLiteral, as for any other type. The `>` of a function type's `->`
  # ends no type, so a `?` after it falls to the stray-operator rule; the
  # lookbehind spells that out as `[^-]>` because VS Code's regex engine
  # refuses a lookbehind nested in another.
  LuauTypeOptionalOperator:
    match: (?<={{LUAU_TYPE_END}}{{WS}}*)({{WS}}*)({{LUAU_TYPE_OPTIONAL_OPERATOR}})(?:({{WS}}*)(?={{LUAU_TYPE_BINARY_OPERATORS}}|{{LUAU_VALUE_BINARY_OPERATORS}}))?
    captures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        tag: typeOperator
        name: keyword.operator.type.luau
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }

  # A `?` with no type before it (`|?`, `= ?`, `: ?number`), which Luau
  # rejects. It is read as one token so the rest of the line still parses,
  # and the validator reports it.
  LuauTypeStrayOptionalOperator:
    tag: invalid
    name: invalid.illegal.luau
    match: ({{LUAU_TYPE_OPTIONAL_OPERATOR}})

  # Likewise a `:` or `::` where a type must begin (`local x: : number`,
  # `function f(): :: number`, `number | : string`, `{ a :: number }`),
  # which Luau rejects, read as one token so the type after it still parses,
  # with the whitespace after it, as an operator's. Where a `:` begins an
  # annotation (after a table field's name, or the first `:` of
  # `local x: : number`), the annotation's own rule reads it.
  LuauTypeStrayColon:
    match: ([:][:]?)({{WS}}*)
    captures:
      1:
        tag: invalid
        name: invalid.illegal.luau
      2:
        patterns:
          - { include: "#OptionalWhitespace" }

  # The whitespace before the operator is a separator, as after it, so a union
  # keeps one space on each side of its `|` wherever it is written
  # (`number | string`, `(number | string)`).
  LuauTypeBinaryOperation:
    begin: ({{WS}}*)(?={{LUAU_TYPE_BINARY_OPERATORS}})
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
    patterns:
      - { include: "#LuauTypeBinaryOperatorMissingType" }
      - { include: "#LuauTypeBinaryOperator" }
      - { include: "#LuauComment" }
      - { include: "#LuauTypeLiteral" }
    # lookaround: LuauArithmeticOperation must claim value operators after a
    # complete union, intersection or function return type. The nested type
    # has ended, but reordering its patterns or ending the enclosing cast
    # cannot close this intervening scope. Generic openers/arrows stay types.
    # It ends, as its operand type does, before a `:` that a reserved word no
    # type can begin follows (`t :: T | U:end`,
    # `LUAU_COLON_BEFORE_RESERVED_WORD`), for the same reason (I-1344).
    end: (?={{BEAT}})|(?={{LUAU_TYPE_LINE_BREAK}}|$|{{LUAU_TYPE_WHITESPACE_END}}|[,;)\]}>=]|{{LUAU_NON_TYPE_KEYWORDS}})|(?<={{LUAU_TYPE_END}}{{WS}}*)(?={{LUAU_VALUE_OPERATOR_AFTER_TYPE}}|{{LUAU_BLOCK_COMMENT_ON_LINE}}{{LUAU_TYPE_CODE_AHEAD}}|{{LUAU_COLON_BEFORE_RESERVED_WORD}})

  # A `|`, `&` or `->` with no type before the `;`, `,` or `=` after it
  # (`local m: number | = 1`), read as one token as
  # `LuauTypeAnnotationMissingType` reads a `:`. A `->` counts only after the
  # end of a type (`(number) -> = nil`): a bare `->` is the divert-target type
  # (`f(escape: ->, b)`).
  LuauTypeBinaryOperatorMissingType:
    tag: invalid
    name: invalid.illegal.luau
    match: ({{WS}}*)((?:[&]|[|])|(?<={{LUAU_TYPE_END}}{{WS}}*)[-][>])({{WS}}*)(?={{LUAU_TYPE_ANNOTATION_END_AHEAD}})

  LuauTypeBinaryOperator:
    begin: ({{WS}}*)({{LUAU_TYPE_BINARY_OPERATORS}})({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        tag: typeOperator
        name: keyword.operator.type.luau
      3:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
    # `ExtraWhitespace` (not `OptionalWhitespace`) here on purpose:
    # this rule's `patterns:` list is iterated by the parser inside
    # an open scope, and `OptionalWhitespace` (`{{WS}}*`) can match
    # zero chars — that wedges the loop with no progress and trips
    # the `Too many consecutive empty matches` warning. See GRAMMAR.md
    # §12 ("Switch rules can't include OptionalWhitespace") — same
    # constraint applies to a scoped rule's own patterns list.
    #
    # Comments after the operator are its own, since no type has begun
    # there (`LuauTypeOperatorComments`).
    patterns:
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
      - { include: "#LuauTypeOperatorComments" }
      - { include: "#LuauComment" }
    end: (?={{BEAT}})|(?!$|{{WS}}|{{LUAU_COMMENT_START}})

  # Block comments on the line after a type operator, and the generics of a
  # function type after them (`() -> --[[c]] <T>(T) -> T`, #1299). No type
  # has begun after the comments, so a `<` there opens generics; in the
  # rules around the operator, a `<` after a comment's close ends a complete
  # type as a comparison (`x :: {} --[[c]] < y`), so this rule reads the
  # generics before it ends and the type after them is the operator's
  # operand. The rules that hold a type after a `:` or `=` include it too
  # (`function(): --[[c]] <T>(T) -> T`, `type F = --[[c]] <T>(T) -> T`).
  # `LuauComment` reads each comment, so it closes at its own level
  # (`--[====[a]=====]b]====]` is one comment).
  # lookaround: the begin opens at a block comment only, where the parent's
  # LuauComment would read it; this rule is tried first so the comments and
  # the generics after them are read in one scope, which a match on the
  # comment alone cannot carry on to the generics.
  LuauTypeOperatorComments:
    begin: (?={{WS}}*{{LUAU_COMMENT_START}}\[=*\[)
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauTypeGenerics" }
    # lookaround: LuauTypeLiteral reads a type after the comments, and its
    # end, like LuauTypeBinaryOperation's, reads a `<` after a comment's
    # close as a comparison after a complete type. A lookbehind cannot see
    # past the comment to the operator, so this rule, which only the
    # operator reaches, takes the generics instead, and ends at anything
    # but another block comment or a `<`.
    end: (?={{BEAT}})|(?!{{WS}}*{{LUAU_BLOCK_COMMENT_OR_GENERICS_START}})

  LuauTypeAnnotationOperation:
    begin: ({{WS}}*)(?={{LUAU_TYPE_ANNOTATION_OPERATOR}})
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
    # A `:` that a reserved word follows after the annotation's complete
    # type is a method's, in error (`local x: T:end`, I-1447): Luau ends the
    # statement before it and reads the word as the name of a method called
    # on nothing, so the word opens and closes no block. The type reads that
    # `:` itself (`LuauTypeLiteral`), except before `do` or `then` or a
    # comment of level nine or more, where it ends so that a header can
    # decide. There the missing type's rule and the operator leave the `:`
    # after a complete type (`LUAU_METHOD_COLON_AFTER_TYPE_AHEAD`), and the
    # expression's accessor reads it and the word. At the annotation's own
    # `:` the missing type's rule or the operator reads it first.
    patterns:
      - { include: "#LuauTypeAnnotationMissingType" }
      - { include: "#LuauTypeAnnotationOperator" }
      - { include: "#LuauExpressionKeywordMethodAccessor" }
      - { include: "#LuauTypeOperatorComments" }
      - { include: "#LuauComment" }
      - { include: "#LuauTypeLiteral" }
    end: (?={{BEAT}})|(?={{LUAU_TYPE_LINE_BREAK}}|$|{{LUAU_TYPE_WHITESPACE_END}}|[,;)\]}>=]|{{LUAU_NON_TYPE_KEYWORDS}})|(?<={{LUAU_TYPE_END}}{{WS}}*)(?={{LUAU_BLOCK_COMMENT_ON_LINE}}{{LUAU_TYPE_CODE_AHEAD}})

  # lookaround: `LuauExpressionKeywordMethodAccessor` reads a `:` after the annotation's complete type that `do`, `then` or a comment of level nine or more follows (`LUAU_METHOD_COLON_AFTER_TYPE_AHEAD`, I-1447); the operator is tried before it, so that the accessor never takes the annotation's own `:`, and steps aside at that one `:`, which nothing but the text since the annotation's `:` tells from its own. The end's lookahead ends the operator at the type that follows it, past spaces and line breaks.
  LuauTypeAnnotationOperator:
    begin: ({{WS}}*)(?!{{LUAU_METHOD_COLON_AFTER_TYPE_AHEAD}})({{LUAU_TYPE_ANNOTATION_OPERATOR}})({{WS}}*)
    beginCaptures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        tag: typeOperator
        name: keyword.operator.type.luau
      3:
        # Prettier-style: one space after `:` in type annotations
        # (`c: companion`). OptionalWhitespace's zero-width match
        # still emits an empty node (see textmate-grammar-tree's
        # MatchRule), so the formatter's mid-line "separator"
        # dispatch fires and inserts the space.
        patterns:
          - { include: "#OptionalWhitespace" }
    # `ExtraWhitespace` (not `OptionalWhitespace`) here on purpose:
    # this rule's `patterns:` list is iterated by the parser inside
    # an open scope, and `OptionalWhitespace` (`{{WS}}*`) can match
    # zero chars — that wedges the loop with no progress and trips
    # the `Too many consecutive empty matches` warning. See GRAMMAR.md
    # §12 ("Switch rules can't include OptionalWhitespace") — same
    # constraint applies to a scoped rule's own patterns list.
    patterns:
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}})|(?!$|{{WS}})

  # `(?!{{LUAU_TYPE_QUALIFIER_DOT}})` leaves a module named like a primitive
  # (`string.Button`) to LuauTypeName.
  LuauPrimitiveType:
    match: ({{LUAU_PRIMITIVE_TYPES}})(?!{{LUAU_TYPE_QUALIFIER_DOT}}){{_LUAU_TYPE_OPERATOR_AHEAD_}}
    captures:
      1:
        tag: standard(typeName)
        name: support.type.primitive.luau
      2:
        patterns:
          - { include: "#OptionalWhitespace" }
      3:
        patterns:
          - { include: "#ExtraWhitespace" }

  LuauTypeofFunction:
    begin: (typeof|type)\b({{WS}}*)(?=[(])
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauTypeofFunctionName" }
      2:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauTypeofFunctionParameters" }
    applyEndPatternLast: true
    end: (?={{BEAT}})|(?=$|.)

  LuauTypeofFunctionParameters:
    brackets: true
    begin: ([(])
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationParenOpen" }
    patterns:
      - { include: "#LuauExpression" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
      - { include: "#LuauUnreadToken" }
    end: (?={{NAMED_BEAT}})|([)]){{_LUAU_TYPE_OPERATOR_AHEAD_}}|(?={{WS}}*{{LUAU_NOT_PARENTHESIS_CLOSER}})
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationParenClose" }
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      3:
        patterns:
          - { include: "#ExtraWhitespace" }

  LuauTypeofFunctionName:
    tag: function(typeName)
    name: support.function.luau

  # A name owns exactly one generic argument list, including all intervening
  # trivia. Its argument child consumes the final `>`, so after that
  # close a `<` is a comparison instead of a second argument list. Existing
  # name/primitive/comment tokens retain their captures and source locations.
  LuauNamedTypeReference:
    begin: ({{LUAU_NAME_OR_CONSTANT}}){{_LUAU_TYPE_OPERATOR_AHEAD_}}
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauPrimitiveType" }
          - { include: "#LuauTypeName" }
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      3:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauNamedTypeQualification" }
      - { include: "#LuauPrimitiveType" }
      - { include: "#LuauTypeName" }
      - { include: "#LuauTypeTrailingBlockComment" }
      - { include: "#LuauComment" }
      - { include: "#LuauNamedTypeArguments" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    # lookaround: LuauNamedTypeArguments owns the close; the reference must
    # end immediately when that child returns, before another `<` can open.
    # LuauComment owns trivia until an argument list or another token follows.
    end: (?={{BEAT}})|(?<=[>]{{WS}}*)|(?={{WS}}*{{LUAU_NAMED_TYPE_FOLLOW}})|(?<={{LUAU_TYPE_END}}{{WS}}*)(?={{LUAU_BLOCK_COMMENT_ON_LINE}}{{LUAU_TYPE_CODE_AHEAD}})

  LuauNamedTypeArguments:
    brackets: true
    begin: ([<])
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationAngleOpen" }
    patterns:
      - { include: "#LuauTypeArgumentContents" }
      - { include: "#LuauUnreadToken" }
    # lookaround: LuauReturnStatement must escape unfinished arguments before
    # indentation is consumed; splitting the argument contents cannot do so.
    end: (?={{BEAT}})|([>]){{_LUAU_TYPE_OPERATOR_AHEAD_}}|(?={{WS}}*{{LUAU_NON_TYPE_KEYWORDS}})|(?={{WS}}*{{LUAU_NOT_TYPE_GENERIC_CLOSER}})
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationAngleClose" }
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      3:
        patterns:
          - { include: "#ExtraWhitespace" }

  # Preserve contiguous qualified-name captures. A reference split by comments
  # retains its initial type-name token because a later line cannot recolor it.
  LuauQualifiedTypeReference:
    begin: ({{LUAU_IDENTIFIER}}{{LUAU_TYPE_QUALIFIED_NAME_SEGMENT}}+){{_LUAU_TYPE_OPERATOR_AHEAD_}}
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauTypeName" }
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      3:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauTypeTrailingBlockComment" }
      - { include: "#LuauComment" }
      - { include: "#LuauNamedTypeArguments" }
      - { include: "#LuauExtraTypeQualification" }
      - { include: "#LuauTypeNameExtraQualifierContinuation" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    # lookaround: LuauNamedTypeArguments consumes the close and its whitespace;
    # this wrapper must yield to LuauCompareOperation before a second `<`.
    # LuauTypeTrailingBlockComment owns comments while the type continues;
    # code after a completed type must return to its surrounding statement.
    end: (?={{BEAT}})|(?<=[>]{{WS}}*)|(?={{WS}}*{{LUAU_NAMED_TYPE_FOLLOW}})|(?<={{LUAU_TYPE_END}}{{WS}}*)(?={{LUAU_BLOCK_COMMENT_ON_LINE}}{{LUAU_TYPE_CODE_AHEAD}})

  LuauNamedTypeQualification:
    begin: ({{LUAU_TYPE_QUALIFICATION_OPEN}})
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauAccessorOperator" }
    patterns:
      - { include: "#LuauTypeTrailingBlockComment" }
      - { include: "#LuauComment" }
      - { include: "#LuauQualifiedTypeFinalName" }
      - { include: "#LuauNamedTypeArguments" }
      - { include: "#LuauExtraTypeQualification" }
      - { include: "#LuauTypeNameExtraQualifierContinuation" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    # lookaround: LuauNamedTypeArguments consumes the close; after it,
    # LuauCompareOperation owns another `<`. Before the qualified name is
    # read, LuauQualifiedTypeFinalName owns the identifier after dot trivia;
    # only a completed name may return another token to the statement.
    # A missing final name must also leave the type's closer to its parent.
    end: (?={{BEAT}})|(?<=[>]{{WS}}*)|(?<={{LUAU_NAME_BEHIND}}{{WS}}*)(?={{LUAU_NAMED_TYPE_FOLLOW}})|(?={{WS}}*{{LUAU_TYPE_QUALIFICATION_RECOVERY}})

  LuauQualifiedTypeFinalName:
    match: ({{LUAU_IDENTIFIER}}){{_LUAU_TYPE_OPERATOR_AHEAD_}}
    captures:
      1:
        tag: typeName
        name: entity.name.type.luau
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      3:
        patterns:
          - { include: "#ExtraWhitespace" }

  LuauExtraTypeQualification:
    match: ({{LUAU_TYPE_QUALIFIED_NAME_SEGMENT}}+)
    captures:
      1:
        patterns:
          - { include: "#LuauTypeNameExtraQualifier" }

  LuauTypeNameExtraQualifierContinuation:
    tag: invalid
    name: invalid.illegal.type-name-qualifier.luau
    begin: '{{LUAU_TYPE_QUALIFICATION_OPEN}}'
    patterns:
      - { include: "#LuauComment" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
    end: (?={{BEAT}})|(?={{WS}}*{{LUAU_TYPE_QUALIFICATION_RECOVERY}})|({{LUAU_IDENTIFIER}}{{LUAU_TYPE_QUALIFIED_NAME_SEGMENT}}*)

  LuauTypeArgumentContents:
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauVariadicType" }
      - { include: "#LuauTypeLiteral" }
      - { include: "#LuauTypeAssignmentOperator" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }

  LuauTypeGenerics:
    brackets: true
    begin: ([<])
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationAngleOpen" }
    patterns:
      - { include: "#LuauTypeArgumentContents" }
      - { include: "#LuauUnreadToken" }
    # lookaround: LuauReturnStatement must escape an unfinished generic type.
    # Splitting the type patterns cannot return indentation to its statement.
    end: (?={{NAMED_BEAT}})|([>]){{_LUAU_TYPE_OPERATOR_AHEAD_}}|(?={{WS}}*{{LUAU_NON_TYPE_KEYWORDS}})|(?={{WS}}*{{LUAU_NOT_TYPE_GENERIC_CLOSER}})
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationAngleClose" }
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      3:
        patterns:
          - { include: "#ExtraWhitespace" }

  LuauTypeTableStruct:
    brackets: true
    begin: ([{])
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationBraceOpen" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauTypeTableIndexer" }
      - { include: "#LuauTypeTableElementAccessModifier" }
      - { include: "#LuauTypeTableProperty" }
      - { include: "#LuauTypeAnnotationOperation" }
      - { include: "#LuauTypeLiteral" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#LuauSemicolonSeparator" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
      - { include: "#LuauUnreadToken" }
    # lookaround: LuauReturnStatement must escape an unfinished table type.
    # Splitting the type patterns cannot return indentation to its statement.
    end: (?={{NAMED_BEAT}})|([}]){{_LUAU_TYPE_OPERATOR_AHEAD_}}|(?={{WS}}*{{LUAU_NON_TYPE_KEYWORDS}})|(?={{WS}}*{{LUAU_NOT_TYPE_BRACE_CLOSER}})
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationBraceClose" }
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      3:
        patterns:
          - { include: "#ExtraWhitespace" }

  LuauTypeTableIndexer:
    brackets: true
    begin: (\[)
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationBracketOpen" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauTypeLiteral" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
      - { include: "#LuauUnreadToken" }
    # A type never holds a keyword that cannot begin one, so an unclosed
    # indexer ends before it, as `LuauTypeTableStruct` around it does.
    end: (?={{NAMED_BEAT}})|(\])|(?={{WS}}*{{LUAU_NON_TYPE_KEYWORDS}})|(?={{WS}}*{{LUAU_NOT_TYPE_SQUARE_BRACKET_CLOSER}})
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationBracketClose" }

  # The access modifier of an array element whose type is a qualified name
  # (`{ read types.Button }`). It comes before LuauTypeTableProperty, which
  # would otherwise take the modifier itself as a property name.
  LuauTypeTableElementAccessModifier:
    match: ({{LUAU_ACCESS_MODIFIERS}})\b({{WS}}+)(?={{LUAU_IDENTIFIER}}{{LUAU_TYPE_QUALIFIER_DOT}})
    captures:
      1:
        patterns:
          - { include: "#LuauAccessModifier" }
      2:
        patterns:
          - { include: "#Whitespace" }

  LuauTypeTableProperty:
    # lookaround: LuauTypeLiteral reads the same name as an array element's
    # type (`{ T }`, `{ types.Button }`, `{ Box<number> }`), and a property
    # is the name a `:` follows. Both begin with the name, so no order of
    # the struct's patterns tells them apart: LuauTypeLiteral first reads
    # every property name as a type. Splitting LuauTypeLiteral leaves the
    # name rule as the rival, this rule is a match with no `end:` to carry
    # the `:`, and LUAU_IDENTIFIER cannot be tightened by what follows it.
    match: (?:({{LUAU_ACCESS_MODIFIERS}})\b({{WS}}*))?({{LUAU_IDENTIFIER}})(?={{WS}}*[:])
    captures:
      1:
        patterns:
          - { include: "#LuauAccessModifier" }
      2:
        patterns:
          - { include: "#Whitespace" }
      3:
        patterns:
          - { include: "#LuauTypePropertyName" }

  LuauTypePropertyName:
    tag: propertyName
    name: variable.property.luau

  LuauTypeFunctionParameters:
    brackets: true
    begin: ([(])
    beginCaptures:
      1:
        patterns:
          - { include: "#PunctuationParenOpen" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauTypeNamedFunctionParameter" }
      - { include: "#LuauTypeLiteral" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
      - { include: "#LuauUnreadToken" }
    # lookaround: LuauReturnStatement and other statements must start outside
    # an unclosed type parameter list. Reordering its type patterns cannot
    # return already-consumed indentation; yield before that whitespace.
    end: (?={{NAMED_BEAT}})|([)]){{_LUAU_TYPE_OPERATOR_AHEAD_}}|(?={{WS}}*{{LUAU_NON_TYPE_KEYWORDS}})|(?={{WS}}*{{LUAU_NOT_TYPE_PARENTHESIS_CLOSER}})
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationParenClose" }
      2:
        emit: true
        patterns:
          - { include: "#OptionalWhitespace" }
      3:
        patterns:
          - { include: "#ExtraWhitespace" }

  LuauTypeNamedFunctionParameter:
    begin: ({{WS}}*)({{LUAU_IDENTIFIER}})({{WS}}*)(?=[:])
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
      2:
        patterns:
          - { include: "#LuauParameterName" }
    patterns:
      - { include: "#LuauTypeAnnotationOperation" }
    applyEndPatternLast: true
    end: (?=$|.)

  LuauTypeOperator:
    tag: typeOperator
    name: keyword.operator.type.luau

  # ----------------------------------------------------------------------------
  # Labels
  # ----------------------------------------------------------------------------

  LuauLabel:
    match: ({{WS}}*)([:][:])({{LUAU_IDENTIFIER}})([:][:])
    captures:
      1:
        patterns:
          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#LuauLabelOperator" }
      3:
        patterns:
          - { include: "#LuauLabelName" }
      4:
        patterns:
          - { include: "#LuauLabelOperator" }

  LuauLabelOperator:
    tag: operator
    name: keyword.operator.label.luau

  LuauLabelName:
    tag: labelName
    name: storage.type.attribute.luau
    match: ({{LUAU_IDENTIFIER}})

  # ----------------------------------------------------------------------------
  # Attributes
  # ----------------------------------------------------------------------------

  # A function's attribute (`@native`). The space after it is the
  # attribute's when another attribute or the function follows on the line
  # (`@native function`, `store f = @native function() ... end`), so a value
  # that ends at a space, an assignment's, reads on to the function.
  LuauAttribute:
    match: (@)({{LUAU_IDENTIFIER}}){{_LUAU_ATTRIBUTE_FOLLOWER_SPACE_}}
    captures:
      1:
        patterns:
          - { include: "#LuauAttributeOperator" }
      2:
        patterns:
          - { include: "#LuauAttributeName" }
      3:
        patterns:
          - { include: "#RequiredWhitespace" }

  # Luau's bracketed attribute list (`@[deprecated]`, `@[native, deprecated]`,
  # `@[deprecated{ reason = "x" }]`): names separated by commas, each with
  # the arguments Luau's parser reads after it, a table, a string or a
  # parenthesized list. Its names are highlighted as `@name`'s are; the
  # space after it is the list's as the space after `@name` is.
  LuauAttributeList:
    begin: (@)(\[)
    beginCaptures:
      1:
        patterns:
          - { include: "#LuauAttributeOperator" }
      2:
        patterns:
          - { include: "#PunctuationBracketOpen" }
    patterns:
      - { include: "#LuauComment" }
      - { include: "#LuauAttributeListName" }
      - { include: "#LuauTable" }
      - { include: "#LuauString" }
      - { include: "#LuauFunctionCallParameters" }
      - { include: "#LuauCommaSeparator" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
      - { include: "#LuauUnreadToken" }
    # Like every bracket, it ends before a closer it did not open (I-1318).
    end: (?={{BEAT}})|(\]){{_LUAU_ATTRIBUTE_FOLLOWER_SPACE_}}|(?={{WS}}*{{LUAU_NOT_SQUARE_BRACKET_CLOSER}})
    endCaptures:
      1:
        patterns:
          - { include: "#PunctuationBracketClose" }
      2:
        patterns:
          - { include: "#RequiredWhitespace" }

  LuauAttributeListName:
    tag: attributeName
    name: storage.type.attribute.luau
    match: ({{LUAU_IDENTIFIER}})

  # A function value with its attributes, read as one value as Luau reads
  # it, whatever trivia stands between them: comments on the line or on
  # lines between, line breaks, an attribute list that spans lines, and the
  # function on a later line at any indentation (`local f = @native`, or
  # `store f = @[native] --[[c]]`, then `function() ... end`), whatever
  # the list's arguments hold (a string with a `]`, a long string over
  # lines). A value ends at its line's end or at a space, so without this
  # it would end between them. Luau marks only functions with attributes,
  # so the rule opens before any attribute in a value's position. It ends
  # after the function's `end`, at any other token on a line (where Luau
  # reports the missing function), or at the start of a line that goes on
  # with no attribute, comment or function, where the value then ends too.
  # Attributes that begin their line are a function statement's, which a
  # body reads line by line.
  #
  # lookaround: LuauAttribute and LuauAttributeList read attributes
  # wherever they stand, and LuauAssignmentOperation's and
  # LuauVariableDefinition's ends close a value at a space or the line's
  # end. Those ends are tried before the value's patterns, so no order of
  # them reaches the function; the begin opens instead before an attribute
  # on a line that something comes before (a value's position), and the
  # rule holds the function itself, so no end of the value is tried
  # between them. Its end is LUAU_ATTRIBUTED_FUNCTION_END, shared with
  # LuauFunctionAttributes.
  LuauAttributedFunctionValue:
    begin: (?<=\S{{WS}}*)(?=@(?:{{LUAU_IDENTIFIER}}|\[))
    patterns:
      - { include: "#LuauAttributeLineComment" }
      - { include: "#LuauComment" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
      - { include: "#LuauAttributeList" }
      - { include: "#LuauAttribute" }
      - { include: "#LuauFunctionDefinition" }
    end: "{{LUAU_ATTRIBUTED_FUNCTION_END}}"

  # A line comment between attributes and their function, a documentation
  # comment included (`---@param x number`), read by its own rule and then
  # with the line break after it, so the position after it is the next
  # line's and LUAU_ATTRIBUTED_FUNCTION_END never sees its text end with the
  # word `end` (`@native -- the end`, `-- "--" end`).
  #
  # lookaround: LuauBlockComment owns a `--` that a long bracket's opening
  # follows (`--[[c]]`), which LuauComment then reads; LuauDocLineComment
  # and LuauLineComment own the comment itself, so the begin takes nothing.
  LuauAttributeLineComment:
    begin: (?={{WS}}*{{LUAU_LINE_COMMENT_START}})
    patterns:
      - { include: "#LuauDocLineComment" }
      - { include: "#LuauLineComment" }
    end: (?={{BEAT}})|({{NL}})
    endCaptures:
      1:
        patterns:
          - { include: "#Newline" }

  # A function statement and its attributes at the top level of a script,
  # read as one statement as Luau reads it. A top-level line that begins
  # with an attribute (`@native`, `@[deprecated]`) is Luau, wherever its
  # function stands: on the line, after comments, or on a later line at any
  # indentation, past line breaks and a list that spans lines (#921's open
  # question, decided for #1924). Story text may not begin with an
  # attribute. A line with no function after its attributes ends the rule
  # at its next token or line, where Luau reports the missing function.
  # An unspaced write (`@hud: text`) is not an attribute
  # (`LUAU_ATTRIBUTE_LINE_START`).
  LuauFunctionAttributes:
    begin: ({{WS}}*){{LUAU_ATTRIBUTE_LINE_START}}
    beginCaptures:
      1:
        patterns:
          - { include: "#ExtraWhitespace" }
    patterns:
      - { include: "#LuauAttributeLineComment" }
      - { include: "#LuauComment" }
      - { include: "#ExtraWhitespace" }
      - { include: "#Newline" }
      - { include: "#LuauAttributeList" }
      - { include: "#LuauAttribute" }
      - { include: "#LuauFunctionDefinition" }
    end: "{{LUAU_ATTRIBUTED_FUNCTION_END}}"

  LuauAttributeOperator:
    tag: operator
    name: keyword.operator.attribute.luau

  LuauAttributeName:
    tag: attributeName
    name: storage.type.attribute.luau

  SparkleRichTextTag:
    match: (</?)(font-weight|line-height|uppercase|lowercase|smallcaps|allcaps|voffset|noparse|cspace|indent|color|align|alpha|nobr|mark|size|sub|sup|br|b|i|u|s)(?:(=)("[^"\r\n]*"|[^>\r\n]*))?(>)
    captures:
      "1":
        tag: keyword
        name: punctuation.definition.tag.begin.sd
      "2":
        tag: keyword
        name: keyword.other.richtext.tag.sd
      "3":
        tag: updateOperator
        name: keyword.operator.assignment.sd
      "4":
        tag: string
        name: string.other.richtext.value.sd
        patterns:
          - include: "#Color"
      "5":
        tag: keyword
        name: punctuation.definition.tag.end.sd

  SparkleRichTextTagUnknown:
    match: (</?)([a-zA-Z][a-zA-Z0-9-]*)(?:(=)("[^"\r\n]*"|[^>\r\n]*))?(>)
    captures:
      "1":
        tag: invalid
        name: punctuation.definition.tag.begin.sd
      "2":
        tag: invalid
        name: invalid.illegal.richtext.tag.sd
      "3":
        tag: updateOperator
        name: keyword.operator.assignment.sd
      "4":
        tag: string
        name: string.other.richtext.value.sd
        patterns:
          - include: "#Color"
      "5":
        tag: invalid
        name: punctuation.definition.tag.end.sd

  LuauRegexLiteral:
    tag: regexp
    name: string.regexp.sd
    match: (@)([/])({{LUAU_REGEX_BODY}})([/])([dgimsuvy]*)
    captures:
      "1":
        tag: definition(string)
        name: punctuation.definition.string.begin.sd
      "2":
        tag: definition(string)
        name: punctuation.definition.string.begin.sd
      "3":
        tag: regexp
        name: string.regexp.sd
        patterns:
          - include: "#LuauRegexCharacterClass"
          - include: "#LuauRegexEscapedCharacterClass"
          - include: "#LuauRegexEscape"
          - include: "#LuauRegexAnchor"
          - include: "#LuauRegexQuantifier"
          - include: "#LuauRegexAlternation"
          - include: "#LuauRegexGroupBegin"
          - include: "#LuauRegexGroupEnd"
          - include: "#LuauRegexText"
      "4":
        tag: definition(string)
        name: punctuation.definition.string.end.sd
      "5":
        tag: modifier
        name: keyword.other.regexp.flags.sd

  LuauRegexEscape:
    tag: escape
    name: constant.character.escape.backslash.regexp.sd
    match: \\.

  LuauRegexCharacterClass:
    tag: bracket
    name: constant.other.character-class.set.regexp.sd
    begin: \[\^?
    beginCaptures:
      "0":
        tag: bracket
        name: punctuation.definition.character-class.regexp.sd
    patterns:
      - include: "#LuauRegexEscapedCharacterClass"
      - include: "#LuauRegexEscape"
      - include: "#LuauRegexClassDash"
      - include: "#LuauRegexText"
    end: \]
    endCaptures:
      "0":
        tag: bracket
        name: punctuation.definition.character-class.regexp.sd

  LuauRegexClassDash:
    tag: operator
    name: constant.other.character-class.range.regexp.sd
    match: "-"

  LuauRegexEscapedCharacterClass:
    tag: escape
    name: constant.other.character-class.regexp.sd
    match: \\[dDwWsShHvVnrtfv0]|\\[pP]\{[^}\r\n]*\}|\\u\{[0-9A-Fa-f]+\}|\\x[0-9A-Fa-f]{2}|\\[0-9]+|\.

  LuauRegexAnchor:
    tag: controlKeyword
    name: keyword.control.anchor.regexp.sd
    match: "[\\^$]|\\\\[bBAzZG]"

  LuauRegexQuantifier:
    tag: operator
    name: keyword.operator.quantifier.regexp.sd
    match: "[*+?]\\??|\\{[0-9]+(?:,[0-9]*)?\\}\\??"

  LuauRegexAlternation:
    tag: logicOperator
    name: keyword.operator.or.regexp.sd
    match: \|

  LuauRegexGroupBegin:
    tag: paren
    name: punctuation.definition.group.regexp.sd
    match: \((?:\?(?::|=|!|<=|<!|<[A-Za-z_][A-Za-z0-9_]*>|P<[A-Za-z_][A-Za-z0-9_]*>))?

  LuauRegexGroupEnd:
    tag: paren
    name: punctuation.definition.group.regexp.sd
    match: \)

  LuauRegexText:
    tag: regexp
    name: string.regexp.sd
    match: "[^\\\\\\[\\]()|*+?{}^$\\r\\n-]+|[\\s\\S]"

  LuauElementContentStringSingleQuoted:
    tag: string
    name: string.quoted.single.sd
    match: (['])({{SINGLE_QUOTED_CHAR}}*)(['])
    captures:
      "1":
        patterns:
          - include: "#PunctuationStringOpen"
      "2":
        patterns:
          - include: "#PlainStringContentSingleQuoted"
      "3":
        patterns:
          - include: "#PunctuationStringClose"

  PlainStringContentSingleQuoted:
    match: ({{SINGLE_QUOTED_CHAR}}*?)(?=$|')
    captures:
      "1":
        patterns:
          - include: "#StringEscape"
          - include: "#SparkleRichTextTag"
          - include: "#SparkleRichTextTagUnknown"
          - include: "#Color"
          - include: "#StringCharacter"
