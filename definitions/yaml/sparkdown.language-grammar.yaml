  # `UnquotedStringFieldValue`. Captures: 1 a literal, 2 and 3 the `--` or
  # `//` comment after it (no whitespace needed), 4 any other value, 5 the
  # `--` comment after that (whitespace needed, so `var(--x)` stays whole),
  # 6 the `//` comment after that (whitespace on both sides, so
  # `http://x.y/z` stays whole), 7 trailing whitespace. The literal branch is
  # tried first and holds only when the rest of the line is a comment;
  # otherwise the value is the shortest run of quoted strings
  # (`STRUCT_BLOCK_QUOTED`, read whole, so `"a -- b", serif` keeps its
  # quotes' contents) and other characters that the comment groups and the
  # line's end leave.
  _STRUCT_VALUE_THEN_COMMENT_: (?:{{_STRUCT_LITERAL_THEN_COMMENT_}}|{{_STRUCT_TEXT_THEN_COMMENT_}})({{WS}}*)$
  _STRUCT_LITERAL_THEN_COMMENT_: ({{STRUCT_BLOCK_LITERAL}})(?:({{STRUCT_LITERAL_DASH_COMMENT}})|({{STRUCT_LITERAL_SLASH_COMMENT}}))?
  _STRUCT_TEXT_THEN_COMMENT_: ({{STRUCT_VALUE_TEXT_PART}}+?)(?:({{STRUCT_TEXT_DASH_COMMENT}})|({{STRUCT_TEXT_SLASH_COMMENT}}))?
