  # long strings (`[[a{b}]]`), and it ends at whitespace, `;`, a `}`, or a
  # comma that ends the entry (`#gap=4, text` is two entries and a comma, as
  # in a struct block; `#font=a,b` keeps its comma). So a brace inside the
  # run, as in `#label=[[a{b}]]`, `#label='a{b}` or `@click=f--{x}`, is never
