          - { include: "#OptionalWhitespace" }
      2:
        patterns:
          - { include: "#DoneKeyword" }
      3:
        patterns:
          - { include: "#OptionalWhitespace" }

  FinStatement:
    match: ^({{WS}}*)(fin)({{EOK}})
