  LUAU_RETURN_END_KEYWORDS:
    - "end"
    - "else"
    - "elseif"
    - "until"
    - "local"
    - "return"
    - "break"
    - "do"
    - "while"
    - "repeat"
    - "for"
  SELECTOR_FUNCTION_NAMES: ["has", "not", "is", "where"]
  # Luau's reserved words, and `continue`, which Luau reads as a keyword at
  # the start of a statement and which this grammar makes a loop statement.
  LUAU_RESERVED_WORDS:
    [
      "and",
      "break",
      "continue",
      "do",
      "else",
      "elseif",
      "end",
      "false",
      "for",
      "function",
      "if",
      "in",
      "local",
      "nil",
      "not",
      "or",
      "repeat",
      "return",
      "then",
      "true",
      "until",
      "while",
    ]
  # The reserved words that cannot start a type: all but `nil`, `true` and
  # `false`, which are types, and `continue`, which Luau reads as a name
  # where a type stands. A type ends before one, so it never reads the next
  # statement's keyword or its block's `end`.
  LUAU_NON_TYPE_KEYWORDS:
    [
      "and",
      "break",
      "do",
      "else",
      "elseif",
      "end",
      "for",
      "function",
      "if",
      "in",
      "local",
      "not",
      "or",
      "repeat",
      "return",
      "then",
      "until",
      "while",
    ]
  # The reserved words that cannot start an expression: all but `nil`,
  # `true`, `false`, `not`, `function` and `if`, and `continue`, which Luau
  # reads as a name in an expression. An operand is missing before one, so
  # an operator at the end of its line leaves the next statement's keyword
  # or its block's `end` alone.
  LUAU_NON_EXPRESSION_KEYWORDS:
    [
      "and",
      "break",
      "do",
      "else",
      "elseif",
      "end",
      "for",
      "in",
      "local",
      "or",
      "repeat",
      "return",
      "then",
      "until",
      "while",
    ]
  LUAU_GLOBAL_DECLARATION_KEYWORDS: ["define"]
  # `type` is intentionally NOT included here. It IS a declaration
  # keyword for `type X = ...` type aliases (handled by the
  # `LuauDataTypeDeclaration` rule with a `(?!{{WS}}*[(])` lookahead),
  # but it's ALSO a Luau stdlib function (`type(x)` returns the
  # type-name string). Including it in `LUAU_LOCAL_DECLARATION_KEYWORDS`
  # would let `LUAU_TERMINATOR_KEYWORDS` reject `type` from
  # `LuauAccessPath`, killing the function-call path in expressions.
  # The disambiguation lives in `LuauDataTypeDeclaration`'s lookahead,
  # not here.
  LUAU_LOCAL_DECLARATION_KEYWORDS: ["local", "const", "function"]
  LUAU_PRIMITIVE_TYPES:
    [
      "nil",
      "string",
      "number",
      "boolean",
      "thread",
      "vector",
      "buffer",
      "unknown",
      "never",
      "any",
    ]
  LUAU_STANDARD_LIB_GLOBALS: ["_G", "_VERSION"]
  LUAU_STANDARD_LIB_CONSTANTS: [
      "bit32",
      "coroutine",
      "debug",
      "math",
      "os",
      "string",
      "table",
      "task",
      "utf8",
      "buffer",
      "vector",
      # Sparkdown-specific runtime-state namespaces (not in standard
      # Luau). `count.*` exposes ink narrative-flow builtins under
      # Luau-style names — `count.turns()`, `count.visits(-> target)`,
      # etc. — replacing ink's `TURNS()`, `READ_COUNT(...)`. The prefix
      # makes it clear these return *counts* rather than the things
      # themselves. Because `count` is registered as a stdlib namespace
      # it's also reserved as an identifier — users can't define a
      # variable named `count`, and syntax highlighting makes the
      # reserved status visible at the source level. `system.*` is
      # reserved for runtime config (currently just `lang.current`).
      "system",
      "count",
      "lang",
      "plural",
    ]
  LUAU_STANDARD_LIB_FUNCTIONS:
    [
      "assert",
      "collectgarbage",
      "error",
      "gcinfo",
      "getfenv",
      "getmetatable",
      "ipairs",
      "loadstring",
      "newproxy",
      "next",
      "pairs",
      "pcall",
      "print",
      "rawequal",
      "rawset",
      "require",
      "select",
      "setfenv",
      "setmetatable",
      "tonumber",
      "tostring",
      "type",
      "typeof",
      "unpack",
      "xpcall",
    ]
  LUAU_META_METHODS:
    [
      "__add",
      "__call",
      "__concat",
      "__div",
      "__eq",
      "__index",
      "__le",
      "__len",
      "__lt",
      "__metatable",
      "__mod",
      "__mode",
      "__mul",
      "__newindex",
      "__pow",
      "__sub",
      "__tostring",
