<!doctype html>
<html lang="en-US" class="theme-dark se-theme">

<head>
  <meta charset="utf-8" />
  <meta name="theme-color" content="" data-theme-colors='' />
  <script id="theme-pre-paint">
    (() => {
      let preference;
      try {
        preference = JSON.parse(localStorage.getItem("settings/preferences") || "{}").theme;
      } catch {}
      const theme = ["charcoal", "chalk", "midnight"].includes(preference)
        ? preference
        : matchMedia("(prefers-color-scheme: light)").matches ? "chalk" : "charcoal";
      document.documentElement.dataset.theme = theme;
      const meta = document.querySelector('meta[name="theme-color"]');
      try {
        meta.content = JSON.parse(meta.dataset.themeColors)[theme] || meta.content;
      } catch {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="An intuitive, text-based editor for creating interactive story games." />
  <title>Spark Engine</title>
  <link rel="preload" href="/fonts/courier-prime.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="/fonts/courier-prime-bold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="/fonts/courier-prime-italic.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="/fonts/courier-prime-bold-italic.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="/fonts/courier-prime-sans.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="/fonts/courier-prime-sans-bold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="/fonts/courier-prime-sans-italic.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="/fonts/courier-prime-sans-bold-italic.ttf" as="font" type="font/ttf" crossorigin>
  <style>
